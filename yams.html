<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yams – Feuille de score</title>
<style>
  :root{
    --bg:#f4f1ea; --paper:#ffffff; --ink:#22252b; --muted:#7a7f88;
    --line:#d3d6db; --grey:#bfbfbf; --accent:#1f6feb; --accent-soft:#e3edff;
    --hold:#e8590c; --hold-soft:#fff1e6; --ok:#2b8a3e; --zero:#c92a2a; --cpu:#7048e8; --cpu-soft:#efeaff;
  }
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px;
    display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:900px){.wrap{grid-template-columns:380px 1fr;align-items:start}}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .card{background:var(--paper);border-radius:14px;padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05)}
  .panel{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
  @media(min-width:900px){.panel{max-height:calc(100vh - 24px);overflow:auto;border-radius:14px}}
  .stack{display:flex;flex-direction:column;gap:14px}

  .turn{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .who{font-weight:800;font-size:19px}
  .who.cpu{color:var(--cpu)}
  .who.flash{animation:flash 1s}
  @keyframes flash{0%{color:var(--accent);transform:scale(1.15)}100%{transform:scale(1)}}
  .tag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 8px}

  .rolls{display:flex;gap:8px}
  .pill{flex:1;text-align:center;padding:7px 4px;border-radius:999px;border:1.5px solid var(--line);
    font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
  .pill.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.next{border-color:var(--accent);color:var(--accent)}

  .dice{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
  .die{width:58px;height:58px;border-radius:12px;background:#fff;border:2px solid #cfd3d9;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:8px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,background .15s;
    box-shadow:0 2px 0 #cfd3d9;user-select:none;-webkit-tap-highlight-color:transparent}
  .die:hover{transform:translateY(-2px)}
  .die.blank{background:#f1f3f5}
  .die.blank::before{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;color:#c4c9cf}
  .auto .die.blank::before{content:""}
  .die.locked{cursor:default}
  .die.locked:hover{transform:none}
  .die.held{border-color:var(--hold);background:var(--hold-soft);box-shadow:0 2px 0 var(--hold)}
  .die.held::after{content:"GARDÉ";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
    font-size:10px;font-weight:700;color:var(--hold);letter-spacing:.5px}
  .die.shake{animation:shake .45s}
  @keyframes shake{0%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(.95)}40%{transform:rotate(12deg)}
    60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0)}}
  .pip{width:10px;height:10px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
  .dice-gap{height:16px}
  .manual .dice-gap{height:0}

  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:10px;border:none;padding:11px 14px;font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--accent);color:#fff;flex:1}
  .confirm{background:var(--ok);color:#fff;flex:1}
  .ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
  .hint{font-size:13.5px;color:var(--muted);min-height:38px;line-height:1.4}
  .hint b{color:var(--ink)}
  .manual .auto-only, .auto .manual-only{display:none !important}
  .speed{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .speed button{padding:4px 10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;border-radius:8px}
  .speed button.on{background:var(--cpu);border-color:var(--cpu);color:#fff}

  table{width:100%;border-collapse:separate;border-spacing:3px;font-size:14px}
  #sheet{table-layout:fixed}
  #sheet th:first-child{width:196px}
  @media(max-width:600px){ #sheet th:first-child{width:168px} #sheet td.lbl{font-size:11px} }
  .pp{float:right;min-width:44px;text-align:center;font-size:11px;font-weight:700;border-radius:5px;padding:2px 4px;
    margin-left:4px;background:#eef0f3;color:#8a9099;letter-spacing:0}
  .pp.lo{margin-right:28px}
  .pp.g{background:#d3f9d8;color:#2b8a3e} .pp.m{background:#fff3bf;color:#a66a00} .pp.r{background:#ffe3e3;color:#c92a2a}
  .pp.ok{background:#2b8a3e;color:#fff}
  .sheet-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sheet-tools button{padding:4px 10px;font-size:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;border-radius:8px}
  .sheet-tools button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .audio{display:flex;gap:6px;align-items:center}
  .audio button{padding:5px 9px;font-size:15px;line-height:1;background:#fff;border:1.5px solid var(--line);border-radius:9px}
  .audio button.off{opacity:.45;text-decoration:line-through}
  .audio button.on{border-color:var(--accent);background:var(--accent-soft)}
  th{font-weight:600;color:#555;font-size:13px;padding:4px 2px;line-height:1.15;
    overflow-wrap:anywhere;vertical-align:bottom}
  th.cur{color:var(--accent);font-weight:800}
  th.cpu{color:var(--cpu)}
  th.cpu.cur{color:var(--cpu);text-decoration:underline;text-underline-offset:3px}
  .badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;background:var(--cpu);color:#fff;
    border-radius:4px;padding:1px 4px;margin-left:3px;vertical-align:middle}
  td.lbl{font-weight:700;font-size:12.5px;padding:0 6px;white-space:nowrap;letter-spacing:.2px}
  td.lbl .mini{display:inline-grid;grid-template-columns:repeat(3,4px);grid-template-rows:repeat(3,4px);gap:1px;
    width:22px;height:22px;padding:2px;border-radius:4px;background:#ccc;vertical-align:middle;margin-left:6px;float:right}
  td.lbl .mini i{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
  td.c{height:32px;min-width:48px;border:1px solid var(--line);border-radius:3px;text-align:center;
    font-weight:700;font-size:15px;background:#fff;transition:background .12s}
  td.c.cur{border-color:#9ec0f7}
  td.c.can{color:#9aa3ad;font-weight:600;font-style:italic}
  td.c.can.click{cursor:pointer}
  td.c.can.click:hover{background:var(--accent-soft)}
  td.c.can.zero{color:#e0a0a0}
  td.c.sel{background:var(--accent);color:#fff !important;font-style:normal;border-color:var(--accent)}
  td.c.sel.cpu{background:var(--cpu);border-color:var(--cpu)}
  td.c.z{color:var(--zero)}
  td.c.new{animation:pop .6s}
  @keyframes pop{0%{background:var(--accent-soft)}100%{background:#fff}}
  tr.tot td{background:var(--grey)}
  tr.tot td.lbl{background:var(--grey);font-weight:800;border-radius:3px;padding:7px 6px}
  tr.tot td.c{background:var(--grey);border-color:var(--grey)}
  tr.score td.lbl{font-size:16px;font-weight:900}
  tr.score td.c{height:40px;font-size:18px}
  td.c.bonusok{color:var(--ok)}
  .sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .sheet-head small{color:var(--muted)}

  .banner{display:none;background:#fff8db;border:1.5px solid #f2c94c;border-radius:12px;padding:12px;
    text-align:center;font-weight:700}
  .banner.show{display:block}

  /* probabilités */
  .prob{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .prob .ph{font-size:12.5px;color:var(--muted);line-height:1.4}
  .prob .ph b{color:var(--ink)}
  .prob table{border-spacing:0;font-size:12.5px}
  .prob th{font-size:11px !important;color:var(--muted);text-align:left;font-weight:700;padding:2px 4px;text-transform:uppercase;letter-spacing:.3px}
  .prob td{padding:4px;border-top:1px solid #eee;vertical-align:middle}
  .prob td.n{font-weight:700;white-space:nowrap}
  .prob td.n small{color:var(--muted);font-weight:500}
  .prob .bar{position:relative;min-width:70px;border-radius:5px;background:#eef0f3;overflow:hidden;font-weight:700;
    padding:2px 6px;text-align:right;white-space:nowrap}
  .prob .bar i{position:absolute;left:0;top:0;bottom:0;background:#b9d3fb;z-index:0}
  .prob .bar span{position:relative;z-index:1}
  .prob td.k{color:var(--muted);white-space:nowrap;font-size:12px}
  .prob td.k b{color:var(--hold);letter-spacing:1px}
  .prob .seg{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .prob .seg button{padding:4px 10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;border-radius:8px}
  .prob .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* écran de départ */
  .setup{position:fixed;inset:0;background:rgba(244,241,234,.97);display:none;align-items:flex-start;
    justify-content:center;z-index:8;overflow:auto;padding:30px 14px}
  .setup.show{display:flex}
  .setup .card{max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px}
  .setup h2{margin:0;font-size:24px}
  .setup h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;
    font-weight:400;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
  .mode strong{font-size:15px}
  .mode span{font-size:12.5px;color:var(--muted);line-height:1.35}
  .mode.on{border-color:var(--accent);background:var(--accent-soft)}
  .count{display:flex;gap:6px}
  .count button{flex:1;padding:9px 0;background:#fff;border:2px solid var(--line);color:var(--ink)}
  .count button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .plist{display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;align-items:center;gap:6px}
  .prow .num{width:22px;font-size:12px;color:var(--muted);font-weight:700}
  input{background:#fff;color:var(--ink)}
  .prow input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:#fff;font-weight:600;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  .prow.cpu input{background:var(--cpu-soft);border-color:#c5b5fb;color:var(--cpu)}
  .prow input:focus{outline:none;border-color:var(--accent)}
  .dicebtn{padding:7px 9px;background:#fff;border:1.5px solid var(--line);font-size:16px;line-height:1}
  .kind{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
  .kind button{border-radius:0;padding:7px 9px;background:#fff;color:var(--muted);font-weight:600;font-size:13px}
  .kind button.on.h{background:var(--accent);color:#fff}
  .kind button.on.c{background:var(--cpu);color:#fff}
  .small{font-size:12px;padding:5px 10px;text-transform:none;letter-spacing:0}
  .msg{font-size:12.5px;color:var(--muted);line-height:1.4}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:18px;max-width:320px;width:90%}
  .modal .box p{margin:0 0 14px}
  @media(max-width:420px){ .kind button{padding:7px 6px;font-size:12px} .die{width:52px;height:52px} }
</style>
</head>
<body class="auto">

<div class="setup" id="setup"><div class="card" id="setupCard"></div></div>

<div class="wrap">
  <div class="panel">
    <div class="card stack">
      <div class="turn">
        <h1>YAMS</h1>
        <div class="audio">
          <button id="sfxBtn" title="Effets sonores">🔊</button>
          <button id="musBtn" title="Musique d'ambiance">🎵</button>
        </div>
        <span class="tag" id="modeTag"></span>
      </div>
      <div class="who" id="who"></div>

      <div class="rolls auto-only">
        <div class="pill" id="p1">Lancer 1</div>
        <div class="pill" id="p2">Lancer 2</div>
        <div class="pill" id="p3">Lancer 3</div>
      </div>

      <div class="dice" id="dice"></div>
      <div class="dice-gap"></div>

      <div class="btns">
        <button class="primary auto-only" id="roll">🎲 Lancer les dés</button>
        <button class="ghost manual-only" id="clear" style="flex:1">Effacer les dés</button>
        <button class="confirm" id="validate" disabled>✔ Valider</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="speed" id="speed"></div>
      <div class="btns"><button class="ghost" id="probBtn" style="flex:1">📊 Afficher les probabilités</button></div>
      <div class="prob" id="prob" style="display:none"></div>
      <div class="banner" id="banner"></div>
      <div class="btns">
        <button class="primary" id="replay" style="display:none">Rejouer avec les mêmes joueurs</button>
        <button class="ghost" id="newgame" style="flex:1">Nouvelle partie</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sheet-head">
      <strong>Feuille de score</strong>
      <div class="sheet-tools">
        <small>Bonus +35 si total ≥ 63</small>
        <button id="ppBtn" title="Chance de réussir chaque combinaison avec les lancers restants">% affichés</button>
      </div>
    </div>
    <table id="sheet"></table>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <p id="modalText"></p>
    <div class="btns">
      <button class="ghost" id="mNo" style="flex:1">Annuler</button>
      <button class="primary" id="mYes">Confirmer</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXP = 6;
const UPPER = [
  {id:'as', label:'AS', face:1},{id:'deux', label:'DEUX', face:2},{id:'trois', label:'TROIS', face:3},
  {id:'quatre', label:'QUATRE', face:4},{id:'cinq', label:'CINQ', face:5},{id:'six', label:'SIX', face:6}
];
const LOWER = [
  {id:'brelan', label:'BRELAN'},{id:'carre', label:'CARRÉ'},{id:'full', label:'FULL'},
  {id:'ps', label:'PETITE SUITE'},{id:'gs', label:'GRANDE SUITE'},{id:'yams', label:"YAM'S"},
  {id:'chance', label:'CHANCE'}
];
const ALL = [...UPPER, ...LOWER];
const IDS = new Set(ALL.map(r=>r.id));
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const NAMES = ['Jo','Tim','Virg','Telio','Jacqueline','Alain','Ophélie','Toto','Nath','Sandra','Greg','Lucas',
  'Théo','Alizée','Manu','Léa','Sophie','Max','Nico','Julie','Seb','Chloé','Fred','Emma','Paulo','Mimi','Lulu','Pat'];
const CPU_NAMES = ['Bit-Bot','RAM-Bo','CPU-Dé','Octet','Giga-Byte','Pixel-9000','Algo-404','Binaire','Data-Dé',
  'Cyber-Yams','Proc-X','Wifi-Bot','USB-Max','Silicium','Turbo-RAM','Kilo-Octet','Firewall','Mega-Hertz','Robo-Code','Disque-Dur'];
const defNames = ()=>Array.from({length:MAXP},(_,i)=>`Joueur ${i+1}`);
const cleanName = s => String(s==null?'':s).replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,16);
const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function randomName(taken, cpu){
  const list = cpu ? CPU_NAMES : NAMES;
  const free = list.filter(n=>!taken.includes(n));
  const pool = free.length ? free : list;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------- stockage local (protégé) ---------- */
const KEY = 'yams-state-v3';
function load(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } }
function store(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }

/* ---------- état ---------- */
function fresh(cfg){
  return {started:false, mode:cfg.mode||'auto', nb:cfg.nb||2, names:cfg.names||defNames(),
    cpu:cfg.cpu||Array(MAXP).fill(false),
    cur:0, rolls:0, dice:[0,0,0,0,0], held:[false,false,false,false,false], sel:null,
    rid:0, shk:[], last:null, scores:Array.from({length:MAXP},()=>({}))};
}
function normalize(st){
  const s = {...fresh({}), ...st};
  while(s.scores.length<MAXP) s.scores.push({});
  if(!Array.isArray(s.cpu)) s.cpu = Array(MAXP).fill(false);
  if(!Array.isArray(s.names)) s.names = defNames();
  return s;
}
let S = fresh({});
const pname = p => cleanName(S.names[p]) || `Joueur ${p+1}`;
const isCPU = p => S.mode==='auto' && !!S.cpu[p];
function save(){ store(KEY, S); }

/* ---------- calcul des combinaisons ---------- */
function counts(d){ const c=[0,0,0,0,0,0,0]; d.forEach(v=>c[v]++); return c; }
function sum(d){ return d.reduce((a,b)=>a+b,0); }
function hasRun(c, len){
  let run=0;
  for(let v=1; v<=6; v++){ run = c[v] ? run+1 : 0; if(run>=len) return true; }
  return false;
}
function scoreFor(id, d){
  const c = counts(d), s = sum(d), mx = Math.max(...c.slice(1));
  const u = UPPER.find(x=>x.id===id);
  if(u) return c[u.face]*u.face;
  switch(id){
    case 'brelan': return mx>=3 ? s : 0;
    case 'carre':  return mx>=4 ? s : 0;
    case 'full':   return (c.includes(3) && c.includes(2)) ? 25 : 0;
    case 'ps':     return hasRun(c,4) ? 30 : 0;
    case 'gs':     return hasRun(c,5) ? 40 : 0;
    case 'yams':   return mx===5 ? 50 : 0;
    case 'chance': return s;
  }
  return 0;
}
function totals(p){
  const sc = S.scores[p];
  const upperFilled = UPPER.every(r=>sc[r.id]!=null);
  const t = UPPER.reduce((a,r)=>a+(sc[r.id]||0),0);
  const bonus = t>=63 ? 35 : (upperFilled ? 0 : null);
  const t1 = t + (bonus||0);
  const t2 = LOWER.reduce((a,r)=>a+(sc[r.id]||0),0);
  const any = ALL.some(r=>sc[r.id]!=null);
  return {t, bonus, t1, t2, score:t1+t2, any};
}
const playerDone = p => ALL.every(r=>S.scores[p][r.id]!=null);
function gameOver(){ if(!S.started) return false; for(let p=0;p<S.nb;p++) if(!playerDone(p)) return false; return true; }
const isAuto = () => S.mode==='auto';
const ready = () => S.started && !gameOver() && (isAuto() ? S.rolls>0 : S.dice.every(v=>v>0));
const canAct = () => S.started && !gameOver() && !isCPU(S.cur);

/* ---------- sons & musique (générés par le navigateur, aucun fichier) ---------- */
let sfxOn = load('yams-sfx'); if(sfxOn===null) sfxOn = true;
let musicOn = !!load('yams-music');
let AC = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
function audio(){
  if(!AC){
    try{
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
      AC = new C();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      sfxBus = AC.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
      // musique : léger écho pour l'ambiance
      musBus = AC.createGain(); musBus.gain.value = 0;
      const dry = AC.createGain(); dry.gain.value = 1;
      const delay = AC.createDelay(1); delay.delayTime.value = 0.39;
      const fb = AC.createGain(); fb.gain.value = 0.32;
      const wet = AC.createGain(); wet.gain.value = 0.28;
      musBus.connect(dry); dry.connect(master);
      musBus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
      noiseBuf = AC.createBuffer(1, AC.sampleRate*0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }catch(e){ AC = null; return null; }
  }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
function tone(freq, t, dur, {type='sine', vol=0.2, bus=sfxBus, attack=0.005, glide=null, filter=null}={}){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  let node = o;
  if(filter){ const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filter; o.connect(f); node=f; }
  node.connect(g); g.connect(bus);
  o.start(t); o.stop(t+dur+0.05);
}
function noise(t, dur, {freq=2500, q=3, vol=0.3, bus=sfxBus, type='bandpass'}={}){
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f); f.connect(g); g.connect(bus);
  src.start(t, Math.random()*0.3); src.stop(t+dur+0.02);
}
const sfx = {
  ok(){ return sfxOn && audio(); },
  roll(n){ // dés qui s'entrechoquent dans le gobelet puis roulent sur la table
    if(!this.ok()) return; const t0 = AC.currentTime;
    const hits = 6 + n*3;
    for(let i=0;i<hits;i++){
      const t = t0 + Math.pow(i/hits,1.3)*0.55 + Math.random()*0.03;
      const v = 0.35*(1-i/hits*0.7);
      noise(t, 0.035+Math.random()*0.03, {freq:1800+Math.random()*2800, q:4+Math.random()*4, vol:v});
      tone(500+Math.random()*700, t, 0.04, {type:'triangle', vol:v*0.25});
    }
  },
  tick(on){ if(!this.ok()) return; const t=AC.currentTime;
    noise(t, 0.03, {freq:on?3200:2000, q:8, vol:0.25}); tone(on?880:600, t, 0.06, {type:'triangle', vol:0.08}); },
  blip(){ if(!this.ok()) return; const t=AC.currentTime; tone(660, t, 0.09, {type:'sine', vol:0.12}); tone(990, t+0.05, 0.1, {type:'sine', vol:0.08}); },
  score(pts, id){
    if(!this.ok()) return; const t=AC.currentTime;
    if(pts===0){ tone(220, t, 0.35, {type:'triangle', vol:0.18, glide:110}); tone(165, t+0.12, 0.4, {type:'sine', vol:0.12, glide:90}); return; }
    if(id==='yams'){ // fanfare
      [72,76,79,84,79,84].forEach((m,i)=> tone(mtof(m), t+i*0.11, i===5?0.7:0.18, {type:'square', vol:0.07, filter:2600}));
      for(let i=0;i<10;i++) tone(mtof(96+Math.floor(Math.random()*8)), t+0.5+i*0.05, 0.15, {type:'sine', vol:0.05});
      return;
    }
    const big = pts>=25;
    const notes = big ? [67,71,74,79] : [72,76,79];
    notes.forEach((m,i)=> tone(mtof(m), t+i*0.07, 0.25, {type:'triangle', vol:big?0.14:0.11}));
  },
  win(){
    if(!this.ok()) return; const t=AC.currentTime;
    const mel = [[67,.15],[72,.15],[76,.15],[79,.3],[76,.15],[79,.6]];
    let k=0; mel.forEach(([m,d])=>{ tone(mtof(m), t+k, d+0.1, {type:'square', vol:0.07, filter:2400}); tone(mtof(m-12), t+k, d+0.1, {type:'triangle', vol:0.08}); k+=d; });
    [60,64,67,72].forEach(m=> tone(mtof(m), t+k, 1.4, {type:'triangle', vol:0.06, attack:0.02}));
  }
};

/* musique d'ambiance : boucle douce jazzy générée en direct (accords, basse, arpèges, charleston) */
const BPM = 78, BEAT = 60/BPM;
const PROG = [[48,64,67,71,74],[45,64,67,69,72],[50,65,69,72,76],[43,65,67,71,74],
              [48,64,67,71,76],[52,64,67,71,74],[41,64,69,72,76],[43,62,65,71,74]];
let musTimer = null, nextBeat = 0, beatN = 0;
function pad(notes, t, dur){
  notes.forEach(m=>{
    [0,6].forEach(det=>{
      const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
      o.type='triangle'; o.frequency.value=mtof(m); o.detune.value=det;
      f.type='lowpass'; f.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.022,t+0.9);
      g.gain.setValueAtTime(0.022,t+dur-0.6); g.gain.linearRampToValueAtTime(0.0001,t+dur+0.4);
      o.connect(f); f.connect(g); g.connect(musBus); o.start(t); o.stop(t+dur+0.5);
    });
  });
}
function playBeat(n, t){
  const ch = PROG[Math.floor(n/4)%PROG.length], beat = n%4;
  if(beat===0){ pad(ch.slice(1), t, BEAT*4); tone(mtof(ch[0]-12), t, BEAT*1.9, {type:'sine', vol:0.22, bus:musBus, attack:0.02}); }
  if(beat===2) tone(mtof(ch[0]-12+(Math.random()<0.5?7:12)), t, BEAT*1.4, {type:'sine', vol:0.16, bus:musBus, attack:0.02});
  for(let e=0;e<2;e++){
    if(Math.random()<0.5){
      const m = ch[1+Math.floor(Math.random()*4)]+12;
      const tt = t + e*BEAT/2 + (e?0.06:0); // léger swing
      tone(mtof(m), tt, 0.7, {type:'sine', vol:0.045, bus:musBus, attack:0.004});
    }
  }
  noise(t+BEAT/2+0.06, 0.05, {freq:8000, q:1, vol:0.035, bus:musBus, type:'highpass'});
  if(beat===1||beat===3) noise(t, 0.12, {freq:1800, q:0.8, vol:0.03, bus:musBus});
}
function schedule(){ while(nextBeat < AC.currentTime+0.6){ playBeat(beatN, nextBeat); nextBeat += BEAT; beatN++; } }
function startMusic(){
  if(!musicOn || musTimer || !audio()) return;
  musBus.gain.cancelScheduledValues(AC.currentTime);
  musBus.gain.setTargetAtTime(0.9, AC.currentTime, 1.2);
  nextBeat = AC.currentTime + 0.15; musTimer = setInterval(schedule, 150); schedule();
}
function stopMusic(){
  if(musTimer){ clearInterval(musTimer); musTimer = null; }
  if(AC && musBus){ musBus.gain.cancelScheduledValues(AC.currentTime); musBus.gain.setTargetAtTime(0, AC.currentTime, 0.3); }
}
function renderAudio(){
  const a=$('sfxBtn'), m=$('musBtn');
  a.textContent = sfxOn ? '🔊' : '🔇'; a.className = sfxOn ? 'on' : 'off';
  a.title = sfxOn ? 'Couper les effets sonores' : 'Activer les effets sonores';
  m.className = musicOn ? 'on' : 'off';
  m.title = musicOn ? 'Couper la musique' : 'Lancer la musique d\'ambiance';
}
$('sfxBtn').onclick = ()=>{ sfxOn=!sfxOn; store('yams-sfx', sfxOn); renderAudio(); if(sfxOn) sfx.blip(); };
$('musBtn').onclick = ()=>{ musicOn=!musicOn; store('yams-music', musicOn); renderAudio(); musicOn ? startMusic() : stopMusic(); };
// le navigateur n'autorise le son qu'après un premier clic
document.addEventListener('pointerdown', ()=>{ audio(); if(musicOn) startMusic(); });
renderAudio();

/* ---------- actions ---------- */
function act(t, x={}){ if(canAct()) apply(t, x); }
function apply(t, x){
  if(!S.started || gameOver()) return;
  switch(t){
    case 'roll': {
      if(!isAuto() || S.rolls>=3) return;
      if(S.rolls>0 && S.held.every(Boolean)) return;
      const idx = [];
      S.dice = S.dice.map((v,i)=>{ if(S.held[i] && S.rolls>0) return v; idx.push(i); return 1+Math.floor(Math.random()*6); });
      S.rolls++; S.sel=null; S.rid++; S.shk=idx;
      sfx.roll(idx.length);
      break;
    }
    case 'hold': {
      const i = x.i|0;
      if(!isAuto() || S.rolls===0 || S.rolls>=3 || i<0 || i>4) return;
      S.held[i] = !S.held[i]; sfx.tick(S.held[i]); break;
    }
    case 'setheld':
      if(!isAuto() || S.rolls===0 || S.rolls>=3) return;
      S.held = x.held.slice(0,5).map(Boolean); sfx.tick(true); break;
    case 'set': {
      const i = x.i|0;
      if(isAuto() || i<0 || i>4) return;
      S.dice[i] = S.dice[i]%6 + 1; S.sel=null; sfx.tick(true); break;
    }
    case 'type': {
      const i = S.dice.indexOf(0), v = x.v|0;
      if(isAuto() || i<0 || v<1 || v>6) return;
      S.dice[i]=v; S.sel=null; sfx.tick(true); break;
    }
    case 'back': {
      if(isAuto()) return;
      let i = S.dice.indexOf(0); i = i<0 ? 4 : i-1; if(i<0) return;
      S.dice[i]=0; S.sel=null; break;
    }
    case 'clear':
      if(isAuto()) return;
      S.dice=[0,0,0,0,0]; S.sel=null; break;
    case 'sel':
      if(!ready() || !IDS.has(x.id) || S.scores[S.cur][x.id]!=null) return;
      S.sel = (S.sel===x.id && !x.force) ? null : x.id;
      if(S.sel) sfx.blip();
      if(!x.go) break;
      // double-clic : on enchaîne sur la validation
    case 'val':
      if(!S.sel || !ready()) return;
      const pts = scoreFor(S.sel, S.dice), wasId = S.sel;
      S.scores[S.cur][S.sel] = pts;
      S.last = {p:S.cur, id:S.sel};
      if(gameOver()) sfx.win(); else sfx.score(pts, wasId);
      S.rolls=0; S.dice=[0,0,0,0,0]; S.held=[false,false,false,false,false]; S.sel=null; S.shk=[];
      for(let k=1;k<=S.nb;k++){ const n=(S.cur+k)%S.nb; if(!playerDone(n)){ S.cur=n; break; } }
      break;
    default: return;
  }
  commit();
}
function commit(){ save(); renderAll(); scheduleAI(); }

/* ---------- probabilités (calcul exact) ----------
   Un ensemble de dés est codé par ses effectifs : clé = Σ effectif(face) × 6^(face-1).
   Pour chaque ligne, on calcule la meilleure stratégie de dés à garder
   (programmation dynamique sur les 252 combinaisons possibles de 5 dés). */
const P6 = [1,6,36,216,1296,7776];
const FACT = [1,1,2,6,24,120];
const keyOf = d => d.reduce((k,v)=> v ? k+P6[v-1] : k, 0);
const cntOf = k => { const c=[0]; for(let i=0;i<6;i++) c.push(Math.floor(k/P6[i])%6); return c; };
function multisets(n){
  const out=[];
  (function rec(face,left,key){
    if(face===6){ out.push(key+left*P6[5]); return; }
    for(let j=0;j<=left;j++) rec(face+1,left-j,key+j*P6[face-1]);
  })(1,n,0);
  return out;
}
let PROB = null;
function buildProb(){
  const keeps=[], size=[], idx=new Int16Array(46656).fill(-1);
  for(let n=0;n<=5;n++) for(const k of multisets(n)){ idx[k]=keeps.length; keeps.push(k); size.push(n); }
  const roll = [0,1,2,3,4,5].map(n=> multisets(n).map(k=>{
    const c=cntOf(k); let w=FACT[n]; for(let i=1;i<=6;i++) w/=FACT[c[i]]; return [k, w/Math.pow(6,n)];
  }));
  const states = multisets(5);
  const subs = new Map();
  for(const s of states){
    const c=cntOf(s), out=[];
    (function rec(face,key){
      if(face>6){ out.push(key); return; }
      for(let j=0;j<=c[face];j++) rec(face+1,key+j*P6[face-1]);
    })(1,0);
    subs.set(s,out);
  }
  // valeur finale de chaque ligne : réussite (0/1) et points
  const target = id => {
    const u = UPPER.find(x=>x.id===id);
    return c => {
      let s=0, mx=0; for(let v=1;v<=6;v++){ s+=c[v]*v; if(c[v]>mx) mx=c[v]; }
      if(u) return [c[u.face]>=3?1:0, c[u.face]*u.face];
      const run = len => { let r=0; for(let v=1;v<=6;v++){ r=c[v]?r+1:0; if(r>=len) return true; } return false; };
      switch(id){
        case 'brelan': return mx>=3?[1,s]:[0,0];
        case 'carre':  return mx>=4?[1,s]:[0,0];
        case 'full':   { const f=c.includes(3)&&c.includes(2); return [f?1:0, f?25:0]; }
        case 'ps':     return run(4)?[1,30]:[0,0];
        case 'gs':     return run(5)?[1,40]:[0,0];
        case 'yams':   return mx===5?[1,50]:[0,0];
        case 'chance': return [1,s];
      }
    };
  };
  const tables = {};
  for(const r of ALL){
    const f = target(r.id);
    tables[r.id] = [0,1].map(kind=>{
      const V=[new Float64Array(keeps.length)], W=[null];
      for(const s of states) V[0][idx[s]] = f(cntOf(s))[kind];
      for(let n=1;n<=3;n++){
        const w=new Float64Array(keeps.length), v=new Float64Array(keeps.length);
        for(let i=0;i<keeps.length;i++){
          let e=0; for(const [o,p] of roll[5-size[i]]) e += p*V[n-1][idx[keeps[i]+o]];
          w[i]=e;
        }
        for(const s of states){ let m=0; for(const k of subs.get(s)) if(w[idx[k]]>m) m=w[idx[k]]; v[idx[s]]=m; }
        W.push(w); V.push(v);
      }
      return {V, W};
    });
  }
  PROB = {idx, size, subs, tables};
}
// probabilité / points moyens pour une ligne, à partir des dés actuels (ou sans dés) et des lancers restants
function probFor(id, kind, dice, rem){
  if(!PROB) buildProb();
  const T = PROB.tables[id][kind], ix = PROB.idx;
  if(!dice) return {v: T.W[rem][ix[0]], keep:null};
  const s = keyOf(dice);
  if(rem===0) return {v: T.V[0][ix[s]], keep:null};
  let best=-1, bk=0;
  for(const k of PROB.subs.get(s)){
    const w = T.W[rem][ix[k]];
    if(w > best+1e-12 || (Math.abs(w-best)<=1e-12 && PROB.size[ix[k]]>PROB.size[ix[bk]])){ best=w; bk=k; }
  }
  return {v: best, keep: bk};
}


/* ---------- l'ordinateur ----------
   À chaque étape, il compare les lignes libres : points moyens attendus (avec la meilleure
   façon de garder les dés pour cette ligne) moins ce que la ligne rapporte en moyenne
   d'habitude. Il vise la ligne la plus intéressante, garde les dés conseillés et relance,
   ou note son score s'il n'a plus rien à gagner. */
let BASE = null;
const SPEEDS = {lent:1400, normal:850, rapide:300};
let speed = load('yams-speed') || 'normal';
let aiTimer = null;
function aiValue(id, pts, p){
  if(!BASE){ BASE={}; for(const r of ALL) BASE[r.id] = probFor(r.id,1,null,3).v; }
  let v = pts - BASE[id];
  const u = UPPER.find(x=>x.id===id);
  if(u && totals(p).t < 63) v += 0.5*(pts - 3*u.face);   // pense au bonus du haut
  return v;
}
function heldFromKeep(k){
  const c = cntOf(k);
  return S.dice.map(v=> c[v]>0 ? (c[v]--, true) : false);
}
function aiStep(){
  if(!S.started || gameOver() || !isCPU(S.cur)) return;
  const p = S.cur, open = ALL.filter(r=>S.scores[p][r.id]==null).map(r=>r.id);
  if(S.rolls===0){ apply('roll'); return; }
  if(S.sel){ apply('val'); return; }
  const rem = 3 - S.rolls;
  if(rem>0){
    let best=null;
    for(const id of open){
      const r = probFor(id, 1, S.dice, rem);
      const val = aiValue(id, r.v, p);
      if(!best || val>best.val) best={id, val, keep:r.keep};
    }
    const held = heldFromKeep(best.keep);
    if(!held.every(Boolean)){
      if(held.some((h,i)=>h!==S.held[i])){ apply('setheld', {held}); return; }
      apply('roll'); return;
    }
  }
  // noter le score
  let best=null;
  for(const id of open){
    const val = aiValue(id, scoreFor(id, S.dice), p);
    if(!best || val>best.val) best={id, val};
  }
  apply('sel', {id:best.id, force:true});
}
function scheduleAI(){
  if(aiTimer || !S.started || gameOver() || !isCPU(S.cur)) return;
  aiTimer = setTimeout(()=>{ aiTimer=null; aiStep(); }, SPEEDS[speed]||850);
}
function stopAI(){ if(aiTimer){ clearTimeout(aiTimer); aiTimer=null; } }

/* ---------- écran de départ ---------- */
let draft = null;
function showSetup(){
  const base = S.started ? S : (load(KEY) ? normalize(load(KEY)) : S);
  draft = {mode:base.mode||'auto', nb:base.nb||2, names:[...base.names], cpu:[...base.cpu]};
  // noms par défaut (« Joueur 1 »…) remplacés par des noms tirés au hasard
  for(let p=0;p<MAXP;p++) if(/^Joueur \d$/.test(draft.names[p]||''))
    draft.names[p] = randomName(draft.names.filter((_,i)=>i!==p), draft.cpu[p]);
  renderSetup(); $('setup').classList.add('show');
}
function hideSetup(){ $('setup').classList.remove('show'); }
function renderSetup(){
  const c = $('setupCard');
  const canResume = S.started && !gameOver();
  const auto = draft.mode==='auto';
  c.innerHTML = `
    <h2>🎲 Nouvelle partie de Yams</h2>
    <div><h3>Mode de jeu</h3><div class="modes">
      <button class="mode${auto?' on':''}" data-mode="auto"><strong>Jeu automatique</strong>
        <span>La page lance les dés. 3 lancers par tour, tu gardes les dés que tu veux.</span></button>
      <button class="mode${!auto?' on':''}" data-mode="manual"><strong>Feuille de score</strong>
        <span>Vous jouez avec de vrais dés. Tu indiques les 5 valeurs, la page note le score.</span></button>
    </div></div>
    <div><h3>Nombre de joueurs</h3><div class="count" id="count"></div></div>
    <div><h3>Joueurs <button class="ghost small" id="allRandom">🎲 Tous les noms au hasard</button></h3>
      <div class="plist" id="plist"></div>
      ${auto?'':'<div class="msg" style="margin-top:8px">En mode feuille de score, tous les joueurs sont des personnes : l\'ordinateur ne peut pas lancer de vrais dés.</div>'}
    </div>
    <div class="btns">
      ${canResume?'<button class="ghost" id="resume">Reprendre la partie</button>':''}
      <button class="primary" id="start">Commencer la partie</button>
    </div>`;
  c.querySelectorAll('[data-mode]').forEach(b=> b.onclick = ()=>{ draft.mode=b.dataset.mode; renderSetup(); });
  const cnt = $('count');
  for(let n=1;n<=MAXP;n++){
    const b=document.createElement('button'); b.textContent=n; b.className = n===draft.nb?'on':'';
    b.onclick=()=>{ draft.nb=n; renderSetup(); }; cnt.appendChild(b);
  }
  const list = $('plist');
  for(let p=0;p<draft.nb;p++){
    const row = document.createElement('div'); row.className='prow'+(auto && draft.cpu[p]?' cpu':'');
    const isC = auto && draft.cpu[p];
    row.innerHTML = `<span class="num">${isC?'🤖':'#'+(p+1)}</span>`;
    const inp = document.createElement('input'); inp.type='text';
    inp.value = draft.names[p]; inp.maxLength = 16; inp.placeholder = `Joueur ${p+1}`;
    inp.onfocus = ()=>inp.select();
    inp.oninput = ()=>{ draft.names[p] = inp.value; };
    inp.onkeydown = e=>{ if(e.key==='Enter') startGame(); };
    const rnd = document.createElement('button'); rnd.className='dicebtn'; rnd.textContent='🎲'; rnd.title='Nom au hasard';
    rnd.onclick = ()=>{ draft.names[p] = randomName(draft.names.filter((_,i)=>i!==p), auto && draft.cpu[p]); inp.value = draft.names[p]; };
    row.append(inp, rnd);
    if(auto){
      const k = document.createElement('div'); k.className='kind';
      k.innerHTML = `<button class="h${!draft.cpu[p]?' on':''}">Joueur</button><button class="c${draft.cpu[p]?' on':''}">Ordinateur</button>`;
      // nom adapté automatiquement quand on change de type (sauf nom personnalisé)
      k.children[0].onclick = ()=>{
        if(draft.cpu[p] && (CPU_NAMES.includes(draft.names[p]) || !cleanName(draft.names[p]))) draft.names[p] = `Joueur ${p+1}`;
        draft.cpu[p]=false; renderSetup(); };
      k.children[1].onclick = ()=>{
        const n = cleanName(draft.names[p]);
        if(!draft.cpu[p] && (!n || /^Joueur \d$/.test(n) || NAMES.includes(n))) draft.names[p] = randomName(draft.names.filter((_,i)=>i!==p), true);
        draft.cpu[p]=true; renderSetup(); };
      row.append(k);
    }
    list.appendChild(row);
  }
  $('allRandom').onclick = ()=>{
    const taken=[];
    for(let p=0;p<draft.nb;p++){ draft.names[p] = randomName(taken, draft.mode==='auto' && draft.cpu[p]); taken.push(draft.names[p]); }
    renderSetup();
  };
  $('start').onclick = startGame;
  if(canResume) $('resume').onclick = ()=>{ hideSetup(); scheduleAI(); };
}
function startGame(){
  const go = ()=>{
    stopAI();
    const names = draft.names.map((n,i)=>cleanName(n)||`Joueur ${i+1}`);
    const cpu = draft.cpu.map(c=> draft.mode==='auto' && !!c);
    S = fresh({mode:draft.mode, nb:draft.nb, names, cpu});
    S.started = true; hideSetup(); commit();
  };
  const inProgress = S.started && !gameOver() && S.scores.some(sc=>Object.keys(sc).length);
  if(inProgress) ask('Une partie est en cours. La remplacer ? Ses scores seront effacés.', go); else go();
}
function replay(){
  stopAI();
  S = fresh({mode:S.mode, nb:S.nb, names:S.names, cpu:S.cpu}); S.started = true; commit();
}

function ask(text, fn){ $('modalText').textContent = text; pendingFn = fn; $('modal').classList.add('show'); }
$('mNo').onclick = ()=>{ $('modal').classList.remove('show'); pendingFn=null; };
$('mYes').onclick = ()=>{ $('modal').classList.remove('show'); const f=pendingFn; pendingFn=null; if(f) f(); };

/* ---------- rendu ---------- */
function dieHTML(v){
  let h=''; for(let i=0;i<9;i++) h += PIPS[v]&&PIPS[v].includes(i) ? '<span class="pip"></span>' : '<span></span>';
  return h;
}
function miniDie(v){
  let h='<span class="mini">'; for(let i=0;i<9;i++) h += PIPS[v].includes(i)?'<i></i>':'<span></span>'; return h+'</span>';
}
let shownRid = null, shownCur = null, shownLast = null;
function renderDice(shakeIdx){
  const box = $('dice'); box.innerHTML='';
  const can = canAct();
  S.dice.forEach((v,i)=>{
    const el = document.createElement('div');
    const locked = !can || (isAuto() && (S.rolls===0 || S.rolls>=3));
    el.className = 'die' + (v===0?' blank':'') + (isAuto()&&S.held[i]?' held':'') +
      (locked?' locked':'') + (shakeIdx&&shakeIdx.includes(i)?' shake':'');
    el.innerHTML = v ? dieHTML(v) : '';
    if(!locked) el.title = isAuto() ? 'Cliquer pour garder / relâcher' : 'Cliquer pour changer la valeur';
    el.onclick = ()=>{ if(!locked) act(isAuto()?'hold':'set', {i}); };
    box.appendChild(el);
  });
}
function renderSheet(){
  const tb = $('sheet');
  const N = S.nb, over = gameOver(), rdy = ready(), can = canAct(), cpuTurn = isCPU(S.cur);
  const lastNew = S.last && JSON.stringify(S.last)!==shownLast ? S.last : null;
  shownLast = JSON.stringify(S.last);
  let h = '<tr><th style="text-align:left;color:#bbb;font-size:13px;font-weight:700">Le YAMS</th>';
  for(let c=0;c<N;c++){
    const cls = (c===S.cur && !over && S.started ? 'cur ' : '') + (isCPU(c) ? 'cpu' : '');
    h += `<th class="${cls}" title="${esc(pname(c))}${isCPU(c)?' (ordinateur)':''}">${isCPU(c)?'🤖 ':''}${esc(pname(c))}</th>`;
  }
  h += '</tr>';
  const row = (r, isUpper)=>{
    const open = S.started && S.scores[S.cur][r.id]==null;
    let x = `<tr><td class="lbl">${r.label}${isUpper?miniDie(r.face):''}${open?sheetPct(r.id,isUpper):''}</td>`;
    for(let c=0;c<N;c++){
      const v = S.scores[c][r.id];
      const isNew = lastNew && lastNew.p===c && lastNew.id===r.id ? ' new' : '';
      if(v!=null){ x += `<td class="c${v===0?' z':''}${isNew}">${v|0}</td>`; continue; }
      if(c===S.cur && rdy){
        const p = scoreFor(r.id, S.dice);
        x += `<td class="c cur can${can?' click':''}${p===0?' zero':''}${S.sel===r.id?' sel':''}${cpuTurn?' cpu':''}" data-id="${r.id}">${p}</td>`;
      } else x += `<td class="c${c===S.cur && !over && S.started?' cur':''}"></td>`;
    }
    return x+'</tr>';
  };
  const totRow = (label, key, cls='tot')=>{
    let x = `<tr class="${cls}"><td class="lbl">${label}</td>`;
    for(let c=0;c<N;c++){ const t = totals(c); x += `<td class="c">${t.any? t[key] : ''}</td>`; }
    return x+'</tr>';
  };
  UPPER.forEach(r=> h+=row(r,true));
  h += totRow('TOTAL','t');
  h += '<tr><td class="lbl">BONUS</td>';
  for(let c=0;c<N;c++){
    const t = totals(c);
    if(t.bonus===35) h += '<td class="c bonusok">35</td>';
    else if(t.bonus===0) h += '<td class="c z">0</td>';
    else h += `<td class="c" style="color:#aaa;font-weight:500;font-size:11px">${t.any?(63-t.t)+' à faire':''}</td>`;
  }
  h += '</tr>';
  h += totRow('TOTAL 1','t1');
  LOWER.forEach(r=> h+=row(r,false));
  h += totRow('TOTAL 2','t2');
  h += totRow('SCORE','score','score');
  tb.innerHTML = h;
  if(can) tb.querySelectorAll('td.can').forEach(td=>{
    td.onclick = ()=> act('sel', {id:td.dataset.id});
    td.ondblclick = ()=> act('sel', {id:td.dataset.id, force:true, go:true});
  });
}
function renderHint(){
  const hint = $('hint');
  const who = `<b>${esc(pname(S.cur))}</b>`;
  if(!S.started){ hint.innerHTML = ''; return; }
  if(gameOver()){ hint.innerHTML = 'Partie terminée !'; return; }
  if(isCPU(S.cur)){
    if(S.sel){ const r=ALL.find(x=>x.id===S.sel); hint.innerHTML = `🤖 ${who} note <b>${r.label}</b> (${scoreFor(S.sel,S.dice)} pts).`; }
    else if(S.rolls===0) hint.innerHTML = `🤖 ${who} va lancer les dés…`;
    else hint.innerHTML = `🤖 ${who} réfléchit… (${3-S.rolls} lancer${3-S.rolls>1?'s':''} restant${3-S.rolls>1?'s':''})`;
    return;
  }
  if(S.sel){
    const r = ALL.find(x=>x.id===S.sel), p = scoreFor(S.sel,S.dice);
    hint.innerHTML = `<b>${r.label}</b> sélectionné → <b>${p} pt${p>1?'s':''}</b>. Clique sur <b>Valider</b>.`;
    return;
  }
  if(isAuto()){
    if(S.rolls===0) hint.innerHTML = `Au tour de ${who} : clique sur <b>Lancer les dés</b>.`;
    else if(S.rolls<3) hint.innerHTML = `Clique sur les dés à <b>garder</b>, puis relance (${3-S.rolls} lancer${3-S.rolls>1?'s':''} restant${3-S.rolls>1?'s':''}), ou choisis une ligne dans la feuille.`;
    else hint.innerHTML = 'Plus de lancer : choisis une ligne dans la feuille puis <b>Valider</b>.';
  } else {
    const missing = S.dice.filter(v=>!v).length;
    if(missing) hint.innerHTML = `Au tour de ${who} : touche chaque dé pour indiquer sa valeur (${missing} à remplir).`;
    else hint.innerHTML = 'Choisis la ligne où noter ce résultat, puis <b>Valider</b>.';
  }
}
function renderSpeed(){
  const box = $('speed');
  const hasCPU = isAuto() && S.cpu.slice(0,S.nb).some(Boolean) && S.started && !gameOver();
  if(!hasCPU){ box.style.display='none'; return; }
  box.style.display='';
  box.innerHTML = '🤖 Vitesse de l\'ordinateur : ' + Object.keys(SPEEDS).map(k=>`<button data-sp="${k}" class="${k===speed?'on':''}">${k}</button>`).join('');
  box.querySelectorAll('[data-sp]').forEach(b=> b.onclick = ()=>{ speed=b.dataset.sp; store('yams-speed', speed); renderSpeed(); });
}
function renderAll(){
  const over = gameOver(), can = canAct();
  document.body.className = isAuto() ? 'auto' : 'manual';
  const nCPU = S.cpu.slice(0,S.nb).filter((c,i)=>isCPU(i)).length;
  $('modeTag').textContent = (isAuto()?'Automatique':'Feuille de score') + (nCPU ? ` · ${nCPU} ordi` : '');

  const w = $('who');
  w.textContent = !S.started ? '' : over ? '🏁 Fin de partie' : `${isCPU(S.cur)?'🤖':'🎲'} ${pname(S.cur)}`;
  w.classList.toggle('cpu', S.started && !over && isCPU(S.cur));
  if(S.started && shownCur!==null && S.cur!==shownCur){ w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  shownCur = S.cur;

  for(let i=1;i<=3;i++){
    $('p'+i).className = 'pill' + (i<=S.rolls?' done':'') + (i===S.rolls+1 && !over && S.started?' next':'');
  }
  $('roll').disabled = !can || S.rolls>=3 || (S.rolls>0 && S.held.every(Boolean));
  $('clear').disabled = !can || S.dice.every(v=>!v);
  $('validate').disabled = !can || !S.sel || !ready();

  const shake = (S.rid!==shownRid && shownRid!==null) ? S.shk : null;
  shownRid = S.rid;
  renderDice(shake); renderSheet(); renderHint(); renderSpeed(); renderProb();

  $('replay').style.display = over ? '' : 'none';
  const b = $('banner');
  if(over){
    let best=-1, win=[];
    for(let p=0;p<S.nb;p++){ const s=totals(p).score; if(s>best){best=s;win=[p]} else if(s===best) win.push(p); }
    const nm = win.map(w=>esc(pname(w)));
    b.innerHTML = S.nb===1 ? `🏁 Score final : ${best} points` :
      `🏆 ${nm.length>1?'Égalité entre '+nm.join(' et '):'Victoire de '+nm[0]} avec ${best} points !`;
    b.classList.add('show');
  } else b.classList.remove('show');
}

let showProb = false, probRem = 0;
const fmtPct = p => p>=0.99995 ? '100 %' : p<=0 ? '0 %' : p<0.001 ? '< 0,1 %' : (p*100).toFixed(1).replace('.',',')+' %';
const fmtPts = x => x.toFixed(1).replace('.',',');
function keepText(k, dice){
  if(k==null) return '';
  const c = cntOf(k), faces=[]; for(let v=1;v<=6;v++) for(let j=0;j<c[v];j++) faces.push(v);
  if(!faces.length) return 'tout relancer';
  if(faces.length===5) return 'tout garder';
  return `garder <b>${faces.join(' ')}</b>`;
}
function renderProb(){
  const box = $('prob');
  $('probBtn').textContent = showProb ? '📊 Masquer les probabilités' : '📊 Afficher les probabilités';
  $('probBtn').parentNode.style.display = (S.started && !gameOver()) ? '' : 'none';
  if(!showProb || !S.started || gameOver()){ box.style.display='none'; return; }
  box.style.display='';
  // point de départ : dés actuels et lancers restants
  let dice=null, rem, head, seg='';
  if(isAuto()){
    rem = 3 - S.rolls;
    if(S.rolls>0) dice = S.dice;
    head = S.rolls===0 ? 'Avant le 1<sup>er</sup> lancer : <b>3 lancers</b> à venir.'
         : rem===0 ? 'Plus de lancer : résultat avec les dés actuels.'
         : `Avec ces dés et <b>${rem} lancer${rem>1?'s':''} restant${rem>1?'s':''}</b>.`;
  } else {
    if(S.dice.every(v=>v>0)){
      dice = S.dice; rem = probRem;
      seg = `<div class="seg">Lancers restants : ${[0,1,2].map(n=>`<button data-rem="${n}" class="${n===rem?'on':''}">${n}</button>`).join('')}</div>`;
      head = rem===0 ? 'Résultat avec les dés indiqués.' : `Avec ces dés et <b>${rem} lancer${rem>1?'s':''} restant${rem>1?'s':''}</b>.`;
    } else { rem = 3; head = 'Dés pas encore indiqués : probabilités avant le 1<sup>er</sup> lancer (<b>3 lancers</b>).'; }
  }
  const rows = ALL.filter(r=>S.scores[S.cur][r.id]==null);
  let h = `<div class="ph">${head} Pour chaque ligne libre de <b>${esc(pname(S.cur))}</b>, en gardant à chaque fois les meilleurs dés pour cette ligne.</div>${seg}
    <table><tr><th>Ligne</th><th>Réussite</th><th>Pts moy.</th>${dice&&rem>0?'<th>Conseil</th>':''}</tr>`;
  for(const r of rows){
    const isU = !!r.face, isC = r.id==='chance';
    const pS = probFor(r.id, 0, dice, rem), pP = probFor(r.id, 1, dice, rem);
    const keep = (isU||isC) ? pP.keep : pS.keep;
    const lbl = isU ? `${r.label} <small>(≥ 3)</small>` : r.label;
    const bar = isC ? '<div class="bar"><span>—</span></div>'
      : `<div class="bar"><i style="width:${(pS.v*100).toFixed(1)}%"></i><span>${fmtPct(pS.v)}</span></div>`;
    h += `<tr><td class="n">${lbl}</td><td>${bar}</td><td style="text-align:right;font-weight:600">${fmtPts(pP.v)}</td>${dice&&rem>0?`<td class="k">${keepText(keep,dice)}</td>`:''}</tr>`;
  }
  h += '</table>';
  box.innerHTML = h;
  box.querySelectorAll('[data-rem]').forEach(b=> b.onclick = ()=>{ probRem = +b.dataset.rem; renderProb(); renderSheet(); });
}

$('probBtn').onclick = ()=>{ showProb = !showProb; renderProb(); };

/* ---------- % dans la feuille de score ---------- */
let sheetProb = load('yams-pp'); if(sheetProb===null) sheetProb = true;
function probContext(){
  if(isAuto()) return {dice: S.rolls>0 ? S.dice : null, rem: 3-S.rolls};
  if(S.dice.every(v=>v>0)) return {dice:S.dice, rem:probRem};
  return {dice:null, rem:3};
}
function sheetPct(id, upper){
  if(!sheetProb || !S.started || gameOver() || id==='chance') return '';
  const {dice, rem} = probContext();
  const p = probFor(id, 0, dice, rem).v;
  const cls = p>=0.99995 ? 'ok' : p>=0.5 ? 'g' : p>=0.2 ? 'm' : 'r';
  const txt = p>=0.99995 ? '✔' : p<0.005 ? (p>0?'<1 %':'0 %') : Math.round(p*100)+' %';
  const what = upper ? 'au moins 3 dés de cette valeur' : 'réussir cette combinaison';
  return `<span class="pp ${cls}${upper?'':' lo'}" title="Chance de ${what} avec les lancers restants">${txt}</span>`;
}
function renderPPBtn(){
  const b=$('ppBtn'); b.className = sheetProb ? 'on' : ''; b.textContent = sheetProb ? '% affichés' : '% masqués';
}
$('ppBtn').onclick = ()=>{ sheetProb=!sheetProb; store('yams-pp', sheetProb); renderPPBtn(); renderSheet(); };
renderPPBtn();

/* ---------- boutons & clavier ---------- */
$('roll').onclick = ()=>act('roll');
$('validate').onclick = ()=>act('val');
$('clear').onclick = ()=>act('clear');
$('replay').onclick = replay;
$('newgame').onclick = showSetup;
document.addEventListener('keydown', e=>{
  if(document.querySelector('.setup.show, .modal.show')) return;
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); act('roll'); }
  else if(e.key==='Enter') act('val');
  else if(!isAuto() && /^[1-6]$/.test(e.key)) act('type', {v:+e.key});
  else if(!isAuto() && e.key==='Backspace') act('back');
});

/* ---------- démarrage ---------- */
const saved = load(KEY);
if(saved && saved.scores) S = normalize(saved);
renderAll();
if(!S.started) showSetup(); else scheduleAI();
</script>
</body>
</html>
