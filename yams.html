<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yams – Feuille de score</title>
<style>
  :root{
    --bg:#f4f1ea; --paper:#ffffff; --ink:#22252b; --muted:#7a7f88;
    --line:#d3d6db; --grey:#bfbfbf; --accent:#1f6feb; --accent-soft:#e3edff;
    --hold:#e8590c; --hold-soft:#fff1e6; --ok:#2b8a3e; --zero:#c92a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px;
    display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:900px){.wrap{grid-template-columns:380px 1fr;align-items:start}}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .card{background:var(--paper);border-radius:14px;padding:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05)}
  .panel{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
  .stack{display:flex;flex-direction:column;gap:14px}

  .turn{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .who{font-weight:800;font-size:19px}
  .who.mine{color:var(--accent)}
  .who.flash{animation:flash 1s}
  @keyframes flash{0%{color:var(--accent);transform:scale(1.15)}100%{transform:scale(1)}}
  .tag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 8px}
  .netline{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .netline .warn{color:var(--zero);font-weight:700}

  .rolls{display:flex;gap:8px}
  .pill{flex:1;text-align:center;padding:7px 4px;border-radius:999px;border:1.5px solid var(--line);
    font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
  .pill.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.next{border-color:var(--accent);color:var(--accent)}

  .dice{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
  .die{width:58px;height:58px;border-radius:12px;background:#fff;border:2px solid #cfd3d9;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:8px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,background .15s;
    box-shadow:0 2px 0 #cfd3d9;user-select:none;-webkit-tap-highlight-color:transparent}
  .die:hover{transform:translateY(-2px)}
  .die.blank{background:#f1f3f5}
  .die.blank::before{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;color:#c4c9cf}
  .auto .die.blank::before{content:""}
  .die.locked{cursor:default}
  .die.locked:hover{transform:none}
  .die.held{border-color:var(--hold);background:var(--hold-soft);box-shadow:0 2px 0 var(--hold)}
  .die.held::after{content:"GARDÉ";position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
    font-size:10px;font-weight:700;color:var(--hold);letter-spacing:.5px}
  .die.shake{animation:shake .45s}
  @keyframes shake{0%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(.95)}40%{transform:rotate(12deg)}
    60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0)}}
  .pip{width:10px;height:10px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
  .dice-gap{height:16px}
  .manual .dice-gap{height:0}

  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:10px;border:none;padding:11px 14px;font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--accent);color:#fff;flex:1}
  .confirm{background:var(--ok);color:#fff;flex:1}
  .ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
  .hint{font-size:13.5px;color:var(--muted);min-height:38px;line-height:1.4}
  .hint b{color:var(--ink)}
  .manual .auto-only, .auto .manual-only{display:none !important}

  table{width:100%;border-collapse:separate;border-spacing:3px;font-size:14px}
  th{font-weight:600;color:#555;font-size:14px;padding:4px 2px;max-width:90px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th.cur{color:var(--accent);font-weight:800}
  th .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--ok)}
  th .dot.off{background:#ccc}
  td.lbl{font-weight:700;font-size:12.5px;padding:0 6px;white-space:nowrap;letter-spacing:.2px}
  td.lbl .mini{display:inline-grid;grid-template-columns:repeat(3,4px);grid-template-rows:repeat(3,4px);gap:1px;
    width:22px;height:22px;padding:2px;border-radius:4px;background:#ccc;vertical-align:middle;margin-left:6px;float:right}
  td.lbl .mini i{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
  td.c{height:32px;min-width:48px;border:1px solid var(--line);border-radius:3px;text-align:center;
    font-weight:700;font-size:15px;background:#fff;transition:background .12s}
  td.c.cur{border-color:#9ec0f7}
  td.c.can{color:#9aa3ad;font-weight:600;font-style:italic}
  td.c.can.click{cursor:pointer}
  td.c.can.click:hover{background:var(--accent-soft)}
  td.c.can.zero{color:#e0a0a0}
  td.c.sel{background:var(--accent);color:#fff !important;font-style:normal;border-color:var(--accent)}
  td.c.z{color:var(--zero)}
  tr.tot td{background:var(--grey)}
  tr.tot td.lbl{background:var(--grey);font-weight:800;border-radius:3px;padding:7px 6px}
  tr.tot td.c{background:var(--grey);border-color:var(--grey)}
  tr.score td.lbl{font-size:16px;font-weight:900}
  tr.score td.c{height:40px;font-size:18px}
  td.c.bonusok{color:var(--ok)}
  .sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .sheet-head small{color:var(--muted)}

  .banner{display:none;background:#fff8db;border:1.5px solid #f2c94c;border-radius:12px;padding:12px;
    text-align:center;font-weight:700}
  .banner.show{display:block}

  /* écran de départ */
  .setup{position:fixed;inset:0;background:rgba(244,241,234,.97);display:none;align-items:flex-start;
    justify-content:center;z-index:8;overflow:auto;padding:30px 14px}
  .setup.show{display:flex}
  .setup .card{max-width:480px;width:100%;display:flex;flex-direction:column;gap:16px}
  .setup h2{margin:0;font-size:24px}
  .setup h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modes.col{grid-template-columns:1fr}
  .mode{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;
    font-weight:400;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
  .mode strong{font-size:15px}
  .mode span{font-size:12.5px;color:var(--muted);line-height:1.35}
  .mode.on{border-color:var(--accent);background:var(--accent-soft)}
  .mode:hover:not(:disabled){border-color:var(--accent)}
  .count{display:flex;gap:6px}
  .count button{flex:1;padding:9px 0;background:#fff;border:2px solid var(--line);color:var(--ink)}
  .count button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .names label,.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
  .field{flex-direction:column;align-items:stretch;gap:4px}
  input[type=text]{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);font-weight:600;
    padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  input.code{text-transform:uppercase;letter-spacing:6px;font-size:22px;text-align:center}
  .bigcode{font-size:42px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--accent);
    background:var(--accent-soft);border-radius:12px;padding:10px 0}
  .plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .plist li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;font-weight:600}
  .plist li small{color:var(--muted);font-weight:500}
  .msg{font-size:13px;color:var(--muted);line-height:1.4}
  .msg.err{color:var(--zero)}
  .back{align-self:flex-start;padding:4px 0;background:none;color:var(--muted);font-weight:600}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:18px;max-width:320px;width:90%}
  .modal .box p{margin:0 0 14px}
</style>
</head>
<body class="auto">

<div class="setup" id="setup"><div class="card" id="setupCard"></div></div>

<div class="wrap">
  <div class="panel">
    <div class="card stack">
      <div class="turn">
        <h1>YAMS</h1>
        <span class="tag" id="modeTag"></span>
      </div>
      <div class="netline" id="netline"></div>
      <div class="who" id="who"></div>

      <div class="rolls auto-only">
        <div class="pill" id="p1">Lancer 1</div>
        <div class="pill" id="p2">Lancer 2</div>
        <div class="pill" id="p3">Lancer 3</div>
      </div>

      <div class="dice" id="dice"></div>
      <div class="dice-gap"></div>

      <div class="btns">
        <button class="primary auto-only" id="roll">🎲 Lancer les dés</button>
        <button class="ghost manual-only" id="clear" style="flex:1">Effacer les dés</button>
        <button class="confirm" id="validate" disabled>✔ Valider</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="banner" id="banner"></div>
      <div class="btns">
        <button class="primary" id="replay" style="display:none">Rejouer avec les mêmes joueurs</button>
        <button class="ghost" id="newgame" style="flex:1">Nouvelle partie</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sheet-head">
      <strong>Feuille de score</strong>
      <small>Bonus +35 si total ≥ 63</small>
    </div>
    <table id="sheet"></table>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <p id="modalText"></p>
    <div class="btns">
      <button class="ghost" id="mNo" style="flex:1">Annuler</button>
      <button class="primary" id="mYes">Confirmer</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXP = 6;
const UPPER = [
  {id:'as', label:'AS', face:1},{id:'deux', label:'DEUX', face:2},{id:'trois', label:'TROIS', face:3},
  {id:'quatre', label:'QUATRE', face:4},{id:'cinq', label:'CINQ', face:5},{id:'six', label:'SIX', face:6}
];
const LOWER = [
  {id:'brelan', label:'BRELAN'},{id:'carre', label:'CARRÉ'},{id:'full', label:'FULL'},
  {id:'ps', label:'PETITE SUITE'},{id:'gs', label:'GRANDE SUITE'},{id:'yams', label:"YAM'S"},
  {id:'chance', label:'CHANCE'}
];
const ALL = [...UPPER, ...LOWER];
const IDS = new Set(ALL.map(r=>r.id));
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const defNames = ()=>Array.from({length:MAXP},(_,i)=>`Joueur ${i+1}`);
const cleanName = s => String(s==null?'':s).replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,16);
const esc = s => String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/* ---------- stockage local (protégé) ---------- */
function load(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } }
function store(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }

/* ---------- état ---------- */
function fresh(cfg){
  return {started:false, mode:cfg.mode||'auto', nb:cfg.nb||2, names:cfg.names||defNames(),
    cur:0, rolls:0, dice:[0,0,0,0,0], held:[false,false,false,false,false], sel:null,
    rid:0, shk:[], v:0, seats:[], scores:Array.from({length:MAXP},()=>({}))};
}
let S = fresh({});
// NET.role : 'solo' | 'host' | 'guest'
let NET = {role:'solo', code:'', name:'', room:null, seen:{}, n:0, myPeer:null, hostHere:false, lastSt:null};

const pname = p => cleanName(S.names[p]) || `Joueur ${p+1}`;

function save(){
  if(NET.role==='solo') store('yams-state-v2', S);
  else if(NET.role==='host') store('yams-host', S);
}

/* ---------- calcul des combinaisons ---------- */
function counts(d){ const c=[0,0,0,0,0,0,0]; d.forEach(v=>c[v]++); return c; }
function sum(d){ return d.reduce((a,b)=>a+b,0); }
function hasRun(c, len){
  let run=0;
  for(let v=1; v<=6; v++){ run = c[v] ? run+1 : 0; if(run>=len) return true; }
  return false;
}
function scoreFor(id, d){
  const c = counts(d), s = sum(d), mx = Math.max(...c.slice(1));
  const u = UPPER.find(x=>x.id===id);
  if(u) return c[u.face]*u.face;
  switch(id){
    case 'brelan': return mx>=3 ? s : 0;
    case 'carre':  return mx>=4 ? s : 0;
    case 'full':   return (c.includes(3) && c.includes(2)) ? 25 : 0;
    case 'ps':     return hasRun(c,4) ? 30 : 0;
    case 'gs':     return hasRun(c,5) ? 40 : 0;
    case 'yams':   return mx===5 ? 50 : 0;
    case 'chance': return s;
  }
  return 0;
}
function totals(p){
  const sc = S.scores[p];
  const upperFilled = UPPER.every(r=>sc[r.id]!=null);
  const t = UPPER.reduce((a,r)=>a+(sc[r.id]||0),0);
  const bonus = t>=63 ? 35 : (upperFilled ? 0 : null);
  const t1 = t + (bonus||0);
  const t2 = LOWER.reduce((a,r)=>a+(sc[r.id]||0),0);
  const any = ALL.some(r=>sc[r.id]!=null);
  return {t, bonus, t1, t2, score:t1+t2, any};
}
const playerDone = p => ALL.every(r=>S.scores[p][r.id]!=null);
function gameOver(){ if(!S.started) return false; for(let p=0;p<S.nb;p++) if(!playerDone(p)) return false; return true; }
const isAuto = () => S.mode==='auto';
const ready = () => S.started && !gameOver() && (isAuto() ? S.rolls>0 : S.dice.every(v=>v>0));

/* ---------- réseau : qui peut jouer ? ---------- */
const roomPeers = () => { try{ return NET.room ? NET.room.peers() : [] }catch(e){ return [] } };
function seatPresent(seat){
  if(NET.role==='solo') return true;
  if(seat===0) return NET.role==='host' ? true : NET.hostHere;
  const pr = S.seats[seat]; if(!pr) return false;
  return roomPeers().some(p=>p.peer===pr);
}
function mySeat(){
  if(NET.role==='solo') return null;
  if(NET.role==='host') return 0;
  const i = S.seats.indexOf(NET.myPeer); return i>0 ? i : -1;
}
function canAct(){
  if(!S.started || gameOver()) return false;
  if(NET.role==='solo') return true;
  if(NET.role==='host') return S.cur===0 || !seatPresent(S.cur);
  return mySeat()===S.cur && NET.hostHere;
}

/* ---------- actions ---------- */
function act(t, x={}){
  if(!canAct()) return;
  if(NET.role==='guest'){
    NET.n++;
    NET.room.presence({a:{n:NET.n, t, ...x}}).catch(()=>{});
    return;
  }
  apply(t, x);
}
function apply(t, x){
  if(!S.started || gameOver()) return;
  switch(t){
    case 'roll':
      if(!isAuto() || S.rolls>=3) return;
      if(S.rolls>0 && S.held.every(Boolean)) return;
      const idx = [];
      S.dice = S.dice.map((v,i)=>{ if(S.held[i] && S.rolls>0) return v; idx.push(i); return 1+Math.floor(Math.random()*6); });
      S.rolls++; S.sel=null; S.rid++; S.shk=idx;
      break;
    case 'hold': {
      const i = x.i|0;
      if(!isAuto() || S.rolls===0 || S.rolls>=3 || i<0 || i>4) return;
      S.held[i] = !S.held[i]; break;
    }
    case 'set': {
      const i = x.i|0;
      if(isAuto() || i<0 || i>4) return;
      S.dice[i] = S.dice[i]%6 + 1; S.sel=null; break;
    }
    case 'type': {
      const i = S.dice.indexOf(0), v = x.v|0;
      if(isAuto() || i<0 || v<1 || v>6) return;
      S.dice[i]=v; S.sel=null; break;
    }
    case 'back': {
      if(isAuto()) return;
      let i = S.dice.indexOf(0); i = i<0 ? 4 : i-1; if(i<0) return;
      S.dice[i]=0; S.sel=null; break;
    }
    case 'clear':
      if(isAuto()) return;
      S.dice=[0,0,0,0,0]; S.sel=null; break;
    case 'sel':
      if(!ready() || !IDS.has(x.id) || S.scores[S.cur][x.id]!=null) return;
      S.sel = (S.sel===x.id && !x.force) ? null : x.id;
      if(!x.go) break;
      // double-clic : on enchaîne sur la validation
    case 'val':
      if(!S.sel || !ready()) return;
      S.scores[S.cur][S.sel] = scoreFor(S.sel, S.dice);
      S.rolls=0; S.dice=[0,0,0,0,0]; S.held=[false,false,false,false,false]; S.sel=null; S.shk=[];
      for(let k=1;k<=S.nb;k++){ const n=(S.cur+k)%S.nb; if(!playerDone(n)){ S.cur=n; break; } }
      break;
    default: return;
  }
  commit();
}
function commit(){ S.v++; save(); publish(); renderAll(); }

/* ---------- réseau : salle ---------- */
let roomApi = null, roomTried = false;
async function getRoom(){
  if(roomTried) return roomApi;
  roomTried = true;
  try{ if(window.claude && typeof window.claude.use==='function') roomApi = await window.claude.use('room'); }catch(e){ roomApi=null; }
  return roomApi;
}
function genCode(){
  const ch='abcdefghjkmnpqrstuvwxyz23456789'; let s='';
  for(let i=0;i<4;i++) s += ch[Math.floor(Math.random()*ch.length)];
  return s;
}
async function enterRoom(role, code, name){
  const api = await getRoom();
  if(!api) throw new Error('no-room');
  const room = await api.join('yams-'+code);
  NET = {role, code, name, room, seen:{}, n:0, myPeer:null, hostHere:false, lastSt:null};
  store('yams-net', {role, code, name});
  room.onPeers(onPeers, ()=>{ renderAll(); });
  room.onConnection(()=>renderAll());
  if(role==='host') publish();
  else room.presence({r:'g', name, a:{n:0}}).catch(()=>{});
}
function publish(){
  if(NET.role!=='host' || !NET.room) return;
  const st = S.started ? {...S, scores:S.scores.slice(0,S.nb)} : null;
  NET.room.presence({r:'h', name:NET.name, st}).catch(()=>{});
}
async function leaveRoom(){
  const r = NET.room;
  NET = {role:'solo', code:'', name:'', room:null, seen:{}, n:0, myPeer:null, hostHere:false, lastSt:null};
  store('yams-net', null); store('yams-host', null);
  if(r){ try{ await r.leave() }catch(e){} }
}

// un invité reçoit l'état de l'hôte : on le nettoie avant de l'utiliser
function adopt(st){
  if(!st || typeof st!=='object' || !Array.isArray(st.scores) || !Array.isArray(st.dice)) return false;
  const nb = Math.min(MAXP, Math.max(1, st.nb|0));
  const scores = Array.from({length:MAXP},(_,i)=>{
    const o = {}, src = st.scores[i];
    if(src && typeof src==='object') for(const k of IDS) if(Number.isFinite(src[k])) o[k]=src[k];
    return o;
  });
  const names = defNames().map((d,i)=> Array.isArray(st.names) && cleanName(st.names[i]) || d);
  S = {
    started: !!st.started, mode:'auto', nb, names, scores,
    cur: Math.min(nb-1, Math.max(0, st.cur|0)),
    rolls: Math.min(3, Math.max(0, st.rolls|0)),
    dice: [0,1,2,3,4].map(i=>{ const v=st.dice[i]|0; return v>=0&&v<=6?v:0; }),
    held: [0,1,2,3,4].map(i=>!!(Array.isArray(st.held)&&st.held[i])),
    sel: IDS.has(st.sel) ? st.sel : null,
    rid: st.rid|0, shk: Array.isArray(st.shk) ? st.shk.filter(i=>Number.isInteger(i)&&i>=0&&i<5) : [],
    v: st.v|0, seats: Array.isArray(st.seats) ? st.seats.map(x=>typeof x==='string'?x:null) : []
  };
  return true;
}

function onPeers(ch){
  const peers = ch.peers;
  const me = peers.find(p=>p.sameTab); if(me) NET.myPeer = me.peer;

  if(NET.role==='host'){
    let changed = false;
    for(const p of [...ch.joined, ...ch.updated]){
      if(p.isMe) continue;
      const pr = p.presence || {}; if(pr.r!=='g') continue;
      // un joueur revenu (même nom) récupère sa place si elle est libre
      if(S.started && S.seats.indexOf(p.peer)<0){
        const nm = cleanName(pr.name).toLowerCase();
        const i = S.seats.findIndex((pe,k)=> k>0 && k<S.nb && !peers.some(q=>q.peer===pe) && pname(k).toLowerCase()===nm);
        if(nm && i>0){ S.seats[i]=p.peer; changed = true; }
      }
      const a = pr.a, n = a && Number.isFinite(a.n) ? a.n : 0;
      if(NET.seen[p.peer]===undefined){ NET.seen[p.peer]=n; continue; } // ne rejoue jamais une ancienne action
      if(n > NET.seen[p.peer]){
        NET.seen[p.peer] = n;
        if(S.started && S.seats.indexOf(p.peer)===S.cur && S.cur>0){
          apply(String(a.t), {i:a.i, id:a.id, v:a.v, go:!!a.go, force:!!a.force});
        }
      }
    }
    if(changed) commit();
    if(ch.joined.length) publish();
  } else if(NET.role==='guest'){
    const h = peers.find(p=>!p.isMe && p.presence && p.presence.r==='h');
    NET.hostHere = !!h;
    if(h){
      NET.hostName = cleanName(h.presence.name);
      const st = h.presence.st;
      if(st !== NET.lastSt){
        NET.lastSt = st;
        if(st && adopt(st)){ if(S.started) hideSetup(); }
      }
    }
  }
  if($('setup').classList.contains('show') && (view==='lobbyHost'||view==='lobbyGuest')) renderSetup();
  renderAll();
}

/* ---------- écran de départ ---------- */
let view = 'home', draft = null, setupMsg = '', setupErr = false, busy = false;
function showSetup(v){
  view = v; setupMsg=''; setupErr=false;
  if(v==='solo') draft = {mode:S.mode||'auto', nb:NET.role==='solo'?S.nb:2, names:[...(load('yams-state-v2')||S).names||defNames()]};
  renderSetup(); $('setup').classList.add('show');
}
function hideSetup(){ $('setup').classList.remove('show'); }
function lobbyPlayers(){
  const out = [];
  for(const p of roomPeers()){
    const pr = p.presence||{};
    if(pr.r==='h') out.unshift({name:cleanName(pr.name)||'Hôte', host:true, me:p.sameTab});
    else if(pr.r==='g') out.push({name:cleanName(pr.name)||'Joueur', me:p.sameTab});
  }
  if(NET.role==='host' && !out.some(x=>x.host)) out.unshift({name:NET.name, host:true, me:true});
  return out;
}

function normalizeSolo(st){
  const s = {...fresh({}), ...st};
  while(s.scores.length<MAXP) s.scores.push({});
  if(!Array.isArray(s.seats)) s.seats=[];
  return s;
}
function startSolo(){
  const inProgress = S.started && NET.role==='solo' && !gameOver() && S.scores.some(sc=>Object.keys(sc).length);
  const go = async ()=>{
    if(NET.role!=='solo') await leaveRoom();
    S = fresh({mode:draft.mode, nb:draft.nb, names:draft.names.map((n,i)=>cleanName(n)||`Joueur ${i+1}`)});
    S.started = true; save(); hideSetup(); renderAll();
  };
  if(inProgress) ask('Une partie solo est en cours. La remplacer ? Ses scores seront effacés.', go); else go();
}
async function doHost(){
  const name = cleanName($('myname').value);
  if(!name){ setupMsg='Indique ton nom.'; setupErr=true; renderSetup(); return; }
  store('yams-lastname', name);
  busy=true; setupMsg=''; renderSetup();
  try{
    if(NET.role!=='solo') await leaveRoom();
    S = fresh({mode:'auto'});
    await enterRoom('host', genCode(), name);
    busy=false; showSetup('lobbyHost'); renderAll();
  }catch(e){
    busy=false; setupErr=true;
    setupMsg = e && e.message==='no-room'
      ? 'Le jeu en réseau n\'est pas disponible ici. Ouvre la page sur claude.ai, connecté à ton compte.'
      : 'Impossible de créer la salle pour le moment. Réessaie dans un instant.';
    renderSetup();
  }
}
async function doJoin(){
  const name = cleanName($('myname').value);
  const code = String($('code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!name){ setupMsg='Indique ton nom.'; setupErr=true; renderSetup(); return; }
  if(code.length!==4){ setupMsg='Le code fait 4 caractères.'; setupErr=true; renderSetup(); $('myname').value=name; return; }
  store('yams-lastname', name);
  busy=true; setupMsg=''; renderSetup();
  try{
    if(NET.role!=='solo') await leaveRoom();
    S = fresh({mode:'auto'});
    await enterRoom('guest', code, name);
    busy=false; showSetup('lobbyGuest'); renderAll();
  }catch(e){
    busy=false; setupErr=true;
    setupMsg = e && e.message==='no-room'
      ? 'Le jeu en réseau n\'est pas disponible ici. Ouvre la page sur claude.ai, connecté à ton compte.'
      : 'Impossible de rejoindre la salle pour le moment. Réessaie dans un instant.';
    renderSetup();
  }
}
function hostStart(){
  const guests = roomPeers().filter(p=>!p.isMe && p.presence && p.presence.r==='g').slice(0, MAXP-1);
  const names = [NET.name, ...guests.map(p=>cleanName(p.presence.name)||'Joueur')];
  // noms en double : on les numérote
  names.forEach((n,i)=>{ let k=2; while(names.slice(0,i).includes(names[i])) names[i]=`${n} ${k++}`; });
  S = fresh({mode:'auto', nb:names.length, names:[...names, ...defNames().slice(names.length)]});
  S.seats = [null, ...guests.map(p=>p.peer)];
  S.started = true;
  guests.forEach(p=>{ const a=p.presence.a; NET.seen[p.peer] = a && Number.isFinite(a.n) ? a.n : 0; });
  hideSetup(); commit();
}
function hostReplay(){
  const seats = S.seats, names = S.names, nb = S.nb;
  S = fresh({mode:'auto', nb, names}); S.seats = seats; S.started = true;
  commit();
}

let pendingFn = null;
function ask(text, fn){ $('modalText').textContent = text; pendingFn = fn; $('modal').classList.add('show'); }
$('mNo').onclick = ()=>{ $('modal').classList.remove('show'); pendingFn=null; };
$('mYes').onclick = ()=>{ $('modal').classList.remove('show'); const f=pendingFn; pendingFn=null; if(f) f(); };

/* ---------- rendu ---------- */
function dieHTML(v){
  let h=''; for(let i=0;i<9;i++) h += PIPS[v]&&PIPS[v].includes(i) ? '<span class="pip"></span>' : '<span></span>';
  return h;
}
function miniDie(v){
  let h='<span class="mini">'; for(let i=0;i<9;i++) h += PIPS[v].includes(i)?'<i></i>':'<span></span>'; return h+'</span>';
}
let shownRid = null, shownCur = null;
function renderDice(shakeIdx){
  const box = $('dice'); box.innerHTML='';
  const can = canAct();
  S.dice.forEach((v,i)=>{
    const el = document.createElement('div');
    const locked = !can || (isAuto() && (S.rolls===0 || S.rolls>=3));
    el.className = 'die' + (v===0?' blank':'') + (isAuto()&&S.held[i]?' held':'') +
      (locked?' locked':'') + (shakeIdx&&shakeIdx.includes(i)?' shake':'');
    el.innerHTML = v ? dieHTML(v) : '';
    if(!locked) el.title = isAuto() ? 'Cliquer pour garder / relâcher' : 'Cliquer pour changer la valeur';
    el.onclick = ()=>{ if(!locked) act(isAuto()?'hold':'set', {i}); };
    box.appendChild(el);
  });
}
function renderSheet(){
  const tb = $('sheet');
  const N = S.nb, over = gameOver(), rdy = ready(), can = canAct(), net = NET.role!=='solo';
  let h = '<tr><th style="text-align:left;color:#bbb;font-size:13px;font-weight:700">Le YAMS</th>';
  for(let c=0;c<N;c++){
    const dot = net ? `<span class="dot${seatPresent(c)?'':' off'}"></span>` : '';
    const me = net && c===mySeat() ? ' (toi)' : '';
    h += `<th class="${c===S.cur && !over && S.started?'cur':''}" title="${esc(pname(c)+me)}">${dot}${esc(pname(c))}</th>`;
  }
  h += '</tr>';
  const row = (r, isUpper)=>{
    let x = `<tr><td class="lbl">${r.label}${isUpper?miniDie(r.face):''}</td>`;
    for(let c=0;c<N;c++){
      const v = S.scores[c][r.id];
      if(v!=null){ x += `<td class="c${v===0?' z':''}">${v|0}</td>`; continue; }
      if(c===S.cur && rdy){
        const p = scoreFor(r.id, S.dice);
        x += `<td class="c cur can${can?' click':''}${p===0?' zero':''}${S.sel===r.id?' sel':''}" data-id="${r.id}">${p}</td>`;
      } else x += `<td class="c${c===S.cur && !over && S.started?' cur':''}"></td>`;
    }
    return x+'</tr>';
  };
  const totRow = (label, key, cls='tot')=>{
    let x = `<tr class="${cls}"><td class="lbl">${label}</td>`;
    for(let c=0;c<N;c++){ const t = totals(c); x += `<td class="c">${t.any? t[key] : ''}</td>`; }
    return x+'</tr>';
  };
  UPPER.forEach(r=> h+=row(r,true));
  h += totRow('TOTAL','t');
  h += '<tr><td class="lbl">BONUS</td>';
  for(let c=0;c<N;c++){
    const t = totals(c);
    if(t.bonus===35) h += '<td class="c bonusok">35</td>';
    else if(t.bonus===0) h += '<td class="c z">0</td>';
    else h += `<td class="c" style="color:#aaa;font-weight:500;font-size:11px">${t.any?(63-t.t)+' à faire':''}</td>`;
  }
  h += '</tr>';
  h += totRow('TOTAL 1','t1');
  LOWER.forEach(r=> h+=row(r,false));
  h += totRow('TOTAL 2','t2');
  h += totRow('SCORE','score','score');
  tb.innerHTML = h;
  if(can) tb.querySelectorAll('td.can').forEach(td=>{
    td.onclick = ()=> act('sel', {id:td.dataset.id});
    td.ondblclick = ()=> act('sel', {id:td.dataset.id, force:true, go:true});
  });
}
function renderHint(){
  const hint = $('hint');
  const who = `<b>${esc(pname(S.cur))}</b>`;
  if(!S.started){ hint.innerHTML = NET.role==='guest' ? 'En attente que l\'hôte démarre la partie…' : ''; return; }
  if(gameOver()){ hint.innerHTML = 'Partie terminée !'; return; }
  if(NET.role==='guest' && !NET.hostHere){ hint.innerHTML = '<b>L\'hôte est déconnecté.</b> La partie reprendra dès son retour.'; return; }
  if(NET.role!=='solo' && !canAct()){
    hint.innerHTML = mySeat()===-1 ? `Tu regardes la partie. Au tour de ${who}.` : `Au tour de ${who}… patiente, tu suis son jeu en direct.`;
    return;
  }
  const pre = (NET.role==='host' && S.cur!==0) ? `${who} est déconnecté : tu peux jouer à sa place. ` : '';
  if(S.sel){
    const r = ALL.find(x=>x.id===S.sel), p = scoreFor(S.sel,S.dice);
    hint.innerHTML = pre + `<b>${r.label}</b> sélectionné → <b>${p} pt${p>1?'s':''}</b>. Clique sur <b>Valider</b>.`;
    return;
  }
  const you = NET.role==='solo' ? `Au tour de ${who} : ` : 'À toi ! ';
  if(isAuto()){
    if(S.rolls===0) hint.innerHTML = pre + you + 'clique sur <b>Lancer les dés</b>.';
    else if(S.rolls<3) hint.innerHTML = pre + `Clique sur les dés à <b>garder</b>, puis relance (${3-S.rolls} lancer${3-S.rolls>1?'s':''} restant${3-S.rolls>1?'s':''}), ou choisis une ligne dans la feuille.`;
    else hint.innerHTML = pre + 'Plus de lancer : choisis une ligne dans la feuille puis <b>Valider</b>.';
  } else {
    const missing = S.dice.filter(v=>!v).length;
    if(missing) hint.innerHTML = you + `touche chaque dé pour indiquer sa valeur (${missing} à remplir).`;
    else hint.innerHTML = 'Choisis la ligne où noter ce résultat, puis <b>Valider</b>.';
  }
}
function renderAll(){
  const over = gameOver(), can = canAct(), net = NET.role!=='solo';
  document.body.className = isAuto() ? 'auto' : 'manual';
  $('modeTag').textContent = NET.role==='host' ? 'Réseau · Hôte' : NET.role==='guest' ? 'Réseau' : (isAuto()?'Solo · Automatique':'Solo · Feuille de score');

  // ligne réseau
  if(net){
    const n = lobbyPlayers().length;
    let t = `Salle <b>${esc(NET.code.toUpperCase())}</b> · ${n} connecté${n>1?'s':''}`;
    if(NET.room && !NET.room.connected()) t += ' · <span class="warn">connexion perdue…</span>';
    else if(NET.role==='guest' && !NET.hostHere) t += ' · <span class="warn">hôte absent</span>';
    $('netline').innerHTML = t; $('netline').style.display='';
  } else $('netline').style.display='none';

  const w = $('who');
  w.textContent = !S.started ? '' : over ? '🏁 Fin de partie' : (net && S.cur===mySeat() ? `🎲 À toi, ${pname(S.cur)} !` : `🎲 ${pname(S.cur)}`);
  w.classList.toggle('mine', net && S.cur===mySeat() && !over);
  if(S.started && shownCur!==null && S.cur!==shownCur){ w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  shownCur = S.cur;
  document.title = (net && can && S.cur===mySeat()) ? '▶ À toi – Yams' : 'Yams – Feuille de score';

  for(let i=1;i<=3;i++){
    $('p'+i).className = 'pill' + (i<=S.rolls?' done':'') + (i===S.rolls+1 && !over && S.started?' next':'');
  }
  $('roll').disabled = !can || S.rolls>=3 || (S.rolls>0 && S.held.every(Boolean));
  $('clear').disabled = !can || S.dice.every(v=>!v);
  $('validate').disabled = !can || !S.sel || !ready();

  const shake = (S.rid!==shownRid && shownRid!==null) ? S.shk : null;
  shownRid = S.rid;
  renderDice(shake); renderSheet(); renderHint();

  $('newgame').textContent = net ? 'Quitter la salle' : 'Nouvelle partie';
  $('replay').style.display = (NET.role==='host' && over) ? '' : 'none';

  const b = $('banner');
  if(over){
    let best=-1, win=[];
    for(let p=0;p<S.nb;p++){ const s=totals(p).score; if(s>best){best=s;win=[p]} else if(s===best) win.push(p); }
    const nm = win.map(w=>esc(pname(w)));
    b.innerHTML = S.nb===1 ? `🏁 Score final : ${best} points` :
      `🏆 ${nm.length>1?'Égalité entre '+nm.join(' et '):'Victoire de '+nm[0]} avec ${best} points !`;
    if(NET.role==='guest') b.innerHTML += '<div class="msg" style="margin-top:6px">L\'hôte peut relancer une partie avec les mêmes joueurs.</div>';
    b.classList.add('show');
  } else b.classList.remove('show');
}

/* ---------- démarrage ---------- */
(async function init(){
  const net = load('yams-net');
  if(net && (net.role==='host' || net.role==='guest') && net.code){
    // reprise automatique de la salle après un rechargement
    if(net.role==='host'){ const hs = load('yams-host'); S = hs ? normalizeSolo(hs) : fresh({}); }
    renderAll();
    try{
      await enterRoom(net.role, net.code, net.name);
      if(net.role==='host'){ if(S.started) hideSetup(); else showSetup('lobbyHost'); }
      else if(!S.started) showSetup('lobbyGuest');
      renderAll();
      return;
    }catch(e){
      store('yams-net', null);
      NET.role='solo'; S = fresh({});
      setupMsg = 'Impossible de revenir dans la salle précédente.'; setupErr = true;
      view='home'; renderSetup(); $('setup').classList.add('show'); renderAll();
      return;
    }
  }
  const solo = load('yams-state-v2');
  if(solo && solo.scores) S = normalizeSolo(solo);
  renderAll();
  if(!S.started) showSetup('home');
})();
</script>
</body>
</html>
