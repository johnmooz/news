<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur de code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* VOICE: précis, calme, outil de travail quotidien
   IDEA: l'établi du programmeur — une feuille blanche, une marge numérotée, un carnet d'erreurs en bas
   PICTURE: l'éditeur lui-même, plein écran, avec un vrai document ouvert et ses problèmes
   COLOUR and TYPE: papier blanc, encre graphite, cobalt pour l'action, rouge brique pour les erreurs ; Plex Sans + JetBrains Mono
   LAYOUT: barre de menus, outils, onglets, éditeur, problèmes, barre d'état ; aperçu à droite (ou par-dessus sur téléphone) */
:root{color-scheme:light dark;
--bg:light-dark(#efeee9,#15161a);--paper:light-dark(#ffffff,#1c1e23);--ink:light-dark(#1a1c20,#e6e6e2);--mut:light-dark(#6a6e76,#959aa4);
--line:light-dark(#d9d7d0,#2d3037);--hov:light-dark(#e4e2db,#262930);--acc:light-dark(#2546d8,#8ea5ff);--accInk:light-dark(#fff,#0d1020);
--gutbg:light-dark(#f6f5f1,#191b20);--curl:light-dark(#f3f5fd,#22252d);--sel:light-dark(rgba(37,70,216,.22),rgba(142,165,255,.28));
--err:light-dark(#c8231c,#ff7b72);--warn:light-dark(#a35f00,#e3b341);--info:light-dark(#2f6db5,#79b8ff);
--errbg:light-dark(rgba(200,35,28,.08),rgba(255,123,114,.1));--warnbg:light-dark(rgba(163,95,0,.08),rgba(227,179,65,.09));
--k:light-dark(#7a1fa2,#d2a8ff);--s:light-dark(#0a7a3a,#8ddb8c);--c:light-dark(#8a8e96,#7d8590);--n:light-dark(#b0490a,#f2a65a);
--t:light-dark(#1d4ed8,#79b8ff);--f:light-dark(#0e6f86,#5fd0e6);--p:light-dark(#b8175a,#f78fc0);--v:light-dark(#8a4b00,#e8c27a);
--fs:14px;--mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;--gut:48px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:6px;padding:4px 8px 0;background:var(--bg)}
.brand{font-weight:600;font-size:13px;padding:0 6px 0 2px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand svg{width:18px;height:18px}
.menubar{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.menubar button,.status>*,.tabs>*,.phd>*{flex:none}
.phd .grow,.status .grow{flex:1}
.menubar::-webkit-scrollbar{display:none}
.menubar button{background:none;border:0;padding:7px 10px;border-radius:6px;white-space:nowrap;min-height:34px}
.menubar button:hover,.menubar button.on{background:var(--hov)}
.tools{display:flex;gap:2px;align-items:center;padding:4px 8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tools::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:7px;padding:6px 8px;min-height:36px;white-space:nowrap;flex:none}
.tb:hover{background:var(--hov)}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.pri{background:var(--acc);color:var(--accInk)}
.tb.pri:hover{filter:brightness(1.08)}
.tb span{font-size:13px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.tools select{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 8px;min-height:36px;flex:none}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:thin;background:var(--bg)}
.tab{display:flex;align-items:center;gap:6px;padding:6px 6px 7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--hov);white-space:nowrap;flex:none;max-width:240px;cursor:pointer;font-size:13px}
.tab.on{background:var(--paper);position:relative;top:1px}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .dotm{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.tab .x{border:0;background:none;width:24px;height:24px;border-radius:5px;line-height:1;font-size:16px;color:var(--mut)}
.tab .x:hover{background:var(--line);color:var(--ink)}
.tabadd{border:0;background:none;width:32px;height:30px;border-radius:7px;font-size:18px;flex:none}
.tabadd:hover{background:var(--hov)}
.findbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.findbar input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);width:200px;font-size:16px}
.findbar .tb{min-height:32px;padding:4px 9px;border-color:var(--line)}
.findbar label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut);white-space:nowrap}
#fcount{font-size:12px;color:var(--mut);min-width:54px}
.findbar .rep{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.findbar.norep .rep{display:none}
.work{flex:1;display:flex;min-height:0;background:var(--paper);border-top:1px solid var(--line);position:relative}
.ed{position:relative;flex:1;overflow:hidden;background:var(--paper)}
.gutbg{position:absolute;top:0;bottom:0;left:0;width:var(--gut);background:var(--gutbg);border-right:1px solid var(--line)}
.ed.nonum .gutbg{display:none}
#hl,#ta{position:absolute;inset:0;margin:0;border:0;font-family:var(--mono);font-size:var(--fs);line-height:1.55;tab-size:4;-moz-tab-size:4;
font-variant-ligatures:none;letter-spacing:0;padding:10px 14px 45vh var(--gut);white-space:pre;overflow-wrap:normal;word-break:normal}
.ed.wrap #hl,.ed.wrap #ta{white-space:pre-wrap;overflow-wrap:anywhere}
#hl{overflow:hidden;pointer-events:none;color:var(--ink)}
#ta{width:100%;height:100%;resize:none;outline:0;background:transparent;color:transparent;caret-color:var(--ink);overflow:auto}
#ta::selection{background:var(--sel);color:transparent}
#ta::placeholder{color:var(--mut)}
.l{position:relative;padding-left:14px;margin-left:-14px}
.l .no{position:absolute;left:calc(-1 * var(--gut) + 14px);top:0;bottom:0;width:calc(var(--gut) - 1px);padding-right:12px;text-align:right;color:var(--mut);background:var(--gutbg);transform:translateX(var(--sx,0px));font-size:.86em;line-height:calc(var(--fs) * 1.55 / .86 * .86 + 0px);user-select:none}
.ed.nonum .l .no{display:none}
.l.cur{background:var(--curl)}
.l.e{background:var(--errbg)}.l.w{background:var(--warnbg)}
.l.e .no{color:var(--err);box-shadow:inset 3px 0 var(--err)}
.l.w .no{color:var(--warn);box-shadow:inset 3px 0 var(--warn)}
.l.i .no{box-shadow:inset 3px 0 var(--info)}
.k{color:var(--k)}.s{color:var(--s)}.c{color:var(--c);font-style:italic}.n{color:var(--n)}.t{color:var(--t)}.f{color:var(--f)}.p{color:var(--p)}.v{color:var(--v)}.tg{color:var(--t)}.at{color:var(--v)}
.drop{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px dashed var(--acc);z-index:5;font-weight:600;color:var(--acc)}
.ed.dragover .drop{display:grid}
.preview{width:min(46%,640px);display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--paper)}
.phead{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.phead .grow{flex:1}
.phead .tb{min-height:32px;padding:4px 9px}
#pframe{flex:1;border:0;background:#fff;width:100%}
#pcons{max-height:40%;overflow:auto;font:12.5px/1.5 var(--mono);border-top:1px solid var(--line);background:var(--gutbg)}
#pcons:empty{display:none}
#pcons div{padding:3px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
#pcons .warn{color:var(--warn)}#pcons .error{color:var(--err)}
.problems{border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;max-height:34vh}
.phd{display:flex;align-items:center;gap:8px;padding:4px 8px;min-height:38px}
.phd .ttl{background:none;border:0;font-weight:600;display:flex;align-items:center;gap:8px;padding:6px 4px;min-height:34px}
.phd .ttl::before{content:"";width:0;height:0;border:5px solid transparent;border-left-color:currentColor;transform:rotate(90deg) translateX(2px);transition:transform .15s}
.problems.shut .phd .ttl::before{transform:none}
.badge{font-size:12px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--hov);white-space:nowrap}
.badge.e{color:var(--err)}.badge.w{color:var(--warn)}.badge.i{color:var(--info)}.badge.ok{color:var(--s)}
.phd .grow{flex:1}
.phd .tb{min-height:32px;padding:4px 10px;border-color:var(--line)}
#plist{list-style:none;margin:0;padding:0 0 6px;overflow:auto}
.problems.shut #plist{display:none}
.pi{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:7px 10px;border-top:1px solid var(--line)}
.pi:hover{background:var(--hov)}
.pi .dot{width:9px;height:9px;border-radius:50%;margin-top:6px}
.pi.e .dot{background:var(--err)}.pi.w .dot{background:var(--warn)}.pi.i .dot{background:var(--info)}
.pi .go{background:none;border:0;padding:0;color:var(--acc);font-weight:500;white-space:nowrap;min-height:24px;text-align:left}
.pi .pm{font-size:13.5px}
.pi code{display:block;margin-top:3px;font:12.5px/1.45 var(--mono);color:var(--s);overflow-wrap:anywhere;white-space:pre-wrap}
.pi .fx{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:6px;padding:3px 10px;font-size:12.5px;min-height:30px;white-space:nowrap}
.pi .fx:hover{background:var(--acc);color:var(--accInk)}
.pempty{padding:10px 14px;color:var(--mut);font-size:13px}
.status{display:flex;gap:4px 14px;align-items:center;padding:4px 12px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);background:var(--bg);white-space:nowrap;overflow-x:auto;scrollbar-width:none;min-height:28px}
.status::-webkit-scrollbar{display:none}
.status button{background:none;border:0;padding:2px 4px;color:inherit;border-radius:4px;font-size:12px}
.status button:hover{background:var(--hov);color:var(--ink)}
.status .grow{flex:1}
.status .mod{color:var(--acc)}
.menu{position:fixed;z-index:30;min-width:250px;max-width:calc(100vw - 16px);max-height:72vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);padding:5px}
.menu button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px 7px 6px;min-height:36px}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--hov);outline:0}
.menu button:disabled{color:var(--mut);cursor:default}
.menu .kb{color:var(--mut);font-size:12px;white-space:nowrap}
.menu .ck{color:var(--acc);font-weight:600;text-align:center}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .mh{font-size:11.5px;color:var(--mut);padding:6px 10px 2px 30px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,18,.42);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h2{margin:0;font-size:17px;padding:16px 18px 6px}
#mb{padding:6px 18px 4px;font-size:14px}
#mb p{margin:6px 0}
#mb input[type=text],#mb input[type=number]{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:6px 0}
#mb table{border-collapse:collapse;width:100%;font-size:13px}
#mb td{padding:5px 6px;border-bottom:1px solid var(--line)}
#mb td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--acc)}
#mb td.r{text-align:right;font-variant-numeric:tabular-nums}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.mf button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;min-height:40px}
.mf button.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.tgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;min-height:56px}
.tgrid button:hover{border-color:var(--acc)}
.tgrid b{font-weight:600}
.tgrid small{color:var(--mut);font-family:var(--mono);font-size:12px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:20px;font-size:13.5px;max-width:calc(100vw - 32px);text-align:center;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
.hide-sm{display:inline}
@media (pointer:coarse){:root{--fs:16px}}
@media (max-width:700px){
 .tb span.lab{display:none}.hide-sm{display:none}
 .preview{position:absolute;inset:0;width:auto;z-index:8;border-left:0}
 .brand .bt{display:none}
 .pi{grid-template-columns:auto minmax(0,1fr) auto}.pi .go{grid-column:2}.pi .pm{grid-column:1/-1;grid-row:2}.pi .fx{grid-column:3;grid-row:1}
 .problems{max-height:42vh}
}
@media (prefers-reduced-motion:reduce){#toast,.phd .ttl::before{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6 2 12l6 6M16 6l6 6-6 6M13.5 4l-3 16"/></svg><span class="bt">Éditeur</span></div>
    <nav class="menubar" id="menubar" aria-label="Menus"></nav>
  </header>
  <div class="tools" id="tools">
    <button class="tb" data-act="newDoc" title="Nouveau (Alt+N)"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span class="lab">Nouveau</span></button>
    <button class="tb" data-act="chooseTemplate" title="Nouveau depuis un modèle"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg><span class="lab">Modèle</span></button>
    <button class="tb" data-act="openFile" title="Ouvrir (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg><span class="lab">Ouvrir</span></button>
    <button class="tb" data-act="save" title="Enregistrer (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span class="lab">Enregistrer</span></button>
    <span class="sep"></span>
    <button class="tb" data-act="undo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" data-act="redo" title="Rétablir (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="tb" data-act="cut" title="Couper (Ctrl+X)"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.2 15.8 19 4M15.8 15.8 5 4"/></svg></button>
    <button class="tb" data-act="copy" title="Copier (Ctrl+C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
    <button class="tb" data-act="paste" title="Coller (Ctrl+V)"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/></svg></button>
    <span class="sep"></span>
    <button class="tb" data-act="findOpen" title="Rechercher (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="lab hide-sm">Rechercher</span></button>
    <button class="tb" data-act="formatDoc" title="Formater / réindenter (Maj+Alt+F)"><svg viewBox="0 0 24 24"><path d="M4 6h16M8 10h12M8 14h12M4 18h16"/></svg><span class="lab hide-sm">Formater</span></button>
    <button class="tb pri" data-act="checkNow" title="Vérifier la syntaxe (F7)"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span class="lab">Vérifier</span></button>
    <button class="tb" data-act="run" title="Exécuter / aperçu (F9)"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg><span class="lab">Aperçu</span></button>
    <span class="sep"></span>
    <select id="langSel" aria-label="Langage du document"></select>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="findbar norep" id="findbar" hidden>
    <input type="text" id="fq" placeholder="Rechercher" aria-label="Texte à rechercher" autocomplete="off" spellcheck="false">
    <span id="fcount"></span>
    <button class="tb" data-act="findPrev" title="Précédent (Maj+F3)" aria-label="Précédent">‹</button>
    <button class="tb" data-act="findNextB" title="Suivant (F3)" aria-label="Suivant">›</button>
    <label><input type="checkbox" id="fcase"> Aa</label>
    <label><input type="checkbox" id="fre"> Regex</label>
    <span class="rep"><input type="text" id="fr" placeholder="Remplacer par" aria-label="Texte de remplacement" autocomplete="off" spellcheck="false">
    <button class="tb" data-act="replOne">Remplacer</button><button class="tb" data-act="replAll">Tout remplacer</button></span>
    <button class="tb" data-act="findClose" aria-label="Fermer la recherche">✕</button>
  </div>
  <div class="work">
    <div class="ed" id="ed">
      <div class="gutbg"></div>
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="ta" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" wrap="off" aria-label="Zone d'édition"></textarea>
      <div class="drop">Déposez vos fichiers pour les ouvrir</div>
    </div>
    <aside class="preview" id="preview" hidden>
      <div class="phead"><span id="ptitle">Aperçu</span><span class="grow"></span>
        <button class="tb" data-act="runAgain" title="Relancer">↻ <span class="lab">Relancer</span></button>
        <button class="tb" data-act="previewClose" aria-label="Fermer l'aperçu">✕</button></div>
      <iframe id="pframe" sandbox="allow-scripts allow-modals" title="Aperçu"></iframe>
      <div id="pcons"></div>
    </aside>
  </div>
  <section class="problems" id="problems">
    <div class="phd">
      <button class="ttl" data-act="toggleProblems" aria-expanded="true">Problèmes</button>
      <span id="pbadges"></span><span class="grow"></span>
      <button class="tb" data-act="fixAll" id="fixAllBtn">Tout corriger</button>
    </div>
    <ul id="plist"></ul>
  </section>
  <footer class="status" id="status"></footer>
</div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt"></h2><div id="mb"></div><div class="mf" id="mf"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" multiple hidden>
<script>

function pyLine(c,i){

/* ---------- BASIC ---------- */
function chkBasic(c){
  const {M,lines}=c;const st=[],labels=new Set(),jumps=[];
  const CL={if:'END IF',for:'NEXT',while:'WEND',do:'LOOP',sub:'END SUB',function:'END FUNCTION',select:'END SELECT',type:'END TYPE'};
  const cs=(li,s)=>{const w=(/[A-Za-z]+/.exec(lines[li].replace(/"[^"]*"/g,'').replace(/^\s*\d+/,''))||['A'])[0];return w===w.toUpperCase()?s:s.toLowerCase();};
  const close=(kind,li,label)=>{let k=st.length-1;while(k>=0&&st[k].k!==kind)k--;
    if(k<0){c.add(li,'e',`${label} sans ${({if:'IF … THEN',for:'FOR',while:'WHILE',do:'DO',sub:'SUB',function:'FUNCTION',select:'SELECT CASE',type:'TYPE'})[kind]} correspondant`,{del:li});return null;}
    for(let j=st.length-1;j>k;j--){const o=st[j];c.add(o.li,'e',`Bloc ${o.k.toUpperCase()} non fermé (il manque ${CL[o.k]})`,{ins:li,t:indentOf(lines[o.li])+cs(o.li,CL[o.k])});}
    const top=st[k];st.length=k;return top;};
  M.forEach((raw,li)=>{
    let s=raw.toLowerCase();const num=/^\s*(\d+)\s*/.exec(s);if(num){labels.add(num[1]);s=' '.repeat(num[0].length)+s.slice(num[0].length);}
    const lab=/^\s*([a-z_]\w*):(?!=)/.exec(s);if(lab&&!/^(else|then|rem)$/.test(lab[1])){labels.add(lab[1]);s=' '.repeat(lab[0].length)+s.slice(lab[0].length);}
    let off=0;
    for(const part of s.split(':')){const pos=off;off+=part.length+1;const p=part.trim();if(!p)continue;let r;
      if(/^if\b/.test(p)){if(!/\bthen\b/.test(p)&&!/\bgoto\b/.test(p)){const kw=/\s+(print|input|goto|gosub|cls|end|exit|return|beep|let|call|locate|color|sleep)\b/.exec(M[li].toLowerCase().slice(pos));
        let fx;if(kw){const at=pos+kw.index;fx=lines[li].slice(0,at)+cs(li,' THEN')+lines[li].slice(at);}else fx=insAtEnd(lines[li],M[li],cs(li,' THEN'));c.add(li,'e','IF sans THEN',{l:li,t:fx});}else if(/\bthen\s*$/.test(p))st.push({k:'if',li});}
      else if(/^(end\s*if|endif)\b/.test(p))close('if',li,'END IF');
      else if(/^for\b/.test(p)){r=/^for\s+([a-z_]\w*[$%!#&]?)/.exec(p);if(!/\bto\b/.test(p))c.add(li,'e','FOR sans TO');if(!/=/.test(p))c.add(li,'e','FOR : il manque « = valeur de départ »');st.push({k:'for',li,v:r&&r[1]});}
      else if(/^next\b/.test(p)){r=/^next\s+([a-z_]\w*[$%!#&]?)/.exec(p);const top=close('for',li,'NEXT');if(top&&r&&top.v&&r[1]!==top.v){const L0=lines[li];c.add(li,'w',`NEXT ${r[1]} ne correspond pas à FOR ${top.v} (ligne ${top.li+1})`,{l:li,t:L0.replace(new RegExp('(next\\s+)'+reEsc(r[1]),'i'),'$1'+top.v)});}}
      else if(/^while\b/.test(p))st.push({k:'while',li});
      else if(/^(wend|end\s+while)\b/.test(p))close('while',li,'WEND');
      else if(/^do\b/.test(p))st.push({k:'do',li});
      else if(/^loop\b/.test(p))close('do',li,'LOOP');
      else if((r=/^(sub|function)\s+[a-z_]/.exec(p))&&!/^(sub|function)\s+\w+\s*=/.test(p))st.push({k:r[1],li});
      else if((r=/^end\s+(sub|function|select|type)\b/.exec(p)))close(r[1],li,'END '+r[1].toUpperCase());
      else if(/^select\s+case\b/.test(p))st.push({k:'select',li});
      else if(/^type\s+[a-z_]\w*\s*$/.test(p))st.push({k:'type',li});
      const jr=/\b(goto|gosub)\s+([a-z_0-9]\w*)/g;while((r=jr.exec(p)))jumps.push({li,t:r[2]});
      if((r=/\bthen\s+(\d+)\s*$/.exec(p)))jumps.push({li,t:r[1]});
      if(/^print\b/.test(p)&&/"\s+[a-z_]\w*[$%]?\s*$/.test(p)&&!/[;,+&]\s*[a-z_]\w*[$%]?\s*$/.test(p)){c.add(li,'w','PRINT : séparez le texte et la variable par « ; » ou « , »',{l:li,t:lines[li].replace(/"(\s+)([A-Za-z_]\w*[$%]?\s*)$/,'"; $2')});}
    }
    replAt(c,li,/==/,'=','e','En BASIC la comparaison s\'écrit « = »');
    replAt(c,li,/!=/,'<>','e','En BASIC « différent de » s\'écrit « <> »');
    replAt(c,li,/\s*&&\s*/,cs(li,' AND '),'e','En BASIC on écrit AND');
    replAt(c,li,/\s*\|\|\s*/,cs(li,' OR '),'e','En BASIC on écrit OR');
  });
  st.forEach(o=>c.add(o.li,'e',`Bloc ${o.k.toUpperCase()} jamais fermé (il manque ${CL[o.k]})`,{ins:guessEnd(lines,o.li),t:indentOf(lines[o.li])+cs(o.li,CL[o.k])}));
  jumps.forEach(j=>{if(!labels.has(j.t)){const s=nearest(j.t,[...labels],2);c.add(j.li,'e',`Étiquette ou numéro de ligne « ${j.t} » introuvable`+(s?` — vouliez-vous « ${s} » ?`:''),s?{l:j.li,t:lines[j.li].replace(new RegExp('\\b'+reEsc(j.t)+'\\b','i'),s)}:null);}});
}

/* ---------- Pascal / Delphi ---------- */
function chkPascal(c){

      else if(w==='class'||w==='object'||w==='interface'){const b=m.slice(0,r.index);if(/=\s*(packed\s+)?$/.test(b)&&!/^\s*(\([^)]*\))?\s*(;|of\b|function|procedure)/.test(m.slice(r.index+w.length)))st.push({k:w,li:i});}
      else if(w==='until'){let k=st.length-1;if(k>=0&&st[k].k==='repeat')st.pop();else c.add(i,'e','« until » sans « repeat » correspondant');}
      else if(w==='end'){if(!st.length){c.add(i,'e','« end » sans « begin » correspondant',{del:i});}else{const o=st.pop();if(o.k==='repeat'){c.add(o.li,'e','« repeat » doit se terminer par « until »');}}}
    }
  });
  st.forEach(o=>{if(o.k==='repeat')c.add(o.li,'e','« repeat » jamais fermé par « until »',{ins:guessEnd(lines,o.li),t:indentOf(lines[o.li])+'until True;'});else c.add(o.li,'e',`« ${o.k} » jamais fermé par « end »`,{ins:guessEnd(lines,o.li),t:indentOf(lines[o.li])+'end;'});});
  if(low.some(x=>/^\s*(program|unit|library)\b/.test(x))){const j=(()=>{for(let k=low.length-1;k>=0;k--)if(low[k].trim())return k;return -1;})();
    if(j>=0&&/^\s*end\s*;?\s*$/.test(low[j]))c.add(j,'e','Le programme doit se terminer par « end. » (avec un point)',{l:j,t:lines[j].replace(/end\s*;?/i,m=>m.startsWith('E')?'End.':'end.')});
    else if(j>=0&&!/\bend\.\s*$/.test(low[j]))c.add(j,'w','Fin de programme « end. » absente');}
  low.forEach((m,i)=>{const t=m.trim();if(!t)return;const L0=lines[i];
    if(/^(const|type|var|label|uses)\b/.test(t))section=t.match(/^\w+/)[0];else if(/^(begin|procedure|function|constructor|destructor|implementation|interface)\b/.test(t))section='';
    const nx=nextNon(low,i);
    if(/^(if|else\s+if)\b/.test(t)&&!/\bthen\b/.test(t)&&!/^(then|and|or|not|\()/.test(nx)&&pdep[i]===0)c.add(i,'e','« if » sans « then »',{l:i,t:insAtEnd(L0,M[i],upperStyle(L0)?' THEN':' then')});
    if(/^(while|for|with)\b/.test(t)&&!/\bdo\b/.test(t)&&!/^(do|and|or)\b/.test(nx)&&pdep[i]===0)c.add(i,'e',`« ${t.match(/^\w+/)[0]} » sans « do »`,{l:i,t:insAtEnd(L0,M[i],upperStyle(L0)?' DO':' do')});
    if(/^for\b/.test(t)&&!/\b(to|downto|in)\b/.test(t))c.add(i,'e','« for » sans « to » ni « downto »');
    if(/^for\s+\w+\s*=(?!=)/.test(t))replAt(c,i,/(?<=^\s*for\s+\w+\s*)=/i,':=','e','Dans une boucle for, l\'affectation s\'écrit « := »');
