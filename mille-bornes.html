<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mille Bornes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: jeu de course familial, nerveux et lisible
   IDEA: une table de jeu la nuit, circuit éclairé, cartes posées sur le tapis
   PICTURE: le circuit (plateau) ou les routes de chaque pilote (classique) ; véhicules dessinés qui se transforment
   COLOUR and TYPE: asphalte bleu nuit, blanc de bornes, rouge signal, vert départ ; Racing Sans One + Barlow
   LAYOUT: pilotes en haut, piste au centre, main du joueur collée en bas de l'écran */
:root{color-scheme:dark;--bg:#101a2e;--bg2:#17243f;--panel:#1d2c4d;--ink:#f4f6fb;--muted:#a8b4cf;--red:#e8333a;--green:#25a85a;--gold:#f2c12e;--line:#ffffff1f;--cw:min(calc((100vw - 52px) / 7),68px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(120% 60% at 50% 0,#22355f,var(--bg) 70%) fixed;color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.disp{font-family:"Racing Sans One",Barlow,sans-serif;letter-spacing:.02em}
/* ---- setup ---- */
.setup{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}
.logo{text-align:center;margin:6px 0 18px}
.logo .l{font-family:"Racing Sans One",sans-serif;font-size:clamp(44px,14vw,64px);line-height:.95;color:#fff;text-shadow:0 3px 0 var(--red),0 6px 0 #0006}
.logo .l b{color:var(--red);text-shadow:0 3px 0 #fff,0 6px 0 #0006;font-weight:400}
.logo small{display:block;color:var(--muted);margin-top:8px}
h3{margin:20px 0 8px;font-size:15px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;padding:8px 10px;border-radius:12px;background:var(--panel);border:2px solid transparent;font-weight:800;text-align:center}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.seg button.on{border-color:var(--gold);background:#2a3c66}
.seg.nums button{flex:0 0 52px;font-size:20px}
.pcard{background:var(--panel);border-radius:16px;padding:12px;margin-bottom:10px;border-left:6px solid var(--pc)}
.prow{display:flex;gap:10px;align-items:center}
.pveh{width:64px;flex:none}
.prow input{width:0;flex:1;font:inherit;font-size:16px;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1a30;color:var(--ink);min-height:44px}
.pcard .seg{margin:10px 0}
.pcard .seg button{min-height:40px;font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid #ffffff33}
.sw button.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.sw button:disabled{opacity:.25}
.big{display:block;width:100%;margin-top:18px;min-height:56px;border-radius:16px;background:linear-gradient(#ff4d52,#c8222a);font-family:"Racing Sans One",sans-serif;font-size:24px;box-shadow:0 4px 0 #7d1015}
.link{display:block;margin:14px auto 0;color:var(--muted);text-decoration:underline;min-height:44px}
/* ---- game ---- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#0d1628ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header .t{font-family:"Racing Sans One",sans-serif;font-size:20px;flex:1;white-space:nowrap}
header .t span{color:var(--red)}
.pile{font-size:13px;color:var(--muted);text-align:right;line-height:1.15}
.pile b{color:var(--ink)}
.menu,.snd{width:42px;height:42px;border-radius:12px;background:var(--panel);font-size:20px;display:grid;place-items:center;flex:none}
.snd svg{width:22px;height:22px}.snd.off{opacity:.4}.snd.off svg .x{display:inline}.snd svg .x{display:none}
@media(max-width:400px){header .t{font-size:17px}header{gap:6px}.pile{font-size:12px}}
.dice{width:44px;height:44px;flex:none;border-radius:10px;background:#2a3c66;display:grid;place-items:center}
.dice svg{width:24px;height:24px}
.rndall{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rndall button{min-height:40px;padding:0 12px;border-radius:10px;background:#2a3c66;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.rndall button svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding:10px 10px 250px}
.pl{background:var(--panel);border-radius:14px;padding:8px 10px 10px;margin-bottom:8px;border:2px solid transparent}
.pl.cur,.pm.cur{border-color:var(--gold);box-shadow:0 0 18px #f2c12e40}
.plh{display:flex;align-items:center;gap:8px}
.pn{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn i{font-style:normal;font-weight:400;color:var(--muted);font-size:13px}
.km{font-family:"Racing Sans One",sans-serif;font-size:18px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px #fff4}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px;border-radius:12px;font-size:13px;font-weight:600;background:#ffffff14;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip.ok{background:#25a85a33;color:#8ff0b5}.chip.bad{background:#e8333a33;color:#ffb3b5}.chip.gold{background:#f2c12e2e;padding:0 4px}
.chip.gold svg{width:30px}
.road{position:relative;height:38px;margin-top:6px;border-radius:8px;background:linear-gradient(#3b4252,#2b303c);border-top:2px solid #ddd;border-bottom:2px solid #ddd;overflow:hidden}
.road::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed #ffffff70}
.road .bn{position:absolute;top:0;bottom:0;width:1px;background:#ffffff30}
.road .bn span{position:absolute;bottom:1px;left:3px;font-size:10px;color:#ffffffa0}
.road .fin{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/10px 10px}
.rcar{position:absolute;top:3px;width:52px;left:calc((100% - 62px) * var(--p));transition:left .9s cubic-bezier(.3,.7,.3,1)}
.pms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.pm{background:var(--panel);border-radius:12px;padding:6px 8px;border:2px solid transparent}
.pm .plh .v{width:38px;flex:none}
.boardw{position:relative;margin:4px 0 6px;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0008}
.boardw>svg{display:block;width:100%;height:auto}
.bcar{position:absolute;width:10%;z-index:2;transition:left .19s linear,top .19s linear;filter:drop-shadow(0 2px 2px #000a);pointer-events:none}
.bcar.cur{z-index:4}
.bcar.cur::after{content:"";position:absolute;left:10%;right:10%;bottom:-3px;height:4px;border-radius:2px;background:var(--gold)}
.bcar svg.flip{transform:scaleX(-1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#111}
.log{font-size:13px;color:var(--muted);background:#0c1527;border-radius:12px;padding:8px 10px;min-height:58px}
.log div:first-child{color:var(--ink);font-weight:600}
/* ---- hand ---- */
#hand{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0b1324f2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
#hand .in{max-width:720px;margin:0 auto}
.hinfo{font-size:14px;font-weight:600;margin:0 2px 6px;display:flex;gap:6px;align-items:center}
.hinfo .dot{width:10px;height:10px}
.hcards{display:flex;gap:5px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:44px;align-items:center}
.acts button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--panel);font-weight:800;font-size:15px}
.acts button.go{background:var(--green)}.acts button.atk{background:var(--red)}
.acts button:disabled{opacity:.35}
.acts .why{font-size:13px;color:#ffb3b5;flex-basis:100%}
.acts .hint{font-size:13px;color:var(--muted)}
/* ---- cards ---- */
.card{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:9px;background:#fbfaf5;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 3px;box-shadow:0 2px 6px #0007;border:2px solid #ccc;flex:0 0 auto;font-size:calc(var(--cw)*.14);text-align:center;transition:transform .15s,box-shadow .15s;position:relative}
.card .ct{font-weight:800;text-transform:uppercase;font-size:.85em;letter-spacing:.03em}
.card .ci{width:78%;flex:1;display:grid;place-items:center}
.card .ci svg{width:100%;height:auto;max-height:100%}
.card .cn{font-size:.85em;max-height:2.2em;overflow:hidden;line-height:1.05;font-weight:700}
.card.atk{border-color:var(--red);background:linear-gradient(#fff,#ffe9e9)}.card.atk .ct{color:var(--red)}
.card.rem{border-color:var(--green);background:linear-gradient(#fff,#e7f8ec)}.card.rem .ct{color:#178a46}
.card.botte{border-color:#c99a0c;background:linear-gradient(#fff9e0,#ffe38a)}.card.botte .ct{color:#8a6500}
.card.dist{border-color:#2b5fd0;background:linear-gradient(#fff,#e8f0ff)}.card.dist .ct{color:#2b5fd0;font-size:1.9em;font-family:"Racing Sans One",sans-serif;letter-spacing:0}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 8px 14px #000a}
.card.off{filter:saturate(.35) brightness(.8)}
.back{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:9px;flex:0 0 auto;background:repeating-linear-gradient(45deg,#c8222a 0 6px,#e8333a 6px 12px);border:3px solid #fff}
/* ---- overlays ---- */
.ov{position:fixed;inset:0;z-index:40;background:#060b17d9;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.box{background:var(--bg2);border-radius:20px;padding:20px;max-width:480px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--line);box-shadow:0 20px 50px #000}
.box h2{font-family:"Racing Sans One",sans-serif;font-weight:400;font-size:30px;margin:0 0 8px;line-height:1.05}
.box p,.box li{color:#d6dcea;font-size:15px}
.box ul{padding-left:18px}
.box .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.box .row button{flex:1;min-height:48px;border-radius:12px;background:var(--panel);font-weight:800}
.box .row button.go{background:var(--green)}.box .row button.atk{background:var(--red)}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank .pos{font-family:"Racing Sans One",sans-serif;font-size:24px;width:30px;color:var(--gold)}
.rank .v{width:58px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));z-index:30;transform:translate(-50%,-20px);opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tbox{display:flex;gap:10px;align-items:center;background:#0b1324f5;border:2px solid var(--pc);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px #000c;--cw:52px;min-width:220px}
.tbox b{font-size:15px}.tbox div{font-size:14px;line-height:1.25}
.tbox .cf{color:var(--gold);font-family:"Racing Sans One",sans-serif;font-size:20px}
.pass{text-align:center}
.pass .v{width:140px;margin:10px auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="ov" id="ov"><div class="box" id="ovb"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GOAL=1000, AI_DELAY=1100;
const COLORS=[['#e8333a','Rouge'],['#1e88e5','Bleu'],['#fdd835','Jaune'],['#2fae55','Vert'],['#fb8c00','Orange'],['#8e44ad','Violet'],['#3d4450','Noir'],['#ec5f9a','Rose']];

/* ---------- dessins ---------- */
const wheel=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#171717"/><circle cx="${x}" cy="${y}" r="${r*.45}" fill="#cfd3da"/>`;
const SK='stroke="#0007" stroke-width="1"';
function veh(type,col){
  let b='';
  const cab=`<path d="M43 27V12h8l7 8v7z" fill="${col}" ${SK}/><path d="M45 14h5l5 6h-10z" fill="#cfe8ff"/>`;
  if(type==='pompier'){
    b=`<rect x="3" y="11" width="41" height="16" rx="2" fill="${col}" ${SK}/>${cab}
    <rect x="4" y="19" width="39" height="3" fill="#fff"/>
    <g stroke="#e9e9e9" stroke-width="1.4"><line x1="4" y1="6" x2="41" y2="6"/><line x1="4" y1="9.5" x2="41" y2="9.5"/>${[6,11,16,21,26,31,36,40].map(x=>`<line x1="${x}" y1="6" x2="${x}" y2="9.5"/>`).join('')}</g>
    <rect x="46" y="8.5" width="6" height="3.5" rx="1.5" fill="#2d8cff"/><circle cx="49" cy="10" r="4" fill="#2d8cff" opacity=".3"/>
    ${wheel(11,28,4.6)}${wheel(30,28,4.6)}${wheel(51,28,4.6)}`;
  }else if(type==='citerne'){
    b=`<rect x="2" y="24" width="42" height="3" fill="#333"/>
    <rect x="2" y="8" width="40" height="16" rx="8" fill="${col}" ${SK}/>
    <rect x="8" y="10.5" width="28" height="3" rx="1.5" fill="#fff" opacity=".5"/>
    <rect x="18" y="5.5" width="6" height="3" rx="1" fill="#555"/>${cab}
    ${wheel(10,28,4.6)}${wheel(22,28,4.6)}${wheel(51,28,4.6)}`;
  }else if(type==='increvable'){
    b=`<g transform="translate(0,-4)"><path d="M5 22 L7 15 Q9 11 15 11 L21 11 L27 5 Q29 4 33 4 L43 4 Q47 4 50 8 L54 12 Q59 13 59 18 L59 22 Z" fill="${col}" ${SK}/>
    <path d="M25 11 L30 6.5 L37 6.5 L37 11Z" fill="#cfe8ff"/><path d="M40 6.5 L46 6.5 L50 11 L40 11Z" fill="#cfe8ff"/></g>
    ${[15,48].map(x=>`<circle cx="${x}" cy="25" r="8" fill="#171717"/><circle cx="${x}" cy="25" r="7.2" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="2 2"/><circle cx="${x}" cy="25" r="3.3" fill="#ffd23f"/>`).join('')}`;
  }else if(type==='as'){
    b=`<rect x="1" y="9" width="7" height="3" fill="#222"/><rect x="3" y="11" width="2" height="9" fill="#222"/>
    <path d="M3 24 L9 17 L22 16 L29 13 L40 13 L46 17 L58 19 L61 24 Z" fill="${col}" ${SK}/>
    <circle cx="35" cy="12" r="4.3" fill="#fff" stroke="#222" stroke-width="1"/><rect x="35" y="10.5" width="4" height="2.4" rx="1" fill="#222"/>
    <circle cx="20" cy="20" r="3.3" fill="#fff"/><text x="20" y="22" font-size="5" text-anchor="middle" font-weight="900" fill="#111">1</text>
    <rect x="53" y="23" width="9" height="2.5" fill="#222"/>
    ${wheel(13,25,5.6)}${wheel(50,25,5.6)}`;
  }else{
    b=`<path d="M5 25 L7 17 Q9 13 15 13 L21 13 L27 6 Q29 5 33 5 L43 5 Q47 5 50 9 L54 14 Q59 15 59 20 L59 25 Z" fill="${col}" ${SK}/>
    <path d="M25 13 L30 8 L37 8 L37 13Z" fill="#cfe8ff"/><path d="M40 8 L46 8 L50 13 L40 13Z" fill="#cfe8ff"/>
    <rect x="55" y="17" width="3" height="2" rx="1" fill="#fff6b0"/>
    ${wheel(16,26,5)}${wheel(48,26,5)}`;
  }
  return `<svg viewBox="0 0 63 34" class="vs">${b}</svg>`;
}
function light(on){return `<svg viewBox="0 0 40 40"><rect x="13" y="2" width="14" height="36" rx="5" fill="#222"/>
  <circle cx="20" cy="10" r="4.6" fill="${on==='r'?'#ff3b3b':'#4a2222'}"/><circle cx="20" cy="20" r="4.6" fill="#4a4222"/>
  <circle cx="20" cy="30" r="4.6" fill="${on==='g'?'#33e07a':'#1f3a2a'}"/>${on==='r'?'<circle cx="20" cy="10" r="8" fill="#ff3b3b" opacity=".25"/>':'<circle cx="20" cy="30" r="8" fill="#33e07a" opacity=".25"/>'}</svg>`}
function sign(end){return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fff" stroke="${end?'#999':'#e8333a'}" stroke-width="4.5"/>
  <text x="20" y="25.5" font-size="15" font-weight="900" text-anchor="middle" fill="${end?'#999':'#111'}" font-family="Barlow,sans-serif">50</text>${end?'<line x1="9" y1="31" x2="31" y2="9" stroke="#222" stroke-width="3"/>':''}</svg>`}
function pump(col,x){return `<svg viewBox="0 0 40 40"><rect x="9" y="7" width="16" height="28" rx="3" fill="${col}"/><rect x="12" y="10" width="10" height="7" rx="1" fill="#fff"/>
  <path d="M25 13 h4 q3 0 3 3 v12 q0 3 -3 3" fill="none" stroke="#333" stroke-width="2.4"/><rect x="7" y="34" width="20" height="3" rx="1" fill="#333"/>${x?'<path d="M6 6 L34 34 M34 6 L6 34" stroke="#e8333a" stroke-width="4" stroke-linecap="round"/>':''}</svg>`}
function tire(burst){return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#1b1b1b"/><circle cx="20" cy="20" r="13" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="3 2"/><circle cx="20" cy="20" r="6.5" fill="#cfd3da"/><circle cx="20" cy="20" r="2" fill="#555"/>
  ${burst?'<path d="M29 4 l2 6 6-2 -3 6 5 3 -6 1 1 6 -5-4 -4 4 0-6 -6 -1 5-3 -3-6 6 2z" fill="#ffb400" stroke="#e8333a" stroke-width="1.5"/>':'<circle cx="31" cy="9" r="7" fill="#25a85a"/><path d="M27.5 9h7M31 5.5v7" stroke="#fff" stroke-width="2.4"/>'}</svg>`}
function crash(){return `<svg viewBox="0 0 40 40"><g transform="rotate(-18 14 24)"><rect x="2" y="20" width="20" height="9" rx="3" fill="#2b6fd6"/><rect x="6" y="15" width="11" height="7" rx="2" fill="#2b6fd6"/>${wheel(7,30,3)}${wheel(18,30,3)}</g>
  <g transform="rotate(20 28 24)"><rect x="18" y="20" width="20" height="9" rx="3" fill="#e8333a"/><rect x="23" y="15" width="11" height="7" rx="2" fill="#e8333a"/>${wheel(23,30,3)}${wheel(34,30,3)}</g>
  <path d="M20 3 l2 6 5-3 -2 6 6 1 -6 3 3 5 -6-2 -2 5 -2-5 -6 2 3-5 -6-3 6-1 -2-6 5 3z" fill="#ffd23f" stroke="#e8333a" stroke-width="1.2"/></svg>`}
function wrench(){return `<svg viewBox="0 0 40 40"><path d="M27 4a9 9 0 0 0-8.6 11.6L5 29a3.5 3.5 0 0 0 5 5l13.4-13.4A9 9 0 0 0 35.4 12l-5.4 5-5-1-1-5 5-5.4A9 9 0 0 0 27 4z" fill="#7d8796" stroke="#333" stroke-width="1.4"/></svg>`}
function borne(km){return `<svg viewBox="0 0 40 40"><path d="M10 37V17a10 10 0 0 1 20 0v20z" fill="#fff" stroke="#999" stroke-width="1.2"/><path d="M10 17a10 10 0 0 1 20 0z" fill="#e8333a"/>
  <rect x="7" y="35" width="26" height="3" rx="1" fill="#777"/><text x="20" y="31" font-size="${km>99?9.5:11}" text-anchor="middle" font-weight="900" font-family="Barlow,sans-serif" fill="#1a1a1a">${km}</text></svg>`}

/* ---------- cartes ---------- */
const C={
  d25:{t:'dist',km:25,n:10,name:'kilomètres'},d50:{t:'dist',km:50,n:10,name:'kilomètres'},d75:{t:'dist',km:75,n:10,name:'kilomètres'},
  d100:{t:'dist',km:100,n:12,name:'kilomètres'},d200:{t:'dist',km:200,n:4,name:'kilomètres'},
  feuRouge:{t:'atk',n:5,name:'Feu rouge',b:'prio'},limite:{t:'atk',n:4,name:'Limite de vitesse',b:'prio'},
  panne:{t:'atk',n:3,name:"Panne d'essence",b:'citerne'},crevaison:{t:'atk',n:3,name:'Crevaison',b:'increvable'},
  accident:{t:'atk',n:3,name:'Accident',b:'as'},
  feuVert:{t:'rem',n:14,name:'Feu vert'},finLimite:{t:'rem',n:6,name:'Fin de limite'},essence:{t:'rem',n:6,name:'Essence'},

const ACCEL=[6,17,27], ZONES=[[11,14],[30,33]], PASSES=[[20,23],[36,37]];

const PATH=`M75 60 H325 A65 65 0 0 1 325 190 H75 A65 65 0 0 0 75 320 H325 A65 65 0 0 1 325 450 H75`;
function ptAt(s){s=Math.max(0,Math.min(TOT,s));
  for(let i=0;i<4;i++){const y=YS[i],right=i%2===0;
    if(s<=L)return{x:right?BX0+s:BX1-s,y};s-=L;

    if(s<=ARC){const t=s/R,cy=y+R;
      if(right){const th=-Math.PI/2+t;return{x:BX1+R*Math.cos(th),y:cy+R*Math.sin(th)}}
      const th=-Math.PI/2-t;return{x:BX0+R*Math.cos(th),y:cy+R*Math.sin(th)}}

  return{x:BX0,y:YS[3]}}

  if(d.t==='dist'){p.km+=d.km;if(d.km===200)p.n200++}
  else if(d.t==='rem'){G.discard.push(k);
    if(k==='finLimite'){p.limited=false;if(p.limCard){G.discard.push(p.limCard);p.limCard=null}}
    else{if(p.hzCard){G.discard.push(p.hzCard);p.hzCard=null}p.hazard=(k==='feuVert'||hasB(p,'prio'))?null:'feuRouge'}}
  else if(d.t==='botte'){p.bottes.push(k);p.veh=d.veh;
    const free=()=>{if(p.hzCard){G.discard.push(p.hzCard);p.hzCard=null}};
    if(k==='prio'){if(p.limCard){G.discard.push(p.limCard);p.limCard=null}p.limited=false;if(p.hazard==='feuRouge'||p.hazard==='start'){free();p.hazard=null}}
    if(CURE[k]&&p.hazard===CURE[k]){free();p.hazard=hasB(p,'prio')?null:'feuRouge'}}}
function applyAtk(t,k){if(k==='limite'){t.limited=true;t.limCard=k}else{t.hazard=k;t.hzCard=k}}

/* ---------- déroulement ---------- */
function startTurn(){
  if(G.over)return;
  if(!G.deck.length&&!G.reshuffled&&G.discard.length){G.reshuffled=true;G.deck=G.discard.sort(()=>Math.random()-.5);G.discard=[];
    for(let i=G.deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]]}
    log('Pioche vide : la défausse est mélangée pour former une nouvelle pioche (une seule fois).')}
  if(!G.deck.length&&G.players.every(q=>!q.hand.length))return endGame(null);
  const p=cur();
  if(!p.hand.length){G.cur=(G.cur+1)%G.players.length;return startTurn()}
  if(G.deck.length)p.hand.push(G.deck.pop());
  G.sel=null;G.busy=!!p.ai;
  if(!p.ai)snd('ding');
  if(!p.ai&&humans().length>1){G.revealed=false;render();showPass(p);return}
  render();
  if(p.ai)setTimeout(()=>{if(!G.over&&cur()===p)aiTurn(p)},AI_DELAY);
}
function after(p,again,delay){
  render();
  setTimeout(()=>{if(G.over)return;
    if(p.km===GOAL)return endGame(p);
    if(!again)G.cur=(G.cur+1)%G.players.length;
    startTurn()},delay)}
function animCar(p,from,to){
  if(G.mode!=='board'){p.disp=to;return 0}
  for(let i=1;i<=to-from;i++)setTimeout(()=>{p.disp=from+i;placeCars()},i*200);
  return (to-from)*200}
function doPlay(p,i,act,t){
  const k=p.hand.splice(i,1)[0],d=C[k];G.busy=true;G.sel=null;
  if(act==='disc'){snd('swish');G.discard.push(k);log(`${p.name} défausse : ${d.t==='dist'?d.km+' km':d.name}.`);toast(p,k,'défausse cette carte');return after(p,false,900)}
  if(act==='atk'){
    snd(ATK_SND[k]);log(`${p.name} attaque ${t.name} : ${d.name} !`);toast(p,k,`attaque <b>${esc(t.name)}</b>`);
    const bi=t.hand.indexOf(d.b);
    if(bi>=0){render();
      if(t.ai)return setTimeout(()=>coupFourre(t,bi,k),1200);
      return setTimeout(()=>askCF(p,t,bi,k),700)}
    applyAtk(t,k);return after(p,false,1100)}
  if(d.t==='botte'){botteSnd(k);applySelf(p,k);log(`${p.name} pose la botte ${d.name} et rejoue.`);toast(p,k,'se transforme et rejoue !');return after(p,true,1300)}
  if(d.t==='dist'){
    const from=cellOf(p);applySelf(p,k);let bonus=false;
    if(G.mode==='board'&&ACCEL.includes(cellOf(p))&&p.km+25<GOAL&&!blockedBy(p,cellOf(p)+1)){p.km+=25;bonus=true}
    snd('drive',d.km);if(d.km===200)snd('turbo');
    if(bonus)setTimeout(()=>snd('turbo'),(d.km/25)*200);
    log(`${p.name} roule ${d.km} km${bonus?' et prend l\'accélérateur (+25 km)':''}. Total ${p.km} km.`);
    toast(p,k,`roule ${d.km} km${bonus?' + accélérateur !':''}`);
    return after(p,false,Math.max(1000,animCar(p,from,cellOf(p))+350))}
  snd(REM_SND[k]);applySelf(p,k);log(`${p.name} joue ${d.name}.`);toast(p,k,'joue sa parade');return after(p,false,950);
}
function coupFourre(t,bi,k){
  t.hand.splice(bi,1);const b=C[k].b;snd('coup');if(b==='prio')setTimeout(()=>snd('siren'),700);applySelf(t,b);t.cf++;G.discard.push(k);
  log(`COUP FOURRÉ ! ${t.name} pare avec ${C[b].name} et prend la main.`);toast(t,b,'<span class="cf">Coup fourré !</span>');
  render();G.cur=G.players.indexOf(t);setTimeout(startTurn,1500)}
function askCF(att,t,bi,k){const b=C[k].b;
  modal(`<h2>Coup fourré ?</h2><p><b>${esc(att.name)}</b> vous attaque avec <b>${C[k].name}</b>.</p>

/* ---------- ordinateur ---------- */
function keepScore(p,k){const d=C[k];
  if(d.t==='botte')return 1000;
  if(d.t==='rem'){if(hasB(p,REM_BOTTE[k]))return 0;return p.hand.filter(x=>x===k).length>1?15:35}
  if(d.t==='dist'){if(p.km+d.km>GOAL||(d.km===200&&p.n200>=2))return 1;return 20+d.km/10}
  return 25}
function aiChoose(p){let best=null;const opp=G.players.filter(q=>q!==p);
  p.hand.forEach((k,i)=>{const d=C[k];let sc=-1,a='self',t=null;
    if(d.t==='rem'&&canSelf(p,k).ok)sc=100;
    else if(d.t==='botte'){const solves=(k==='prio'&&(p.limited||p.hazard==='feuRouge'||p.hazard==='start'))||CURE[k]===p.hazard;sc=solves?110:(G.deck.length<12?62:-1)}
    else if(d.t==='dist'&&canSelf(p,k).ok)sc=p.km+d.km===GOAL?200:50+d.km/10;
    else if(d.t==='atk'){let bs=-1,bt=null;
      opp.forEach(q=>{if(!canAttack(p,q,k))return;let s=40+q.km/25;if(q.km>=650)s+=40;if(k==='limite')s-=14;if(q.km<p.km-200)s-=15;if(s>bs){bs=s;bt=q}});
      if(bt){sc=bs;a='atk';t=bt}}
    if(sc>=0&&(!best||sc>best.sc))best={sc,i,a,t}});
  if(best)return best;
  let wi=0,ws=1e9;p.hand.forEach((k,i)=>{const s=keepScore(p,k)+Math.random();if(s<ws){ws=s;wi=i}});
  return{i:wi,a:'disc'}}
function aiTurn(p){const m=aiChoose(p);doPlay(p,m.i,m.a,m.t)}
