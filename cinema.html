<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séances Kinépolis près de chez moi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --panel:#171a22; --panel2:#20242e; --line:#2f3442;
    --txt:#eceef3; --mute:#959cad; --accent:#ffcc00; --accent-ink:#1a1500;
    --blue:#2b6cff; --red:#e0413a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
  a{color:#9db9ff}
  header{padding:28px 20px 8px;max-width:1100px;margin:auto}
  h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--mute);margin:4px 0 0}
  main{max-width:1100px;margin:auto;padding:10px 20px 60px}
  .search{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button,input{font:inherit;color:inherit}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:600}
  .or{color:var(--mute);font-size:13px}
  .field{position:relative;flex:1 1 260px}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .sugg{position:absolute;top:100%;left:0;right:0;z-index:1000;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:4px;overflow:hidden;display:none}
  .sugg div{padding:9px 12px;cursor:pointer}
  .sugg div:hover,.sugg div.act{background:var(--line)}
  .sugg small{color:var(--mute)}
  details.cfg{flex-basis:100%;color:var(--mute);font-size:13px}
  details.cfg input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:300px;max-width:100%}
  .status{margin:14px 2px;color:var(--mute);min-height:22px}
  .status.err{color:#ff8c87}
  .spin{width:16px;height:16px;border:2px solid var(--mute);border-top-color:transparent;border-radius:50%;display:inline-block;animation:r .8s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}

  .hero{display:none;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  .kcard{background:linear-gradient(160deg,#1d2230,#151820);border:1px solid var(--line);border-radius:16px;padding:20px}
  .kbadge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;border-radius:6px;padding:2px 8px;letter-spacing:.3px;text-transform:uppercase}
  .kcard h2{font-family:Fraunces,serif;font-size:28px;margin:10px 0 2px}
  .kaddr{color:var(--mute)}
  .km{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 6px}
  .km div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .km b{display:block;font-size:26px;font-weight:700;color:var(--accent);line-height:1.1}
  .km span{font-size:12px;color:var(--mute)}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .links a{font-size:13px;text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--txt)}
  .links a.main{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .links a:hover{filter:brightness(1.15)}
  .prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .price{font-size:12.5px;background:#1f2a24;border:1px solid #2f4a3c;color:#bfe7d0;border-radius:6px;padding:2px 8px}
  .pnote{font-size:11.5px;color:var(--mute);margin-top:4px}
  #map{height:100%;min-height:300px;border-radius:16px;border:1px solid var(--line)}
  .others{font-size:13px;color:var(--mute);margin-top:14px}
  .others button{background:none;border:0;color:#9db9ff;cursor:pointer;padding:0;text-decoration:underline;font-size:13px}

  .banner{background:#2a2412;border:1px solid #5a4a14;color:#f5dc86;border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px;display:none}
  .toolbar{display:none;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .daytabs{display:flex;gap:6px;flex-wrap:wrap}
  .daytabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;text-transform:capitalize}
  .daytabs button.today{border-color:var(--accent);color:var(--accent);font-weight:700}
  .daytabs button.on{background:var(--txt);color:#111;border-color:var(--txt)}
  .daytabs button.today.on{background:var(--accent);color:var(--accent-ink)}

  .films{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
  .film{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .film:last-child{border-bottom:0}
  .poster{width:78px;height:112px;border-radius:8px;background:var(--panel2);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mute)}
  .film h3{margin:0;font-size:17px}
  .fm{color:var(--mute);font-size:13px;margin:2px 0 8px}
  .trailer{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--red);border-radius:7px;padding:3px 10px;text-decoration:none;margin-bottom:8px}
  .days{display:flex;flex-direction:column;gap:6px}
  .day{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .day .dl{width:100px;flex:none;font-size:12.5px;color:var(--mute);text-transform:capitalize}
  .slot{font-size:13px;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line)}
  .slot .v{font-size:10.5px;color:var(--mute);margin-left:4px}
  .slot .t{font-size:10px;margin-left:4px;padding:0 4px;border-radius:3px;background:#33405e;color:#cfdcff}
  .day.today .dl{color:var(--accent);font-weight:700}
