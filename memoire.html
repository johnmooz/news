<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6e9; --ink:#2b2350; --muted:#7a7396; --card-back:#5b4bdb; --card-back2:#7c6cf0;
    --p0:#ff6b6b; --p1:#4dabf7; --p2:#51cf66; --p3:#fcc419;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, #ffe3c4 0 12%, transparent 13%),
      radial-gradient(circle at 92% 85%, #dcd6ff 0 14%, transparent 15%),
      var(--bg);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none !important}
  .nm{color:#1c7ed6;font-weight:600}

  /* ---------- Écran de configuration ---------- */
  #setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .panel{
    background:#fff;border-radius:28px;padding:32px 32px 28px;width:100%;max-width:520px;
    box-shadow:0 10px 0 #e9dcc8, 0 20px 50px rgba(43,35,80,.12);
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .logo svg{width:54px;height:54px}
  h1{font-size:56px;margin:0;letter-spacing:1px;color:var(--card-back)}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 24px}
  h2{font-size:18px;margin:22px 0 10px;font-weight:600}
  .seg{display:flex;gap:10px}
  .seg button{
    flex:1;height:52px;border-radius:16px;border:3px solid #ece7ff;background:#f7f5ff;
    font-size:22px;font-weight:600;color:var(--ink);transition:.15s;
  }
  .seg button.on{background:var(--card-back);border-color:var(--card-back);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 #3e30b0}
  .names{display:grid;gap:10px}
  .name-row{display:flex;align-items:center;gap:10px}
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .name-row input{
    flex:1;height:46px;border-radius:14px;border:3px solid #ece7ff;padding:0 14px;
    font:inherit;font-size:17px;color:#1c7ed6;font-weight:600;outline:none;
  }
  .name-row input:focus{border-color:var(--card-back2)}
  .dims{display:flex;gap:14px;align-items:flex-end}
  .dims label{flex:1;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
  .dims select{
    height:48px;border-radius:14px;border:3px solid #ece7ff;font:inherit;font-size:18px;
    padding:0 12px;color:var(--ink);background:#fff;outline:none;
  }
  .dims .x{font-size:26px;padding-bottom:8px;color:var(--muted)}
  .info{margin-top:12px;font-size:16px;color:var(--muted);min-height:24px}
  .info.err{color:#e03131;font-weight:500}
  .start{
    margin-top:22px;width:100%;height:60px;border:none;border-radius:18px;font-size:24px;font-weight:700;
    background:#ff8a3d;color:#fff;box-shadow:0 6px 0 #d4621b;transition:.1s;
  }
  .start:active{transform:translateY(4px);box-shadow:0 2px 0 #d4621b}
  .start:disabled{background:#cfc9dc;box-shadow:0 6px 0 #aaa3bd;cursor:not-allowed}

  /* ---------- Écran de jeu ---------- */
  #game{height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
  header .mini{font-size:28px;font-weight:700;color:var(--card-back);margin-right:6px}
  .players{display:flex;gap:10px;flex-wrap:wrap;flex:1}
  .chip{
    display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 14px;
    border:3px solid transparent;box-shadow:0 3px 0 #e9dcc8;transition:.2s;font-size:17px;
  }
  .chip .sc{font-weight:700;font-size:20px;min-width:30px;text-align:right}
  .chip.active{transform:translateY(-3px) scale(1.04)}
  .tools{display:flex;gap:8px;align-items:center}
  .tool{height:42px;min-width:42px;border-radius:14px;border:none;background:#fff;box-shadow:0 3px 0 #e9dcc8;font-size:17px;padding:0 12px;color:var(--ink)}
  .status{text-align:center;font-size:18px;font-weight:500;min-height:28px;padding:0 12px 6px}
  #boardWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 12px 14px;overflow:auto;min-height:0}
  #board{display:grid}
  .card{border:none;padding:0;background:none;perspective:600px;outline:none}
  .card .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:14%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .back{
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.25) 0 18%, transparent 19%),
      linear-gradient(145deg,var(--card-back2),var(--card-back));
    color:#fff;font-weight:700;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);
  }
  .card:not(.flipped):hover .back{filter:brightness(1.12)}
  .front{transform:rotateY(180deg);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
  .front svg{width:100%;height:100%;display:block}
  .card.matched .front{outline:4px solid var(--mc);outline-offset:-4px}
  .card.matched{animation:pop .45s ease}
  @keyframes pop{50%{transform:scale(1.12)}}
  .card.shake .inner{animation:shake .4s ease}
  @keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}

  /* ---------- Fin de partie ---------- */
  #end{position:fixed;inset:0;background:rgba(43,35,80,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  #end .panel{text-align:center;animation:rise .4s ease}
  @keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
  .trophy{font-size:70px;line-height:1}
  #end h2{font-size:32px;margin:10px 0 4px}
  #end p{color:var(--muted);margin:0 0 16px;font-size:17px}
  .rank{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px}
  .rank li{display:flex;align-items:center;gap:10px;background:#f7f5ff;border-radius:14px;padding:10px 14px;font-size:18px}
  .rank li b{margin-left:auto}
  .btns{display:flex;gap:10px;margin-top:10px}
  .btns .start{margin-top:8px}
  .btns .alt{background:#7c6cf0;box-shadow:0 6px 0 #4b3cc0}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:11;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<!-- Configuration -->
<section id="setup">
  <div class="panel">
    <div class="logo" id="logo"></div>
    <h1 style="text-align:center">Memory</h1>
    <p class="subtitle">Retrouve les paires d'animaux !</p>

    <h2>Nombre de joueurs</h2>
    <div class="seg" id="nbPlayers">
      <button data-n="1">1</button><button data-n="2" class="on">2</button><button data-n="3">3</button><button data-n="4">4</button>
    </div>

    <h2>Noms des joueurs</h2>
    <div class="names" id="names"></div>

    <h2>Taille de la grille</h2>
    <div class="dims">
      <label>Largeur<select id="w"></select></label>
      <span class="x">×</span>
      <label>Hauteur<select id="h"></select></label>
    </div>
    <div class="info" id="info"></div>

    <button class="start" id="startBtn">Jouer !</button>
  </div>
</section>

<!-- Jeu -->
<section id="game" class="hidden">
  <header>
    <span class="mini">Memory</span>
    <div class="players" id="players"></div>
    <div class="tools">
      <button class="tool" id="soundBtn" title="Son">🔊</button>
      <button class="tool" id="quitBtn">Nouvelle partie</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <div id="boardWrap"><div id="board"></div></div>
</section>

<!-- Fin -->
<div id="end" class="hidden">
  <div class="panel">
    <div class="trophy">🏆</div>
    <h2 id="winTitle"></h2>
    <p id="winSub"></p>
    <ul class="rank" id="rank"></ul>
    <div class="btns">
      <button class="start" id="againBtn">Rejouer</button>
      <button class="start alt" id="configBtn">Réglages</button>
    </div>
  </div>
</div>

 // poisson
 `<polygon points="68,50 90,30 90,70" fill="#ff8c42"/><path d="M38 32 q12 -14 24 0z" fill="#ff8c42"/><ellipse cx="46" cy="50" rx="32" ry="22" fill="#ffa95e"/><path d="M52 34 q-8 16 0 32 M62 38 q-6 12 0 24" stroke="#ff8c42" stroke-width="3" fill="none"/>`+E(28,46,5)+`<path d="M18 56 q4 3 8 0" stroke="#7a3a10" stroke-width="2" fill="none"/><circle cx="14" cy="28" r="4" fill="none" stroke="#5aa9e6" stroke-width="2"/><circle cx="23" cy="18" r="2.5" fill="none" stroke="#5aa9e6" stroke-width="2"/>`,
 // tortue
 `<circle cx="82" cy="56" r="10" fill="#8fcf6a"/>`+E(85,53,2.8)+`<path d="M82 60 q3 2 6 0" stroke="#2b6a28" stroke-width="1.5" fill="none"/><ellipse cx="30" cy="72" rx="8" ry="6" fill="#8fcf6a"/><ellipse cx="64" cy="72" rx="8" ry="6" fill="#8fcf6a"/><polygon points="12,66 4,62 6,70" fill="#8fcf6a"/><path d="M14 66 Q16 26 46 26 Q76 26 78 66Z" fill="#3f8f3a"/><path d="M28 64 l6 -14 h24 l6 14 M34 50 l-4 -12 M58 50 l4 -12 M46 50 v-22" stroke="#2b6a28" stroke-width="2.5" fill="none"/><rect x="12" y="63" width="68" height="6" rx="3" fill="#6bb04f"/>`,
 // coccinelle
 `<path d="M44 18 q-6 -10 -12 -8 M56 18 q6 -10 12 -8" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="50" cy="28" r="13" fill="#222"/><circle cx="50" cy="58" r="30" fill="#e63946"/><path d="M50 29 V88" stroke="#222" stroke-width="3"/><circle cx="37" cy="48" r="6" fill="#222"/><circle cx="63" cy="48" r="6" fill="#222"/><circle cx="34" cy="68" r="5" fill="#222"/><circle cx="66" cy="68" r="5" fill="#222"/><circle cx="43" cy="80" r="3.5" fill="#222"/><circle cx="57" cy="80" r="3.5" fill="#222"/><circle cx="45" cy="24" r="3" fill="#fff"/><circle cx="55" cy="24" r="3" fill="#fff"/>`
];
// 10 couleurs de fond × 20 animaux = 200 paires possibles (grille 20×20)
const COLORS=['#4dabf7','#69db7c','#ff8787','#ffd43b','#b197fc','#ffa94d','#f783ac','#3bc9db','#adb5bd','#5c7cfa'];
const PCOLORS=['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];

const cardSVG=(a,c)=>`<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}"/><circle cx="50" cy="50" r="42" fill="#fffdf6"/><g transform="translate(50 50) scale(.86) translate(-50 -50)">${ANIMALS[a]}</g></svg>`;

/* ================= Son (Web Audio) ================= */
let actx=null, soundOn=true;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36]; // pentatonique de do
const freq=st=>261.63*Math.pow(2,st/12);
function tone(f,when=0,dur=.45,type='triangle',vol=.25){
  const a=ac(); if(!a||!soundOn) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const noteFor=pair=>freq(SCALE[pair%SCALE.length]);
function playFlip(pair){ tone(noteFor(pair)); tone(noteFor(pair)*2,0,.25,'sine',.06); }
function playMatch(){ [0,4,7,12].forEach((s,i)=>tone(freq(12+s),i*.08,.35,'triangle',.2)); }
function playMiss(){ tone(freq(-5),0,.25,'sine',.18); tone(freq(-8),.14,.35,'sine',.18); }
function playWin(){ [0,4,7,12,7,12,16,19].forEach((s,i)=>tone(freq(12+s),i*.12,.4,'square',.07)); }

/* ================= Configuration ================= */
const $=id=>document.getElementById(id);
let nbPlayers=2;
let savedNames=['Joueur 1','Joueur 2','Joueur 3','Joueur 4'];

$('logo').innerHTML=[0,4,9].map(a=>cardSVG(a,COLORS[a%10])).join('');
$('logo').querySelectorAll('svg').forEach((s,i)=>{s.style.borderRadius='12px';s.style.transform=`rotate(${[-10,0,10][i]}deg)`});

function renderNames(){
  const box=$('names');
  box.querySelectorAll('input').forEach((inp,i)=>savedNames[i]=inp.value);
  box.innerHTML='';
  for(let i=0;i<nbPlayers;i++){
    const row=document.createElement('div'); row.className='name-row';
    row.innerHTML=`<span class="dot" style="background:${PCOLORS[i]}"></span>`;
    const inp=document.createElement('input'); inp.maxLength=16; inp.value=savedNames[i]; inp.placeholder='Joueur '+(i+1);
    row.appendChild(inp); box.appendChild(row);
  }
}
$('nbPlayers').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  nbPlayers=+b.dataset.n;
  $('nbPlayers').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  renderNames();
});
for(const id of ['w','h']){
  const s=$(id); for(let i=2;i<=20;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o)}
  s.value=4; s.addEventListener('change',checkDims);
}
function checkDims(){
  const n=$('w').value*$('h').value, ok=n%2===0;
  $('info').className='info'+(ok?'':' err');
  $('info').textContent= ok ? `${n} cartes · ${n/2} paires d'animaux` : `${$('w').value} × ${$('h').value} = ${n} : le nombre de cartes doit être pair.`;
  $('startBtn').disabled=!ok;
}
renderNames(); checkDims();

/* ================= Jeu ================= */
let S={};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function startGame(){
  ac();
  const players=[...$('names').querySelectorAll('input')].map((inp,i)=>({name:inp.value.trim()||('Joueur '+(i+1)),score:0,tries:0,pairs:0}));
  const W=+$('w').value, H=+$('h').value, nPairs=W*H/2;
  // choix des paires : animaux différents d'abord, puis variantes de couleur
  const aOrder=shuffle([...Array(ANIMALS.length).keys()]);
  const cOrder=ANIMALS.map(()=>shuffle([...Array(COLORS.length).keys()]));
  const deck=[];
  for(let p=0;p<nPairs;p++){
    const a=aOrder[p%ANIMALS.length], c=COLORS[cOrder[a][Math.floor(p/ANIMALS.length)]];
    deck.push({pair:p,a,c},{pair:p,a,c});
  }
  shuffle(deck);
  S={players,cur:0,W,H,nPairs,found:0,first:null,lock:false,cards:[]};

  const board=$('board'); board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${W},var(--cs))`;
  board.style.gridTemplateRows=`repeat(${H},var(--cs))`;
  deck.forEach(d=>{
    const el=document.createElement('button'); el.className='card';
    el.setAttribute('aria-label','Carte cachée');
    el.innerHTML=`<div class="inner"><div class="face back">?</div><div class="face front">${cardSVG(d.a,d.c)}</div></div>`;
    const card={...d,el,flipped:false,matched:false};
    el.addEventListener('click',()=>onCard(card));
    S.cards.push(card); board.appendChild(el);
  });

  $('setup').classList.add('hidden'); $('end').classList.add('hidden'); $('game').classList.remove('hidden');
  renderPlayers(); setStatus(`À ${N(S.players[0].name)} de commencer !`); fit();
}

function fit(){
  if(!S.cards) return;
  const wrap=$('boardWrap'), r=wrap.getBoundingClientRect();
  const availW=r.width-24, availH=window.innerHeight-r.top-18;
  const gap=Math.max(S.W,S.H)>10?5:9;
  let cs=Math.min((availW-gap*(S.W-1))/S.W,(availH-gap*(S.H-1))/S.H,140);
  cs=Math.max(cs,22);
  const b=$('board'); b.style.setProperty('--cs',cs+'px'); b.style.gap=gap+'px';
  b.querySelectorAll('.back').forEach(x=>x.style.fontSize=(cs*.5)+'px');
}
window.addEventListener('resize',fit);

function renderPlayers(){
  const box=$('players'); box.innerHTML='';
  S.players.forEach((p,i)=>{
    const c=document.createElement('div'); c.className='chip'+(i===S.cur?' active':'');
    if(i===S.cur) c.style.borderColor=PCOLORS[i];
    c.innerHTML=`<span class="dot" style="background:${PCOLORS[i]}"></span><span class="nm"></span><span class="sc">${p.score}</span>`;
    c.querySelector('.nm').textContent=p.name;
    box.appendChild(c);
  });
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const N=n=>`<span class="nm">${esc(n)}</span>`;
function setStatus(t){ $('status').innerHTML=t; }

function onCard(card){
  if(S.lock||card.flipped||card.matched) return;
  card.flipped=true; card.el.classList.add('flipped'); card.el.setAttribute('aria-label','Carte retournée');
  playFlip(card.pair);
  if(!S.first){ S.first=card; return; }
  const a=S.first, b=card, p=S.players[S.cur];
  S.first=null; S.lock=true; p.tries++;
  if(a.pair===b.pair){
    setTimeout(()=>{
      [a,b].forEach(c=>{c.matched=true;c.el.classList.add('matched');c.el.style.setProperty('--mc',PCOLORS[S.cur])});
      p.score+=10; p.pairs++; S.found++; playMatch(); renderPlayers();
      if(S.found===S.nPairs){ setStatus('Toutes les paires sont trouvées !'); setTimeout(endGame,800); return; }
      setStatus(`Bravo ${N(p.name)} ! +10 points, tu rejoues.`);
      S.lock=false;
    },420);
  } else {
    setTimeout(()=>{
      [a,b].forEach(c=>c.el.classList.add('shake'));
    },500);
    setTimeout(()=>{
      [a,b].forEach(c=>{c.flipped=false;c.el.classList.remove('flipped','shake');c.el.setAttribute('aria-label','Carte cachée')});
      playMiss();
      S.cur=(S.cur+1)%S.players.length; renderPlayers();
      const n=S.players[S.cur].name;
      setStatus(S.players.length>1 ? `Raté ! Au tour de ${N(n)}.` : 'Raté ! Essaie encore.');
      S.lock=false;
    },1150);
  }
}

function endGame(){
  playWin(); confetti();
  const ps=S.players, max=Math.max(...ps.map(p=>p.score));
  const winners=ps.filter(p=>p.score===max);
  if(ps.length===1){
    $('winTitle').innerHTML=`Bravo ${N(ps[0].name)} !`;
    $('winSub').textContent=`Tu as trouvé les ${S.nPairs} paires en ${ps[0].tries} coups.`;
  } else if(winners.length===1){
    $('winTitle').innerHTML=`${N(winners[0].name)} gagne !`;
    $('winSub').textContent=`Avec ${max} points (${winners[0].pairs} paires).`;
  } else {
    $('winTitle').textContent='Égalité !';
    $('winSub').innerHTML=`${winners.map(w=>N(w.name)).join(' et ')} terminent avec ${max} points.`;
  }
  const rank=$('rank'); rank.innerHTML='';
  ps.map((p,i)=>({...p,i})).sort((x,y)=>y.score-x.score).forEach((p,k)=>{
    const li=document.createElement('li');
    li.innerHTML=`<span>${['🥇','🥈','🥉','4.'][k]}</span><span class="dot" style="background:${PCOLORS[p.i]}"></span><span class="nm"></span><b>${p.score} pts</b>`;
    li.querySelector('.nm').textContent=p.name;
    rank.appendChild(li);
  });
  $('end').classList.remove('hidden');
}

function confetti(){
  const cols=['#ff6b6b','#4dabf7','#51cf66','#fcc419','#b197fc','#ffa94d'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2+Math.random()*2)+'s'; d.style.animationDelay=Math.random()*.6+'s';
    d.style.borderRadius=Math.random()<.5?'50%':'2px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5000);
  }
}

$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
function toSetup(){ $('end').classList.add('hidden'); $('game').classList.add('hidden'); $('setup').classList.remove('hidden'); S={}; }
$('configBtn').addEventListener('click',toSetup);
$('quitBtn').addEventListener('click',toSetup);
$('soundBtn').addEventListener('click',()=>{ soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊':'🔇'; });
</script>
</body>
