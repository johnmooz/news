<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petit Saut — jeu de plateforme</title>
<style>
  html,body{margin:0;height:100%;background:#1b2433;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:18px;pointer-events:none}
  #touch .grp{display:flex;gap:14px}
  .tb{pointer-events:auto;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .tb.on{background:rgba(255,255,255,.45)}
  #jump{width:90px;height:90px;font-size:22px;font-weight:700}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="grp"><div class="tb" id="left">◀</div><div class="tb" id="right">▶</div></div>
  <div class="tb" id="jump">SAUT</div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 960, VH = 540;
let sx = 1, sy = 1;
function resize(){
  const s = Math.min(innerWidth / VW, innerHeight / VH) * 0.98;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  cv.width = Math.round(VW * s * dpr); cv.height = Math.round(VH * s * dpr);
  sx = cv.width / VW; sy = cv.height / VH;
}
addEventListener('resize', resize); resize();

/* ---------- Niveau ---------- */
const T = 40, ROWS = 14, COLS = 232;
const GRAV = 2200, JUMP = 820, MAXV = 300;
let grid, coins = [], enemies0 = [], checkpoints = [], flagX = 0, clouds = [];

function buildLevel(){
  grid = [...Array(ROWS)].map(() => new Array(COLS).fill(0));
  coins = []; enemies0 = []; checkpoints = [];
  const fill = (x0,x1,y0,y1,v) => { for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) grid[y][x]=v; };
  const G = (a,b) => fill(a,b,12,13,1);
  const crate = (x,h) => { for(let i=0;i<h;i++) grid[11-i][x]=2; };
  const spikes = (a,b) => { for(let x=a;x<=b;x++) grid[11][x]=3; };
  const bricks = (a,b,y) => { for(let x=a;x<=b;x++) grid[y][x]=4; };
  const coinRow = (a,b,y) => { for(let x=a;x<=b;x++) coins.push({x:x*T+T/2, y:y*T+T/2, got:false}); };
  const enemy = x => enemies0.push({x:x*T+5, y:12*T-28});
  const cp = x => checkpoints.push({x:x*T, on:false});

  G(0,18); coinRow(8,12,10);
  coinRow(19,20,9);
  G(21,40); crate(27,1); crate(31,2); spikes(35,36);
  coinRow(41,43,9);
  G(44,60); enemy(50); bricks(52,56,8); coinRow(52,56,7);
  coinRow(61,63,9); G(64,66); coinRow(67,69,9);
  G(70,90); cp(72); spikes(78,80); crate(84,2); enemy(87);
  bricks(92,94,9); coinRow(92,94,8);
  G(96,120); crate(100,1); crate(101,2); crate(102,3); spikes(103,107); coinRow(104,106,7); enemy(112); enemy(117);
  coinRow(122,123,9);
  G(125,127); bricks(129,130,10); coinRow(129,130,9);
  G(132,160); cp(133); bricks(138,142,8); coinRow(138,142,7); spikes(140,140); spikes(145,146); crate(150,2); spikes(151,152); enemy(155); enemy(158);
  G(163,164); G(167,168); coinRow(161,162,9); coinRow(165,166,9); coinRow(169,171,9);
  G(172,231); cp(173); bricks(178,182,9); coinRow(178,182,8); enemy(180); enemy(186); enemy(191); spikes(194,195);
  crate(205,1); crate(206,2); crate(207,3); crate(208,4); crate(209,4); coinRow(206,209,6);
  flagX = 222 * T;

  clouds = [];
  for(let i=0;i<40;i++) clouds.push({x:i*190 + (i*97%120), y:40 + (i*53%130), s:0.6 + (i*31%50)/60});
}

const solid = (tx,ty) => {
  if(tx < 0) return true;
  if(tx >= COLS || ty < 0 || ty >= ROWS) return false;
  const v = grid[ty][tx]; return v===1 || v===2 || v===4;
};
function moveX(e,dx){
  e.x += dx;
  const top = Math.floor(e.y / T), bot = Math.floor((e.y + e.h - 0.01) / T);
  if(dx > 0){
    const tx = Math.floor((e.x + e.w - 0.01) / T);
    for(let ty=top; ty<=bot; ty++) if(solid(tx,ty)){ e.x = tx*T - e.w; return true; }
  } else if(dx < 0){
    const tx = Math.floor(e.x / T);
    for(let ty=top; ty<=bot; ty++) if(solid(tx,ty)){ e.x = (tx+1)*T; return true; }
  }
  return false;
}
function moveY(e,dy){
  e.y += dy; e.onGround = false;
  const l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 0.01) / T);
  if(dy > 0){
    const ty = Math.floor((e.y + e.h - 0.01) / T);
    for(let tx=l; tx<=r; tx++) if(solid(tx,ty)){ e.y = ty*T - e.h; e.vy = 0; e.onGround = true; return; }
  } else if(dy < 0){
    const ty = Math.floor(e.y / T);
    for(let tx=l; tx<=r; tx++) if(solid(tx,ty)){ e.y = (ty+1)*T; e.vy = 0; return; }
  }
}
const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ---------- Son ---------- */
let ac = null;
function sfx(t){
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const S = {jump:[420,720,.12,'square'], coin:[900,1400,.09,'square'], stomp:[320,110,.14,'triangle'],
               die:[440,70,.55,'sawtooth'], win:[520,1200,.7,'triangle'], cp:[600,950,.22,'triangle']}[t];
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = S[3]; o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(S[0], n); o.frequency.exponentialRampToValueAtTime(S[1], n+S[2]);
    g.gain.setValueAtTime(.07, n); g.gain.exponentialRampToValueAtTime(.001, n+S[2]);
    o.start(n); o.stop(n+S[2]+.03);
  }catch(e){}
}

/* ---------- État du jeu ---------- */
const player = {x:0,y:0,w:26,h:36,vx:0,vy:0,onGround:false,face:1,coyote:0,buffer:0};
let enemies = [], state = 'menu', lives = 3, score = 0, nCoins = 0, time = 0, clock = 0, deadT = 0, spawnX = 2*T, cam = 0, best = 0;
try{ best = +localStorage.getItem('petitsaut-best') || 0; }catch(e){}

function respawn(){
  Object.assign(player, {x:spawnX, y:12*T-player.h, vx:0, vy:0, onGround:true, face:1, buffer:0});
  enemies = enemies0.map(e => ({x:e.x, y:e.y, w:30, h:28, vx:-70, vy:0, onGround:false, alive:true, squash:0}));
}
function newGame(){
  buildLevel(); lives = 3; score = 0; nCoins = 0; time = 0; spawnX = 2*T;
  respawn(); state = 'play';
}
function die(){
  if(state !== 'play') return;
  state = 'dead'; deadT = 1.3; lives--; player.vy = -650; sfx('die');
}

/* ---------- Entrées ---------- */
const keys = {left:false, right:false, jump:false};
function pressJump(){
  if(state === 'play'){ player.buffer = 0.13; }
  else if(state === 'menu' || state === 'over' || state === 'win'){ newGame(); }
}
addEventListener('keydown', e => {
  const c = e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) e.preventDefault();
  if(c==='ArrowLeft' || c==='KeyA') keys.left = true;
  if(c==='ArrowRight' || c==='KeyD') keys.right = true;
  if(c==='Space' || c==='ArrowUp' || c==='KeyW'){ if(!keys.jump) pressJump(); keys.jump = true; }
  if(c==='Enter' && state !== 'play' && state !== 'dead') newGame();
  if(c==='KeyR' && state === 'play') newGame();
});
addEventListener('keyup', e => {
  const c = e.code;
  if(c==='ArrowLeft' || c==='KeyA') keys.left = false;
  if(c==='ArrowRight' || c==='KeyD') keys.right = false;
  if(c==='Space' || c==='ArrowUp' || c==='KeyW') keys.jump = false;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });

const isTouch = ('ontouchstart' in window) || matchMedia('(pointer:coarse)').matches;
if(isTouch) document.getElementById('touch').style.display = 'flex';
function bindBtn(id, k){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); if(k==='jump' && !keys.jump) pressJump(); keys[k] = true; };
  const off = e => { e.preventDefault(); el.classList.remove('on'); keys[k] = false; };
  el.addEventListener('pointerdown', on);
  ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, off));
}
bindBtn('left','left'); bindBtn('right','right'); bindBtn('jump','jump');
cv.addEventListener('pointerdown', () => { if(state !== 'play' && state !== 'dead') newGame(); });

/* ---------- Mise à jour ---------- */
function step(dt){
  clock += dt;
  const p = player;
  if(state === 'dead'){
    p.vy += GRAV*dt; p.y += p.vy*dt; deadT -= dt;
    if(deadT <= 0){ if(lives <= 0){ state = 'over'; saveBest(); } else { respawn(); state = 'play'; } }
    return;
  }
  if(state !== 'play') return;
  time += dt;

  const dir = (keys.right?1:0) - (keys.left?1:0);
  if(dir){ p.vx += dir * (p.onGround?2600:1700) * dt; p.face = dir; }
  else { const f = (p.onGround?2400:500)*dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx)*f; }
  p.vx = Math.max(-MAXV, Math.min(MAXV, p.vx));

  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  p.buffer -= dt;
  if(p.buffer > 0 && p.coyote > 0){ p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.onGround = false; sfx('jump'); }
  if(!keys.jump && p.vy < -380) p.vy = -380;
  p.vy = Math.min(p.vy + GRAV*dt, 1000);

  if(moveX(p, p.vx*dt)) p.vx = 0;
  moveY(p, p.vy*dt);
  if(p.y > VH + 60){ die(); return; }

  // pics
  const l = Math.floor(p.x/T), r = Math.floor((p.x+p.w)/T), t = Math.floor(p.y/T), b = Math.floor((p.y+p.h)/T);
  for(let ty=t; ty<=b; ty++) for(let tx=l; tx<=r; tx++){
    if(ty>=0 && ty<ROWS && tx>=0 && tx<COLS && grid[ty][tx]===3){
      if(overlap(p, {x:tx*T+5, y:ty*T+18, w:30, h:22})){ die(); return; }
    }
  }

  // ennemis
  for(const e of enemies){
    if(!e.alive){ e.squash -= dt; continue; }
    e.vy = Math.min(e.vy + GRAV*dt, 1000);
    if(moveX(e, e.vx*dt)) e.vx = -e.vx;
    moveY(e, e.vy*dt);
    if(e.onGround){
      const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
      if(!solid(Math.floor(fx/T), Math.floor((e.y+e.h+2)/T))) e.vx = -e.vx;
    }
    if(e.y > VH + 60){ e.alive = false; continue; }
    if(Math.abs(e.x - p.x) < 400 && overlap(p, e)){
      if(p.vy > 0 && (p.y + p.h) - e.y < 20){
        e.alive = false; e.squash = 0.4; p.vy = -600; score += 100; sfx('stomp');
      } else { die(); return; }
    }
  }

  // pièces
  for(const c of coins){
    if(!c.got && Math.abs(c.x - (p.x+p.w/2)) < 22 && Math.abs(c.y - (p.y+p.h/2)) < 26){
      c.got = true; nCoins++; score += 10; sfx('coin');
    }
  }
  // drapeaux de contrôle
  for(const c of checkpoints){
    if(!c.on && p.x > c.x){ c.on = true; spawnX = c.x; sfx('cp'); }
  }
  // arrivée
  if(p.x + p.w >= flagX + 8){
    state = 'win'; score += lives*500 + Math.max(0, Math.round(1000 - time*10)); saveBest(); sfx('win');
  }
}
function saveBest(){
  if(score > best){ best = score; try{ localStorage.setItem('petitsaut-best', best); }catch(e){} }
}

/* ---------- Dessin ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); ctx.fill(); }

function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#69b8ec'); g.addColorStop(1,'#d9f1ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
  // soleil
  ctx.fillStyle = 'rgba(255,244,190,.9)'; ctx.beginPath(); ctx.arc(820,90,42,0,7); ctx.fill();
  // nuages
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for(const c of clouds){
    const x = c.x - cam*0.3; if(x < -150 || x > VW+150) continue;
    const s = c.s; ctx.beginPath();
    ctx.arc(x, c.y, 22*s, 0, 7); ctx.arc(x+24*s, c.y-12*s, 28*s, 0, 7); ctx.arc(x+52*s, c.y, 22*s, 0, 7);
    ctx.fill(); ctx.fillRect(x, c.y-2, 52*s, 22*s);
  }
  // collines
  const hills = (par, base, amp, col, k) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, VH);
    for(let x=0; x<=VW; x+=8){
      const w = x + cam*par;
      ctx.lineTo(x, base - amp*(0.6*Math.sin(w*0.005*k) + 0.4*Math.sin(w*0.013*k + 1.3)));
    }
    ctx.lineTo(VW, VH); ctx.fill();
  };
  hills(0.15, 360, 70, '#a8d8a0', 1);
  hills(0.4, 420, 50, '#7cc37a', 1.4);
}

function drawTiles(){
  const c0 = Math.max(0, Math.floor(cam/T)), c1 = Math.min(COLS-1, c0 + Math.ceil(VW/T) + 1);
  for(let ty=0; ty<ROWS; ty++) for(let tx=c0; tx<=c1; tx++){
    const v = grid[ty][tx]; if(!v) continue;
    const x = Math.round(tx*T - cam), y = ty*T;
    if(v === 1){
      ctx.fillStyle = '#8a5a3b'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#6f4630';
      if((tx*7+ty*13)%3===0) ctx.fillRect(x+8, y+24, 6, 4);
      if((tx*11+ty*5)%4===0) ctx.fillRect(x+24, y+12, 5, 4);
      if(ty === 0 || grid[ty-1][tx] !== 1){
        ctx.fillStyle = '#4caf50'; ctx.fillRect(x, y, T, 11);
        ctx.fillStyle = '#3d9142'; ctx.fillRect(x, y+11, T, 3);
        ctx.fillStyle = '#5cc761';
        for(let i=0;i<4;i++) ctx.fillRect(x+4+i*10, y-3, 3, 4);
      }
    } else if(v === 2){
      ctx.fillStyle = '#c98a3e'; ctx.fillRect(x+1, y+1, T-2, T-2);
      ctx.strokeStyle = '#7a4f1e'; ctx.lineWidth = 3;
      ctx.strokeRect(x+2.5, y+2.5, T-5, T-5);
      ctx.beginPath(); ctx.moveTo(x+5,y+5); ctx.lineTo(x+T-5,y+T-5); ctx.moveTo(x+T-5,y+5); ctx.lineTo(x+5,y+T-5); ctx.stroke();
    } else if(v === 4){
      ctx.fillStyle = '#b8533c'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#e9c9a8';
      ctx.fillRect(x, y+19, T, 2); ctx.fillRect(x, y, T, 2);
      ctx.fillRect(x+19, y, 2, 19); ctx.fillRect(x+8, y+21, 2, 19); ctx.fillRect(x+30, y+21, 2, 19);
    } else if(v === 3){
      ctx.fillStyle = '#c9ced6'; ctx.strokeStyle = '#59606b'; ctx.lineWidth = 2;
      for(let i=0;i<2;i++){
        ctx.beginPath(); ctx.moveTo(x+i*20+1, y+T); ctx.lineTo(x+i*20+10, y+14); ctx.lineTo(x+i*20+19, y+T); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }
    }
  }
}

function drawCoins(){
  for(const c of coins){
    if(c.got) continue;
    const x = c.x - cam; if(x < -20 || x > VW+20) continue;
    const w = Math.abs(Math.cos(clock*4 + c.x*0.02)) * 10 + 2;
    const y = c.y + Math.sin(clock*3 + c.x)*2;
    ctx.fillStyle = '#f2b705'; ctx.beginPath(); ctx.ellipse(x, y, w, 12, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, w-4), 8, 0, 0, 7); ctx.fill();
  }
}

function drawFlags(){
  for(const c of checkpoints){
    const x = c.x - cam + 20; if(x < -40 || x > VW+40) continue;
    ctx.fillStyle = '#555'; ctx.fillRect(x-2, 12*T-70, 4, 70);
    ctx.fillStyle = c.on ? '#ff8a1f' : '#9aa3ad';
    ctx.beginPath(); ctx.moveTo(x+2, 12*T-70); ctx.lineTo(x+30, 12*T-60); ctx.lineTo(x+2, 12*T-50); ctx.fill();
  }
  const x = flagX - cam + 20;
  if(x > -80 && x < VW+80){
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(x-3, 12*T-260, 6, 260);
    ctx.fillStyle = '#f2b705'; ctx.beginPath(); ctx.arc(x, 12*T-264, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#2fbf71'; ctx.beginPath(); ctx.moveTo(x+3, 12*T-250);
    for(let i=0;i<=10;i++) ctx.lineTo(x+3+i*6, 12*T-250 + Math.sin(clock*6 + i*0.6)*4*(i/10));
    for(let i=10;i>=0;i--) ctx.lineTo(x+3+i*6, 12*T-210 + Math.sin(clock*6 + i*0.6)*4*(i/10));
    ctx.fill();
    ctx.fillStyle = '#7a4f1e'; ctx.fillRect(x-14, 12*T-10, 28, 10);
  }
}

function drawEnemy(e){
  const x = e.x - cam; if(x < -40 || x > VW+40) return;
  if(!e.alive){
    if(e.squash <= 0) return;
    ctx.fillStyle = '#7b4fc9'; ctx.beginPath(); ctx.ellipse(x+15, e.y+24, 16, 5, 0, 0, 7); ctx.fill(); return;
  }
  const f = Math.sin(clock*12 + e.x*0.1) > 0;
  ctx.fillStyle = '#3a2466';
  ctx.beginPath(); ctx.ellipse(x+8, e.y+26 - (f?2:0), 7, 4, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+22, e.y+26 - (f?0:2), 7, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7b4fc9'; ctx.beginPath(); ctx.ellipse(x+15, e.y+14, 15, 13, 0, 0, 7); ctx.fill();
  const d = e.vx > 0 ? 2 : -2;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x+10, e.y+11, 4.5, 0, 7); ctx.arc(x+20, e.y+11, 4.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(x+10+d, e.y+12, 2.2, 0, 7); ctx.arc(x+20+d, e.y+12, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x+5, e.y+5); ctx.lineTo(x+13, e.y+8); ctx.moveTo(x+25, e.y+5); ctx.lineTo(x+17, e.y+8); ctx.stroke();
}

function drawPlayer(){
  const p = player;
  ctx.save(); ctx.translate(Math.round(p.x - cam + p.w/2), Math.round(p.y)); ctx.scale(p.face, 1);
  if(state === 'dead') { ctx.translate(0, 18); ctx.rotate(Math.PI); ctx.translate(0, -18); }
  const run = p.onGround && Math.abs(p.vx) > 20;
  const ph = run ? Math.sin(clock*20) : 0;
  ctx.fillStyle = '#2b4c9b';
  if(!p.onGround && state !== 'dead'){ rr(-10, 25, 8, 9, 2); rr(2, 23, 8, 9, 2); }
  else { rr(-9 + ph*4, 26, 7, 10, 2); rr(2 - ph*4, 26, 7, 10, 2); }
  ctx.fillStyle = '#3b2a20';
  if(p.onGround || state==='dead'){ rr(-10 + ph*4, 33, 9, 3, 1); rr(2 - ph*4, 33, 9, 3, 1); }
  ctx.fillStyle = '#e8453c'; rr(-11, 14, 22, 14, 5);
  ctx.fillStyle = '#f5c99b'; rr(-14 - ph*3, 17, 5, 9, 2);
  ctx.fillStyle = '#f5c99b'; ctx.beginPath(); ctx.arc(0, 9, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8453c'; ctx.beginPath(); ctx.arc(0, 7, 9.5, Math.PI, 0); ctx.fill(); rr(2, 4, 11, 3.5, 1.5);
  ctx.fillStyle = '#222'; ctx.fillRect(3, 8, 2.5, 3.5);
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(12, 12, 300, 40, 10);
  ctx.font = 'bold 20px system-ui,sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ff5a5f'; ctx.fillText('♥'.repeat(Math.max(0,lives)), 24, 33);
  ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(110, 32, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText('× ' + nCoins, 124, 33);
  ctx.fillText(String(score).padStart(5,'0'), 200, 33);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(VW-112, 12, 100, 40, 10);
  ctx.fillStyle = '#fff'; ctx.fillText(time.toFixed(1) + ' s', VW-24, 33);
  // barre de progression
  const pr = Math.min(1, player.x / flagX);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; rr(VW/2-120, 26, 240, 8, 4);
  ctx.fillStyle = '#2fbf71'; rr(VW/2-120, 26, 240*pr, 8, 4);
}

function overlay(title, lines, color){
  ctx.fillStyle = 'rgba(15,22,35,.62)'; ctx.fillRect(0,0,VW,VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 64px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(title, VW/2+4, 168);
  ctx.fillStyle = color; ctx.fillText(title, VW/2, 164);
  ctx.font = '20px system-ui,sans-serif'; ctx.fillStyle = '#e8eef6';
  lines.forEach((l,i) => ctx.fillText(l, VW/2, 240 + i*34));
  if(Math.floor(clock*2) % 2 === 0){
    ctx.font = 'bold 22px system-ui,sans-serif'; ctx.fillStyle = '#ffd43b';
    ctx.fillText(isTouch ? 'Touche l’écran pour jouer' : 'Appuie sur Espace pour jouer', VW/2, 240 + lines.length*34 + 40);
  }
}

function draw(){
  ctx.setTransform(sx,0,0,sy,0,0);
  if(state === 'play' || state === 'dead' || state === 'win'){
    const target = Math.max(0, Math.min(COLS*T - VW, player.x - VW*0.38));
    cam += (target - cam) * 0.15; if(state === 'play' && Math.abs(target-cam) > 300) cam = target;
  }
  drawBackground(); drawTiles(); drawFlags(); drawCoins();
  if(state !== 'menu'){ for(const e of enemies) drawEnemy(e); drawPlayer(); drawHUD(); }

  const ctl = isTouch ? 'Boutons ◀ ▶ pour avancer, SAUT pour sauter'
                      : 'Flèches ou Q / D pour avancer — Espace, ↑ ou Z pour sauter';
  if(state === 'menu') overlay('Petit Saut', [ctl, 'Évite les trous, les pics et saute sur les monstres.', 'Atteins le drapeau vert au bout du niveau !'], '#ffd43b');
  if(state === 'over') overlay('Perdu !', ['Score : ' + score + '   ·   Pièces : ' + nCoins, 'Meilleur score : ' + best], '#ff5a5f');
  if(state === 'win') overlay('Bravo !', ['Niveau terminé en ' + time.toFixed(1) + ' s', 'Score : ' + score + '   ·   Pièces : ' + nCoins + ' / ' + coins.length, 'Meilleur score : ' + best], '#2fbf71');
}

/* ---------- Boucle ---------- */
buildLevel(); respawn();
let last = performance.now(), acc = 0;
const DT = 1/120;
function loop(now){
  acc += Math.min(0.1, (now - last)/1000); last = now;
  while(acc >= DT){ step(DT); acc -= DT; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
