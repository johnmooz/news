<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pépin et le Château Farfelu</title>
<style>
  :root{--scr:#ececec;--hudbg:#111;--hudfg:#ececec;--ovbg:rgba(236,236,236,.96);--ovfg:#111;--shell:#c4c0b6;--brand:#333;--page:#1b1b1b;--sel:#111;--selfg:#ececec}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--page);color:#ddd;transition:background .3s;font-family:"Courier New",monospace;overflow:hidden;touch-action:none}
  #wrap{display:flex;flex-direction:column;align-items:center;height:100%;padding:10px;gap:10px;max-width:640px;margin:0 auto}
  #shell{width:100%;background:var(--shell);transition:background .3s;border-radius:12px 12px 40px 12px;padding:12px 12px 14px;box-shadow:0 6px 0 #8a877f}
  #screen{position:relative;background:var(--scr);border:6px solid #4a4a5a;border-radius:6px}
  #hud{display:flex;justify-content:space-between;background:var(--hudbg);color:var(--hudfg);font-weight:bold;font-size:13px;padding:3px 6px}
  canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--ovbg);color:var(--ovfg);padding:6px;overflow:hidden}
  #overlay h1{margin:0 0 4px;font-size:clamp(13px,4.2vw,20px);line-height:1.1}
  #overlay p{margin:2px 0;font-size:clamp(9px,2.9vw,13px);line-height:1.25}
  #overlay .blink{animation:bl 1s steps(2) infinite;font-weight:bold;margin-top:6px}
  @keyframes bl{50%{opacity:0}}
  #modes{display:flex;gap:8px;margin-top:6px}
  .mode{font-family:inherit;font-weight:bold;font-size:clamp(11px,3.4vw,14px);padding:5px 10px;border:3px solid var(--ovfg);border-radius:8px;background:transparent;color:var(--ovfg);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:96px}
  .mode small{font-size:10px;font-weight:normal}
  .mode .sw{display:flex;gap:2px;margin-top:3px}.mode .sw i{width:10px;height:10px;display:block;border:1px solid #0004}
  .mode.sel{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
  .hidden{display:none!important}
  #brand{color:var(--brand);font-weight:bold;font-style:italic;font-size:12px;margin-top:6px;text-align:left}
  #pad{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 6px}
  #dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
  .b{background:#2b2b2b;color:#777;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .b.on{background:#555}
  #up{grid-column:2;grid-row:1;border-radius:8px 8px 0 0}
  #left{grid-column:1;grid-row:2;border-radius:8px 0 0 8px}
  #mid{grid-column:2;grid-row:2;background:#2b2b2b}
  #right{grid-column:3;grid-row:2;border-radius:0 8px 8px 0}
  #down{grid-column:2;grid-row:3;border-radius:0 0 8px 8px}
  #side{display:flex;flex-direction:column;gap:14px;align-items:center}
  .round{width:66px;height:66px;border-radius:50%;background:#8b1d4a;color:#f3c;font-weight:bold;font-size:15px;border:none;box-shadow:0 4px 0 #5a1030;touch-action:none}
  .round.on{transform:translateY(3px);box-shadow:0 1px 0 #5a1030}
  .pill{background:#7a776f;color:#ddd;border:none;border-radius:10px;padding:6px 14px;font-size:11px;font-weight:bold;letter-spacing:1px;touch-action:none}
  #help{font-size:11px;color:#9ab;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="wrap">
  <div id="shell">
    <div id="screen">
      <div id="hud"><span id="hLevel">NIV 1</span><span id="hItems">★ 0/0</span><span id="hLives">♥3</span><span id="hScore">0</span></div>
      <canvas id="c" width="320" height="208"></canvas>
      <div id="overlay">
        <h1>PÉPIN<br>et le Château Farfelu</h1>
        <p>Ramasse toutes les étoiles ★. Pousse les caisses sur les monstres.</p>
        <p>Potion = invincible · Porte numérotée + ↑ = téléport</p>
        <div id="modes">
          <button class="mode" data-mode="retro">RÉTRO<small>noir &amp; blanc</small><span class="sw"><i style="background:#111"></i><i style="background:#555"></i><i style="background:#aaa"></i><i style="background:#ececec"></i></span></button>
          <button class="mode" data-mode="modern">MODERNE<small>couleur</small><span class="sw"><i style="background:#f6b26b"></i><i style="background:#5cc23a"></i><i style="background:#8fd3ff"></i><i style="background:#ff5fa8"></i></span></button>
        </div>
        <p class="blink" id="ovAction">CHOISIS UN MODE</p>
      </div>
    </div>
    <div id="brand">POCKET PLAY · remake</div>
  </div>
  <div id="pad">
    <div id="dpad">
      <button class="b" id="up" data-k="up">▲</button>
      <button class="b" id="left" data-k="left">◀</button>
      <div id="mid"></div>
      <button class="b" id="right" data-k="right">▶</button>
      <button class="b" id="down" data-k="down">▼</button>
    </div>
    <div id="side">
      <button class="round" id="btnA" data-k="up">A</button>
      <button class="pill" id="btnStart">START</button>
      <button class="pill" id="btnMusic">♪ ON</button>
    </div>
  </div>
  <div id="help">Clavier : flèches / ZQSD · Entrée = start/pause · A = ↑ (porte, échelle) · M = musique</div>
</div>
<script>
// ===== LEVELS (BEGIN) =====
const LEVELS = [

];
// ===== LEVELS (END) =====

const T=16, W=20, H=13;
const GR=['#111111','#555555','#aaaaaa','#ececec'];
const THEMES={
  retro:{label:'RÉTRO',sub:'noir & blanc',
    css:{'--scr':'#ececec','--hudbg':'#111','--hudfg':'#ececec','--ovbg':'rgba(236,236,236,.96)','--ovfg':'#111','--shell':'#c4c0b6','--brand':'#333','--page':'#1b1b1b','--sel':'#111','--selfg':'#ececec'},
    K:{bg:GR[3],dot:GR[2],wall:GR[1],wallLine:GR[0],wallTop:GR[2],rail:GR[0],rung:GR[1],starOut:GR[0],starIn:GR[2],potOut:GR[0],potA:GR[2],potB:GR[1],shine:GR[3],
       doorOut:GR[0],doorIn:GR[1],doorTxt:GR[3],crateOut:GR[0],crateFill:GR[2],crateLine:GR[1],inv1:GR[0],inv2:GR[1],txt:GR[0],banner:GR[3],poof:GR[0],shade:'rgba(17,17,17,.7)',shadeTxt:GR[3]},
    pepin:GR,blob:GR,spike:GR},
  modern:{label:'MODERNE',sub:'couleur',
    css:{'--scr':'#8fd3ff','--hudbg':'#1a1a2e','--hudfg':'#ffd23f','--ovbg':'rgba(255,248,224,.96)','--ovfg':'#1a1a2e','--shell':'#5b6ee1','--brand':'#fff','--page':'#151a3a','--sel':'#ff5fa8','--selfg':'#fff'},
    K:{bg:'#8fd3ff',dot:'#c3e9ff',wall:'#b5562f',wallLine:'#6e2c14',wallTop:'#5cc23a',rail:'#7a4a1c',rung:'#d4934a',starOut:'#b86b00',starIn:'#ffd23f',potOut:'#3a1d5c',potA:'#ff5fa8',potB:'#c0307a',shine:'#ffffff',
       doorOut:'#1d2f6e',doorIn:'#3f6fd8',doorTxt:'#ffffff',crateOut:'#5a3410',crateFill:'#e0a862',crateLine:'#9c6428',inv1:'#ffe066',inv2:'#ff8c42',txt:'#1a1a2e',banner:'#fff8e0',poof:'#ffb703',shade:'rgba(26,26,46,.7)',shadeTxt:'#ffd23f'},
    pepin:['#2b1a10','#7a3e12','#6cc644','#f6b26b'],blob:['#2a0f3d','#9b5de5','#000000','#ffffff'],spike:['#3d0a0a','#e63946','#000000','#ffffff']}
};
let theme=(()=>{try{return localStorage.getItem('pepin_theme')||'retro'}catch(e){return 'retro'}})();
if(!THEMES[theme])theme='retro';
let K, SP;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

// ---------- Sprites (original designs) ----------
function mk(rows,pal){
  const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d');
  rows.forEach((r,y)=>{r=r.padEnd(16,'.').slice(0,16);for(let x=0;x<16;x++){const ch=r[x];if(ch==='.')continue;g.fillStyle=pal[+ch];g.fillRect(x,y,1,1);}});
  return c;
}
const pepinBody=[
".......00.......",
"......0220......",
"......022000....",
".......0222.....",
".....000000.....",
"....03333330....",
"...0333333330...",
"...0330330330...",
"...0330330330...",
"...0333333330...",
"...0333003330...",
"....03333330....",
".....000000....."];
const pepinRowsA=[...pepinBody,"....010..010....","...0110..0110...","................"];
const pepinRowsB=[...pepinBody,".....010010.....","....0110.0110...","................"];
const pepinRowsC=[...pepinBody.slice(0,13),"...01......10...","..011......110..","................"];
const blobRows=f=>[
"................",
".....000000.....",
"....01111110....",
"...0111111110...",
"..011331133110..",
"..010031100310..",
"..011111111110..",
"..011100001110..",
"..011111111110..",
"..011111111110..",
"..011111111110..",
f?"..0110110110110.":"..011011011010..",
f?"...00.00.00.00..":"..0.00.00.00.0..",
"................","................","................"];

const spikeRows=f=>[
"................",
"..0....00....0..",
"...0..0110..0...",
"....00111100....",
"..0011111111000.",
".0.0113113110...",
"...0110110110...",
"..00111111110.0.",
".0.0111001110...",
"...0111111110...",
"....01111110.0..",
"...0.000000.....",
f?"...00......00...":"....00....00....",
f?"..000......000..":"...000....000...",
"................","................"];
function applyTheme(name){
  theme=name;const th=THEMES[name];K=th.K;
  SP={a:mk(pepinRowsA,th.pepin),b:mk(pepinRowsB,th.pepin),c:mk(pepinRowsC,th.pepin),
      enemy:[[mk(blobRows(0),th.blob),mk(blobRows(1),th.blob)],[mk(spikeRows(0),th.spike),mk(spikeRows(1),th.spike)]]};
  for(const k in th.css)document.documentElement.style.setProperty(k,th.css[k]);
  try{localStorage.setItem('pepin_theme',name)}catch(e){}
}
applyTheme(theme);

// ---------- Audio ----------
let AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d,type='square',vol=.06,slide=0){
  if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);
  g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
const sfx={
  item:()=>{beep(880,.08);setTimeout(()=>beep(1320,.1),70)},
  push:()=>beep(140,.12,'square',.07,-60),
  ko:()=>{beep(600,.25,'square',.06,-500)},
  door:()=>{beep(300,.15,'triangle',.08,500)},
  potion:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*70))},
  die:()=>{[400,300,220,150].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.07),i*140))},
  win:()=>{[523,523,784,1046,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110))}
};

// ---------- Music (original chiptune loop) ----------
// 0 = silence ; numbers = MIDI notes ; one step = an eighth note
const LEAD=[
 69,0,72,0,76,74,72,0, 71,0,74,0,77,76,74,0, 72,0,76,0,79,77,76,74, 72,71,69,0,71,0,0,0,
 69,0,72,0,76,74,72,0, 71,0,74,0,77,76,74,0, 72,0,76,79,81,79,77,76, 74,72,71,72,69,0,0,0,
 64,0,69,0,72,0,71,69, 65,0,69,0,72,0,74,72, 67,0,71,0,74,0,72,71, 69,0,68,0,69,0,64,0,
 65,0,69,0,72,0,74,0, 67,0,71,0,74,0,76,0, 76,0,77,76,74,72,71,72, 69,0,0,0,68,0,71,0];
const CHORDS=[45,43,41,40, 45,43,41,40, 45,38,43,40, 41,43,40,40]; // A G F E / A D G E / F G E E
const ARP=[0,7,12,7];
let musicOn=(()=>{try{return localStorage.getItem('pepin_music')!=='0'}catch(e){return true}})();
let mNext=0,mStep=0;
function mNote(m,t,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function mHat(t,vol){
  const n=AC.sampleRate*.03,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(AC.destination);s.start(t);
}
function musicTick(){
  if(!AC||!musicOn||!['play','intro','clear'].includes(state)){mNext=0;return;}
  try{
    const fast=player&&player.inv>0, step=60/(fast?170:132)/2;
    if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
    while(mNext<AC.currentTime+.2){
      const i=mStep%LEAD.length, t=mNext, m=LEAD[i];
      if(m)mNote(m+(fast?12:0),t,step*1.6,'square',.035);
      const root=CHORDS[Math.floor(i/8)];
      mNote(root+ARP[i%4]-12+12*(i%2),t,step*.9,'triangle',.09);
      if(i%2===1)mHat(t,.025);
      mNext+=step;mStep++;
    }
  }catch(e){}
}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('pepin_music',musicOn?'1':'0')}catch(e){}
  document.getElementById('btnMusic').textContent=musicOn?'♪ ON':'♪ OFF';}

// ---------- Input ----------
const keys={up:0,down:0,left:0,right:0};
let upEdge=false;
function setKey(k,v){if(k==='up'&&v&&!keys.up)upEdge=true;keys[k]=v;}
const KM={ArrowUp:'up',KeyW:'up',KeyZ:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{initAudio();if(KM[e.code]){setKey(KM[e.code],1);e.preventDefault();}
  if(state==='title'&&KM[e.code]&&(KM[e.code]==='left'||KM[e.code]==='right'))cycleTheme();
  if(state==='title'&&e.code==='Digit1'){applyTheme('retro');markSel();}
  if(state==='title'&&e.code==='Digit2'){applyTheme('modern');markSel();}
  if(e.code==='Enter'||e.code==='Space'){pressStart();e.preventDefault();}});
addEventListener('keyup',e=>{if(KM[e.code])setKey(KM[e.code],0);});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();b.classList.add('on');setKey(k,1);if(state==='title'&&(k==='left'||k==='right'))cycleTheme();else if(state!=='play'&&state!=='intro')pressStart();};
  const off=e=>{e.preventDefault();b.classList.remove('on');setKey(k,0);};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
});
document.getElementById('btnStart').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();pressStart();});
document.getElementById('btnMusic').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();toggleMusic();});
document.getElementById('btnMusic').textContent=musicOn?'♪ ON':'♪ OFF';
addEventListener('keydown',e=>{if(e.code==='KeyM')toggleMusic();});
document.getElementById('overlay').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();pressStart();});

// ---------- State ----------
let freezeT=0, state='title', levelIdx=0, lives=3, score=0, grid, items, totalItems, player, enemies, crates, introT=0, deadT=0, tick=0;
function load(){try{return +localStorage.getItem('pepin_lvl')||0}catch(e){return 0}}
function save(n){try{localStorage.setItem('pepin_lvl',n)}catch(e){}}

function startLevel(){
  const m=LEVELS[levelIdx];
  grid=m.map(r=>r.split(''));
  enemies=[];crates=[];items=0;totalItems=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ch=grid[y][x];
    if(ch==='S'){player=ent(x,y,6.2);player.inv=0;player.face=1;grid[y][x]='.';}
    else if(ch==='E'){const e=ent(x,y,2.6+levelIdx*.3);e.sx=x;e.sy=y;e.dir=enemies.length%2?1:-1;e.kind=(enemies.length+levelIdx)%2;e.ko=0;e.vdir=0;enemies.push(e);grid[y][x]='.';}
    else if(ch==='B'){const c=ent(x,y,11);c.slide=0;crates.push(c);grid[y][x]='.';}
    else if(ch==='C')totalItems++;
  }
  state='intro';introT=1.6;freezeT=2.5;player.safe=3;hud();
}
function ent(x,y,sp){return{x,y,tx:x,ty:y,mv:false,sp,dir:1,anim:0};}

// ---------- Map helpers ----------
const tile=(x,y)=>(x<0||y<0||x>=W||y>=H)?'#':grid[y][x];
const wall=(x,y)=>tile(x,y)==='#';
const ladder=(x,y)=>tile(x,y)==='H';
const crateAt=(x,y,ex)=>crates.find(c=>c!==ex&&Math.round(c.tx)===x&&Math.round(c.ty)===y);
function supported(x,y,self){return ladder(x,y)||wall(x,y+1)||ladder(x,y+1)||!!crateAt(x,y+1,self);}
const midLadder=(x,y)=>ladder(x,y)&&ladder(x,y+1);
function canH(x,y,d,self){const n=x+d;return !midLadder(x,y)&&!wall(n,y)&&!crateAt(n,y,self);}
const canUp=(x,y)=>ladder(x,y)&&!wall(x,y-1)&&!crateAt(x,y-1);
const canDown=(x,y)=>ladder(x,y+1);
function go(e,nx,ny,sp){e.tx=nx;e.ty=ny;e.mv=true;e.cs=sp||e.sp;}
function moveEnt(e,dt){
  if(!e.mv)return false;
  const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),s=e.cs*dt;
  if(d<=s){e.x=e.tx;e.y=e.ty;e.mv=false;return true;}
  e.x+=dx/d*s;e.y+=dy/d*s;e.anim+=dt;return false;
}

// ---------- Player ----------
function updatePlayer(dt){
  const p=player;
  if(p.inv>0)p.inv-=dt;
  if(moveEnt(p,dt))arrive();
  if(p.mv)return;
  const x=p.tx,y=p.ty;
  if(!supported(x,y)){go(p,x,y+1,10);return;}
  const t=tile(x,y);
  if(upEdge&&/[1-9]/.test(t)){
    for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++)if(grid[yy][xx]===t&&(xx!==x||yy!==y)){p.x=p.tx=xx;p.y=p.ty=yy;sfx.door();upEdge=false;return;}
  }
  upEdge=false;
  if(keys.up&&canUp(x,y)){go(p,x,y-1);p.climb=true;return;}
  if(keys.down&&canDown(x,y)){go(p,x,y+1);p.climb=true;return;}
  const d=keys.left?-1:keys.right?1:0;
  if(d){
    p.face=d;p.climb=false;
    const c=crateAt(x+d,y);
    if(c&&!c.mv&&!midLadder(x,y)){ if(!c.slide&&canH(c.tx,c.ty,d,c)){c.slide=d;sfx.push();} return;}
    if(canH(x,y,d))go(p,x+d,y);
  }
}
function arrive(){
  const p=player,t=tile(p.tx,p.ty);
  if(!ladder(p.tx,p.ty))p.climb=false;
  if(t==='C'){grid[p.ty][p.tx]='.';items++;score+=100;sfx.item();hud();
    if(items>=totalItems){state='clear';deadT=2;score+=500*(levelIdx+1);hud();sfx.win();}}
  else if(t==='P'){grid[p.ty][p.tx]='.';p.inv=7;score+=50;sfx.potion();hud();}
}

// ---------- Enemies ----------
function updateEnemy(e,dt){
  if(e.dead){if(e.poof>0)e.poof-=dt;return;}
  moveEnt(e,dt);
  if(e.mv)return;
  const x=e.tx,y=e.ty,p=player,py=Math.round(p.ty),px=Math.round(p.tx);
  if(!supported(x,y)){go(e,x,y+1,10);return;}
  // continue on ladder
  if(e.vdir===-1&&canUp(x,y)&&ladder(x,y)){go(e,x,y-1);return;}
  if(e.vdir===1&&canDown(x,y)){go(e,x,y+1);return;}
  e.vdir=0;
  if(y===py&&!midLadder(x,y)){
    const d=Math.sign(px-x)||e.dir;let clear=true;
    for(let i=x;i!==px;i+=d)if(wall(i+d,y)||crateAt(i+d,y)){clear=false;break;}
    if(clear&&canH(x,y,d)&&supported(x+d,y)){e.dir=d;go(e,x+d,y);return;}
  }
  if(py<y&&canUp(x,y)&&Math.random()<.8){e.vdir=-1;go(e,x,y-1);return;}
  if(py>y&&canDown(x,y)&&Math.random()<.8){e.vdir=1;go(e,x,y+1);return;}
  if(midLadder(x,y)){ if(canDown(x,y)){e.vdir=1;go(e,x,y+1);} else if(canUp(x,y)){e.vdir=-1;go(e,x,y-1);} return;}
  for(let k=0;k<2;k++){
    if(canH(x,y,e.dir)&&supported(x+e.dir,y)&&!enemies.some(o=>o!==e&&!o.dead&&o.tx===x+e.dir&&o.ty===y)){go(e,x+e.dir,y);return;}
    e.dir*=-1;
  }
}

// ---------- Crates ----------
function updateCrate(c,dt){
  moveEnt(c,dt);
  if(!c.mv){
    const x=c.tx,y=c.ty;
    if(!wall(x,y+1)&&!ladder(x,y+1)&&!crateAt(x,y+1,c)&&!ladder(x,y)){go(c,x,y+1,10);}
    else if(c.slide){ if(canH(x,y,c.slide,c)&&!(player.tx===x+c.slide&&player.ty===y))go(c,x+c.slide,y,11); else {c.slide=0;sfx.push();} }
  }
  if(c.mv)for(const e of enemies)if(!e.dead&&Math.abs(e.x-c.x)<.8&&Math.abs(e.y-c.y)<.8)koEnemy(e,300);
}
function koEnemy(e,pts){e.ko=1;e.dead=true;e.poof=.6;e.kx=e.x;e.ky=e.y;score+=pts;sfx.ko();hud();}

// ---------- Loop ----------
function update(dt){
  tick+=dt;
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return;}
  if(state==='dead'){deadT-=dt;if(deadT<=0){if(lives<=0){state='over';showOverlay('GAME OVER',`Score : ${score}`,'TOUCHE POUR RÉESSAYER CE NIVEAU');}else startLevel();}return;}
  if(state==='clear'){deadT-=dt;if(deadT<=0){levelIdx++;
    if(levelIdx>=LEVELS.length){state='won';save(0);showOverlay('BRAVO !','Le Château Farfelu est vidé de ses étoiles.<br>Score final : '+score,'TOUCHE POUR REJOUER');}
    else{save(levelIdx);startLevel();}}return;}
  if(state!=='play')return;
  updatePlayer(dt);
  crates.forEach(c=>updateCrate(c,dt));
  if(player.safe>0)player.safe-=dt;
  if(freezeT>0)freezeT-=dt; else enemies.forEach(e=>updateEnemy(e,dt));
  for(const e of enemies){
    if(e.dead)continue;
    if(Math.abs(e.x-player.x)<.7&&Math.abs(e.y-player.y)<.7){
      if(player.safe>0)continue;
      if(player.inv>0)koEnemy(e,500);
      else{lives--;state='dead';deadT=1.6;sfx.die();hud();break;}
    }
  }
}

// ---------- Render ----------
function drawTile(ch,x,y){
  const X=x*T,Y=y*T;
  if(ch==='#'){
    ctx.fillStyle=K.wall;ctx.fillRect(X,Y,T,T);ctx.fillStyle=K.wallLine;
    ctx.fillRect(X,Y+7,T,1);ctx.fillRect(X,Y+15,T,1);
    const o=(y%2)*4;ctx.fillRect(X+((4+o)%16),Y,1,7);ctx.fillRect(X+((12+o)%16),Y+8,1,7);
    ctx.fillStyle=K.wallTop;ctx.fillRect(X,Y,T,(y>0&&tile(x,y-1)!=='#')?3:1);
  }else if(ch==='H'){
    ctx.fillStyle=K.rail;ctx.fillRect(X+3,Y,2,T);ctx.fillRect(X+11,Y,2,T);
    ctx.fillStyle=K.rung;for(let i=2;i<T;i+=5)ctx.fillRect(X+5,Y+i,6,2);
  }else if(ch==='C'){
    const b=Math.sin(tick*5+x)*1.5|0;star(X+8,Y+8+b);
  }else if(ch==='P'){
    ctx.fillStyle=K.potOut;ctx.fillRect(X+6,Y+2,4,2);ctx.fillRect(X+7,Y+4,2,3);
    ctx.fillRect(X+4,Y+7,8,7);ctx.fillStyle=(tick*4|0)%2?K.potA:K.potB;ctx.fillRect(X+5,Y+9,6,4);
    ctx.fillStyle=K.shine;ctx.fillRect(X+6,Y+9,1,2);
  }else if(/[1-9]/.test(ch)){
    ctx.fillStyle=K.doorOut;ctx.fillRect(X+2,Y+2,12,14);ctx.fillRect(X+4,Y,8,2);
    ctx.fillStyle=K.doorIn;ctx.fillRect(X+4,Y+3,8,13);
    ctx.fillStyle=K.doorTxt;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(ch,X+8,Y+12);
  }
}
function star(cx,cy){
  ctx.fillStyle=K.starOut;
  ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?3:7,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.fill();
  ctx.fillStyle=K.starIn;ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?1.6:4.5,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.fill();
}
function drawCrate(c){
  const X=Math.round(c.x*T),Y=Math.round(c.y*T);
  ctx.fillStyle=K.crateOut;ctx.fillRect(X+1,Y+1,14,15);ctx.fillStyle=K.crateFill;ctx.fillRect(X+2,Y+2,12,13);
  ctx.fillStyle=K.crateLine;for(let i=0;i<12;i++){ctx.fillRect(X+2+i,Y+2+i,1,1);ctx.fillRect(X+13-i,Y+2+i,1,1);}
  ctx.fillRect(X+2,Y+2,12,1);ctx.fillRect(X+2,Y+14,12,1);
}
function render(){
  ctx.fillStyle=K.bg;ctx.fillRect(0,0,cv.width,cv.height);
  if(!grid)return;
  ctx.fillStyle=K.dot;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if((x*7+y*13)%11===0)ctx.fillRect(x*T+7,y*T+7,2,2);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(grid[y][x],x,y);
  crates.forEach(drawCrate);
  for(const e of enemies){
    if(e.dead){
      if(e.poof>0){const k=1-e.poof/.6,cx=e.kx*T+8,cy=e.ky*T+8;ctx.fillStyle=K.poof;
        for(let i=0;i<8;i++){const a=i*Math.PI/4,r=3+k*10;ctx.fillRect(cx+Math.cos(a)*r-1,cy+Math.sin(a)*r-1,3,3);}
        if(k<.5)star(cx,cy);}
      continue;}
    const f=SP.enemy[e.kind][(e.anim*6|0)%2];
    ctx.save();if(e.dir<0){ctx.translate(Math.round(e.x*T)+16,0);ctx.scale(-1,1);ctx.drawImage(f,0,Math.round(e.y*T));}else ctx.drawImage(f,Math.round(e.x*T),Math.round(e.y*T));ctx.restore();
  }
  const p=player;
  if(p&&!(state==='dead'&&(tick*10|0)%2)&&!(p.inv>0&&p.inv<2&&(tick*12|0)%2)&&!(p.safe>0&&(tick*8|0)%2)){
    let s=p.climb&&ladder(p.tx,p.ty)?SP.c:(p.mv?((p.anim*8|0)%2?SP.a:SP.b):SP.a);
    const X=Math.round(p.x*T),Y=Math.round(p.y*T);
    if(p.inv>0){ctx.fillStyle=(tick*10|0)%2?K.inv1:K.inv2;ctx.fillRect(X-1,Y,18,16);}
    ctx.drawImage(s,X,Y);
  }
  if(state==='intro'||state==='clear'){
    ctx.fillStyle=K.txt;ctx.fillRect(80,82,160,44);ctx.fillStyle=K.banner;ctx.fillRect(82,84,156,40);
    ctx.fillStyle=K.txt;ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(state==='intro'?`NIVEAU ${levelIdx+1}`:'ÉTAGE NETTOYÉ !',160,103);
    ctx.font='10px monospace';ctx.fillText(state==='intro'?`${totalItems} étoiles à trouver`:`+${500*(levelIdx+1)} pts`,160,117);
  }
  if(state==='play'&&freezeT>0){ctx.fillStyle=K.txt;ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(freezeT>.6?'PRÊT ?':'GO !',160,14);}
  if(state==='pause'){ctx.fillStyle=K.shade;ctx.fillRect(0,0,320,208);ctx.fillStyle=K.shadeTxt;ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('PAUSE',160,108);}
}
function hud(){
  document.getElementById('hLevel').textContent='NIV '+(levelIdx+1);
  document.getElementById('hItems').textContent=`★ ${items}/${totalItems}`;
  document.getElementById('hLives').textContent='♥'+Math.max(0,lives);
  document.getElementById('hScore').textContent=String(score).padStart(6,'0');
}
const ov=document.getElementById('overlay');
function showOverlay(t,p,a){ov.innerHTML=`<h1>${t}</h1><p>${p}</p><p class="blink">${a}</p>`;ov.classList.remove('hidden');}
function pressStart(){
  if(state==='title'){const l=load();levelIdx=l<LEVELS.length?l:0;lives=3;score=0;ov.classList.add('hidden');startLevel();}
  else if(state==='over'){lives=3;score=0;ov.classList.add('hidden');startLevel();}
  else if(state==='won'){levelIdx=0;lives=3;score=0;ov.classList.add('hidden');startLevel();}
  else if(state==='play')state='pause';
  else if(state==='pause')state='play';
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});
function markSel(){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('sel',b.dataset.mode===theme));}
function cycleTheme(){applyTheme(theme==='retro'?'modern':'retro');markSel();beep(660,.05);}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();applyTheme(b.dataset.mode);markSel();pressStart();}));
markSel();
(function(){const l=load();document.getElementById('ovAction').textContent='CHOISIS UN MODE'+(l>0?` · REPRISE NIV ${l+1}`:'');})();

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();musicTick();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
