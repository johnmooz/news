<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moto Rider 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#c{display:block;position:fixed;inset:0}
  .overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,12,28,.78);backdrop-filter:blur(4px);overflow:auto;padding:24px 16px;z-index:5}
  .overlay.center{align-items:center}
  .hidden{display:none!important}
  .panel{max-width:1180px;width:100%;margin:auto}
  h1{font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,6vw,66px);margin:0;text-align:center;letter-spacing:2px;color:#fbbf24;text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.5);font-weight:400}
  .sub{text-align:center;opacity:.85;margin:6px 0 0;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}
  .card{background:#141a33;border:2px solid #2a3360;border-radius:16px;padding:10px 12px 12px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .card:hover{transform:translateY(-2px);border-color:#4b5aa8}
  .card.sel{border-color:#fbbf24;background:#1c2346;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
  .card canvas{width:100%;height:auto;display:block;background:linear-gradient(#34508f,#1a2347);border-radius:10px}
  .card h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:8px 0 2px;font-size:19px;color:#fde68a}
  .card p{margin:0 0 8px;font-size:12.5px;opacity:.8;min-height:32px}
  .stat{display:grid;grid-template-columns:72px 1fr 60px;align-items:center;gap:6px;font-size:12px;margin:4px 0}
  .stat span:last-child{text-align:right;font-weight:600}
  .bar{height:7px;background:#0b1020;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444)}
  .vmax{font-size:12px;margin-top:6px;opacity:.75}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .btn{font-family:Bungee,Impact,sans-serif;font-size:20px;padding:13px 30px;border:none;border-radius:12px;background:#fbbf24;color:#1a1a1a;cursor:pointer;box-shadow:0 4px 0 #b45309;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b45309}
  .btn.alt{background:#334155;color:#fff;box-shadow:0 4px 0 #0f172a}
  .help{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;font-size:13px;opacity:.88;margin-top:6px}
  kbd{background:#2a3360;border-radius:5px;padding:2px 7px;font-family:inherit;border-bottom:2px solid #11163a;font-size:12px}
  .big{font-family:Bungee,Impact,sans-serif;font-size:clamp(40px,8vw,80px);text-align:center;margin:10px 0 0;color:#fff}
  .rec{text-align:center;font-size:18px;margin:6px 0;opacity:.9}
  .new{color:#4ade80;font-weight:800}
  .best{text-align:center;margin-top:8px;font-size:14px;opacity:.8}
  #touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:14px 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:3}
  #touch .grp{display:flex;gap:12px;pointer-events:auto}
  #touch button{width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(10,15,35,.45);color:#fff;font:800 12px Inter,sans-serif;touch-action:none;line-height:1.15}
  #touch button b{display:block;font-size:22px}
  #touch button.on{background:rgba(251,191,36,.65);color:#111}
  #topbtns{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:4}
  .ctrlsel{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0 10px;font-weight:600}
  .opt{font:700 15px Inter,sans-serif;padding:10px 18px;border-radius:12px;border:2px solid #2a3360;background:#141a33;color:#fff;cursor:pointer}
  .opt.sel{border-color:#fbbf24;background:#1c2346;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
  #topbtns button{width:42px;height:42px;border-radius:10px;border:none;background:rgba(10,15,35,.55);color:#fff;font:800 18px Inter,sans-serif;cursor:pointer}
  #topbtns button.off{opacity:.45}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbtns" class="hidden">
  <button id="bZoomOut" title="Dézoomer (−)">−</button>
  <button id="bZoomIn" title="Zoomer (+)">+</button>
  <button id="bMusic" title="Musique (M)">🎵</button>
  <button id="bSfx" title="Bruitages (N)">🔊</button>
  <button id="bPause" title="Pause (P)">⏸</button>
</div>

<div id="touch" class="hidden">
  <div class="grp">
    <button data-k="back"><b>↺</b>Arrière</button>
    <button data-k="fwd"><b>↻</b>Avant</button>
  </div>
  <div class="grp">
    <button data-k="brake"><b>■</b>Frein</button>
    <button data-k="gas"><b>▲</b>Gaz</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>MOTO RIDER</h1>
    <p class="sub">Va le plus loin possible ! 3 vies, des bosses, des tremplins… et le vide en dessous.</p>
    <div class="grid" id="grid"></div>
    <div class="row"><button class="btn" id="bStart">C'est parti !</button></div>
    <div class="ctrlsel"><span>Jouer avec :</span>
      <button class="opt" data-mode="keyboard">⌨️ Clavier</button>
      <button class="opt" data-mode="touch">📱 Écran tactile</button>
    </div>
    <div class="help" id="help"></div>
    <div class="best" id="menuBest"></div>
  </div>
</div>

<div id="pause" class="overlay center hidden">
  <div class="panel">
    <h1>PAUSE</h1>
    <div class="row"><button class="btn" id="bResume">Reprendre</button><button class="btn alt" id="bQuit">Menu</button></div>
  </div>
</div>

<div id="over" class="overlay center hidden">
  <div class="panel">
    <h1>GAME OVER</h1>
    <div class="big" id="ovDist">0 m</div>
    <div class="rec" id="ovRec"></div>
    <div class="row"><button class="btn" id="bAgain">Rejouer</button><button class="btn alt" id="bChange">Changer de moto</button></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, PX = 40, basePX = 40, zoom = 1, zoomT = 1, zoomToast = 0;
try { zoom = zoomT = Math.max(0.5, Math.min(2, +localStorage.getItem('motoRider.zoom') || 1)); } catch (e) {}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  basePX = Math.max(24, Math.min(54, Math.min(H / 14, W / 22)));
  PX = basePX * zoom;
}
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const G = 9.81;

/* ============ MOTOS ============ */
const BIKES = [
  { id:'cross', name:'Moto Cross', desc:'Légère, suspensions très longues : la reine des sauts et du wheeling.',
    color:'#f97316', color2:'#fff7ed', jacket:'#1d4ed8', helmet:'#f97316', pants:'#1e293b',
    mass:105, power:38000, force:1250, k:9000, c:950, travel:0.30, grip:1.45, maxImpact:15, air:8,
    L:1.45, r:0.36, hc:0.42, seat:[-0.22,0.22], bar:[0.36,0.44], peg:[-0.05,-0.2], tuck:0.15, stand:false, headT:[0.42,0.30],
    knobby:true, spokes:true, sound:1.25, ui:{ch:52, nm:62, soft:9} },
  { id:'roadster', name:'Roadster', desc:'Polyvalent et nerveux, bon compromis puissance / poids.',
    color:'#dc2626', color2:'#fecaca', jacket:'#111827', helmet:'#e5e7eb', pants:'#1f2937',
    mass:190, power:75000, force:2050, k:16000, c:1500, travel:0.18, grip:1.45, maxImpact:13, air:6,
    L:1.45, r:0.32, hc:0.36, seat:[-0.27,0.15], bar:[0.35,0.36], peg:[-0.05,-0.2], tuck:0.25, stand:false, headT:[0.42,0.24],
    knobby:false, spokes:false, sound:1.0, ui:{ch:100, nm:95, soft:6} },
  { id:'custom', name:'Custom', desc:'Lourde et coupleuse, très stable… mais les réceptions piquent.',
    color:'#111827', color2:'#9ca3af', jacket:'#78350f', helmet:'#1f2937', pants:'#1e3a8a', frameCol:'#1f2937', rim:'#e5e7eb',
    mass:300, power:50000, force:3200, k:26000, c:2400, travel:0.11, grip:1.4, maxImpact:12, air:4,
    L:1.70, r:0.34, hc:0.30, seat:[-0.35,0.08], bar:[0.42,0.55], peg:[0.52,-0.15], tuck:-0.15, stand:false, headT:[0.50,0.22],
    knobby:false, spokes:true, sound:0.7, ui:{ch:68, nm:155, soft:3} },
  { id:'sport', name:'Sportive', desc:'Une fusée : énorme puissance et vitesse de pointe, suspensions fermes.',
    color:'#2563eb', color2:'#f8fafc', jacket:'#2563eb', helmet:'#facc15', pants:'#111827',
    mass:190, power:140000, force:2150, k:20000, c:1800, travel:0.14, grip:1.5, maxImpact:12.5, air:6,
    L:1.40, r:0.31, hc:0.38, seat:[-0.27,0.20], bar:[0.33,0.26], peg:[-0.15,-0.12], tuck:0.7, stand:false, headT:[0.42,0.22],
    knobby:false, spokes:false, sound:1.55, ui:{ch:190, nm:115, soft:4} },
  { id:'trial', name:'Trial', desc:'Ultra-légère et maniable, debout sur les cale-pieds. Lente mais agile.',
    color:'#16a34a', color2:'#e5e7eb', jacket:'#dc2626', helmet:'#f8fafc', pants:'#111827', frameCol:'#9ca3af',
    mass:72, power:18000, force:950, k:6500, c:700, travel:0.35, grip:1.7, maxImpact:14.5, air:10,
    L:1.32, r:0.34, hc:0.45, seat:[-0.4,0.1], bar:[0.40,0.44], peg:[-0.03,-0.22], tuck:0.3, stand:true, headT:[0.38,0.25],
    knobby:true, spokes:true, sound:1.1, ui:{ch:25, nm:48, soft:10} },
];

/* Dessin de chaque moto (repère moto, mètres, y vers le haut, origine = centre de gravité) */
const DESIGN = {
  cross:{
    exhaust:[[0.05,-0.2],[-0.25,-0.05],[-0.55,0.08],[-0.8,0.18]],
    frame:[[[0.42,0.30],[0.1,0.1],[-0.1,-0.3]],[[0.42,0.25],[0.15,-0.3]]],
    body:[{f:'c',p:[[-0.98,0.34],[-0.6,0.22],[-0.3,0.2],[-0.1,0.24],[0.2,0.3],[0.45,0.34],[0.38,0.08],[0.12,0.0],[-0.2,-0.02],[-0.55,0.1],[-0.8,0.22]]},
          {f:'c2',p:[[-0.42,0.15],[-0.15,0.13],[-0.2,0.04],[-0.44,0.08]]}],
    seat:[[-0.68,0.25],[-0.05,0.27],[0.1,0.29]],
    front:[{f:'c',p:[[0.5,0.0],[0.78,0.02],[1.02,-0.02],[0.98,-0.05],[0.6,-0.04]]}],
    plate:[0.47,0.2]
  },
  roadster:{
    exhaust:[[0.05,-0.3],[-0.4,-0.28],[-0.5,-0.25]], muffler:[[-0.45,-0.25],[-0.75,-0.15]],
    frame:[[[0.42,0.24],[0.0,0.12],[-0.55,0.12]],[[0.42,0.2],[0.2,-0.25]]],
    body:[{f:'c',p:[[-0.1,0.13],[0.0,0.3],[0.25,0.33],[0.42,0.24],[0.3,0.08],[0.0,0.05]]},
          {f:'c',p:[[-0.9,0.22],[-0.55,0.14],[-0.25,0.14],[-0.3,0.08],[-0.7,0.1]]},
          {f:'c2',p:[[0.05,0.22],[0.3,0.26],[0.33,0.22],[0.08,0.18]]}],
    seat:[[-0.6,0.17],[-0.1,0.17]],
    front:[{f:'#222',p:[[0.52,0.0],[0.8,0.01],[0.92,-0.06],[0.6,-0.03]]}],
    light:[0.55,0.18,0.075]
  },
  custom:{
    exhaust:[[0.0,-0.18],[-0.5,-0.22],[-0.75,-0.21]], muffler:[[-0.7,-0.21],[-1.15,-0.17]], chrome:true,
    frame:[[[0.5,0.22],[0.05,0.08],[-0.55,0.02]],[[0.5,0.18],[0.25,-0.28],[-0.1,-0.28]]],
    body:[{f:'c',p:[[-0.05,0.08],[0.08,0.2],[0.38,0.22],[0.48,0.14],[0.3,0.04]]},
          {f:'c',p:[[-1.18,-0.14],[-1.08,0.08],[-0.85,0.15],[-0.55,0.1],[-0.55,0.03],[-0.85,0.07],[-1.06,0.0]]},
          {f:'#5b3a29',p:[[-0.62,0.06],[-0.47,0.13],[-0.15,0.07],[-0.08,0.02],[-0.5,0.0]]},
          {f:'c2',p:[[0.1,0.15],[0.35,0.17],[0.36,0.14],[0.12,0.12]]}],
    front:[{f:'c',p:[[0.68,0.08],[0.95,0.1],[1.1,0.02],[0.75,0.05]]}],
    light:[0.6,0.22,0.08]
  },
  sport:{
    exhaust:[[0.0,-0.32],[-0.2,-0.3]], muffler:[[-0.3,-0.1],[-0.62,0.1]],
    body:[{f:'c',p:[[-0.88,0.34],[-0.55,0.2],[-0.2,0.17],[0.0,0.27],[0.28,0.3],[0.5,0.32],[0.64,0.16],[0.6,-0.04],[0.38,-0.24],[0.0,-0.28],[-0.2,-0.14],[-0.5,0.08],[-0.78,0.24]]},
          {f:'c2',p:[[0.1,-0.05],[0.5,0.12],[0.52,0.06],[0.15,-0.12]]},
          {f:'rgba(170,215,255,0.65)',p:[[0.28,0.3],[0.4,0.44],[0.52,0.33]]}],
    seat:[[-0.55,0.21],[-0.12,0.2]],
    front:[{f:'#222',p:[[0.55,-0.02],[0.8,-0.02],[0.85,-0.07],[0.58,-0.06]]}],
    light:[0.61,0.13,0.04]
  },
  trial:{
    exhaust:[[0.05,-0.25],[-0.3,-0.05],[-0.62,0.05]],
    frame:[[[0.38,0.25],[0.0,0.0],[-0.12,-0.35]]],
    body:[{f:'c',p:[[-0.82,0.12],[-0.45,0.06],[0.05,0.1],[0.28,0.2],[0.4,0.24],[0.3,0.05],[0.05,-0.05],[-0.35,-0.02]]},
          {f:'c2',p:[[0.0,0.1],[0.22,0.18],[0.25,0.1],[0.05,0.04]]}],
    seat:[[-0.6,0.12],[-0.32,0.1]],
    front:[{f:'c',p:[[0.52,-0.07],[0.85,-0.08],[0.86,-0.11],[0.52,-0.11]]}]
  }
};

function pose(c, lean){
  const sh = -lean * 0.16;
  const hip = c.stand ? [c.peg[0] - 0.08 + sh, c.peg[1] + 0.74] : [c.seat[0], c.seat[1] + 0.06];
  const t = c.tuck;
  const shoulder = [hip[0] + 0.12 + t * 0.3 + sh, hip[1] + 0.55 - t * 0.2];
  const head = [shoulder[0] + 0.06 + t * 0.12, shoulder[1] + 0.2];
  const hand = [c.bar[0], c.bar[1]], foot = [c.peg[0], c.peg[1]];
  const knee = [(hip[0] + foot[0]) / 2 + 0.22, (hip[1] + foot[1]) / 2 + 0.08];
  const elbow = [(shoulder[0] + hand[0]) / 2, (shoulder[1] + hand[1]) / 2 - 0.07];
  return { hip, shoulder, head, hand, foot, knee, elbow };
}

/* ============ DESSIN ============ */
function poly(g, pts, fill){ g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillStyle = fill; g.fill(); }
function line(g, pts, col, lw){ g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); }
function circ(g, x, y, r, fill){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }

function wheel(g, x, y, r, rot, c){
  const tw = c.id === 'custom' ? 0.11 : (c.knobby ? 0.095 : 0.085);
  g.beginPath(); g.arc(x, y, r - tw / 2, 0, Math.PI * 2); g.strokeStyle = '#15151a'; g.lineWidth = tw; g.stroke();
  if (c.knobby){
    g.fillStyle = '#15151a';
    for (let i = 0; i < 18; i++){
      const an = rot + i * Math.PI * 2 / 18;
      g.save(); g.translate(x + Math.cos(an) * r, y + Math.sin(an) * r); g.rotate(an); g.fillRect(-0.02, -0.025, 0.04, 0.05); g.restore();
    }
  }
  const rr = r - tw;
  g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.strokeStyle = c.rim || '#cfd4da'; g.lineWidth = 0.025; g.stroke();
  if (c.spokes){
    g.strokeStyle = '#a8afba'; g.lineWidth = 0.009; g.beginPath();
    for (let i = 0; i < 16; i++){ const an = rot + i * Math.PI / 8; g.moveTo(x + Math.cos(an + 0.4) * 0.045, y + Math.sin(an + 0.4) * 0.045); g.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
    g.stroke();
  } else {
    g.strokeStyle = c.rim || '#cfd4da'; g.lineWidth = 0.035; g.beginPath();
    for (let i = 0; i < 5; i++){ const an = rot + i * Math.PI * 2 / 5; g.moveTo(x, y); g.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
    g.stroke();
  }
  circ(g, x, y, 0.05, '#7c828c');
}

function drawRider(g, c, p){
  line(g, [p.hip, p.knee, p.foot], c.pants, 0.12);
  circ(g, p.foot[0] + 0.03, p.foot[1], 0.06, '#111');
  line(g, [p.hip, p.shoulder], c.jacket, 0.2);
  line(g, [p.shoulder, p.elbow, p.hand], c.jacket, 0.085);
  circ(g, p.hand[0], p.hand[1], 0.045, '#111');
  const hx = p.head[0], hy = p.head[1];
  circ(g, hx, hy, 0.14, c.helmet);
  poly(g, [[hx + 0.03, hy + 0.03], [hx + 0.145, hy + 0.02], [hx + 0.12, hy - 0.06], [hx + 0.03, hy - 0.05]], '#0f172a');
  if (c.knobby) poly(g, [[hx - 0.04, hy + 0.11], [hx + 0.22, hy + 0.09], [hx + 0.2, hy + 0.05], [hx, hy + 0.07]], c.helmet);
}

function drawBike(g, c, st){
  const D = DESIGN[c.id], L = c.L, hc = c.hc, r = c.r;
  const pr = Math.min(st.penR || 0, c.travel + 0.06), pf = Math.min(st.penF || 0, c.travel + 0.06);
  const R = [-L / 2, -hc + pr], F = [L / 2, -hc + pf], Hd = c.headT;
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (D.exhaust) line(g, D.exhaust, D.chrome ? '#d1d5db' : '#9aa0a8', 0.065);
  if (D.muffler) line(g, D.muffler, D.chrome ? '#e5e7eb' : '#6b7280', 0.12);
  wheel(g, R[0], R[1], r, st.rotR || 0, c);
  wheel(g, F[0], F[1], r, st.rotF || 0, c);
  line(g, [R, [-0.05, -hc + 0.14]], c.frameCol || '#2b2b30', 0.075);
  if (c.id === 'custom'){
    poly(g, [[-0.25, -hc + 0.03], [0.2, -hc + 0.03], [0.22, -hc + 0.18], [-0.25, -hc + 0.18]], '#2a2a2e');
    for (const an of [0.5, -0.5]){
      g.save(); g.translate(-0.02, -hc + 0.16); g.rotate(an);
      poly(g, [[-0.065, 0], [0.065, 0], [0.065, 0.2], [-0.065, 0.2]], '#c0c4ca');
      g.strokeStyle = '#7c828c'; g.lineWidth = 0.01; g.beginPath();
      for (let k = 1; k < 5; k++){ g.moveTo(-0.065, k * 0.04); g.lineTo(0.065, k * 0.04); }
      g.stroke(); g.restore();
    }
  } else {
    poly(g, [[-0.22, -hc + 0.04], [0.18, -hc + 0.02], [0.2, -hc + 0.3], [-0.18, -hc + 0.32]], '#34343a');
    g.strokeStyle = '#55555d'; g.lineWidth = 0.012; g.beginPath();
    for (let k = 1; k < 4; k++){ g.moveTo(-0.17, -hc + 0.04 + k * 0.07); g.lineTo(0.17, -hc + 0.04 + k * 0.07); }

  }
  if (D.frame) for (const f of D.frame) line(g, f, c.frameCol || '#2b2b30', 0.05);
  for (const b of D.body) poly(g, b.p, b.f === 'c' ? c.color : b.f === 'c2' ? c.color2 : b.f);
  if (D.seat) line(g, D.seat, '#1b1b1f', 0.075);

  line(g, [[Hd[0] + 0.02, Hd[1]], [F[0] + 0.01, F[1]]], '#c7ccd2', 0.06);

/* ============ TERRAIN ============ */
let T;
function add(x, y){ T.pts.push({ x, y, hole:false }); }
function newTerrain(){
  T = { pts:[], holes:[], cps:[0], gx:-30, gy:0 };
  add(-30, 0); flat(70);
}
function flat(len){ const n = Math.max(1, Math.ceil(len / 3)); for (let i = 1; i <= n; i++) add(T.gx + len * i / n, T.gy); T.gx += len; }
const ease = s => s * s * (3 - 2 * s);
function slope(len, dy){ const n = Math.ceil(len), x0 = T.gx, y0 = T.gy; for (let i = 1; i <= n; i++){ const s = i / n; add(x0 + len * s, y0 + dy * ease(s)); } T.gx += len; T.gy += dy; }
function hill(len, amp){ const n = Math.ceil(len), x0 = T.gx, y0 = T.gy; for (let i = 1; i <= n; i++){ const s = i / n; add(x0 + len * s, y0 + amp * (1 - Math.cos(2 * Math.PI * s)) / 2); } T.gx += len; }
function whoops(count, amp, wl){ for (let k = 0; k < count; k++){ const x0 = T.gx; for (let i = 1; i <= 8; i++){ const s = i / 8; add(x0 + wl * s, T.gy + amp * (1 - Math.cos(2 * Math.PI * s)) / 2); } T.gx += wl; } }
function rocks(count){ for (let k = 0; k < count; k++){ flat(rand(2.5, 4.5)); const h = rand(0.14, 0.28), w = rand(1.2, 1.8), x0 = T.gx; for (let i = 1; i <= 6; i++){ const t = i / 6; add(x0 + w * t, T.gy + h * (1 - Math.cos(2 * Math.PI * t)) / 2); } T.gx += w; } }
function rampGap(diff, approach, checkpoint){
  const G0 = Math.min(20, rand(5, 8) + diff * 3.5);
  if (checkpoint) T.cps.push(T.gx + 2);
  flat(approach + G0 * 0.5);
  const Lr = rand(6, 9), ang = rand(17, 27) * Math.PI / 180, Hr = Lr * Math.tan(ang) / 2;
  const n = Math.ceil(Lr * 1.5), x0 = T.gx, y0 = T.gy;
  for (let i = 1; i <= n; i++){ const s = i / n; add(x0 + Lr * s, y0 + Hr * s * s); }
  T.gx += Lr; T.gy += Hr;
  T.pts[T.pts.length - 1].hole = true;
  const drop = rand(0.2, 2.2), x1 = T.gx + G0, y1 = T.gy - drop;
  T.holes.push({ x0:T.gx, x1, yTop:Math.min(T.gy, y1) });
  T.gx = x1; T.gy = y1; add(x1, y1);
  slope(rand(10, 14) + G0 * 0.6, -(rand(1.6, 2.8) + Hr * 0.5));
  flat(rand(4, 8));
}
function genFeature(){
  const diff = Math.max(0, T.gx) / 1000;
  if (T.gy > 12){ slope(rand(15, 25), -rand(3, 6)); return; }
  if (T.gy < -12){ slope(rand(15, 25), rand(3, 6)); return; }
  const r = Math.random();
  if (r < 0.36) rampGap(diff, rand(12, 16), true);
  else if (r < 0.47){ rampGap(diff, rand(12, 16), true); if (diff > 0.3) rampGap(diff * 0.8, rand(4, 7), false); }
  else if (r < 0.6) hill(rand(18, 35), rand(-3, 4));
  else if (r < 0.71) whoops(Math.floor(rand(4, 8)), rand(0.3, 0.55 + diff * 0.25), rand(3, 4.5));
  else if (r < 0.8) rocks(Math.floor(rand(2, 5)));
  else if (r < 0.9) slope(rand(14, 24), rand(-4, 4));
  else flat(rand(10, 20));
}
function idxAt(x){
  const p = T.pts; let lo = 0, hi = p.length - 1;
  if (x <= p[0].x) return 0; if (x >= p[hi].x) return hi;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (p[m].x <= x) lo = m; else hi = m; }
  return lo;
}
function groundAt(x){
  const p = T.pts;
  if (x < p[0].x || x >= p[p.length - 1].x) return null;
  const i = idxAt(x), a = p[i], b = p[i + 1];
  if (a.hole) return null;
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  return { y: a.y + dy * (x - a.x) / dx, nx: -dy / len, ny: dx / len };
}

/* ============ ÉTAT DU JEU ============ */
let best = 0; try { best = +localStorage.getItem('motoRider.best') || 0; } catch (e) {}
let state = 'menu', paused = false, cfg = BIKES[0], bike = null, lives = 3, maxX = 0, crashT = 0, deathX = 0;

let ctrlMode = isTouch ? 'touch' : 'keyboard';
try { const m = localStorage.getItem('motoRider.ctrl'); if (m === 'touch' || m === 'keyboard') ctrlMode = m; } catch (e) {}
const input = { gas:false, brake:false, back:false, fwd:false };

function makeBike(c){
  const m = c.mass + 75, I = m * (0.12 * c.L * c.L + 0.1), p0 = pose(c, 0);
  return {
    P:{ ...c, m, I, crashPts:[[p0.head[0], p0.head[1], 0.14], [p0.shoulder[0], p0.shoulder[1], 0.08]] },
    x:0, y:0, vx:0, vy:0, a:0, w:0, lean:0, airT:0, airRot:0, takeoffX:0, wheelieT:0,
    wheels:[{ bx:-c.L / 2, by:-c.hc, drive:true, on:false, pen:0, vt:0, ws:0, rot:0 },
            { bx: c.L / 2, by:-c.hc, drive:false, on:false, pen:0, vt:0, ws:0, rot:0 }]

}
function placeBike(x){
  const b = bike, g = groundAt(x) || { y:0, nx:0, ny:1 };
  b.a = Math.atan2(-g.nx, g.ny); b.x = x; b.y = g.y + (b.P.hc + b.P.r - 0.06) / Math.cos(b.a);
  b.vx = b.vy = b.w = 0; b.airT = 0; b.airRot = 0; b.wheelieT = 0; b.lean = 0;

}
function addMsg(text, big){ msgs.push({ text, t:2.2, big:!!big }); if (msgs.length > 4) msgs.shift(); }

function physStep(h){
  const b = bike, P = b.P, ctrl = state === 'playing';
  const gas = ctrl && input.gas, brake = ctrl && input.brake;
  const lean = ctrl ? (input.back ? 1 : 0) - (input.fwd ? 1 : 0) : 0;
  b.lean += (lean - b.lean) * Math.min(1, h * 10);
  const sp = Math.hypot(b.vx, b.vy);
  let fx = -2 * b.vx * sp, fy = -P.m * G - 2 * b.vy * sp, tq = 0, contacts = 0;
  let ca = Math.cos(b.a), sa = Math.sin(b.a);

    const rx = ca * w.bx - sa * w.by, ry = sa * w.bx + ca * w.by;

    w.on = false; w.pen = 0;
    const g = groundAt(wx);
    if (g){
      const pen = g.y - (wy - P.r);
      if (pen > 0){
        if (pen > P.r + 0.45){ if (ctrl) crash('wall'); }
        else {
          const nx = g.nx, ny = g.ny, penN = pen * ny;
          const vwx = b.vx - b.w * ry, vwy = b.vy + b.w * rx, vn = vwx * nx + vwy * ny;
          if (!was && state === 'playing' && b.airT > 0.35){ if (vn < -P.maxImpact) crash('hard'); }
          let Fn = P.k * penN - P.c * vn;
          if (penN > P.travel) Fn += P.k * 15 * (penN - P.travel) - P.c * 1.5 * vn;
          if (Fn < 0) Fn = 0;
          const tx = ny, ty = -nx, vt = vwx * tx + vwy * ty, maxF = P.grip * Fn;
          let Ft = -vt * 6;
          if (w.drive && gas) Ft += Math.min(P.force, P.power / Math.max(Math.abs(vt), 1), maxF);
          if (brake){ const bf = maxF * (w.drive ? 0.55 : 0.8); Ft += clamp(-vt * P.m * 3, -bf, bf); }

}

function landed(){
  const b = bike, rot = b.airRot, d = b.x - b.takeoffX;
  if (Math.abs(rot) > Math.PI * 2 * 0.8){

    addMsg((rot > 0 ? 'Salto arrière' : 'Salto avant') + (n > 1 ? ' x' + n : '') + ' !', true); sfx('trick');
  }
  sfx('land', clamp(b.airT / 1.2, 0.35, 1));
  if (d > 12) addMsg('Saut de ' + Math.round(d) + ' m');
  for (let i = 0; i < 10; i++) parts.push({ x:b.x + rand(-0.8, 0.8), y:b.y - b.P.hc - b.P.r, vx:rand(-3, 3), vy:rand(0.5, 2.5), life:rand(0.4, 0.8), col:'170,130,90', s:rand(0.1, 0.22), dust:true });
}

function crash(kind){
  if (state !== 'playing') return;

  state = 'crash'; crashT = 2.0; lives--; deathX = b.x; shake = 0.5;
  addMsg({ wall:'Dans le mur !', hard:'Réception trop violente !', head:'Chute !', void:'Tombé dans le vide !' }[kind], true);
  const p = pose(b.P, 0), ca = Math.cos(b.a), sa = Math.sin(b.a);
  rag = { x:b.x + ca * p.hip[0] - sa * p.hip[1], y:b.y + sa * p.hip[0] + ca * p.hip[1], vx:b.vx * 0.8, vy:b.vy + 3, a:b.a, w:rand(-8, 8) };
  for (let i = 0; i < 26; i++) parts.push({ x:b.x, y:b.y, vx:b.vx * 0.5 + rand(-5, 5), vy:rand(1, 7), life:rand(0.6, 1.3), col:Math.random() < 0.5 ? '120,90,60' : hexRgb(b.P.color), s:rand(0.06, 0.16) });

function hexRgb(h){ const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255); }

function respawn(){
  let cp = 0; for (const c of T.cps) if (c < deathX - 1) cp = c;
  placeBike(cp); rag = null; state = 'playing';
  camX = bike.x; camY = bike.y;
  addMsg(lives > 1 ? 'Encore ' + lives + ' vies' : 'Dernière vie !'); sfx('respawn');
}

function startGame(){
  newTerrain(); bike = makeBike(cfg); placeBike(0);
  lives = 3; maxX = 0; parts = []; msgs = []; rag = null; paused = false; hintT = 6; lastMile = 0; recordDone = false;
  camX = bike.x; camY = bike.y;
  while (T.gx < camX + W / PX + 80) genFeature();
  state = 'playing';
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('pause').classList.add('hidden');
  $('topbtns').classList.remove('hidden');

}
function gameOver(){

function toMenu(){

}
function setPause(v){

  paused = v; $('pause').classList.toggle('hidden', !v);

/* ============ SON : musique + bruitages (Web Audio) ============ */
let AC = null, sfxBus = null, musicBus = null, gtrIn = null, leadIn = null, eng = null, noiseBuf = null, skidG = null, wind = null, seqTimer = null;
let musicOn = true, sfxOn = true, seqStep = 0, nextT = 0;
try { musicOn = localStorage.getItem('motoRider.music') !== '0'; sfxOn = localStorage.getItem('motoRider.sfx') !== '0'; } catch (e) {}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function distCurve(k){ const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++){ const x = i * 2 / n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; }
function initAudio(){
  try {
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(), master = AC.createGain();
      master.gain.value = 0.9; master.connect(comp); comp.connect(AC.destination);
      musicBus = AC.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
      sfxBus = AC.createGain(); sfxBus.gain.value = sfxOn ? 1 : 0; sfxBus.connect(master);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      // guitare saturée
      gtrIn = AC.createGain(); const sh = AC.createWaveShaper(), gl = AC.createBiquadFilter(), go = AC.createGain();
      sh.curve = distCurve(30); gl.type = 'lowpass'; gl.frequency.value = 2400; go.gain.value = 0.11;
      gtrIn.connect(sh); sh.connect(gl); gl.connect(go); go.connect(musicBus);
      // lead avec écho
      leadIn = AC.createGain(); const dl = AC.createDelay(1), fb = AC.createGain();
      dl.delayTime.value = 0.3; fb.gain.value = 0.3; leadIn.connect(musicBus); leadIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(musicBus);
      // moteur
      const o1 = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(sfxBus); o1.start(); o2.start();
      eng = { o1, o2, f, g, frac:0 };

      const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const sf = AC.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 2600; sf.Q.value = 1.2;
      skidG = AC.createGain(); skidG.gain.value = 0; src.connect(sf); sf.connect(skidG); skidG.connect(sfxBus);
      const wf = AC.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 400;
      const wg = AC.createGain(); wg.gain.value = 0; src.connect(wf); wf.connect(wg); wg.connect(sfxBus);

}
function tone(type, freq, t, dur, vol, bus, freqEnd){

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, vol, ftype, freq, bus, freqEnd, Q){
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.setValueAtTime(freq, t);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  if (Q) f.Q.value = Q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t, Math.random() * 1.4); s.stop(t + dur + 0.05);
}

/* --- Musique : rock instrumental en boucle (16 mesures, 150 BPM) --- */
const STEP = 60 / 150 / 4;
const SONG = [45, 41, 48, 43, 45, 41, 43, 40];         // La - Fa - Do - Sol - La - Fa - Sol - Mi
const LEAD = [76,0,74,0,72,0,69,0, 72,0,74,76,0,79,76,0, 81,0,79,0,76,0,74,0, 72,74,72,0,69,0,0,0];
function schedule(){
  if (!AC) return;
  while (nextT < AC.currentTime + 0.12){ if (musicOn) playStep(seqStep, nextT); nextT += STEP; seqStep = (seqStep + 1) % 256; }
}
function restartMusic(){ if (!AC) return; seqStep = 0; nextT = AC.currentTime + 0.05; }
function bassNote(n, t, dur, vol){
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = midi(n); f.type = 'lowpass'; f.frequency.value = 700;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.05);
}
function powerChord(n, t, dur, vol){
  for (const [m, d] of [[n, 0], [n + 7, 3], [n + 12, -4]]){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = midi(m); o.detune.value = d;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(gtrIn); o.start(t); o.stop(t + dur + 0.05);
  }
}
function playStep(s, t){
  const bar = Math.floor(s / 16), st = s % 16, root = SONG[bar % 8];
  const full = state !== 'menu', lastBar = bar % 8 === 7, partB = bar >= 8;
  // batterie
  if (st === 0 || st === 8 || (full && (st === 10 || (partB && st === 3)))) tone('sine', 150, t, 0.28, full ? 0.9 : 0.5, musicBus, 40);
  if (st === 4 || st === 12 || (lastBar && full && st >= 13)){ noise(t, 0.16, 0.45, 'bandpass', 1800, musicBus, null, 0.8); tone('triangle', 200, t, 0.09, 0.25, musicBus, 120); }
  if (st % 2 === 0) noise(t, st === 14 ? 0.16 : 0.04, 0.15, 'highpass', 8000, musicBus);
  if (bar === 0 && st === 0 && full) noise(t, 1.2, 0.25, 'highpass', 5000, musicBus);   // cymbale
  // basse : croches sur la fondamentale
  if (st % 2 === 0) bassNote(root - 12 + (st === 6 || st === 14 ? 12 : 0), t, STEP * 1.8, 0.32);
  // guitare
  if (full){
    if (st === 0) powerChord(root, t, STEP * 3.5, 0.5);
    else if (st % 2 === 0 && st !== 2) powerChord(root, t, STEP * 0.9, 0.35);
  }
  // mélodie (2e moitié du morceau, ou au menu)
  if (partB || !full){
    const n = LEAD[(bar % 2) * 16 + st];
    if (n){ tone('square', midi(n), t, STEP * 1.8, full ? 0.06 : 0.05, leadIn); tone('triangle', midi(n + 12), t, STEP * 1.2, 0.03, leadIn); }
  }
}

/* --- Bruitages --- */
function sfx(name, v){
  if (!AC || !sfxOn) return;
  v = v == null ? 1 : v;
  const t = AC.currentTime;
  switch (name){
    case 'jump': noise(t, 0.4, 0.22, 'bandpass', 350, null, 2200, 2); break;
    case 'land': tone('sine', 120, t, 0.28, 0.7 * v, null, 38); noise(t, 0.22, 0.4 * v, 'lowpass', 900); tone('square', 60, t, 0.08, 0.15 * v); break;
    case 'trick': [72, 76, 79, 84, 88].forEach((n, i) => tone('triangle', midi(n), t + i * 0.06, 0.25, 0.22)); break;
    case 'wheelie': [79, 84, 91].forEach((n, i) => tone('triangle', midi(n), t + i * 0.07, 0.2, 0.18)); break;
    case 'crash':
      noise(t, 0.7, 0.6, 'lowpass', 2500, null, 300); tone('sine', 90, t, 0.4, 0.8, null, 30);
      tone('square', midi(88), t + 0.03, 0.5, 0.08, null, midi(84)); tone('square', midi(93), t + 0.05, 0.45, 0.06, null, midi(90));
      noise(t + 0.25, 0.3, 0.3, 'bandpass', 1200, null, 600, 1); break;
    case 'respawn': [60, 64, 67, 72].forEach((n, i) => tone('square', midi(n), t + i * 0.07, 0.12, 0.1)); break;
    case 'gameover': [67, 63, 60, 55, 48].forEach((n, i) => tone('triangle', midi(n), t + i * 0.25, i === 4 ? 0.9 : 0.3, 0.3)); break;
    case 'record': [72, 76, 79, 84, 79, 84, 88].forEach((n, i) => { tone('square', midi(n), t + i * 0.1, i === 6 ? 0.6 : 0.12, 0.12); tone('triangle', midi(n - 12), t + i * 0.1, 0.15, 0.15); }); break;
    case 'mile': tone('sine', midi(88), t, 0.12, 0.18); tone('sine', midi(95), t + 0.09, 0.2, 0.18); break;
    case 'click': tone('square', midi(84), t, 0.05, 0.07); break;
    case 'zoom': tone('sine', v > 0 ? 880 : 620, t, 0.07, 0.08); break;
  }
}
function updateAudio(dt){
  if (!AC || !eng) return;
  const t = AC.currentTime;
  const ml = !musicOn ? 0 : state === 'over' ? 0 : paused ? 0.12 : state === 'menu' ? 0.35 : 0.42;
  musicBus.gain.setTargetAtTime(ml, t, 0.3);
  const on = (state === 'playing' || state === 'crash') && !paused;
  if (!on || !bike){ eng.g.gain.setTargetAtTime(0, t, 0.05); skidG.gain.setTargetAtTime(0, t, 0.05); wind.g.gain.setTargetAtTime(0, t, 0.1); return; }
  const P = bike.P, v = Math.abs(bike.vx), sp = Math.hypot(bike.vx, bike.vy), top = Math.cbrt(P.power / 2), span = top / 5;
  let frac;
  if (!bike.wheels[0].on && input.gas) frac = Math.min(1, eng.frac + dt * 2);
  else { const gi = Math.min(4, Math.floor(v / span)); frac = 0.15 + clamp((v - gi * span) / span, 0, 1) * 0.85; }
  if (!input.gas || state === 'crash') frac *= 0.6;
  eng.frac = frac;
  const f = (32 + frac * 85) * P.sound;
  eng.o1.frequency.setTargetAtTime(f, t, 0.04); eng.o2.frequency.setTargetAtTime(f * 0.5, t, 0.04);
  eng.f.frequency.setTargetAtTime(400 + frac * 1200, t, 0.05);
  eng.g.gain.setTargetAtTime(state === 'crash' ? 0.012 : (input.gas ? 0.06 : 0.035), t, 0.06);
  const skidding = state === 'playing' && input.brake && sp > 3 && (bike.wheels[0].on || bike.wheels[1].on);
  skidG.gain.setTargetAtTime(skidding ? Math.min(0.22, sp * 0.015) : 0, t, 0.05);
  wind.g.gain.setTargetAtTime(Math.min(0.14, sp * sp * 0.00012), t, 0.2);
  wind.f.frequency.setTargetAtTime(250 + sp * 25, t, 0.2);
}
function setMusic(v){ musicOn = v; try { localStorage.setItem('motoRider.music', v ? '1' : '0'); } catch (e) {} $('bMusic').classList.toggle('off', !v); }
function setSfx(v){ sfxOn = v; try { localStorage.setItem('motoRider.sfx', v ? '1' : '0'); } catch (e) {} $('bSfx').textContent = v ? '🔊' : '🔇'; if (sfxBus) sfxBus.gain.setTargetAtTime(v ? 1 : 0, AC.currentTime, 0.02); }

/* ============ BOUCLE ============ */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  zoom += (zoomT - zoom) * Math.min(1, dt * 8); PX = basePX * zoom;
  if (zoomToast > 0) zoomToast -= dt;
  updateAudio(dt);
  if ((state === 'playing' || state === 'crash') && !paused){
    acc += dt; const h = 1 / 240;
    while (acc >= h){ physStep(h); acc -= h; }
    update(dt);
  } else if (state === 'menu') { camX += dt * 6; }
  render();
  requestAnimationFrame(frame);
}
function update(dt){
  const b = bike;
  const tx = b.x + clamp(b.vx * 0.35, -3, 9);
  camX += (tx - camX) * Math.min(1, dt * 3.5);
  camY += (b.y + 0.5 - camY) * Math.min(1, dt * (state === 'crash' ? 1 : 3));
  while (T.gx < camX + W / PX + 80) genFeature();
  const rw = b.wheels[0];
  if (state === 'playing' && rw.on && input.gas && Math.random() < 0.45){
    const ca = Math.cos(b.a), sa = Math.sin(b.a);
    parts.push({ x:b.x + ca * rw.bx - sa * rw.by, y:b.y + sa * rw.bx + ca * rw.by - b.P.r, vx:-rand(1, 3) - b.vx * 0.1, vy:rand(0.4, 1.8), life:rand(0.35, 0.7), col:'170,130,90', s:rand(0.08, 0.18), dust:true });
  }
  for (const p of parts){ p.vy -= (p.dust ? 1.5 : G) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.dust) p.s += dt * 0.25; }
  parts = parts.filter(p => p.life > 0);
  if (rag){
    rag.vy -= G * dt; rag.x += rag.vx * dt; rag.y += rag.vy * dt; rag.a += rag.w * dt;
    const g = groundAt(rag.x);
    if (g && rag.y < g.y + 0.25 && rag.y > g.y - 1){ rag.y = g.y + 0.25; if (rag.vy < 0) rag.vy = -rag.vy * 0.35; rag.vx *= 0.85; rag.w *= 0.8; }
  }
  for (const m of msgs) m.t -= dt; msgs = msgs.filter(m => m.t > 0);
  if (hintT > 0) hintT -= dt;
  if (shake > 0) shake -= dt;
  if (state === 'crash'){ crashT -= dt; if (crashT <= 0){ if (lives > 0) respawn(); else gameOver(); } }
  if (state === 'playing'){
    const mile = Math.floor(maxX / 100);
    if (mile > lastMile){ lastMile = mile; sfx('mile'); }
    if (!recordDone && best >= 20 && maxX > best){ recordDone = true; addMsg('Nouveau record !', true); sfx('record'); }
  }
}

/* ============ RENDU ============ */
const SX = x => W * 0.32 + (x - camX) * PX;
const SY = y => H * 0.6 - (y - camY) * PX;

function layer(par, baseFrac, amp, col, f1, f2, seed){
  const off = camX * PX * par, yoff = camY * PX * par * 0.3;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 16){
    const u = x + off;
    ctx.lineTo(x, H * baseFrac + yoff - amp * (0.5 + 0.35 * Math.sin(u * f1 + seed) + 0.15 * Math.sin(u * f2 + seed * 2)));
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function drawBg(){
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#1e3a8a'); gr.addColorStop(0.55, '#5fa0f0'); gr.addColorStop(1, '#fcd9a8');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  const sg = ctx.createRadialGradient(W * 0.8, H * 0.2, 10, W * 0.8, H * 0.2, 120);
  sg.addColorStop(0, 'rgba(255,245,200,1)'); sg.addColorStop(0.3, 'rgba(255,240,190,0.9)'); sg.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = sg; ctx.fillRect(W * 0.8 - 120, H * 0.2 - 120, 240, 240);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 7; i++){
    const span = W + 400;
    const x = (((i * 397 - camX * PX * 0.05) % span) + span) % span - 200, y = 50 + (i * 61) % 150, s = 0.7 + (i % 3) * 0.3;
    for (const e of [[0, 0, 50, 18], [35, -10, 36, 20], [-35, 2, 30, 13]]){ ctx.beginPath(); ctx.ellipse(x + e[0] * s, y + e[1] * s, e[2] * s, e[3] * s, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  layer(0.06, 0.62, 170, '#7f90c6', 0.004, 0.013, 1);
  layer(0.18, 0.72, 120, '#5f7fa8', 0.006, 0.017, 3);
  layer(0.4, 0.84, 90, '#3f6b4f', 0.008, 0.021, 5);
}
function terrainPath(p, s, e, dy){
  const path = new Path2D(), bottom = H + 3000; let open = false;
  for (let i = s; i <= e; i++){
    const q = p[i], X = SX(q.x), Y = SY(q.y) + dy;
    if (!open){ path.moveTo(X, bottom); path.lineTo(X, Y); open = true; } else path.lineTo(X, Y);
    if (q.hole || i === e){ path.lineTo(X, bottom); path.closePath(); open = false; }
  }
  return path;
}
function drawTerrain(){
  const p = T.pts, x0 = camX - W * 0.32 / PX - 3, x1 = camX + W * 0.68 / PX + 3;
  const s = idxAt(x0), e = Math.min(p.length - 1, idxAt(x1) + 1);
  for (const hl of T.holes){
    if (hl.x1 < x0 || hl.x0 > x1) continue;
    const a = SX(hl.x0), b = SX(hl.x1), y = SY(hl.yTop) - PX * 0.5;
    if (y > H) continue;
    const gr = ctx.createLinearGradient(0, y, 0, y + PX * 10);
    gr.addColorStop(0, 'rgba(25,15,35,0)'); gr.addColorStop(0.25, 'rgba(20,12,30,0.85)'); gr.addColorStop(1, '#06030a');
    ctx.fillStyle = gr; ctx.fillRect(a, y, b - a, H - y + 20);
  }
  const gr = ctx.createLinearGradient(0, SY(camY) - PX * 3, 0, SY(camY) + PX * 12);
  gr.addColorStop(0, '#9a6537'); gr.addColorStop(1, '#4a2c17');
  ctx.fillStyle = gr; ctx.fill(terrainPath(p, s, e, 0));
  ctx.fillStyle = 'rgba(60,35,18,0.45)'; ctx.fill(terrainPath(p, s, e, PX * 1.4));
  ctx.fillStyle = 'rgba(40,22,10,0.45)'; ctx.fill(terrainPath(p, s, e, PX * 3.5));
  const grass = new Path2D(); let open = false;
  for (let i = s; i <= e; i++){
    const q = p[i], X = SX(q.x), Y = SY(q.y);
    if (!open){ grass.moveTo(X, Y); open = true; } else grass.lineTo(X, Y);
    if (q.hole) open = false;
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.strokeStyle = '#3b8f36'; ctx.lineWidth = PX * 0.3; ctx.stroke(grass);
  ctx.strokeStyle = '#7fd35c'; ctx.lineWidth = PX * 0.07; ctx.stroke(grass);
  // panneaux de danger au bord des trous
  for (const hl of T.holes){
    if (hl.x1 < x0 || hl.x0 > x1) continue;
    const gl = groundAt(hl.x0 - 0.01); if (!gl) continue;
    const X = SX(hl.x0), Y = SY(gl.y);
    for (let k = 0; k < 4; k++){ ctx.fillStyle = k % 2 ? '#fff' : '#ef4444'; ctx.fillRect(X - 3, Y - PX * 0.25 * (k + 1), 6, PX * 0.25); }
  }
  // panneaux de distance
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let m = Math.max(100, Math.ceil(x0 / 100) * 100); m < x1; m += 100){
    const g = groundAt(m); if (!g) continue;
    const X = SX(m), Y = SY(g.y);
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(X - 2.5, Y - PX * 2.1, 5, PX * 2.1);
    ctx.fillStyle = '#fef3c7'; ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(X - PX * 0.95, Y - PX * 2.85, PX * 1.9, PX * 0.8, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7c2d12'; ctx.font = `${Math.round(PX * 0.42)}px Bungee, Impact, sans-serif`; ctx.fillText(m + ' m', X, Y - PX * 2.45);
  }
  // drapeau record
  if (best > 5 && best > x0 && best < x1){
    const g = groundAt(best);
    if (g){
      const X = SX(best), Y = SY(g.y);
      ctx.fillStyle = '#e5e7eb'; ctx.fillRect(X - 2, Y - PX * 3, 4, PX * 3);
      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.moveTo(X + 2, Y - PX * 3); ctx.lineTo(X + PX * 1.4, Y - PX * 2.65); ctx.lineTo(X + 2, Y - PX * 2.3); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(PX * 0.3)}px Inter, sans-serif`; ctx.fillText('RECORD', X, Y - PX * 3.3);
    }
  }
}
function drawWorldBike(){
  const b = bike;
  ctx.save(); ctx.translate(SX(b.x), SY(b.y)); ctx.scale(PX, -PX); ctx.rotate(b.a);
  drawBike(ctx, b.P, { rotR:b.wheels[0].rot, rotF:b.wheels[1].rot, penR:b.wheels[0].pen, penF:b.wheels[1].pen, lean:b.lean, rider:state !== 'crash' });
  ctx.restore();
  if (rag){
    const p = pose(b.P, 0);
    ctx.save(); ctx.translate(SX(rag.x), SY(rag.y)); ctx.scale(PX, -PX); ctx.rotate(rag.a); ctx.translate(-p.hip[0], -p.hip[1]);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    drawRider(ctx, b.P, p); ctx.restore();
  }
}
function heart(x, y, s, fill){
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); ctx.fill();
}
function drawHUD(){
  const b = bike;
  ctx.save(); ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  const fs = Math.round(clamp(W * 0.05, 28, 46));
  ctx.fillStyle = '#fff'; ctx.font = `${fs}px Bungee, Impact, sans-serif`;
  ctx.fillText(Math.max(0, Math.floor(maxX)) + ' m', 18, 12);
  ctx.font = '600 15px Inter, sans-serif';
  ctx.fillText(Math.round(Math.hypot(b.vx, b.vy) * 3.6) + ' km/h  ·  ' + cfg.name, 20, 18 + fs);
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText('Record : ' + Math.floor(Math.max(best, 0)) + ' m', 20, 40 + fs);
  for (let i = 0; i < 3; i++) heart(W - 30 - i * 32, 60, 24, i < lives ? '#ef4444' : 'rgba(255,255,255,0.25)');
  ctx.textAlign = 'center';
  if (state === 'playing' && b.wheelieT > 0.6){
    ctx.fillStyle = '#fde047'; ctx.font = `${Math.round(fs * 0.7)}px Bungee, Impact, sans-serif`;
    ctx.fillText('WHEELING ' + b.wheelieT.toFixed(1) + ' s', W / 2, H * 0.14);
  }
  let y = H * 0.22;
  for (const m of msgs){
    ctx.globalAlpha = Math.min(1, m.t * 2);
    ctx.fillStyle = m.big ? '#fff' : '#a7f3d0';
    ctx.font = `${Math.round(fs * (m.big ? 0.85 : 0.6))}px Bungee, Impact, sans-serif`;
    ctx.fillText(m.text, W / 2, y); y += fs * (m.big ? 1 : 0.75);
  }
  ctx.globalAlpha = 1;
  if (hintT > 0 && state === 'playing'){
    ctx.globalAlpha = Math.min(1, hintT);
    ctx.font = '600 15px Inter, sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(ctrlMode === 'touch' ? 'Gaz / Frein à droite — pencher à gauche — pincer pour zoomer' : '↑ accélérer · ↓ freiner · ← → pencher (← + gaz = wheeling) · + / − zoom', W / 2, H - (ctrlMode === 'touch' ? 120 : 40));
    ctx.globalAlpha = 1;
  }
  if (zoomToast > 0){
    ctx.globalAlpha = Math.min(1, zoomToast * 2); ctx.font = '700 16px Inter, sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText('Zoom ' + Math.round(zoomT * 100) + ' %', W / 2, 16); ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!T){ newTerrain(); }
  while (T.gx < camX + W / PX + 80) genFeature();
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  drawBg(); drawTerrain();
  for (const p of parts){
    ctx.fillStyle = `rgba(${p.col},${clamp(p.life * (p.dust ? 1 : 1.5), 0, p.dust ? 0.6 : 1)})`;
    ctx.beginPath(); ctx.arc(SX(p.x), SY(p.y), p.s * PX, 0, 7); ctx.fill();
  }
  if (bike && state !== 'menu') drawWorldBike();
  ctx.restore();
  if (bike && (state === 'playing' || state === 'crash')) drawHUD();
}

/* ============ MENU ============ */
function stat(label, v, txt){ return `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${Math.round(clamp(v, 0.05, 1) * 100)}%"></i></div><span>${txt}</span></div>`; }
function drawPreview(g, c){
  const w = g.canvas.width, h = g.canvas.height, sc = 85, cy = 122;
  g.clearRect(0, 0, w, h);
  const gy = cy + (c.hc + c.r) * sc;
  g.fillStyle = '#5b3a1f'; g.fillRect(0, gy, w, h - gy); g.fillStyle = '#3b8f36'; g.fillRect(0, gy - 3, w, 7);
  g.save(); g.translate(w / 2, cy); g.scale(sc, -sc);
  drawBike(g, c, { penR:0.06, penF:0.06, rotR:0.3, rotF:1.1 });
  g.restore();
}
function buildMenu(){
  const grid = $('grid'); grid.innerHTML = '';
  BIKES.forEach(c => {
    const d = document.createElement('div');
    d.className = 'card' + (c === cfg ? ' sel' : '');
    const top = Math.round(Math.cbrt(c.power / 2) * 3.6);
    d.innerHTML = `<canvas width="380" height="210"></canvas><h3>${c.name}</h3><p>${c.desc}</p>` +
      stat('Puissance', c.ui.ch / 200, c.ui.ch + ' ch') + stat('Couple', c.ui.nm / 160, c.ui.nm + ' N·m') +
      stat('Poids', c.mass / 320, c.mass + ' kg') + stat('Souplesse', c.ui.soft / 10, c.ui.soft + '/10') +
      `<div class="vmax">Vitesse max ≈ ${top} km/h</div>`;
    d.addEventListener('click', () => { cfg = c; buildMenu(); sfx('click'); });
    d.addEventListener('dblclick', startGame);
    grid.appendChild(d);
    drawPreview(d.querySelector('canvas').getContext('2d'), c);
  });
  $('menuBest').textContent = best > 0 ? 'Ton record : ' + Math.floor(best) + ' m' : '';
}

/* ============ CONTRÔLES ============ */
const KEYS = { ArrowUp:'gas', KeyW:'gas', ArrowDown:'brake', KeyS:'brake', ArrowLeft:'back', KeyA:'back', ArrowRight:'fwd', KeyD:'fwd' };
function setZoom(z){
  const old = zoomT; zoomT = clamp(z, 0.5, 2); zoomToast = 1.3;
  try { localStorage.setItem('motoRider.zoom', String(zoomT)); } catch (e) {}
  if (zoomT !== old) sfx('zoom', zoomT > old ? 1 : -1);
}
addEventListener('keydown', e => {
  initAudio();
  const k = KEYS[e.code];
  if (k){ input[k] = true; e.preventDefault(); return; }
  if (e.code === 'Space') e.preventDefault();
  if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd'){ setZoom(zoomT * 1.15); return; }
  if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract'){ setZoom(zoomT / 1.15); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') setPause(!paused);
  else if (e.code === 'Semicolon' || e.key === 'm' || e.key === 'M') setMusic(!musicOn);
  else if (e.code === 'KeyN') setSfx(!sfxOn);
  else if (e.code === 'Enter' || e.code === 'Space'){
    if (state === 'menu' || state === 'over') startGame();
    else if (paused) setPause(false);
  }
});
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k){ input[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { if (state === 'playing') setPause(true); for (const k in input) input[k] = false; });
document.addEventListener('pointerdown', initAudio);
document.querySelectorAll('#touch button').forEach(bt => {
  const k = bt.dataset.k;
  const on = e => { e.preventDefault(); input[k] = true; bt.classList.add('on'); try { bt.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { input[k] = false; bt.classList.remove('on'); };
  bt.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => bt.addEventListener(ev, off));
  bt.addEventListener('contextmenu', e => e.preventDefault());
});
// zoom : molette et pincement à deux doigts
cv.addEventListener('wheel', e => { if (state === 'menu') return; e.preventDefault(); setZoom(zoomT * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive:false });
const pinch = new Map(); let pinchD0 = 0, pinchZ0 = 1;
const pdist = () => { const [a, b] = [...pinch.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
cv.addEventListener('pointerdown', e => { pinch.set(e.pointerId, { x:e.clientX, y:e.clientY }); if (pinch.size === 2){ pinchD0 = pdist(); pinchZ0 = zoomT; } });
cv.addEventListener('pointermove', e => {
  if (!pinch.has(e.pointerId)) return;
  pinch.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch.size === 2 && pinchD0 > 0){ zoomT = clamp(pinchZ0 * pdist() / pinchD0, 0.5, 2); zoomToast = 1.3; }
});
const pend = e => { pinch.delete(e.pointerId); if (pinch.size < 2 && pinchD0 > 0){ pinchD0 = 0; setZoom(zoomT); } };
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, pend));
// choix du mode de contrôle
function applyCtrlMode(){
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', b.dataset.mode === ctrlMode));
  $('help').innerHTML = ctrlMode === 'touch'
    ? '<span><b>À droite :</b> Gaz et Frein</span><span><b>À gauche :</b> pencher Arrière / Avant</span><span>Arrière + Gaz = wheeling</span><span>Pincer à deux doigts ou − / + en haut : zoom</span>'
    : '<span><kbd>↑</kbd> / <kbd>Z</kbd> accélérer</span><span><kbd>↓</kbd> / <kbd>S</kbd> freiner</span><span><kbd>←</kbd> / <kbd>Q</kbd> pencher en arrière (wheeling)</span><span><kbd>→</kbd> / <kbd>D</kbd> pencher en avant</span><span><kbd>+</kbd> / <kbd>−</kbd> ou molette : zoom</span><span><kbd>P</kbd> pause · <kbd>M</kbd> musique · <kbd>N</kbd> bruitages</span>';
}
document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
  ctrlMode = b.dataset.mode; try { localStorage.setItem('motoRider.ctrl', ctrlMode); } catch (e) {}
  applyCtrlMode(); sfx('click');
}));
const click = fn => () => { sfx('click'); fn(); };
$('bStart').onclick = click(startGame);
$('bAgain').onclick = click(startGame);
$('bChange').onclick = click(toMenu);
$('bResume').onclick = click(() => setPause(false));
$('bQuit').onclick = click(toMenu);
$('bPause').onclick = click(() => setPause(true));
$('bMusic').onclick = () => setMusic(!musicOn);
$('bSfx').onclick = () => setSfx(!sfxOn);
$('bZoomIn').onclick = () => setZoom(zoomT * 1.15);
$('bZoomOut').onclick = () => setZoom(zoomT / 1.15);
setMusic(musicOn); setSfx(sfxOn); applyCtrlMode();

newTerrain(); buildMenu();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildMenu);
requestAnimationFrame(frame);
</script>
</body>
