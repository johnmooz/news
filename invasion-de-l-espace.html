<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Invasion de l'espace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--j1:#3dd6ff;--j2:#ffb020;--bg:#05040f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;
  font-family:'Press Start 2P',ui-monospace,monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;gap:8px;font-size:10px;color:#9a97c9}
#bar .btns{display:flex;gap:6px}
#bar button{font:inherit;font-size:14px;background:#15132b;color:#fff;border:1px solid #2c2852;border-radius:8px;width:38px;height:32px;cursor:pointer}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px;box-shadow:0 0 0 1px #221f44,0 0 40px rgba(61,214,255,.12);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px;text-align:center;background:rgba(5,4,15,.82);backdrop-filter:blur(3px);overflow:auto}
.hidden{display:none!important}
h1{margin:0 0 6px;font-size:clamp(18px,5vw,30px);line-height:1.4;color:#fff;
  text-shadow:0 0 12px #ff4fd8,0 0 30px #7b2fff}
h2{margin:0;font-size:clamp(16px,4.5vw,24px);color:#ff4fd8;text-shadow:0 0 12px #ff4fd8}
.label{font-size:10px;color:#9a97c9;letter-spacing:1px;margin-top:6px}
.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.choices button,.big{font:inherit;font-size:11px;padding:12px 14px;border-radius:10px;cursor:pointer;
  background:#15132b;color:#cfcdf0;border:2px solid #2c2852}
.choices button.sel{border-color:var(--j1);color:#fff;background:#0f2a3a;box-shadow:0 0 14px rgba(61,214,255,.35)}
.big{font-size:14px;padding:16px 30px;background:#ff4fd8;border-color:#ff8ce6;color:#1a0016;box-shadow:0 0 24px rgba(255,79,216,.5);margin-top:8px}
.big.alt{background:#15132b;color:#fff;border-color:#2c2852;box-shadow:none}
#help{font-size:9px;line-height:1.9;color:#bdbbe0;max-width:420px}
#help b{color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:8px;color:#bdbbe0}
.legend span i{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:5px;color:#05040f;font-style:normal;margin-right:4px;font-size:9px;vertical-align:middle}
#overText{font-size:10px;line-height:2.2;color:#cfcdf0}
#touch{display:none;gap:10px;padding:8px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#touch.on{display:flex}
.pad{flex:1;display:flex;gap:8px;align-items:stretch}
.pad.solo .sp{flex:1.3}
.pad button{flex:1;height:76px;font:inherit;font-size:22px;color:#fff;border-radius:16px;
  background:rgba(255,255,255,.05);border:2px solid var(--c);touch-action:none;cursor:pointer}
.pad button.fire{font-size:11px}
.pad button.on{background:var(--c);color:#05040f}
.pad .tag{position:absolute;font-size:8px;color:var(--c)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="best">MEILLEUR : 0</span>
    <div class="btns">
      <button id="muteBtn" title="Son">🔊</button>
      <button id="pauseBtn" class="hidden" title="Pause">⏸</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>

    <div id="menu" class="overlay">
      <h1>INVASION<br>DE L'ESPACE</h1>
      <div class="label">MODE DE JEU</div>
      <div class="choices" id="modes">
        <button data-mode="solo" class="sel">SOLO</button>
        <button data-mode="ai">AVEC L'ORDI</button>
        <button data-mode="duo">2 JOUEURS</button>
      </div>
      <div class="label">CONTRÔLES</div>
      <div class="choices" id="ctrls">
        <button data-ctrl="keys" class="sel">⌨ CLAVIER</button>
        <button data-ctrl="touch">👆 TACTILE</button>
      </div>
      <div id="help"></div>
      <div class="legend">
        <span><i style="background:#ffd23f">R</i>Tir rapide</span>
        <span><i style="background:#3dff8a">2</i>Double tir</span>
        <span><i style="background:#ff4fd8">V</i>Diagonale</span>
        <span><i style="background:#ff4757">♥</i>Vie</span>
      </div>
      <button class="big" id="startBtn">JOUER</button>
    </div>

    <div id="over" class="overlay hidden">
      <h2 id="overTitle">PARTIE TERMINÉE</h2>
      <div id="overText"></div>
      <div class="choices">
        <button class="big" id="againBtn">REJOUER</button>
        <button class="big alt" id="menuBtn">MENU</button>
      </div>
    </div>
  </div>
  <div id="touch"></div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=640,GROUND=H-26,PY=H-52;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let scale=1;

/* ---------- Réglages du menu ---------- */
let mode='solo',ctrl='keys';
function setSel(groupId,attr,val){
  document.querySelectorAll('#'+groupId+' button').forEach(b=>b.classList.toggle('sel',b.dataset[attr]===val));
}
$('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;setSel('modes','mode',mode);updateHelp();});
$('ctrls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ctrl=b.dataset.ctrl;setSel('ctrls','ctrl',ctrl);updateHelp();});
function updateHelp(){
  let h='';
  if(ctrl==='keys'){
    if(mode==='duo') h='<b>J1</b> (bleu) : ← → pour bouger, ↑ ou Entrée pour tirer<br><b>J2</b> (orange) : Q / D pour bouger, Z ou Espace pour tirer';
    else h='<b>← →</b> ou <b>Q / D</b> pour bouger<br><b>Espace</b> ou <b>↑</b> pour tirer'+(mode==='ai'?'<br>L\'ordi pilote le vaisseau orange':'');
    h+='<br><b>P</b> ou <b>Échap</b> : pause';
  }else{
    if(mode==='duo') h='Boutons en bas de l\'écran :<br><b>J2</b> à gauche, <b>J1</b> à droite';
    else h='Boutons en bas de l\'écran :<br><b>◀ ▶</b> pour bouger, <b>FEU</b> pour tirer'+(mode==='ai'?'<br>L\'ordi pilote le vaisseau orange':'');
  }
  h+='<br>5 vies au départ — attrapez les bonus qui tombent !';
  $('help').innerHTML=h;
}
updateHelp();

/* ---------- Taille du canvas ---------- */
function resize(){
  const r=stage.getBoundingClientRect();
  const s=Math.min((r.width-8)/W,(r.height-8)/H);
  const cw=Math.max(100,Math.floor(W*s)),ch=Math.max(130,Math.floor(H*s));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  scale=cv.width/W;
}
window.addEventListener('resize',resize);

/* ---------- Son ---------- */
let ac=null,muted=false;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function sfx(f,d,type,v,f2){
  if(!ac||muted)return;
  try{
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
$('muteBtn').onclick=()=>{initAudio();muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';};

/* ---------- Meilleur score ---------- */
let best=0;
try{best=+localStorage.getItem('invasion-best')||0;}catch(e){}
function showBest(){$('best').textContent='MEILLEUR : '+best;}
showBest();

/* ---------- Sprites (dessins originaux, 11x8) ---------- */
const SPR=[
 [[ "...XXXXX...",".XXXXXXXXX.","XX..XXX..XX","XXXXXXXXXXX","..XXX.XXX..",".XX.....XX.","..XX...XX..","..........."],
  [ "...XXXXX...",".XXXXXXXXX.","XX..XXX..XX","XXXXXXXXXXX","..XXX.XXX..","XX.......XX",".XX.....XX.","..........."]],
 [[ "X.........X",".X.XXXXX.X.","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","..XXXXXXX..",".X.X...X.X.","X.........X"],
  [ "...........","XX.XXXXX.XX","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","..XXXXXXX..","..X.X.X.X..",".X.......X."]],
 [[ "....XXX....","..XXXXXXX..",".XX.XXX.XX.",".XXXXXXXXX.","..X.X.X.X..",".X.X.X.X.X.","X...X.X...X","..........."],
  [ "....XXX....","..XXXXXXX..",".XX.XXX.XX.",".XXXXXXXXX.","..X.X.X.X..","..X.X.X.X..",".X..X.X..X.","..........."]]
];
const ROWTYPE=[2,1,1,0,0],ROWPTS=[30,20,20,10,10];
const ROWCOL=['#ff4fd8','#ff9f43','#ffd23f','#3dff8a','#3dd6ff'];
const PX=3,EW=33,EH=24,COLS=8,ROWS=5,GX=46,GY=36;
function drawSprite(s,x,y,col){
  ctx.fillStyle=col;
  for(let r=0;r<8;r++){const row=s[r];for(let c=0;c<11;c++)if(row.charCodeAt(c)===88)ctx.fillRect(x+c*PX,y+r*PX,PX,PX);}
}

/* ---------- Bonus ---------- */
const PU={
  rapid:{c:'#ffd23f',t:'R',name:'TIR RAPIDE'},
  double:{c:'#3dff8a',t:'2',name:'DOUBLE TIR'},
  diag:{c:'#ff4fd8',t:'V',name:'TIR DIAGONAL'},
  life:{c:'#ff4757',t:'♥',name:'VIE +1'}
};
const PU_KEYS=['rapid','rapid','double','double','diag','diag','life'];
const WEAPON_TIME=12;

/* ---------- Étoiles ---------- */
const stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.3,v:Math.random()*30+8});

/* ---------- État du jeu ---------- */
let state='menu',players=[],enemies=[],pb=[],eb=[],pus=[],parts=[],texts=[];
let wave=1,fx=0,fy=0,fdir=1,efTimer=0,animT=0,frame=0,introT=0,overDelay=0,overReason='';

function mkPlayer(i,ai){
  return {i,ai,x:W/2,y:PY,lives:5,score:0,weapon:null,wt:0,cd:0,inv:1.5,alive:true,
    color:i===0?'#3dd6ff':'#ffb020',name:i===0?(mode==='solo'?'JOUEUR':'J1'):(ai?'ORDI':'J2'),
    inp:{l:false,r:false,f:false},aiT:0,aiTx:W/2,aiOff:0};
}
function startGame(){
  initAudio();
  players=[mkPlayer(0,false)];
  if(mode!=='solo'){players.push(mkPlayer(1,mode==='ai'));players[0].x=W*0.62;players[1].x=W*0.38;}
  wave=1;pb=[];eb=[];pus=[];parts=[];texts=[];
  spawnWave();
  state='play';
  $('menu').classList.add('hidden');$('over').classList.add('hidden');
  $('pauseBtn').classList.remove('hidden');$('pauseBtn').textContent='⏸';
  buildPads();
  sfx(440,0.12,'square',0.05,880);
}
function spawnWave(){
  enemies=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)enemies.push({r,c,alive:true});
  fx=(W-((COLS-1)*GX+EW))/2;fy=62+Math.min(wave-1,6)*10;fdir=1;
  introT=1.8;efTimer=1.2;eb=[];
}
function toMenu(){
  state='menu';$('over').classList.add('hidden');$('menu').classList.remove('hidden');
  $('pauseBtn').classList.add('hidden');$('touch').classList.remove('on');
}
function togglePause(){
  if(state==='play'){state='pause';$('pauseBtn').textContent='▶';}
  else if(state==='pause'){state='play';$('pauseBtn').textContent='⏸';}
}
$('startBtn').onclick=startGame;
$('againBtn').onclick=startGame;
$('menuBtn').onclick=toMenu;
$('pauseBtn').onclick=()=>{initAudio();togglePause();};

/* ---------- Clavier ---------- */
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k)&&state!=='menu')e.preventDefault();
  if((k==='p'||k==='escape')&&!e.repeat)togglePause();
  if(k==='enter'&&state==='menu'&&!e.repeat){startGame();}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ---------- Boutons tactiles ---------- */
const touchSt=[{l:false,r:false,f:false},{l:false,r:false,f:false}];
function buildPads(){
  const el=$('touch');el.innerHTML='';
  touchSt.forEach(t=>{t.l=t.r=t.f=false;});
  if(ctrl!=='touch'){el.classList.remove('on');requestAnimationFrame(resize);return;}
  el.classList.add('on');
  const mk=(p,a,label,cls)=>{const b=document.createElement('button');b.dataset.p=p;b.dataset.a=a;b.innerHTML=label;if(cls)b.className=cls;return b;};
  if(mode==='duo'){
    [[1,'var(--j2)'],[0,'var(--j1)']].forEach(([p,c])=>{
      const pad=document.createElement('div');pad.className='pad';pad.style.setProperty('--c',c);
      pad.append(mk(p,'l','◀'),mk(p,'f','FEU<br>J'+(p+1),'fire'),mk(p,'r','▶'));el.append(pad);
    });
  }else{
    const pad=document.createElement('div');pad.className='pad solo';pad.style.setProperty('--c','var(--j1)');
    const sp=document.createElement('div');sp.className='sp';
    pad.append(mk(0,'l','◀'),mk(0,'r','▶'),sp,mk(0,'f','FEU','fire'));el.append(pad);
  }
  el.querySelectorAll('button').forEach(b=>{
    const set=v=>{touchSt[+b.dataset.p][b.dataset.a]=v;b.classList.toggle('on',v);};
    b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{b.setPointerCapture(e.pointerId);}catch(_){}set(true);});
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set(false)));
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  requestAnimationFrame(resize);
}

function readInputs(){
  const k=keys;
  for(const p of players){
    if(p.ai)continue;
    const t=touchSt[p.i];let l,r,f;
    if(mode==='duo'){
      if(p.i===0){l=k.arrowleft;r=k.arrowright;f=k.arrowup||k.enter;}
      else{l=k.q||k.a;r=k.d;f=k.z||k.w||k[' '];}
    }else{l=k.arrowleft||k.q||k.a;r=k.arrowright||k.d;f=k[' ']||k.arrowup||k.z||k.w;}
    p.inp.l=!!(l||t.l);p.inp.r=!!(r||t.r);p.inp.f=!!(f||t.f);
  }
}

/* ---------- Ordi ---------- */
const ex=e=>fx+e.c*GX, ey=e=>fy+e.r*GY;
function aiThink(p,dt){
  let danger=null;
  for(const b of eb){if(b.y<p.y&&p.y-b.y<150&&Math.abs(b.x-p.x)<24){danger=b;break;}}
  p.aiT-=dt;
  if(p.aiT<=0){
    p.aiT=0.2+Math.random()*0.2;p.aiOff=(Math.random()-0.5)*14;
    const pu=pus.find(u=>u.y>H*0.35&&Math.abs(u.x-p.x)<220);
    if(pu)p.aiTx=pu.x;
    else{
      // vise la colonne la plus proche (le bas de chaque colonne)
      let bestD=1e9,tx=p.x;
      for(const e of enemies){if(!e.alive)continue;const cx=ex(e)+EW/2+fdir*14;const d=Math.abs(cx-p.x)+(p.i===1&&players[0].alive?Math.abs(cx-players[0].x)<40?60:0:0);if(d<bestD){bestD=d;tx=cx;}}
      p.aiTx=tx+p.aiOff;
    }
  }
  let tx=p.aiTx;
  if(danger)tx=p.x+(danger.x>p.x?-70:70);
  tx=Math.max(20,Math.min(W-20,tx));
  p.inp.l=tx<p.x-5;p.inp.r=tx>p.x+5;
  let above=false;
  for(const e of enemies){if(e.alive&&Math.abs(ex(e)+EW/2-p.x)<(p.weapon==='diag'?40:16)){above=true;break;}}
  p.inp.f=above&&introT<=0;
}

/* ---------- Actions ---------- */
function shoot(p){
  if(p.cd>0)return;
  p.cd=p.weapon==='rapid'?0.13:0.42;
  const y=p.y-14,v=-480;
  const add=(x,vx,vy)=>pb.push({x,y,vx,vy,o:p,c:p.color});
  if(p.weapon==='double'){add(p.x-9,0,v);add(p.x+9,0,v);}
  else if(p.weapon==='diag'){add(p.x,0,v);add(p.x,-190,v*0.9);add(p.x,190,v*0.9);}
  else add(p.x,0,v);
  sfx(p.weapon==='rapid'?1100:880,0.08,'square',0.025,220);
}
function explode(x,y,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*160;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.4+Math.random()*0.5,c:col});}
}
function addText(x,y,txt,c){texts.push({x,y,txt,c,t:1.2});}
function hitPlayer(p){
  p.lives--;p.inv=2;p.weapon=null;
  explode(p.x,p.y,p.color,30);explode(p.x,p.y,'#fff',12);
  sfx(300,0.5,'sawtooth',0.07,40);
  if(p.lives<=0){p.alive=false;addText(p.x,p.y-30,p.name+' ÉLIMINÉ','#ff4757');}
}
function applyPU(p,type){
  if(type==='life'){p.lives=Math.min(9,p.lives+1);sfx(660,0.25,'triangle',0.06,1320);}
  else{p.weapon=type;p.wt=WEAPON_TIME;sfx(520,0.25,'square',0.05,1040);}
  addText(p.x,p.y-34,PU[type].name,PU[type].c);
}
function gameOver(reason){
  if(state!=='play')return;
  state='dying';overDelay=1.4;overReason=reason;
  if(reason==='invaded')players.forEach(p=>{if(p.alive){explode(p.x,p.y,p.color,30);p.alive=false;p.lives=0;}});
  sfx(200,1,'sawtooth',0.07,30);
}
function showOver(){
  state='over';$('pauseBtn').classList.add('hidden');
  const top=Math.max(...players.map(p=>p.score));
  const total=players.filter(p=>!p.ai).reduce((s,p)=>s+p.score,0);
  let newBest=false;
  if(top>best){best=top;newBest=true;try{localStorage.setItem('invasion-best',best);}catch(e){}showBest();}
  $('overTitle').textContent=overReason==='invaded'?'LA TERRE EST ENVAHIE !':'PARTIE TERMINÉE';
  let html='VAGUE ATTEINTE : '+wave+'<br>';
  players.forEach(p=>{html+='<span style="color:'+p.color+'">'+p.name+' : '+p.score+'</span><br>';});
  if(players.length===2){
    const [a,b]=players;
    html+=a.score===b.score?'ÉGALITÉ !':'<span style="color:#ffd23f">🏆 '+(a.score>b.score?a.name:b.name)+' GAGNE !</span>';
    html+='<br>';
  }
  if(newBest)html+='<span style="color:#ff4fd8">NOUVEAU RECORD !</span>';
  $('overText').innerHTML=html;
  $('over').classList.remove('hidden');
}

/* ---------- Mise à jour ---------- */
function update(dt){
  for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.97;q.vy*=0.97;q.t-=dt;if(q.t<=0)parts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=30*dt;t.t-=dt;if(t.t<=0)texts.splice(i,1);}
  if(state==='dying'){overDelay-=dt;if(overDelay<=0)showOver();return;}
  if(state!=='play')return;

  introT-=dt;
  readInputs();
  for(const p of players){
    if(!p.alive)continue;
    if(p.ai)aiThink(p,dt);
    const sp=230;
    if(p.inp.l)p.x-=sp*dt;
    if(p.inp.r)p.x+=sp*dt;
    p.x=Math.max(18,Math.min(W-18,p.x));
    p.cd-=dt;p.inv-=dt;
    if(p.weapon){p.wt-=dt;if(p.wt<=0)p.weapon=null;}
    if(p.inp.f&&introT<=0)shoot(p);
  }

  // Formation ennemie
  const alive=enemies.filter(e=>e.alive);
  if(!alive.length){
    wave++;addText(W/2,H/2+40,'BONUS VAGUE +100','#3dff8a');
    players.forEach(p=>{if(p.alive)p.score+=100;});
    pb=[];spawnWave();sfx(523,0.15,'square',0.05,1046);return;
  }
  const ratio=alive.length/enemies.length;
  const speed=(24+wave*5)*(1+(1-ratio)*2.4);
  if(introT<=0.6)fx+=fdir*speed*dt;
  let minX=1e9,maxX=-1e9,maxY=-1e9;
  for(const e of alive){const x=ex(e),y=ey(e);if(x<minX)minX=x;if(x+EW>maxX)maxX=x+EW;if(y+EH>maxY)maxY=y+EH;}
  if(fdir>0&&maxX>W-8){fx-=maxX-(W-8);fdir=-1;fy+=14;}
  else if(fdir<0&&minX<8){fx+=8-minX;fdir=1;fy+=14;}
  animT+=dt*(1+(1-ratio)*2.5);if(animT>0.45){animT=0;frame^=1;}
  if(maxY>=PY-16){gameOver('invaded');return;}

  // Tirs ennemis
  if(introT<=0){
    efTimer-=dt;
    if(efTimer<=0){
      const nAlive=players.filter(p=>p.alive).length||1;
      efTimer=Math.max(0.2,1.05-wave*0.07)*(0.45+Math.random())/Math.sqrt(nAlive);
      const cols={};for(const e of alive){if(!cols[e.c]||e.r>cols[e.c].r)cols[e.c]=e;}
      const list=Object.values(cols),sh=list[Math.floor(Math.random()*list.length)];
      eb.push({x:ex(sh)+EW/2,y:ey(sh)+EH,vy:170+wave*12,ph:Math.random()*6});
      sfx(160,0.1,'triangle',0.03,90);
    }
  }

  // Tirs des joueurs
  for(let i=pb.length-1;i>=0;i--){
    const b=pb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-10||b.x<-10||b.x>W+10){pb.splice(i,1);continue;}
    for(const e of alive){
      if(!e.alive)continue;
      const x=ex(e),y=ey(e);
      if(b.x>x&&b.x<x+EW&&b.y>y&&b.y<y+EH){
        e.alive=false;pb.splice(i,1);
        b.o.score+=ROWPTS[e.r];
        explode(x+EW/2,y+EH/2,ROWCOL[e.r],16);
        sfx(220,0.18,'sawtooth',0.04,60);
        if(Math.random()<0.13){const t=PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)];pus.push({x:x+EW/2,y:y+EH/2,type:t,ph:0});}
        break;
      }
    }
  }

  // Tirs ennemis vs joueurs
  for(let i=eb.length-1;i>=0;i--){
    const b=eb[i];b.y+=b.vy*dt;b.ph+=dt*20;
    if(b.y>GROUND){explode(b.x,GROUND,'#8a86c9',4);eb.splice(i,1);continue;}
    let hit=false;
    for(const p of players){
      if(!p.alive||p.inv>0)continue;
      if(Math.abs(b.x-p.x)<14&&b.y>p.y-13&&b.y<p.y+10){hitPlayer(p);hit=true;break;}
    }
    if(hit){eb.splice(i,1);continue;}
    // un laser joueur peut détruire un tir ennemi
    for(let j=pb.length-1;j>=0;j--){const q=pb[j];if(Math.abs(q.x-b.x)<5&&Math.abs(q.y-b.y)<10){pb.splice(j,1);eb.splice(i,1);explode(b.x,b.y,'#fff',5);break;}}
  }

  // Bonus qui tombent
  for(let i=pus.length-1;i>=0;i--){
    const u=pus[i];u.y+=85*dt;u.ph+=dt;
    if(u.y>GROUND){pus.splice(i,1);continue;}
    for(const p of players){
      if(p.alive&&Math.abs(u.x-p.x)<24&&Math.abs(u.y-p.y)<22){applyPU(p,u.type);pus.splice(i,1);break;}
    }
  }

  if(players.every(p=>!p.alive))gameOver('dead');
}

/* ---------- Dessin ---------- */
function drawShip(p){
  if(!p.alive)return;
  if(p.inv>0&&Math.floor(p.inv*12)%2)return;
  const x=p.x,y=p.y;
  // flamme
  ctx.fillStyle=Math.random()<0.5?'#ff9f43':'#ffd23f';
  ctx.beginPath();ctx.moveTo(x-5,y+6);ctx.lineTo(x,y+12+Math.random()*6);ctx.lineTo(x+5,y+6);ctx.fill();
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.moveTo(x,y-15);ctx.lineTo(x+5,y-5);ctx.lineTo(x+16,y+4);ctx.lineTo(x+16,y+8);
  ctx.lineTo(x+6,y+6);ctx.lineTo(x-6,y+6);ctx.lineTo(x-16,y+8);ctx.lineTo(x-16,y+4);ctx.lineTo(x-5,y-5);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-2,y-7,4,6);
  // étiquette + arme
  ctx.font='7px "Press Start 2P",monospace';ctx.textAlign='center';
  ctx.fillStyle=p.color;ctx.fillText(p.name,x,y+22);
  if(p.weapon){
    const c=PU[p.weapon].c;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x-18,y+25,36,3);
    ctx.fillStyle=c;ctx.fillRect(x-18,y+25,36*(p.wt/WEAPON_TIME),3);
  }
}
function heart(x,y,c){
  ctx.fillStyle=c;
  const s=2,m=["X.X.","XXXX","XXXX",".XX."];
  // forme de cœur 7x6
  const hm=[".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."];
  for(let r=0;r<6;r++)for(let cc=0;cc<7;cc++)if(hm[r][cc]==='X')ctx.fillRect(x+cc*1.5,y+r*1.5,1.5,1.5);
}
function drawHUD(){
  ctx.font='9px "Press Start 2P",monospace';
  players.forEach((p,i)=>{
    const right=(players.length===2&&i===0);
    const x=right?W-10:10;
    ctx.textAlign=right?'right':'left';
    ctx.fillStyle=p.alive?p.color:'#555';
    ctx.fillText(p.name+' '+String(p.score).padStart(5,'0'),x,18);
    const n=Math.max(0,p.lives);
    for(let k=0;k<n;k++){const hx=right?x-11-k*13:x+k*13;heart(hx,26,p.alive?'#ff4757':'#555');}
  });
  ctx.textAlign='center';ctx.fillStyle='#9a97c9';ctx.font='8px "Press Start 2P",monospace';
  ctx.fillText('VAGUE '+wave,W/2,18);
}
function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07051a');g.addColorStop(1,'#120a2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(0.3+s.s*0.35)+')';ctx.fillRect(s.x,s.y,s.s,s.s);}

  if(state==='menu'){
    // envahisseurs décoratifs
    const t=performance.now()/1000,f=Math.floor(t*2)%2;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)drawSprite(SPR[ROWTYPE[r]][f],(W-((COLS-1)*GX+EW))/2+c*GX+Math.sin(t)*20,70+r*GY,ROWCOL[r]+'33');
    return;
  }

  // sol
  ctx.fillStyle='#2c2852';ctx.fillRect(0,GROUND,W,2);

  for(const e of enemies){if(e.alive)drawSprite(SPR[ROWTYPE[e.r]][frame],ex(e),ey(e),ROWCOL[e.r]);}

  // bonus
  for(const u of pus){
    const d=PU[u.type],bob=Math.sin(u.ph*6)*2;
    ctx.fillStyle=d.c;ctx.shadowColor=d.c;ctx.shadowBlur=12;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(u.x-10,u.y-10+bob,20,20,6):ctx.rect(u.x-10,u.y-10+bob,20,20);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#05040f';ctx.font='9px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText(d.t,u.x+(d.t==='♥'?0:1),u.y+5+bob);
  }

  // lasers joueurs
  ctx.shadowBlur=10;
  for(const b of pb){
    ctx.shadowColor=b.c;ctx.strokeStyle=b.c;ctx.lineWidth=3;
    const len=14/Math.hypot(b.vx,b.vy);
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*len,b.y-b.vy*len);ctx.stroke();
  }
  ctx.shadowBlur=0;
  // tirs ennemis (zigzag)
  ctx.strokeStyle='#ff4757';ctx.lineWidth=2;
  for(const b of eb){
    const o=Math.sin(b.ph)*2;
    ctx.beginPath();ctx.moveTo(b.x+o,b.y-10);ctx.lineTo(b.x-o,b.y-5);ctx.lineTo(b.x+o,b.y);ctx.stroke();
  }

  players.forEach(drawShip);
  for(const q of parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.t*2));ctx.fillStyle=q.c;ctx.fillRect(q.x-1.5,q.y-1.5,3,3);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.t*1.5);ctx.fillStyle=t.c;ctx.font='8px "Press Start 2P",monospace';ctx.fillText(t.txt,t.x,t.y);}
  ctx.globalAlpha=1;

  drawHUD();

  if(state==='play'&&introT>0){
    ctx.font='20px "Press Start 2P",monospace';ctx.fillStyle='#fff';ctx.shadowColor='#ff4fd8';ctx.shadowBlur=14;
    ctx.fillText('VAGUE '+wave,W/2,H/2);
    ctx.shadowBlur=0;ctx.font='8px "Press Start 2P",monospace';ctx.fillStyle='#9a97c9';ctx.fillText('PRÉPAREZ-VOUS !',W/2,H/2+26);
  }
  if(state==='pause'){
    ctx.fillStyle='rgba(5,4,15,.6)';ctx.fillRect(0,0,W,H);
    ctx.font='22px "Press Start 2P",monospace';ctx.fillStyle='#fff';ctx.fillText('PAUSE',W/2,H/2);
    ctx.font='8px "Press Start 2P",monospace';ctx.fillStyle='#9a97c9';ctx.fillText('P / ÉCHAP OU ▶ POUR REPRENDRE',W/2,H/2+28);
  }
}

/* ---------- Boucle ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(resize);
})();
</script>
