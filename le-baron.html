<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Baron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: joyeux, jeu de cartes familial
   IDEA: la table de jeu Gigamic — boîte turquoise, cartes blanches à chiffres bleus
   PICTURE: les 5 rangées de cartes, têtes de bœuf dessinées en SVG
   COLOUR and TYPE: turquoise #1fa6a6, cartes blanches, bleu #2456c8, rose #e0307a ; Fredoka
   LAYOUT: barre des scores, rangées, cartes révélées, main en bas */
:root{color-scheme:light dark;--bg:light-dark(#1fa6a6,#0d4c4f);--bg2:light-dark(#178e8f,#093a3c);--ink:#fff;--card:#fff;--num:#2456c8;--pink:#e0307a;--gold:#ffd23f;--danger:#ff5a4e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg) 40%,var(--bg2));color:var(--ink);font:16px/1.4 Fredoka,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:10px 10px 24px;min-height:100%}
/* setup */
.setup{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.logo{display:flex;align-items:center;gap:12px;justify-content:center}
.logo h1{font-size:46px;line-height:1;margin:0;font-weight:700;letter-spacing:.5px;text-shadow:0 3px 0 #0005}
.logo svg{width:70px;height:84px;filter:drop-shadow(0 3px 0 #0004)}
.sub{text-align:center;margin-top:-6px;opacity:.9}
.panel{background:#fff;color:#223;border-radius:18px;padding:16px;box-shadow:0 6px 0 #0003}
.lbl{font-weight:600;margin-bottom:8px;color:#156}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.nums button{height:46px;border-radius:12px;background:#e8f5f5;color:#156;font-size:20px;font-weight:600}
.nums button.on{background:var(--num);color:#fff;box-shadow:0 3px 0 #123a8a}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) 44px 108px;gap:6px;align-items:center;margin-bottom:8px}
.pnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.prow input{height:44px;border:2px solid #cfe6e6;border-radius:10px;padding:0 10px;font:inherit;font-size:16px;color:#223;background:#fff}
.prow .dice{height:44px;border-radius:10px;background:#fff3c4;font-size:20px}
.type{height:44px;border-radius:10px;font-weight:600;font-size:15px}
.type.h{background:#ffe0ec;color:#a01650}.type.c{background:#e2e9fb;color:#1d3f99}.type.off{background:#eee;color:#777}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ghost{width:100%;height:44px;border-radius:10px;background:#f1f6f6;color:#156;font-weight:600;margin-top:4px}
.big{height:58px;border-radius:16px;background:var(--gold);color:#4a3200;font-size:24px;font-weight:700;box-shadow:0 5px 0 #b38a00}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.link{background:none;text-decoration:underline;opacity:.9;height:44px}
/* game */
.top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ib{width:38px;height:40px;border-radius:12px;background:#0002;font-size:18px;flex:none}
.ib.on{background:var(--gold);color:#4a3200}
.scores{display:flex;gap:5px;flex:1;overflow-x:auto;padding:2px}
.chip{flex:1 0 auto;min-width:64px;background:#0002;border-radius:12px;padding:4px 8px;line-height:1.15;border:2px solid transparent;transition:background .3s}
.chip .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;display:flex;gap:4px;align-items:center}
.chip .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.chip .sc{font-size:18px;font-weight:700;display:flex;align-items:center;gap:3px}
.chip .sc small{font-size:11px;font-weight:500;opacity:.8;margin-left:auto}
.chip.cur{border-color:var(--gold);background:#0003}
.chip.hit{animation:hit .9s}
@keyframes hit{0%,100%{background:#0002}30%{background:var(--danger)}}
.msg{min-height:44px;background:#fff;color:#233;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 #0002}
.msg.bad{background:#ffe6e3;color:#8a1a12}
.msg b{color:var(--num)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{--w:min(60px,calc((100vw - 64px)/6));background:#0002;border-radius:12px;padding:5px;border:2px solid transparent;transition:opacity .2s,border-color .2s}
.row .cards{display:grid;grid-template-columns:repeat(6,var(--w));gap:4px;justify-content:start}
.row.pick{border-color:var(--gold);background:#ffd23f33;cursor:pointer}
.row.dim{opacity:.45}
.row.flash{animation:flash .9s}
@keyframes flash{0%,100%{background:#0002}30%{background:#ff5a4e88}}
.slot{width:var(--w);height:calc(var(--w)*1.4);border:2px dashed #fff5;border-radius:8px}
.slot.six{border-color:#ff8a80aa;display:grid;place-items:center;color:#ffb3ad;font-weight:700;font-size:calc(var(--w)*.3)}
.tally{display:flex;gap:7px;align-items:center;font-size:13px;margin-top:4px;padding-left:2px;flex-wrap:wrap}
.tally span{display:flex;align-items:center;gap:2px}
.tally .dot{width:10px;height:10px;border-radius:50%;border:1px solid #0004}
.tally .w4{color:var(--gold);font-weight:700}.tally .w5{color:#ff9a90;font-weight:700}
.tally .warn{margin-left:auto;background:var(--danger);color:#fff;border-radius:8px;padding:0 6px;font-weight:600}
.tally .ok{margin-left:auto;background:var(--gold);color:#4a3200;border-radius:8px;padding:0 6px;font-weight:600}
/* card */
.card{width:var(--w);height:calc(var(--w)*1.4);background:var(--card);border-radius:calc(var(--w)*.12);position:relative;box-shadow:0 2px 0 #0003,0 0 0 1px #0001 inset;color:var(--num);overflow:hidden;flex:none}
.card .n{position:absolute;top:2%;left:7%;font-weight:700;font-size:calc(var(--w)*.24);line-height:1}
.card .p{position:absolute;top:3%;right:7%;font-weight:700;font-size:calc(var(--w)*.17);color:var(--pink);line-height:1}
.card .hs{position:absolute;inset:22% 4% 4%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0;background:radial-gradient(closest-side,#d8e8ff,transparent)}
.card .hs svg{display:block}
.card.k1 .hs svg{width:72%}.card.k2 .hs svg{width:56%;margin:-6% 0}.card.k3 .hs svg{width:47%;margin:-4% -1%}
.card.baron .hs{inset:16% 2% 2%;flex-direction:column;flex-wrap:nowrap}
.card.baron .mini{display:flex;justify-content:center;width:100%}
.card.baron .mini svg{width:15%}
.card.baron .bh{width:78%}
.card.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) translateY(-40%);opacity:0}}
.card.back{background:repeating-linear-gradient(45deg,#27b5b3 0 6px,#1fa6a6 6px 12px);box-shadow:0 2px 0 #0003,inset 0 0 0 3px #fff}
/* reveal strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;margin-top:6px;--w:46px}
.rv{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;opacity:.45;transition:opacity .2s,transform .2s}
.rv.now{opacity:1;transform:translateY(-4px)}.rv.done{opacity:.3}
.rv.now .card{box-shadow:0 0 0 3px var(--gold)}
.rv .who{font-size:11px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* hand */
.hand{margin-top:10px;background:#0002;border-radius:16px;padding:10px}
.hand h3{margin:0 0 8px;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.hand h3 small{margin-left:auto;font-weight:500;opacity:.85;font-size:13px}
.hc{display:flex;gap:8px;justify-content:center;--w:min(84px,21vw);min-height:calc(var(--w)*1.4 + 12px);align-items:flex-end}
.hc button{background:none;padding:0;border-radius:12px;transition:transform .15s}
.hc button.sel{transform:translateY(-12px)}
.hc button.sel .card{box-shadow:0 0 0 4px var(--gold),0 6px 10px #0004}
.hc.ro{opacity:.75}
.go{display:block;width:100%;margin-top:10px;height:50px;border-radius:14px;background:var(--gold);color:#4a3200;font-size:19px;font-weight:700;box-shadow:0 4px 0 #b38a00}
.go:disabled{opacity:.4;box-shadow:none}
.empty{opacity:.8;text-align:center;padding:12px;font-size:14px}
/* overlays */
.ov{position:fixed;inset:0;background:#0b3c3ee6;display:grid;place-items:center;padding:20px;z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.box{background:#fff;color:#223;border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 8px 0 #0004}
.box h2{margin:0 0 10px;color:#156;font-size:28px;line-height:1.1}
.box p,.box li{font-size:15px}.box ul{padding-left:20px;margin:6px 0}
.box .go{box-shadow:0 4px 0 #b38a00}
.box .sec{background:#e8f5f5;color:#156;box-shadow:none}
.rank{list-style:none;padding:0;margin:0 0 14px}
.rank li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin-bottom:6px;background:#f1f6f6;font-size:17px}
.rank li:first-child{background:#fff3c4}
.rank .m{font-size:22px;width:28px;text-align:center}
.rank .s{margin-left:auto;font-weight:700;color:var(--pink);white-space:nowrap}
@media(max-width:420px){.ib{width:32px;font-size:15px}.top{gap:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
const COL={N:{n:'noir',c:'#2b2b30',d:'#000'},J:{n:'jaune',c:'#f6b800',d:'#9c7200'},G:{n:'gris',c:'#c3c8cf',d:'#71777f'},R:{n:'rouge',c:'#e0362c',d:'#8f1c14'},B:{n:'bleu',c:'#2f6fd6',d:'#173f86'},V:{n:'vert',c:'#2f9e4f',d:'#185f2e'}};
const CK=['N','J','G','R','B','V'];
const PCOL=['#e0307a','#2456c8','#f08a00','#7b3fc4','#16956b','#c0392b'];
const NAMES=['Marguerite','Gaston','Bertille','Hector','Léonie','Firmin','Rosalie','Anatole','Capucine','Barnabé','Joséphine','Octave','Philomène','Séraphin','Clothilde','Achille','Eugénie','Gustave','Hortense','Lucien','Mirabelle','Edmond','Augustine','Fernand'];
const ROBOTS=['Bœutron 3000','R2-Meuh','HAL-9Bœuf','Cyber-Vache','Byte-Bovin','Giga-Meuh','Ordi-Nateur','Proc-Corne','Pixel-Taureau','Meuh-Tron X','Robo-Baron','Silicium-Bœuf','Algo-Rumi','Turbo-Vachette','Watt-Bœuf','Bug-Bison'];
const app=document.getElementById('app');

/* ---------- audio (Web Audio, tout est synthétisé) ---------- */
const AU={ctx:null,sfx:true,music:true,sg:null,mg:null,timer:null,next:0,step:0,mel:[],cycle:0};
try{const p=JSON.parse(localStorage.getItem('baron-audio')||'{}');if(p.sfx===false)AU.sfx=false;if(p.music===false)AU.music=false}catch(e){}
const saveAU=()=>{try{localStorage.setItem('baron-audio',JSON.stringify({sfx:AU.sfx,music:AU.music}))}catch(e){}};
function ac(){
  if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{AU.ctx=new C()}catch(e){return null}
    const x=AU.ctx;AU.sg=x.createGain();AU.sg.gain.value=.55;AU.sg.connect(x.destination);
    const lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(x.destination);
    AU.mg=x.createGain();AU.mg.gain.value=0;AU.mg.connect(lp)}
  if(AU.ctx.state==='suspended')AU.ctx.resume();
  return AU.ctx}
const mf=m=>440*2**((m-69)/12);
function tone(f,t,d,{type='triangle',vol=.3,to=null,att=.005,out=AU.sg,vib=0}={}){
  const x=AU.ctx,o=x.createOscillator(),g=x.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  if(vib){const l=x.createOscillator(),lg=x.createGain();l.frequency.value=5.5;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d+.05)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);return o}
let NB=null;
function noise(t,d,{vol=.3,f=2000,q=1,type='bandpass',out=AU.sg,to=null}={}){
  const x=AU.ctx;if(!NB){NB=x.createBuffer(1,x.sampleRate,x.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const s=x.createBufferSource(),fl=x.createBiquadFilter(),g=x.createGain();s.buffer=NB;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;
  if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function sfx(kind,v=0){
  if(!AU.sfx||!ac())return;const t=AU.ctx.currentTime+.01,r=1+(Math.random()-.5)*.12;
  if(kind==='place'){noise(t,.07,{vol:.5,f:2400,q:.8});tone(620*r,t,.09,{type:'triangle',vol:.28,to:420*r});tone(1240*r,t,.04,{type:'sine',vol:.08})}
  else if(kind==='tick'){tone(1500,t,.035,{type:'sine',vol:.12})}
  else if(kind==='reveal'){for(let i=0;i<4;i++)noise(t+i*.07,.12,{vol:.25,f:900,to:4000,q:1.5});tone(660,t+.3,.15,{vol:.12});tone(990,t+.38,.2,{vol:.12})}
  else if(kind==='deal'){for(let i=0;i<8;i++)noise(t+i*.045,.05,{vol:.22,f:3000+i*150,q:1})}
  else if(kind==='chime'){tone(784,t,.25,{type:'sine',vol:.15});tone(1175,t+.1,.35,{type:'sine',vol:.13})}
  else if(kind==='buzz'){tone(140,t,.3,{type:'square',vol:.09,to:110});tone(147,t,.3,{type:'square',vol:.07,to:104})}
  else if(kind==='take'){ // meuuuh + « wah wah » descendant, plus long si gros ramassage
    const L=Math.min(1.4,.6+v*.06);
    tone(200,t,L,{type:'sawtooth',vol:.16,to:115,att:.08,vib:6});tone(100,t,L,{type:'sawtooth',vol:.1,to:58,att:.08});
    noise(t,.25,{vol:.4,f:180,type:'lowpass'});
    [392,370,349,294].forEach((f,i)=>tone(f,t+L*.2+i*.17,.2,{type:'square',vol:.04}))}
  else if(kind==='win'){[60,64,67,72,67,72,76].forEach((m,i)=>tone(mf(m),t+i*.12,i===6?.7:.18,{type:'triangle',vol:.22}));tone(mf(48),t+.72,.8,{type:'triangle',vol:.18})}
}
/* musique d'ambiance : petite valse-musette générative (I–vi–IV–V) */
const PROG=[[48,[60,64,67]],[45,[57,60,64]],[41,[57,60,65]],[43,[55,59,62]],[48,[60,64,67]],[45,[57,60,64]],[50,[57,62,65]],[43,[55,59,62]]];
const SC=[60,62,64,67,69,72,74,76,79];
function makeMel(){const m=[];let cur=4;for(let b=0;b<8;b++){const ch=PROG[b][1];for(let s=0;s<6;s++){
  if(s===0){const tgt=ch.map(n=>n+12);m.push(tgt[Math.floor(Math.random()*3)]);cur=SC.indexOf(m[m.length-1]);if(cur<0)cur=4;continue}
  if(Math.random()<.42){m.push(null);continue}
  cur=Math.max(0,Math.min(SC.length-1,cur+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)]));m.push(SC[cur])}}return m}
function schedStep(s,t){
  const beat=60/138,bar=Math.floor(s/6)%8,pos=s%6,[root,ch]=PROG[bar],o=AU.mg;
  if(pos===0)tone(mf(root),t,beat*.9,{type:'triangle',vol:.32,out:o});
  if(pos===2||pos===4)ch.forEach(n=>tone(mf(n),t,beat*.35,{type:'square',vol:.028,out:o}));
  const n=AU.mel[s%48];if(n)tone(mf(n),t,beat*.45,{type:'triangle',vol:.14,out:o,vib:3});
  if(pos%2===1)noise(t,.03,{vol:.05,f:7000,type:'highpass',out:o})}
function startMusic(){
  if(!AU.music||!ac()||AU.timer)return;const x=AU.ctx;
  AU.mg.gain.cancelScheduledValues(x.currentTime);AU.mg.gain.setValueAtTime(AU.mg.gain.value,x.currentTime);AU.mg.gain.linearRampToValueAtTime(.5,x.currentTime+1.5);
  if(!AU.mel.length)AU.mel=makeMel();AU.next=x.currentTime+.1;
  AU.timer=setInterval(()=>{const half=60/138/2;
    while(AU.next<x.currentTime+.2){if(AU.step%96===0&&AU.step)AU.mel=makeMel();schedStep(AU.step,AU.next);AU.next+=half;AU.step++}},40)}
function stopMusic(){if(!AU.timer)return;clearInterval(AU.timer);AU.timer=null;const x=AU.ctx;AU.mg.gain.cancelScheduledValues(x.currentTime);AU.mg.gain.setValueAtTime(AU.mg.gain.value,x.currentTime);AU.mg.gain.linearRampToValueAtTime(0,x.currentTime+.4)}
function toggleSfx(){AU.sfx=!AU.sfx;saveAU();if(AU.sfx)sfx('tick')}
function toggleMusic(){AU.music=!AU.music;saveAU();AU.music?startMusic():stopMusic()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SPEED=1;
const wait=ms=>new Promise(r=>setTimeout(r,ms*SPEED));

function head(k){const C=COL[k];
  const eyes=k==='G'
    ?`<path d="M10 19h20v4q0 4-4.5 4T21 23h-2q0 4-4.5 4T10 23z" fill="#ff86b6" stroke="#b0245f" stroke-width="1.2"/>`
    :`<circle cx="15.5" cy="21.5" r="3.8" fill="#fff"/><circle cx="24.5" cy="21.5" r="3.8" fill="#fff"/><circle cx="16.2" cy="22.2" r="1.7" fill="#111"/><circle cx="23.8" cy="22.2" r="1.7" fill="#111"/>`;
  const extra=k==='R'?`<path d="M14 31q3 3 6 0q3 3 6 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>`:k==='V'?`<path d="M18 32q2 4 4 0z" fill="#ff8fa3"/>`:`<ellipse cx="20" cy="31" rx="6" ry="3.4" fill="${C.d}" opacity=".35"/>`;
  return `<svg viewBox="0 0 40 40"><path d="M3 4Q6 17 14 15L13 20Q1 19 3 4Z" fill="${C.c}" stroke="${C.d}" stroke-width="1.2"/><path d="M37 4Q34 17 26 15L27 20Q39 19 37 4Z" fill="${C.c}" stroke="${C.d}" stroke-width="1.2"/><path d="M11 13H29Q31 13 31 16L30 27Q28 37 20 37Q12 37 10 27L9 16Q9 13 11 13Z" fill="${C.c}" stroke="${C.d}" stroke-width="1.2"/>${eyes}${extra}</svg>`}
function baronHead(){return `<svg class="bh" viewBox="0 0 40 46"><rect x="13" y="0" width="14" height="11" rx="1.5" fill="#1b1b1f"/><rect x="13" y="7" width="14" height="2.4" fill="#6b4a2a"/><rect x="8" y="10" width="24" height="3" rx="1.5" fill="#1b1b1f"/><path d="M3 10Q6 23 14 21L13 26Q1 25 3 10Z" fill="#8a5a2b" stroke="#4d3014" stroke-width="1.2"/><path d="M37 10Q34 23 26 21L27 26Q39 25 37 10Z" fill="#8a5a2b" stroke="#4d3014" stroke-width="1.2"/><path d="M11 18H29Q31 18 31 21L30 33Q28 44 20 44Q12 44 10 33L9 21Q9 18 11 18Z" fill="#8a5a2b" stroke="#4d3014" stroke-width="1.2"/><circle cx="15.5" cy="26" r="3.6" fill="#fff"/><circle cx="24.5" cy="26" r="3.6" fill="#fff"/><circle cx="16" cy="26.6" r="1.6" fill="#111"/><circle cx="24" cy="26.6" r="1.6" fill="#111"/><circle cx="24.5" cy="26" r="4.6" fill="#bfe6ff55" stroke="#d4a017" stroke-width="1.3"/><path d="M11 36q4-5 9-1q5-4 9 1q-4 3-9 0q-5 3-9 0z" fill="#fff" stroke="#bbb" stroke-width=".6"/></svg>`}

function cardHTML(c,cls=''){
  if(c.baron)return `<div class="card baron ${cls}"><span class="n">${c.n}</span><span class="p">6</span><div class="hs"><div class="mini">${CK.map(head).join('')}</div>${baronHead()}</div></div>`;
  return `<div class="card k${c.heads.length} ${cls}"><span class="n">${c.n}</span><span class="p">${c.heads.length}</span><div class="hs">${c.heads.map(head).join('')}</div></div>`}

function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildDeck(){const r=rng(2026),d=[];
  for(let n=1;n<=104;n++){
    if(n===52||n===104){d.push({n,baron:true,heads:CK.slice()});continue}
    const x=r(),k=x<.3?1:x<.82?2:3,h=[];let c=CK[Math.floor(r()*6)];h.push(c);
    for(let i=1;i<k;i++){if(r()>=.45)c=CK[Math.floor(r()*6)];h.push(c)}
    d.push({n,heads:h})}
  return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const last=row=>row[row.length-1];
const matches=(c,l)=>c.baron||l.baron||c.heads.some(h=>l.heads.includes(h));
const pen=cards=>cards.reduce((s,c)=>s+c.heads.length,0);
function counts(cards){const o={};for(const c of cards)for(const h of c.heads)o[h]=(o[h]||0)+1;return o}
const maxCount=cards=>Math.max(0,...Object.values(counts(cards)));
const wouldPick=(row,c)=>row.length+1>=6||maxCount(row.concat([c]))>=6;

/* ---------- setup ---------- */
const S={n:3,players:Array.from({length:6},(_,i)=>({name:i?ROBOTS[i-1]:'Joueur 1',human:i===0}))};
function randName(i){const used=S.players.map((p,j)=>j===i?'':p.name);const pool=(S.players[i].human?NAMES:ROBOTS).filter(n=>!used.includes(n));return pool[Math.floor(Math.random()*pool.length)]}
function renderSetup(){
  app.innerHTML=`<div class="setup">
  <div class="logo">${baronHead()}<h1>Le Baron</h1></div>
  <div class="sub">Récoltez le moins de têtes de bœuf possible !</div>
  <div class="panel">
    <div class="lbl">Nombre de joueurs</div>
    <div class="nums">${[1,2,3,4,5,6].map(n=>`<button data-act="n" data-v="${n}" class="${n===S.n?'on':''}" aria-label="${n} joueurs">${n}</button>`).join('')}</div>
    <div class="lbl">Joueurs</div>
    ${S.players.slice(0,S.n).map((p,i)=>`<div class="prow"><span class="pnum" style="background:${PCOL[i]}">${i+1}</span><input id="nm${i}" data-i="${i}" value="${esc(p.name)}" maxlength="14" aria-label="Nom du joueur ${i+1}"><button class="dice" data-act="dice" data-i="${i}" aria-label="Nom au hasard">🎲</button><button data-act="type" data-i="${i}" class="type ${p.human?'h':'c'}">${p.human?'Humain':'Ordinateur'}</button></div>`).join('')}
    <button class="ghost" data-act="allrand">🎲 Tous les noms au hasard</button>
    <div class="lbl" style="margin-top:14px">Ambiance</div>
    <div class="tgs"><button data-act="sfx" class="type ${AU.sfx?'h':'off'}">${AU.sfx?'🔊 Sons : oui':'🔇 Sons : non'}</button><button data-act="music" class="type ${AU.music?'h':'off'}">${AU.music?'🎵 Musique : oui':'🎵 Musique : non'}</button></div>
  </div>
  <button class="big" data-act="start">Jouer !</button>
  <button class="link" data-act="rules">Règles du jeu</button></div>`;
  app.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{S.players[+inp.dataset.i].name=inp.value});
}

/* ---------- game ---------- */
let G=null,GID=0;
function newGame(){
  const n=S.n,deck=shuffle(buildDeck());
  const rows=[0,1,2,3,4].map(()=>[deck.pop()]);
  const per=Math.floor(deck.length/n/4)*4;
  const players=S.players.slice(0,n).map((p,i)=>({name:(p.name.trim()||`Joueur ${i+1}`),human:p.human,col:PCOL[i],deck:deck.splice(0,per),hand:[],score:0,taken:0}));
  G={id:++GID,players,rows,phase:'choose',revealed:[],cur:-1,msg:'La partie commence !',bad:false,selecting:null,sel:null,rowChoice:null,overlay:null,lastPlaced:null,flashRow:-1,hitP:-1,res:null};
  render();play(G.id);
}
const humans=()=>G.players.filter(p=>p.human);

function rowCost(row,c){
  if(wouldPick(row,c))return pen(row);
  const mx=maxCount(row.concat([c]));
  return .18*(row.length+1)+(mx>=5?.9:mx>=4?.35:0)+(row.length===4?.6:0)}
function aiPick(p){
  let best=null,bc=1e9;
  for(const c of p.hand){
    const opts=G.rows.map((r,i)=>i).filter(i=>matches(c,last(G.rows[i])));
    let cost=opts.length?Math.min(...opts.map(i=>rowCost(G.rows[i],c))):Math.min(...G.rows.map(pen))+.6;
    if(c.baron&&p.hand.length>1)cost+=.5;
    cost+=Math.random()*.6;
    if(cost<bc){bc=cost;best=c}}
  return best}
const aiRow=(c,opts)=>opts.reduce((a,b)=>rowCost(G.rows[b],c)<rowCost(G.rows[a],c)?b:a);
const aiTake=()=>[0,1,2,3,4].reduce((a,b)=>pen(G.rows[b])<pen(G.rows[a])||(pen(G.rows[b])===pen(G.rows[a])&&G.rows[b].length<G.rows[a].length)?b:a);

function ask(kind,data){Object.assign(G,data);render();return new Promise(r=>{G.res=r})}

async function play(id){
  const alive=()=>G&&G.id===id;
  await wait(500);if(!alive())return;
  while(true){
    if(G.players.every(p=>!p.hand.length)){
      if(G.players.every(p=>!p.deck.length))break;
      G.players.forEach(p=>p.hand=p.deck.splice(0,4).sort((a,b)=>a.n-b.n));
      const left=G.players[0].deck.length/4;
      sfx('deal');G.msg=`Nouvelle main : chacun pioche 4 cartes${left?` (encore ${left} main${left>1?'s':''} ensuite)`:' — dernière main !'}`;G.bad=false;
    }
    G.phase='choose';G.revealed=[];G.cur=-1;G.lastPlaced=null;
    const chosen=[];
    G.players.forEach((p,i)=>{if(!p.human)chosen[i]=aiPick(p)});
    const H=humans().length;
    for(let i=0;i<G.players.length;i++){
      const p=G.players[i];if(!p.human)continue;
      sfx('chime');if(H>1){await ask('pass',{overlay:{t:'pass',i}});if(!alive())return;G.overlay=null}
      chosen[i]=await ask('pick',{selecting:i,sel:null,msg:`<b>${esc(p.name)}</b>, choisissez une carte en secret.`,bad:false});
      if(!alive())return;G.selecting=null}
    if(!H){G.msg='Les ordinateurs choisissent leurs cartes…';render();await wait(700);if(!alive())return}
    G.players.forEach((p,i)=>p.hand=p.hand.filter(c=>c!==chosen[i]));
    G.revealed=chosen.map((c,i)=>({c,i})).sort((a,b)=>a.c.n-b.c.n);
    sfx('reveal');G.phase='resolve';G.msg='Révélation ! On pose dans l\'ordre croissant.';G.bad=false;render();
    await wait(1100);if(!alive())return;
    for(let k=0;k<G.revealed.length;k++){
      G.cur=k;const {c,i}=G.revealed[k],p=G.players[i];
      const opts=[0,1,2,3,4].filter(r=>matches(c,last(G.rows[r])));
      let ri,forced=false;
      if(!opts.length){forced=true;sfx('buzz');
        if(p.human){ri=await ask('row',{rowChoice:{opts:[0,1,2,3,4],forced:true,c},msg:`<b>${esc(p.name)}</b> : aucune couleur ne correspond au <b>${c.n}</b>. Choisissez la rangée à ramasser.`,bad:true});if(!alive())return;G.rowChoice=null}
        else{G.msg=`<b>${esc(p.name)}</b> ne peut pas poser le ${c.n}…`;G.bad=true;render();await wait(800);if(!alive())return;ri=aiTake()}}
      else if(opts.length===1)ri=opts[0];
      else if(p.human){ri=await ask('row',{rowChoice:{opts,forced:false,c},msg:`<b>${esc(p.name)}</b> : touchez une rangée pour poser le <b>${c.n}</b>.`,bad:false});if(!alive())return;G.rowChoice=null}
      else{render();await wait(450);if(!alive())return;ri=aiRow(c,opts)}
      place(i,c,ri,forced);render();
      await wait(G.bad?1500:850);if(!alive())return;
      G.flashRow=-1;G.hitP=-1}
  }
  G.phase='end';G.overlay={t:'end'};sfx('win');render();
}
function place(pi,c,ri,forced){
  const p=G.players[pi],row=G.rows[ri];let took=null,why='';
  if(forced){took=row;why='placement impossible'}
  else if(row.length+1>=6){took=row;why='6ᵉ carte'}
  else{const cnt=counts(row.concat([c]));const k=CK.find(h=>cnt[h]>=6);if(k){took=row;why=`6 têtes ${{N:'noires',J:'jaunes',G:'grises',R:'rouges',B:'bleues',V:'vertes'}[k]}`}}
  if(took){const pts=pen(took);p.score+=pts;p.taken+=took.length;G.rows[ri]=[c];G.lastPlaced={r:ri,k:0};G.flashRow=ri;G.hitP=pi;
    sfx('take',pts);G.msg=`<b>${esc(p.name)}</b> ramasse la rangée ${ri+1} (${why}) : +${pts} tête${pts>1?'s':''} 🐂`;G.bad=true}
  else{row.push(c);sfx('place');G.lastPlaced={r:ri,k:row.length-1};G.msg=`<b>${esc(p.name)}</b> pose le ${c.n} sur la rangée ${ri+1}.`;G.bad=false}
}

function render(){if(!G){renderSetup();return}
  const g=G,curP=g.phase==='resolve'&&g.cur>=0?g.revealed[g.cur].i:-1;
  const scores=g.players.map((p,i)=>`<div class="chip ${i===curP||i===g.selecting?'cur':''} ${i===g.hitP?'hit':''}"><div class="nm"><i style="background:${p.col}"></i>${esc(p.name)}${p.human?'':' 🤖'}</div><div class="sc">${p.score}<span style="font-size:13px">🐂</span><small>${p.hand.length+p.deck.length} c.</small></div></div>`).join('');
  const rc=g.rowChoice;
  const rows=g.rows.map((row,ri)=>{
    const can=rc&&rc.opts.includes(ri);
    const cnt=counts(row);
    const tally=CK.filter(k=>cnt[k]).map(k=>`<span class="${cnt[k]>=5?'w5':cnt[k]>=4?'w4':''}"><i class="dot" style="background:${COL[k].c}"></i>${cnt[k]}</span>`).join('');
    let tag='';
    if(can){tag=rc.forced||wouldPick(row,rc.c)?`<span class="warn">ramasse ${pen(row)} 🐂</span>`:`<span class="ok">poser ici</span>`}
    const slots=[];for(let s=0;s<6;s++){const c=row[s];
      slots.push(c?cardHTML(c,g.lastPlaced&&g.lastPlaced.r===ri&&g.lastPlaced.k===s?'pop':''):`<div class="slot ${s===5?'six':''}">${s===5?'6':''}</div>`)}
    return `<div class="row ${can?'pick':rc?'dim':''} ${g.flashRow===ri?'flash':''}" ${can?`data-act="row" data-r="${ri}" role="button" tabindex="0" aria-label="Rangée ${ri+1}"`:''}><div class="cards">${slots.join('')}</div><div class="tally"><span style="opacity:.75">R${ri+1}</span>${tally}${tag}</div></div>`}).join('');
  const strip=g.phase==='resolve'&&g.revealed.length?`<div class="strip">${g.revealed.map((r,k)=>`<div class="rv ${k===g.cur?'now':k<g.cur?'done':''}">${cardHTML(r.c)}<span class="who" style="color:${k===g.cur?'var(--gold)':'#fff'}">${esc(g.players[r.i].name)}</span></div>`).join('')}</div>`:'';
  let hand='';
  const H=humans();
  if(g.selecting!=null){const p=g.players[g.selecting];
    hand=`<div class="hand"><h3><i class="dot" style="width:10px;height:10px;border-radius:50%;background:${p.col}"></i>Main de ${esc(p.name)}<small>pioche : ${p.deck.length}</small></h3><div class="hc">${p.hand.map((c,k)=>`<button data-act="card" data-k="${k}" class="${g.sel===k?'sel':''}" aria-label="Carte ${c.n}">${cardHTML(c)}</button>`).join('')}</div><button class="go" data-act="validate" ${g.sel==null?'disabled':''}>${g.sel==null?'Choisissez une carte':`Jouer le ${p.hand[g.sel].n}`}</button></div>`}
  else if(H.length===1){const p=H[0];
    hand=`<div class="hand"><h3>Votre main<small>pioche : ${p.deck.length}</small></h3><div class="hc ro">${p.hand.length?p.hand.map(c=>cardHTML(c)).join(''):'<div class="empty">Main vide — on repioche bientôt</div>'}</div></div>`}
  else if(H.length>1){hand=`<div class="hand"><div class="hc">${'<div class="card back"></div>'.repeat(4)}</div><div class="empty">Les mains restent cachées entre les tours.</div></div>`}
  else hand=`<div class="hand"><div class="empty">Partie entre ordinateurs — regardez-les jouer !</div></div>`;
  let ov='';
  if(g.overlay){const o=g.overlay;
    if(o.t==='pass'){const p=g.players[o.i];ov=`<div class="ov"><div class="box" style="text-align:center"><h2>Au tour de ${esc(p.name)}</h2><p>Passez l'appareil à <b>${esc(p.name)}</b>. Les autres, ne regardez pas !</p><button class="go" data-act="go">Voir ma main</button></div></div>`}
    if(o.t==='quit')ov=`<div class="ov"><div class="box"><h2>Quitter la partie ?</h2><p>La partie en cours sera perdue.</p><button class="go" data-act="quitYes">Oui, quitter</button><button class="go sec" data-act="close">Continuer à jouer</button></div></div>`;
    if(o.t==='end'){const sorted=g.players.map(p=>p).sort((a,b)=>a.score-b.score);const best=sorted[0].score;
      const medal=['🥇','🥈','🥉'];let rank=0;
      ov=`<div class="ov"><div class="box"><h2>${sorted.filter(p=>p.score===best).map(p=>esc(p.name)).join(' & ')} ${sorted.filter(p=>p.score===best).length>1?'gagnent':'gagne'} !</h2><p>Le moins de têtes de bœuf l'emporte.</p><ol class="rank">${sorted.map((p,k)=>{if(k&&p.score>sorted[k-1].score)rank=k;return `<li><span class="m">${medal[rank]||rank+1}</span><span>${esc(p.name)}</span><span class="s">${p.score} 🐂</span></li>`}).join('')}</ol><button class="go" data-act="again">Rejouer</button><button class="go sec" data-act="setup">Changer les joueurs</button></div></div>`}}
  if(g.overlay&&g.overlay.t==='rules')ov=rulesOv();
  app.innerHTML=`<div class="top"><button class="ib" data-act="quit" aria-label="Quitter">✕</button><div class="scores">${scores}</div><button class="ib" data-act="sfx" aria-label="Sons">${AU.sfx?'🔊':'🔇'}</button><button class="ib ${AU.music?'on':''}" data-act="music" aria-label="Musique">🎵</button><button class="ib ${SPEED<1?'on':''}" data-act="speed" aria-label="Vitesse">⏩</button><button class="ib" data-act="rules" aria-label="Règles">?</button></div>
  <div class="msg ${g.bad?'bad':''}">${g.msg}</div><div class="rows">${rows}</div>${strip}${hand}${ov}`;
}
function rulesOv(){return `<div class="ov"><div class="box"><h2>Règles du Baron</h2>
<p>But : récolter le <b>moins de têtes de bœuf</b> possible.</p>
<ul><li>Chacun choisit en secret une carte de sa main (4 cartes), puis on révèle.</li>
<li>On pose dans l'ordre croissant des numéros, à droite de la dernière carte d'une rangée qui partage <b>au moins une couleur</b> de tête.</li>
<li>Les <b>Barons</b> (52 et 104) ont les 6 couleurs : ils vont partout, et toutes leurs têtes comptent.</li>
<li>Vous ramassez la rangée si vous posez la <b>6ᵉ carte</b>, si la rangée atteint <b>6 têtes d'une même couleur</b>, ou si <b>aucune rangée</b> ne correspond (vous choisissez alors laquelle). Votre carte démarre la nouvelle rangée.</li>
<li>Main vide : on repioche 4 cartes. Quand les pioches sont épuisées, le score le plus bas gagne.</li></ul>
<p style="font-size:13px;color:#667">Le chiffre rose d'une carte = son nombre de têtes. Sous chaque rangée, le compte des têtes par couleur.</p>
<button class="go" data-act="close">Compris !</button></div></div>`}

app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
  if(!G||G.phase==='setup'){
    if(a==='n'){S.n=+b.dataset.v;renderSetup()}
    else if(a==='dice'){S.players[i].name=randName(i);document.getElementById('nm'+i).value=S.players[i].name}
    else if(a==='allrand'){for(let j=0;j<S.n;j++)S.players[j].name='';for(let j=0;j<S.n;j++)S.players[j].name=randName(j);renderSetup()}
    else if(a==='type'){S.players[i].human=!S.players[i].human;S.players[i].name=S.players[i].human?`Joueur ${i+1}`:randName(i);renderSetup()}
    else if(a==='sfx'){toggleSfx();renderSetup()}
    else if(a==='music'){ac();toggleMusic();renderSetup()}
    else if(a==='start'){ac();startMusic();newGame()}
    else if(a==='rules'){const d=document.createElement('div');d.innerHTML=rulesOv();d.firstChild.addEventListener('click',ev=>{if(ev.target.closest('[data-act=close]'))d.remove()});app.appendChild(d)}
    return}
  const g=G;
  ac();
  if(a==='card'){g.sel=+b.dataset.k;sfx('tick');render()}
  else if(a==='sfx'){toggleSfx();render()}
  else if(a==='music'){toggleMusic();render()}
  else if(a==='validate'&&g.sel!=null&&g.res){const p=g.players[g.selecting],c=p.hand[g.sel],r=g.res;g.res=null;r(c)}
  else if(a==='row'&&g.res){const r=g.res;g.res=null;r(+b.dataset.r)}
  else if(a==='go'&&g.res){const r=g.res;g.res=null;r()}
  else if(a==='speed'){SPEED=SPEED<1?1:.4;render()}
  else if(a==='rules'){g.prevOv=g.overlay;g.overlay={t:'rules'};render()}
  else if(a==='close'){g.overlay=g.prevOv&&g.prevOv.t!=='quit'&&g.prevOv.t!=='rules'?g.prevOv:null;g.prevOv=null;render()}
  else if(a==='quit'){g.prevOv=g.overlay;g.overlay={t:'quit'};render()}
  else if(a==='quitYes'||a==='setup'){G=null;renderSetup()}
  else if(a==='again')newGame();
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row[data-act]')){e.preventDefault();e.target.click()}});
renderSetup();
}
</script>
