<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flipper du Kraken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: flipper de bar des années 90, nuit tamisée, spectaculaire
   IDEA: un vrai flipper en 3D — meuble noir et or, plateau pourpre et cramoisi chargé d'inserts lumineux, fronton illustré au-dessus d'un afficheur matriciel orange
   PICTURE: la machine elle-même, plein cadre ; l'afficheur du fronton porte score, billes et mission
   COLOUR and TYPE: noir laqué, or, cramoisi, pourpre, orange d'afficheur ; Pirata One + Outfit
   LAYOUT: barre d'outils fine, plateau 3D plein cadre, trois grosses touches en bas sur mobile */
:root{--deep:#050206;--gold:#d9a84a;--coral:#ff5a3c;--pearl:#f4efe4;--ink:#2a1d12}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--pearl);font:16px/1.45 Outfit,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1000px;margin:0 auto}
#stage{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:4}
.tools button{min-width:44px;height:44px;border-radius:12px;border:1px solid rgba(217,168,74,.45);background:rgba(10,4,12,.6);color:var(--pearl);font:600 13px Outfit,sans-serif;cursor:pointer;padding:0 10px}
.tools button[aria-pressed=false]{opacity:.45}
.tools button:focus-visible,footer button:focus-visible,.card button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
footer{display:grid;grid-template-columns:1fr .8fr 1fr;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
footer button{height:62px;border-radius:16px;border:0;font:800 16px Outfit,sans-serif;color:var(--ink);background:linear-gradient(#f7e3b0,#c99a45);box-shadow:0 4px 0 #6d4f1c;cursor:pointer;touch-action:none}
footer button.on{transform:translateY(3px);box-shadow:0 1px 0 #6d4f1c}
#bLaunch{background:linear-gradient(#ff7a5c,#c22a14);color:#fff;box-shadow:0 4px 0 #6d140a}
#bLaunch.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.3)}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,6,.7);z-index:10;padding:16px}
.ov[hidden]{display:none}
.card{background:linear-gradient(170deg,#f8eed8,#e6d2a8);color:var(--ink);border-radius:16px;max-width:470px;width:100%;max-height:92vh;overflow:auto;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(141,118,80,.4)}
.card h1,.card h2{font-family:'Pirata One',serif;font-weight:400;line-height:1.05;margin:0 0 10px;color:#7a1424;text-wrap:balance}
.card h1{font-size:44px}.card h2{font-size:32px}
.card p{margin:0 0 14px}
.goal{background:rgba(122,20,36,.1);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-weight:600}
.choices{display:grid;gap:10px}
.card button{min-height:50px;border-radius:12px;border:0;padding:10px 14px;font:800 16px Outfit,sans-serif;background:#7a1424;color:#fff;cursor:pointer}
.card button.alt{background:#3d1450}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.seg button{background:rgba(61,20,80,.12);color:#3d1450;font-size:14px;padding:8px 6px}
.seg button[aria-pressed=true]{background:#3d1450;color:#fff}
.keys{font-size:13px;opacity:.75;margin:12px 0 0}
.small{font-size:13px;opacity:.8}
@media (hover:hover) and (pointer:fine){footer{display:none}}
@media (prefers-reduced-motion:reduce){#bLaunch.ready{animation:none}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas>
    <div class="tools">
      <button id="tView" title="Changer de vue (V)">Vue</button>
      <button id="tMus" aria-pressed="true" title="Musique">♫</button>
      <button id="tSfx" aria-pressed="true" title="Bruitages">FX</button>
      <button id="tPause" title="Pause (P)">II</button>
    </div>
  </div>

    <button id="bL">◀ Gauche</button>

    <button id="bR">Droite ▶</button>
  </footer>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),stage=$('stage');
const W=600,H=1100,S=8,G=.3,GZ=.66,MAXV=26,BR=11,TAU=Math.PI*2;
let view='joueur',state='intro',frame=0;

/* ---------- Géométrie du plateau ---------- */
const walls=[];
const wall=(ax,ay,bx,by,o)=>walls.push(Object.assign({ax,ay,bx,by,r:3,e:.4,kick:0,t:'rail'},o||{}));
wall(20,300,20,860,{t:'outer'});wall(545,330,545,1100);wall(580,300,580,1100,{t:'outer'});
wall(25,854,185,984);wall(540,854,380,984);
wall(545,330,580,300,{gate:1,t:'gate'});
wall(545,1060,580,1060,{t:'none'});
const ARC=[];for(let i=0;i<=28;i++){const a=Math.PI+Math.PI*i/28;ARC.push([300+280*Math.cos(a),300+280*Math.sin(a)])}
for(let i=0;i<28;i++)wall(ARC[i][0],ARC[i][1],ARC[i+1][0],ARC[i+1][1],{e:.25,t:'outer'});
const slings=[[[75,780],[75,850],[145,905]],[[490,780],[490,850],[420,905]]],slFl=[0,0];
slings.forEach((p,i)=>{wall(p[0][0],p[0][1],p[1][0],p[1][1],{t:'none'});wall(p[1][0],p[1][1],p[2][0],p[2][1],{t:'none'});wall(p[0][0],p[0][1],p[2][0],p[2][1],{kick:6,e:.5,sl:i,t:'none'})});
const posts=[[174,118,6],[246,108,6],[318,108,6],[390,118,6]];
const bumpers=[{x:220,y:300,r:26,f:0},{x:345,y:300,r:26,f:0},{x:282,y:400,r:26,f:0}];
const LX=[210,282,354],LY=118,LET=['M','E','R'];let lanes=[0,0,0];const laneCd=[0,0,0];
const SAU={x:165,y:335};
const flips=[
 {px:180,py:990,len:86,rest:.5,up:-.45,side:-1,r0:11,r1:6},
 {px:385,py:990,len:86,rest:Math.PI-.5,up:Math.PI+.45,side:1,r0:11,r1:6},
 {px:28,py:640,len:62,rest:.55,up:-.35,side:-1,r0:9,r1:5},
 {px:537,py:560,len:62,rest:Math.PI-.55,up:Math.PI+.35,side:1,r0:9,r1:5}];
flips.forEach(f=>{f.a=f.rest;f.om=0;f.tx=f.px+Math.cos(f.a)*f.len;f.ty=f.py+Math.sin(f.a)*f.len});
/* Cibles tombantes (2 rangées de 3) et cibles fixes */
const drops=[],banks=[{reset:0},{reset:0}];
[[[160,700],[185,675],[210,650]],[[405,700],[380,675],[355,650]]].forEach((pts,b)=>{const n=b?[-.7071,.7071]:[.7071,.7071];pts.forEach((p,i)=>{const tx=-n[1],ty=n[0];drops.push({x:p[0],y:p[1],nx:n[0],ny:n[1],bank:b,i,down:false,z:0,ax:p[0]+tx*13,ay:p[1]+ty*13,bx:p[0]-tx*13,by:p[1]-ty*13})})});
const stands=[[540,395,-1],[540,435,-1],[25,560,1]].map(q=>({x:q[0],y:q[1],nx:q[2],ny:0,ax:q[0],ay:q[1]-13,bx:q[0],by:q[1]+13,lit:0,f:0}));
let extraLit=false;

function cat(pts,n){const D=pts[0].length,o=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
 for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t,q=[];for(let k=0;k<D;k++)q.push(.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3));o.push(q)}}
 o.push(pts[pts.length-1].slice());return o}
function mkRamp(name,label,ctrl,wireCtrl,col){
 const N=12,p=cat(ctrl,N);p.forEach(q=>{q[2]=Math.max(0,q[2])});
 const L=[0],T=[];
 for(let i=1;i<p.length;i++){const dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1],dh=p[i][2]-p[i-1][2],l=Math.hypot(dx,dy,dh)||1;L.push(L[i-1]+l);T.push([dx/l,dy/l,dh/l])}
 const t0=T[0],n0=Math.hypot(t0[0],t0[1]);
 return{name,label,p,L,T,len:L[L.length-1],wire:wireCtrl*N,ent:p[0],d0:[t0[0]/n0,t0[1]/n0],col}}
const ramps=[
 mkRamp('ouest','Ouest',[[100,472,0],[105,340,32],[125,220,62],[95,150,72],[50,230,64],[38,420,48],[38,640,30],[48,820,0]],3,0xff4a5a),
 mkRamp('est','Est',[[465,472,0],[460,340,32],[440,220,62],[470,150,72],[515,230,64],[527,420,48],[527,640,30],[517,820,0]],3,0xff4a5a),
 mkRamp('centre','Œil',[[282,612,0],[345,540,22],[395,430,48],[410,300,70],[360,175,76],[300,140,62],[240,170,32],[200,218,0]],4,0xffc040)];

/* ---------- Histoire ---------- */
const STORY={
 port:{c:0,t:'Chapitre 1 · Le port de Brumeville',x:"Les dockers roulent les tonneaux pendant que la brume se lève sur les quais. Avant de partir, il faut remplir les cales de la Sirène d'Argent.",goal:{type:'bump',n:12,inc:6,label:'Charge les vivres : frappe les bumpers',dmd:'VIVRES'},next:'route'},
 route:{c:1,t:'Chapitre 2 · La haute mer',x:"Le navire quitte le port. Au nord, un orage gronde ; au sud, les récifs du Serpent affleurent sous l'écume. Quel cap prends-tu ?",ch:[['Braver la tempête','tempete'],['Longer les récifs','recifs']]},
 tempete:{c:1,t:'Dans la tempête',x:"Les vagues dépassent le grand mât. Monte les rampes jusqu'en haut pour fendre la houle. Un tir trop mou et la bille redescend !",goal:{type:'ramp',n:4,inc:2,label:'Fends les vagues : réussis des rampes',dmd:'RAMPES'},next:'ile'},
 recifs:{c:1,t:'Les récifs du Serpent',x:"Des écueils surgissent de chaque côté de la coque. Abats les rangées de cibles tombantes pour te frayer un passage.",goal:{type:'drop',n:2,inc:1,label:'Abats des rangées de cibles',dmd:'ECUEILS'},next:'ile'},
 ile:{c:2,t:"Chapitre 3 · L'Île du Crâne",x:"Une île en forme de crâne surgit de la brume. Sur la plage s'ouvre une grotte, et un chant étrange monte des rochers.",ch:[['Explorer la grotte','grotte'],['Suivre le chant des sirènes','sirenes']]},
 grotte:{c:2,t:'La grotte des contrebandiers',x:"Dans l'obscurité dorment de vieux canons. Cache deux billes dans la grotte (le trou en haut à gauche, que la rampe de l'Œil alimente) : elles reviendront en multibille.",goal:{type:'lock',n:2,inc:0,label:'Cache des billes dans la grotte',dmd:'GROTTE'},next:'kraken'},
 sirenes:{c:2,t:'Le chant des sirènes',x:"Les sirènes révéleront l'antre du Kraken à qui allumera leurs trois étoiles M·E·R. Passe dans les couloirs du haut ; chaque coup de raquette déplace les lumières.",goal:{type:'lane',n:2,inc:1,label:'Allume les couloirs M·E·R',dmd:'SIRENES'},next:'kraken'},
 kraken:{c:3,t:'Chapitre 4 · Le Kraken',x:"La mer devient noire. Huit tentacules jaillissent autour du navire : le Kraken s'éveille ! Comment l'affrontes-tu ?",ch:[['Harponner les tentacules','harpon'],["Viser l'œil du monstre",'oeil']]},
 harpon:{c:3,t:'Harponner les tentacules',x:"Trois billes, trois harpons ! Chaque rampe réussie pendant la multibille est un jackpot.",goal:{type:'jackpot',n:5,inc:2,label:'Jackpots : rampes en multibille',dmd:'JACKPOTS'},mb:3,next:'victoire'},
 oeil:{c:3,t:"Viser l'œil",x:"Le monstre n'a qu'un point faible : son œil géant. Enfile la rampe centrale jusqu'au bout pendant la multibille.",goal:{type:'center',n:3,inc:1,label:"Frappe l'œil : rampe centrale en multibille",dmd:'OEIL'},mb:3,next:'victoire'},
 victoire:{c:4,t:'Le trésor des Abysses',x:"Le Kraken sombre en grondant. Au fond de son antre brille le trésor de la Reine des Abysses. L'équipage t'acclame : un million de points et une extra ball !",ch:[["Repartir à l'aventure (plus difficile)",'port']]}
};

/* ---------- État du jeu ---------- */
let balls=[],score=0,ballNum=1,extraBalls=0,level=1,mult=1,goal=null,node=null,chapter=0,locks=0,relight=false,mbActive=false;
let ballSave=0,saveArmed=false,pending=0,storyT=0,rampTotal=0,charge=0,plunging=false,pL=false,pR=false,nudgeCd=0,shake=0,flashT=0,best=0;
try{best=+localStorage.getItem('krakenBest')||0}catch(e){}
const inL=new Set(),inR=new Set();
function newBall(x,y,o){return Object.assign({x,y,h:0,vx:0,vy:0,r:BR,inPlay:true,hold:0,cool:0,ramp:null,still:0,sc:0},o||{})}
function serve(save){balls.push(newBall(562.5,1046,{inPlay:false}));saveArmed=save!==false;ballSave=0}
function spawnSaucer(h){balls.push(newBall(SAU.x,SAU.y,{hold:h}))}
function add(p){score+=p*mult*level}
let dmdMsg=null;
function banner(t,sub){dmdMsg={t,sub:sub||'',f:100}}
function flash(n){flashT=Math.max(flashT,n||18);sfx('flash')}
function startMultiball(total){const need=total-balls.length;for(let i=0;i<need;i++)spawnSaucer(25+i*45);mbActive=true;ballSave=600;intensity=2;sfx('mb');banner('MULTIBILLE',balls.length+' BILLES');flash(40)}

function ev(t){
 if(!goal||goal.done||state!=='play')return;
 let ok;
 if(goal.type==='jackpot')ok=(t==='ramp'||t==='center')&&mbActive;
 else if(goal.type==='center')ok=t==='center'&&mbActive;
 else if(goal.type==='ramp')ok=t==='ramp'||t==='center';
 else ok=goal.type===t;
 if(!ok)return;
 if(goal.type==='jackpot'){add(25000);banner('JACKPOT',(25000*mult*level).toLocaleString('fr-FR'));sfx('jackpot');flash(40)}
 if(goal.type==='center'){add(40000);banner('OEIL TOUCHE',(40000*mult*level).toLocaleString('fr-FR'));sfx('jackpot');flash(40)}
 goal.c++;
 if(goal.c>=goal.n){goal.done=true;add(50000);sfx('mission');setTimeout(()=>banner('MISSION','ACCOMPLIE'),500);storyT=110;flash(30);
  if(goal.type==='lock'){for(let i=0;i<locks;i++)spawnSaucer(20+i*45);locks=0;mbActive=balls.length>1;ballSave=600;intensity=2;sfx('mb');banner('MULTIBILLE',balls.length+' BILLES')}}
}
function rampDone(r){rampTotal++;sfx('ramp2');add(r.name==='centre'?3000:2000);flash(12);
 if(rampTotal%8===0){extraBalls++;setTimeout(()=>{banner('EXTRA BALL');sfx('extra')},300)}
 else if(!dmdMsg)banner('RAMPE '+r.label.toUpperCase(),'TOTAL '+rampTotal);
 ev(r.name==='centre'?'center':'ramp')}
function saucerCatch(b){
 if(extraLit){extraLit=false;extraBalls++;banner('EXTRA BALL');sfx('extra');flash(30)}
 if(goal&&goal.type==='lock'&&!goal.done&&state==='play'){balls.splice(balls.indexOf(b),1);locks++;sfx('lock');add(10000);banner('BILLE CACHEE',locks+' / '+goal.n);serve(false);ev('lock');return}
 b.hold=50;sfx('saucer');add(5000);
 if(relight){relight=false;startMultiball(3)}
}
function dropHit(d){d.down=true;add(750);sfx('drop');shake=Math.max(shake,2);
 const bk=drops.filter(q=>q.bank===d.bank);
 if(bk.every(q=>q.down)){add(25000);banner('RANGEE ABATTUE','25 000');sfx('extra');flash(25);banks[d.bank].reset=150;ev('drop')}}
function standHit(s){if(s.f)return;s.f=15;add(1000);sfx('stand');
 if(!s.lit){s.lit=1;if(stands.every(q=>q.lit)){extraLit=true;banner('EXTRA BALL','ALLUMEE A LA GROTTE');sfx('extra');setTimeout(()=>stands.forEach(q=>q.lit=0),600)}}}
function endBall(){sfx('drain');intensity=0;shake=8;pending=90;banner(extraBalls>0?'REJOUE !':'BILLE PERDUE')}
function nextBall(){mult=1;lanes=[0,0,0];if(extraBalls>0)extraBalls--;else ballNum++;if(ballNum>3){gameOver();return}intensity=1;serve()}

/* ---------- Physique ---------- */
let NX=0,NY=0;
function seg(b,ax,ay,bx,by,r0,r1,e,om,ox,oy){
 const abx=bx-ax,aby=by-ay;let t=((b.x-ax)*abx+(b.y-ay)*aby)/(abx*abx+aby*aby);t=t<0?0:t>1?1:t;
 const px=ax+abx*t,py=ay+aby*t,dx=b.x-px,dy=b.y-py,m=b.r+r0+(r1-r0)*t,d2=dx*dx+dy*dy;
 if(d2>=m*m)return 0;
 const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d;NX=nx;NY=ny;
 b.x=px+nx*m;b.y=py+ny*m;
 const fvx=-om*(py-oy),fvy=om*(px-ox),vn=(b.vx-fvx)*nx+(b.vy-fvy)*ny;
 if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn}
 return .001;
}
function circ(b,x,y,r,e){const dx=b.x-x,dy=b.y-y,m=b.r+r,d2=dx*dx+dy*dy;if(d2>=m*m)return 0;const d=Math.sqrt(d2)||1,nx=dx/d,ny=dy/d;b.x=x+nx*m;b.y=y+ny*m;NX=nx;NY=ny;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn}return .001}
function collide(b){
 for(const w of walls){if(w.gate&&!b.inPlay)continue;
  const h=seg(b,w.ax,w.ay,w.bx,w.by,w.r,w.r,w.e,0,0,0);
  if(h>1.2&&w.kick&&!b.sc){b.vx+=NX*w.kick;b.vy+=NY*w.kick;b.sc=8;slFl[w.sl]=12;sfx('sling');add(50);ev('sling')}
  else if(h>4&&w.t!=='none')sfx('wall')}
 for(const d of drops){if(d.down)continue;const h=seg(b,d.ax,d.ay,d.bx,d.by,3,3,.3,0,0,0);if(h>1.5&&NX*d.nx+NY*d.ny>0)dropHit(d)}
 for(const s of stands){const h=seg(b,s.ax,s.ay,s.bx,s.by,3,3,.45,0,0,0);if(h>1.5&&NX*s.nx>0)standHit(s)}
 for(const p of posts)if(circ(b,p[0],p[1],p[2],.5)>2)sfx('post');
 for(const k of bumpers){if(circ(b,k.x,k.y,k.r,.5)){const sp=Math.max(9,Math.hypot(b.vx,b.vy)*.85);b.vx=NX*sp;b.vy=NY*sp;if(!k.f){sfx('bump');add(100);ev('bump');shake=Math.max(shake,2)}k.f=10}}
 for(const f of flips)seg(b,f.px,f.py,f.tx,f.ty,f.r0,f.r1,.25,f.om,f.px,f.py);
 const sp=Math.hypot(b.vx,b.vy);if(sp>MAXV){b.vx*=MAXV/sp;b.vy*=MAXV/sp}
}
function tryRamp(b){
 if(b.cool>0)return false;
 for(const r of ramps){const dx=b.x-r.ent[0],dy=b.y-r.ent[1];if(dx*dx+dy*dy<20*20){const v=b.vx*r.d0[0]+b.vy*r.d0[1];if(v>3){b.ramp={r,s:0,v,i:0,w:0};sfx('ramp');return true}}}
 return false}
function rampStep(b){
 const R=b.ramp,r=R.r;let i=R.i;
 while(i<r.T.length-1&&r.L[i+1]<R.s)i++;while(i>0&&r.L[i]>R.s)i--;R.i=i;
 const t=r.T[i];R.v+=(G*t[1]-GZ*t[2])/S;R.v*=.9996;R.s+=R.v/S;
 if(R.s<=0){const d=r.d0;b.ramp=null;b.h=0;b.x=r.ent[0]-d[0]*4;b.y=r.ent[1]-d[1]*4;b.vx=d[0]*R.v;b.vy=d[1]*R.v;b.cool=30;sfx('rollback');return}
 if(R.s>=r.len){const e=r.p[r.p.length-1],tl=r.T[r.T.length-1],n=Math.hypot(tl[0],tl[1])||1,v=Math.min(R.v,18);b.ramp=null;b.h=0;b.x=e[0];b.y=e[1];b.vx=tl[0]/n*v;b.vy=tl[1]/n*v;b.cool=30;rampDone(r);return}
 const u=Math.min(1,Math.max(0,(R.s-r.L[i])/(r.L[i+1]-r.L[i]))),a=r.p[i],c=r.p[i+1];
 b.x=a[0]+(c[0]-a[0])*u;b.y=a[1]+(c[1]-a[1])*u;b.h=a[2]+(c[2]-a[2])*u;
 if(!R.w&&i>=r.wire){R.w=1;sfx('wire')}
}
function update(){
 frame++;
 const L=inL.size>0,R=inR.size>0;
 if(L&&!pL){sfx('flip');lanes.push(lanes.shift())}
 if(R&&!pR){sfx('flip');lanes.unshift(lanes.pop())}
 pL=L;pR=R;
 if(plunging)charge=Math.min(1,charge+.025);
 for(let s=0;s<S;s++){
  for(const f of flips){const tg=(f.side<0?L:R)?f.up:f.rest,st=.3/S,pa=f.a;f.a=f.a<tg?Math.min(tg,f.a+st):Math.max(tg,f.a-st);f.om=(f.a-pa)*S;f.tx=f.px+Math.cos(f.a)*f.len;f.ty=f.py+Math.sin(f.a)*f.len}
  for(const b of balls){if(b.hold)continue;if(b.ramp){rampStep(b);continue}
   b.vy+=G/S;b.x+=b.vx/S;b.y+=b.vy/S;collide(b);if(b.inPlay&&tryRamp(b))continue}
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],c=balls[j];if(a.ramp||c.ramp||a.hold||c.hold)continue;
   const dx=c.x-a.x,dy=c.y-a.y,d2=dx*dx+dy*dy,m=a.r+c.r;if(d2<m*m&&d2>0){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;const vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(vn<0){a.vx+=vn*nx;a.vy+=vn*ny;c.vx-=vn*nx;c.vy-=vn*ny;sfx('click')}}}
 }
 for(const b of balls.slice()){
  if(b.cool>0)b.cool--;if(b.sc)b.sc--;
  if(b.ramp)continue;
  if(b.hold){b.hold--;b.x=SAU.x;b.y=SAU.y;b.vx=b.vy=0;if(!b.hold){b.vx=3.5;b.vy=5.5;b.cool=40;sfx('saucer');shake=3}continue}
  if(!b.inPlay&&b.y<285){b.inPlay=true;if(saveArmed){ballSave=480;saveArmed=false}}
  if(b.cool<=0&&Math.hypot(b.x-SAU.x,b.y-SAU.y)<13){saucerCatch(b);continue}
  for(let i=0;i<3;i++)if(laneCd[i]<=0&&Math.abs(b.x-LX[i])<12&&Math.abs(b.y-LY)<12){laneCd[i]=25;add(500);
   if(!lanes[i]){lanes[i]=1;sfx('lane')}
   if(lanes[0]&&lanes[1]&&lanes[2]){mult=Math.min(6,mult+1);banner('BONUS X'+mult);sfx('extra');setTimeout(()=>lanes=[0,0,0],500);ev('lane')}}
  const sp=Math.abs(b.vx)+Math.abs(b.vy);
  if(b.inPlay&&sp<.3){if(++b.still>200){b.vy=-7;b.vx=(Math.random()-.5)*6;b.still=0}}else b.still=0;
 }
 for(let i=0;i<3;i++)if(laneCd[i]>0)laneCd[i]--;
 for(const k of bumpers)if(k.f)k.f--;
 for(let i=0;i<2;i++)if(slFl[i])slFl[i]--;
 for(const s of stands)if(s.f)s.f--;
 banks.forEach((bk,i)=>{if(bk.reset&&--bk.reset===0){const mine=drops.filter(d=>d.bank===i);if(balls.some(b=>mine.some(d=>Math.hypot(b.x-d.x,b.y-d.y)<26)))bk.reset=10;else{mine.forEach(d=>d.down=false);sfx('dropup')}}});
 if(nudgeCd)nudgeCd--;
 if(flashT)flashT--;
 if(ballSave>0&&balls.some(b=>b.inPlay))ballSave--;
 let dr=0;balls=balls.filter(b=>b.y<H+25||(dr++,false));
 if(dr){
  if(ballSave>0){for(let i=0;i<dr;i++){if(mbActive)spawnSaucer(30+i*30);else serve(false)}banner('BILLE SAUVEE');sfx('lock')}
  else if(balls.length===0)endBall();
  else sfx('drain');
  if(balls.length<=1&&mbActive&&!(ballSave>0)){mbActive=false;intensity=balls.length?1:0;
   if(goal&&!goal.done&&(goal.type==='jackpot'||goal.type==='center')){relight=true;setTimeout(()=>banner('GROTTE','RELANCE MULTIBILLE'),600)}}
 }
 if(pending&&--pending===0)nextBall();
 if(storyT&&--storyT===0&&node)showNode(node.next);
}

 eyeGlow=glowSprite(V3(282,520,6),150,0xff4a2a,1);eyeGlow.visible=false;
 for(const r of ramps)rampMesh(r);
 plunger=new T.Group();const rod=new T.Mesh(new T.CylinderGeometry(4,4,80,12),M.rail);rod.rotation.x=Math.PI/2;rod.position.z=40;plunger.add(rod);
 const tip=new T.Mesh(new T.CylinderGeometry(12,12,8,16),M.dark);tip.rotation.x=Math.PI/2;plunger.add(tip);plunger.position.set(262.5,11,0);scene.add(plunger);
 const knob=new T.Mesh(new T.SphereGeometry(14,16,12),mat({color:0xd9a84a,metalness:.6,roughness:.3}));knob.position.set(262.5,-25,640);scene.add(knob);M.knob=knob;
 const bm=mat({color:0xffffff,metalness:1,roughness:.08,envMapIntensity:1.4});
 for(let i=0;i<5;i++){const s=new T.Mesh(new T.SphereGeometry(BR,32,24),bm);s.castShadow=true;s.visible=false;scene.add(s);ballMeshes.push(s)}
 if(document.fonts)document.fonts.ready.then(()=>{drawPlayfield();M.pf.needsUpdate=true;drawBackglass(M.bgc);M.bgt.needsUpdate=true;drawSide(M.sideC);M.sideT.needsUpdate=true;drawFront(M.frontC);M.frontT.needsUpdate=true;drawApron(M.apC);M.apT.needsUpdate=true});
}
/* Caméras : distance et cadrage calculés pour que tout tienne à l'écran */
const VIEWS={joueur:{el:30,az:0,fov:44,label:'Vue joueur'},ensemble:{el:58,az:0,fov:40,label:"Vue d'ensemble"},meuble:{el:22,az:-30,fov:38,label:'Vue meuble'}};
const ORDER=['joueur','ensemble','meuble'];
function fitCam(){
 const v=VIEWS[view],el=v.el*Math.PI/180,az=v.az*Math.PI/180,dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el));
 const right=new THREE.Vector3(Math.cos(az),0,-Math.sin(az)),fwd=new THREE.Vector3(-Math.sin(az),0,-Math.cos(az));
 const w=stage.clientWidth||300,h=stage.clientHeight||300;camera.aspect=w/h;camera.fov=v.fov;camera.near=10;camera.far=1e6;camera.updateProjectionMatrix();
 const pts=[];for(const x of[-320,320])for(const z of[-600,600])pts.push(new THREE.Vector3(x,0,z),new THREE.Vector3(x,90,z));
 for(const x of[-350,350])pts.push(new THREE.Vector3(x,680,-625));
 if(view==='meuble')for(const x of[-330,330])for(const z of[-580,600])pts.push(new THREE.Vector3(x,-722,z));
 const tgt=new THREE.Vector3(0,view==='meuble'?-80:0,0);let D=2000;
 const place=d=>{camera.position.copy(tgt).addScaledVector(dir,d);camera.lookAt(tgt);camera.updateMatrixWorld()};
 for(let it=0;it<6;it++){let lo=200,hi=20000;
  for(let k=0;k<30;k++){const mid=(lo+hi)/2;place(mid);let ok=true;for(const p of pts){const q=p.clone().project(camera);if(Math.abs(q.x)>.96||Math.abs(q.y)>.94||q.z>1){ok=false;break}}if(ok)hi=mid;else lo=mid}
  D=hi;place(D);let mnx=9,mxx=-9,mny=9,mxy=-9;for(const p of pts){const q=p.clone().project(camera);mnx=Math.min(mnx,q.x);mxx=Math.max(mxx,q.x);mny=Math.min(mny,q.y);mxy=Math.max(mxy,q.y)}
  tgt.addScaledVector(right,(mnx+mxx)/2*D*.2);tgt.addScaledVector(fwd,(mny+mxy)/2*D*.25)}
 camera.far=D*1.5+4000;camera.updateProjectionMatrix();place(D);camBase.x=camera.position.x;camBase.y=camera.position.y;camBase.z=camera.position.z;camBase.tx=tgt.x;camBase.ty=tgt.y;camBase.tz=tgt.z;camTgt.x=tgt.x;camTgt.z=tgt.z;
}
function resize(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);fitCam()}
function setView(v){view=v;$('tView').textContent=VIEWS[v].label;resize()}
function render(){
 for(let i=0;i<flips.length;i++)flipMeshes[i].rotation.y=-flips[i].a;
 bumpers.forEach((k,i)=>{const b=bumperParts[i],f=k.f/10;b.skirt.position.y=7-f*4;b.capM.emissiveIntensity=.35+f*1.8;b.top.material.emissiveIntensity=f*.8;b.lt.material.opacity=.3+f*.7});
 slingMats.forEach((m,i)=>m.emissiveIntensity=slFl[i]/12*1.2);
 for(const o of dropMeshes){const tz=o.d.down?-32:0;o.g.position.y+=(tz-o.g.position.y)*.35}
 for(const o of standMeshes){o.plate.position.x=1-(o.s.f>0?3:0)}
 for(const l of lampObjs){const on=!!l.test();l.m.color.copy(on?l.on:l.off);l.gl.visible=on}
 const gt=goal&&!goal.done?goal.type:'';
 for(const c of chevrons){const on=c.r.name==='centre'?['center','jackpot','ramp'].includes(gt):['ramp','jackpot'].includes(gt);
  c.cs.forEach((m,k)=>{const lit=((frame/6|0)%3)===k;m.color.set(on?(lit?0xffffff:c.r.col):(lit?0x5a2030:0x2e1020))})}
 eyeGlow.visible=gt==='center'||gt==='jackpot';eyeGlow.material.opacity=.5+.5*Math.sin(frame*.1);
 const sLit=gt==='lock'||relight||extraLit;saucerRim.emissiveIntensity=sLit?.6+.6*Math.sin(frame*.15):0;
 const fl=flashT>0&&(flashT>>1)%2?1:0;flashers.forEach(f=>{f.dm.emissiveIntensity=.1+fl*3;f.l.intensity=fl*2.5;f.gs.material.opacity=fl*.9});
 plunger.position.z=1066+charge*32-550;M.knob.position.z=640+charge*30;
 buttons.forEach(b=>{const p=b.s<0?inL.size>0:inR.size>0;b.m.position.x=b.s*(352-(p?6:0))});
 let fast=0,onRamp=0;
 ballMeshes.forEach((m,i)=>{const b=balls[i];m.visible=!!b;if(b){m.position.copy(V3(b.x,b.y,BR+b.h));if(b.hold)return;const sp=b.ramp?Math.abs(b.ramp.v):Math.hypot(b.vx,b.vy);fast=Math.max(fast,sp);if(b.ramp)onRamp=1}});
 const pulse=bumpers.reduce((a,k)=>a+k.f,0)/30,dim=pending?.55:1;giLights.forEach(g=>g.l.intensity=g.i*dim*(1+pulse*.4));
 const focus=balls.reduce((a,b)=>!a||b.y>a.y?b:a,null);
 if(view==='joueur'&&focus){camTgt.x+=((camBase.tx+(focus.x-300)*.08)-camTgt.x)*.05;camTgt.z+=((camBase.tz+(focus.y-550)*.06)-camTgt.z)*.05}
 else{camTgt.x+=(camBase.tx-camTgt.x)*.1;camTgt.z+=(camBase.tz-camTgt.z)*.1}
 const sx=(Math.random()-.5)*shake,sz=(Math.random()-.5)*shake;if(shake>0)shake*=.85;if(shake<.1)shake=0;
 camera.position.set(camBase.x+(camTgt.x-camBase.tx)+sx,camBase.y,camBase.z+(camTgt.z-camBase.tz)+sz);camera.lookAt(camTgt.x,camBase.ty,camTgt.z);
 if(frame%3===0||state!=='play'){dmdCompose();const key=dbuf.join('');if(key!==lastDmd){lastDmd=key;dmdPaint()}}
 renderer.render(scene,camera);
 rollAudio(fast,onRamp);
}

/* ---------- Cartes d'histoire ---------- */
const card=$('card'),ov=$('ov');
function openCard(html,binds){card.innerHTML=html;ov.hidden=false;for(const id in binds){const el=$(id);if(el)el.onclick=binds[id]}const f=card.querySelector('button');if(f)f.focus({preventScroll:true})}
function closeCard(){ov.hidden=true}
function viewSeg(){return '<div class="seg">'+ORDER.map(v=>'<button id="v_'+v+'" aria-pressed="'+(view===v)+'">'+VIEWS[v].label+'</button>').join('')+'</div>'}
function bindSeg(){ORDER.forEach(v=>{$('v_'+v).onclick=()=>{setView(v);ORDER.forEach(u=>$('v_'+u).setAttribute('aria-pressed',u===v))}})}
function intro(){
 state='intro';
 openCard('<h1>La Légende du Kraken</h1><p>Brumeville, 1724. La carte de ton grand-père mène à l\'antre du Kraken, où repose le trésor de la Reine des Abysses. Ton navire, la Sirène d\'Argent, attend au port. À toi d\'écrire la suite.</p><p class="small">Score, billes et mission s\'affichent sur l\'écran orange du fronton. Choisis ta vue (modifiable à tout moment avec le bouton en haut) :</p>'+viewSeg()+'<div class="choices"><button id="go">Commencer l\'aventure</button></div><p class="keys">Clavier : ← / Z raquettes gauches · → / M raquettes droites · Espace pour lancer (maintenir = plus fort) · T secouer · V vue · P pause.<br>Mobile : touche la moitié gauche ou droite du plateau, ou les grosses touches.<br>Les cibles jaunes et violettes tombent quand on les touche ; abats une rangée entière pour la relever. Les 3 cibles bleues allument l\'extra ball à la grotte.</p>',{go:()=>{initAudio();newGame()}});
 bindSeg();
}
function newGame(){balls=[];score=0;ballNum=1;extraBalls=0;level=1;mult=1;locks=0;relight=false;mbActive=false;rampTotal=0;lanes=[0,0,0];pending=0;storyT=0;goal=null;chapter=0;extraLit=false;dmdMsg=null;
 drops.forEach(d=>d.down=false);stands.forEach(s=>s.lit=0);serve();intensity=1;showNode('port')}
function showNode(id){
 node=STORY[id];state='story';
 if(id==='victoire'){score+=1e6*level;extraBalls++;level++;sfx('win');flash(60)}
 chapter=node.c%4;if(id==='victoire')chapter=4;
 let h='<h2>'+node.t+'</h2><p>'+node.x+'</p>';const b={};
 if(node.goal){const n=node.goal.n+(level-1)*node.goal.inc;h+='<div class="goal">Mission : '+node.goal.label+' ('+n+')</div><div class="choices"><button id="c0">À l\'abordage !</button></div>';b.c0=()=>startGoal(node)}
 else{h+='<div class="choices">'+node.ch.map((c,i)=>'<button id="c'+i+'" class="'+(i?'alt':'')+'">'+c[0]+'</button>').join('')+'</div>';node.ch.forEach((c,i)=>b['c'+i]=()=>{sfx('lane');showNode(c[1])})}
 openCard(h,b);
}
function startGoal(n){goal={type:n.goal.type,n:n.goal.n+(level-1)*n.goal.inc,c:0,label:n.goal.label,dmd:n.goal.dmd,done:false};locks=0;relight=false;closeCard();state='play';banner(n.goal.dmd,'0 / '+goal.n);if(n.mb)startMultiball(n.mb);if(!balls.length&&!pending)serve()}
function gameOver(){
 state='over';intensity=0;try{if(score>best){localStorage.setItem('krakenBest',score)}}catch(e){}best=Math.max(best,score);
 openCard('<h2>Naufrage !</h2><p>La Sirène d\'Argent rejoint les abysses… mais ta légende reste gravée sur les quais.</p><div class="goal">Score : '+score.toLocaleString('fr-FR')+'<br>Meilleur score : '+best.toLocaleString('fr-FR')+'</div>'+viewSeg()+'<div class="choices"><button id="again">Reprendre la mer</button></div>',{again:()=>newGame()});bindSeg();
}
function pause(){
 if(state==='play'){state='pause';openCard('<h2>Pause</h2><p>L\'équipage reprend son souffle.</p>'+viewSeg()+'<div class="choices"><button id="res">Reprendre</button><button id="quit" class="alt">Recommencer</button></div>',{res:()=>{closeCard();state='play'},quit:()=>newGame()});bindSeg()}
 else if(state==='pause'){closeCard();state='play'}
}

/* ---------- Audio : musique générée + bruitages ---------- */
let AC=null,mG,sG,dIn,nBuf,rollG,rollF,intensity=0,nextT=0,step=0,musicOn=true,sfxOn=true;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[[57,60,64,45],[53,57,60,41],[48,52,55,48],[55,59,62,43]];
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
 const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
 mG=AC.createGain();mG.gain.value=musicOn?.5:0;mG.connect(comp);
 sG=AC.createGain();sG.gain.value=sfxOn?.8:0;sG.connect(comp);
 dIn=AC.createDelay(1);dIn.delayTime.value=.49;const fb=AC.createGain();fb.gain.value=.38;const lp=AC.createBiquadFilter();lp.frequency.value=2200;dIn.connect(lp);lp.connect(fb);fb.connect(dIn);lp.connect(mG);
 nBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=nBuf;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;const og=AC.createGain();og.gain.value=.12;
 const lfo=AC.createOscillator();lfo.frequency.value=.09;const lg=AC.createGain();lg.gain.value=.1;lfo.connect(lg);lg.connect(og.gain);src.connect(f);f.connect(og);og.connect(mG);src.start();lfo.start();
 const rs=AC.createBufferSource();rs.buffer=nBuf;rs.loop=true;rollF=AC.createBiquadFilter();rollF.type='bandpass';rollF.frequency.value=260;rollF.Q.value=.8;rollG=AC.createGain();rollG.gain.value=0;rs.connect(rollF);rollF.connect(rollG);rollG.connect(sG);rs.start();
 nextT=AC.currentTime+.1;setInterval(sched,25);
}
function rollAudio(sp,ramp){if(!AC||!rollG)return;const t=AC.currentTime;rollG.gain.setTargetAtTime(state==='play'?Math.min(.32,sp*.014):0,t,.06);rollF.frequency.setTargetAtTime(ramp?900:220+sp*12,t,.06)}
function tone(dest,f,t,dur,type,g,f2,att){const o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+(att||.005));a.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(a);a.connect(dest);o.start(t);o.stop(t+dur+.05);return a}
function noise(dest,t,dur,freq,g,type,q,f2){const s=AC.createBufferSource();s.buffer=nBuf;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(freq,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q||1;const a=AC.createGain();a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(a);a.connect(dest);s.start(t,Math.random());s.stop(t+dur+.05)}
function sched(){
 if(!AC)return;const sp=60/92/4;
 while(nextT<AC.currentTime+.15){
  const t=nextT,ch=PROG[Math.floor(step/32)%4],s16=step%16;
  if(step%32===0){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=intensity>1?1400:800;lp.connect(mG);
   for(let i=0;i<3;i++)for(const dt of[-6,6]){const o=AC.createOscillator(),a=AC.createGain();o.type='sawtooth';o.frequency.value=mtof(ch[i]);o.detune.value=dt;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.035,t+1);a.gain.linearRampToValueAtTime(.03,t+sp*28);a.gain.linearRampToValueAtTime(0,t+sp*34);o.connect(a);a.connect(lp);o.start(t);o.stop(t+sp*35)}}
  if(intensity>=1){
   if(s16===0||s16===10){tone(mG,mtof(ch[3]),t,.5,'triangle',.22);tone(mG,mtof(ch[3]-12),t,.6,'sine',.2)}
   if(step%2===0){const n=ch[(step/2|0)%3]+12+((step/2|0)%8===7?12:0);tone(mG,mtof(n),t,.22,'triangle',.07).connect(dIn)}
   if(s16===0||s16===8)tone(mG,120,t,.25,'sine',.28,40);
  }
  if(intensity>=2){if(step%2===1)noise(mG,t,.04,8000,.12,'highpass');if(s16===4||s16===12)noise(mG,t,.14,1800,.25,'bandpass',.7);if(s16===6||s16===14)tone(mG,120,t,.2,'sine',.22,40);
   if(step%4===0){const m=[69,72,76,74,72,71,69,67][(step/4|0)%8];tone(mG,mtof(m+12),t,.3,'square',.035).connect(dIn)}}
  nextT+=sp;step++;
 }
}
const lastS={};
function sfx(n){
 if(!AC||!sfxOn)return;const t=AC.currentTime,d=sG;
 if(lastS[n]&&t-lastS[n]<.045)return;lastS[n]=t;
 switch(n){
  case'flip':noise(d,t,.06,1500,.45,'bandpass',.8);tone(d,110,t,.08,'square',.1,60);break;
  case'bump':tone(d,660,t,.15,'square',.1,330);tone(d,990,t,.08,'sine',.12);noise(d,t,.05,2500,.3);break;
  case'sling':tone(d,320,t,.12,'triangle',.25,140);noise(d,t,.05,3000,.3);break;
  case'post':tone(d,1400,t,.04,'sine',.05);break;
  case'wall':noise(d,t,.04,1200,.18,'bandpass',2);break;
  case'click':tone(d,2600,t,.03,'sine',.08);tone(d,3400,t,.02,'sine',.05);break;
  case'ramp':noise(d,t,.08,700,.3,'bandpass',1.5);break;
  case'wire':tone(d,2400,t,.12,'triangle',.08);tone(d,3100,t+.03,.1,'triangle',.06);break;
  case'rollback':tone(d,500,t,.4,'triangle',.08,180);break;
  case'ramp2':[784,988,1175].forEach((f,i)=>tone(d,f,t+i*.06,.18,'triangle',.1));break;
  case'lane':tone(d,1320,t,.1,'sine',.12);tone(d,1760,t+.06,.1,'sine',.1);break;
  case'drain':tone(d,440,t,1,'sawtooth',.12,50);noise(d,t,.8,600,.25,'lowpass',1,80);break;
  case'launch':noise(d,t,.45,400,.5,'bandpass',1,3000);tone(d,70,t,.15,'sine',.4,40);break;
  case'saucer':tone(d,90,t,.25,'sine',.4,40);noise(d,t,.06,800,.3);break;
  case'lock':[392,523,659].forEach((f,i)=>tone(d,f,t+i*.1,.3,'triangle',.18));break;
  case'extra':[523,659,784,1047,1319].forEach((f,i)=>tone(d,f,t+i*.08,.35,'square',.06));break;
  case'jackpot':tone(d,200,t,.6,'sawtooth',.1,1600);[1047,1319,1568].forEach((f,i)=>tone(d,f,t+.3+i*.07,.3,'square',.06));break;
  case'mb':[262,330,392,523,392,523,659,784].forEach((f,i)=>tone(d,f,t+i*.09,.3,'sawtooth',.06));break;
  case'mission':[523,659,784,1047].forEach((f,i)=>tone(d,f,t+i*.12,.5,'triangle',.15));break;
  case'drop':noise(d,t,.12,900,.5,'lowpass',1,200);tone(d,180,t,.15,'square',.12,70);break;
  case'dropup':noise(d,t,.2,500,.4,'bandpass',1,2500);tone(d,120,t,.2,'square',.1,240);break;
  case'stand':tone(d,880,t,.1,'square',.08,1200);noise(d,t,.04,4000,.25);break;
  case'flash':noise(d,t,.25,300,.25,'lowpass');break;
  case'win':[392,523,659,784,659,784,1047].forEach((f,i)=>tone(d,f,t+i*.14,.6,'square',.07));break;
 }
}


/* ---------- Commandes ---------- */
const KL=['ArrowLeft','KeyZ','KeyA','ShiftLeft'],KR=['ArrowRight','KeyM','Slash','ShiftRight'],KP=['Space','ArrowDown','Enter'];
addEventListener('keydown',e=>{
 if(KL.includes(e.code)){inL.add(e.code);e.preventDefault()}
 else if(KR.includes(e.code)){inR.add(e.code);e.preventDefault()}
 else if(KP.includes(e.code)&&state==='play'){if(!e.repeat){plunging=true;charge=0}e.preventDefault()}
 else if(e.code==='KeyP')pause();
 else if(e.code==='KeyV')setView(ORDER[(ORDER.indexOf(view)+1)%3]);
 else if(e.code==='KeyT')nudge();
});
addEventListener('keyup',e=>{inL.delete(e.code);inR.delete(e.code);if(KP.includes(e.code))release()});
addEventListener('blur',()=>{inL.clear();inR.clear();release()});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;initAudio();const r=stage.getBoundingClientRect();(e.clientX<r.left+r.width/2?inL:inR).add('p'+e.pointerId);e.preventDefault()});
const pUp=e=>{inL.delete('p'+e.pointerId);inR.delete('p'+e.pointerId)};
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,pUp));
function hold(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('on');initAudio();down()});
 ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{el.classList.remove('on');up()}));el.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('bL'),()=>inL.add('bL'),()=>inL.delete('bL'));
hold($('bR'),()=>inR.add('bR'),()=>inR.delete('bR'));
hold($('bLaunch'),()=>{if(state==='play'){plunging=true;charge=0}},release);
$('tView').onclick=()=>setView(ORDER[(ORDER.indexOf(view)+1)%3]);
$('tPause').onclick=pause;
$('tMus').onclick=()=>{musicOn=!musicOn;$('tMus').setAttribute('aria-pressed',musicOn);if(mG)mG.gain.value=musicOn?.5:0};
$('tSfx').onclick=()=>{sfxOn=!sfxOn;$('tSfx').setAttribute('aria-pressed',sfxOn);if(sG)sG.gain.value=sfxOn?.8:0};

/* ---------- Démarrage ---------- */
let last=performance.now(),acc=0;
function loop(now){
 acc+=Math.min(.1,(now-last)/1000);last=now;
 while(acc>=1/60){if(state==='play')update();else frame++;acc-=1/60}
 $('bLaunch').classList.toggle('ready',state==='play'&&!!laneBall());
 render();requestAnimationFrame(loop);
}
if(!window.THREE){openCard('<h2>Moteur 3D indisponible</h2><p>Le moteur 3D n\'a pas pu se charger. Vérifie ta connexion puis recharge la page.</p>',{});}
else{
 try{build3D()}catch(e){openCard('<h2>3D non prise en charge</h2><p>Ton appareil ne permet pas l\'affichage WebGL nécessaire à ce flipper.</p>',{});throw e}
 const ro=new ResizeObserver(resize);ro.observe(stage);
 setView('joueur');intro();requestAnimationFrame(loop);
}
}
