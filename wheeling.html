<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wheelie !</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#d3d3d3;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  #dist{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:46px;font-weight:800;
    color:#1d1d1d;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  #dist small{font-size:24px;font-weight:700;margin-left:4px}
  #best{position:absolute;top:24px;right:22px;font-size:18px;font-weight:700;color:#444;font-variant-numeric:tabular-nums}
  #mute{position:absolute;top:16px;left:16px;pointer-events:auto;width:44px;height:44px;border-radius:50%;
    border:none;background:rgba(255,255,255,.75);font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    transition:opacity .25s}
  .overlay.hidden{opacity:0}
  .card{background:rgba(255,255,255,.94);border-radius:18px;padding:26px 34px;text-align:center;max-width:min(440px,86vw);
    box-shadow:0 10px 30px rgba(0,0,0,.18);color:#222}
  .card h1{margin:0 0 8px;font-size:44px;letter-spacing:-1px;color:#e23b3b;font-style:italic}
  .card h2{margin:0 0 6px;font-size:32px;color:#e23b3b}
  .card p{margin:8px 0;line-height:1.45;font-size:16px}
  .big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
  .newrec{color:#e23b3b;font-weight:800;font-size:20px;animation:pulse .6s infinite alternate}
  .cta{margin-top:14px;font-weight:700;color:#5a5af0;animation:pulse .8s infinite alternate}
  kbd{background:#eee;border:1px solid #ccc;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:14px}
  .modes{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .mode{pointer-events:auto;cursor:pointer;border:none;border-radius:14px;padding:14px 16px;min-width:150px;flex:1;
    font:inherit;color:#fff;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
  .mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .mode b{display:block;font-size:22px}
  .mode span{display:block;font-size:13px;opacity:.92;margin-top:3px}
  .mode i{display:block;font-style:normal;font-size:12px;margin-top:6px;opacity:.85}
  .mode.easy{background:#4caf6a}.mode.hard{background:#e2453b}
  .mode.sel{outline:3px solid #222;outline-offset:2px}
  .small{pointer-events:auto;cursor:pointer;border:none;background:none;color:#5a5af0;font:inherit;font-weight:700;
    text-decoration:underline;margin-top:8px}
  .hint{font-size:12px;color:#777;margin-top:10px}
  @keyframes pulse{from{opacity:1}to{opacity:.45}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="dist">0.0<small>m</small></div>
  <div id="best">Record : 0.0 m</div>
  <button id="mute" title="Son (M)">🔊</button>
</div>

<div id="title" class="overlay">
  <div class="card">
    <h1>WHEELIE !</h1>
    <p><b>Maintiens</b> (clic, doigt ou <kbd>Espace</kbd>) : le vélo se cabre.<br>
       <b>Relâche</b> : il redescend.</p>
    <p>La roue avant ne doit <b>jamais</b> toucher le sol…<br>et attention à ne pas basculer en arrière !</p>
    <div class="modes">
      <button class="mode easy" data-mode="easy"><b>😌 Facile</b><span>Tout droit, sans obstacle</span><i id="recEasy"></i></button>
      <button class="mode hard" data-mode="hard"><b>🔥 Difficile</b><span>Montées, descentes, bosses</span><i id="recHard"></i></button>
    </div>
    <div class="hint">Clavier : <kbd>1</kbd> facile · <kbd>2</kbd> difficile</div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h2 id="overTitle">Chute !</h2>
    <div class="big" id="overDist">0.0 m</div>
    <div id="overRec"></div>
    <p id="overBest"></p>
    <div class="cta">Appuie pour rejouer</div>
    <button class="small" id="changeMode">Changer de mode</button>
  </div>
</div>

<script>
(() => {
"use strict";
// ---------- Canvas ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, S, DPR, GROUND, BIKEX;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
  S = Math.min(H/6.2, W/8.5);       // pixels par mètre
  GROUND = H*0.80;                   // ligne de sol à l'écran
  BIKEX = W*0.26;                    // position écran de la roue arrière
}
addEventListener('resize', resize); resize();

// ---------- Stockage ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let mode = store.get('wheelie_mode', 'easy') === 'hard' ? 'hard' : 'easy';
const bests = {
  easy: parseFloat(store.get('wheelie_best_easy', '0')) || 0,
  hard: parseFloat(store.get('wheelie_best_hard', '0')) || 0
};
let best = bests[mode];
const MODE_NAME = { easy: 'Facile', hard: 'Difficile' };
let muted = store.get('wheelie_muted', '0') === '1';

// ---------- Constantes physiques ----------
const WB = 1.05;     // empattement (m)
const R = 0.33;      // rayon de roue (m)
const START = -9;    // départ avant la ligne
const GK = 6;        // gravité angulaire
const PHI = 0.36;    // décalage du centre de gravité
const DAMP = 2.5;    // amortissement (mouvements plus doux)
const FLIP = 1.75;   // ~100° : bascule arrière
// pédalage : fort quand la roue est basse, plus doux quand on est déjà haut
const pedal = a => 9.0 - 4.5*a;
// en relâchant, on « freine » : le vélo redescend même s'il est très cabré
const brake = a => 2.5*Math.min(1, Math.max(0, (a - 0.4)/0.6));

// ---------- État ----------
let phase = 'title';    // title | run | crash
let x = START, v = 0, th = 0, om = 0, lastVy = 0;
let hold = false, crashT = 0, crashType = '', overReady = false;
let camX = START, camY = 0, shake = 0, time = 0, tickAcc = 0, lastMilestone = 0, passedRecord = false, newRecord = false;
let rider = null, crashDist = 0;       // rider détaché après une chute
let bumps = [], bumpGenX = 0, rng = Math.random;

function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- Terrain (bosses) ----------
let hp1 = 0, hp2 = 0, hp3 = 0;
function resetTerrain(){
  rng = mulberry((Math.random()*1e9)|0);
  bumps = []; bumpGenX = 28;
  hp1 = -6*0.085 + (rng()*0.6 - 0.3);   // on commence par une montée
  hp2 = -6*0.2 + (rng()*0.8 - 0.4); hp3 = rng()*6.28;
}
// relief (mode difficile) : collines douces qui s'accentuent avec la distance
function hill(px){
  if (mode !== 'hard' || px <= 6) return 0;
  const ramp = Math.min(1, (px - 6)/14);
  const grow = 1 + Math.min(px/500, 0.5);
  const X0 = 6;
  const f = 2.4*(Math.sin(px*0.085 + hp1) - Math.sin(X0*0.085 + hp1))
          + 0.8*(Math.sin(px*0.2 + hp2) - Math.sin(X0*0.2 + hp2))
          + 0.12*(Math.sin(px*0.47 + hp3) - Math.sin(X0*0.47 + hp3));
  return ramp*grow*f;
}
function genTerrain(upTo){
  if (mode !== 'hard') return;
  while (bumpGenX < upTo){
    const w = 0.9 + rng()*1.6;
    const h = Math.min(0.05 + bumpGenX/1400, 0.30) * (0.55 + rng()*0.6);
    bumps.push({c: bumpGenX, w, h});
    bumpGenX += Math.max(4.5, 15 - bumpGenX/70) + rng()*9;
  }
}
function gy(px){
  // recherche binaire de la première bosse dont la fin est après px
  let lo = 0, hi = bumps.length;
  while (lo < hi){ const m = (lo+hi) >> 1; if (bumps[m].c + bumps[m].w/2 < px) lo = m+1; else hi = m; }
  let y = hill(px);
  for (let i = lo; i < bumps.length && i < lo+3; i++){
    const b = bumps[i], d = px - b.c;
    if (Math.abs(d) < b.w/2) y += b.h*0.5*(1 + Math.cos(Math.PI*d/(b.w/2)));
  }
  return y;
}

// ---------- Audio ----------
let AC = null, master, musicG, sfxG, noiseBuf, rollG, rollF, musicTimer, step = 0, nextT = 0;
const mtof = m => 440*Math.pow(2, (m-69)/12);

function initAudio(){
  if (AC){ if (AC.state === 'suspended') AC.resume().catch(()=>{}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(AC.destination);
  musicG = AC.createGain(); musicG.gain.value = 0.14; musicG.connect(master);
  sfxG = AC.createGain(); sfxG.gain.value = 0.75; sfxG.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  // bruit de roulement continu
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  rollF = AC.createBiquadFilter(); rollF.type = 'bandpass'; rollF.frequency.value = 300; rollF.Q.value = 0.8;
  rollG = AC.createGain(); rollG.gain.value = 0;
  src.connect(rollF); rollF.connect(rollG); rollG.connect(sfxG); src.start();
  nextT = AC.currentTime + 0.1;
  musicTimer = setInterval(schedule, 25);
}
function tone(at, f, dur, type, vol, dest, f2){
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at+dur);
  gn.gain.setValueAtTime(0.0001, at);
  gn.gain.linearRampToValueAtTime(vol, at+0.005);
  gn.gain.exponentialRampToValueAtTime(0.0001, at+dur);
  o.connect(gn); gn.connect(dest || sfxG); o.start(at); o.stop(at+dur+0.03);
}
function noise(at, dur, vol, ftype, freq, dest, freq2){
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.setValueAtTime(freq, at);
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, at+dur);
  const gn = AC.createGain(); gn.gain.setValueAtTime(vol, at); gn.gain.exponentialRampToValueAtTime(0.0001, at+dur);
  s.connect(f); f.connect(gn); gn.connect(dest || sfxG);
  s.start(at, Math.random()*1.5); s.stop(at+dur+0.03);
}
const now = () => AC ? AC.currentTime : 0;

// Musique : boucle chiptune de 4 mesures (Am – F – C – G)
const BASS = [45, 41, 36, 43];
const ARP = [[69,72,76],[65,69,72],[64,67,72],[62,67,71]];
const MEL = [76,0,74,76,72,0,69,72, 72,0,69,72,77,76,74,72, 76,0,79,76,72,0,74,76, 74,0,71,74,79,0,74,71];
const SP = 60/138/4;
function schedule(){
  if (!AC) return;
  if (nextT < AC.currentTime - 0.2) nextT = AC.currentTime + 0.05;
  while (nextT < AC.currentTime + 0.12){ playStep(step, nextT); nextT += SP; step = (step+1) % 64; }
}
function playStep(s, t){
  const bar = (s >> 4), st = s & 15;
  if ([0,3,6,8,11,14].includes(st)) tone(t, mtof(BASS[bar]), SP*1.8, 'triangle', 0.55, musicG);
  if (st % 2 === 0) tone(t, mtof(ARP[bar][(st/2)%3] - 12), SP*1.2, 'square', 0.07, musicG);
  if (st % 2 === 0){ const m = MEL[bar*8 + st/2]; if (m) tone(t, mtof(m), SP*1.9, 'square', 0.11, musicG); }
  if (st === 0 || st === 8 || st === 10) tone(t, 150, 0.16, 'sine', 0.8, musicG, 40);
  if (st === 4 || st === 12) noise(t, 0.14, 0.35, 'highpass', 1500, musicG);
  if (st % 2 === 1) noise(t, 0.04, 0.12, 'highpass', 7000, musicG);
}
function musicLevel(v){ if (AC) musicG.gain.setTargetAtTime(v, AC.currentTime, 0.3); }

// Bruitages
const sfx = {
  bell(){ const t = now(); [0, 0.16].forEach(d => { tone(t+d, 2100, 0.45, 'sine', 0.25); tone(t+d, 2640, 0.3, 'sine', 0.08); }); },
  tick(){ noise(now(), 0.018, 0.10, 'highpass', 3500); },
  lift(){ noise(now(), 0.22, 0.10, 'bandpass', 500, null, 1400); },
  milestone(){ const t = now(); tone(t, 880, 0.08, 'square', 0.12); tone(t+0.08, 1320, 0.14, 'square', 0.12); },
  record(){ const t = now(); [660,880,1100,1320,1760].forEach((f,i) => tone(t+i*0.07, f, 0.18, 'triangle', 0.25)); },
  crash(){ const t = now();
    noise(t, 0.6, 0.8, 'lowpass', 2000, null, 150);
    tone(t, 130, 0.35, 'sine', 0.9, null, 35);
    tone(t+0.02, 523, 0.18, 'square', 0.10, null, 300); tone(t+0.06, 784, 0.15, 'square', 0.07, null, 500);
    noise(t+0.25, 0.25, 0.3, 'bandpass', 900); },
  thud(){ noise(now(), 0.12, 0.35, 'lowpass', 600); tone(now(), 90, 0.15, 'sine', 0.5, null, 40); },
  warn(){ tone(now(), 330, 0.07, 'sawtooth', 0.06); }
};

const muteBtn = document.getElementById('mute');
function applyMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; if (AC) master.gain.setTargetAtTime(muted ? 0 : 0.8, AC.currentTime, 0.05); }
function toggleMute(){ muted = !muted; store.set('wheelie_muted', muted ? '1' : '0'); initAudio(); applyMute(); }
applyMute();

// ---------- UI ----------
const elDist = document.getElementById('dist'), elBest = document.getElementById('best');
const elTitle = document.getElementById('title'), elOver = document.getElementById('over');
function fmt(m){ return m.toFixed(1); }
function updateBestUI(){
  elBest.textContent = 'Record ' + MODE_NAME[mode] + ' : ' + fmt(best) + ' m';
  document.getElementById('recEasy').textContent = 'Record : ' + fmt(bests.easy) + ' m';
  document.getElementById('recHard').textContent = 'Record : ' + fmt(bests.hard) + ' m';
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('sel', b.dataset.mode === mode));
}
updateBestUI();

// ---------- Déroulement ----------
function startRun(m){
  if (m){ mode = m; store.set('wheelie_mode', mode); }
  best = bests[mode];
  resetTerrain(); genTerrain(200);
  x = START; v = 6; th = 0; om = 0; lastVy = 0; camX = x; camY = 0; rider = null;
  updateBestUI();
  phase = 'run'; crashT = 0; overReady = false; tickAcc = 0; lastMilestone = 0;
  passedRecord = best <= 0; newRecord = false;
  elTitle.classList.add('hidden'); elOver.classList.add('hidden');
  sfx.bell(); musicLevel(0.22);
}
function crash(type){
  if (phase !== 'run') return;
  phase = 'crash'; crashType = type; crashT = 0; shake = 1;
  sfx.crash(); musicLevel(0.07);
  // le cycliste est éjecté
  const c = Math.cos(th), s = Math.sin(th), ay = gy(x) + R;
  const hx = 0.28, hy = 0.56;
  rider = { x: x + c*hx - s*hy, y: ay + s*hx + c*hy, ang: th, landed: false,
            vx: type === 'front' ? v*0.85 : v*0.25, vy: type === 'front' ? 2.6 : 1.6,
            av: type === 'front' ? -7 : 4.5 };
  if (type === 'back') om = Math.max(om, 2.5);
  const d = Math.max(0, x); crashDist = d;
  newRecord = d > best;
  if (newRecord){ best = d; bests[mode] = d; store.set('wheelie_best_' + mode, String(best)); }
  document.getElementById('overTitle').textContent = type === 'front' ? 'Roue avant au sol !' : 'Basculé en arrière !';
  document.getElementById('overDist').textContent = fmt(d) + ' m';
  document.getElementById('overRec').innerHTML = newRecord && d > 0 ? '<div class="newrec">NOUVEAU RECORD !</div>' : '';
  document.getElementById('overBest').innerHTML = 'Mode ' + MODE_NAME[mode] + ' · Record : <b>' + fmt(best) + ' m</b>';
  updateBestUI();
}

function press(){
  initAudio();
  if (phase === 'title') return;   // on choisit le mode avec les boutons
  if (phase === 'crash'){ if (overReady){ startRun(); hold = true; } return; }
  if (!hold && phase === 'run') sfx.lift();
  hold = true;
}
function release(){ hold = false; }

addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); press(); }, {passive:false});
document.querySelectorAll('.mode').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); initAudio(); startRun(b.dataset.mode); hold = false;
}));
function toTitle(){
  phase = 'title'; hold = false; rider = null; x = START; th = 0; om = 0; v = 0; camX = x; camY = 0;
  elOver.classList.add('hidden'); elTitle.classList.remove('hidden'); musicLevel(0.12);
  best = bests[mode]; updateBestUI();
}
document.getElementById('changeMode').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toTitle(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.code === 'KeyM'){ toggleMute(); return; }
  if (phase === 'title' || (phase === 'crash' && overReady)){
    if (e.code === 'Digit1' || e.code === 'Numpad1'){ initAudio(); startRun('easy'); return; }
    if (e.code === 'Digit2' || e.code === 'Numpad2'){ initAudio(); startRun('hard'); return; }
    if (phase === 'title' && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); initAudio(); startRun(mode); hold = true; return; }
  }
  if (['Space','ArrowUp','KeyW','KeyZ','Enter'].includes(e.code)){ e.preventDefault(); if (!e.repeat) press(); }
});
addEventListener('keyup', e => { if (['Space','ArrowUp','KeyW','KeyZ','Enter'].includes(e.code)) release(); });
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });

// ---------- Physique ----------
function minTh(){ return Math.asin(Math.max(-1, Math.min(1, (gy(x + WB*Math.cos(th)) - gy(x))/WB))); }
let warnCd = 0;
function step_(dt){
  time += dt;
  if (phase === 'run'){
    genTerrain(x + 120);
    const base = 6 + Math.min(Math.max(x, 0)*0.022, 7.5);
    const slope = (gy(x + 0.5) - gy(x - 0.5));
    v += (Math.max(4, Math.min(base*1.5, base*(1 - slope*1.1))) - v)*Math.min(1, dt*2);
    const g0 = gy(x); x += v*dt; const g1 = gy(x);
    const vy = (g1 - g0)/dt;
    // une bosse sous la roue arrière fait piquer le nez
    om += -(vy - lastVy)/(WB*Math.max(Math.cos(th), 0.35))*0.4; lastVy = vy;
    const a = -GK*Math.cos(th + PHI) + (hold ? pedal(th) : -brake(th)) - DAMP*om;
    om += a*dt; th += om*dt;
    const thMin = Math.asin(Math.max(-1, Math.min(1, (gy(x + WB*Math.cos(th)) - gy(x))/WB)));
    if (th <= thMin){
      th = thMin;
      if (x >= 0) crash('front');
      else if (om < 0) om = 0;
    }
    if (th > FLIP) crash('back');
    // sons
    if (!hold){ tickAcc += v*dt; if (tickAcc > 0.35){ tickAcc = 0; sfx.tick(); } }
    warnCd -= dt;
    if (x > 0 && (th > 1.5 || th - minTh() < 0.1) && warnCd <= 0){ sfx.warn(); warnCd = 0.18; }
    const m = Math.floor(Math.max(x, 0)/10);
    if (m > lastMilestone){ lastMilestone = m; sfx.milestone(); }
    if (!passedRecord && x > best){ passedRecord = true; sfx.record(); }
  } else if (phase === 'crash'){
    crashT += dt;
    v = Math.max(0, v - 10*dt); x += v*dt;
    const thMin = Math.asin(Math.max(-1, Math.min(1, (gy(x + WB*Math.cos(th)) - gy(x))/WB)));
    if (crashType === 'back'){
      om += 9*dt; th += om*dt;
      if (th > 2.95){ th = 2.95; om = 0; }
    } else th = thMin;
    if (rider){
      rider.vy -= 9.8*dt; rider.x += rider.vx*dt; rider.y += rider.vy*dt; rider.ang += rider.av*dt;
      const floor = gy(rider.x) + 0.18;
      if (rider.y < floor){
        rider.y = floor;
        if (Math.abs(rider.vy) > 1.2){ sfx.thud(); shake = Math.max(shake, 0.5); }
        rider.vy = -rider.vy*0.3; rider.vx *= 0.55; rider.av *= 0.5;
        if (Math.abs(rider.vy) < 0.5) rider.vy = 0;
      }
    }
    if (crashT > 1.1 && !overReady){ overReady = true; elOver.classList.remove('hidden'); }
  }
  shake = Math.max(0, shake - dt*2.5);
  camX += (x - camX)*Math.min(1, dt*8);
  camY += (gy(x) - camY)*Math.min(1, dt*4);
}

// ---------- Dessin ----------
const sx = wx => BIKEX + (wx - camX)*S;
const sy = wy => GROUND - (wy - camY)*S;

function drawBackground(){
  g.fillStyle = mode === 'hard' ? '#d6d0cc' : '#d3d3d3'; g.fillRect(0, 0, W, H);
  // collines lointaines (parallaxe)
  const by = camY*S*0.15;
  g.save(); g.translate(0, by);
  g.fillStyle = '#c7c7c7';
  g.beginPath(); g.moveTo(0, H);
  for (let px = 0; px <= W + 10; px += 10){
    const wx = (px - BIKEX)/S + camX*0.25;
    g.lineTo(px, GROUND - S*(1.6 + 0.7*Math.sin(wx*0.13) + 0.4*Math.sin(wx*0.31 + 1)));
  }
  g.lineTo(W, H); g.closePath(); g.fill();
  g.fillStyle = '#bdbdbd';
  g.beginPath(); g.moveTo(0, H);
  for (let px = 0; px <= W + 10; px += 10){
    const wx = (px - BIKEX)/S + camX*0.5;
    g.lineTo(px, GROUND - S*(0.7 + 0.35*Math.sin(wx*0.22 + 2) + 0.25*Math.sin(wx*0.53)));
  }
  g.lineTo(W, H); g.closePath(); g.fill();
  g.restore();
}

function drawMarkers(){
  const x0 = camX - BIKEX/S - 2, x1 = camX + (W - BIKEX)/S + 2;
  // record
  if (best > 0 && best > x0 - 3 && best < x1 + 3){
    const px = sx(best);
    g.save(); g.fillStyle = 'rgba(226,59,59,0.32)';
    const G0 = sy(gy(best));
    g.beginPath(); g.moveTo(px - 18, G0); g.lineTo(px + 18, G0);
    g.lineTo(px + 18 + G0*0.55, 0); g.lineTo(px - 18 + G0*0.55, 0); g.closePath(); g.fill();
    g.restore();
    g.save(); g.translate(px + G0*0.55*0.62, G0*0.38); g.rotate(-Math.atan2(G0, G0*0.55));
    g.fillStyle = 'rgba(30,30,30,0.85)'; g.font = `800 ${Math.round(S*0.36)}px system-ui,sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('RECORD ' + fmt(best) + ' m', 0, 0); g.restore();
  }
  // lignes tous les 10 m + ligne de départ
  g.save(); g.setLineDash([S*0.12, S*0.12]); g.lineWidth = Math.max(3, S*0.07);
  const first = Math.max(0, Math.floor(x0/10)*10);
  for (let m = first; m <= x1; m += 10){
    const px = sx(m);
    g.strokeStyle = m === 0 ? 'rgba(100,100,255,0.9)' : 'rgba(100,100,255,0.55)';
    g.beginPath(); g.moveTo(px, sy(gy(m))); g.lineTo(px, 0); g.stroke();
    g.fillStyle = '#1d1d1d'; g.textBaseline = 'top';
    if (m === 0){
      g.font = `500 ${Math.round(S*0.36)}px system-ui,sans-serif`;
      g.fillText('maintiens pour', px + S*0.15, H*0.18);
      g.fillText('lever la roue', px + S*0.15, H*0.18 + S*0.42);
    } else {
      g.font = `700 ${Math.round(S*0.34)}px system-ui,sans-serif`;
      g.fillText(m + ' m', px + S*0.12, H*0.18);
    }
  }
  g.restore();
}

function drawGround(){
  const x0 = Math.floor(camX - BIKEX/S - 1), x1 = Math.ceil(camX + (W - BIKEX)/S + 1);
  for (let m = x0; m < x1; m++){
    g.fillStyle = (m & 1) ? '#ff6b6b' : '#ff4646';
    g.beginPath(); g.moveTo(sx(m), H);
    for (let k = 0; k <= 10; k++){ const wx = m + k/10; g.lineTo(sx(wx), sy(gy(wx))); }
    g.lineTo(sx(m + 1), H); g.closePath(); g.fill();
  }
  // liseré
  g.strokeStyle = 'rgba(150,20,20,0.35)'; g.lineWidth = 2; g.beginPath();
  for (let wx = x0; wx <= x1; wx += 0.1){ const px = sx(wx), py = sy(gy(wx)); wx === x0 ? g.moveTo(px, py) : g.lineTo(px, py); }
  g.stroke();
}

function ik(ax, ay, bx, by, l1, l2, sign){
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  d = Math.max(Math.abs(l1 - l2) + 1e-4, Math.min(l1 + l2 - 1e-4, d));
  const base = Math.atan2(dy, dx), a = Math.acos((l1*l1 + d*d - l2*l2)/(2*l1*d));
  const ang = base + sign*a;
  return [ax + l1*Math.cos(ang), ay + l1*Math.sin(ang)];
}
function line(pts, w, col){
  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i+1]);
  g.stroke();
}
function wheel(cx, cy, ang){
  g.strokeStyle = '#000'; g.lineWidth = 0.065; g.beginPath(); g.arc(cx, cy, R - 0.03, 0, Math.PI*2); g.stroke();
  g.lineWidth = 0.012; g.strokeStyle = '#222';
  for (let i = 0; i < 8; i++){
    const a = ang + i*Math.PI/4;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a)*(R - 0.06), cy + Math.sin(a)*(R - 0.06)); g.stroke();
  }
  g.fillStyle = '#000'; g.beginPath(); g.arc(cx, cy, 0.04, 0, Math.PI*2); g.fill();
}
function head(hx, hy, a){
  g.fillStyle = '#000'; g.beginPath(); g.arc(hx, hy, 0.15, 0, Math.PI*2); g.fill();
  g.save(); g.translate(hx, hy); g.rotate(a);
  g.fillStyle = '#2a2a2a'; g.beginPath(); g.arc(0.01, 0.02, 0.17, -0.2, Math.PI + 0.25); g.closePath(); g.fill();
  g.fillStyle = '#555'; g.fillRect(0.06, 0.0, 0.13, 0.03);
  g.restore();
}

function drawBike(){
  const ay = gy(x) + R;
  g.save();
  const shx = (Math.random() - 0.5)*shake*14, shy = (Math.random() - 0.5)*shake*14;
  g.translate(sx(x) + shx, sy(ay) + shy); g.scale(S, -S); g.rotate(th);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const wa = -x/R, ca = -x/0.95;
  const BB = [0.42, 0.02], hipL = [0.28, 0.56];
  const p1 = [BB[0] + 0.17*Math.cos(ca), BB[1] + 0.17*Math.sin(ca)];
  const p2 = [BB[0] - 0.17*Math.cos(ca), BB[1] - 0.17*Math.sin(ca)];
  const attached = !rider;
  const lean = Math.min(th, 1.4)*0.18;
  const sh = [0.40 + lean, 1.10], hand = [0.76, 0.66];
  // jambe & bras arrière (gris)
  if (attached){
    const k2 = ik(hipL[0], hipL[1], p2[0], p2[1], 0.47, 0.47, 1);
    line([hipL[0], hipL[1], k2[0], k2[1], p2[0], p2[1]], 0.07, '#4a4a4a');
    const e2 = ik(sh[0], sh[1], hand[0] - 0.02, hand[1], 0.33, 0.33, -1);
    line([sh[0] - 0.02, sh[1], e2[0] - 0.02, e2[1], hand[0] - 0.03, hand[1]], 0.06, '#4a4a4a');
  }
  // roues
  wheel(0, 0, wa); wheel(WB, 0, wa);
  // cadre
  const fc = '#4d4d4d';
  line([0, 0, BB[0], BB[1], 0.86, 0.44], 0.05, fc);
  line([0, 0, 0.30, 0.46, BB[0], BB[1]], 0.045, fc);
  line([0.30, 0.46, 0.84, 0.48], 0.045, fc);
  line([0.86, 0.44, 0.90, 0.30, WB, 0], 0.045, fc);
  line([0.85, 0.46, 0.82, 0.64, 0.74, 0.68], 0.045, '#333');
  line([0.20, 0.50, 0.38, 0.52], 0.07, '#111');                           // selle
  line([p1[0], p1[1], p2[0], p2[1]], 0.035, '#222');                      // manivelles
  line([p1[0] - 0.06, p1[1], p1[0] + 0.06, p1[1]], 0.035, '#111');
  g.fillStyle = '#333'; g.beginPath(); g.arc(BB[0], BB[1], 0.07, 0, Math.PI*2); g.fill();
  // cycliste
  if (attached){
    line([hipL[0], hipL[1], sh[0], sh[1]], 0.085, '#000');
    const k1 = ik(hipL[0], hipL[1], p1[0], p1[1], 0.47, 0.47, 1);
    line([hipL[0], hipL[1], k1[0], k1[1], p1[0], p1[1]], 0.08, '#000');
    const e1 = ik(sh[0], sh[1], hand[0], hand[1], 0.33, 0.33, -1);
    line([sh[0], sh[1], e1[0], e1[1], hand[0], hand[1]], 0.07, '#000');
    head(sh[0] + 0.07, sh[1] + 0.25, -th*0.5);
  }
  g.restore();
}

function drawRider(){
  if (!rider) return;
  g.save(); g.translate(sx(rider.x), sy(rider.y)); g.scale(S, -S); g.rotate(rider.ang);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const f = rider.vy !== 0 || Math.abs(rider.vx) > 0.3 ? Math.sin(time*18)*0.15 : 0;
  line([0, 0, 0.35, 0.15 + f, 0.25, -0.3], 0.07, '#4a4a4a');
  line([0.12, 0.52, 0.0, 0.25 - f, 0.25, 0.1], 0.06, '#4a4a4a');
  line([0, 0, 0.12, 0.54], 0.085, '#000');
  line([0, 0, 0.30, -0.25 - f, 0.55, -0.15], 0.08, '#000');
  line([0.12, 0.54, 0.38, 0.40 + f, 0.55, 0.60], 0.07, '#000');
  head(0.18, 0.79, 0);
  g.restore();
}

function drawGauge(){
  // jauge d'inclinaison
  const r = Math.max(34, S*0.62), cx = 22 + r, cy = H - 18;
  g.save(); g.lineCap = 'butt';
  const zone = (a0, a1, col) => { g.strokeStyle = col; g.lineWidth = r*0.22; g.beginPath();
    g.arc(cx, cy, r, -a1, -a0); g.stroke(); };
  const k = 1;
  zone(0, 0.14, '#e23b3b'); zone(0.14, 1.45, '#7bc47f'); zone(1.45, 1.75, '#e23b3b');
  const a = Math.max(0, Math.min(1.75, th))*k;
  g.strokeStyle = '#111'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a)*r*1.1, cy - Math.sin(a)*r*1.1); g.stroke();
  g.fillStyle = '#111'; g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI*2); g.fill();
  g.fillStyle = '#333'; g.font = `700 13px system-ui,sans-serif`; g.textAlign = 'left';
  g.fillText(Math.round(th*180/Math.PI) + '°', cx + r*0.35, cy - 4);
  g.restore();
}

function render(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawMarkers();
  drawGround();
  drawBike();
  drawRider();
  if (phase === 'run') drawGauge();
  const d = phase === 'crash' ? crashDist : Math.max(0, x);
  elDist.innerHTML = fmt(d) + '<small>m</small>';
}

// ---------- Boucle ----------
let last = performance.now(), acc = 0;
const DT = 1/120;
function frame(t){
  let dt = Math.min(0.05, (t - last)/1000); last = t; acc += dt;
  while (acc >= DT){ step_(DT); acc -= DT; }
  if (AC && rollG){
    const target = phase === 'run' ? 0.05 + v*0.012 : (phase === 'crash' ? v*0.01 : 0);
    rollG.gain.setTargetAtTime(target, AC.currentTime, 0.1);
    rollF.frequency.setTargetAtTime(200 + v*35, AC.currentTime, 0.1);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
