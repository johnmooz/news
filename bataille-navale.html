<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bataille navale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#061426;--panel:#0d2541;--panel2:#123155;--line:#1e4a74;--txt:#e7f2ff;--mut:#8eadcc;
  --acc:#38bdf8;--acc2:#0ea5e9;--hit:#ef4444;--miss:#cfe0f2;--ok:#22c55e;--warn:#f59e0b;
  --water:#0b3a63;--water2:#0e4675;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(1100px 600px at 15% -10%,#124677 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#0b3d5c 0,transparent 55%),linear-gradient(#061426,#030c18);}
button{font-family:inherit;font-size:14px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--acc);background:#16406b}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#38bdf8,#0284c7);border-color:#38bdf8;color:#04121f;font-weight:700}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(180deg,#38bdf8,#0284c7)}
button.big{font-size:17px;padding:13px 22px;width:100%}
input{font-family:inherit;font-size:15px;color:var(--txt);background:#071d33;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:0}
input[type=number]{width:74px;text-align:center}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.card{background:rgba(13,37,65,.88);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:.5px}
h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:600}
h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--mut);margin:0 0 18px}
.setup{max-width:760px;margin:24px auto}
.sec{margin:18px 0}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg button{text-align:left;padding:12px 14px}
.seg button b{display:block;font-size:16px}
.seg button span{color:var(--mut);font-size:13px}
.seg button.on{border-color:var(--acc);background:#134a7a;box-shadow:0 0 0 2px rgba(56,189,248,.25) inset}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.field label{font-size:13px;color:var(--mut)}
.fleet{display:grid;gap:8px}
.fl{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:12px;background:#0a2038;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fl .nm b{display:block}
.fl .nm span{font-size:12px;color:var(--mut)}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:34px;height:34px;padding:0;font-size:18px}
.ctr input{width:56px}
.shape{display:inline-grid;gap:2px}
.shape i{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.t0{--tc:#2dd4bf}.t1{--tc:#60a5fa}.t2{--tc:#a78bfa}.t3{--tc:#fb923c}.t4{--tc:#f472b6}
#summary{margin:14px 0 8px;color:var(--mut);font-size:14px}
.err{color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:10px 12px;margin:10px 0}
.info{color:#bae6fd;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);border-radius:10px;padding:10px 12px;margin:10px 0}
.hint{color:var(--mut);font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top .ttl{font-weight:800;font-size:22px}
.top .ttl small{font-weight:500;color:var(--mut);font-size:14px;margin-left:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;background:#03101e;border:1px dashed var(--acc);padding:4px 10px;border-radius:8px;color:#7dd3fc}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.banner.go{border-color:var(--ok);background:rgba(34,197,94,.12)}
.banner.wait{border-color:var(--warn);background:rgba(245,158,11,.1)}
.banner.big{flex-direction:column;text-align:center;padding:22px}
.banner.big .t{font-size:22px;font-weight:700}

.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.side{background:rgba(13,37,65,.85);border:1px solid var(--line);border-radius:16px;padding:14px}
.side.target{border-color:var(--acc);box-shadow:0 0 0 2px rgba(56,189,248,.25),0 10px 30px rgba(0,0,0,.3)}
.side header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.side header .n{font-weight:700;font-size:18px}
.side header .tag{font-size:12px;padding:3px 8px;border-radius:99px;background:#0a2038;border:1px solid var(--line);color:var(--mut);margin-left:6px;vertical-align:middle}
.side header .tag.t{border-color:var(--acc);color:#7dd3fc}
.score{font-size:15px;color:var(--mut)}
.score b{font-size:22px;color:var(--txt)}
.bwrap{overflow:auto;display:flex;justify-content:center;padding:4px 0}
.board{display:grid;grid-template-columns:calc(var(--cell) * .9) repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:2px;user-select:none;-webkit-user-select:none}
.board .lab{display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .38);color:var(--mut);font-weight:500}
.c{background:var(--water);border-radius:3px;position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .5);line-height:1}
.c:nth-child(odd){background:var(--water2)}
.c.ship{background:var(--tc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.c.miss::after{content:'';width:32%;height:32%;border-radius:50%;background:var(--miss);opacity:.85}
.c.hit{background:#7f1d1d}
.c.ship.hit{background:linear-gradient(135deg,var(--tc),#7f1d1d)}
.c.hit::after{content:'✕';color:#fff;font-weight:800;text-shadow:0 0 6px #ef4444}
.c.sunk{background:color-mix(in srgb,var(--tc) 45%,#111);box-shadow:inset 0 0 0 2px var(--tc)}
.c.sunk::after{content:'✕';color:#fff;font-weight:800}
.c.pend::after{content:'…';color:#7dd3fc}
.c.last{outline:2px solid #facc15;outline-offset:-1px;z-index:1}
.c.aim{cursor:crosshair}
.c.aim:hover{background:#1d6aa8;box-shadow:inset 0 0 0 2px var(--acc)}
.c.pv{background:color-mix(in srgb,var(--tc) 70%,#fff)!important}
.c.pvbad{background:#b91c1c!important}
.board.placing .c{cursor:pointer}
.rem{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.rem .it{display:flex;align-items:center;gap:6px;font-size:13px;background:#0a2038;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.rem .it.zero{opacity:.4;text-decoration:line-through}
.rem .it .shape i{width:8px;height:8px;border-radius:2px}
.stats{font-size:13px;color:var(--mut);margin-top:8px}

.placewrap{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
@media (max-width:820px){.placewrap{grid-template-columns:1fr}}
.palette{display:flex;flex-direction:column;gap:8px}
.palette .pi{display:flex;align-items:center;gap:10px;text-align:left}
.palette .pi.on{border-color:var(--acc);background:#134a7a}
.palette .pi .cnt{margin-left:auto;font-weight:700}
.palette .pi .shape i{width:9px;height:9px}
.logbox{margin-top:16px;font-size:14px;color:var(--mut)}
.logbox div{padding:4px 0;border-bottom:1px solid rgba(30,74,116,.5)}
.logbox div:first-child{color:var(--txt)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ---------- Données ---------- */
const TYPES=[
  {id:'petit',name:'Petit bateau',w:2,h:1},
  {id:'moyen',name:'Bateau moyen',w:3,h:1},
  {id:'sous', name:'Sous-marin',  w:5,h:1},
  {id:'porte',name:'Porte-avions',w:5,h:2},
  {id:'plat', name:'Plateforme',  w:2,h:2},
];
const cfg={mode:'solo',net:'host',code:'',W:10,H:10,counts:[2,2,1,1,1],names:['Joueur 1','Joueur 2']};
let S=null;           // état de la partie
const NET={};         // état réseau

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rowLabel=y=>String.fromCharCode(65+y);
const coord=c=>rowLabel(Math.floor(c/S.W))+(c%S.W+1);
const enc=c=>c.toString(36).padStart(2,'0');
const dec2=s=>parseInt(s,36);
const decList=s=>{s=String(s||'');const r=[];for(let i=0;i+1<s.length;i+=2)r.push(dec2(s.substr(i,2)));return r};
const rnd=n=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=a[Math.random()*a.length|0];return s};
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g,'').trim().slice(0,20);
const shapeHTML=(t,rot)=>{const T=TYPES[t];const w=rot?T.h:T.w,h=rot?T.w:T.h;return `<span class="shape t${t}" style="grid-template-columns:repeat(${w},auto)">${'<i></i>'.repeat(w*h)}</span>`};
const plural=(n,s)=>n+' '+s+(n>1?'s':'');

/* ---------- Logique de jeu ---------- */
function newPlayer(name,isAI){const n=S.W*S.H;return{name,isAI:!!isAI,ships:[],occ:new Int16Array(n).fill(-1),shots:new Map(),sunkT:new Map(),rem:S.counts.slice(),ready:false}}
function dims(t,rot){const T=TYPES[t];return rot?[T.h,T.w]:[T.w,T.h]}
function cellsAt(t,rot,a){const [w,h]=dims(t,rot);const x0=a%S.W,y0=Math.floor(a/S.W);if(x0+w>S.W||y0+h>S.H)return null;const r=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)r.push((y0+y)*S.W+x0+x);return r}
const free=(P,cs)=>cs.every(c=>P.occ[c]<0);
function addShip(P,t,cells){const i=P.ships.length;P.ships.push({t,cells,hits:0,sunk:false});cells.forEach(c=>P.occ[c]=i)}
function removeShip(P,i){P.ships.splice(i,1);P.occ.fill(-1);P.ships.forEach((s,j)=>s.cells.forEach(c=>P.occ[c]=j))}
function placedCount(P,t){return P.ships.filter(s=>s.t===t).length}
function remainingToPlace(P,t){return S.counts[t]-placedCount(P,t)}
function randomFleet(P,counts){
  const list=[];counts.forEach((n,t)=>{for(let k=0;k<n;k++)list.push(t)});
  list.sort((a,b)=>TYPES[b].w*TYPES[b].h-TYPES[a].w*TYPES[a].h);
  for(let attempt=0;attempt<150;attempt++){
    P.ships=[];P.occ.fill(-1);let ok=true;
    for(const t of list){
      const opts=[];
      for(let rot=0;rot<2;rot++){if(rot&&TYPES[t].w===TYPES[t].h)continue;for(let a=0;a<S.W*S.H;a++){const cs=cellsAt(t,rot,a);if(cs&&free(P,cs))opts.push(cs)}}
      if(!opts.length){ok=false;break}
      addShip(P,t,opts[Math.random()*opts.length|0]);
    }
    if(ok)return true;
  }
  P.ships=[];P.occ.fill(-1);return false;
}
function resolveShot(P,c){
  if(P.shots.has(c))return null;
  const si=P.occ[c];
  if(si<0){P.shots.set(c,'m');return{r:'m'}}
  P.shots.set(c,'h');const sh=P.ships[si];sh.hits++;
  if(sh.hits===sh.cells.length){sh.sunk=true;sh.cells.forEach(x=>P.sunkT.set(x,sh.t));P.rem[sh.t]--;return{r:'h',sunk:sh.t,cells:sh.cells}}
  return{r:'h'};
}
const allSunk=P=>P.rem.every(x=>x<=0);
function shotStats(target){let h=0,m=0;for(const v of target.shots.values()){if(v==='h')h++;else if(v==='m')m++}return{h,m,score:h*20-m*5}}
function describe(name,c,res){return `${esc(name)} tire en <b>${coord(c)}</b> : ${res.r==='m'?'à l’eau 💧':'touché 💥'}${res.sunk!=null?` — <b>${TYPES[res.sunk].name} coulé !</b>`:''}`}
function log(html){if(!S)return;S.log.unshift(html);if(S.log.length>40)S.log.length=40}

/* IA : carte de probabilités (chasse puis ciblage autour des touches) */
function aiPick(T){
  const N=S.W*S.H,heat=new Float64Array(N);
  const open=new Set();for(const [c,v] of T.shots)if(v==='h'&&!T.sunkT.has(c))open.add(c);
  const blocked=c=>T.shots.get(c)==='m'||T.sunkT.has(c);
  T.rem.forEach((n,t)=>{if(n<=0)return;
    for(let rot=0;rot<2;rot++){if(rot&&TYPES[t].w===TYPES[t].h)continue;
      for(let a=0;a<N;a++){const cs=cellsAt(t,rot,a);if(!cs||cs.some(blocked))continue;
        let k=0;for(const c of cs)if(open.has(c))k++;
        const w=open.size?(k?Math.pow(8,k):0):1;if(!w)continue;
        for(const c of cs)if(!T.shots.has(c))heat[c]+=w*n;}}});
  let best=-1,list=[];
  for(let c=0;c<N;c++){if(T.shots.has(c))continue;if(heat[c]>best){best=heat[c];list=[c]}else if(heat[c]===best)list.push(c)}
  return list[Math.random()*list.length|0];
}

/* ---------- Démarrage ---------- */
function setupCheck(){
  const W=cfg.W,H=cfg.H;
  if(!(Number.isInteger(W)&&Number.isInteger(H)&&W>=2&&W<=25&&H>=2&&H<=25))return{err:'La grille doit faire entre 2 et 25 cases de haut et de large.'};
  const total=cfg.counts.reduce((a,b)=>a+b,0);
  if(!total)return{err:'Choisissez au moins un élément.'};
  let area=0;
  for(let t=0;t<TYPES.length;t++){const n=cfg.counts[t];if(!n)continue;const T=TYPES[t];
    if(!((T.w<=W&&T.h<=H)||(T.h<=W&&T.w<=H)))return{err:`${T.name} (${T.w}×${T.h}) ne rentre pas dans une grille de ${H}×${W}.`};
    area+=n*T.w*T.h;}
  if(area>W*H)return{err:`La flotte occupe ${area} cases alors que la grille n’en a que ${W*H}.`};
  return{area,total};
}
function baseState(mode,W,H,counts){return{mode,W,H,counts:counts.slice(),phase:'place',cur:0,players:[],pl:{pi:0,sel:-1,rot:0},handoff:null,winner:null,shotDone:false,aiBusy:false,last:null,log:[],quitArm:false}}
function startGame(){
  const chk=setupCheck();if(chk.err){showErr(chk.err);return}
  S=baseState(cfg.mode,cfg.W,cfg.H,cfg.counts);
  const n0=cleanName(cfg.names[0])||(cfg.mode==='solo'?'Vous':'Joueur 1');
  const n1=cleanName(cfg.names[1])||'Joueur 2';
  if(cfg.mode==='solo'){
    S.players=[newPlayer(n0),newPlayer('IA',true)];
    if(!randomFleet(S.players[1],S.counts)){S=null;showErr('Impossible de placer toute la flotte sur cette grille : réduisez le nombre d’éléments ou agrandissez la grille.');return}
    S.players[1].ready=true;
  }else{
    S.players=[newPlayer(n0),newPlayer(n1)];
    const test=newPlayer('');if(!randomFleet(test,S.counts)){S=null;showErr('Impossible de placer toute la flotte sur cette grille : réduisez le nombre d’éléments ou agrandissez la grille.');return}
  }
  autoSel();render();
}
function autoSel(){const P=S.players[S.pl.pi];if(S.pl.sel>=0&&remainingToPlace(P,S.pl.sel)>0)return;S.pl.sel=-1;for(let t=0;t<TYPES.length;t++)if(remainingToPlace(P,t)>0){S.pl.sel=t;break}}
function showErr(m){const e=$('#err');if(e)e.innerHTML=m?`<div class="err">${m}</div>`:'';}

/* ---------- Placement ---------- */
function validatePlacement(){
  const P=S.players[S.pl.pi];
  if(TYPES.some((_,t)=>remainingToPlace(P,t)>0))return;
  P.ready=true;P.rem=S.counts.slice();
  if(S.mode==='solo'){S.phase='play';S.cur=0;log('La partie commence. À vous de tirer !')}
  else if(S.mode==='local'){S.phase='handoff';S.handoff=S.pl.pi===0?{pi:1,kind:'place'}:{pi:0,kind:'play'};if(S.pl.pi===1)log('La partie commence !')}
  else{S.phase='play';pushPresence();netSync();return}
  render();
}

/* ---------- Tirs ---------- */
function cellClick(bi,c){
  if(!S)return;
  if(S.phase==='place'){placeClick(c);return}
  if(S.phase!=='play')return;
  if(!viewRules(bi).target)return;
  if(S.mode==='net'){fireNet(c);return}
  fireLocal(c);
}
function placeClick(c){
  const P=S.players[S.pl.pi];
  if(P.occ[c]>=0){const sh=P.ships[P.occ[c]];S.pl.sel=sh.t;
    const [w]=dims(sh.t,0);const x0=Math.min(...sh.cells.map(x=>x%S.W)),x1=Math.max(...sh.cells.map(x=>x%S.W));
    S.pl.rot=(x1-x0+1)===w?0:1;removeShip(P,P.occ[c]);render();return}
  const t=S.pl.sel;if(t<0||remainingToPlace(P,t)<=0)return;
  const cs=cellsAt(t,S.pl.rot,c);if(!cs||!free(P,cs))return;
  addShip(P,t,cs);autoSel();render();
}
function fireLocal(c){
  const sh=S.cur,T=S.players[1-sh];
  const res=resolveShot(T,c);if(!res)return;
  S.last={b:1-sh,c};log(describe(S.players[sh].name,c,res));
  if(allSunk(T)){S.phase='over';S.winner=sh;render();return}
  if(S.mode==='local'){S.shotDone=true;render();return}
  S.cur=1;S.aiBusy=true;render();
  const g=S;
  setTimeout(()=>{
    if(S!==g||S.phase!=='play')return;
    const me=S.players[0],c2=aiPick(me),r2=resolveShot(me,c2);
    S.last={b:0,c:c2};log(describe('IA',c2,r2));
    S.aiBusy=false;S.cur=0;
    if(allSunk(me)){S.phase='over';S.winner=1}
    render();
  },650);
}
function viewRules(bi){
  if(S.phase==='over')return{show:S.mode!=='net'||bi===0,target:false};
  if(S.mode==='solo')return{show:bi===0,target:S.phase==='play'&&bi===1&&S.cur===0&&!S.aiBusy};
  if(S.mode==='local'){const pl=S.phase==='play';return{show:pl&&S.cur===bi,target:pl&&!S.shotDone&&bi!==S.cur}}
  return{show:bi===0,target:bi===1&&netMyTurn()};
}

/* ---------- Réseau (salle en direct de la page) ---------- */
let roomP=null;
function getRoom(){if(!roomP){try{roomP=(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use('room')).catch(()=>null):Promise.resolve(null)}catch(e){roomP=Promise.resolve(null)}}return roomP}
setTimeout(getRoom,0);

async function netStart(){
  const btn=$('[data-act=start]');
  const isHost=cfg.net==='host';
  let chk=null;
  if(isHost){chk=setupCheck();if(chk.err){showErr(chk.err);return}}
  let code=isHost?rnd(5):String(cfg.code||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!isHost&&code.length<3){showErr('Entrez le code donné par l’hôte.');return}
  if(btn){btn.disabled=true;btn.textContent='Connexion…'}
  const room=await getRoom();
  if(!room){if(btn){btn.disabled=false;btn.textContent='Réessayer'}showErr('Le mode réseau n’est pas disponible ici. Ouvrez la page depuis son lien claude.ai (partagé avec l’autre joueur), puis réessayez.');return}
  let nr;
  try{nr=await room.join('bn-'+code)}catch(e){if(btn){btn.disabled=false;btn.textContent='Réessayer'}showErr('Connexion impossible ('+esc(e&&e.code||e)+').');return}
  Object.assign(NET,{room,nr,role:isHost?'host':'guest',code,gp:null,gid:null,peer:null,opp:null,oppGone:false,hostSeen:false,
    name:cleanName(cfg.names[0])||(isHost?'Hôte':'Invité'),myShots:[],myAns:'',myK:[],oppShots:[],oppReady:false,logged:0,kCount:0});
  NET.unsub=nr.onPeers(()=>netSync(),err=>{if(S&&S.mode==='net'){log('⚠️ Connexion perdue ('+esc(err&&err.code)+').');render()}});
  if(isHost){NET.gid=rnd(8);initNetGame(cfg.W,cfg.H,cfg.counts);}
  else{
    S=baseState('net',10,10,[0,0,0,0,0]);S.phase='lobby';
    const g=S;setTimeout(()=>{if(S===g&&S.phase==='lobby'){S.lobbyFail=true;render()}},9000);
  }
  pushPresence();render();
}
function initNetGame(W,H,counts){
  const keepLog=S&&S.mode==='net'?S.log:[];
  S=baseState('net',W,H,counts);S.log=keepLog;
  S.players=[newPlayer(NET.name),newPlayer(NET.oppNameCache||'Adversaire')];
  Object.assign(NET,{myShots:[],myAns:'',myK:[],oppShots:[],oppReady:false,logged:0,kCount:0});
  autoSel();
}
function pushPresence(){
  if(!NET.nr)return;
  const me=S&&S.players&&S.players[0];
  const p={app:'bn1',role:NET.role,gid:NET.gid||'',nm:NET.name,ready:!!(me&&me.ready),
    s:NET.myShots.map(enc).join(''),a:NET.myAns,k:NET.myK.join('|'),r:me?me.rem.slice():[]};
  if(NET.role==='host'&&S){p.cfg={W:S.W,H:S.H,c:S.counts.slice()};p.gp=NET.gp||null}
  NET.nr.presence(p).catch(e=>console.warn('presence',e));
}
function validCfg(c){return c&&Number.isInteger(c.W)&&Number.isInteger(c.H)&&c.W>=2&&c.W<=25&&c.H>=2&&c.H<=25&&Array.isArray(c.c)&&c.c.length===5&&c.c.every(n=>Number.isInteger(n)&&n>=0&&n<=30)}
function netSync(){
  if(!NET.nr||!S||S.mode!=='net')return;
  const peers=NET.nr.peers();
  const mine=peers.find(p=>p.sameTab);if(mine)NET.peer=mine.peer;
  const others=peers.filter(p=>!p.sameTab&&p.kind==='viewer'&&p.presence&&p.presence.app==='bn1');
  let opp=null;
  if(NET.role==='host'){
    const guests=others.filter(p=>p.presence.role==='guest');
    if(NET.gp){opp=guests.find(g=>g.peer===NET.gp)||null;
      if(!opp&&!NET.oppGone){NET.oppGone=true;log('⚠️ L’adversaire a quitté la partie.')}}
    else if(guests.length){opp=guests[0];NET.gp=opp.peer;NET.oppGone=false;log('Un adversaire a rejoint la partie.');pushPresence()}
  }else{
    const host=others.find(p=>p.presence.role==='host');
    if(!host){if(NET.hostSeen&&!NET.oppGone){NET.oppGone=true;log('⚠️ L’hôte a quitté la partie.')}NET.opp=null;render();return}
    NET.hostSeen=true;NET.oppGone=false;
    const hp=host.presence;
    if(hp.gp&&NET.peer&&hp.gp!==NET.peer){S.phase='full';render();return}
    if(!validCfg(hp.cfg)){render();return}
    if(String(hp.gid||'')!==NET.gid){
      NET.gid=String(hp.gid||'');NET.oppNameCache=cleanName(hp.nm)||'Hôte';
      initNetGame(hp.cfg.W,hp.cfg.H,hp.cfg.c);
      log(`Connecté à la partie de ${esc(NET.oppNameCache)}. Placez vos éléments.`);
      pushPresence();
    }
    opp=host;
  }
  NET.opp=opp;
  if(!S.players){render();return}
  if(!opp||String(opp.presence.gid||'')!==NET.gid){NET.oppReady=false;render();return}
  const op=opp.presence,me=S.players[0],O=S.players[1];
  O.name=NET.oppNameCache=cleanName(op.nm)||'Adversaire';
  NET.oppReady=!!op.ready;
  // Répondre aux tirs adverses
  const shots=decList(op.s);let changed=false;
  if(me.ready){
    for(let i=NET.myAns.length;i<shots.length;i++){
      const c=shots[i];const r=(c>=0&&c<S.W*S.H)?resolveShot(me,c):null;
      changed=true;
      if(!r){NET.myAns+='m';continue}
      NET.myAns+=r.r;if(r.sunk!=null)NET.myK.push(r.sunk.toString(36)+r.cells.map(enc).join(''));
      S.last={b:0,c};log(describe(O.name,c,r));
    }
  }
  NET.oppShots=shots;
  if(changed)pushPresence();
  // Vue de la flotte adverse
  const ans=String(op.a||'');
  O.shots=new Map();NET.myShots.forEach((c,i)=>O.shots.set(c,ans[i]==='h'?'h':ans[i]==='m'?'m':'?'));
  O.sunkT=new Map();
  const segs=String(op.k||'').split('|').filter(Boolean);
  segs.forEach(seg=>{const t=parseInt(seg[0],36);if(!(t>=0&&t<5))return;for(let j=1;j+1<seg.length;j+=2)O.sunkT.set(dec2(seg.substr(j,2)),t)});
  if(Array.isArray(op.r)&&op.r.length===5)O.rem=op.r.map(x=>Math.max(0,x|0));
  for(let i=NET.logged;i<Math.min(ans.length,NET.myShots.length);i++){
    const c=NET.myShots[i];S.last={b:1,c};
    log(`${esc(me.name)} tire en <b>${coord(c)}</b> : ${ans[i]==='h'?'touché 💥':'à l’eau 💧'}`);NET.logged=i+1;
  }
  for(let k=NET.kCount;k<segs.length;k++){const t=parseInt(segs[k][0],36);if(t>=0&&t<5)log(`<b>${TYPES[t].name} adverse coulé !</b>`)}
  NET.kCount=segs.length;
  if(S.phase==='play'&&me.ready&&NET.oppReady){
    if(allSunk(me)){S.phase='over';S.winner=1}
    else if(O.rem.every(x=>x===0)){S.phase='over';S.winner=0}
  }
  render();
}
function netMyTurn(){
  if(!S||S.mode!=='net'||S.phase!=='play'||!NET.opp)return false;
  const me=S.players[0];if(!me.ready||!NET.oppReady)return false;
  const mine=NET.myShots.length,theirs=NET.oppShots.length;
  if(String(NET.opp.presence.a||'').length<mine)return false;
  return NET.role==='host'?mine===theirs:mine+1===theirs;
}
function fireNet(c){
  if(!netMyTurn())return;const O=S.players[1];if(O.shots.has(c))return;
  NET.myShots.push(c);O.shots.set(c,'?');S.last={b:1,c};pushPresence();render();
}
function netNewGame(){
  if(NET.role!=='host')return;
  NET.gid=rnd(8);if(NET.oppGone){NET.gp=null;NET.oppGone=false}
  initNetGame(S.W,S.H,S.counts);log('Nouvelle partie : placez vos éléments.');pushPresence();netSync();render();
}
function netLeave(){
  try{NET.unsub&&NET.unsub()}catch(e){}
  try{NET.nr&&NET.nr.leave()}catch(e){}
  for(const k in NET)delete NET[k];
}

function cellSize(two){

  per-=30;
  return clamp(Math.floor(per/(S.W+0.9))-2,12,44);

function boardHTML(bi,o){
  const P=S.players[bi],W=S.W,H=S.H;
  let h=`<div class="board${o.placing?' placing':''}" data-board="${bi}" style="--cols:${W};--cell:${o.cell}px"><div class="lab"></div>`;
  for(let x=0;x<W;x++)h+=`<div class="lab">${x+1}</div>`;
  for(let y=0;y<H;y++){
    h+=`<div class="lab">${rowLabel(y)}</div>`;
    for(let x=0;x<W;x++){
      const c=y*W+x,cls=['c'];
      const shot=P.shots.get(c);
      const st=P.sunkT.get(c);
      if(st!=null)cls.push('sunk','t'+st);
      else{
        if(o.show&&P.occ[c]>=0)cls.push('ship','t'+P.ships[P.occ[c]].t);
        if(shot==='h')cls.push('hit');else if(shot==='m')cls.push('miss');else if(shot==='?')cls.push('pend');
      }
      if(o.target&&!P.shots.has(c))cls.push('aim');
      if(S.last&&S.last.b===bi&&S.last.c===c)cls.push('last');
      h+=`<div class="${cls.join(' ')}" data-b="${bi}" data-i="${c}" title="${rowLabel(y)}${x+1}"></div>`;
    }
  }
  return h+'</div>';

/* ---------- Événements ---------- */
function act(a,el){
  const t=el.dataset.t!=null?+el.dataset.t:null;
  if(a!=='quit'&&S)S.quitArm=false;
  switch(a){
    case'mode':cfg.mode=el.dataset.v;render();break;
    case'net':cfg.net=el.dataset.v;render();break;
    case'cnt':cfg.counts[t]=clamp(cfg.counts[t]+(+el.dataset.d),0,30);render();break;
    case'start':showErr('');if(cfg.mode==='net')netStart();else startGame();break;
    case'sel':S.pl.sel=t;render();break;
    case'rot':S.pl.rot^=1;render();break;
    case'rand':{const P=S.players[S.pl.pi];if(!randomFleet(P,S.counts)){P.ships=[];P.occ.fill(-1)}autoSel();render();break}
    case'clear':{const P=S.players[S.pl.pi];P.ships=[];P.occ.fill(-1);S.pl.sel=-1;autoSel();render();break}
    case'valid':validatePlacement();break;
    case'ready':{const hf=S.handoff;S.handoff=null;
      if(hf.kind==='place'){S.phase='place';S.pl={pi:hf.pi,sel:-1,rot:0};autoSel()}
      else{S.phase='play';S.cur=hf.pi;S.shotDone=false}
      render();break}
    case'endturn':S.phase='handoff';S.handoff={pi:1-S.cur,kind:'play'};S.shotDone=false;render();break;
    case'again':if(S.mode==='net')netNewGame();else startGame();break;
    case'menu':if(S&&S.mode==='net')netLeave();S=null;render();break;
    case'quit':if(!S.quitArm&&S.phase!=='over'&&S.phase!=='lobby'&&S.phase!=='full'){S.quitArm=true;render();setTimeout(()=>{if(S&&S.quitArm){S.quitArm=false;render()}},3000)}
      else{if(S.mode==='net')netLeave();S=null;render()}break;
    case'copy':try{navigator.clipboard.writeText(NET.code.toUpperCase()).then(()=>{el.textContent='Copié ✓'},()=>{el.textContent='Copie impossible'})}catch(e){el.textContent='Copie impossible'}break;
  }
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){if(!a.disabled)act(a.dataset.act,a);return}
  const c=e.target.closest('.c[data-i]');
  if(c)cellClick(+c.dataset.b,+c.dataset.i);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const v=e.target.value;
  if(k==='W'||k==='H')cfg[k]=parseInt(v,10);
  else if(k==='cnt')cfg.counts[+e.target.dataset.t]=clamp(parseInt(v,10)||0,0,30);
  else if(k==='name0')cfg.names[0]=v;else if(k==='name1')cfg.names[1]=v;
  else if(k==='code')cfg.code=v;
  updateSummary();
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.key==='r'||e.key==='R')&&S&&S.phase==='place'){S.pl.rot^=1;render();if(lastHover!=null)preview(lastHover)}
});
/* Aperçu du placement au survol */
let pvCells=[],lastHover=null;
function clearPreview(){pvCells.forEach(el=>el.classList.remove('pv','pvbad',...TYPES.map((_,t)=>'pt'+t)));pvCells.forEach(el=>el.style.removeProperty('--tc'));pvCells=[]}
function preview(c){
  clearPreview();if(!S||S.phase!=='place')return;
  const P=S.players[S.pl.pi],t=S.pl.sel;if(t<0||P.occ[c]>=0)return;
  const [w,h]=dims(t,S.pl.rot);const x0=c%S.W,y0=Math.floor(c/S.W);
  const ok=!!cellsAt(t,S.pl.rot,c)&&free(P,cellsAt(t,S.pl.rot,c));
  const color=getComputedStyle(document.querySelector('.t'+t)||document.body).getPropertyValue('--tc');
  for(let y=y0;y<Math.min(S.H,y0+h);y++)for(let x=x0;x<Math.min(S.W,x0+w);x++){
    const el=document.querySelector(`.board.placing .c[data-i="${y*S.W+x}"]`);if(!el)continue;
    el.classList.add(ok?'pv':'pvbad');if(ok)el.style.setProperty('--tc',color);pvCells.push(el);}
}
document.addEventListener('mouseover',e=>{const c=e.target.closest('.board.placing .c[data-i]');if(c){lastHover=+c.dataset.i;preview(lastHover)}});
document.addEventListener('mouseout',e=>{if(e.target.closest('.board.placing')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.board.placing'))){lastHover=null;clearPreview()}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S)render()},120)});
render();
</script>
</body>
</html>
