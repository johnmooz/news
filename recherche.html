<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche multi-champs</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65;
    --line: #dedcd5; --accent: #2f5d50; --accent-soft: #e3ede9; --err: #a33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.45; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .row .num { width: 22px; color: var(--muted); font-size: .85rem; text-align: right; flex: none; }
  .row input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
               border-radius: 9px; background: #fcfcfa; }
  .row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
  .row button.del { flex: none; width: 34px; height: 34px; border: 0; border-radius: 8px;
                    background: transparent; color: var(--muted); cursor: pointer; font-size: 1.1rem; }
  .row button.del:hover { background: #f0eee8; color: var(--ink); }
  .row button.del[hidden] { visibility: hidden; display: block; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; }
  .actions label { color: var(--muted); font-size: .9rem; }
  select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  button.go { margin-left: auto; font: inherit; font-weight: 600; padding: 10px 22px; border: 0;
              border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  #status { margin: 20px 4px 0; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--err); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .stat .v { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: .9rem; }
  .stat a { font-size: .85rem; color: var(--accent); }
  ol#results { list-style: none; padding: 0; margin: 18px 0 0; counter-reset: r; }
  ol#results li { counter-increment: r; background: var(--card); border: 1px solid var(--line);
                  border-radius: 12px; padding: 14px 16px 14px 52px; margin-bottom: 8px; position: relative; }
  ol#results li::before { content: counter(r); position: absolute; left: 16px; top: 14px;
                  width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft);
                  color: var(--accent); font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
  ol#results a.kw { color: var(--ink); font-weight: 600; text-decoration: none; }
  ol#results a.kw:hover { color: var(--accent); text-decoration: underline; }
  ol#results .orig { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  @media (max-width: 520px) { .stats { grid-template-columns: 1fr; } button.go { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Recherche multi-champs</h1>
  <p class="sub">Remplissez un champ, un nouveau apparaît. La recherche combine tous les champs remplis.</p>

  <form id="form" autocomplete="off">
    <div id="fields"></div>
    <div class="actions">
      <label for="lang">Langue</label>
      <select id="lang">
        <option value="fr" selected>Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
      </select>
      <button class="go" id="go" type="submit">Rechercher</button>
    </div>
  </form>

  <div id="status"></div>
  <section id="out" hidden>
    <div class="stats">
      <div class="stat"><div class="v" id="nPages">–</div><div class="l">pages trouvées</div></div>
      <div class="stat"><div class="v" id="nPhotos">–</div><div class="l">photos trouvées</div>
        <a id="photosLink" href="#" target="_blank" rel="noopener">Voir les photos ↗</a></div>
    </div>
    <ol id="results"></ol>
  </section>
</main>

<script>
/* ---------- Champs dynamiques ---------- */
const fieldsEl = document.getElementById('fields');

function addField(value = '') {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span class="num"></span><input type="text" placeholder="Mot ou expression…">' +
                  '<button type="button" class="del" title="Supprimer ce champ">✕</button>';
  const input = row.querySelector('input');
  input.value = value;
  input.addEventListener('input', syncFields);
  row.querySelector('.del').addEventListener('click', () => { row.remove(); syncFields(); focusLast(); });
  fieldsEl.appendChild(row);
  return input;
}

function rows() { return [...fieldsEl.querySelectorAll('.row')]; }

function syncFields() {
  const r = rows();
  // Toujours un champ vide en dernier : si le dernier est rempli, en créer un nouveau.
  if (!r.length || r[r.length - 1].querySelector('input').value.trim() !== '') addField();
  // Pas plus d'un champ vide à la fin.
  let all = rows();
  while (all.length > 1 &&
         all[all.length - 1].querySelector('input').value.trim() === '' &&
         all[all.length - 2].querySelector('input').value.trim() === '' &&
         document.activeElement !== all[all.length - 2].querySelector('input')) {
    all[all.length - 1].remove(); all = rows();
  }
  all.forEach((row, i) => {
    row.querySelector('.num').textContent = i + 1;
    // le dernier champ (vide) n'a pas de bouton supprimer
    row.querySelector('.del').hidden = (i === all.length - 1);
  });
}
function focusLast() { const r = rows(); r[r.length - 1].querySelector('input').focus(); }

addField(); syncFields();

/* ---------- Mots vides (FR / EN / ES / DE / IT) ---------- */
const STOP = new Set((
 // français
 "a au aux avec ce ces cet cette dans de des du elle elles en et eux il ils je la le les leur leurs lui ma mais me même mes moi mon ne nos notre nous on ou où par pas pour qu que qui sa se ses son sur ta te tes toi ton tu un une vos votre vous y été être avoir ont sont était étaient fait faire comme plus moins très aussi tout tous toute toutes autre autres entre depuis après avant sous sans dont alors ainsi encore peut peuvent cela celui celle ceux celles leurs selon lors puis donc car ceci chez deux trois premier première partie nom noms ville année années ans siècle selon notamment également cependant ensuite celle quand bien sein vers contre jusqu jusqu'à avait avaient sera seront serait était aussi fut furent nombre plusieurs certains certaines chaque lequel laquelle lesquels dès aujourd hui " +
 // anglais
 "the of and to in is was for on that with as by at from it an be are this which or his her he she they their its were has have had not but also been who one two first other more most some such into after over than then them these those when where while about between during under all any can may would will there what only new used known called including can its our out up many made "+
 // espagnol / allemand / italien (base)
 "el los las del al lo por para con una unos unas es son fue como más pero sus entre sobre también este esta der die das und ist im den dem des ein eine einer mit von zu auf für nicht sich als auch wurde werden il lo gli della delle dei degli nel nella con per tra fra che non sono era anche come questo questa "+
 // bruit wiki
 "références référence voir liens externes lien notes bibliographie article articles wikipédia wikipedia isbn modifier code source catégorie also references external links see"
).split(/\s+/));

/* ---------- API ---------- */
const fmt = new Intl.NumberFormat('fr-FR');

async function api(base, params) {
  const url = base + '?' + new URLSearchParams({ format: 'json', origin: '*', ...params });
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function buildQuery(terms) {
  // expression de plusieurs mots → entre guillemets ; tous les termes doivent être présents
  return terms.map(t => /\s/.test(t) ? `"${t.replace(/"/g, '')}"` : t).join(' ');
}

function tokenize(text) {
  return (text.toLowerCase().match(/[\p{L}][\p{L}'’-]*[\p{L}]/gu) || [])
    .map(w => w.replace(/^(l|d|j|m|n|s|t|c|qu)['’]/, ''))   // l'été → été
    .filter(w => w.length >= 4 && !STOP.has(w) && !/^\d+$/.test(w));
}

// 5 mots-clés par page : TF-IDF sur les 10 pages pour qu'ils soient distinctifs
function keywords(docs, searchTerms) {
  const exclude = new Set(searchTerms.flatMap(t => tokenize(t)));
  const tfs = docs.map(text => {
    const tf = new Map();
    for (const w of tokenize(text)) tf.set(w, (tf.get(w) || 0) + 1);
    return tf;
  });
  const df = new Map();
  tfs.forEach(tf => tf.forEach((_, w) => df.set(w, (df.get(w) || 0) + 1)));
  const N = docs.length;
  return tfs.map(tf => {
    const scored = [...tf].filter(([w]) => !exclude.has(w))
      .map(([w, c]) => [w, (1 + Math.log(c)) * (Math.log((N + 1) / (df.get(w) + 1)) + 1)])
      .sort((a, b) => b[1] - a[1]);
    let picked = scored.slice(0, 5).map(([w]) => w);
    if (picked.length < 5) {   // page trop courte : compléter avec les termes cherchés
      for (const w of exclude) if (picked.length < 5 && tf.has(w)) picked.push(w);
    }
    return picked.map(w => w.charAt(0).toUpperCase() + w.slice(1));
  });
}

/* ---------- Recherche ---------- */
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const out = document.getElementById('out');
const goBtn = document.getElementById('go');

function setStatus(msg, isErr = false) { statusEl.textContent = msg; statusEl.className = isErr ? 'err' : ''; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const terms = rows().map(r => r.querySelector('input').value.trim()).filter(Boolean);
  if (!terms.length) { setStatus('Remplissez au moins un champ.', true); focusLast(); return; }

  const lang = document.getElementById('lang').value;
  const wiki = `https://${lang}.wikipedia.org/w/api.php`;
  const commons = 'https://commons.wikimedia.org/w/api.php';
  const q = buildQuery(terms);

  goBtn.disabled = true; out.hidden = true;
  setStatus(`Recherche de : ${terms.join(' + ')}…`);

  try {
    const [pages, photos] = await Promise.all([
      api(wiki, { action: 'query', list: 'search', srsearch: q, srlimit: 10, srinfo: 'totalhits', srprop: '' }),
      api(commons, { action: 'query', list: 'search', srsearch: q + ' filetype:bitmap', srnamespace: 6,
                     srlimit: 1, srinfo: 'totalhits', srprop: '' })
    ]);

    const totalPages = pages.query?.searchinfo?.totalhits ?? 0;
    const totalPhotos = photos.query?.searchinfo?.totalhits ?? 0;
    const hits = pages.query?.search ?? [];

    document.getElementById('nPages').textContent = fmt.format(totalPages);
    document.getElementById('nPhotos').textContent = fmt.format(totalPhotos);
    document.getElementById('photosLink').href =
      'https://commons.wikimedia.org/w/index.php?' + new URLSearchParams({ search: q + ' filetype:bitmap', title: 'Special:MediaSearch', type: 'image' });

    const list = document.getElementById('results');
    list.innerHTML = '';
    out.hidden = false;

    if (!hits.length) { setStatus('Aucune page ne contient tous ces termes.'); return; }
    setStatus('Analyse du contenu des pages pour extraire les mots-clés…');

    // texte complet de chaque page (une requête par page, en parallèle)
    const texts = await Promise.all(hits.map(h =>
      api(wiki, { action: 'query', prop: 'extracts', explaintext: 1, pageids: h.pageid })
        .then(d => d.query?.pages?.[h.pageid]?.extract || h.title)
        .catch(() => h.title)
    ));

    const kws = keywords(texts, terms);
    hits.forEach((h, i) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'kw';
      a.href = `https://${lang}.wikipedia.org/?curid=${h.pageid}`;
      a.target = '_blank'; a.rel = 'noopener';
      a.textContent = kws[i].join(' · ') || h.title;
      const orig = document.createElement('div');
      orig.className = 'orig';
      orig.textContent = 'Page : ' + h.title;
      li.append(a, orig);
      list.appendChild(li);
    });
    setStatus(`${hits.length} premières pages affichées, renommées par leurs 5 mots-clés.`);
  } catch (err) {
    setStatus('La recherche a échoué (' + err.message + '). Vérifiez votre connexion internet.', true);
  } finally {
    goBtn.disabled = false;
  }
});
</script>
</body>
</html>
