<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: joyeux, table de jeu entre amis
   IDEA: un tapis de cartes en feutrine, les cartes posées en lignes de couleur
   PICTURE: le plateau du joueur (3 lignes de cartes) + la carte piochée en grand
   COLOUR and TYPE: feutre bleu-canard profond, cartes bleu / vert / orange, Fredoka pour les chiffres, Nunito pour le texte
   LAYOUT: barre joueurs, plateau, actions, journal — une colonne sur téléphone, deux au-delà de 900px */
:root{color-scheme:dark;--bg:#0f3436;--bg2:#174a4b;--ink:#f6f1e7;--mute:#b9cfcc;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--acc:#ffd166;--b:#2f6fdb;--g:#24a259;--o:#f08a24}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:12px max(3vw,12px) 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.top h1{font:700 34px/1.05 Fredoka,sans-serif;margin:0;letter-spacing:.5px;flex:1}
.top h1 i{font-style:normal;display:inline-block;transform:scaleX(-1);color:var(--acc)}
.btn{min-height:44px;padding:10px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:800}
.btn.pri{background:var(--acc);color:#2a1f00;border-color:transparent;box-shadow:0 3px 0 #b8892a}
.btn.pri:active{transform:translateY(2px);box-shadow:0 1px 0 #b8892a}
.btn:disabled{opacity:.4;cursor:default}
.ico{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico[aria-pressed=false]{opacity:.45}
.ico[aria-pressed=false] .on,.ico[aria-pressed=true] .off{display:none}
@media(max-width:600px){.top{flex-wrap:wrap}.top h1{flex:1 1 100%;order:-1;margin-bottom:-4px}.top .sp{flex:1}}
.deck{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--mute);font-size:14px}
.stack3{position:relative}
.stack3::before,.stack3::after{content:"";position:absolute;inset:0;border-radius:9px;background:#0b2425;transform:translate(3px,3px);z-index:-1}
.stack3::after{transform:translate(6px,6px);z-index:-2;opacity:.6}
/* cards */
.card{--w:48px;width:var(--w);height:calc(var(--w)*1.42);border-radius:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 80%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 75%,#000) 100%);box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 2px rgba(255,255,255,.18);position:relative;display:grid;place-items:center;flex:none;color:#fff}
.card .v{font:700 calc(var(--w)*.56)/1 Fredoka,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .pt{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:calc(var(--w)*.15);letter-spacing:1px;line-height:1;opacity:.95}
.card.sm{--w:30px;border-radius:7px}.card.sm .pt{top:2px}
.card.lg{--w:96px;border-radius:16px}
.card.pop{animation:pop .45s ease-out}
.card.gone{opacity:.45;outline:2px dashed #fff;outline-offset:-4px}
.card.empty{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 2px var(--line)}
@keyframes pop{0%{transform:scale(.6) rotateY(90deg)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.card.pop{animation:none}}
/* setup */
.setup{max-width:560px;margin:0 auto}
.setup h2{font:600 22px/1.2 Fredoka,sans-serif;margin:18px 0 10px}
.hero{display:flex;justify-content:center;gap:10px;padding:18px 0 6px}
.hero .card{--w:64px}.hero .card:nth-child(1){transform:rotate(-10deg) translateY(6px)}.hero .card:nth-child(3){transform:rotate(9deg) translateY(6px)}
.counts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cnt{min-height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:700 22px Fredoka,sans-serif}
.cnt.on{background:var(--acc);color:#2a1f00}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:8px;border-radius:14px;background:var(--panel);margin-bottom:8px}
.slot input{width:100%;min-height:44px;font:700 16px Nunito,sans-serif;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);padding:0 12px}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.seg button{min-height:44px;padding:0 10px;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.dice{min-height:44px;border-radius:10px;background:rgba(0,0,0,.2);font-size:26px;line-height:1}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row-btns .btn{flex:1}
/* game */
.players{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.pl{flex:none;scroll-snap-align:start;min-width:112px;text-align:left;padding:8px 12px;border-radius:14px;background:var(--panel);border:2px solid transparent;display:grid;grid-template-columns:1fr auto;column-gap:8px}
.pl b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{color:var(--mute);font-size:13px;grid-column:1}
.pl strong{grid-row:1/3;grid-column:2;align-self:center;font:700 26px Fredoka,sans-serif;color:var(--acc)}
.pl.view{border-color:var(--line);background:rgba(255,255,255,.12)}
.pl.turn{border-color:var(--acc)}
.grid{display:grid;gap:14px;margin-top:10px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bhead h2{font:600 22px/1.2 Fredoka,sans-serif;margin:0;flex:1}
.tokens{display:flex;gap:4px;flex-wrap:wrap}
.tok{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px Fredoka,sans-serif;color:#2a1f00;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--acc) 60%,#c99a2e);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tok.t7{background:radial-gradient(circle at 35% 30%,#ffd9e1,#ff7a95 60%,#c94461);color:#fff}
.tok.t20,.tok.t10{width:34px;height:34px;background:radial-gradient(circle at 35% 30%,#e9e3ff,#a78bfa 60%,#6d4fd1);color:#fff}
.crow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.rl{width:8px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.cards{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-height:68px;align-items:center}
.cards .none{color:var(--mute);font-size:14px}
.carre{font-size:14px;color:var(--mute);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.carre span{display:inline-flex;align-items:center;gap:4px}
.carre i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.carre .ok{color:var(--acc);font-weight:800}
.act h3{font:600 20px/1.2 Fredoka,sans-serif;margin:0 0 8px}
.act p{margin:0 0 10px;color:var(--mute)}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.opt{display:grid;justify-items:center;gap:8px;padding:12px 6px;border-radius:16px;background:rgba(0,0,0,.18);border:2px solid var(--line)}
.opt:hover{border-color:var(--acc)}
.opt small{font-weight:700;color:var(--mute);font-size:13px}
.opt .warn{color:#ff9e9e;font-weight:800;font-size:13px}
.opt .good{color:var(--acc);font-weight:800;font-size:13px}
.runlist{display:grid;gap:8px;margin-bottom:10px}
.run{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(0,0,0,.18);border:2px solid var(--line);text-align:left}
.run:hover{border-color:var(--acc)}
.run .rc{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.run strong{font:700 22px Fredoka,sans-serif;color:var(--acc);white-space:nowrap}
.log ol{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-size:14px}
.log li{padding:5px 0;border-top:1px solid var(--line);color:var(--mute)}
.log li:first-child{color:var(--ink);font-weight:700}
.log h3{font:600 18px Fredoka,sans-serif;margin:0 0 6px}
.note{font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.link{text-decoration:underline;font-weight:800;color:var(--acc);min-height:44px}
.rank{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
.rank li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18)}
.rank li:first-child{background:color-mix(in srgb,var(--acc) 25%,transparent);border:2px solid var(--acc)}
.rank .pos{font:700 24px Fredoka,sans-serif;width:28px}
.rank .nm{flex:1;font-weight:800}
.rank strong{font:700 26px Fredoka,sans-serif;color:var(--acc)}
.thinking::after{content:"…";animation:dots 1s steps(3) infinite}
@keyframes dots{0%{content:"."}50%{content:".."}100%{content:"..."}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}
.modal.hidden{display:none}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.sheet h2{font:600 26px Fredoka,sans-serif;margin:0 0 8px}
.sheet h3{font:600 18px Fredoka,sans-serif;margin:16px 0 4px;color:var(--acc)}
.sheet p,.sheet li{color:var(--ink);font-size:15px}
.sheet ul{padding-left:20px;margin:4px 0}
@media(max-width:600px){.top h1{font-size:28px}.card{--w:42px}.card.lg{--w:84px}.slot{grid-template-columns:minmax(0,1fr) 44px}.slot .seg{grid-column:1/3;grid-row:2}.slot .seg button{flex:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
{
const COL=[{n:'Bleu',m:'bleu',f:'bleue',h:'var(--b)'},{n:'Vert',m:'vert',f:'verte',h:'var(--g)'},{n:'Orange',m:'orange',f:'orange',h:'var(--o)'}];
const HUM=['Jo','Tim','Virg','Telio','Jacqueline','Alain','Ophélie','Toto','Nath','Sandra','Greg','Lucas','Théo','Alizée','Manon','Hugo','Léa','Inès','Max','Chloé','Paulo','Lili'];
const BOT=['HAL-9000','R2-Bit','Byte-Man','Kernel','Pixel-8','Turbo-PC','Cyber-Max','Algo-3','Nano-Bot','Wi-Fi','Router-X','Cache-404','Linux-1','Robo-RAM','Giga-Hertz','Data-Byte','Ctrl-Alt','Bug-Zéro'];
const R=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app'),modal=document.getElementById('modal'),sheet=document.getElementById('sheet');

/* ---------- son : bruitages et musique (Web Audio, tout est synthétisé) ---------- */
const SND={music:true,sfx:true};
try{const s=JSON.parse(localStorage.getItem('verso-snd')||'null');if(s)Object.assign(SND,s)}catch(e){}
const saveSnd=()=>{try{localStorage.setItem('verso-snd',JSON.stringify(SND))}catch(e){}};
let AC=null,sfxG,musG,echo;
function ac(){
  if(!AC){try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
    sfxG=AC.createGain();sfxG.gain.value=SND.sfx?.55:0;sfxG.connect(comp);
    musG=AC.createGain();musG.gain.value=SND.music?.2:0;musG.connect(comp);
    echo=AC.createDelay();echo.delayTime.value=.27;const fb=AC.createGain();fb.gain.value=.32;const ef=AC.createBiquadFilter();ef.type='lowpass';ef.frequency.value=2200;
    echo.connect(ef);ef.connect(fb);fb.connect(echo);ef.connect(musG);
  }catch(e){AC=null;return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
const midi=m=>440*2**((m-69)/12);
function tone(f,t,d,type,v,dest,slide){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+d+.05);return g;
}
function noise(t,d,v,freq,dest){
  const n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;
  f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(freq*2.5,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t);
}
function sfx(name,delay){
  if(!SND.sfx||!ac())return;const t=AC.currentTime+(delay||0);
  switch(name){
    case'tap':tone(700,t,.06,'triangle',.1);break;
    case'draw':noise(t,.22,.35,600);tone(300,t+.05,.15,'triangle',.08,sfxG,600);break;
    case'flip':noise(t,.12,.3,1400);tone(480,t+.04,.14,'triangle',.12,sfxG,960);break;
    case'place':noise(t,.05,.25,350);tone(200,t,.14,'triangle',.28,sfxG,130);break;
    case'dup':tone(196,t,.22,'sawtooth',.1,sfxG,110);tone(147,t+.14,.32,'sawtooth',.1,sfxG,80);break;
    case'run':[72,76,79,84].forEach((m,i)=>tone(midi(m),t+i*.08,.45,'triangle',.2));tone(midi(91),t+.32,.6,'sine',.08);break;
    case'carre':[67,72,76,79,84,88].forEach((m,i)=>tone(midi(m),t+i*.07,.4,'square',.06));[72,76,79].forEach(m=>tone(midi(m+12),t+.45,1.1,'triangle',.12));break;
    case'turn':tone(midi(81),t,.35,'sine',.16);tone(midi(88),t+.1,.5,'sine',.12);break;
    case'win':[60,64,67,72,67,72,76,79].forEach((m,i)=>tone(midi(m+12),t+i*.12,.35,'square',.06));[72,76,79,84].forEach(m=>tone(midi(m),t+1,1.6,'triangle',.12));break;
  }
}
/* musique d'ambiance : boucle lounge douce Do maj7 – La m7 – Fa maj7 – Sol 7 */
const PROG=[[36,[60,64,67,71]],[33,[57,60,64,67]],[29,[57,60,65,69]],[31,[55,59,62,65]]];
const EIGHTH=60/84/2;let musT=null,nextT=0,step=0;
function pad(f,t,d){
  const fl=AC.createBiquadFilter(),g=AC.createGain();fl.type='lowpass';fl.frequency.value=900;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.setValueAtTime(.05,t+d-.5);g.gain.linearRampToValueAtTime(0,t+d);
  [-6,6].forEach(dt=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt;o.connect(fl);o.start(t);o.stop(t+d+.1)});
  fl.connect(g);g.connect(musG);
}
function playStep(s,t){
  const [b,ch]=PROG[Math.floor(s/8)%4],i=s%8;
  if(i===0){ch.forEach(m=>pad(midi(m),t,EIGHTH*8));tone(midi(b+12),t,EIGHTH*3.5,'sine',.4,musG)}
  if(i===5)tone(midi(b+19),t,EIGHTH*2.5,'sine',.28,musG);
  const pat=[0,2,1,3,2,1,3,2];
  if(Math.random()<.7){const g=tone(midi(ch[pat[i]]+12),t,EIGHTH*1.6,'sine',.09,musG);g.connect(echo)}
  if(i%2===1)noise(t,.04,.05,6000,musG);
}
function sched(){if(!AC)return;while(nextT<AC.currentTime+.35){playStep(step,nextT);nextT+=EIGHTH;step++}}
function musicOn(){if(!SND.music||musT||!ac())return;nextT=AC.currentTime+.15;step=0;musT=setInterval(sched,90)}
function musicOff(){clearInterval(musT);musT=null}
function setGain(g,v){if(AC&&g)g.gain.setTargetAtTime(v,AC.currentTime,.05)}
const icoMus=()=>`<button class="ico" data-a="mus" aria-pressed="${SND.music}" aria-label="Musique d'ambiance"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="off" d="M3 3l18 18"/></svg></button>`;
const icoSfx=()=>`<button class="ico" data-a="sfx" aria-pressed="${SND.sfx}" aria-label="Bruitages"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="on" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/><path class="off" d="M16 9l5 6M21 9l-5 6"/></svg></button>`;
const hdrBtns=()=>`<span class="sp"></span>${icoMus()}${icoSfx()}<button class="btn" data-a="rules">Règles</button>`;

/* ---------- cartes ---------- */
function genCard(){
  const c1=R(3),c2=(c1+1+R(2))%3;
  let faces;
  if(Math.random()<0.09){faces=[{c:c1,v:'J',p:1},{c:c2,v:1+R(6),p:3}]}
  else{const v1=1+R(6);let v2=v1+(Math.random()<.5?1:-1);if(v2>6)v2=1;if(v2<1)v2=6;const p1=Math.random()<.5?1:3;faces=[{c:c1,v:v1,p:p1},{c:c2,v:v2,p:4-p1}]}
  if(Math.random()<.5)faces.reverse();
  return{faces,up:0};
}
const vis=k=>k.faces[k.up];
const num=f=>f.v==='J'?0:f.v;
const lbl=f=>`${f.v==='J'?'Joker':f.v} ${COL[f.c].m}`;
const dots=p=>p===3?'●●●':'●';
const cardH=(f,cls='')=>`<div class="card ${cls}" style="--c:${COL[f.c].h}" role="img" aria-label="${lbl(f)}, ${f.p} point${f.p>1?'s':''}"><span class="pt">${dots(f.p)}</span><span class="v">${f.v==='J'?'★':f.v}</span></div>`;
const dup=(t,f,ex)=>t.some(k=>k!==ex&&vis(k).c===f.c&&vis(k).v===f.v);

function runs(t){
  const out=[];
  for(let c=0;c<3;c++){
    const by={};let J=null;
    t.filter(k=>vis(k).c===c).forEach(k=>{const v=vis(k).v;if(v==='J')J=k;else by[v]=k});
    const cand=[];
    for(let s=1;s<6;s++)for(let e=s+1;e<=6;e++){
      const miss=[];for(let v=s;v<=e;v++)if(!by[v])miss.push(v);
      if(miss.length===0||(miss.length===1&&J))cand.push({s,e});
    }
    cand.filter(a=>!cand.some(b=>b!==a&&b.s<=a.s&&b.e>=a.e)).forEach(r=>{
      const cards=[];for(let v=r.s;v<=r.e;v++)cards.push({k:by[v]||J,v});
      out.push({c,cards,pts:cards.reduce((a,x)=>a+vis(x.k).p,0)});
    });
  }
  return out;
}
const best=rs=>rs.slice().sort((a,b)=>b.pts-a.pts||b.cards.length-a.cards.length)[0];
const runTxt=r=>`suite ${COL[r.c].f} ${r.cards.map(x=>vis(x.k).v==='J'?'★':x.v).join('-')}`;
const carreOf=t=>[0,1,2].every(c=>t.filter(k=>vis(k).c===c).length>=3);
function tokens(n){const o=[];for(const v of[20,10,7,3,1])while(n>=v){o.push(v);n-=v}return o}
const tokH=n=>tokens(n).map(v=>`<span class="tok t${v}">${v}</span>`).join('');

/* ---------- mise en place ---------- */
let S={n:2,slots:[]},G=null;
function pickName(bot,ex){const pool=(bot?BOT:HUM).filter(x=>!ex.includes(x));return pool[R(pool.length)]||(bot?'Bot-'+R(99):'Joueur')}
function used(i){return S.slots.filter((s,j)=>j!==i).map(s=>s.name)}
function initSlots(){S.slots=[];for(let i=0;i<6;i++){const bot=i>0;S.slots.push({bot,name:''});S.slots[i].name=pickName(bot,used(i))}}
initSlots();

function renderSetup(){
  G=null;
  app.innerHTML=`<header class="top"><h1>Ver<i>s</i>o</h1>${hdrBtns()}</header>
  <section class="setup">
    <div class="hero">${cardH({c:0,v:2,p:1})}${cardH({c:1,v:3,p:3})}${cardH({c:2,v:'J',p:1})}</div>
    <h2>Nombre de joueurs</h2>
    <div class="counts">${[1,2,3,4,5,6].map(i=>`<button class="cnt ${i===S.n?'on':''}" data-n="${i}" aria-pressed="${i===S.n}">${i}</button>`).join('')}</div>
    <h2>Les joueurs</h2>
    ${S.slots.slice(0,S.n).map((s,i)=>`<div class="slot">
      <input id="nm${i}" data-i="${i}" value="${esc(s.name)}" maxlength="14" aria-label="Nom du joueur ${i+1}">
      <div class="seg"><button data-t="${i}" data-b="0" class="${s.bot?'':'on'}">Humain</button><button data-t="${i}" data-b="1" class="${s.bot?'on':''}">Ordi</button></div>
      <button class="dice" data-r="${i}" aria-label="Nom au hasard">⚄</button></div>`).join('')}
    <div class="row-btns"><button class="btn" data-a="rand">Tout au hasard</button><button class="btn pri" data-a="start">Commencer</button></div>
    <p class="note" style="margin-top:14px">${15*S.n} cartes dans la pioche (15 par joueur). Les ordinateurs ont des noms de machines.</p>
  </section>`;
}

/* ---------- partie ---------- */
const cur=()=>G.ps[G.turn];
function log(t){G.log.unshift(t);if(G.log.length>60)G.log.pop()}
function start(){
  const ps=S.slots.slice(0,S.n).map(s=>({name:s.name.trim()||pickName(s.bot,[]),bot:s.bot,tab:[],score:0,carre:false}));
  G={ps,deck:Array.from({length:15*ps.length},genCard),disc:0,turn:R(ps.length),phase:'play',log:[],view:0,mode:null,pending:null,final:[]};
  log(`La partie commence : ${G.deck.length} cartes dans la pioche. ${cur().name} commence.`);
  const h=ps.findIndex(p=>!p.bot);G.view=h<0?0:h;
  begin();
}
function begin(){
  const p=cur();G.mode=null;
  if(!p.bot){G.view=G.turn;sfx('turn')}
  render();
  if(p.bot)setTimeout(botTurn,900);
}
function endTurn(){
  if(!G)return;
  if(!G.deck.length){startFinal();return}
  G.turn=(G.turn+1)%G.ps.length;begin();
}
function gain(p,n,why){p.score+=n;log(`${p.name} : ${why} +${n} point${n>1?'s':''}.`)}
function checkCarre(p){const has=carreOf(p.tab);if(has&&!p.carre){gain(p,7,'Carré 3×3 !');sfx('carre',.25)}p.carre=has}
function place(p,k,up){
  k.up=up;const f=vis(k);
  if(dup(p.tab,f)){sfx('dup');G.disc++;log(`${p.name} joue le ${lbl(f)} : doublon, carte défaussée.`)}
  else{sfx('place');k.fresh=1;p.tab.push(k);log(`${p.name} pose le ${lbl(f)}.`)}
  checkCarre(p);
}
function neighbours(i){const n=G.ps.length;if(n<2)return[];return[...new Set([(i-1+n)%n,(i+1)%n])]}
function forceFlip(q,c){
  const cs=q.tab.filter(k=>vis(k).c===c);
  if(!cs.length){log(`${q.name} n'a aucune carte ${COL[c].f} à retourner.`);return}
  cs.sort((a,b)=>num(vis(b))-num(vis(a)));
  const k=cs[0],before=lbl(vis(k));k.up^=1;sfx('flip',.45);const f=vis(k);
  if(dup(q.tab,f,k)){sfx('dup',.7);q.tab.splice(q.tab.indexOf(k),1);G.disc++;log(`${q.name} retourne son ${before} → ${lbl(f)} : doublon, défaussée.`)}
  else{k.fresh=1;log(`${q.name} retourne son ${before} → ${lbl(f)}.`)}
  checkCarre(q);
}
function validate(p,r,final){
  log(`${p.name} valide une ${runTxt(r)} : +${r.pts} points.`);p.score+=r.pts;sfx('run');
  const top=r.cards.slice(-2).map(x=>x.k);
  p.tab=p.tab.filter(k=>!top.includes(k));G.disc+=top.length;
  checkCarre(p);
  if(!final)neighbours(G.ps.indexOf(p)).forEach(j=>forceFlip(G.ps[j],r.c));
}
function startFinal(){
  G.phase='final';log('La pioche est vide ! Chacun peut valider une dernière suite.');
  const n=G.ps.length;G.final=[...Array(n)].map((_,i)=>(G.turn+1+i)%n);finalNext();
}
function finalNext(){
  if(!G)return;
  if(!G.final.length){G.phase='over';G.mode=null;log('Fin de la partie !');sfx('win',.3);render();return}
  G.turn=G.final[0];const p=cur(),rs=runs(p.tab);
  if(!rs.length){log(`${p.name} n'a pas de suite à valider.`);G.final.shift();render();setTimeout(finalNext,500);return}
  if(p.bot){G.mode=null;render();setTimeout(()=>{validate(p,best(rs),true);G.final.shift();finalNext()},1000)}
  else{G.view=G.turn;G.mode='final';render()}
}

/* ---------- ordinateurs ---------- */
function handVal(t){
  let v=0;const rs=runs(t);
  for(let c=0;c<3;c++){
    const n=t.filter(k=>vis(k).c===c).length,cr=rs.filter(r=>r.c===c);
    if(cr.length)v+=Math.max(...cr.map(r=>r.pts+r.cards.length*.8));
    v+=Math.min(n,3)*.9;
  }
  return v;
}
function botChoose(p,k){
  let bu=0,bv=-1e9;
  for(const up of[0,1]){
    k.up=up;const f=vis(k);let v;
    if(dup(p.tab,f))v=handVal(p.tab)-1;
    else{const t=[...p.tab,k];v=handVal(t)+(carreOf(t)&&!p.carre?7:0)+f.p*.25}
    v+=Math.random()*.4;if(v>bv){bv=v;bu=up}
  }
  return bu;
}
function botTurn(){
  if(!G||G.phase!=='play')return;
  const p=cur(),rs=runs(p.tab),b=rs.length?best(rs):null;
  if(b&&(b.pts>=6||b.cards.length>=4||(b.cards.length>=3&&b.pts>=4))){validate(p,b,false);render();setTimeout(endTurn,900);return}
  G.pending=G.deck.pop();sfx('draw');render();
  setTimeout(()=>{if(!G)return;const k=G.pending;G.pending=null;place(p,k,botChoose(p,k));render();setTimeout(endTurn,700)},1000);
}

/* ---------- affichage ---------- */
function boardH(p){
  const rows=[0,1,2].map(c=>{
    const cs=p.tab.filter(k=>vis(k).c===c).sort((a,b)=>(num(vis(a))||9)-(num(vis(b))||9));
    return`<div class="crow"><span class="rl" style="--c:${COL[c].h}"></span><div class="cards">${cs.length?cs.map(k=>cardH(vis(k),k.fresh?'pop':'')).join(''):`<span class="none">Aucune carte ${COL[c].f}</span>`}</div></div>`;
  }).join('');
  const prog=[0,1,2].map(c=>`<span><i style="--c:${COL[c].h}"></i>${Math.min(3,p.tab.filter(k=>vis(k).c===c).length)}/3</span>`).join('');
  return`<div class="bhead"><h2>${esc(p.name)}${p.bot?' · ordi':''}</h2><div class="tokens">${tokH(p.score)}</div></div>${rows}
  <div class="carre">Carré : ${prog} ${p.carre?'<span class="ok">formé</span>':''}</div>`;
}
function runListH(rs){
  return`<div class="runlist">${rs.map((r,i)=>`<button class="run" data-run="${i}"><span class="rc">${r.cards.map((x,j)=>cardH(vis(x.k),'sm'+(j>=r.cards.length-2?' gone':''))).join('')}</span><strong>+${r.pts}</strong></button>`).join('')}</div>
  <p>Les cartes en pointillés (les deux plus fortes) seront défaussées.</p>`;
}
function actH(){
  const p=cur();
  if(G.phase==='over'){
    const rk=G.ps.map(x=>x).sort((a,b)=>b.score-a.score);
    return`<h3>${esc(rk[0].name)} gagne !</h3><ol class="rank">${rk.map((x,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(x.name)}</span><span class="tokens">${tokH(x.score)}</span><strong>${x.score}</strong></li>`).join('')}</ol>
    <div class="btns"><button class="btn pri" data-a="again">Rejouer</button><button class="btn" data-a="setup">Nouveaux joueurs</button></div>`;
  }
  if(p.bot){
    return`<h3 class="thinking">${esc(p.name)} réfléchit</h3>${G.pending?`<p>${esc(p.name)} a pioché :</p><div class="choice"><div class="opt">${cardH(G.pending.faces[0],'lg')}<small>Une face</small></div><div class="opt">${cardH(G.pending.faces[1],'lg')}<small>L'autre face</small></div></div>`:`<p>${G.phase==='final'?'Dernière suite…':'Choisit son action…'}</p>`}`;
  }
  const back=G.view!==G.turn?`<div class="note">Tu regardes le plateau de ${esc(G.ps[G.view].name)}. <button class="link" data-v="${G.turn}">Revenir au mien</button></div>`:'';
  if(G.mode==='choose'){
    const k=G.pending;
    return`<h3>${esc(p.name)}, quel côté jouer ?</h3><p>Choix définitif.</p><div class="choice">${[0,1].map(up=>{const f=k.faces[up],d=dup(p.tab,f);const t=[...p.tab];k.up=up;const sq=!d&&!p.carre&&carreOf([...t,k]);k.up=0;
      return`<button class="opt" data-up="${up}">${cardH(f,'lg')}<small>${up===0?'Face visible':'Verso'} · ${f.p} pt${f.p>1?'s':''}</small>${d?'<span class="warn">Doublon → défaussée</span>':sq?'<span class="good">Forme le carré +7</span>':''}</button>`}).join('')}</div>${back}`;
  }
  if(G.mode==='runs'||G.mode==='final'){
    const rs=runs(p.tab);
    return`<h3>${G.mode==='final'?'Dernière suite':'Valider une suite'}</h3>${G.mode==='final'?'<p>Sans faire retourner de cartes aux voisins.</p>':'<p>Tes voisins retourneront leur carte la plus forte de cette couleur.</p>'}${runListH(rs)}
    <div class="btns"><button class="btn" data-a="${G.mode==='final'?'pass':'cancel'}">${G.mode==='final'?'Passer':'Annuler'}</button></div>${back}`;
  }
  if(G.mode==='wait')return`<h3>…</h3>`;
  const rs=runs(p.tab);
  return`<h3>À toi, ${esc(p.name)} !</h3><p>Une seule action : piocher et poser une carte, ou valider une suite.</p>
  <div class="btns"><button class="btn pri" data-a="draw">Piocher</button><button class="btn" data-a="valid" ${rs.length?'':'disabled'}>Valider une suite${rs.length?` (${rs.length})`:''}</button></div>${back}`;
}
function render(){
  if(!G){renderSetup();return}
  const top=G.deck[G.deck.length-1];
  app.innerHTML=`<header class="top"><h1>Ver<i>s</i>o</h1>
    <div class="deck">${top?`<span class="stack3">${cardH(vis(top),'sm')}</span>`:''}<span>${G.deck.length} carte${G.deck.length>1?'s':''}</span></div>
    ${hdrBtns()}</header>
  <nav class="players">${G.ps.map((p,i)=>`<button class="pl ${i===G.turn&&G.phase!=='over'?'turn':''} ${i===G.view?'view':''}" data-v="${i}"><b>${esc(p.name)}</b><small>${p.bot?'ordi':'humain'} · ${p.tab.length} c.${p.carre?' · carré':''}</small><strong>${p.score}</strong></button>`).join('')}</nav>
  <div class="grid">
    <section class="panel">${boardH(G.ps[G.view])}</section>
    <div style="display:grid;gap:14px;align-content:start">
      <section class="panel act">${actH()}</section>
      <section class="panel log"><h3>Journal</h3><ol>${G.log.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section>
    </div>
  </div>
  <p class="note" style="margin-top:12px">Défausse : ${G.disc} carte${G.disc>1?'s':''}. ● = 1 point, ●●● = 3 points, ★ = Joker.</p>`;
  G.ps.forEach(p=>p.tab.forEach(k=>k.fresh=0));
}

const RULES=`<h2>Règles de Verso</h2>
<p>Chaque carte a une couleur (bleu, vert, orange), une valeur (1 à 6 ou Joker ★) et vaut 1 ou 3 points (● ou ●●●). Son verso a une autre couleur, une valeur à ±1 (le 6 et le 1 se suivent) et l'autre valeur en points. Un Joker vaut toujours 1 point et peut avoir n'importe quelle valeur au verso.</p>
<h3>Mise en place</h3><ul><li>Pioche de 15 cartes par joueur, mélangée dans tous les sens.</li></ul>
<h3>À ton tour, une seule action</h3>
<ul><li><b>Piocher et poser</b> : prends la carte du dessus, joue sa face visible ou son verso (définitif). Jamais deux cartes identiques devant toi : un doublon est défaussé.</li>
<li><b>Valider une suite</b> d'au moins 2 valeurs consécutives de la même couleur (le Joker peut combler un trou). Tu marques la somme des points, tu défausses les deux cartes les plus fortes de la suite, et tes voisins de gauche et de droite retournent leur carte la plus forte de cette couleur.</li></ul>
<h3>Carré (+7)</h3><p>Dès que tu as au moins 3 cartes dans chacune des 3 couleurs, tu gagnes 7 points sans rien défausser. S'il est brisé puis reformé, tu regagnes 7 points.</p>
<h3>Fin de partie</h3><p>Quand la pioche est vide, chacun peut valider une dernière suite (sans faire retourner les voisins). Le plus de points gagne.</p>
<div class="btns" style="margin-top:14px"><button class="btn pri" data-a="close">Compris</button></div>`;

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(ac()&&SND.music)musicOn();
  if(d.a==='mus'){SND.music=!SND.music;saveSnd();setGain(musG,SND.music?.2:0);SND.music?musicOn():musicOff();document.querySelectorAll('[data-a=mus]').forEach(x=>x.setAttribute('aria-pressed',SND.music));return}
  if(d.a==='sfx'){SND.sfx=!SND.sfx;saveSnd();setGain(sfxG,SND.sfx?.55:0);sfx('tap');document.querySelectorAll('[data-a=sfx]').forEach(x=>x.setAttribute('aria-pressed',SND.sfx));return}
  if(!G||d.a==='rules'||d.a==='close'||d.v!==undefined||d.a==='cancel')sfx('tap');
  if(d.a==='rules'){sheet.innerHTML=RULES;modal.classList.remove('hidden');return}
  if(d.a==='close'){modal.classList.add('hidden');return}
  if(!G){
    if(d.n){S.n=+d.n;renderSetup()}
    else if(d.t!==undefined){const s=S.slots[+d.t],bot=d.b==='1';if(s.bot!==bot){s.bot=bot;s.name=pickName(bot,used(+d.t))}renderSetup()}
    else if(d.r!==undefined){const i=+d.r;S.slots[i].name=pickName(S.slots[i].bot,used(i));renderSetup()}
    else if(d.a==='rand'){S.slots.forEach((s,i)=>s.name='');S.slots.forEach((s,i)=>s.name=pickName(s.bot,used(i)));renderSetup()}
    else if(d.a==='start')start();
    return;
  }
  if(d.v!==undefined){G.view=+d.v;render();return}
  if(d.a==='again'){const names=G.ps.map(p=>({name:p.name,bot:p.bot}));names.forEach((x,i)=>S.slots[i]=x);start();return}
  if(d.a==='setup'){G=null;renderSetup();return}
  const p=cur();if(p.bot)return;
  if(d.a==='draw'&&!G.mode&&G.deck.length){G.pending=G.deck.pop();sfx('draw');G.mode='choose';G.view=G.turn;render()}
  else if(d.up!==undefined&&G.mode==='choose'){const k=G.pending;G.pending=null;place(p,k,+d.up);G.mode='wait';render();setTimeout(endTurn,500)}
  else if(d.a==='valid'&&!G.mode){G.mode='runs';G.view=G.turn;render()}
  else if(d.a==='cancel'){G.mode=null;render()}
  else if(d.run!==undefined&&(G.mode==='runs'||G.mode==='final')){
    const r=runs(p.tab)[+d.run];if(!r)return;
    if(G.mode==='final'){validate(p,r,true);G.final.shift();G.mode=null;finalNext()}
    else{validate(p,r,false);G.mode='wait';render();setTimeout(endTurn,700)}
  }
  else if(d.a==='pass'&&G.mode==='final'){log(`${p.name} passe.`);G.final.shift();G.mode=null;finalNext()}
});
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(i!==undefined&&!G)S.slots[+i].name=e.target.value});
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden')});
renderSetup();
}
</script>
</body>
