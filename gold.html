<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold — La ruée vers l'or</title>
<style>
:root{
  --bg1:#2b1d12;--bg2:#4a3220;--felt:#3b5a3a;--felt2:#2c4630;
  --gold:#f2c84b;--gold2:#c9971c;--ink:#2a1a0d;--paper:#f4ead4;--muted:#cbb894;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:var(--paper);
  background:radial-gradient(ellipse at 50% 30%,#5a3e27 0%,var(--bg1) 70%) fixed;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
h1.logo{font-size:clamp(40px,8vw,74px);margin:.1em 0 0;letter-spacing:.18em;text-align:center;
  background:linear-gradient(180deg,#fff3b0 0%,#f2c84b 45%,#a8740f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a250f) drop-shadow(0 6px 12px rgba(0,0,0,.6));font-weight:900}
.sub{text-align:center;color:var(--muted);font-style:italic;margin:0 0 18px}

/* ---------- Setup ---------- */
#setup{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.panel{background:linear-gradient(180deg,#f4ead4,#e6d6b2);color:var(--ink);border-radius:16px;padding:18px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 3px #b9925a,inset 0 0 0 6px #f4ead4,inset 0 0 0 7px #b9925a}
.panel h2{margin:4px 0 12px;font-size:20px;color:#6b3f12;border-bottom:1px dashed #b9925a;padding-bottom:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:2px solid #8a5a24}
.seg button{border:0;background:#fff7e2;color:var(--ink);padding:8px 16px;font-size:16px;font-weight:bold}
.seg button.on{background:#8a5a24;color:#fff3cf}
.prow{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:12px;background:rgba(255,255,255,.55)}
.pnum{width:30px;height:30px;border-radius:50%;background:#8a5a24;color:#fff;display:grid;place-items:center;font-weight:bold}
.prow input{width:100%;padding:8px 10px;font-size:16px;border-radius:8px;border:1.5px solid #b9925a;background:#fffdf5;font-family:inherit}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:15px;background:#fff7e2;border:1.5px solid #8a5a24;color:var(--ink)}
.btn:hover{background:#ffeec2}
.typebtn{min-width:132px;font-weight:bold}
.typebtn.ai{background:#34495e;color:#e8f1ff;border-color:#1f2d3a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.opts label{display:flex;align-items:center;gap:8px;font-size:15px}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:#8a5a24}
select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1.5px solid #b9925a;background:#fffdf5}
.go{display:block;margin:18px auto 0;font-size:24px;font-weight:900;letter-spacing:.08em;padding:14px 40px;border-radius:40px;border:0;
  background:linear-gradient(180deg,#ffe58a,#e0a81e);color:#3a230b;box-shadow:0 6px 0 #8a5a12,0 12px 20px rgba(0,0,0,.4)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a12}
.note{font-size:13px;color:#6b4a26;font-style:italic;margin-top:6px}

/* ---------- Game ---------- */
#game{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,220,150,.2);flex-wrap:wrap}
.topbar .t{font-weight:900;letter-spacing:.15em;color:var(--gold);font-size:22px}
.topbar .info{color:var(--muted);font-size:14px}
.topbar .sp{flex:1}
.ibtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,220,150,.3);color:var(--paper);border-radius:10px;padding:6px 10px;font-size:15px}
.ibtn.off{opacity:.45}
.main{flex:1;display:grid;grid-template-columns:250px 1fr 270px;gap:14px;padding:12px;align-items:start}
@media (max-width:1050px){.main{grid-template-columns:1fr;}.side{order:2}.center{order:1}}
.side{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.3);border:2px solid transparent;transition:.3s}
.pl.active{border-color:var(--gold);background:rgba(242,200,75,.14);box-shadow:0 0 18px rgba(242,200,75,.35)}
.pl .ent{width:52px;height:52px;flex:none;position:relative}
.pl .ent svg{width:100%;height:100%}
.pl .nm{font-weight:bold;font-size:16px;line-height:1.1}
.pl .ty{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;margin-top:3px}
.chip{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
.pl .sc{margin-left:auto;text-align:right}
.pl .sc b{font-size:22px;color:var(--gold);display:block;line-height:1}
.pl .sc small{color:var(--muted);font-size:11px}
.pl.bump .sc b{animation:bump .6s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.6);color:#fff}100%{transform:scale(1)}}
.unowned{font-size:12px;color:var(--muted);padding:4px 6px}

.center{display:flex;flex-direction:column;align-items:center;gap:10px}
.msg{min-height:52px;width:min(100%,640px);text-align:center;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.35);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.msg.good{background:rgba(160,120,10,.45)}
.msg.bad{background:rgba(150,30,20,.45)}
.board{--size:min(94vw,calc(100vh - 210px),640px);width:var(--size);height:var(--size);padding:calc(var(--size)*.025);
  border-radius:22px;background:radial-gradient(circle at 50% 40%,#6d4a2c,#3d2817);
  box-shadow:inset 0 0 0 4px #8b5a2b,inset 0 0 40px rgba(0,0,0,.7),0 14px 34px rgba(0,0,0,.6);
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:calc(var(--size)*.012)}
@media (max-width:1050px){.board{--size:min(96vw,calc(100vh - 170px),640px)}}
.board.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.slot{position:relative;perspective:700px}
.slot::before{content:"";position:absolute;inset:8%;border-radius:50%;border:2px dashed rgba(255,220,150,.12)}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,1.4,.6,1),opacity .5s;}
.card.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:50%}
.face.front{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.slot.can .card:not(.up){cursor:pointer}
.slot.can:hover .card:not(.up){transform:translateY(-4px) scale(1.06)}
.slot.can:hover .face.back svg{filter:drop-shadow(0 0 8px rgba(255,220,120,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.slot.sel .face.front svg{filter:drop-shadow(0 0 10px rgba(255,240,170,1))}
.slot.gone .card{opacity:0;transform:rotateY(180deg) scale(.2);pointer-events:none}
.slot.taken .card{opacity:0;transform:rotateY(180deg) translateY(-60px) scale(1.4);pointer-events:none;transition:transform .7s,opacity .7s}
.slot.boom .card{opacity:0;transform:rotateY(180deg) scale(1.8) rotate(25deg);transition:transform .45s,opacity .45s}
.slot.hint .face.back svg{filter:drop-shadow(0 0 6px #7fd3ff)}

.box{background:rgba(0,0,0,.3);border-radius:14px;padding:10px 12px}
.box h3{margin:0 0 8px;font-size:15px;color:var(--gold);letter-spacing:.05em}
.bar{display:grid;grid-template-columns:118px 1fr 44px;gap:6px;align-items:center;font-size:13px;margin:5px 0}
.bar .tr{height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.bar .fl{height:100%;border-radius:6px;transition:width .4s}
.bar .v{text-align:right;font-weight:bold}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:3px 0}
.stat b{color:var(--paper)}
#log{max-height:220px;overflow:auto;font-size:13px;line-height:1.45;color:#e6d7b8}
#log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rushbanner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.rushbanner span{font-size:clamp(40px,9vw,96px);font-weight:900;letter-spacing:.06em;color:#ffe27a;
  text-shadow:0 4px 0 #7a4b0c,0 0 30px rgba(255,200,60,.9);animation:rushin 2.2s forwards;transform:rotate(-6deg)}
@keyframes rushin{0%{opacity:0;transform:scale(.3) rotate(-6deg)}20%{opacity:1;transform:scale(1.15) rotate(-6deg)}35%{transform:scale(1) rotate(-6deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-6deg)}}

.modal{position:fixed;inset:0;background:rgba(10,6,2,.72);display:grid;place-items:center;z-index:50;padding:14px}
.modal .panel{max-width:620px;width:100%;max-height:92vh;overflow:auto}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res td,table.res th{padding:7px 6px;border-bottom:1px solid #d6c095;text-align:left}
table.res tr.win{background:rgba(242,200,75,.35);font-weight:bold}
.nug{display:inline-block;min-width:20px;padding:1px 5px;margin:1px;border-radius:10px;background:#f2c84b;color:#3a250b;font-size:12px;font-weight:bold;text-align:center;border:1px solid #b07d10}
.rules p,.rules li{font-size:15px;line-height:1.45}
.turnflag{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:bold}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.legend svg{width:38px;height:38px}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<div id="setup">
  <h1 class="logo">GOLD</h1>
  <p class="sub">La ruée vers l'or — mémoire &amp; opportunisme</p>
  <div class="panel">
    <h2>⛏️ Joueurs</h2>
    <div class="row">
      <span>Nombre de joueurs :</span>
      <div class="seg" id="nbSeg">
        <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
      </div>
      <button class="btn" id="allRandom">🎲 Tous les noms au hasard</button>
    </div>
    <div id="prows"></div>
    <div class="note" id="colorNote"></div>

    <h2 style="margin-top:16px">⚙️ Options</h2>
    <div class="opts">
      <label>Manches : <select id="optRounds"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Niveau ordinateur : <select id="optLevel"><option value="easy">Facile</option><option value="normal" selected>Normal</option><option value="expert">Expert</option></select></label>
      <label>Vitesse : <select id="optSpeed"><option value="slow">Lente</option><option value="normal" selected>Normale</option><option value="fast">Rapide</option></select></label>
      <label><input type="checkbox" id="optRisk" checked> Afficher les % de risque</label>
      <label><input type="checkbox" id="optHide"> Butin caché (règle officielle)</label>
      <label><input type="checkbox" id="optMusic" checked> Musique d'ambiance</label>
      <label><input type="checkbox" id="optSfx" checked> Bruitages</label>
    </div>
    <button class="go" id="startBtn">À LA MINE !</button>
    <p class="note" style="text-align:center"><a href="#" id="rulesLink" style="color:#6b3f12">📜 Lire les règles</a></p>
  </div>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="hidden">
  <div class="topbar">
    <span class="t">GOLD</span>
    <span class="info" id="roundInfo"></span>
    <span class="info" id="leftInfo"></span>
    <span class="sp"></span>
    <button class="ibtn" id="tRisk" title="Pourcentages de risque">📊 %</button>
    <button class="ibtn" id="tMusic" title="Musique">🎵</button>
    <button class="ibtn" id="tSfx" title="Bruitages">🔊</button>
    <button class="ibtn" id="tRules" title="Règles">📜</button>
    <button class="ibtn" id="tMenu" title="Nouvelle partie">🏠 Menu</button>
  </div>
  <div class="main">
    <div class="side" id="players"></div>
    <div class="center">
      <div class="msg" id="msg"></div>
      <div class="board" id="board"></div>
    </div>
    <div class="side">
      <div class="box" id="riskBox"><h3>📊 Risques</h3><div id="risk"></div></div>
      <div class="box"><h3>⛏️ La mine</h3><div id="mineStats"></div></div>
      <div class="box"><h3>📜 Journal</h3><div id="log"></div></div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="panel" id="modalBody"></div></div>
<div id="rushB" class="rushbanner hidden"><span>RUÉE VERS L'OR !</span></div>

<script>
/* =========================================================
   DONNÉES
   ========================================================= */
const COLORS=[
  {k:'red',   n:'Rouge',  c:'#d8392f', d:'#7e1a14', l:'#f07a6e'},
  {k:'blue',  n:'Bleu',   c:'#2f86d6', d:'#164a7c', l:'#7cb9ee'},
  {k:'green', n:'Vert',   c:'#63ad3c', d:'#2f5f19', l:'#a6d97f'},
  {k:'purple',n:'Violet', c:'#6f4fc0', d:'#38246f', l:'#a891e6'},
  {k:'orange',n:'Orange', c:'#ea8a2c', d:'#8f4a0d', l:'#f7b876'}
];
const COL=Object.fromEntries(COLORS.map(c=>[c.k,c]));
const NAMES=["Jack la Pépite","Rosa Filon","Bill Dynamite","Martha Bonanza","Lou Grisou","Old Pete","Ada Klondike","Max Tamis",
 "Nina Sierra","Hank Silex","Ruby Rivière","Gus Galerie","Ella Carat","Tom Wagonnet","Daisy Ducat","Zeke Lanterne","Belle Nugget",
 "Sam Pioche","Clem Batée","Ike Placer","Molly Quartz","Joe Bourbier","Lily Lingot","Abe Boisseau","Kitty Comstock","Walt Wagon"];
const LEVELS={easy:{mem:.4,forget:.12,rnd:.3},normal:{mem:.75,forget:.04,rnd:.08},expert:{mem:1,forget:0,rnd:0}};
const SPEEDS={slow:{ai:1300,view:1700,res:1300},normal:{ai:800,view:1150,res:950},fast:{ai:350,view:650,res:550}};

/* =========================================================
   SVG DES CARTES (dessins originaux)
   ========================================================= */
function svgBack(ring){
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#e8d9b8" stroke="${ring||'#7a5530'}" stroke-width="${ring?6:2.5}"/>
  <circle cx="50" cy="50" r="42" fill="#ddc9a0"/>
  <path d="M27 86 L27 44 Q50 26 73 44 L73 86 Z" fill="#1d130b"/>
  <path d="M38 86 L46 50 M62 86 L54 50" stroke="#6b6b6b" stroke-width="2.2"/>
  <path d="M40 78h20M42 70h16M44 62h12M45.5 55h9" stroke="#7a5530" stroke-width="2"/>
  <rect x="21" y="38" width="8" height="50" rx="1.5" fill="#8b5a2b" stroke="#5a3916" stroke-width="1.2"/>
  <rect x="71" y="38" width="8" height="50" rx="1.5" fill="#8b5a2b" stroke="#5a3916" stroke-width="1.2"/>
  <rect x="15" y="29" width="70" height="11" rx="2" fill="#a36a31" stroke="#5a3916" stroke-width="1.4"/>
  <path d="M22 34h56" stroke="#7a4d22" stroke-width="1"/>
  <circle cx="50" cy="56" r="3.2" fill="#ffd25a"/><circle cx="50" cy="56" r="7" fill="#ffd25a" opacity=".25"/>
  <path d="M50 40v12" stroke="#3a2a1a" stroke-width="1"/></svg>`;
}
function nugget(x,y,s,rot){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M-9 -2 L-5 -8 L3 -9 L9 -4 L10 3 L5 8 L-4 8 L-10 3 Z" fill="#f8d553" stroke="#a97508" stroke-width="1.4"/>
  <path d="M-4 -5 L2 -6 L5 -2" stroke="#fff6c4" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-2 3 L4 4" stroke="#c99a1a" stroke-width="1.2"/></g>`;
}
function svgGold(v){
  const pos=[[[50,47,1.5,10]],[[38,44,1.2,-15],[61,50,1.3,20]],[[36,40,1.05,0],[63,40,1.1,30],[50,60,1.15,-20]],[[35,38,1,0],[64,37,1.05,25],[37,62,1.05,-30],[63,62,1.1,10]]][v-1];
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#f1c84c" stroke="#a97508" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="#f6d872"/>
  <circle cx="30" cy="26" r="3" fill="#9a8f80"/><circle cx="74" cy="72" r="2.5" fill="#9a8f80"/><circle cx="24" cy="66" r="2" fill="#9a8f80"/><circle cx="78" cy="30" r="2.2" fill="#9a8f80"/>
  ${pos.map(p=>nugget(...p)).join('')}
  <text x="50" y="22" font-size="17" font-weight="900" text-anchor="middle" fill="#4a2c06" stroke="#fff3c0" stroke-width="3" paint-order="stroke" font-family="Georgia">${v}</text>
  <text x="50" y="91" font-size="17" font-weight="900" text-anchor="middle" fill="#4a2c06" stroke="#fff3c0" stroke-width="3" paint-order="stroke" font-family="Georgia" transform="rotate(180 50 85)">${v}</text></svg>`;
}
function svgPro(color,v){
  const C=COL[color];
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="${C.c}" stroke="${C.d}" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="${C.l}" opacity=".35"/>
  <path d="M62 30 L82 72" stroke="#6b4423" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 24 Q60 30 56 40 M70 24 Q78 34 76 42" stroke="#9aa1a8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M22 92 Q24 60 50 58 Q76 60 78 92 Z" fill="${C.d}"/>
  <path d="M28 62 Q26 30 50 20 Q74 30 72 62 Q64 70 50 70 Q36 70 28 62 Z" fill="${C.c}" stroke="${C.d}" stroke-width="2"/>
  <ellipse cx="50" cy="48" rx="15" ry="17" fill="#f1c9a0"/>
  <path d="M35 50 Q37 70 50 72 Q63 70 65 50 Q58 58 50 58 Q42 58 35 50 Z" fill="#5a3a22"/>
  <path d="M41 44 h6 M53 44 h6" stroke="#2a1a0d" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M44 56 Q50 59 56 56" stroke="#2a1a0d" stroke-width="1.6" fill="none"/>
  <path d="M36 36 Q50 28 64 36" stroke="${C.d}" stroke-width="3" fill="none"/>
  <circle cx="20" cy="26" r="11" fill="#fff" stroke="${C.d}" stroke-width="2"/><text x="20" y="31.5" font-size="15" font-weight="900" text-anchor="middle" fill="${C.d}" font-family="Georgia">${v}</text>
  <circle cx="80" cy="80" r="11" fill="#fff" stroke="${C.d}" stroke-width="2"/><text x="80" y="85.5" font-size="15" font-weight="900" text-anchor="middle" fill="${C.d}" font-family="Georgia">${v}</text></svg>`;
}
function svgDyn(){
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#2b2a3a" stroke="#14131c" stroke-width="2.5"/>
  <path d="M50 8 L57 30 L78 16 L68 38 L92 40 L71 52 L88 70 L64 64 L62 90 L50 70 L38 90 L36 64 L12 70 L29 52 L8 40 L32 38 L22 16 L43 30 Z" fill="#f08a1c"/>
  <path d="M50 22 L55 37 L68 30 L62 43 L77 45 L64 52 L73 63 L59 60 L57 74 L50 62 L43 74 L41 60 L27 63 L36 52 L23 45 L38 43 L32 30 L45 37 Z" fill="#ffd34a"/>
  <g transform="rotate(-18 50 55)"><rect x="34" y="40" width="10" height="36" rx="3" fill="#c8241c" stroke="#5c0d08" stroke-width="1.5"/>
  <rect x="45" y="38" width="10" height="38" rx="3" fill="#d92c22" stroke="#5c0d08" stroke-width="1.5"/>
  <rect x="56" y="40" width="10" height="36" rx="3" fill="#c8241c" stroke="#5c0d08" stroke-width="1.5"/>
  <rect x="32" y="52" width="36" height="5" fill="#3a2a1a"/><rect x="32" y="64" width="36" height="5" fill="#3a2a1a"/>
  <path d="M50 38 Q52 28 60 26" stroke="#222" stroke-width="2" fill="none"/></g>
  <circle cx="64" cy="20" r="4" fill="#fff6a0"/><circle cx="64" cy="20" r="8" fill="#ffd34a" opacity=".45"/></svg>`;
}
function svgFace(c){return c.type==='gold'?svgGold(c.value):c.type==='pro'?svgPro(c.color,c.value):svgDyn();}
function svgEntrance(colors){ // ring with player colors
  if(colors.length===1) return svgBack(COL[colors[0]].c);
  const a=COL[colors[0]].c,b=COL[colors[1]]?COL[colors[1]].c:a;
  return `<svg viewBox="0 0 100 100"><path d="M50 2 A48 48 0 0 0 50 98" fill="none" stroke="${a}" stroke-width="7"/><path d="M50 2 A48 48 0 0 1 50 98" fill="none" stroke="${b}" stroke-width="7"/>${svgBack().replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>`;
}

/* =========================================================
   AUDIO (Web Audio, tout est synthétisé)
   ========================================================= */
const A={ctx:null,musicOn:true,sfxOn:true,timer:null,nextT:0,step:0,
  init(){
    if(this.ctx) {if(this.ctx.state==='suspended')this.ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{
    const c=this.ctx=new AC();
    this.master=c.createGain();this.master.gain.value=.9;this.master.connect(c.destination);
    this.sfx=c.createGain();this.sfx.gain.value=this.sfxOn?.75:0;this.sfx.connect(this.master);
    this.music=c.createGain();this.music.gain.value=0;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
    this.music.connect(lp);lp.connect(this.master);
    const d=c.createDelay(2);d.delayTime.value=.48;const fb=c.createGain();fb.gain.value=.42;const wet=c.createGain();wet.gain.value=.4;
    const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=1400;
    lp.connect(d);d.connect(dlp);dlp.connect(fb);fb.connect(d);dlp.connect(wet);wet.connect(this.master);
    const len=c.sampleRate*1.5,buf=c.createBuffer(1,len,c.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=Math.random()*2-1; this.noiseBuf=buf;
    this.startMusic();
    }catch(e){this.ctx=null}
  },
  tone(f,t,dur,type='sine',vol=.2,dest,att=.006,f2){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+dur+.05);
  },
  noise(t,dur,vol,ft,ff,ff2){
    const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noiseBuf;
    f.type=ft;f.frequency.setValueAtTime(ff,t);if(ff2)f.frequency.exponentialRampToValueAtTime(ff2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.sfx);s.start(t);s.stop(t+dur+.05);
  },
  play(name){
    if(!this.ctx||!this.sfxOn) return; const t=this.ctx.currentTime+.01;
    switch(name){
      case 'flip': this.noise(t,.07,.35,'bandpass',2600);this.tone(520,t,.06,'triangle',.07);break;
      case 'gold': [1047,1319,1568,2093,2637].forEach((f,i)=>this.tone(f,t+i*.065,.55,'triangle',.16));
                   this.tone(3136,t+.32,.8,'sine',.05);this.tone(4186,t+.4,.7,'sine',.03);break;
      case 'coin': [1568,2093].forEach((f,i)=>this.tone(f,t+i*.08,.4,'triangle',.15));break;
      case 'boom': this.noise(t,1.4,1,'lowpass',1500,80);this.tone(110,t,.8,'sine',.8,null,.005,35);this.noise(t,.25,.5,'highpass',2500);break;
      case 'chase':this.tone(660,t,.1,'square',.07);this.tone(440,t+.09,.12,'square',.07);this.tone(330,t+.19,.18,'square',.06);this.noise(t+.05,.2,.12,'highpass',3500);break;
      case 'nothing':this.tone(330,t,.2,'sine',.12);this.tone(247,t+.13,.3,'sine',.1);break;
      case 'lost': this.tone(440,t,.25,'triangle',.12);this.tone(370,t+.18,.25,'triangle',.11);this.tone(294,t+.36,.45,'triangle',.1);break;
      case 'rush': [392,523,659,784,1047,784,1047].forEach((f,i)=>{this.tone(f,t+i*.11,.28,'sawtooth',.06);this.tone(f*2,t+i*.11,.2,'triangle',.05)});
                   this.noise(t,.6,.15,'bandpass',800);break;
      case 'win':  [[523,0],[659,.15],[784,.3],[1047,.45],[784,.7],[1047,.85]].forEach(([f,d])=>{this.tone(f,t+d,.5,'sawtooth',.06);this.tone(f,t+d,.6,'triangle',.12);this.tone(f/2,t+d,.6,'sine',.1)});break;
      case 'turn': this.tone(880,t,.15,'sine',.06);break;
      case 'click':this.tone(700,t,.05,'triangle',.06);break;
    }
  },
  setMusic(on){this.musicOn=on;if(this.ctx){this.music.gain.cancelScheduledValues(this.ctx.currentTime);this.music.gain.setTargetAtTime(on?.32:0,this.ctx.currentTime,.8);}},
  setSfx(on){this.sfxOn=on;if(this.ctx)this.sfx.gain.value=on?.75:0;},
  startMusic(){
    const c=this.ctx;this.nextT=c.currentTime+.2;this.setMusic(this.musicOn);
    const chords=[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,123.47,146.83,164.81]];
    const penta=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
    const pad=(f,t,d)=>{[0,-4,4].forEach(det=>{const o=c.createOscillator(),g=c.createGain();o.type=det?'sine':'triangle';o.frequency.value=f;o.detune.value=det*2;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(det?.035:.03,t+2.2);g.gain.setValueAtTime(det?.035:.03,t+d-2);g.gain.linearRampToValueAtTime(0.0001,t+d+.5);
      o.connect(g);g.connect(this.music);o.start(t);o.stop(t+d+.6);});};
    this.timer=setInterval(()=>{
      if(!this.ctx) return;
      while(this.nextT<c.currentTime+1.5){
        const t=this.nextT,ch=chords[this.step%4];
        ch.forEach(f=>pad(f,t,8));
        this.tone(ch[0]/2,t,7.5,'sine',.06,this.music,2.5);
        // notes pincées douces
        let tt=t+.6;
        while(tt<t+7.6){ if(Math.random()<.62){const f=penta[Math.floor(Math.random()*penta.length)];this.tone(f,tt,1.6,'triangle',.035,this.music,.01);}
          tt+= [0.5,1,1,1.5][Math.floor(Math.random()*4)]; }
        this.nextT+=8;this.step++;
      }
    },300);
  }
};

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let setup={n:2,rows:[]};
let S=null, TOKEN=0;
const store={get(k,d){try{const v=localStorage.getItem('gold_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gold_'+k,JSON.stringify(v))}catch(e){}}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randName(exclude){const pool=NAMES.filter(n=>!exclude.includes(n));return pool[Math.floor(Math.random()*pool.length)]}

/* ---------------- Setup UI ---------------- */
function initSetup(){
  const saved=store.get('setup',null);
  setup.n=saved?.n||2;
  for(let i=0;i<4;i++){
    const r=saved?.rows?.[i];
    setup.rows[i]={name:r?.name||'',ai:r?r.ai:(i>0)};
  }
  const o=store.get('opts',{});
  if(o.level)$('#optLevel').value=o.level; if(o.speed)$('#optSpeed').value=o.speed;
  if(o.risk!=null)$('#optRisk').checked=o.risk; if(o.hide!=null)$('#optHide').checked=o.hide;
  if(o.music!=null)$('#optMusic').checked=o.music; if(o.sfx!=null)$('#optSfx').checked=o.sfx;
  document.querySelectorAll('#nbSeg button').forEach(b=>b.onclick=()=>{setup.n=+b.dataset.n;A.init();A.play('click');renderSetup(true)});
  $('#allRandom').onclick=()=>{A.init();const used=[];for(let i=0;i<setup.n;i++){setup.rows[i].name=randName(used);used.push(setup.rows[i].name)}A.play('coin');renderSetup()};
  $('#startBtn').onclick=startGame;
  $('#rulesLink').onclick=e=>{e.preventDefault();showRules()};
  renderSetup(true);
}
function renderSetup(resetRounds){
  document.querySelectorAll('#nbSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.n===setup.n));
  if(resetRounds) $('#optRounds').value=String(setup.n===1?3:setup.n);
  const box=$('#prows');box.innerHTML='';
  for(let i=0;i<setup.n;i++){
    const r=setup.rows[i];
    if(setup.n===1) r.ai=false;
    const d=document.createElement('div');d.className='prow';
    d.innerHTML=`<div class="pnum">${i+1}</div>
      <input maxlength="20" placeholder="Nom du joueur ${i+1}" value="${(r.name||'').replace(/"/g,'&quot;')}">
      <button class="btn" title="Nom au hasard">🎲</button>
      <button class="btn typebtn ${r.ai?'ai':''}" ${setup.n===1?'disabled title="En solo, vous jouez contre les Bandits"':''}>${r.ai?'🤖 Ordinateur':'👤 Joueur'}</button>`;
    const [inp,dice,typ]=[d.querySelector('input'),d.querySelectorAll('button')[0],d.querySelectorAll('button')[1]];
    inp.oninput=()=>r.name=inp.value;
    dice.onclick=()=>{A.init();r.name=randName(setup.rows.slice(0,setup.n).map(x=>x.name));inp.value=r.name;A.play('coin')};
    typ.onclick=()=>{A.init();r.ai=!r.ai;A.play('click');renderSetup()};
    box.appendChild(d);
  }
  const notes={1:"Solo : vous recevez 2 couleurs de chercheurs. Les Bandits en possèdent 2 autres — l'or qu'ils attrapent est pour eux. Battez-les !",
    2:"À 2 joueurs, chacun reçoit deux couleurs de chercheurs ; la 5ᵉ couleur n'appartient à personne (son or est perdu).",
    3:"Chaque joueur reçoit une couleur ; les deux couleurs restantes n'appartiennent à personne.",
    4:"Chaque joueur reçoit une couleur ; la couleur restante n'appartient à personne."};
  $('#colorNote').textContent=notes[setup.n];
}

/* ---------------- Démarrage ---------------- */
function startGame(){
  A.init();
  const opts={rounds:+$('#optRounds').value,level:$('#optLevel').value,speed:$('#optSpeed').value,risk:$('#optRisk').checked,
    hide:$('#optHide').checked,music:$('#optMusic').checked,sfx:$('#optSfx').checked};
  store.set('opts',opts);
  const used=[];
  const players=[];
  for(let i=0;i<setup.n;i++){
    const r=setup.rows[i];let name=(r.name||'').trim();
    if(!name){name=randName(used);r.name=name}
    used.push(name);
    players.push({name,ai:r.ai,colors:[],gold:[],total:0,cum:0,roundsWon:0,mem:new Map(),idx:i});
  }
  store.set('setup',{n:setup.n,rows:setup.rows});
  A.setMusic(opts.music);A.setSfx(opts.sfx);
  // couleurs
  const cols=shuffle(COLORS.map(c=>c.k));
  let bandit=null;
  if(setup.n===1){players[0].colors=[cols[0],cols[1]];bandit={name:'Les Bandits',ai:true,neutral:true,colors:[cols[2],cols[3]],gold:[],total:0,cum:0,roundsWon:0}}
  else if(setup.n===2){players[0].colors=[cols[0],cols[1]];players[1].colors=[cols[2],cols[3]]}
  else players.forEach((p,i)=>p.colors=[cols[i]]);
  const ownerOf={};
  players.forEach(p=>p.colors.forEach(c=>ownerOf[c]=p));
  if(bandit) bandit.colors.forEach(c=>ownerOf[c]=bandit);
  const unowned=COLORS.map(c=>c.k).filter(k=>!ownerOf[k]);
  S={players,bandit,ownerOf,unowned,opts,round:0,starter:Math.floor(Math.random()*players.length),grid:[],cur:0,phase:'idle',sel:[],rush:false,stall:0};
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
  syncToggles();
  newRound();
}
function buildDeck(){
  const d=[];let id=0;
  [1,2,3,4].forEach(v=>{for(let i=0;i<6;i++)d.push({id:id++,type:'gold',value:v})});
  COLORS.forEach(c=>[2,2,3,3,4,4,5].forEach(v=>d.push({id:id++,type:'pro',color:c.k,value:v})));
  for(let i=0;i<5;i++)d.push({id:id++,type:'dyn',value:0});
  return shuffle(d);
}
function newRound(){
  TOKEN++;
  S.round++;S.rush=false;S.stall=0;S.sel=[];S.phase='idle';
  S.grid=buildDeck().map(card=>({card,up:false,gone:false}));
  S.players.forEach(p=>{p.gold=[];p.total=0;p.mem=new Map()});
  if(S.bandit){S.bandit.gold=[];S.bandit.total=0}
  S.cur=S.starter;
  $('#log').innerHTML='';
  buildBoard();
  log(`<b>Manche ${S.round}/${S.opts.rounds}</b> — la mine est ouverte !`);
  renderAll();
  startTurn();
}

/* ---------------- Rendu ---------------- */
function buildBoard(){
  const b=$('#board');b.innerHTML='';
  S.grid.forEach((g,i)=>{
    const s=document.createElement('div');s.className='slot';s.dataset.i=i;
    s.innerHTML=`<div class="card"><div class="face back">${svgBack()}</div><div class="face front">${svgFace(g.card)}</div></div>`;
    s.onclick=()=>humanClick(i);
    b.appendChild(s);
  });
}
function renderSlot(i){
  const s=$('#board').children[i],g=S.grid[i];if(!s)return;
  s.querySelector('.card').classList.toggle('up',g.up);
  if(g.gone&&!s.classList.contains('gone')&&!s.classList.contains('taken')&&!s.classList.contains('boom'))s.classList.add('gone');
}
function renderBoardState(){
  const human=isHumanTurn();
  [...$('#board').children].forEach((s,i)=>{
    const g=S.grid[i];
    s.classList.toggle('can',human&&!g.gone&&!g.up&&(S.phase==='pick1'||S.phase==='pick2'||S.phase==='rush'));
    s.classList.toggle('sel',S.sel.includes(i));
  });
}
function cur(){return S.players[S.cur]}
function isHumanTurn(){return S&&!cur().ai&&['pick1','pick2','rush'].includes(S.phase)}
function remaining(){return S.grid.filter(g=>!g.gone).length}
function renderPlayers(){
  const el=$('#players');el.innerHTML='';
  const list=[...S.players];if(S.bandit)list.push(S.bandit);
  list.forEach(p=>{
    const d=document.createElement('div');d.className='pl'+(p===cur()&&S.phase!=='idle'?' active':'');d.id='pl_'+(p.neutral?'b':p.idx);
    const hide=S.opts.hide&&S.phase!=='roundEnd';
    d.innerHTML=`<div class="ent">${svgEntrance(p.colors)}</div>
      <div><div class="nm">${esc(p.name)}</div><div class="ty">${p.neutral?'🤠 Neutres':p.ai?'🤖 Ordinateur':'👤 Joueur'}</div>
      <div class="chips">${p.colors.map(c=>`<span class="chip" title="${COL[c].n}" style="background:${COL[c].c}"></span>`).join('')}</div></div>
      <div class="sc"><b>${hide?'?':p.total}</b><small>${hide?p.gold.length+' carte(s)':p.gold.length+' carte(s) or'}${S.opts.rounds>1?'<br>Total : '+(p.cum):''}</small></div>`;
    el.appendChild(d);
  });
  if(S.unowned.length){
    const u=document.createElement('div');u.className='unowned';
    u.innerHTML=`Sans propriétaire : ${S.unowned.map(c=>`<span class="chip" style="display:inline-block;vertical-align:middle;background:${COL[c].c}"></span> ${COL[c].n}`).join(' · ')} <br><i>(l'or qu'ils attrapent est perdu)</i>`;
    el.appendChild(u);
  }
}
function renderInfo(){
  $('#roundInfo').textContent=`Manche ${S.round}/${S.opts.rounds}`;
  $('#leftInfo').textContent=`• ${remaining()} cartes dans la mine${S.rush?' • RUÉE !':''}`;
  // composition restante
  const left=S.grid.filter(g=>!g.gone).map(g=>g.card);
  const gold=left.filter(c=>c.type==='gold'),dyn=left.filter(c=>c.type==='dyn').length,pro=left.filter(c=>c.type==='pro').length;
  const gv=gold.reduce((a,c)=>a+c.value,0);
  $('#mineStats').innerHTML=`<div class="stat">Pépites restantes <b>${gold.length} (${gv} or)</b></div>
   <div class="stat">Chercheurs restants <b>${pro}</b></div><div class="stat">Dynamites restantes <b>${dyn}</b></div>
   <div class="stat">Ruée vers l'or à <b>≤ 10 cartes</b></div>`;
}
function renderAll(){renderPlayers();renderInfo();renderBoardState();renderRisk();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setMsg(h,k=''){const m=$('#msg');m.className='msg '+k;m.innerHTML=h}
function log(h){const l=$('#log');const d=document.createElement('div');d.innerHTML=h;l.prepend(d)}
function cardName(c){return c.type==='gold'?`pépite <b>${c.value}</b>`:c.type==='dyn'?'<b>dynamite</b>':`chercheur <b style="color:${COL[c.color].l}">${COL[c.color].n} ${c.value}</b>`}
function ownerLabel(color){const o=S.ownerOf[color];return o?esc(o.name):'personne'}

/* ---------------- Probabilités ---------------- */
function outcome(p,a,b){ // pour le joueur p
  if(a.type==='dyn'||b.type==='dyn') return 'boom';
  if(a.type==='gold'&&b.type==='gold') return 'rien';
  if(a.type==='pro'&&b.type==='pro') return a.value===b.value?'rien':'chasse';
  const pr=a.type==='pro'?a:b,gd=a.type==='gold'?a:b;
  if(pr.value<gd.value) return 'rien';
  const o=S.ownerOf[pr.color];
  return o===p?'gain':o?'perte':'perdu';
}
function renderRisk(){
  const box=$('#riskBox');box.classList.toggle('hidden',!S.opts.risk);
  if(!S.opts.risk) return;
  const el=$('#risk');const p=cur();
  if(p.ai||!['pick1','pick2','rush'].includes(S.phase)){el.innerHTML=`<div class="stat">${p.ai&&S.phase!=='idle'?'🤖 '+esc(p.name)+' réfléchit…':'—'}</div>`;return}
  const hidden=S.grid.map((g,i)=>({g,i})).filter(x=>!x.g.gone&&!x.g.up).map(x=>x.g.card);
  const n=hidden.length;if(!n){el.innerHTML='';return}
  const pct=x=>Math.round(100*x/n);
  const bar=(lab,v,col)=>`<div class="bar"><span>${lab}</span><div class="tr"><div class="fl" style="width:${v}%;background:${col}"></div></div><span class="v">${v}%</span></div>`;
  let h='';
  if(S.phase==='rush'){
    const g=hidden.filter(c=>c.type==='gold');const ev=g.reduce((a,c)=>a+c.value,0)/n;
    h+=`<div class="stat">Une carte au hasard :</div>`+bar('💰 Pépite',pct(g.length),'#f2c84b')+bar('✖ Perdue',pct(n-g.length),'#a33');
    h+=`<div class="stat">Gain moyen espéré <b>${ev.toFixed(2)} or</b></div>`;
  } else if(S.phase==='pick1'){
    const mine=hidden.filter(c=>c.type==='pro'&&S.ownerOf[c.color]===p).length;
    const opp=hidden.filter(c=>c.type==='pro'&&S.ownerOf[c.color]&&S.ownerOf[c.color]!==p).length;
    const non=hidden.filter(c=>c.type==='pro'&&!S.ownerOf[c.color]).length;
    h+=`<div class="stat">1ʳᵉ carte, au hasard :</div>`+
      bar('💰 Pépite',pct(hidden.filter(c=>c.type==='gold').length),'#f2c84b')+
      bar('⛏️ Mon chercheur',pct(mine),'#5fbf5a')+
      bar('🤠 Chercheur adverse',pct(opp),'#e0683a')+
      (non?bar('◌ Sans propriétaire',pct(non),'#888'):'')+
      bar('💥 Dynamite',pct(hidden.filter(c=>c.type==='dyn').length),'#c22');
  } else {
    const a=S.grid[S.sel[0]].card;const cnt={gain:0,perte:0,boom:0,chasse:0,rien:0,perdu:0};
    hidden.forEach(c=>cnt[outcome(p,a,c)]++);
    h+=`<div class="stat">Avec ${cardName(a)}, la 2ᵉ carte :</div>`+
      bar('💰 Je gagne de l\'or',pct(cnt.gain),'#5fbf5a')+
      bar('😬 Or pour un rival',pct(cnt.perte),'#e0683a')+
      (cnt.perdu?bar('◌ Or perdu',pct(cnt.perdu),'#888'):'')+
      bar('💥 Explosion',pct(cnt.boom),'#c22')+
      bar('⚔️ Duel chercheurs',pct(cnt.chasse),'#7b8fd6')+
      bar('😴 Rien',pct(cnt.rien),'#9b8a6a');
  }
  h+=`<div class="note" style="color:var(--muted);font-size:11px">Calcul sur les ${n} cartes cachées, sans tenir compte de votre mémoire.</div>`;
  el.innerHTML=h;
}

/* =========================================================
   DÉROULEMENT
   ========================================================= */
async function startTurn(){
  const tk=TOKEN;
  if(remaining()===0) return endRound();
  if(!S.rush&&(remaining()<=10||S.stall>=40)){
    S.rush=true;
    if(S.stall>=40&&remaining()>10) log('La mine s\'épuise : plus rien ne bouge…');
    log('<b>⭐ RUÉE VERS L\'OR !</b> Une seule carte par tour.');
    A.play('rush');const rb=$('#rushB');rb.classList.remove('hidden');rb.firstElementChild.style.animation='none';void rb.offsetWidth;rb.firstElementChild.style.animation='';
    setMsg('⭐ <b>Ruée vers l\'or !</b> Chacun ne retourne plus qu\'une carte : l\'or est pour vous, le reste est défaussé.','good');
    renderAll();
    await sleep(2300);if(tk!==TOKEN)return;rb.classList.add('hidden');
  }
  const p=cur();
  S.sel=[];S.phase=S.rush?'rush':'pick1';
  const flag=p.colors.map(c=>`<span class="chip" style="display:inline-block;vertical-align:middle;background:${COL[c].c}"></span>`).join('');
  if(p.ai) setMsg(`${flag} 🤖 <b>${esc(p.name)}</b> ${S.rush?'cherche une pépite…':'explore la mine…'}`);
  else {setMsg(`${flag} À toi, <b>${esc(p.name)}</b> ! ${S.rush?'Retourne <b>une</b> carte.':'Retourne <b>deux</b> cartes.'}`);A.play('turn')}
  renderAll();
  if(p.ai){
    aiForget(p);
    await sleep(SPEEDS[S.opts.speed].ai);if(tk!==TOKEN)return;
    await aiTurn(p,tk);
  }
}
async function humanClick(i){
  if(!isHumanTurn()) return;
  const g=S.grid[i];if(g.gone||g.up) return;
  const tk=TOKEN;
  if(S.phase==='rush'){S.phase='busy';reveal(i);S.sel=[i];renderAll();await sleep(600);if(tk!==TOKEN)return;return resolveRush(i,tk)}
  if(S.phase==='pick1'){reveal(i);S.sel=[i];S.phase='pick2';setMsg(`${cardName(g.card)} … choisis une 2ᵉ carte.`);renderAll();return}
  if(S.phase==='pick2'){S.phase='busy';reveal(i);S.sel.push(i);renderAll();await sleep(SPEEDS[S.opts.speed].view*.6);if(tk!==TOKEN)return;return resolvePair(S.sel[0],S.sel[1],tk)}
}
function reveal(i){
  const g=S.grid[i];g.up=true;renderSlot(i);A.play('flip');
  const lv=LEVELS[S.opts.level];
  S.players.forEach(p=>{if(p.ai&&Math.random()<lv.mem)p.mem.set(i,g.card)});
}
function removeSlot(i,cls){
  const g=S.grid[i];g.gone=true;g.up=true;
  const s=$('#board').children[i];s.classList.add(cls||'gone');
  S.players.forEach(p=>p.mem.delete(i));
}
function hideSlot(i){S.grid[i].up=false;renderSlot(i)}
function bump(p){renderPlayers();const el=$('#pl_'+(p.neutral?'b':p.idx));if(el){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),700)}}

async function resolvePair(i,j,tk){
  const sp=SPEEDS[S.opts.speed];
  const a=S.grid[i].card,b=S.grid[j].card,p=cur();
  let rem=[],back=[],cls='gone',kind='',msg='',snd='nothing',winner=null,gval=0;
  if(a.type==='dyn'||b.type==='dyn'){
    rem=[i,j];cls='boom';snd='boom';kind='bad';
    msg=`💥 <b>BOUM !</b> ${cardName(a)} + ${cardName(b)} : les deux cartes sont détruites.`;
  } else if((a.type==='pro'&&b.type==='gold')||(a.type==='gold'&&b.type==='pro')){
    const [pi,gi]=a.type==='pro'?[i,j]:[j,i];const pc=S.grid[pi].card,gc=S.grid[gi].card;
    if(pc.value>=gc.value){
      rem=[pi,gi];winner=S.ownerOf[pc.color];gval=gc.value;
      if(winner){snd='gold';kind='good';msg=`💰 Le ${cardName(pc)} attrape la ${cardName(gc)} pour <b>${esc(winner.name)}</b> !${winner!==p&&!winner.neutral?' (même si ce n\'est pas son tour)':''}`}
      else {snd='lost';msg=`Le ${cardName(pc)} n'a pas de propriétaire : la ${cardName(gc)} est perdue.`}
    } else {back=[i,j];msg=`Le ${cardName(pc)} est trop faible pour la ${cardName(gc)}. Rien ne se passe.`}
  } else if(a.type==='pro'&&b.type==='pro'){
    if(a.value!==b.value){const [w,l]=a.value>b.value?[i,j]:[j,i];rem=[l];back=[w];snd='chase';
      msg=`⚔️ Le ${cardName(S.grid[w].card)} chasse le ${cardName(S.grid[l].card)} !`}
    else {back=[i,j];msg=`Deux chercheurs de même force (${a.value}) : rien ne se passe.`}
  } else {back=[i,j];msg='Deux pépites… mais aucun chercheur. Rien ne se passe.'}

  await sleep(sp.view*.5);if(tk!==TOKEN)return;
  setMsg(msg,kind);A.play(snd);log(`<i>${esc(p.name)}</i> : ${msg}`);
  if(cls==='boom'){$('#board').classList.remove('shake');void $('#board').offsetWidth;$('#board').classList.add('shake')}
  await sleep(sp.res);if(tk!==TOKEN)return;
  if(winner){winner.gold.push(gval);winner.total+=gval}
  rem.forEach(x=>removeSlot(x,(winner&&S.grid[x].card.type==='gold')?'taken':cls));
  back.forEach(hideSlot);
  if(winner)bump(winner);
  S.stall=rem.length?0:S.stall+1;
  S.sel=[];S.phase='idle';renderAll();
  await sleep(520);if(tk!==TOKEN)return;
  nextTurn();
}
async function resolveRush(i,tk){
  const sp=SPEEDS[S.opts.speed];const c=S.grid[i].card,p=cur();
  await sleep(sp.view*.4);if(tk!==TOKEN)return;
  if(c.type==='gold'){p.gold.push(c.value);p.total+=c.value;setMsg(`💰 <b>${esc(p.name)}</b> empoche une ${cardName(c)} !`,'good');A.play('gold');removeSlot(i,'taken');bump(p)}
  else {setMsg(`${cardName(c)}… défaussé. Pas de chance, ${esc(p.name)} !`,c.type==='dyn'?'bad':'');A.play(c.type==='dyn'?'boom':'nothing');removeSlot(i,c.type==='dyn'?'boom':'gone')}
  log(`<i>${esc(p.name)}</i> (ruée) : ${cardName(c)}${c.type==='gold'?' gardée':' défaussée'}`);
  S.sel=[];S.phase='idle';renderAll();
  await sleep(sp.res);if(tk!==TOKEN)return;
  nextTurn();
}
function nextTurn(){S.cur=(S.cur+1)%S.players.length;startTurn()}

/* ---------------- Fin de manche / partie ---------------- */
function rankKey(p){return p.total*1000+p.gold.length}
function endRound(){
  S.phase='roundEnd';
  const all=[...S.players];if(S.bandit)all.push(S.bandit);
  const sorted=[...all].sort((a,b)=>rankKey(b)-rankKey(a));
  const best=rankKey(sorted[0]);const winners=sorted.filter(p=>rankKey(p)===best);
  winners.forEach(w=>w.roundsWon++);
  all.forEach(p=>p.cum+=p.total);
  renderAll();
  const humanWon=winners.some(w=>!w.ai&&!w.neutral);
  A.play(humanWon||S.players.every(p=>p.ai)?'win':'lost');
  const last=S.round>=S.opts.rounds;
  let h=`<h2>🏁 Fin de la manche ${S.round}</h2><table class="res"><tr><th>Joueur</th><th>Pépites</th><th>Or</th>${S.opts.rounds>1?'<th>Total</th>':''}</tr>`;
  sorted.forEach(p=>{h+=`<tr class="${winners.includes(p)?'win':''}"><td>${winners.includes(p)?'🏆 ':''}${esc(p.name)}</td><td>${p.gold.sort((a,b)=>b-a).map(v=>`<span class="nug">${v}</span>`).join('')||'—'}</td><td>${p.total}</td>${S.opts.rounds>1?`<td>${p.cum}</td>`:''}</tr>`});
  h+=`</table><p>${winners.length>1?'Égalité parfaite !':`<b>${esc(winners[0].name)}</b> remporte la manche${winners[0].neutral?'… les Bandits ont été plus malins !':' !'}`}</p>`;
  h+=`<button class="go" id="nextBtn">${last?'Résultats finaux':'Manche suivante ⛏️'}</button>`;
  showModal(h);
  $('#nextBtn').onclick=()=>{A.play('click');hideModal();if(last)endGame();else{S.starter=(S.starter+1)%S.players.length;newRound()}};
}
function endGame(){
  S.phase='gameEnd';
  const all=[...S.players];if(S.bandit)all.push(S.bandit);
  const sorted=[...all].sort((a,b)=>(b.cum-a.cum)||(b.roundsWon-a.roundsWon));
  const w=sorted[0];
  const tie=sorted[1]&&sorted[1].cum===w.cum&&sorted[1].roundsWon===w.roundsWon;
  let h=`<h2>🏆 Résultats de la partie</h2><table class="res"><tr><th>#</th><th>Joueur</th><th>Or total</th><th>Manches gagnées</th></tr>`;
  sorted.forEach((p,i)=>h+=`<tr class="${i===0?'win':''}"><td>${['🥇','🥈','🥉','4'][i]||i+1}</td><td>${esc(p.name)}</td><td>${p.cum}</td><td>${p.roundsWon}</td></tr>`);
  h+=`</table><p style="font-size:18px;text-align:center">${tie?'Égalité au sommet !':w.neutral?'Les Bandits repartent avec le magot… Revanche ?':`<b>${esc(w.name)}</b> est le plus riche de l'Ouest !`}</p>
  <div class="row" style="justify-content:center"><button class="go" id="againBtn" style="margin:6px">Rejouer</button><button class="btn" id="menuBtn">🏠 Menu</button></div>`;
  showModal(h);A.play(w.neutral||w.ai&&S.players.some(p=>!p.ai)?'lost':'win');
  $('#againBtn').onclick=()=>{hideModal();startGame()};
  $('#menuBtn').onclick=()=>{hideModal();toMenu()};
}
function showModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}
function hideModal(){$('#modal').classList.add('hidden')}
function toMenu(){TOKEN++;S=null;$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');renderSetup()}

/* =========================================================
   INTELLIGENCE ARTIFICIELLE
   ========================================================= */
function aiForget(p){const f=LEVELS[S.opts.level].forget;if(!f)return;[...p.mem.keys()].forEach(k=>{if(Math.random()<f)p.mem.delete(k)})}
function gain(p,color,g){const o=S.ownerOf[color];if(o===p)return g;if(!o)return 0;return -g*(S.players.length+(S.bandit?1:0)>2?.65:1)}
function pairValue(p,a,b){
  if(a.type==='dyn'||b.type==='dyn'){
    const x=a.type==='dyn'?b:a;
    if(x.type==='dyn')return .1;
    if(x.type==='pro'){const o=S.ownerOf[x.color];return o===p?-.4:o?.15+x.value*.05:.02}
    return -.15*x.value;
  }
  if(a.type==='gold'&&b.type==='gold')return 0;
  if(a.type==='pro'&&b.type==='pro'){
    if(a.value===b.value)return 0;
    const l=a.value>b.value?b:a;const o=S.ownerOf[l.color];return o===p?-.35:o?.3:.03;
  }
  const pr=a.type==='pro'?a:b,gd=a.type==='gold'?a:b;
  return pr.value>=gd.value?gain(p,pr.color,gd.value):0;
}
function aiView(p){ // indices disponibles connus / inconnus + composition inconnue
  const known=[],unknown=[];
  S.grid.forEach((g,i)=>{if(g.gone||g.up)return;if(p.mem.has(i))known.push(i);else unknown.push(i)});
  const knownIds=new Set([...p.mem.values()].map(c=>c.id));
  const pool=S.grid.filter(g=>!g.gone&&!g.up&&!knownIds.has(g.card.id)).map(g=>g.card);
  return {known,unknown,pool};
}
const EXPLORE=.15;
function bestSecond(p,c1,excl,v){
  let best={val:-1e9,idx:null};
  v.known.forEach(i=>{if(i===excl)return;const val=pairValue(p,c1,p.mem.get(i));const adj=val===0?-.05:val;if(adj>best.val)best={val:adj,idx:i}});
  const un=v.unknown.filter(i=>i!==excl);
  if(un.length){
    const pool=v.pool.filter(c=>c!==c1);
    const ev=pool.length?pool.reduce((s,c)=>s+pairValue(p,c1,c),0)/pool.length:0;
    if(ev+EXPLORE>best.val)best={val:ev+EXPLORE,idx:un[Math.floor(Math.random()*un.length)]};
  }
  if(best.idx==null){const any=S.grid.map((g,i)=>i).filter(i=>i!==excl&&!S.grid[i].gone&&!S.grid[i].up);best={val:0,idx:any[Math.floor(Math.random()*any.length)]}}
  return best;
}
function chooseFirst(p){
  const v=aiView(p);const lv=LEVELS[S.opts.level];
  const avail=S.grid.map((g,i)=>i).filter(i=>!S.grid[i].gone&&!S.grid[i].up);
  if(Math.random()<lv.rnd) return {first:avail[Math.floor(Math.random()*avail.length)]};
  // 1) une paire connue rentable ?
  let bp={val:.25,a:null,b:null};
  for(let x=0;x<v.known.length;x++)for(let y=x+1;y<v.known.length;y++){
    const val=pairValue(p,p.mem.get(v.known[x]),p.mem.get(v.known[y]));
    if(val>bp.val)bp={val,a:v.known[x],b:v.known[y]};
  }
  if(bp.a!=null) return {first:bp.a,plan:bp.b};
  // 2) meilleure 1re carte selon espérance
  let best={val:-1e9,first:null};
  v.known.forEach(i=>{const c=p.mem.get(i);const b=bestSecond(p,c,i,v);if(b.val>best.val)best={val:b.val,first:i}});
  if(v.unknown.length&&v.pool.length){
    let s=0;v.pool.forEach(c=>{s+=bestSecond(p,c,-1,v).val});
    const ev=s/v.pool.length+EXPLORE;
    if(ev>=best.val)best={val:ev,first:v.unknown[Math.floor(Math.random()*v.unknown.length)]};
  }
  if(best.first==null)best.first=avail[Math.floor(Math.random()*avail.length)];
  return {first:best.first};
}
async function aiTurn(p,tk){
  const sp=SPEEDS[S.opts.speed];
  if(S.rush){
    const v=aiView(p);let pick=null,bv=-1;
    if(Math.random()>=LEVELS[S.opts.level].rnd){
      v.known.forEach(i=>{const c=p.mem.get(i);if(c.type==='gold'&&c.value>bv){bv=c.value;pick=i}});
      if(pick==null&&v.unknown.length)pick=v.unknown[Math.floor(Math.random()*v.unknown.length)];
    }
    if(pick==null){const av=S.grid.map((g,i)=>i).filter(i=>!S.grid[i].gone&&!S.grid[i].up);pick=av[Math.floor(Math.random()*av.length)]}
    S.phase='busy';reveal(pick);S.sel=[pick];renderAll();
    await sleep(600);if(tk!==TOKEN)return;
    return resolveRush(pick,tk);
  }
  const ch=chooseFirst(p);
  S.phase='busy';reveal(ch.first);S.sel=[ch.first];renderAll();
  setMsg(`🤖 <b>${esc(p.name)}</b> retourne une ${cardName(S.grid[ch.first].card).replace(/^pépite/,'pépite').replace(/^chercheur/,'carte : chercheur')}…`);
  await sleep(sp.ai+300);if(tk!==TOKEN)return;
  let second=ch.plan;
  if(second==null||S.grid[second].gone||S.grid[second].up){
    const v=aiView(p);const c1=S.grid[ch.first].card;
    second=(Math.random()<LEVELS[S.opts.level].rnd)?null:bestSecond(p,c1,ch.first,v).idx;
    if(second==null){const av=S.grid.map((g,i)=>i).filter(i=>i!==ch.first&&!S.grid[i].gone&&!S.grid[i].up);second=av[Math.floor(Math.random()*av.length)]}
  }
  reveal(second);S.sel.push(second);renderAll();
  await sleep(sp.view*.6);if(tk!==TOKEN)return;
  return resolvePair(ch.first,second,tk);
}

/* =========================================================
   BOUTONS EN JEU & RÈGLES
   ========================================================= */
function syncToggles(){
  $('#tRisk').classList.toggle('off',!S.opts.risk);
  $('#tMusic').classList.toggle('off',!A.musicOn);
  $('#tSfx').classList.toggle('off',!A.sfxOn);
}
$('#tRisk').onclick=()=>{S.opts.risk=!S.opts.risk;syncToggles();renderRisk()};
$('#tMusic').onclick=()=>{A.init();A.setMusic(!A.musicOn);syncToggles()};
$('#tSfx').onclick=()=>{A.init();A.setSfx(!A.sfxOn);syncToggles();A.play('click')};
$('#tRules').onclick=showRules;
$('#tMenu').onclick=()=>{showModal(`<h2>Quitter la partie ?</h2><p>La partie en cours sera perdue.</p><div class="row"><button class="go" id="yesQ" style="margin:0">Oui, menu</button><button class="btn" id="noQ">Continuer</button></div>`);
  $('#yesQ').onclick=()=>{hideModal();toMenu()};$('#noQ').onclick=hideModal;};
function showRules(){
  showModal(`<div class="rules"><h2>📜 Règles de Gold</h2>
  <p>Accumulez la plus grande valeur de pépites d'or. Chaque joueur possède une (ou deux) couleur(s) de chercheurs.</p>
  <div class="legend">${svgGold(3)}${svgPro('red',4)}${svgDyn()}${svgBack()}</div>
  <p><b>La mine</b> : 64 cartes face cachée en 8×8 — 24 pépites (1 à 4), 35 chercheurs (5 couleurs, force 2 à 5), 5 dynamites.</p>
  <p><b>À votre tour</b>, retournez deux cartes :</p>
  <ul>
   <li><b>Chercheur + Pépite</b> (chercheur ≥ pépite) : le propriétaire de la couleur du chercheur gagne l'or — même si ce n'est pas son tour ! Le chercheur est défaussé.</li>
   <li><b>Deux chercheurs</b> de forces différentes : le plus fort chasse le plus faible (défaussé) et retourne face cachée.</li>
   <li><b>Dynamite</b> + n'importe quoi : explosion, les deux cartes sont retirées.</li>
   <li><b>Sinon</b> (2 pépites, chercheur trop faible, chercheurs égaux) : rien, les cartes sont recachées. Mémorisez-les !</li>
  </ul>
  <p><b>Ruée vers l'or</b> : dès qu'il reste 10 cartes ou moins au début d'un tour, chacun ne retourne plus qu'une carte : de l'or, vous le gardez ; sinon, elle est défaussée.</p>
  <p><b>Fin</b> : le plus riche gagne la manche (égalité : le plus de cartes or). On joue autant de manches que de joueurs ; le total d'or désigne le vainqueur.</p>
  <p><b>Solo</b> : vous jouez 2 couleurs contre les Bandits (2 couleurs neutres qui ramassent l'or pour eux).</p>
  <button class="go" id="closeR">Compris !</button></div>`);
  $('#closeR').onclick=hideModal;
}
document.addEventListener('pointerdown',()=>A.init(),{once:true});
initSetup();
</script>
