<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14161c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f3efe8;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 18px;background:linear-gradient(#14161cf0,#14161c00);pointer-events:none}

nav button{appearance:none;-webkit-appearance:none;border:1px solid #ffffff2e;background:#ffffff16;color:#f3efe8;font:inherit;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

#play{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);appearance:none;-webkit-appearance:none;border:none;background:#c0392b;color:#fff;font:inherit;font-size:18px;font-weight:800;padding:15px 26px;border-radius:999px;box-shadow:0 6px 24px #000b,0 0 0 4px #e9b87255;cursor:pointer;white-space:nowrap;z-index:5;animation:pp 1.6s ease-in-out infinite}

body.game #play{display:none}
body.game header,body.game nav,body.game #hint{display:none}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
body.game #hud{display:block}
#hud .top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:#14161cd9;border:1px solid #ffffff22;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:650;white-space:nowrap}
.pill.money{background:#e9b872;color:#1b1a17;font-size:16px}
.pill.low{background:#c0392b}
#snd{margin-left:auto;pointer-events:auto;appearance:none;border:1px solid #ffffff33;background:#14161cd9;color:#fff;font-size:15px;width:36px;height:36px;border-radius:50%;cursor:pointer}

.chip.carried{background:#7c5a12;border-color:#e9b872}
.chip.title{background:none;border:none;opacity:.7;padding:6px 2px}
#ind{position:fixed;inset:0;pointer-events:none;display:none}
body.game #ind{display:block}
.ind{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 7px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 8px #0008}
.ind i{position:absolute;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid currentColor}

.pill.money.duo{background:#14161cd9;color:#fff}

<body>
<canvas id="c"></canvas>
<header>
  <h1>Plan 3D — le restaurant du train</h1>
  <p>Reconstitué d'après tes 4 photos · proportions approximatives</p>
</header>
<button id="play">▶&nbsp; JOUER · Mode serveur 🍽️</button>
<div id="hint">Glisse pour tourner · pince pour zoomer · 2 doigts pour déplacer</div>

  <button data-v="3d" class="on">Vue 3D</button>

</nav>
<div id="hud"><div class="top"><span class="pill money" id="hMoney">0 €</span><span class="pill" id="hTime">3:00</span><span class="pill" id="hServed">✅ 0</span><span class="pill" id="hLost">😠 0</span><button id="snd" aria-label="Son">🔊</button><button id="quit" aria-label="Quitter">✕</button></div><div id="kitchen"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const hintEl=document.getElementById('hint');
if(!window.THREE){hintEl.textContent='Le moteur 3D n\'a pas pu se charger.';return;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14161c);
scene.fog=new THREE.Fog(0x14161c,45,90);
const camera=new THREE.PerspectiveCamera(50,1,0.05,200);

let seed=11;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
const H=3.3, T=0.2;

/* ---------- textures ---------- */
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function rep(t,x,y){const c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=THREE.RepeatWrapping;c.repeat.set(x,y);return c;}

const floorTex=tex(512,512,(g,w,h)=>{const ph=32;for(let y=0;y<h;y+=ph){let x=-rnd()*200;while(x<w){const len=120+rnd()*200;g.fillStyle=`hsl(${20+rnd()*8},${26+rnd()*10}%,${17+rnd()*9}%)`;g.fillRect(x,y,len,ph);for(let i=0;i<6;i++){g.strokeStyle=`rgba(0,0,0,${.05+rnd()*.1})`;g.lineWidth=1;g.beginPath();g.moveTo(x,y+rnd()*ph);g.lineTo(x+len,y+rnd()*ph);g.stroke();}g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x,y,len,1.5);g.fillRect(x,y,1.5,ph);x+=len;}}});
const boardTex=tex(512,256,(g,w,h)=>{let x=0;const cols=['#8d7c68','#a3907a','#6e6152','#b4a48e','#7c6a57','#94846f','#857766'];while(x<w){const bw=34+rnd()*36;g.fillStyle=cols[Math.floor(rnd()*cols.length)];g.fillRect(x,0,bw,h);for(let i=0;i<10;i++){g.strokeStyle=`rgba(40,30,20,${.08+rnd()*.12})`;g.lineWidth=1;g.beginPath();const xx=x+rnd()*bw;g.moveTo(xx,0);g.bezierCurveTo(xx+rnd()*6-3,h*.3,xx+rnd()*6-3,h*.7,xx+rnd()*4-2,h);g.stroke();}if(rnd()<.35){g.fillStyle='rgba(50,35,25,.55)';g.beginPath();g.ellipse(x+bw/2,rnd()*h,3+rnd()*3,5+rnd()*4,0,0,7);g.fill();}g.fillStyle='rgba(20,15,10,.6)';g.fillRect(x,0,2,h);x+=bw;}});
const ceilTex=tex(128,128,(g,w,h)=>{g.fillStyle='#17181b';g.fillRect(0,0,w,h);g.fillStyle='#2e3036';g.fillRect(0,0,w,2);g.fillRect(0,0,2,h);});
const tuftTex=tex(256,256,(g,w,h)=>{g.fillStyle='#6e3b22';g.fillRect(0,0,w,h);for(let y=0;y<=h;y+=42)for(let x=(y/42%2)*32;x<=w;x+=64){const gr=g.createRadialGradient(x,y,1,x,y,26);gr.addColorStop(0,'rgba(20,8,2,.85)');gr.addColorStop(.25,'rgba(30,12,4,.35)');gr.addColorStop(1,'rgba(255,220,180,.1)');g.fillStyle=gr;g.beginPath();g.arc(x,y,26,0,7);g.fill();}});
const pleatTex=tex(64,64,(g,w,h)=>{for(let y=0;y<h;y+=8){g.fillStyle='#d9d7d2';g.fillRect(0,y,w,4);g.fillStyle='#b9b6b0';g.fillRect(0,y+4,w,4);}});
const matTex=tex(256,192,(g,w,h)=>{g.fillStyle='#f3f1ec';g.fillRect(0,0,w,h);g.strokeStyle='#2a2a2a';g.lineWidth=5;g.lineJoin='round';for(let k=0;k<3;k++){g.beginPath();let x=10,y=30+k*55;g.moveTo(x,y);while(x<w-10){x+=30+rnd()*40;g.lineTo(x,y);if(rnd()<.5){y+=(rnd()<.5?-1:1)*30;y=Math.max(15,Math.min(h-15,y));g.lineTo(x,y);}}g.stroke();}});
const outTex=tex(1024,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#c9d2da');gr.addColorStop(.44,'#eef0f1');gr.addColorStop(.47,'#8a8f93');gr.addColorStop(.55,'#9aa0a3');gr.addColorStop(.57,'#6f8a4c');gr.addColorStop(1,'#4c7630');g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<12;i++){g.fillStyle=['#b33','#ddd','#333','#567'][i%4];g.fillRect(rnd()*w,h*.48,18,7);}for(let i=0;i<2500;i++){g.fillStyle=`rgba(${40+rnd()*40},${90+rnd()*50},${30+rnd()*20},.5)`;g.fillRect(rnd()*w,h*.58+rnd()*h*.42,2,3);}g.strokeStyle='rgba(90,90,90,.6)';g.lineWidth=2;for(let i=0;i<16;i++){const x=rnd()*w;g.beginPath();g.moveTo(x,h*.47);g.lineTo(x,h*.27);g.stroke();}});
function disc(g,c){g.fillStyle='#1f2f5e';g.beginPath();g.arc(c,c,256,0,7);g.fill();g.fillStyle='#f7f5ef';g.beginPath();g.arc(c,c,226,0,7);g.fill();}
const clockTex=tex(512,512,(g)=>{const c=256;disc(g,c);g.fillStyle='#1d2647';g.textAlign='center';g.textBaseline='middle';g.font='bold 50px Georgia,serif';const R=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];for(let i=0;i<12;i++){const a=i*Math.PI/6;g.save();g.translate(c+Math.sin(a)*172,c-Math.cos(a)*172);g.rotate(a);g.fillText(R[i],0,0);g.restore();}g.strokeStyle='#1d2647';g.lineCap='round';const hand=(a,l,wd)=>{g.lineWidth=wd;g.beginPath();g.moveTo(c,c);g.lineTo(c+Math.sin(a)*l,c-Math.cos(a)*l);g.stroke();};hand(6*Math.PI/180,110,14);hand(72*Math.PI/180,165,9);g.fillStyle='#1d2647';g.beginPath();g.arc(c,c,14,0,7);g.fill();});
const trainTex=tex(512,512,(g)=>{const c=256;disc(g,c);g.fillStyle='#1d2647';g.fillRect(130,230,200,80);g.fillRect(310,170,80,140);g.fillStyle='#f7f5ef';g.fillRect(325,190,50,40);g.fillStyle='#1d2647';g.fillRect(160,180,30,52);g.fillRect(115,300,290,18);for(const x of [170,240,320]){g.beginPath();g.arc(x,335,28,0,7);g.fill();}g.fillStyle='#f7f5ef';for(const x of [170,240,320]){g.beginPath();g.arc(x,335,9,0,7);g.fill();}g.fillStyle='#1d2647';[[175,150,16],[150,120,20],[118,92,24]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill();});});
const posterTex=tex(512,640,(g,w,h)=>{g.fillStyle='#f4f2ec';g.fillRect(0,0,w,h);g.strokeStyle='#1d2647';g.lineWidth=6;g.strokeRect(24,24,w-48,h-48);g.fillStyle='#1d2647';g.textAlign='center';g.font='bold 38px Helvetica,Arial,sans-serif';['BIENVENUE À BORD,','VOTRE VOYAGE','GUSTATIF','COMMENCE ICI.'].forEach((t,i)=>g.fillText(t,w/2,110+i*48));g.fillRect(90,440,330,70);g.fillRect(150,405,210,40);g.fillStyle='#f4f2ec';for(let i=0;i<5;i++)g.fillRect(170+i*38,415,24,22);g.fillStyle='#1d2647';g.lineWidth=3;g.beginPath();g.moveTo(230,405);g.lineTo(260,370);g.lineTo(290,405);g.stroke();for(const x of [130,180,330,380]){g.beginPath();g.arc(x,520,16,0,7);g.fill();}g.fillRect(60,540,392,5);});
const photoTex=tex(256,160,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#d8d2c4');gr.addColorStop(1,'#8b8478');g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='#9b2b22';g.fillRect(40,60,170,60);g.fillStyle='#2b2b2b';g.fillRect(40,112,170,8);g.fillStyle='#f0e6d0';for(let i=0;i<4;i++)g.fillRect(60+i*36,72,22,18);g.fillStyle='#555';g.fillRect(0,130,w,4);});
function signTex(text,bg,fg,w,h,font){w=w||512;h=h||128;return tex(w,h,(g)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle=fg;g.lineWidth=6;g.strokeRect(8,8,w-16,h-16);g.fillStyle=fg;g.font=font||'bold 54px Helvetica,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';const L=text.split('\n');L.forEach((t,i)=>g.fillText(t,w/2,h/2+(i-(L.length-1)/2)*h/(L.length+0.4)));});}

/* ---------- materials ---------- */
const mat=(color,o)=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:0},o||{}));
const M={
  navy:mat(0x1e2944),white:mat(0xe9e6df),cream:mat(0xf1ede4),black:mat(0x161719,{roughness:.6}),
  iron:mat(0x222326,{roughness:.5,metalness:.6}),tableWood:mat(0xb3824f,{roughness:.6}),
  chairWood:mat(0x5a3a26,{roughness:.55}),green:mat(0x667f6c,{roughness:.95}),
  boucle:mat(0xe6dfd2,{roughness:1}),boucleDS:mat(0xe6dfd2,{roughness:1,side:THREE.DoubleSide}),
  copper:mat(0xc0764a,{metalness:.85,roughness:.35}),steel:mat(0xb9bcc0,{metalness:.9,roughness:.3}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe6f5,transparent:true,opacity:.16,roughness:.05,depthWrite:false,side:THREE.DoubleSide}),
  cup:new THREE.MeshStandardMaterial({color:0xe8f2f6,transparent:true,opacity:.4,roughness:.1,depthWrite:false}),
  slat:mat(0x9b6b3d,{roughness:.7}),slatGray:mat(0xd5d1c9),plant:mat(0x4f7a3a),choco:mat(0x4a2512,{roughness:.3}),
  bulb:new THREE.MeshBasicMaterial({color:0xffe2b0}),
  amber:new THREE.MeshStandardMaterial({color:0xc56a2b,emissive:0xd0702a,emissiveIntensity:.9,transparent:true,opacity:.85,roughness:.2}),
  exitG:new THREE.MeshBasicMaterial({color:0x22c55e}),
  silver:mat(0xc9ccd0,{metalness:.6,roughness:.4}),trainNavy:mat(0x26365e,{metalness:.3,roughness:.5}),
  boards:mat(0xffffff,{map:rep(boardTex,6,1)}),leather:mat(0xffffff,{map:rep(tuftTex,3,2),roughness:.55}),
  mat:mat(0xffffff,{map:matTex}),
};

/* ---------- helpers ---------- */
function add(o,p,sh){o.castShadow=sh!==false;o.receiveShadow=true;(p||scene).add(o);return o;}
function box(w,h,d,m,x,y,z,p,sh){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return add(o,p,sh);}
function boxB(w,h,d,m,x,y0,z,p,sh){return box(w,h,d,m,x,y0+h/2,z,p,sh);}
function cyl(rt,rb,h,m,x,y,z,p,seg){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),m);o.position.set(x,y,z);return add(o,p);}
function plane(w,h,m,p){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.receiveShadow=true;(p||scene).add(o);return o;}
function noShadow(g){g.traverse(o=>{o.castShadow=false;});}
const OBST=[],TABLES=[];
function block(x,z,w,d){OBST.push([x-w/2,z-d/2,x+w/2,z+d/2]);}

/* ---------- ground & floor ---------- */
const grass=plane(90,90,mat(0x4d5e3a,{roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.y=-0.02;
const pave=plane(30,19,mat(0x7d8084,{roughness:1}));pave.rotation.x=-Math.PI/2;pave.position.set(-1.5,-0.01,-0.5);
const floor=plane(22,13,mat(0xffffff,{map:rep(floorTex,8.8,5.2),roughness:.75}));floor.rotation.x=-Math.PI/2;floor.position.set(0,0.005,-0.5);

/* ---------- walls (with automatic cutaway) ---------- */
const cut=[];
function wallGroup(pos,rotY,n){const g=new THREE.Group();g.position.copy(pos);g.rotation.y=rotY;scene.add(g);cut.push({g,n,p:pos.clone()});return g;}
function wall(len,h,m,wins,g){wins=wins.slice().sort((a,b)=>a.u-b.u);let x=-len/2;
  for(const wd of wins){const a=wd.u-wd.w/2,b=wd.u+wd.w/2;
    if(a>x)boxB(a-x,h,T,m,(x+a)/2,0,0,g);
    boxB(wd.w,wd.y0,T,m,wd.u,0,0,g);boxB(wd.w,h-wd.y1,T,m,wd.u,wd.y1,0,g);
    const ft=0.05,fm=M.black;
    boxB(wd.w,ft,T+0.04,fm,wd.u,wd.y0,0,g);boxB(wd.w,ft,T+0.04,fm,wd.u,wd.y1-ft,0,g);
    boxB(ft,wd.y1-wd.y0,T+0.04,fm,a+ft/2,wd.y0,0,g);boxB(ft,wd.y1-wd.y0,T+0.04,fm,b-ft/2,wd.y0,0,g);
    const gl=plane(wd.w,wd.y1-wd.y0,M.glass,g);gl.position.set(wd.u,(wd.y0+wd.y1)/2,0);

  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;if(lastPinch){zoom(lastPinch/d);pan(mx-lastMid.x,my-lastMid.y);}lastPinch=d;lastMid={x:mx,y:my};}});

function getView(name){const a=camera.aspect,t=Math.tan(25*Math.PI/180);
  if(name==='plan'){const portrait=a<1;const Lv=portrait?27:16,Lh=portrait?16:27;const r=Math.max(Lv/2/t,Lh/2/(t*a))*1.05+3;return portrait?{mode:'orbit',pos:[-1.5-r*.022,r,-.5],look:[-1.5,0,-.5]}:{mode:'orbit',pos:[-1.5,r,-.5+r*.022],look:[-1.5,0,-.5]};}
  if(name==='table')return{mode:'look',pos:[-8.4,1.22,3.95],look:[-6.3,1.55,0]};
  if(name==='bar')return{mode:'orbit',pos:[3.6,2.0,3.0],look:[-.6,1.3,-3.6]};
  const f=a<1?1+(1-a)*1.3:1;return{mode:'orbit',pos:[-1+14*f,15*f,-.5+17*f],look:[-1,.3,-.5]};}
function currentLook(){if(ctl.mode==='orbit')return ctl.target.clone();const d=new THREE.Vector3();camera.getWorldDirection(d);return camera.position.clone().add(d.multiplyScalar(4));}
function finish(v){const P=V(...v.pos),L=V(...v.look);ctl.mode=v.mode;camera.position.copy(P);
  if(v.mode==='orbit'){ctl.target.copy(L);const o=P.clone().sub(L);ctl.r=o.length();ctl.phi=Math.acos(clamp(o.y/ctl.r,-1,1));ctl.theta=Math.atan2(o.x,o.z);}
  else{const d=L.clone().sub(P).normalize();ctl.yaw=Math.atan2(d.x,d.z);ctl.pitch=Math.asin(d.y);}
  camera.fov=v.mode==='look'?64:50;camera.updateProjectionMatrix();}
let current='3d';
function goTo(name,instant){current=name;const v=getView(name);
  hintEl.textContent=v.mode==='look'?'Glisse pour regarder autour · pince pour zoomer':'Glisse pour tourner · pince pour zoomer · 2 doigts pour déplacer';
  if(instant){finish(v);return;}
  ctl.anim={t:0,fp:camera.position.clone(),fl:currentLook(),tp:V(...v.pos),tl:V(...v.look),f0:camera.fov,f1:v.mode==='look'?64:50,v};
  if(v.mode==='look')ctl.mode='look';}

/* --- grille de déplacement + A* --- */
const CELL=.2,GX0=-11,GZ0=-7,GW=110,GH=65;let grid=null;
function buildGrid(){grid=new Uint8Array(GW*GH);const R=.24;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=GX0+(i+.5)*CELL,z=GZ0+(j+.5)*CELL;let b=x<-10.9+R||x>10.9-R||z<-6.9+R||z>5.9-R;if(!b)for(const o of OBST){if(x>o[0]-R&&x<o[2]+R&&z>o[1]-R&&z<o[3]+R){b=true;break;}}grid[j*GW+i]=b?1:0;}}
const cellOf=(x,z)=>[Math.floor((x-GX0)/CELL),Math.floor((z-GZ0)/CELL)];
const freeC=(i,j)=>i>=0&&j>=0&&i<GW&&j<GH&&!grid[j*GW+i];
const freeAt=(x,z)=>{const c=cellOf(x,z);return freeC(c[0],c[1]);};
function nearestFree(i,j,wi,wj){if(freeC(i,j))return [i,j];for(let r=1;r<45;r++){let best=null,bd=1e9;for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r||!freeC(i+di,j+dj))continue;const d=Math.hypot(i+di-wi,j+dj-wj);if(d<bd){bd=d;best=[i+di,j+dj];}}if(best)return best;}return null;}
function astar(si,sj,ti,tj){const N=GW*GH,g=new Float32Array(N).fill(1e9),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N),hp=[];
  const push=(f,k)=>{hp.push([f,k]);let c=hp.length-1;while(c>0){const p=(c-1)>>1;if(hp[p][0]<=hp[c][0])break;[hp[p],hp[c]]=[hp[c],hp[p]];c=p;}};
  const pop=()=>{const top=hp[0],last=hp.pop();if(hp.length){hp[0]=last;let c=0;for(;;){const l=2*c+1,r=l+1;let m=c;if(l<hp.length&&hp[l][0]<hp[m][0])m=l;if(r<hp.length&&hp[r][0]<hp[m][0])m=r;if(m===c)break;[hp[m],hp[c]]=[hp[c],hp[m]];c=m;}}return top;};
  const s=sj*GW+si,t=tj*GW+ti;const h=k=>{const dx=Math.abs(k%GW-ti),dy=Math.abs(((k/GW)|0)-tj);return Math.max(dx,dy)+.414*Math.min(dx,dy);};
  g[s]=0;push(0,s);
  while(hp.length){const k=pop()[1];if(closed[k])continue;closed[k]=1;if(k===t)break;const i=k%GW,j=(k/GW)|0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ni=i+di,nj=j+dj;if(!freeC(ni,nj))continue;if(di&&dj&&(!freeC(i+di,j)||!freeC(i,j+dj)))continue;
      const nk=nj*GW+ni,ng=g[k]+(di&&dj?1.414:1);if(ng<g[nk]){g[nk]=ng;came[nk]=k;push(ng+h(nk),nk);}}}
  if(s!==t&&came[t]<0)return null;const p=[];let k=t;while(k!==s&&k>=0){p.push(k);k=came[k];}p.reverse();
  return p.map(k=>({x:GX0+((k%GW)+.5)*CELL,z:GZ0+(((k/GW)|0)+.5)*CELL}));}
function los(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.z-a.z)/(CELL*.5));for(let i=1;i<n;i++){const t=i/n;if(!freeAt(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t))return false;}return true;}
function smooth(st,p){const out=[];let cur=st,i=0;while(i<p.length){let j=p.length-1;while(j>i&&!los(cur,p[j]))j--;out.push(p[j]);cur=p[j];i=j+1;}return out;}

function mkSprite(w,h,sc){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.renderOrder=20;s.scale.set(sc*w/h,sc,1);s.userData={c,g:c.getContext('2d'),t};s.visible=false;scene.add(s);return s;}

function bubble(s,txt,bg,fg){const {c,g,t}=s.userData;g.clearRect(0,0,c.width,c.height);g.font=FONT;const lines=txt.split('\n');const lh=c.height/Math.max(2,lines.length+.3);
  let w=0;for(const l of lines)w=Math.max(w,g.measureText(l).width);w=Math.min(c.width-6,w+30);const hh=Math.min(c.height-6,lh*lines.length+16);
  rr(g,(c.width-w)/2,(c.height-hh)/2,w,hh,Math.min(30,hh/2));g.fillStyle=bg||'rgba(255,255,255,.94)';g.fill();
  g.fillStyle=fg||'#111';g.textAlign='center';g.textBaseline='middle';lines.forEach((l,i)=>g.fillText(l,c.width/2,c.height/2+(i-(lines.length-1)/2)*lh+3));t.needsUpdate=true;s.visible=true;}

  g.strokeStyle=col;g.lineCap='round';g.beginPath();g.arc(64,64,47,-Math.PI/2,-Math.PI/2+f*Math.PI*2);g.stroke();
  g.fillStyle='#fff';g.font='bold 38px -apple-system,Roboto,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(r.num,64,67);t.needsUpdate=true;}

/* --- déplacement --- */
const ray=new THREE.Raycaster(),ground=new THREE.Plane(V(0,1,0),0),hit=new THREE.Vector3();
function walkTo(x,z,w,silent){w=w||waiter;const c=cellOf(w.pos.x,w.pos.z);const s=nearestFree(c[0],c[1],c[0],c[1]);const tc=cellOf(clamp(x,-10.8,10.8),clamp(z,-6.8,5.8));const t=nearestFree(tc[0],tc[1],c[0],c[1]);if(!s||!t)return;

function audioInit(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

  SND.sfx=c.createGain();SND.sfx.gain.value=.8;SND.sfx.connect(SND.master);
  SND.musG=c.createGain();SND.musG.gain.value=0;SND.musG.connect(SND.master);
  SND.bus=c.createGain();SND.bus.connect(SND.musG);
  const dl=c.createDelay();dl.delayTime.value=.27;const fb=c.createGain();fb.gain.value=.25;const wet=c.createGain();wet.gain.value=.22;
  SND.bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(SND.musG);
  const len=c.sampleRate*2,nb=c.createBuffer(1,len,c.sampleRate),d=nb.getChannelData(0);let last=0;for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5;}

  const src=c.createBufferSource();src.buffer=nb;src.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.7;
  SND.ambG=c.createGain();SND.ambG.gain.value=0;const lfo=c.createOscillator();lfo.frequency.value=.23;const lg=c.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();

const at=()=>SND.ctx.currentTime+.01;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
function osc(type,f,t,a,peak,dec,dest,f2){const c=SND.ctx,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+dec);
  const g=c.createGain();env(g,t,a,peak,dec);o.connect(g);g.connect(dest||SND.sfx);o.start(t);o.stop(t+a+dec+.05);}
function noise(t,dur,peak,type,freq,q,dest){const c=SND.ctx,s=c.createBufferSource();s.buffer=SND.white;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
  const g=c.createGain();env(g,t,.003,peak,dur);s.connect(f);f.connect(g);g.connect(dest||SND.sfx);s.start(t);s.stop(t+dur+.05);}
const SFX={
  ding(){const t=at();[[1318.5,.3],[1975.5,.15],[2637,.07]].forEach(([f,v])=>osc('sine',f,t,.005,v,1.4));osc('sine',1568,t+.17,.005,.22,1.2);},
  pop(){const t=at();osc('sine',520,t,.005,.35,.09,null,900);osc('triangle',1040,t+.07,.005,.18,.12);},
  call(){const t=at();osc('triangle',880,t,.01,.16,.18);osc('triangle',1175,t+.14,.01,.14,.25);},
  pickup(){const t=at();osc('sine',2400,t,.002,.18,.12);osc('sine',3150,t+.05,.002,.14,.15);noise(t,.05,.12,'highpass',4000);},
  cash(tip){const t=at();noise(t,.06,.35,'bandpass',1800,1.5);noise(t+.07,.05,.25,'bandpass',2500,2);[2093,2637].forEach((f,i)=>osc('sine',f,t+.12+i*.06,.003,.26,.9));
    if(tip)[1568,2093,2637,3136].forEach((f,i)=>osc('sine',f,t+.35+i*.07,.003,.15,.5));},

    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=c.createGain();env(g,t,.02,.3,.45);o.connect(f);f.connect(g);g.connect(SND.sfx);o.start(t);o.stop(t+.55);},

const E8=60/84/2;
const PROG=[{root:38,pad:[53,57,60,64]},{root:43,pad:[53,59,64]},{root:36,pad:[52,55,59,62]},{root:45,pad:[55,61,64]}];
const MEL=[74,77,79,81,84,86];
function playStep(s,t){const bar=Math.floor(s/8)%4,pos=s%8,ch=PROG[bar],B=SND.bus,tt=t+(pos%2?E8*.18:0);
  if(pos===0)ch.pad.forEach(m=>osc('triangle',mtof(m),t,.3,.03,E8*8-.3,B));
  const bn={0:[ch.root,E8*3],4:[ch.root+7,E8*2],7:[PROG[(bar+1)%4].root-1,E8]}[pos];
  if(bn){osc('sine',mtof(bn[0]),tt,.01,.3,bn[1],B);osc('triangle',mtof(bn[0]+12),tt,.01,.05,bn[1]*.6,B);}
  if(pos===3||pos===6)ch.pad.forEach(m=>osc('sine',mtof(m+12),tt,.005,.045,.6,B));
  if(pos===0||pos===4||(bar===3&&pos===5))osc('sine',120,t,.002,.45,.25,B,45);
  if(pos===2||pos===6)noise(tt,.12,.1,'bandpass',1800,.8,B);
  noise(tt,.03,pos%2?.045:.03,'highpass',7000,0,B);
  if(pos&&Math.random()<.26)osc('sine',mtof(pick(MEL)),tt,.02,.06,E8*1.6,B);}
function schedule(){const c=SND.ctx;if(!c)return;if(SND.next<c.currentTime)SND.next=c.currentTime+.05;
  while(SND.next<c.currentTime+.2){if(SND.playing)playStep(SND.step,SND.next);SND.next+=E8;SND.step++;}}

function musicStop(){if(!SND.ctx)return;SND.want=false;const t=SND.ctx.currentTime;SND.musG.gain.cancelScheduledValues(t);SND.musG.gain.setTargetAtTime(0,t,.35);SND.ambG.gain.cancelScheduledValues(t);SND.ambG.gain.setTargetAtTime(0,t,.5);

const AI_SPD={facile:2.3,moyen:2.8,difficile:3.2};
function moveWaiter(w,dt,kx,kz){let mx=0,mz=0;const sp=(w.ai?AI_SPD[GAME.level]:3.3)*dt;const kl=Math.hypot(kx,kz);
  if(kl>.15){w.path=[];const s=Math.min(1,kl);mx=kx/kl*s;mz=kz/kl*s;const nx=w.pos.x+mx*sp,nz=w.pos.z+mz*sp;if(freeAt(nx,w.pos.z))w.pos.x=nx;if(freeAt(w.pos.x,nz))w.pos.z=nz;}
  else{let rem=sp;while(rem>0&&w.path.length){const p=w.path[0];const dx=p.x-w.pos.x,dz=p.z-w.pos.z,d=Math.hypot(dx,dz);if(d<=rem){w.pos.x=p.x;w.pos.z=p.z;w.path.shift();rem-=d;mx=dx;mz=dz;}else{w.pos.x+=dx/d*rem;w.pos.z+=dz/d*rem;mx=dx;mz=dz;rem=0;}}}
  return mx||mz?[mx,mz]:null;}
function animWaiter(w,dt,mv){if(mv){const ta=Math.atan2(mv[0],mv[1]);let da=ta-w.ang;da=Math.atan2(Math.sin(da),Math.cos(da));w.ang+=da*Math.min(1,dt*14);w.walk+=dt*11;}
  const sw=mv?Math.sin(w.walk)*.5:0;w.leg1.rotation.x=sw;w['leg-1'].rotation.x=-sw;
  w.g.position.set(w.pos.x,mv?Math.abs(Math.sin(w.walk))*.04:0,w.pos.z);w.g.rotation.y=w.ang;
  w.spr.position.set(w.pos.x,2.3,w.pos.z);w.tag.position.set(w.pos.x,1.85,w.pos.z);w.tag.visible=w.active&&multi()&&!w.carry.length;}
function aiThink(w){const human=waiter;let tgt=null,bestS=-1e9;
  if(w.carry.length){const o=w.carry.slice().sort((a,b)=>a.rec.timer-b.rec.timer)[0];tgt={x:o.rec.x,z:o.rec.z,k:'t'+o.rec.num};}
  else{for(const r of TABLES){if(r.state!=='calling')continue;const dA=Math.hypot(r.x-w.pos.x,r.z-w.pos.z),dH=Math.hypot(r.x-human.pos.x,r.z-human.pos.z);let s=-dA-r.timer*.25;if(dH<1.5||dH<dA*.5)s-=8;if(s>bestS){bestS=s;tgt={x:r.x,z:r.z,k:'c'+r.num};}}
    const ready=GAME.orders.filter(o=>o.state==='ready').length;
    if(ready){const s=-Math.hypot(.5-w.pos.x,-3.7-w.pos.z)+5;if(!tgt||s>bestS)tgt={x:.5,z:-3.7,k:'bar'};}
    else if(!tgt&&GAME.orders.some(o=>o.state==='cooking'))tgt={x:1.2,z:-3.6,k:'bar'};
    if(!tgt)tgt={x:-.5,z:2,k:'idle'};}
  const far=Math.hypot(tgt.x-w.pos.x,tgt.z-w.pos.z)>1.4;
  if(tgt.k!==w.tk||(!w.path.length&&far)){w.tk=tgt.k;walkTo(tgt.x,tgt.z,w,true);}}
function updateGame(dt,now){
  if(GAME.running){GAME.time-=dt;if(GAME.time<=0){GAME.time=0;hud();endGame();}}
  const run=GAME.running,k=GAME.keys,duo=GAME.mode==='duo';
  // déplacements
  for(const w of WAITERS){if(!w.active)continue;let kx=0,kz=0;
    if(run){if(w===waiter){kx=(k.d?1:0)-(k.q||k.a?1:0);kz=(k.s?1:0)-(k.z||k.w?1:0);if(!duo){kx+=(k.arrowright?1:0)-(k.arrowleft?1:0);kz+=(k.arrowdown?1:0)-(k.arrowup?1:0);}}
      else if(!w.ai){kx=(k.arrowright?1:0)-(k.arrowleft?1:0);kz=(k.arrowdown?1:0)-(k.arrowup?1:0);}
      if(duo&&!w.ai){kx+=w.joy.x;kz+=w.joy.y;}
      if(w.ai){w.think-=dt;if(w.think<=0){w.think=.35+Math.random()*.4;aiThink(w);}}}
    const mv=run?moveWaiter(w,dt,kx,kz):null;animWaiter(w,dt,mv);
    if(run&&mv&&!w.ai){w.stepT-=dt;if(w.stepT<=0){play('step');w.stepT=.3;}}}
  if(run&&Math.random()<dt*.35)play('clink');
  if(run){const sec=Math.ceil(GAME.time);if(sec<=10&&sec!==GAME.lastSec){GAME.lastSec=sec;play('tick');}}
  marker.material.opacity=Math.max(0,marker.material.opacity-dt*(waiter.path.length?.2:1.5));
  // arrivées de clients (un peu plus nombreux à deux)
  if(run){GAME.spawnT-=dt;const active=TABLES.filter(r=>r.state!=='free').length;const bonus=multi()?2:0;const maxA=Math.min(LV().cap+bonus,3+LV().act+bonus+Math.floor(elapsed()/25));
    if(GAME.spawnT<=0&&active<maxA){spawn();GAME.spawnT=(Math.max(3.2,8.5-elapsed()/28)+Math.random()*2)*LV().spawn*(multi()?.7:1);}}
  // tables
  const pulse=.5+.5*Math.sin(now*.008),ws=ACT();
  for(const r of TABLES){if(r.state==='free'){r.cool=Math.max(0,r.cool-dt);continue;}if(!run&&r.state!=='leaving'&&r.state!=='arriving')continue;
    r.t-=dt;
    if(r.state==='arriving'){const q=1-Math.max(0,r.t)/1.2;r.cust.forEach(c=>c.g.scale.setScalar(.2+q*.8));if(r.t<=0)setCalling(r);}
    else if(r.state==='calling'||r.state==='waitFood'){r.timer-=dt;if(r.timer<=0){angry(r);continue;}
      if(r.state==='calling'){r.top.material.color.setHex(GREEN);r.top.material.emissive.setRGB(0,.35*pulse,.05*pulse);
        if(ws.some(w=>near(r,w))){r.take+=dt;if(r.take>.45)takeOrder(r);}else r.take=0;}
      else{let done=false;for(const w of ws){const o=w.carry.find(o=>o.rec===r);if(o&&near(r,w)){serve(r,o,w);done=true;break;}}if(done)continue;}
      drawRing(r);}
    else if(r.state==='eating'){if(r.t<=0){r.state='leaving';r.t=1;r.cust.forEach(c=>c.ic.visible=false);}}
    else if(r.state==='leaving'){const q=Math.max(0,r.t)/1.2;r.cust.forEach(c=>c.g.scale.setScalar(Math.max(.01,q)));if(r.t<=0)clearTable(r);}}
  // cuisine & bar
  if(run){for(const o of GAME.orders){if(o.state==='cooking'){o.t+=dt;if(o.t>=o.prep){const used=GAME.orders.filter(x=>x.state==='ready').map(x=>x.slot);const sl=slots.findIndex((_,i)=>!used.includes(i));
      if(sl>=0){o.state='ready';o.slot=sl;o.readyAt=now;makeTray(o);play('ding');toast(`🛎️ Table ${o.rec.num} : c'est prêt au bar !`);}}}}
    for(const w of ws){if(!nearBar(w)||w.carry.length>=2)continue;const rd=GAME.orders.filter(o=>o.state==='ready').sort((a,b)=>a.readyAt-b.readyAt);let ch=false;
      for(const o of rd){if(w.carry.length>=2)break;o.state='carried';removeTray(o);w.carry.push(o);ch=true;}
      if(ch){drawCarry(w);play('pickup');if(!w.ai)toast(`${multi()?w.col.ic+' ':''}Commande sur le plateau → apporte-la à la table entourée`);}}}
  for(const r of TABLES){const w=ws.find(w=>w.carry.some(o=>o.rec===r));r.hl.visible=!!w;if(w)r.hl.material.color.setHex(w.col.hex);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.s.position.y+=dt*.7;f.s.material.opacity=Math.max(0,1-Math.max(0,f.t-.8)/.7);if(f.t>1.5){killSprite(f.s);floats.splice(i,1);}}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0;}
  // caméra : suit J1 (ou les deux joueurs en mode 2 joueurs)
  let fx=waiter.pos.x,fz=waiter.pos.z,kz=(camera.aspect<1?1.5:1)*GAME.zoom;
  if(duo&&WAITERS[1].active){const b=WAITERS[1].pos;fx=(fx+b.x)/2;fz=(fz+b.z)/2;kz*=clamp(.85+Math.hypot(waiter.pos.x-b.x,waiter.pos.z-b.z)/(camera.aspect<1?7:11),1,2.3);}
  const want=V(fx,9.5*kz,fz+7*kz);
  if(GAME.camInit){camera.position.copy(want);GAME.camInit=false;camera.fov=50;camera.updateProjectionMatrix();}else camera.position.lerp(want,1-Math.exp(-dt*5));
  camera.lookAt(fx,.4,fz-.6);
  // indicateurs hors écran
  const list=[];if(run){for(const r of TABLES){if(r.state==='calling')list.push({x:r.x,z:r.z,txt:'T'+r.num,col:'#16a34a'});}
    for(const w of ws){if(w.ai)continue;for(const o of w.carry)list.push({x:o.rec.x,z:o.rec.z,txt:'T'+o.rec.num,col:w.col.css});}
    if(ws.some(w=>!w.ai&&w.carry.length<2)&&GAME.orders.some(o=>o.state==='ready'))list.push({x:.5,z:-4.4,txt:'BAR',col:'#ea580c'});
    if(GAME.mode==='ordi')list.push({x:WAITERS[1].pos.x,z:WAITERS[1].pos.z,txt:'🤖',col:'#7c3aed'});}
  indicators(list);
  GAME.hudT-=dt;if(GAME.hudT<=0){GAME.hudT=.2;hud();}}
const tmp=new THREE.Vector3();let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(GAME.on){updateGame(dt,now);}
  else if(ctl.anim){const a=ctl.anim;a.t=Math.min(1,a.t+dt/.9);const e=a.t<.5?2*a.t*a.t:1-Math.pow(-2*a.t+2,2)/2;
    camera.position.lerpVectors(a.fp,a.tp,e);tmp.lerpVectors(a.fl,a.tl,e);camera.lookAt(tmp);camera.fov=a.f0+(a.f1-a.f0)*e;camera.updateProjectionMatrix();
    if(a.t>=1){finish(a.v);ctl.anim=null;}}
  else applyCam();
  for(const w of cut){w.g.visible=tmp.copy(camera.position).sub(w.p).dot(w.n)<.3;}
  ceil.visible=camera.position.y<H-.05;
  const lv=showLabels&&ctl.mode!=='look'&&!GAME.on;for(const s of labels)s.visible=lv;
  renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
setTimeout(hideHint,6000);
})();
