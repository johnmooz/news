<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loup-Garou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8b75a; --gold2:#f6d28b; --ink:#f3e7cf; --muted:#b9a88a;
  --night1:#070b1c; --night2:#141b3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Alegreya',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% 120%,#2a1a10 0%,#130e14 35%,var(--night2) 60%,var(--night1) 100%);
  min-height:100vh;overflow-x:hidden;transition:background 1.2s;
}
body.day{background:radial-gradient(ellipse at 50% 120%,#5a4220 0%,#7d6a52 30%,#8fa7c4 65%,#c7d8ea 100%)}
#stars{position:fixed;top:0;left:0;width:2px;height:2px;border-radius:50%;pointer-events:none;transition:opacity 1.2s}
body.day #stars{opacity:0}
#moon{position:fixed;top:5vh;right:7vw;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#e9dfb8 60%,#cbbd8e);
  box-shadow:0 0 40px 10px rgba(255,245,200,.25);pointer-events:none;transition:all 1.2s}
body.day #moon{background:radial-gradient(circle,#fff6c9,#ffd34d);box-shadow:0 0 60px 25px rgba(255,220,90,.5)}
#trees{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;opacity:.9}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700;margin:0}
button{font-family:'Cinzel',serif;cursor:pointer}
.hidden{display:none!important}

/* ---------- ÉCRANS ---------- */
.screen{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:36px 18px 80px}
.title{font-family:'Cinzel Decorative',serif;font-weight:900;text-align:center;
  font-size:clamp(2.4rem,8vw,4.4rem);letter-spacing:.04em;color:var(--gold2);
  text-shadow:0 0 18px rgba(255,140,40,.55),0 3px 0 #3a1d08}
.title.sm{font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:18px}
.subtitle{text-align:center;font-style:italic;color:var(--muted);margin:4px 0 28px;font-size:1.1rem}
.panel{background:rgba(14,12,24,.78);border:1px solid rgba(232,183,90,.35);border-radius:16px;
  padding:20px 22px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.panel h2{font-size:1.15rem;color:var(--gold);margin-bottom:12px;letter-spacing:.06em}
.modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border-radius:18px;
  border:1px solid rgba(232,183,90,.45);background:rgba(14,12,24,.8);color:var(--ink);transition:.2s;text-align:center}
.mode:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 0 26px rgba(255,150,50,.45);border-color:var(--gold)}
.mode .mi{font-size:2.6rem;line-height:1}
.mode b{font-size:1.3rem;color:var(--gold2)}
.mode small{font-family:'Alegreya',serif;font-size:.98rem;color:var(--muted)}
.mode:disabled{opacity:.4;cursor:not-allowed}
.netstatus{text-align:center;margin-top:20px;color:var(--muted);font-size:.95rem;line-height:1.4}
.count-row{display:flex;flex-wrap:wrap;gap:8px}
.count-row button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(232,183,90,.5);
  background:rgba(255,255,255,.04);color:var(--ink);font-size:1.05rem;transition:.15s}
.count-row button:hover{background:rgba(232,183,90,.15)}
.count-row button.on{background:var(--gold);color:#2a1606;font-weight:700;box-shadow:0 0 14px rgba(232,183,90,.7)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.names label{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:.85rem;color:var(--muted)}
.names label span{width:22px;text-align:right}
.names input,.white{flex:1;min-width:0;background:#fff;color:#000;border:2px solid #fff;border-radius:8px;
  padding:9px 10px;font-family:'Alegreya',serif;font-size:1.05rem;outline:none}
.names input:focus,.white:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,183,90,.35)}
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);user-select:none;transition:.15s;font-size:.98rem}
.chip .ic{font-size:1.35rem}
.chip.on{border-color:var(--gold);background:rgba(232,183,90,.16)}
.chip.on.loups{border-color:#e05050;background:rgba(160,30,30,.28)}
.chip.on.ambigu{border-color:#b07ce0;background:rgba(110,50,150,.28)}
.camp-label{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.camp-label:first-child{margin-top:0}
.roles-grid>.stepper{grid-column:1/-1;justify-self:start}
.stepper{display:inline-flex;white-space:nowrap;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:1px solid #e05050;background:rgba(160,30,30,.22)}
.stepper button{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:var(--ink);font-size:1.1rem}
.stepper b{min-width:18px;text-align:center;font-size:1.15rem}
.summary{margin-top:14px;font-size:.98rem;color:var(--muted);line-height:1.45}
.summary .err{color:#ff8a7a;font-weight:600}
.big-btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:1.2rem;letter-spacing:.08em;
  background:linear-gradient(180deg,#f6c56a,#c9822b);color:#2a1606;font-weight:700;
  box-shadow:0 6px 0 #6b3a10,0 10px 30px rgba(255,140,40,.35);transition:.12s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b3a10}
.big-btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--gold);background:rgba(232,183,90,.12);color:var(--gold2);font-size:.95rem;letter-spacing:.04em}
.btn:hover{background:rgba(232,183,90,.25)}
.btn.solid{background:var(--gold);color:#2a1606;font-weight:700}
.btn.red{border-color:#e05050;color:#ffb3a8;background:rgba(160,30,30,.25)}
.back{margin:18px auto 0;display:block}
.code{font-family:'Cinzel Decorative',serif;font-size:2.8rem;letter-spacing:.3em;color:var(--gold2);text-align:center;text-shadow:0 0 14px rgba(255,140,40,.5)}
.code.sm{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.15em;display:inline-block;padding:2px 8px;border:1px solid var(--gold);border-radius:20px;text-shadow:none;margin-left:6px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(232,183,90,.3)}
.pchip.me{border-color:var(--gold);color:var(--gold2)}
#gList{flex-direction:column}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12)}
.game-row small{color:var(--muted)}
.kind{width:42px;height:42px;flex-shrink:0;border-radius:8px;border:1px solid var(--gold);background:rgba(255,255,255,.08);font-size:1.25rem;padding:0}
.kind.bot{background:rgba(120,170,255,.28);border-color:#8ab4ff}
.pass-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1.8rem,8vw,2.6rem);color:var(--gold2);text-align:center;text-shadow:0 0 14px rgba(255,140,40,.5)}
.pick-title{color:var(--gold2);font-size:1.2rem;text-align:center}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:100%}
.pick{padding:12px 8px;border-radius:10px;border:1px solid rgba(232,183,90,.5);background:rgba(255,255,255,.06);color:var(--ink);font-family:'Alegreya',serif;font-size:1rem}
.pick:hover{background:rgba(232,183,90,.22)}
.mtext{text-align:center;font-size:1.08rem;line-height:1.45;width:100%}
.mbtns{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.talk{text-align:left;margin:8px auto;padding-left:20px;color:var(--ink);line-height:1.55;max-width:560px}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.hint{font-size:.88rem;color:var(--muted);font-style:italic;text-align:center;line-height:1.4}
.panel .hint{text-align:left}
.dots::after{content:"";animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- JEU ---------- */
#game{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 0}
.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .small-title{font-family:'Cinzel Decorative',serif;color:var(--gold2);font-size:1.3rem;text-shadow:0 0 10px rgba(255,140,40,.5)}
.topbar .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.topbar .btn{padding:7px 11px;font-size:.8rem}
#stage{position:relative;margin:6px auto 0;flex-shrink:0}
.ground{position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,45,25,.85) 0%,rgba(40,30,22,.7) 45%,rgba(20,18,20,0) 72%)}
.glow{position:absolute;left:50%;top:50%;width:90%;height:90%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,50,.42) 0%,rgba(255,110,30,.16) 35%,rgba(0,0,0,0) 65%);
  animation:glow 2.2s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{0%{opacity:.75;transform:translate(-50%,-50%) scale(.97)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.fire{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.stone{position:absolute;border-radius:45%;background:radial-gradient(circle at 35% 30%,#8a8178,#4a443f 70%);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.log{position:absolute;left:10%;width:80%;height:13%;bottom:14%;border-radius:40%;
  background:linear-gradient(180deg,#7a4a26,#3e2210);box-shadow:inset 0 -3px 4px rgba(0,0,0,.5)}
.log::after{content:"";position:absolute;right:3%;top:15%;width:12%;height:70%;border-radius:50%;background:radial-gradient(circle,#c98a4e,#6a3a18)}
.log.a{transform:rotate(18deg)} .log.b{transform:rotate(-18deg)}
.fl{position:absolute;left:50%;bottom:24%;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
.fl i{display:block;width:100%;height:100%;border-radius:50% 0 50% 50%;transform:rotate(-45deg);filter:blur(1px)}
.fl.f1{width:56%;height:56%;animation-duration:1.3s} .fl.f1 i{background:radial-gradient(circle at 70% 30%,#ff5a1a,#c4200a 70%);opacity:.9}
.fl.f2{width:42%;height:42%;animation-duration:.9s} .fl.f2 i{background:radial-gradient(circle at 70% 30%,#ffae2a,#ff6a10)}
.fl.f3{width:28%;height:28%;animation-duration:.7s} .fl.f3 i{background:radial-gradient(circle at 70% 30%,#fff2a0,#ffc430)}
.fl.f4{width:13%;height:13%;bottom:26%;animation-duration:.5s} .fl.f4 i{background:#fffdf0;filter:blur(2px)}
.fl.f5{width:30%;height:30%;margin-left:-16%;animation-duration:1.1s;animation-delay:-.4s} .fl.f5 i{background:radial-gradient(circle at 70% 30%,#ff8d24,#d63a0c);opacity:.85}
.fl.f6{width:26%;height:26%;margin-left:15%;animation-duration:.85s;animation-delay:-.2s} .fl.f6 i{background:radial-gradient(circle at 70% 30%,#ff9a2a,#d8400c);opacity:.85}
@keyframes flick{0%{transform:translateX(-50%) scale(1,1) skewX(0)}35%{transform:translateX(-50%) scale(.93,1.1) skewX(3deg)}70%{transform:translateX(-50%) scale(1.04,.95) skewX(-3deg)}100%{transform:translateX(-50%) scale(.96,1.14) skewX(1deg)}}
.spark{position:absolute;bottom:45%;width:3px;height:3px;border-radius:50%;background:#ffd27a;box-shadow:0 0 6px #ff9a2a;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-140%);opacity:0}}
.center-cards{position:absolute;left:50%;top:50%;display:flex;gap:4px;transform:translate(-50%,0)}

.seat{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);transition:filter .3s,opacity .3s}
.mini{position:relative;border-radius:9px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);transition:.35s;cursor:default;background:#111}
.mini svg{display:block;width:100%;height:100%}
.seat.clickable .mini{cursor:pointer}
.seat.clickable .mini:hover{transform:translateY(-4px)}
.seat.active .mini{box-shadow:0 0 0 3px var(--gold2),0 0 26px 8px rgba(255,170,60,.75);transform:translateY(-6px) scale(1.07);animation:pulse 1.4s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--gold2),0 0 36px 14px rgba(255,170,60,.9)}}
.seat.seen .mini::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.75rem;color:var(--gold2);text-shadow:0 0 4px #000}
.seat.dead{filter:grayscale(1) brightness(.55)}
.seat.dead .mini::before{content:"💀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8em;z-index:2;filter:grayscale(0)}
.seat.gone{opacity:.45}
.pname{margin-top:6px;padding:2px 9px;border-radius:20px;background:rgba(0,0,0,.65);font-family:'Cinzel',serif;font-size:.78rem;
  max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(232,183,90,.25)}
.seat.me .pname{border-color:var(--gold);color:var(--gold2)}
.seat.active .pname{background:var(--gold);color:#2a1606;font-weight:700}
.minif{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;border:2px solid rgba(255,255,255,.35);border-radius:9px}
.minif .e{font-size:1.9em;line-height:1}
.minif .n{font-family:'Cinzel',serif;font-size:.55em;line-height:1.1;margin-top:4px;color:#fff}
.camp-village{background:linear-gradient(160deg,#5d8a4e,#2c4a26)}
.camp-loups{background:linear-gradient(160deg,#b52a2a,#4d0b0b)}
.camp-ambigu{background:linear-gradient(160deg,#8a52b8,#371a4f)}
.lover{position:absolute;top:-8px;left:-8px;font-size:1rem;z-index:3;filter:drop-shadow(0 0 4px #ff4f8b)}

#panel{position:relative;width:100%;max-width:680px;margin:10px auto 14px;text-align:center}
#panel .panel{padding:16px 18px}
#panel h3{font-size:1.25rem;color:var(--gold2)}
#panel p{margin:6px 0 12px;color:var(--muted)}
#panel p.step{color:var(--ink);font-size:1.12rem}
.steps{text-align:left;margin:8px 0 12px;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed rgba(255,255,255,.1);cursor:pointer}
.steps li:last-child{border:none}
.steps li input{margin-top:5px;accent-color:var(--gold)}
.steps li.done{opacity:.45;text-decoration:line-through}
.steps .e{font-size:1.2rem}
.steps small{display:block;color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- MODALE ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,3,10,.88);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);overflow:auto}
.modal-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;width:100%}
.who{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--muted)}
.who b{color:var(--gold2);font-size:1.35rem}
.bigcard{width:min(270px,70vw);aspect-ratio:5/7;perspective:1200px}
.bigcard .inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.bigcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.face.back svg{width:100%;height:100%;display:block}
.face.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;padding:18px 16px;text-align:center;border:3px solid rgba(255,230,180,.6)}
.face.front .badge{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff}
.face.front .emo{font-size:clamp(3.2rem,16vw,4.6rem);line-height:1;margin:12px 0 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.face.front h2{font-size:1.25rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.face.front .desc{font-size:.95rem;line-height:1.35;margin-top:10px;color:#fff6e6}
.face.front .goal{margin-top:auto;font-size:.82rem;font-style:italic;color:#ffe9c2;border-top:1px solid rgba(255,255,255,.3);padding-top:8px}
.extra{width:100%;text-align:center}
.extra p{color:var(--muted);margin:4px 0 10px;font-size:.95rem}
.thief{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.thief .opt{display:flex;flex-direction:column;align-items:center;gap:6px}
.thief .minif{width:84px;height:118px;font-size:16px;border-radius:10px}

#menu{position:fixed;z-index:15;background:#16121f;border:1px solid var(--gold);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#menu .mh{font-family:'Cinzel',serif;color:var(--gold2);padding:6px 10px 8px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:4px}
#menu button{background:none;border:none;color:var(--ink);text-align:left;padding:9px 10px;border-radius:8px;font-family:'Alegreya',serif;font-size:1rem}
#menu button:hover{background:rgba(232,183,90,.15)}
.prows{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)}
.prow.isbot{background:rgba(120,170,255,.08);border-color:rgba(138,180,255,.3)}
.pnum{width:20px;text-align:right;font-family:'Cinzel',serif;color:var(--muted)}
.prow input.white{flex:1 1 140px}
.avbtn{position:relative;border:none;background:none;padding:0;border-radius:50%;line-height:0}
.avbtn:disabled{cursor:default}
.avedit{position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#2a1606;border-radius:50%;width:19px;height:19px;font-size:.72rem;display:flex;align-items:center;justify-content:center;line-height:1}
.seg{display:inline-flex;border:1px solid var(--gold);border-radius:10px;overflow:hidden;flex-shrink:0}
.seg button{border:none;background:transparent;color:var(--muted);padding:9px 11px;font-size:.82rem}
.seg button.on{background:var(--gold);color:#2a1606;font-weight:700}
.seg button[data-kind=b].on{background:#8ab4ff;color:#0d1a33}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex-shrink:0;vertical-align:middle;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.35)}
.av svg{width:100%;height:100%;display:block}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;width:100%;justify-items:center}
.avpick{border:3px solid transparent;background:none;border-radius:50%;padding:2px;line-height:0}
.avpick:hover{border-color:rgba(232,183,90,.5)}
.avpick.on{border-color:var(--gold2);box-shadow:0 0 14px rgba(255,200,90,.6)}
.avpick.used{opacity:.35}
.sav{position:absolute;top:-14px;left:-14px;z-index:4;line-height:0}
.lover{left:auto!important;right:-8px}
.pick{display:flex;align-items:center;gap:8px}
.phead{display:flex;align-items:center;justify-content:center;gap:12px}
.modal .modal-inner > .av{margin:4px auto}
.snd{position:fixed;right:14px;bottom:14px;z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(14,12,24,.85);font-size:1.3rem;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.5)}

<script>
(function(){
"use strict";
/* =============================================================
   DONNÉES DU JEU
   ============================================================= */
const ROLES = {
  villageois:{name:"Simple Villageois",icon:"🧑‍🌾",camp:"village",
    desc:"Tu n'as aucun pouvoir particulier : ta seule arme est le débat et le vote."},

  sorciere:{name:"Sorcière",icon:"🧪",camp:"village",

    desc:"Au début de la partie, tu lies deux joueurs par l'amour. Si l'un meurt, l'autre meurt de chagrin."},
  voleur:{name:"Voleur",icon:"🎭",camp:"ambigu",

};
const CAMP = {
  village:{label:"Camp des Villageois",goal:"Ton but : démasquer et éliminer tous les Loups-Garous."},
  loups:{label:"Camp des Loups-Garous",goal:"Ton but : garder ton identité secrète et éliminer tous les Villageois."},
  ambigu:{label:"Personnage ambigu",goal:"Tu joues avec le village : démasquer et éliminer tous les Loups-Garous."}
};
const SPECIALS = {loups:["gml"],village:["voyante","sorciere","chasseur","salvateur","ancien","bouc","idiot"],ambigu:["cupidon","voleur"]};
const WINS = {
  v:{e:"🧑‍🌾",t:"Les Villageois gagnent !",s:"Tous les Loups-Garous ont été démasqués."},
  l:{e:"🐺",t:"Les Loups-Garous gagnent !",s:"Il n'y a plus aucun villageois pour leur résister."},
  a:{e:"💞",t:"Les Amoureux gagnent !",s:"Ils sont les deux derniers survivants."},
  n:{e:"🌫️",t:"Personne ne survit…",s:"Le village de Thiercelieux est désert."}
};
const roleOk = r => typeof r==="string" && Object.prototype.hasOwnProperty.call(ROLES,r);
const isWolf = r => roleOk(r) && ROLES[r].camp==="loups";

/* =============================================================
   OUTILS
   ============================================================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s||"").replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,"").trim().slice(0,18);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),4000);}
/* =============================================================
   SONS (synthétisés en direct, aucun fichier audio)
   ============================================================= */
const SND=(function(){
  let ctx=null,out=null,wet=null,noiseBuf=null,on=true,fireWanted=false,fireOn=false,fireTimer=null,fireRumble=null;
  try{ on=localStorage.getItem("lg-sound")!=="off"; }catch(e){}
  function init(){
    if(ctx){ if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return ctx; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    try{ ctx=new AC(); }catch(e){ return null; }
    out=ctx.createGain(); out.gain.value=on?.9:0; out.connect(ctx.destination);
    const len=ctx.sampleRate*2; noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const conv=ctx.createConvolver(), il=Math.floor(ctx.sampleRate*2.8), ir=ctx.createBuffer(2,il,ctx.sampleRate);
    for(let c=0;c<2;c++){const ch=ir.getChannelData(c);for(let i=0;i<il;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/il,3);}
    conv.buffer=ir; wet=ctx.createGain(); wet.gain.value=.35; wet.connect(conv); conv.connect(out);
    return ctx;
  }
  const T=(d=0)=>ctx.currentTime+d;
  function env(g,t,a,peak,hold,rel){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+hold); g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel); }
  function bus(rev){ const g=ctx.createGain(); g.gain.value=.0001; g.connect(out); if(rev) g.connect(wet); return g; }
  function osc(type,f,t,stop,dest){ const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.connect(dest); o.start(t); o.stop(stop); return o; }
  function noise(t,stop,dest){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.connect(dest); s.start(t,Math.random()*1.5); s.stop(stop); return s; }
  function filt(type,f,q,dest){ const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q!=null) b.Q.value=q; b.connect(dest); return b; }
  function lfo(rate,depth,param,t,stop){ const l=ctx.createOscillator(); l.frequency.value=rate; const g=ctx.createGain(); g.gain.value=depth; l.connect(g); g.connect(param); l.start(t); l.stop(stop); }

  function howlOne(t,p,amp){
    const g=bus(true); env(g,t,.4,amp,1.5,1.3);
    const lp=filt("lowpass",1300,1,g);
    [0,8].forEach(det=>{
      const o=osc(det?"sawtooth":"triangle",260*p,t,t+3.6,lp); o.detune.value=det;
      o.frequency.exponentialRampToValueAtTime(540*p,t+.65); o.frequency.setValueAtTime(540*p,t+1.6);
      o.frequency.exponentialRampToValueAtTime(380*p,t+3.3);
      lfo(5.5,9*p,o.frequency,t,t+3.6);
    });
  }
  const LIB={
    flip(t){ const g=bus(); env(g,t,.01,.22,.04,.12); const bp=filt("bandpass",700,1.2,g);
      bp.frequency.setValueAtTime(700,t); bp.frequency.exponentialRampToValueAtTime(3500,t+.18); noise(t,t+.3,bp); },
    howl(t){ howlOne(t,1,.2); howlOne(t+1.9,.84,.09); },
    owl(t){ [0,.5].forEach(k=>{const g=bus(true); env(g,t+k,.05,.16,.12,.3); const o=osc("sine",430,t+k,t+k+.6,g); o.frequency.exponentialRampToValueAtTime(350,t+k+.4);}); },
    birds(t){ for(let k=0;k<9;k++){ const tt=t+k*.16+Math.random()*.25, f=2600+Math.random()*1600;
      const g=bus(true); env(g,tt,.01,.07,.04,.07); const o=osc("sine",f,tt,tt+.2,g);
      o.frequency.exponentialRampToValueAtTime(f*1.35,tt+.06); o.frequency.exponentialRampToValueAtTime(f*.9,tt+.14);} },
    devour(t){
      const g=bus(true); env(g,t,.15,.4,1.1,.4);
      const lp=filt("lowpass",520,2,g), am=ctx.createGain(); am.gain.value=.6; am.connect(lp);
      const o=osc("sawtooth",72,t,t+2,am); o.frequency.linearRampToValueAtTime(96,t+.6); o.frequency.linearRampToValueAtTime(68,t+1.6);
      lfo(23,.45,am.gain,t,t+2);
      const gn=bus(); env(gn,t,.2,.18,1,.4); noise(t,t+2,filt("lowpass",700,1,gn));
      for(let k=0;k<5;k++){ const tc=t+.9+k*.22+Math.random()*.1;
        const g2=bus(true); env(g2,tc,.004,.45,.03,.09); noise(tc,tc+.2,filt("bandpass",1100+Math.random()*900,.8,g2));
        const g3=bus(); env(g3,tc,.004,.4,.02,.12); const th=osc("sine",130,tc,tc+.25,g3); th.frequency.exponentialRampToValueAtTime(55,tc+.15); }
    },
    knell(t){ const f=130; [[.5,.35,4],[1,.5,3.5],[1.19,.25,2.5],[1.56,.2,2],[2,.18,1.8],[2.51,.12,1.3],[3.01,.08,1]].forEach(([m,a,dec])=>{
      const g=bus(true); env(g,t,.005,a*.5,.01,dec); osc("sine",f*m,t,t+dec+.1,g); }); },
    shot(t){ const g=bus(true); env(g,t,.002,.9,.02,.35); const lp=filt("lowpass",5000,.7,g);
      lp.frequency.setValueAtTime(5000,t); lp.frequency.exponentialRampToValueAtTime(300,t+.3); noise(t,t+.5,lp);
      const g2=bus(); env(g2,t,.002,.7,.03,.25); const o=osc("sine",90,t,t+.4,g2); o.frequency.exponentialRampToValueAtTime(38,t+.25); },
    drum(t){ for(let k=0;k<30;k++){ const tt=t+k*.045, a=.04+.2*k/30;
        const g=bus(); env(g,tt,.002,a,.005,.05); noise(tt,tt+.08,filt("highpass",1400,.7,g)); }
      const te=t+1.42, g=bus(true); env(g,te,.003,.7,.05,.6); const o=osc("sine",110,te,te+.9,g); o.frequency.exponentialRampToValueAtTime(65,te+.5);
      const g2=bus(true); env(g2,te,.002,.35,.02,.25); noise(te,te+.4,filt("lowpass",2500,.7,g2)); },
    fanfare(t){ [[392,0,.16],[523,.18,.16],[659,.36,.16],[784,.54,.34],[659,.92,.14],[784,1.08,.7]].forEach(([f,s,d])=>{
      const g=bus(true); env(g,t+s,.02,.16,d,.2); osc("triangle",f,t+s,t+s+d+.3,g);
      const g2=bus(); env(g2,t+s,.02,.04,d,.15); osc("square",f,t+s,t+s+d+.25,g2); }); },
    wolfwin(t){ [[440,0],[415,.35],[349,.7],[330,1.05]].forEach(([f,s])=>{
      const g=bus(true); env(g,t+s,.03,.14,.25,.4); osc("sawtooth",f/2,t+s,t+s+.8,filt("lowpass",900,1,g)); });
      howlOne(t+1.6,1,.2); }
  };
  function fireStart(){
    if(!ctx||fireOn||!on) return; fireOn=true;
    const g=ctx.createGain(); g.gain.setValueAtTime(.0001,T()); g.gain.exponentialRampToValueAtTime(.13,T(1.5)); g.connect(out);
    const lp=filt("lowpass",320,.7,g), n=noise(T(),T(86400),lp);
    const l=ctx.createOscillator(); l.frequency.value=.3; const lg=ctx.createGain(); lg.gain.value=120; l.connect(lg); lg.connect(lp.frequency); l.start();
    fireRumble={g,n,l};
    const crack=()=>{ if(!fireOn) return;
      const t=T(.02), amp=Math.random()<.1?.3:.06+Math.random()*.12, dur=.004+Math.random()*.02;
      const gg=ctx.createGain(); gg.connect(out); gg.gain.setValueAtTime(amp,t); gg.gain.exponentialRampToValueAtTime(.0001,t+dur+.03);
      noise(t,t+dur+.05,filt("bandpass",1500+Math.random()*4000,1+Math.random()*3,gg));
      fireTimer=setTimeout(crack,25+Math.random()*(Math.random()<.3?60:280)); };
    crack();
  }
  function fireStop(){
    fireOn=false; clearTimeout(fireTimer);
    if(fireRumble){ const {g,n,l}=fireRumble; fireRumble=null;
      try{ g.gain.cancelScheduledValues(T()); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),T()); g.gain.exponentialRampToValueAtTime(.0001,T(.8)); n.stop(T(1)); l.stop(T(1)); }catch(e){} }
  }
  document.addEventListener("pointerdown",()=>{ if(on&&init()&&fireWanted) fireStart(); },true);
  document.addEventListener("visibilitychange",()=>{ if(!ctx) return; if(document.hidden) ctx.suspend().catch(()=>{}); else if(on) ctx.resume().catch(()=>{}); });
  return {
    play(name,delay){ if(!on||!init()||!LIB[name]) return; try{ LIB[name](T(delay||0)); }catch(e){} },
    fire(want){ fireWanted=want; if(!ctx) return; (want&&on)?fireStart():fireStop(); },
    toggle(){ on=!on; try{localStorage.setItem("lg-sound",on?"on":"off");}catch(e){}
      if(on){ if(init()){ out.gain.value=.9; if(fireWanted) fireStart(); } } else { if(out) out.gain.value=0; fireStop(); }
      return on; },
    isOn:()=>on
  };
})();

function buildFire(size){
  const f=$("fire");
  f.style.width=f.style.height=size+"px";
  let h="";
  for(let i=0;i<11;i++){
    const a=i/11*Math.PI*2,r=size*.46,w=size*(.15+Math.random()*.05);
    h+=`<div class="stone" style="width:${w}px;height:${w*.75}px;left:${size/2+Math.cos(a)*r-w/2}px;top:${size/2+Math.sin(a)*r*.62+size*.12-w*.37}px"></div>`;
  }
  h+=`<div class="log a"></div><div class="log b"></div>`;
  h+=`<div class="fl f1"><i></i></div><div class="fl f5"><i></i></div><div class="fl f6"><i></i></div><div class="fl f2"><i></i></div><div class="fl f3"><i></i></div><div class="fl f4"><i></i></div>`;
  for(let i=0;i<9;i++) h+=`<span class="spark" style="left:${35+Math.random()*30}%;--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(1.6+Math.random()*1.8).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s"></span>`;
  f.innerHTML=h;
}

/* =============================================================
   COMPOSITION DES CARTES (partagée solo / hôte)
   ============================================================= */
let compN=6, wolves=2, picked=new Set(), touched=false;
function defaults(n){
  wolves = n<=3?1 : n<=8?2 : 3;
  picked = new Set();
  if(n>=3) picked.add("voyante");
  if(n>=5) picked.add("sorciere");
  if(n>=6) picked.add("chasseur");
  if(n>=7) picked.add("cupidon");
  if(n>=9) picked.add("salvateur");
  if(n>=11) picked.add("ancien");
}
function deckInfo(){
  const cards=[];
  for(let i=0;i<wolves;i++) cards.push("loup");
  [...SPECIALS.loups,...SPECIALS.village,...SPECIALS.ambigu].forEach(r=>{if(picked.has(r)) cards.push(r)});
  const total=compN+(picked.has("voleur")?2:0);
  const err = compN<1 ? "Il faut au moins un joueur." :
              cards.length>total ? `Trop de rôles : ${cards.length} rôles pour ${total} cartes.` :
              !cards.some(isWolf) ? "Il faut au moins un Loup-Garou." : null;
  while(cards.length<total) cards.push("villageois");
  return {cards,total,err};
}
function renderComp(el){
  const chip=r=>`<div class="chip ${ROLES[r].camp} ${picked.has(r)?"on":""}" data-r="${r}"><span class="ic">${ROLES[r].icon}</span>${ROLES[r].name}</div>`;
  const {cards,total,err}=deckInfo();
  const count={}; cards.forEach(c=>count[c]=(count[c]||0)+1);
  const parts=Object.entries(count).map(([r,k])=>`${ROLES[r].icon} ${k>1?k+" × ":""}${ROLES[r].name}`);
  el.innerHTML=`<div class="camp-label">Camp des Loups-Garous</div>
    <div class="roles-grid"><div class="stepper"><span>🐺 Loups</span><button data-w="-1">−</button><b>${wolves}</b><button data-w="1">+</button></div>${SPECIALS.loups.map(chip).join("")}</div>

    <div class="summary"><b>${total} carte${total>1?"s":""}</b>${picked.has("voleur")?" (dont 2 au centre pour le Voleur)":""}${parts.length?" : "+parts.join(" · "):""}${err?`<br><span class="err">⚠ ${err}</span>`:""}</div>`;
  $("startBtn").disabled=!!err;
}

const BOT_COLORS=["#e5534b","#3d8bd9","#43a86b","#e0952f","#9466d6","#d65c9e","#2fb3b3","#8a9a3b","#d9733b","#5b6fd6","#b8455f","#4d9e7a"];
const HUMAN_AV=["🧔🏻","👩🏼‍🦰","👨🏾‍🦱","👵🏻","👴🏽","🧕🏽","👩🏻‍🌾","🧑🏽‍🍳","🧙🏻‍♂️","🧝🏼‍♀️","🤠","👸🏼","🤴🏾","🧛🏻","🧚🏼","👩🏿‍🦱","🧑🏻‍🎤","🥷🏽","👨🏼‍⚕️","🧑🏾‍🌾"];
const HUMAN_BG=["#f4d9a6","#c9e4c5","#f6c1b8","#c8d7f0","#e6cdf2","#f3e3a1","#bfe6e3","#f2c9dc","#d9d2c3","#cfe0a8"];
function robotSVG(k){
  const c=BOT_COLORS[k%BOT_COLORS.length], v=k%4, m=Math.floor(k/4)%3, dark="#1f2a36", metal="#e9eef3", edge="#6b7785";
  const eyes=[
    `<circle cx="25" cy="30" r="5" fill="${dark}"/><circle cx="39" cy="30" r="5" fill="${dark}"/><circle cx="25" cy="30" r="2.2" fill="${c}"/><circle cx="39" cy="30" r="2.2" fill="${c}"/>`,
    `<rect x="19" y="25" width="26" height="9" rx="4.5" fill="${dark}"/><rect x="22" y="28" width="20" height="3" rx="1.5" fill="${c}"/>`,
    `<rect x="20" y="26" width="9" height="9" rx="1.5" fill="${dark}"/><rect x="35" y="26" width="9" height="9" rx="1.5" fill="${dark}"/><rect x="23" y="29" width="3" height="3" fill="${c}"/><rect x="38" y="29" width="3" height="3" fill="${c}"/>`,
    `<circle cx="32" cy="30" r="8" fill="${dark}"/><circle cx="32" cy="30" r="3.6" fill="${c}"/><circle cx="34" cy="28" r="1.2" fill="#fff"/>`
  ][v];
  const mouth=[
    `<rect x="23" y="39" width="18" height="5" rx="2" fill="${edge}"/><path d="M27 39v5M32 39v5M37 39v5" stroke="${metal}" stroke-width="1.2"/>`,
    `<path d="M24 39q8 6 16 0" fill="none" stroke="${edge}" stroke-width="2.4" stroke-linecap="round"/>`,
    `<circle cx="26" cy="41" r="1.6" fill="${edge}"/><circle cx="32" cy="41" r="1.6" fill="${edge}"/><circle cx="38" cy="41" r="1.6" fill="${edge}"/>`
  ][m];
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" fill="${c}"/>
    <line x1="32" y1="9" x2="32" y2="17" stroke="${metal}" stroke-width="2.5"/><circle cx="32" cy="8" r="3.5" fill="#ffd54a"/>
    <rect x="10" y="26" width="6" height="12" rx="2" fill="#9aa7b4"/><rect x="48" y="26" width="6" height="12" rx="2" fill="#9aa7b4"/>
    <rect x="15" y="16" width="34" height="33" rx="8" fill="${metal}" stroke="${edge}" stroke-width="2"/>${eyes}${mouth}
    <rect x="22" y="49" width="20" height="8" rx="2" fill="#9aa7b4"/></svg>`;
}
function avatarHTML(av,size){
  if(!av) return "";

  if(av.bot) return `<span class="av" style="${st}">${robotSVG(av.k)}</span>`;
  const a=((av.a%HUMAN_AV.length)+HUMAN_AV.length)%HUMAN_AV.length;
  return `<span class="av" style="${st};background:${HUMAN_BG[a%HUMAN_BG.length]};font-size:${Math.round(size*.62)}px">${HUMAN_AV[a]}</span>`;

/* =============================================================
   ÉCRAN DE JEU
   ============================================================= */
function enterGame(){ show("game"); document.body.classList.remove("day"); layout(); renderPanel(); }
function changed(){ renderSeats(); renderPanel(); }

let geom={};
function seatsVM(){
  if(!S) return [];
  return S.players.map((p,i)=>({name:p.name, av:p.av,
    face:(S.phase==="over"||p.dead||p.revealed)?p.role:null, dead:p.dead,
    lover:S.phase==="over"&&!!S.lovers&&S.lovers.includes(i),
    active:S.phase==="reveal"&&i===S.turn, seen:S.phase==="reveal"&&p.seen,
    clickable:S.phase==="over"||(S.phase!=="reveal"&&!p.bot)}));
}
function centerVM(){ return S?S.center.map(r=>S.phase==="over"?r:null):[]; }
function layout(){
  if($("game").classList.contains("hidden")) return;
  const n=Math.max(1,seatsVM().length);
  const vw=window.innerWidth, vh=window.innerHeight;
  const size=Math.max(280,Math.min(vw-20,vh-230,720));
  const stage=$("stage"); stage.style.width=stage.style.height=size+"px";
  const cw=Math.round(Math.min(104,size*(n<=4?.2:n<=7?.16:n<=9?.135:.12)));
  const ch=Math.round(cw*1.4);
  geom={size,cw,ch,R:size/2-ch/2-16};
  buildFire(Math.round(size*.3));
  renderSeats();
}
window.addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(layout,120)});
function miniFace(r,w,h){
  const R=ROLES[r];
  return `<div class="minif camp-${R.camp}" style="width:${w}px;height:${h}px;font-size:${Math.max(9,w/5.2)}px"><span class="e">${R.icon}</span><span class="n">${R.name}</span></div>`;
}
function renderSeats(){
  const stage=$("stage");
  stage.querySelectorAll(".seat").forEach(s=>s.remove());
  const vm=seatsVM(), n=vm.length; if(!n||!geom.size) return;
  const {size,cw,ch,R}=geom, as=Math.max(28,Math.round(cw*.46));
  vm.forEach((v,i)=>{
    const a=(-90+360*i/n)*Math.PI/180;
    const d=document.createElement("div");
    d.className="seat"+(v.active?" active":"")+(v.seen?" seen":"")+(v.dead?" dead":"")+(v.clickable?" clickable":"");
    d.style.left=(size/2+Math.cos(a)*R)+"px"; d.style.top=(size/2+Math.sin(a)*R+10)+"px"; d.dataset.i=i;
    d.innerHTML=`<div class="sav">${avatarHTML(v.av,as)}</div><div class="mini" style="width:${cw}px;height:${ch}px">${v.lover?'<span class="lover">❤️</span>':""}${v.face?miniFace(v.face,cw,ch):BACK_SVG}</div><div class="pname">${esc(v.name)}</div>`;
    stage.appendChild(d);
  });
  const cc=$("centerCards"), sw=Math.round(cw*.55), sh=Math.round(sw*1.4);
  cc.style.marginTop=(size*.15)+"px";
  cc.innerHTML=centerVM().map(r=>`<div class="mini" style="width:${sw}px;height:${sh}px">${r?miniFace(r,sw,sh):BACK_SVG}</div>`).join("");
}

/* =============================================================
   PANNEAU DU BAS
   ============================================================= */
function renderPanel(){
  if(!S) return;
  const P=$("panel");
  if(S.phase==="reveal"){
    const p=S.players[S.turn];
    if(p.bot){
      P.innerHTML=`<div class="panel"><div class="phead">${avatarHTML(p.av,48)}<h3>${esc(p.name)} regarde sa carte…</h3></div><p class="hint" style="text-align:center">Joueur ${S.turn+1} sur ${S.players.length}</p></div>`;
      clearTimeout(window._botT); window._botT=setTimeout(botReveal,900);
      return;
    }
    const solo1=humanCount()===1;
    P.innerHTML=`<div class="panel"><div class="phead">${avatarHTML(p.av,48)}<h3>${solo1?"C'est ton tour, "+esc(p.name)+" !":"C'est au tour de "+esc(p.name)}</h3></div>
      <p>${solo1?"Découvre ta carte en toute discrétion.":`Passe l'appareil à <b>${esc(p.name)}</b>. Les autres joueurs détournent les yeux…`}</p>
      <div class="row"><button class="big-btn" style="max-width:360px" id="seeBtn">🃏 Révéler ma carte</button></div>
      <p class="hint" style="text-align:center;margin-top:10px">Joueur ${S.turn+1} sur ${S.players.length}</p></div>`;
    $("seeBtn").onclick=()=>openCard(S.turn,"turn");
    return;
  }
  if(S.phase==="ready"){
    P.innerHTML=`<div class="panel"><h3>🌙 Tout le monde connaît son rôle</h3>
      <p>Le jeu va mener la partie : nuits, débats et votes.${aliveHumans().length>1?" Gardez l'appareil au centre de la table.":""}</p>
      <div class="row"><button class="big-btn" style="max-width:360px" id="goBtn">🌙 Commencer la partie</button></div></div>`;
    const go=()=>{ if(!S||S.phase!=="ready") return; S.phase="play"; renderPanel(); ppLoop(); };
    $("goBtn").onclick=go;
    if(humanCount()===0) setTimeout(go,1500);
    return;
  }
  if(S.phase==="play"){
    const v=S.ppView;
    if(!v){ P.innerHTML=`<div class="panel"><h3>${S.isDay?"☀️ Jour":"🌙 Nuit"} ${S.night}</h3><p class="dots">La partie continue</p></div>`; return; }
    P.innerHTML=`<div class="panel"><h3>${v.title}</h3>${v.html}<div class="row" style="margin-top:12px"><button class="btn solid" id="ppBtn">${v.btn}</button></div>${humanCount()===0?`<p class="hint" style="text-align:center">Partie entre ordinateurs : elle avance toute seule.</p>`:""}</div>`;
    $("ppBtn").onclick=()=>{ if(S.ppView!==v) return; S.ppView=null; renderPanel(); v.res(); };
    return;
  }
  if(S.phase==="over"){
    P.innerHTML=`<div class="panel"><h3>Toutes les cartes sont révélées</h3><p>Merci d'avoir joué à Loup-Garou !</p>
      <div class="row"><button class="btn solid" id="againBtn">Rejouer avec les mêmes joueurs</button><button class="btn" id="quitBtn">Changer les réglages</button></div></div>`;
    $("againBtn").onclick=()=>$("startBtn").click();
    $("quitBtn").onclick=()=>{S=null;CUR=null;renderSetup();show("setup");};
  }
}
function advanceTurn(){ if(S.turn>=S.players.length-1) S.phase="ready"; else S.turn++; }

/* =============================================================
   CARTE EN GRAND
   ============================================================= */
function frontHTML(r){
  const R=ROLES[r],C=CAMP[R.camp];
  return `<div class="face front camp-${R.camp}"><span class="badge">${C.label}</span><div class="emo">${R.icon}</div><h2>${R.name}</h2><div class="desc">${R.desc}</div><div class="goal">${C.goal}</div></div>`;
}
function setFront(r){ $("bigcard").querySelector(".front").outerHTML=frontHTML(r); }
function openCardFor(o){
  $("modalInner").innerHTML=`<div class="who">${o.av?avatarHTML(o.av,34)+" ":""}Carte de <b>${esc(o.name)}</b></div>
    <div class="bigcard" id="bigcard"><div class="inner"><div class="face back">${BACK_SVG}</div>${frontHTML(o.role)}</div></div>
    <div class="extra" id="extra"></div><div class="row" id="mActions"></div>`;
  $("modal").classList.remove("hidden");
  const A=$("mActions");
  A.innerHTML=`<button class="big-btn" style="min-width:240px" id="flipBtn">👁 Révéler ma carte</button>`+(o.mode==="review"?`<button class="btn" id="cancelBtn">Annuler</button>`:"");
  if(o.mode==="review") $("cancelBtn").onclick=closeModal;
  $("flipBtn").onclick=()=>{ SND.play("flip"); $("bigcard").classList.add("flipped"); A.innerHTML=""; setTimeout(()=>afterFlip(o),650); };
}
function afterFlip(o){
  const X=$("extra"), A=$("mActions");
  if(o.thief && o.thief.length===2){
    const both=o.thief.every(isWolf);
    X.innerHTML=`<p>Voici les deux cartes du centre. Prends-en une${both?" (les deux sont des Loups : tu dois en prendre une)":", ou garde ta carte"}.</p>
      <div class="thief">${o.thief.map((r,k)=>`<div class="opt">${miniFace(r,84,118)}<button class="btn" data-k="${k}">Prendre</button></div>`).join("")}</div>`;
    X.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const nr=o.onSwap(+b.dataset.k); setFront(nr);
      X.innerHTML=`<p>Tu es désormais <b>${ROLES[nr].name}</b>.</p>`; showHide(o);
    });
    if(!both){
      A.innerHTML=`<button class="btn" id="keepBtn">Garder ma carte de Voleur</button>`;
      $("keepBtn").onclick=()=>{const nr=o.onKeep(); setFront(nr);
        X.innerHTML=`<p>Tu gardes ta carte : tu joues désormais comme un <b>Simple Villageois</b>.</p>`; showHide(o);};
    }
    return;
  }
  if(isWolf(o.role)&&o.mode==="turn") X.innerHTML=`<p class="hint">Tu découvriras tes complices pendant la première nuit.</p>`;
  showHide(o);
}
function showHide(o){
  const A=$("mActions");
  A.innerHTML=`<button class="big-btn" style="min-width:240px" id="hideBtn">🙈 Cacher ma carte${o.suffix||""}</button>`;
  $("hideBtn").onclick=ev=>{
    if(ev.currentTarget.disabled) return; ev.currentTarget.disabled=true;
    SND.play("flip");
    $("bigcard").classList.remove("flipped");

  };
}
function closeModal(){$("modal").classList.add("hidden");$("modalInner").innerHTML="";}
function openCard(i,mode){
  const p=S.players[i];
  openCardFor({name:p.name, av:p.av, role:p.role, mode,
    suffix: mode==="turn" ? (i===S.players.length-1?" et terminer":" et passer") : "",
    thief: (mode==="turn"&&p.role==="voleur"&&!p.thiefDone&&S.center.length===2)?S.center.slice():null,
    onSwap:k=>{const nr=S.center[k]; S.center[k]="voleur"; p.role=nr; p.thiefDone=true; renderSeats(); return nr;},
    onKeep:()=>{p.thiefDone=true; p.role="villageois"; renderSeats(); return "villageois";},
    onHide:()=>{ if(mode==="turn"){p.seen=true; advanceTurn();} changed(); }
  });
}
$("stage").addEventListener("click",e=>{
  const seat=e.target.closest(".seat"); if(!seat||!S||S.phase==="reveal") return;
  const i=+seat.dataset.i;
  if(S.phase==="over"||!S.players[i].bot) openCard(i,"review");
});
function showWin(w){
  SND.play(w==="l"?"wolfwin":"fanfare",.3);
  const res=WINS[w]; if(!res) return;
  $("modalInner").innerHTML=`<div class="win"><div class="emo">${res.e}</div><h2>${res.t}</h2></div><p class="hint" style="font-size:1.05rem">${res.s}</p>
    <div class="row"><button class="btn solid" id="wCont">Fermer</button></div>`;
  $("modal").classList.remove("hidden");
  $("wCont").onclick=closeModal;
}

/* =============================================================
   PASSE ET JOUE : le jeu est le meneur, des ordinateurs peuvent jouer
   ============================================================= */
let CUR=null;
const hang=()=>new Promise(()=>{});
const P=i=>S.players[i];
const humanCount=()=>S.players.filter(p=>!p.bot).length;
const aliveIdx=()=>S.players.map((p,i)=>i).filter(i=>!S.players[i].dead);
const aliveHumans=()=>aliveIdx().filter(i=>!P(i).bot);
const aliveBots=()=>aliveIdx().filter(i=>P(i).bot);
const rnd=a=>a&&a.length?a[Math.floor(Math.random()*a.length)]:null;
const roleOf=i=>P(i).role;
const powers=r=>!(S.powersLost&&["voyante","sorciere","salvateur","chasseur"].includes(r));
const partner=i=>(S.lovers&&S.lovers.includes(i))?S.lovers.find(j=>j!==i):null;
const label=i=>`${avatarHTML(P(i).av,24)} ${esc(P(i).name)}`;
const roleTag=r=>`${ROLES[r].icon} ${ROLES[r].name}`;
const gmlAllowed=()=>!S.players.some(p=>p.dead&&isWolf(p.role));
function majority(arr){
  if(!arr.length) return null;
  const c={}; arr.forEach(x=>c[x]=(c[x]||0)+1);
  const m=Math.max(...Object.values(c));
  return rnd(Object.keys(c).filter(k=>c[k]===m).map(Number));
}
function openModal(html){ $("modalInner").innerHTML=html; $("modal").classList.remove("hidden"); }
function headFor(i){ return `<div class="who">${avatarHTML(P(i).av,30)} <b>${esc(P(i).name)}</b> · ${roleTag(roleOf(i))} · ${S.isDay?"Jour":"Nuit"} ${S.night}</div>`; }

function passTo(i){
  if(S!==CUR) return hang();
  return new Promise(res=>{
    if(humanCount()<=1) return res();
    openModal(`<div class="who">${S.isDay?"☀️":"🌙"} Passe l'appareil à</div>${avatarHTML(P(i).av,96)}<div class="pass-name">${esc(P(i).name)}</div>
      <p class="hint">Les autres joueurs détournent les yeux…</p>
      <button class="big-btn" id="pOk">Je suis ${esc(P(i).name)}</button>`);
    $("pOk").onclick=()=>{closeModal();res();};
  });
}
function pick(i,o){
  if(S!==CUR) return hang();
  return new Promise(res=>{
    openModal(`${headFor(i)}<h2 class="pick-title">${o.title}</h2>${o.text?`<p class="hint">${o.text}</p>`:""}
      <div class="pick-grid">${o.options.map(j=>`<button class="pick" data-j="${j}">${label(j)}${j===i?" (toi)":""}</button>`).join("")}</div>
      ${o.skip?`<button class="btn" id="pSkip">${o.skip}</button>`:""}`);
    $("modalInner").querySelectorAll(".pick").forEach(b=>b.onclick=()=>{closeModal();res(+b.dataset.j);});
    if(o.skip) $("pSkip").onclick=()=>{closeModal();res(null);};
  });
}
function choose(i,html,labels){
  if(S!==CUR) return hang();
  return new Promise(res=>{
    openModal(`${headFor(i)}<div class="mtext">${html}</div><div class="mbtns">${labels.map((l,k)=>`<button class="${k===0?"big-btn":"btn"}" data-k="${k}">${l}</button>`).join("")}</div>`);
    $("modalInner").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{closeModal();res(+b.dataset.k);});
  });
}
const info=(i,html,btn)=>choose(i,html,[btn||"Continuer"]);
function publicStep(title,html,btn){
  if(S!==CUR) return hang();
  return new Promise(res=>{
    S.ppView={title,html,btn,res}; renderSeats(); renderPanel();
    if(humanCount()===0) setTimeout(()=>{ if(S&&S.ppView&&S.ppView.res===res){S.ppView=null;res();} },2600);
  });
}

/* ---- Révélation automatique d'un ordinateur ---- */
function botReveal(){
  if(!S||S.phase!=="reveal") return;
  const p=S.players[S.turn]; if(!p||!p.bot) return;
  if(p.role==="voleur"&&!p.thiefDone&&S.center.length===2){
    if(S.center.every(isWolf)||Math.random()<.5){const k=Math.floor(Math.random()*2),nr=S.center[k];S.center[k]="voleur";p.role=nr;}
    else p.role="villageois";
    p.thiefDone=true;
  }
  p.seen=true; advanceTurn(); changed();
}

/* ---- Nuit : actions des humains (phase A puis B) ---- */
async function nightA(i,N){
  const r=roleOf(i), others=aliveIdx().filter(j=>j!==i);
  if(r==="cupidon"&&S.night===1&&!S.lovers&&aliveIdx().length>=2){
    const a=await pick(i,{title:"💘 Choisis le premier amoureux",options:aliveIdx()});
    const b=await pick(i,{title:"💘 Choisis le second amoureux",text:`Premier amoureux : ${esc(P(a).name)}`,options:aliveIdx().filter(j=>j!==a)});
    S.lovers=[a,b];
    return info(i,`<p>💘 <b>${esc(P(a).name)}</b> et <b>${esc(P(b).name)}</b> sont désormais liés par l'amour.</p>`);
  }
  if(isWolf(r)){
    const pack=aliveIdx().filter(j=>j!==i&&isWolf(roleOf(j)));
    const prey=aliveIdx().filter(j=>!isWolf(roleOf(j)));
    if(!prey.length) return info(i,"<p>Il n'y a plus personne à dévorer.</p>");
    const prev=N.wolfVotes.map(v=>`${esc(P(v.by).name)} → ${esc(P(v.t).name)}`).join(", ");
    const t=await pick(i,{title:"🐺 Choisis la victime de cette nuit",
      text:`Ta meute : ${pack.length?pack.map(j=>label(j)).join(", "):"tu chasses seul(e)"}${prev?`<br>Votes de la meute : ${prev}`:""}`,options:prey});
    N.wolfVotes.push({by:i,t});
    if(r==="gml"&&gmlAllowed()&&prey.length>1){
      N.gml=await pick(i,{title:"👹 Seconde victime (Grand Méchant Loup)",options:prey.filter(j=>j!==t),skip:"Pas de seconde victime"});
    }
    return;
  }
  if(r==="voyante"&&powers(r)&&others.length){
    const t=await pick(i,{title:"🔮 Quel joueur veux-tu espionner ?",options:others});
    return info(i,`<p><b>${esc(P(t).name)}</b> est :</p><div class="thief">${miniFace(roleOf(t),100,140)}</div>`);
  }
  if(r==="salvateur"&&powers(r)){
    const opts=aliveIdx().filter(j=>j!==S.lastProtect);
    N.protect=await pick(i,{title:"🛡️ Qui veux-tu protéger cette nuit ?",
      text:S.lastProtect!=null&&!P(S.lastProtect).dead?`Tu ne peux pas protéger ${esc(P(S.lastProtect).name)} deux nuits de suite.`:"",options:opts});
    return;
  }
  return info(i,`<p class="hint">Rien à faire pour toi cette nuit.<br>Garde les yeux fermés…</p>`);
}
function hasB(i){
  const r=roleOf(i);
  return (S.night===1&&S.lovers&&S.lovers.includes(i)) || (r==="sorciere"&&powers(r)&&(S.potions.heal||S.potions.poison));
}
async function nightB(i,N){
  const r=roleOf(i); let did=false;
  if(S.night===1&&S.lovers&&S.lovers.includes(i)){
    did=true;
    await info(i,`<p>💘 Cupidon t'a frappé(e) de sa flèche !<br>Tu es amoureux(se) de <b>${esc(P(partner(i)).name)}</b>.</p>
      <p class="hint">Si l'un de vous meurt, l'autre meurt de chagrin. Vous gagnez ensemble si vous êtes les deux derniers survivants.</p>`);
  }
  if(r==="sorciere"&&powers(r)&&(S.potions.heal||S.potions.poison)){
    did=true;
    const v=N.victim;
    if(v==null) await info(i,"<p>Personne n'a été attaqué cette nuit.</p>");
    else if(S.potions.heal){
      const k=await choose(i,`<p>🐺 Cette nuit, les loups ont attaqué <b>${esc(P(v).name)}</b>.</p>`,["🧪 Utiliser la potion de guérison","Ne rien faire"]);
      if(k===0){N.healed=true;S.potions.heal=false;}
    } else await info(i,`<p>🐺 Les loups ont attaqué <b>${esc(P(v).name)}</b>.</p><p class="hint">Ta potion de guérison est déjà utilisée.</p>`);
    if(S.potions.poison){
      const t=await pick(i,{title:"☠️ Utiliser la potion d'empoisonnement ?",options:aliveIdx().filter(j=>j!==i),skip:"Garder la potion"});
      if(t!=null){N.poison=t;S.potions.poison=false;}
    }
  }
  if(!did) await info(i,`<p class="hint">Rien à faire pour toi.<br>Garde les yeux fermés…</p>`);
}

/* ---- Nuit : actions des ordinateurs ---- */
function botsNightA(N){
  aliveBots().forEach(i=>{
    const r=roleOf(i);
    if(r==="cupidon"&&S.night===1&&!S.lovers){const al=shuffle(aliveIdx().slice()); if(al.length>=2) S.lovers=[al[0],al[1]];}
    if(r==="voyante"&&powers(r)){const k=S.know[i]||(S.know[i]={}); const t=rnd(aliveIdx().filter(j=>j!==i&&!(j in k))); if(t!=null) k[t]=roleOf(t);}
    if(r==="salvateur"&&powers(r)) N.protect=rnd(aliveIdx().filter(j=>j!==S.lastProtect));
  });
  const prey=aliveIdx().filter(j=>!isWolf(roleOf(j)));
  const botWolves=aliveBots().filter(i=>isWolf(roleOf(i)));
  if(botWolves.length&&prey.length){
    let t=majority(N.wolfVotes.map(v=>v.t));
    if(t==null){const opts=prey.filter(j=>!botWolves.some(w=>partner(w)===j)); t=rnd(opts.length?opts:prey);}
    botWolves.forEach(i=>N.wolfVotes.push({by:i,t}));
  }
  N.victim=majority(N.wolfVotes.map(v=>v.t));
  const g=aliveBots().find(i=>roleOf(i)==="gml");
  if(g!=null&&gmlAllowed()&&Math.random()<.7) N.gml=rnd(prey.filter(j=>j!==N.victim&&j!==partner(g)));
  if(N.gml===N.victim) N.gml=null;
}
function botsNightB(N){
  const s=aliveBots().find(i=>roleOf(i)==="sorciere"); if(s==null||!powers("sorciere")) return;
  if(S.potions.heal&&N.victim!=null&&Math.random()<(N.victim===s||N.victim===partner(s)?.95:.45)){N.healed=true;S.potions.heal=false;}
  if(S.potions.poison&&Math.random()<.15){const t=rnd(aliveIdx().filter(j=>j!==s&&j!==partner(s)&&!(N.healed&&j===N.victim)));if(t!=null){N.poison=t;S.potions.poison=false;}}
}
function nightDeaths(N){
  const d=[];
  const hit=t=>{ if(t==null||t===N.protect) return;
    if(roleOf(t)==="ancien"&&!P(t).shieldUsed){P(t).shieldUsed=true;return;}
    d.push(t); };
  if(!N.healed) hit(N.victim);
  hit(N.gml);
  if(N.poison!=null) d.push(N.poison);
  S.lastProtect=N.protect;
  return [...new Set(d)];
}

/* ---- Morts en chaîne : amoureux, chasseur ---- */
const CAUSE={night:"est mort(e) cette nuit.",grief:"meurt de chagrin.",shot:"est abattu(e) par le Chasseur.",vote:"est éliminé(e) par le village."};
function botVoteTarget(i){
  const others=aliveIdx().filter(j=>j!==i&&j!==partner(i));
  if(!others.length) return null;
  if(isWolf(roleOf(i))){const v=others.filter(j=>!isWolf(roleOf(j)));return rnd(v.length?v:others);}
  const k=S.know[i]||{};
  const w=others.filter(j=>k[j]&&isWolf(k[j])); if(w.length) return rnd(w);
  const pool=others.filter(j=>!(k[j]&&!isWolf(k[j]))&&!P(j).revealed);
  return rnd(pool.length?pool:others);
}
async function processDeaths(list,cause,base){
  const out=[], q=list.map(i=>({i,cause})); let k=0; base=base||0;
  while(q.length){
    const c=q.shift(), p=P(c.i); if(p.dead) continue;
    p.dead=true; renderSeats();
    SND.play("knell",base+1.3*k++);
    out.push(`💀 <b>${esc(p.name)}</b> ${CAUSE[c.cause]} C'était : ${roleTag(p.role)}.`);
    const o=partner(c.i); if(o!=null&&!P(o).dead) q.push({i:o,cause:"grief"});
    if(p.role==="chasseur"&&powers("chasseur")){
      const opts=aliveIdx(); if(!opts.length) continue;
      let t;
      if(p.bot){ t=(S.intent&&S.intent[c.i]!=null&&!P(S.intent[c.i]).dead)?S.intent[c.i]:botVoteTarget(c.i); if(t==null) t=rnd(opts); }
      else { await passTo(c.i); t=await pick(c.i,{title:"🏹 Tu es mort(e) ! Sur qui tires-tu ta dernière balle ?",options:opts}); }
      SND.play("shot",p.bot?base+1.3*k:0);
      out.push(`🏹 ${esc(p.name)}, le Chasseur, tire sur <b>${esc(P(t).name)}</b> !`);
      q.push({i:t,cause:"shot"});
    }
  }
  return out;
}

/* ---- Jour : débat et vote ---- */
const LINES=["Je trouve <b>%</b> bien trop silencieux…","<b>%</b> me paraît louche.","Je voterai contre <b>%</b>.","Cette nuit, j'ai cru voir <b>%</b> rôder près de la forêt…","Je ne fais pas confiance à <b>%</b>.","<b>%</b> cache quelque chose, j'en suis sûr(e)."];
function botLine(i,t){
  if(t==null) return "Je ne sais vraiment pas quoi penser…";
  const k=S.know[i]||{};
  if(k[t]&&isWolf(k[t])&&!isWolf(roleOf(i))) return `J'ai des informations : <b>${esc(P(t).name)}</b> est un Loup-Garou !`;
  return rnd(LINES).replace("%",esc(P(t).name));
}
async function dayPhase(){
  S.intent={};
  aliveBots().forEach(i=>S.intent[i]=botVoteTarget(i));
  const talk=aliveBots().map(i=>`<li>${label(i)} : « ${botLine(i,S.intent[i])} »</li>`).join("");
  await publicStep(`🗣️ Débat — Jour ${S.night}`,`<p>Discutez entre vous : qui est le Loup-Garou ?</p>${talk?`<ul class="talk">${talk}</ul>`:""}`,"🗳️ Passer au vote");
  const votes=[];
  for(const i of aliveHumans().filter(i=>!P(i).noVote)){
    await passTo(i);
    const t=await pick(i,{title:"🗳️ Contre qui votes-tu ?",options:aliveIdx().filter(j=>j!==i),skip:"Ne pas voter"});
    if(t!=null) votes.push({by:i,t});
  }
  const hp=majority(votes.map(v=>v.t));
  aliveBots().filter(i=>!P(i).noVote).forEach(i=>{
    let t=S.intent[i];
    if(hp!=null&&hp!==i&&hp!==partner(i)&&Math.random()<.4&&!(isWolf(roleOf(i))&&isWolf(roleOf(hp)))) t=hp;
    if(t==null||P(t).dead) t=botVoteTarget(i);
    if(t!=null) votes.push({by:i,t});
  });
  const cnt={}; votes.forEach(v=>cnt[v.t]=(cnt[v.t]||0)+1);
  const max=Math.max(0,...Object.values(cnt));
  const top=Object.keys(cnt).filter(k=>cnt[k]===max).map(Number);
  let cond=null, note="";
  if(!votes.length) note="Personne n'a voté : personne n'est éliminé.";
  else if(top.length===1) cond=top[0];
  else { const b=aliveIdx().find(j=>roleOf(j)==="bouc");
    if(b!=null){cond=b;note="⚖️ Égalité ! Le Bouc Émissaire est sacrifié.";} else note="⚖️ Égalité : personne n'est éliminé aujourd'hui."; }
  SND.play("drum");
  const tally=`<ul class="talk">${votes.map(v=>`<li>${label(v.by)} → ${esc(P(v.t).name)}</li>`).join("")}</ul>`;
  let msgs=[];
  if(cond!=null){
    const p=P(cond);
    if(p.role==="idiot"&&!p.revealed){ p.revealed=true; p.noVote=true; renderSeats();
      msgs.push(`🤪 <b>${esc(p.name)}</b> est l'Idiot du Village ! Il est épargné, mais perd son droit de vote.`); }
    else {
      const anc=p.role==="ancien";
      if(anc) S.powersLost=true;
      msgs=await processDeaths([cond],"vote",1.7);
      if(anc) msgs.push("😱 Le village a tué l'Ancien : tous les villageois perdent leurs pouvoirs !");
    }
  }
  await publicStep("🗳️ Résultat du vote",`${tally}${note?`<p class="step">${note}</p>`:""}${msgs.map(m=>`<p class="step">${m}</p>`).join("")}`,"Continuer");
}
function ppWin(){
  const alive=aliveIdx(); let w=null;
  if(!alive.length) w="n";
  else if(alive.length===2&&S.lovers&&alive.every(i=>S.lovers.includes(i))) w="a";
  else if(!alive.some(i=>isWolf(roleOf(i)))) w="v";
  else if(alive.every(i=>isWolf(roleOf(i)))) w="l";
  if(!w) return false;
  S.winner=w; S.phase="over"; S.ppView=null; document.body.classList.remove("day");
  renderSeats(); renderPanel(); showWin(w);
  return true;
}
async function ppLoop(){
  CUR=S; const G=S;
  while(S===G){
    S.isDay=false; document.body.classList.remove("day");
    SND.play("howl",.2); SND.play("owl",4.2);
    await publicStep(`🌙 Nuit ${S.night}`,`<p class="step">La nuit tombe sur Thiercelieux. Tout le village s'endort…</p>${aliveHumans().length>1?`<p class="hint" style="text-align:center">Chaque joueur va recevoir l'appareil à tour de rôle, qu'il ait un pouvoir ou non.</p>`:""}`,"🌙 Fermer les yeux");
    const N={wolfVotes:[],victim:null,gml:null,protect:null,healed:false,poison:null};
    for(const i of aliveHumans()){ await passTo(i); await nightA(i,N); }
    botsNightA(N);
    if(aliveHumans().some(hasB)) for(const i of aliveHumans()){ await passTo(i); await nightB(i,N); }
    botsNightB(N);
    const dead=nightDeaths(N);
    S.isDay=true; document.body.classList.add("day");
    SND.play("birds");
    const eaten=dead.some(i=>i===N.victim||i===N.gml);
    if(eaten) SND.play("devour",.9);
    const msgs=await processDeaths(dead,"night",eaten?2.8:1);
    await publicStep(`☀️ Jour ${S.night}`,msgs.length?msgs.map(m=>`<p class="step">${m}</p>`).join(""):`<p class="step">🌅 Miracle : personne n'est mort cette nuit !</p>`,"Continuer");
    if(ppWin()) return;
    await dayPhase();
    if(ppWin()) return;
    S.night++;
  }
}

})();
</script>
