<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loup-Garou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8b75a; --gold2:#f6d28b; --ink:#f3e7cf; --muted:#b9a88a;
  --night1:#070b1c; --night2:#141b3a; --ember:#ff7a1a;
  --village:#3f6b3a; --loups:#8e1c1c; --ambigu:#5b2f7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Alegreya',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% 120%,#2a1a10 0%,#130e14 35%,var(--night2) 60%,var(--night1) 100%);
  min-height:100vh;overflow-x:hidden;transition:background 1.2s;
}
body.day{background:radial-gradient(ellipse at 50% 120%,#5a4220 0%,#7d6a52 30%,#8fa7c4 65%,#c7d8ea 100%)}
#stars{position:fixed;top:0;left:0;width:2px;height:2px;border-radius:50%;pointer-events:none;transition:opacity 1.2s}
body.day #stars{opacity:0}
#moon{position:fixed;top:5vh;right:7vw;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffbe8,#e9dfb8 60%,#cbbd8e);
  box-shadow:0 0 40px 10px rgba(255,245,200,.25);pointer-events:none;transition:all 1.2s}
body.day #moon{background:radial-gradient(circle,#fff6c9,#ffd34d);box-shadow:0 0 60px 25px rgba(255,220,90,.5)}
#trees{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;opacity:.9}
h1,h2,h3{font-family:'Cinzel',serif;font-weight:700;margin:0}
button{font-family:'Cinzel',serif;cursor:pointer}
.hidden{display:none!important}

/* ---------- SETUP ---------- */
#setup{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:36px 18px 80px}
.title{font-family:'Cinzel Decorative',serif;font-weight:900;text-align:center;
  font-size:clamp(2.4rem,8vw,4.4rem);letter-spacing:.04em;color:var(--gold2);
  text-shadow:0 0 18px rgba(255,140,40,.55),0 3px 0 #3a1d08}
.subtitle{text-align:center;font-style:italic;color:var(--muted);margin:4px 0 28px;font-size:1.1rem}
.panel{background:rgba(14,12,24,.78);border:1px solid rgba(232,183,90,.35);border-radius:16px;
  padding:20px 22px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.panel h2{font-size:1.15rem;color:var(--gold);margin-bottom:12px;letter-spacing:.06em}
.count-row{display:flex;flex-wrap:wrap;gap:8px}
.count-row button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(232,183,90,.5);
  background:rgba(255,255,255,.04);color:var(--ink);font-size:1.05rem;transition:.15s}
.count-row button:hover{background:rgba(232,183,90,.15)}
.count-row button.on{background:var(--gold);color:#2a1606;font-weight:700;box-shadow:0 0 14px rgba(232,183,90,.7)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.names label{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:.85rem;color:var(--muted)}
.names label span{width:22px;text-align:right}
.names input{flex:1;min-width:0;background:#fff;color:#000;border:2px solid #fff;border-radius:8px;
  padding:9px 10px;font-family:'Alegreya',serif;font-size:1.05rem;outline:none}
.names input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,183,90,.35)}
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);user-select:none;transition:.15s;font-size:.98rem}
.chip .ic{font-size:1.35rem}
.chip.on{border-color:var(--gold);background:rgba(232,183,90,.16)}
.chip.on.loups{border-color:#e05050;background:rgba(160,30,30,.28)}
.chip.on.ambigu{border-color:#b07ce0;background:rgba(110,50,150,.28)}
.camp-label{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.stepper{display:inline-flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:1px solid #e05050;background:rgba(160,30,30,.22)}
.stepper button{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:var(--ink);font-size:1.1rem}
.stepper b{min-width:18px;text-align:center;font-size:1.15rem}
.summary{margin-top:14px;font-size:.98rem;color:var(--muted);line-height:1.45}
.summary .err{color:#ff8a7a;font-weight:600}
.big-btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:1.25rem;letter-spacing:.08em;
  background:linear-gradient(180deg,#f6c56a,#c9822b);color:#2a1606;font-weight:700;
  box-shadow:0 6px 0 #6b3a10,0 10px 30px rgba(255,140,40,.35);transition:.12s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b3a10}
.big-btn:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--gold);background:rgba(232,183,90,.12);color:var(--gold2);font-size:.95rem;letter-spacing:.04em}
.btn:hover{background:rgba(232,183,90,.25)}
.btn.solid{background:var(--gold);color:#2a1606;font-weight:700}
.btn.red{border-color:#e05050;color:#ffb3a8;background:rgba(160,30,30,.25)}

/* ---------- GAME ---------- */
#game{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 10px 0}
.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .small-title{font-family:'Cinzel Decorative',serif;color:var(--gold2);font-size:1.3rem;text-shadow:0 0 10px rgba(255,140,40,.5)}
.topbar .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.topbar .btn{padding:7px 11px;font-size:.8rem}
#stage{position:relative;margin:6px auto 0;flex-shrink:0}
.ground{position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,45,25,.85) 0%,rgba(40,30,22,.7) 45%,rgba(20,18,20,0) 72%)}
.glow{position:absolute;left:50%;top:50%;width:90%;height:90%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,50,.42) 0%,rgba(255,110,30,.16) 35%,rgba(0,0,0,0) 65%);
  animation:glow 2.2s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{0%{opacity:.75;transform:translate(-50%,-50%) scale(.97)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.fire{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.stone{position:absolute;border-radius:45%;background:radial-gradient(circle at 35% 30%,#8a8178,#4a443f 70%);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.log{position:absolute;left:10%;width:80%;height:13%;bottom:14%;border-radius:40%;
  background:linear-gradient(180deg,#7a4a26,#3e2210);box-shadow:inset 0 -3px 4px rgba(0,0,0,.5)}
.log::after{content:"";position:absolute;right:3%;top:15%;width:12%;height:70%;border-radius:50%;background:radial-gradient(circle,#c98a4e,#6a3a18)}
.log.a{transform:rotate(18deg)} .log.b{transform:rotate(-18deg)}
.fl{position:absolute;left:50%;bottom:24%;transform-origin:50% 100%;animation:flick 1s ease-in-out infinite alternate}
.fl i{display:block;width:100%;height:100%;border-radius:50% 0 50% 50%;transform:rotate(-45deg);filter:blur(1px)}
.fl.f1{width:56%;height:56%;animation-duration:1.3s} .fl.f1 i{background:radial-gradient(circle at 70% 30%,#ff5a1a,#c4200a 70%);opacity:.9}
.fl.f2{width:42%;height:42%;animation-duration:.9s} .fl.f2 i{background:radial-gradient(circle at 70% 30%,#ffae2a,#ff6a10)}
.fl.f3{width:28%;height:28%;animation-duration:.7s} .fl.f3 i{background:radial-gradient(circle at 70% 30%,#fff2a0,#ffc430)}
.fl.f4{width:13%;height:13%;bottom:26%;animation-duration:.5s} .fl.f4 i{background:#fffdf0;filter:blur(2px)}
.fl.f5{width:30%;height:30%;margin-left:-16%;animation-duration:1.1s;animation-delay:-.4s} .fl.f5 i{background:radial-gradient(circle at 70% 30%,#ff8d24,#d63a0c);opacity:.85}
.fl.f6{width:26%;height:26%;margin-left:15%;animation-duration:.85s;animation-delay:-.2s} .fl.f6 i{background:radial-gradient(circle at 70% 30%,#ff9a2a,#d8400c);opacity:.85}
@keyframes flick{0%{transform:translateX(-50%) scale(1,1) skewX(0)}35%{transform:translateX(-50%) scale(.93,1.1) skewX(3deg)}70%{transform:translateX(-50%) scale(1.04,.95) skewX(-3deg)}100%{transform:translateX(-50%) scale(.96,1.14) skewX(1deg)}}
.spark{position:absolute;bottom:45%;width:3px;height:3px;border-radius:50%;background:#ffd27a;box-shadow:0 0 6px #ff9a2a;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-140%);opacity:0}}
.center-cards{position:absolute;left:50%;top:50%;display:flex;gap:4px;transform:translate(-50%,0)}

.seat{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);transition:filter .3s}
.mini{position:relative;border-radius:9px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);transition:.35s;cursor:default;background:#111}
.mini svg{display:block;width:100%;height:100%}
.seat.clickable .mini{cursor:pointer}
.seat.clickable .mini:hover{transform:translateY(-4px)}
.seat.active .mini{box-shadow:0 0 0 3px var(--gold2),0 0 26px 8px rgba(255,170,60,.75);transform:translateY(-6px) scale(1.07);animation:pulse 1.4s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--gold2),0 0 36px 14px rgba(255,170,60,.9)}}
.seat.seen .mini::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.75rem;color:var(--gold2);text-shadow:0 0 4px #000}
.seat.dead{filter:grayscale(1) brightness(.55)}
.seat.dead .mini::before{content:"💀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8em;z-index:2;filter:grayscale(0)}
.pname{margin-top:6px;padding:2px 9px;border-radius:20px;background:rgba(0,0,0,.65);font-family:'Cinzel',serif;font-size:.78rem;
  max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(232,183,90,.25)}
.seat.active .pname{background:var(--gold);color:#2a1606;font-weight:700}
.minif{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;border:2px solid rgba(255,255,255,.35);border-radius:9px}
.minif .e{font-size:1.9em;line-height:1}
.minif .n{font-family:'Cinzel',serif;font-size:.55em;line-height:1.1;margin-top:4px;color:#fff}
.camp-village{background:linear-gradient(160deg,#5d8a4e,#2c4a26)}
.camp-loups{background:linear-gradient(160deg,#b52a2a,#4d0b0b)}
.camp-ambigu{background:linear-gradient(160deg,#8a52b8,#371a4f)}
.lover{position:absolute;top:-8px;left:-8px;font-size:1rem;z-index:3;filter:drop-shadow(0 0 4px #ff4f8b)}

#panel{position:relative;width:100%;max-width:680px;margin:10px auto 14px;text-align:center}
#panel .panel{padding:16px 18px}
#panel h3{font-size:1.25rem;color:var(--gold2)}
#panel p{margin:6px 0 12px;color:var(--muted)}
.steps{text-align:left;margin:8px 0 12px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed rgba(255,255,255,.1);cursor:pointer}
.steps li:last-child{border:none}
.steps li input{margin-top:5px;accent-color:var(--gold)}
.steps li.done{opacity:.45;text-decoration:line-through}
.steps .e{font-size:1.2rem}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,3,10,.88);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);overflow:auto}
.modal-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;width:100%}
.who{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--muted)}
.who b{color:var(--gold2);font-size:1.35rem}
.bigcard{width:min(270px,70vw);aspect-ratio:5/7;perspective:1200px}
.bigcard .inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.bigcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.face.back svg{width:100%;height:100%;display:block}
.face.front{transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;padding:18px 16px;text-align:center;border:3px solid rgba(255,230,180,.6)}
.face.front .badge{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff}
.face.front .emo{font-size:clamp(3.2rem,16vw,4.6rem);line-height:1;margin:12px 0 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.face.front h2{font-size:1.25rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.face.front .desc{font-size:.95rem;line-height:1.35;margin-top:10px;color:#fff6e6}
.face.front .goal{margin-top:auto;font-size:.82rem;font-style:italic;color:#ffe9c2;border-top:1px solid rgba(255,255,255,.3);padding-top:8px}
.extra{width:100%;text-align:center}
.extra p{color:var(--muted);margin:4px 0 10px;font-size:.95rem}
.thief{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.thief .opt{display:flex;flex-direction:column;align-items:center;gap:6px}
.thief .minif{width:84px;height:118px;font-size:16px;border-radius:10px}
.hint{font-size:.85rem;color:var(--muted);font-style:italic;text-align:center}

#menu{position:fixed;z-index:15;background:#16121f;border:1px solid var(--gold);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#menu .mh{font-family:'Cinzel',serif;color:var(--gold2);padding:6px 10px 8px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:4px}
#menu button{background:none;border:none;color:var(--ink);text-align:left;padding:9px 10px;border-radius:8px;font-family:'Alegreya',serif;font-size:1rem}
#menu button:hover{background:rgba(232,183,90,.15)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;z-index:30;background:#1d1626;border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:30px;transition:.35s;font-family:'Cinzel',serif;font-size:.92rem;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.win h2{font-family:'Cinzel Decorative',serif;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold2);text-align:center;text-shadow:0 0 20px rgba(255,140,40,.6)}
.win .emo{font-size:4rem;text-align:center}
</style>
</head>
<body>
<div id="stars"></div>
<div id="moon"></div>
<svg id="trees" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><path fill="#05070f" d="M0 300V190l30-60 25 55 20-80 30 85 25-50 30 60 20-95 35 100 25-45 30 50 25-90 30 95 20-40 30 45 25-110 35 115 25-55 30 60 20-85 30 90 25-45 30 50 25-100 35 105 25-50 30 55 20-80 30 85 25-40 30 45 25-95 35 100 25-60 30 65 20-85 30 90 25-45 30 50 25-105 35 110 25-55 30 60 20-80 30 85 25-50 30 55 25-90 35 95 25-45 30 50 V300Z"/></svg>

<!-- ============ SETUP ============ -->
<section id="setup">
  <div class="title">Loup-Garou</div>
  <div class="subtitle">La nuit tombe sur le village… Qui se cache parmi vous ?</div>

  <div class="panel">
    <h2>Nombre de joueurs</h2>
    <div class="count-row" id="countRow"></div>
  </div>

  <div class="panel">
    <h2>Noms des joueurs</h2>
    <div class="names" id="names"></div>
  </div>

  <div class="panel">
    <h2>Composition des cartes</h2>
    <div class="camp-label">Camp des Loups-Garous</div>
    <div class="roles-grid" id="wolfRoles"></div>
    <div class="camp-label">Camp des Villageois</div>
    <div class="roles-grid" id="villageRoles"></div>
    <div class="camp-label">Personnages solitaires / ambigus</div>
    <div class="roles-grid" id="ambiguRoles"></div>
    <div class="summary" id="summary"></div>
  </div>

  <button class="big-btn" id="startBtn">🔥 Allumer le feu de camp</button>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="hidden">
  <div class="topbar">
    <div class="small-title">Loup-Garou</div>
    <div class="btns">
      <button class="btn hidden" id="viewBtn">👁 Vue meneur</button>
      <button class="btn" id="newBtn">↺ Nouvelle partie</button>
    </div>
  </div>
  <div id="stage">
    <div class="ground"></div>
    <div class="glow"></div>
    <div class="fire" id="fire"></div>
    <div class="center-cards" id="centerCards"></div>
  </div>
  <div id="panel"></div>
</section>

<!-- ============ MODAL ============ -->
<div class="modal hidden" id="modal">
  <div class="modal-inner" id="modalInner"></div>
</div>
<div id="menu" class="hidden"></div>
<div id="toast"></div>

<script>
/* ------------------ DONNÉES ------------------ */
const ROLES = {
  villageois:{name:"Simple Villageois",icon:"🧑‍🌾",camp:"village",
    desc:"Tu n'as aucun pouvoir particulier : ta seule arme est le débat et le vote."},
  voyante:{name:"Voyante",icon:"🔮",camp:"village",
    desc:"Chaque nuit, tu te réveilles pour espionner la carte de rôle d'un joueur."},
  sorciere:{name:"Sorcière",icon:"🧪",camp:"village",
    desc:"Tu possèdes deux potions : une de guérison pour sauver la victime des loups, et une d'empoisonnement pour éliminer quelqu'un."},
  chasseur:{name:"Chasseur",icon:"🏹",camp:"village",
    desc:"Si tu es éliminé, tu tires une dernière fois et emmènes le joueur de ton choix dans la tombe."},
  salvateur:{name:"Salvateur",icon:"🛡️",camp:"village",
    desc:"Chaque nuit, tu protèges un joueur contre l'attaque des loups."},
  ancien:{name:"Ancien",icon:"🧓",camp:"village",
    desc:"Tu résistes à une première attaque des loups. Mais si le village te tue, tous les villageois perdent leurs pouvoirs."},
  bouc:{name:"Bouc Émissaire",icon:"🐐",camp:"village",
    desc:"En cas d'égalité lors du vote du village, c'est toi qui es éliminé."},
  idiot:{name:"Idiot du Village",icon:"🤪",camp:"village",
    desc:"Si le village te condamne, tu es épargné… mais tu perds ton droit de vote pour la suite."},
  loup:{name:"Loup-Garou",icon:"🐺",camp:"loups",
    desc:"Chaque nuit, tu te réveilles avec tes semblables pour choisir une victime."},
  gml:{name:"Grand Méchant Loup",icon:"👹",camp:"loups",
    desc:"Tu chasses avec la meute, et tu peux dévorer une deuxième victime chaque nuit tant qu'aucun autre loup n'est mort."},
  cupidon:{name:"Cupidon",icon:"💘",camp:"ambigu",
    desc:"Au début de la partie, tu lies deux joueurs par l'amour. Si l'un meurt, l'autre meurt de chagrin."},
  voleur:{name:"Voleur",icon:"🎭",camp:"ambigu",
    desc:"Au premier tour, tu peux échanger ta carte avec l'une des deux cartes restantes au centre."}
};
const CAMP = {
  village:{label:"Camp des Villageois",goal:"Ton but : démasquer et éliminer tous les Loups-Garous."},
  loups:{label:"Camp des Loups-Garous",goal:"Ton but : garder ton identité secrète et éliminer tous les Villageois."},
  ambigu:{label:"Personnage ambigu",goal:"Tu joues avec le village : démasquer et éliminer tous les Loups-Garous."}
};
const SPECIALS = {loups:["gml"],village:["voyante","sorciere","chasseur","salvateur","ancien","bouc","idiot"],ambigu:["cupidon","voleur"]};
const isWolf = r => ROLES[r].camp==="loups";

/* ------------------ ÉTAT ------------------ */
let N = 6;
let names = Array.from({length:12},(_,i)=>"");
let wolves = 2;
let picked = new Set();
let S = null; // état de partie

function defaults(n){
  wolves = n<=3?1 : n<=8?2 : 3;
  picked = new Set();
  if(n>=3) picked.add("voyante");
  if(n>=5) picked.add("sorciere");
  if(n>=6) picked.add("chasseur");
  if(n>=7) picked.add("cupidon");
  if(n>=9) picked.add("salvateur");
  if(n>=11) picked.add("ancien");
  if(n<=2){ wolves=1; picked.clear(); }
}

/* ------------------ DÉCOR ------------------ */
(function stars(){
  const el=document.getElementById("stars"), sh=[];
  for(let i=0;i<160;i++){
    const x=Math.random()*100, y=Math.random()*70, a=(Math.random()*.7+.2).toFixed(2), s=Math.random()<.1?1:0;
    sh.push(`${x}vw ${y}vh 0 ${s}px rgba(255,255,240,${a})`);
  }
  el.style.boxShadow=sh.join(",");
})();
function buildFire(size){
  const f=document.getElementById("fire");
  f.style.width=f.style.height=size+"px";
  let h="";
  const st=11;
  for(let i=0;i<st;i++){
    const a=i/st*Math.PI*2, r=size*.46, w=size*(.15+Math.random()*.05);
    h+=`<div class="stone" style="width:${w}px;height:${w*.75}px;left:${size/2+Math.cos(a)*r-w/2}px;top:${size/2+Math.sin(a)*r*.62+size*.12-w*.37}px"></div>`;
  }
  h+=`<div class="log a"></div><div class="log b"></div>`;
  h+=`<div class="fl f1"><i></i></div><div class="fl f5"><i></i></div><div class="fl f6"><i></i></div><div class="fl f2"><i></i></div><div class="fl f3"><i></i></div><div class="fl f4"><i></i></div>`;
  for(let i=0;i<9;i++){
    h+=`<span class="spark" style="left:${35+Math.random()*30}%;--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(1.6+Math.random()*1.8).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s"></span>`;
  }
  f.innerHTML=h;
}

const BACK_SVG = `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs><radialGradient id="bg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#2b2a5c"/><stop offset="1" stop-color="#0b0a1f"/></radialGradient>
<radialGradient id="mn" cx="40%" cy="40%"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#d9c88e"/></radialGradient></defs>
<rect width="100" height="140" fill="url(#bg)"/>
<rect x="4" y="4" width="92" height="132" rx="7" fill="none" stroke="#e8b75a" stroke-width="1.6"/>
<rect x="7.5" y="7.5" width="85" height="125" rx="5" fill="none" stroke="#e8b75a" stroke-width=".6" opacity=".7"/>
<g fill="#fff" opacity=".8"><circle cx="20" cy="24" r=".8"/><circle cx="78" cy="30" r=".7"/><circle cx="30" cy="48" r=".5"/><circle cx="70" cy="18" r=".6"/><circle cx="84" cy="56" r=".5"/><circle cx="16" cy="62" r=".6"/></g>
<circle cx="50" cy="50" r="22" fill="url(#mn)"/>
<circle cx="43" cy="44" r="3" fill="#cdbb82" opacity=".6"/><circle cx="57" cy="56" r="4" fill="#cdbb82" opacity=".5"/>
<path d="M8 132 V104 l6-14 5 12 5-20 6 22 4-12 6 14 5-24 6 26 5-10 5 12 6-22 6 24 4-14 6 16 5-18 5 20 V132Z" fill="#05060d"/>
<g fill="#ffcf3d"><ellipse cx="44" cy="114" rx="2.2" ry="1.3"/><ellipse cx="56" cy="114" rx="2.2" ry="1.3"/></g>
<g fill="#000"><ellipse cx="44" cy="114" rx=".6" ry="1.1"/><ellipse cx="56" cy="114" rx=".6" ry="1.1"/></g>
</svg>`;

/* ------------------ SETUP UI ------------------ */
const $=id=>document.getElementById(id);
function renderSetup(){
  $("countRow").innerHTML=Array.from({length:12},(_,i)=>`<button class="${i+1===N?"on":""}" data-n="${i+1}">${i+1}</button>`).join("");
  $("names").innerHTML=Array.from({length:N},(_,i)=>`<label><span>${i+1}</span><input data-i="${i}" maxlength="18" placeholder="Joueur ${i+1}" value="${esc(names[i])}"></label>`).join("");
  const chip=r=>`<div class="chip ${ROLES[r].camp} ${picked.has(r)?"on":""}" data-r="${r}"><span class="ic">${ROLES[r].icon}</span>${ROLES[r].name}</div>`;
  $("wolfRoles").innerHTML=`<div class="stepper"><span class="ic">🐺</span><span>Loups-Garous</span><button data-w="-1">−</button><b>${wolves}</b><button data-w="1">+</button></div>`+SPECIALS.loups.map(chip).join("");
  $("villageRoles").innerHTML=SPECIALS.village.map(chip).join("");
  $("ambiguRoles").innerHTML=SPECIALS.ambigu.map(chip).join("");
  renderSummary();
}
function deckInfo(){
  const cards=[];
  for(let i=0;i<wolves;i++) cards.push("loup");
  [...SPECIALS.loups,...SPECIALS.village,...SPECIALS.ambigu].forEach(r=>{if(picked.has(r)) cards.push(r)});
  const total=N+(picked.has("voleur")?2:0);
  const err = cards.length>total ? `Trop de rôles spéciaux : ${cards.length} rôles pour ${total} cartes.` :
              cards.filter(isWolf).length===0 ? "Il faut au moins un Loup-Garou." : null;
  while(cards.length<total) cards.push("villageois");
  return {cards,total,err};
}
function renderSummary(){
  const {cards,total,err}=deckInfo();
  const count={}; cards.forEach(c=>count[c]=(count[c]||0)+1);
  const parts=Object.entries(count).map(([r,k])=>`${ROLES[r].icon} ${k>1?k+" × ":""}${ROLES[r].name}`);
  $("summary").innerHTML=`<b>${total} cartes</b>${picked.has("voleur")?" (dont 2 au centre pour le Voleur)":""} : ${parts.join(" · ")}`+(err?`<br><span class="err">⚠ ${err}</span>`:"");
  $("startBtn").disabled=!!err;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

$("countRow").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;N=+b.dataset.n;defaults(N);renderSetup();});
$("names").addEventListener("input",e=>{if(e.target.dataset.i!=null) names[+e.target.dataset.i]=e.target.value;});
$("setup").addEventListener("click",e=>{
  const w=e.target.closest("[data-w]");
  if(w){wolves=Math.max(0,Math.min(N,wolves+ +w.dataset.w));renderSetup();return;}
  const c=e.target.closest(".chip");
  if(c){const r=c.dataset.r;picked.has(r)?picked.delete(r):picked.add(r);renderSetup();}
});
$("startBtn").addEventListener("click",startGame);

/* ------------------ PARTIE ------------------ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){
  const {cards,err}=deckInfo(); if(err) return;
  shuffle(cards);
  S={
    players:Array.from({length:N},(_,i)=>({name:(names[i]||"").trim()||`Joueur ${i+1}`,role:cards[i],dead:false,seen:false,lover:false})),
    center:cards.slice(N),
    turn:0, phase:"reveal", view:false, night:1, isDay:false, done:{}
  };
  $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
  document.body.classList.remove("day");
  window.scrollTo(0,0);
  layout(); renderPanel();
}
let geom={};
function layout(){
  if(!S) return;
  const n=S.players.length;
  const vw=window.innerWidth, vh=window.innerHeight;
  const size=Math.max(280,Math.min(vw-20, vh-230, 720));
  const stage=$("stage"); stage.style.width=stage.style.height=size+"px";
  const cw=Math.round(Math.min(104, size*(n<=4?.2:n<=7?.16:n<=9?.135:.12)));
  const ch=Math.round(cw*1.4);
  const R=size/2-ch/2-16;
  geom={size,cw,ch,R};
  buildFire(Math.round(size*.3));
  renderSeats();
}
function miniFace(r,w,h){
  const R=ROLES[r];
  return `<div class="minif camp-${R.camp}" style="width:${w}px;height:${h}px;font-size:${Math.max(9,w/5.2)}px"><span class="e">${R.icon}</span><span class="n">${R.name}</span></div>`;
}
function renderSeats(){
  const stage=$("stage");
  stage.querySelectorAll(".seat").forEach(s=>s.remove());
  const n=S.players.length,{size,cw,ch,R}=geom;
  S.players.forEach((p,i)=>{
    const a=(-90+360*i/n)*Math.PI/180;
    const x=size/2+Math.cos(a)*R, y=size/2+Math.sin(a)*R;
    const d=document.createElement("div");
    const showFace=S.view||S.phase==="over";
    d.className="seat"+(S.phase==="reveal"&&i===S.turn?" active":"")+(p.seen&&S.phase==="reveal"?" seen":"")+(p.dead?" dead":"")+(S.phase!=="reveal"?" clickable":"");
    d.style.left=x+"px"; d.style.top=(y+10)+"px"; d.dataset.i=i;
    d.innerHTML=`<div class="mini" style="width:${cw}px;height:${ch}px">${p.lover?'<span class="lover">❤️</span>':""}${showFace?miniFace(p.role,cw,ch):BACK_SVG}</div><div class="pname">${esc(p.name)}</div>`;
    stage.appendChild(d);
  });
  const cc=$("centerCards");
  const sw=Math.round(cw*.55), sh=Math.round(sw*1.4);
  cc.style.marginTop=(geom.size*.15)+"px";
  cc.innerHTML=S.center.map(r=>`<div class="mini" style="width:${sw}px;height:${sh}px">${S.phase==="over"||S.view?miniFace(r,sw,sh):BACK_SVG}</div>`).join("");
}
window.addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(layout,120)});

/* ------------------ PANNEAU ------------------ */
function renderPanel(){
  const P=$("panel");
  $("viewBtn").classList.toggle("hidden",S.phase==="reveal");
  $("viewBtn").textContent=S.view?"🙈 Cacher les rôles":"👁 Vue meneur";
  if(S.phase==="reveal"){
    const p=S.players[S.turn];
    P.innerHTML=`<div class="panel"><h3>C'est au tour de ${esc(p.name)}</h3>
      <p>Passe l'appareil à <b>${esc(p.name)}</b>. Les autres joueurs détournent les yeux…</p>
      <div class="row"><button class="big-btn" style="max-width:360px" id="seeBtn">🃏 Révéler ma carte</button></div>
      <p class="hint" style="margin-top:10px">Joueur ${S.turn+1} sur ${S.players.length}</p></div>`;
    $("seeBtn").onclick=()=>openCard(S.turn,"turn");
    return;
  }
  if(S.phase==="ready"){
    P.innerHTML=`<div class="panel"><h3>🌙 Tout le monde connaît son rôle</h3>
      <p>Les cartes sont retournées face cachée autour du feu. Le meneur de jeu peut maintenant ouvrir la première nuit.</p>
      <div class="row"><button class="btn solid" id="goBtn">Commencer la partie</button></div></div>`;
    $("goBtn").onclick=()=>{S.phase="play";renderSeats();renderPanel();};
    return;
  }
  if(S.phase==="play"){
    const has=r=>S.players.some(p=>p.role===r&&!p.dead);
    let steps;
    if(!S.isDay){
      steps=[];
      if(S.night===1){
        if(has("voleur")) steps.push(["🎭","Le Voleur se réveille et peut échanger sa carte (déjà fait lors de la révélation)."]);
        if(has("cupidon")) steps.push(["💘","Cupidon se réveille et désigne deux amoureux. Touchez leurs cartes → « Lier par Cupidon »."]);
        if(has("cupidon")) steps.push(["❤️","Les Amoureux se réveillent et se reconnaissent."]);
      }
      if(has("voyante")) steps.push(["🔮","La Voyante se réveille et désigne un joueur dont elle veut voir la carte."]);
      if(has("salvateur")) steps.push(["🛡️","Le Salvateur se réveille et protège un joueur."]);
      steps.push(["🐺","Les Loups-Garous se réveillent, se reconnaissent et choisissent une victime."]);
      if(has("gml")) steps.push(["👹","Le Grand Méchant Loup peut dévorer une seconde victime (si aucun loup n'est mort)."]);
      if(has("sorciere")) steps.push(["🧪","La Sorcière se réveille : potion de guérison ? potion d'empoisonnement ?"]);
    } else {
      steps=[["☀️","Le village se réveille. Annoncez les victimes de la nuit (touchez leur carte → « Éliminer »)."],
             ["🗣️","Débat : chacun accuse, se défend, bluffe…"],
             ["🗳️","Vote du village. En cas d'égalité, le Bouc Émissaire est éliminé."+(has("idiot")?" L'Idiot du Village condamné est épargné.":"")]];
      if(has("chasseur")) steps.push(["🏹","Si le Chasseur meurt, il tire sur le joueur de son choix."]);
    }
    const key=(S.isDay?"j":"n")+S.night;
    S.done[key]=S.done[key]||{};
    P.innerHTML=`<div class="panel"><h3>${S.isDay?"☀️ Jour "+S.night:"🌙 Nuit "+S.night}</h3>
      <ol class="steps">${steps.map((s,i)=>`<li class="${S.done[key][i]?"done":""}" data-k="${i}"><input type="checkbox" ${S.done[key][i]?"checked":""}><span class="e">${s[0]}</span><span>${s[1]}</span></li>`).join("")}</ol>
      <p class="hint">Touchez la carte d'un joueur pour revoir son rôle, l'éliminer ou le lier par Cupidon.</p>
      <div class="row"><button class="btn solid" id="nextBtn">${S.isDay?"🌙 La nuit tombe":"☀️ Le jour se lève"}</button><button class="btn red" id="endBtn">Révéler toutes les cartes</button></div></div>`;
    P.querySelectorAll(".steps li").forEach(li=>li.onclick=()=>{const k=li.dataset.k;S.done[key][k]=!S.done[key][k];renderPanel();});
    $("nextBtn").onclick=()=>{if(S.isDay){S.isDay=false;S.night++;}else S.isDay=true;document.body.classList.toggle("day",S.isDay);renderPanel();};
    $("endBtn").onclick=()=>{S.phase="over";renderSeats();renderPanel();};
    return;
  }
  if(S.phase==="over"){
    P.innerHTML=`<div class="panel"><h3>Toutes les cartes sont révélées</h3><p>Merci d'avoir joué à Loup-Garou !</p>
      <div class="row"><button class="btn solid" id="againBtn">Rejouer avec les mêmes joueurs</button><button class="btn" id="setupBtn">Changer les réglages</button></div></div>`;
    $("againBtn").onclick=startGame; $("setupBtn").onclick=backToSetup;
  }
}

/* ------------------ CARTE EN GRAND ------------------ */
function frontHTML(r){
  const R=ROLES[r],C=CAMP[R.camp];
  return `<div class="face front camp-${R.camp}"><span class="badge">${C.label}</span><div class="emo">${R.icon}</div><h2>${R.name}</h2><div class="desc">${R.desc}</div><div class="goal">${C.goal}</div></div>`;
}
function openCard(i,mode){
  const p=S.players[i];
  const M=$("modalInner");
  M.innerHTML=`<div class="who">Carte de <b>${esc(p.name)}</b></div>
    <div class="bigcard" id="bigcard"><div class="inner"><div class="face back">${BACK_SVG}</div><div id="frontSlot"></div></div></div>
    <div class="extra" id="extra"></div>
    <div class="row" id="mActions"></div>`;
  $("frontSlot").outerHTML=frontHTML(p.role);
  $("modal").classList.remove("hidden");
  const A=$("mActions");
  A.innerHTML=`<button class="big-btn" style="min-width:240px" id="flipBtn">👁 Révéler ma carte</button>`+(mode==="review"?`<button class="btn" id="cancelBtn">Annuler</button>`:"");
  if(mode==="review") $("cancelBtn").onclick=closeModal;
  $("flipBtn").onclick=()=>{
    $("bigcard").classList.add("flipped");
    p.seen=true;
    setTimeout(()=>afterFlip(i,mode),650);
    A.innerHTML="";
  };
}
function afterFlip(i,mode){
  const p=S.players[i], A=$("mActions"), X=$("extra");
  if(p.role==="voleur" && !p.thiefDone && S.center.length===2){
    const both=S.center.every(isWolf);
    X.innerHTML=`<p>Voici les deux cartes du centre. Prends-en une${both?" (les deux sont des Loups : tu dois en prendre une)":", ou garde ta carte"}.</p>
      <div class="thief">${S.center.map((r,k)=>`<div class="opt">${miniFace(r,84,118)}<button class="btn" data-k="${k}">Prendre</button></div>`).join("")}</div>`;
    X.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; const nr=S.center[k]; S.center[k]="voleur"; p.role=nr; p.thiefDone=true;
      const bc=$("bigcard"); bc.querySelector(".front").outerHTML=frontHTML(nr);
      X.innerHTML=`<p>Tu es désormais <b>${ROLES[nr].name}</b>.</p>`;
      renderSeats(); showHide(i,mode);
    });
    if(!both){A.innerHTML=`<button class="btn" id="keepBtn">Garder ma carte de Voleur</button>`;
      $("keepBtn").onclick=()=>{p.thiefDone=true;p.role="villageois";X.innerHTML=`<p>Tu gardes ta carte : tu joues désormais comme un <b>Simple Villageois</b>.</p>`;
        $("bigcard").querySelector(".front").outerHTML=frontHTML("villageois");renderSeats();showHide(i,mode);};}
    return;
  }
  if(isWolf(p.role) && mode==="turn"){
    X.innerHTML=`<p class="hint">Tu découvriras tes complices pendant la première nuit.</p>`;
  }
  showHide(i,mode);
}
function showHide(i,mode){
  const A=$("mActions");
  const last=i===S.players.length-1;
  A.innerHTML=`<button class="big-btn" style="min-width:240px" id="hideBtn">🙈 Cacher ma carte${mode==="turn"?(last?" et terminer":" et passer"):""}</button>`;
  $("hideBtn").onclick=()=>{
    $("bigcard").classList.remove("flipped");
    setTimeout(()=>{
      closeModal();
      if(mode==="turn"){
        if(last){S.phase="ready";} else S.turn++;
        renderSeats(); renderPanel();
      }
    },500);
  };
}
function closeModal(){$("modal").classList.add("hidden");$("modalInner").innerHTML="";}

/* ------------------ MENU JOUEUR ------------------ */
$("stage").addEventListener("click",e=>{
  const seat=e.target.closest(".seat"); if(!seat||S.phase==="reveal") return;
  e.stopPropagation();
  const i=+seat.dataset.i, p=S.players[i], m=$("menu");
  if(S.phase==="over"){openCard(i,"review");return;}
  const lovers=S.players.filter(q=>q.lover).length;
  m.innerHTML=`<div class="mh">${esc(p.name)}</div>
    <button data-a="see">🃏 Revoir sa carte (en privé)</button>
    <button data-a="kill">${p.dead?"✨ Ramener à la vie":"💀 Éliminer"}</button>
    ${p.lover?`<button data-a="love">💔 Délier</button>`:(lovers<2&&S.players.some(q=>q.role==="cupidon")?`<button data-a="love">❤️ Lier par Cupidon</button>`:"")}`;
  m.classList.remove("hidden");
  const r=seat.getBoundingClientRect();
  const mw=210, x=Math.min(window.innerWidth-mw-8,Math.max(8,r.left+r.width/2-mw/2));
  let y=r.bottom+6; if(y+180>window.innerHeight) y=Math.max(8,r.top-180);
  m.style.left=x+"px"; m.style.top=y+"px";
  m.onclick=ev=>{
    const a=ev.target.closest("button")?.dataset.a; if(!a) return;
    m.classList.add("hidden");
    if(a==="see") openCard(i,"review");
    if(a==="love"){p.lover=!p.lover;renderSeats();}
    if(a==="kill") toggleDead(i);
  };
});
document.addEventListener("click",e=>{if(!e.target.closest("#menu")) $("menu").classList.add("hidden");});

function toggleDead(i){
  const p=S.players[i];
  p.dead=!p.dead;
  const msgs=[];
  if(p.dead){
    msgs.push(`${p.name} est éliminé(e)… C'était : ${ROLES[p.role].icon} ${ROLES[p.role].name}`);
    if(p.lover){const o=S.players.find(q=>q.lover&&q!==p);if(o&&!o.dead){o.dead=true;msgs.push(`💔 ${o.name} meurt de chagrin.`);}}
    if(p.role==="chasseur") msgs.push("🏹 Le Chasseur tire une dernière fois !");
  }
  renderSeats(); renderPanel(); toast(msgs.join(" — ")||`${p.name} revient à la vie.`);
  if(p.dead) setTimeout(checkWin,700);
}
function checkWin(){
  const alive=S.players.filter(p=>!p.dead);
  let res=null;
  const lovers=alive.filter(p=>p.lover);
  if(alive.length===0) res={e:"🌫️",t:"Personne ne survit…",s:"Le village de Thiercelieux est désert."};
  else if(alive.length===2&&lovers.length===2) res={e:"💞",t:"Les Amoureux gagnent !",s:"Ils sont les deux derniers survivants."};
  else if(!alive.some(p=>isWolf(p.role))) res={e:"🧑‍🌾",t:"Les Villageois gagnent !",s:"Tous les Loups-Garous ont été démasqués."};
  else if(alive.every(p=>isWolf(p.role))) res={e:"🐺",t:"Les Loups-Garous gagnent !",s:"Il n'y a plus aucun villageois pour leur résister."};
  if(!res) return;
  $("modalInner").innerHTML=`<div class="win"><div class="emo">${res.e}</div><h2>${res.t}</h2></div><p class="hint" style="font-size:1.05rem">${res.s}</p>
    <div class="row"><button class="btn solid" id="wReveal">Révéler toutes les cartes</button><button class="btn" id="wCont">Continuer</button></div>`;
  $("modal").classList.remove("hidden");
  $("wReveal").onclick=()=>{closeModal();S.phase="over";document.body.classList.remove("day");renderSeats();renderPanel();};
  $("wCont").onclick=closeModal;
}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3800);}

$("viewBtn").onclick=()=>{S.view=!S.view;renderSeats();renderPanel();};
$("newBtn").onclick=backToSetup;
function backToSetup(){
  S=null; closeModal(); $("menu").classList.add("hidden");
  document.body.classList.remove("day");
  $("game").classList.add("hidden"); $("setup").classList.remove("hidden"); renderSetup();
}

defaults(N); renderSetup();
</script>
</body>
</html>
