<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Plan 3D de la maison</title>
<style>
  :root{--ink:#1d2430;--muted:#6b7380;--card:rgba(255,255,255,.93)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e9edf1}
  canvas{display:block;touch-action:none}
  button{font:inherit;border:0;cursor:pointer;color:var(--ink)}
  .top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .title{background:var(--card);padding:9px 13px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);pointer-events:auto;max-width:58%}
  .title h1{font-size:15px;margin:0}
  .title p{font-size:11.5px;margin:2px 0 0;color:var(--muted)}
  .tools{display:flex;flex-direction:column;gap:6px;pointer-events:auto;align-items:flex-end}
  .tb{background:var(--card);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .tb.on{background:var(--ink);color:#fff}
  .seg{position:fixed;left:50%;transform:translateX(-50%);bottom:60px;display:flex;background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden;max-width:calc(100% - 20px)}
  .seg button{background:transparent;padding:9px 11px;font-size:13px;font-weight:600;white-space:nowrap}
  .seg button.on{background:var(--ink);color:#fff}
  .chips{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:8px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:7px}
  .chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chip.on{outline:2px solid var(--ink)}
  .info{position:fixed;left:10px;right:10px;bottom:110px;max-width:460px;background:var(--card);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;box-shadow:0 2px 12px rgba(0,0,0,.1);display:none;max-height:52vh;overflow:auto}
  .info.show{display:block}
  .info b{display:block;margin:6px 0 2px}
  .info ul{margin:2px 0 0;padding-left:18px}
  .joy{position:fixed;left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 14px rgba(0,0,0,.15);display:none;touch-action:none}
  .joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:var(--ink);opacity:.85}
  .walkbar{position:fixed;right:10px;bottom:30px;display:none;flex-direction:column;gap:8px;align-items:flex-end}
  body.walk .seg,body.walk .chips,body.walk .tools,body.walk .info{display:none!important}
  body.walk .joy{display:block} body.walk .walkbar{display:flex}
  .lvl{background:var(--card);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .hint{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:999px;transition:opacity .6s;white-space:nowrap}
</style>
</head>
<body>
<div class="top">
  <div class="title"><h1>Plan 3D — maison</h1><p id="total"></p></div>
  <div class="tools">
    <button class="tb" id="vwalk" style="background:#0f8f8a;color:#fff">🚶 Se promener</button>
    <button class="tb" id="vtop">Vue dessus</button>
    <button class="tb" id="vwall">Murs bas</button>
    <button class="tb" id="vexp">Éclaté</button>
    <button class="tb" id="vinfo">Infos</button>
  </div>
</div>
<div class="seg" id="seg">
  <button data-m="all" class="on">Tout</button><button data-m="c">Cave</button><button data-m="0">RDC</button><button data-m="1">1er</button><button data-m="2">Combles</button>
</div>
<div class="info" id="info"></div>
<div class="hint" id="hint">1 doigt : tourner · 2 doigts : zoomer / déplacer</div>
<div class="chips" id="chips"></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div class="walkbar"><div class="lvl" id="wlvl">RDC</div><button class="tb" id="wcam">Vue 1re personne</button><button class="tb" id="wquit">✕ Quitter</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const H=2.5, T=0.06, LEVEL=2.65, GAP=2.6;
const W=6.4, D=7.4;              // emprise de la maison (estimée)
const KNEE=0.6, FLAT1=1.6, FLAT2=W-1.6;   // combles : 60 cm sur les côtés, pleine hauteur au centre

/* ---------- Scène ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe9edf1);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0xb9bcc4,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.55);
sun.position.set(12,26,6); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:80});
sun.target.position.set(3.2,0,-2.3); scene.add(sun,sun.target);

const matCache={};
function mat(c,o){const k=c+JSON.stringify(o||{}); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o||{})); return matCache[k];}
let CUR=null;
function box(x1,z1,x2,z2,y1,y2,c,g,o){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1)||.001,(y2-y1)||.001,Math.abs(z2-z1)||.001), c instanceof THREE.Material?c:mat(c,o));
  m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2); m.castShadow=!m.material.transparent; m.receiveShadow=true; (g||CUR).add(m); return m;
}
function cyl(x,z,r,y1,y2,c,g){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,y2-y1,28),mat(c)); m.position.set(x,(y1+y2)/2,z); m.castShadow=m.receiveShadow=true; (g||CUR).add(m); return m;}
function slope(x,z1,y1,z2,y2,t,h,c){const L=Math.hypot(z2-z1,y2-y1),m=new THREE.Mesh(new THREE.BoxGeometry(t,h,L),mat(c)); m.position.set(x,(y1+y2)/2,(z1+z2)/2); m.rotation.x=Math.atan2(y2-y1,z1-z2); m.castShadow=true; CUR.add(m); return m;}
const RAILS=[];
function rail(x1,z1,x2,z2,y0,c){ c=c||0x7a4e2b; const L=Math.hypot(x2-x1,z2-z1), n=Math.max(1,Math.round(L/0.45));
  for(let i=0;i<=n;i++){const x=x1+(x2-x1)*i/n, z=z1+(z2-z1)*i/n; box(x-.025,z-.025,x+.025,z+.025,y0,y0+0.95,c);}
  RAILS.push(box(Math.min(x1,x2)-.03,Math.min(z1,z2)-.03,Math.max(x1,x2)+.03,Math.max(z1,z2)+.03,y0+0.92,y0+0.98,c)); }
function glassMat(op,col){return new THREE.MeshStandardMaterial({color:col||0xbfdcef,transparent:true,opacity:op,roughness:.1,depthWrite:false});}
function canvasTex(w,h,draw){const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;}
const rnd=(s=>()=>{s=(s*9301+49297)%233280;return s/233280;})(11);
function woodTex(l){return canvasTex(256,256,(g,w)=>{for(let i=0;i<8;i++){const v=l+((i*37)%5-2)*5; g.fillStyle=`rgb(${v+18},${v+8},${v-8})`; g.fillRect(0,i*32,w,32); for(let k=0;k<6;k++){g.fillStyle='rgba(120,90,60,.07)';g.fillRect(0,i*32+5+k*4,w,1);} g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(0,i*32,w,1); g.fillRect((i*97)%w,i*32,1,32);}});}
function tileTex(b,l){return canvasTex(256,256,(g,w,h)=>{g.fillStyle=b;g.fillRect(0,0,w,h);g.fillStyle=l;g.fillRect(0,0,w,2);g.fillRect(0,128,w,2);g.fillRect(0,0,2,128);g.fillRect(128,128,2,128);});}
function grassTex(){return canvasTex(256,256,(g,w,h)=>{g.fillStyle='#6fa55a';g.fillRect(0,0,w,h);for(let i=0;i<2500;i++){g.fillStyle=rnd()>.5?'#5f9a4c':'#82b86a';g.fillRect(rnd()*w,rnd()*h,2,3);}});}
const duvetTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#f4f1f0';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.fillStyle=rnd()>.3?'#c8373a':'#7c9bc4';g.beginPath();g.arc(rnd()*w,rnd()*h,4+rnd()*9,0,7);g.fill();}}); duvetTex.repeat.set(2,2);
const leoTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#d8c9ac';g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle='#4b3a2a';g.beginPath();g.arc(rnd()*w,rnd()*h,1.5+rnd()*3,0,7);g.fill();}}); leoTex.repeat.set(3,3);

const TILE_G=['#7d8185','#a3a7ab'], TILE_D=['#5d6166','#8e9297'], TILE_L=['#c9c2b6','#ddd7cc'], CONC=['#a9a8a2','#9c9b95'];
function floorMat(r){
  const w=r.x2-r.x1, d=r.z2-r.z1;
  if(r.floor==='wood'||r.floor==='deck'){const t=woodTex(r.floor==='deck'?140:(r.light||200)); t.repeat.set(w/1.6,d/1.6); return new THREE.MeshStandardMaterial({map:t,roughness:.75});}
  if(r.floor==='grass'){const t=grassTex(); t.repeat.set(w/2,d/2); return new THREE.MeshStandardMaterial({map:t,roughness:1});}
  const t=tileTex(r.floor[0],r.floor[1]); t.repeat.set(w/1.2,d/1.2); return new THREE.MeshStandardMaterial({map:t,roughness:.6});
}
function floorBoxes(r,m,g){
  const y1=r.fy1!==undefined?r.fy1:-0.04, y2=r.raise||0, hs=r.holes||(r.hole?[r.hole]:[]);
  const xs=[r.x1,r.x2], zs=[r.z1,r.z2];
  hs.forEach(h=>{ [h.x1,h.x2].forEach(v=>{if(v>r.x1&&v<r.x2) xs.push(v);}); [h.z1,h.z2].forEach(v=>{if(v>r.z1&&v<r.z2) zs.push(v);}); });
  xs.sort((a,b)=>a-b); zs.sort((a,b)=>a-b);
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<zs.length-1;j++){
    const cx=(xs[i]+xs[i+1])/2, cz=(zs[j]+zs[j+1])/2;
    if(xs[i+1]-xs[i]<.001||zs[j+1]-zs[j]<.001) continue;
    if(hs.some(h=>cx>h.x1&&cx<h.x2&&cz>h.z1&&cz<h.z2)) continue;
    const f=box(xs[i],zs[j],xs[i+1],zs[j+1],y1,y2,m,g); f.castShadow=false;
  }
}
function area(r){return r.area!==undefined?r.area:(r.x2-r.x1)*(r.z2-r.z1);}
const fmt=v=>v.toFixed(1).replace('.',',');
function makeLabel(r,y){
  const c=document.createElement('canvas'); c.width=512; c.height=170; const g=c.getContext('2d');
  g.fillStyle='rgba(255,255,255,.94)'; g.beginPath(); if(g.roundRect) g.roundRect(6,6,500,158,36); else g.rect(6,6,500,158); g.fill();
  g.fillStyle=r.color; g.fillRect(40,68,18,18);
  g.fillStyle='#1d2430'; g.font='bold 48px system-ui,sans-serif'; g.fillText(r.name,72,90);
  g.fillStyle='#6b7380'; g.font='36px system-ui,sans-serif'; g.fillText(r.sub||`~${fmt(area(r))} m²`,72,140);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  const s=r.small?1.15:1.55; sp.scale.set(s,s*170/512,1);
  const yy=y!==undefined?y:H+0.45;
  sp.position.set(r.lx!==undefined?r.lx:(r.x1+r.x2)/2, yy, r.lz!==undefined?r.lz:(r.z1+r.z2)/2);
  sp.renderOrder=10; sp.userData.base=yy; return sp;
}
const ROOFS=[];  // éléments visibles seulement en vue « Tout »

/* ---------- Générateur de niveau ---------- */
function makeFloor(def){
  const g=new THREE.Group(), walls=new THREE.Group(), furn=new THREE.Group(), labels=new THREE.Group();
  g.add(walls,furn,labels); scene.add(g);
  const OPEN=def.open||[]; OPEN.forEach(o=>{ if(o.t==='door'&&o.hi===undefined){o.lo=0;o.hi=2.04;} });
  const piece=(s,u1,u2,y1,y2,c)=>{ if(u2-u1<.002||y2-y1<.002)return; const p=s.at+s.off; if(s.ax==='z') box(u1,p-T/2,u2,p+T/2,y1,y2,c,walls); else box(p-T/2,u1,p+T/2,u2,y1,y2,c,walls); };
  def.rooms.forEach(r=>{
    if(!r.noWalls){
      const S={n:{ax:'z',at:r.z1,a:r.x1,b:r.x2,off:T/2},s:{ax:'z',at:r.z2,a:r.x1,b:r.x2,off:-T/2},w:{ax:'x',at:r.x1,a:r.z1,b:r.z2,off:T/2},e:{ax:'x',at:r.x2,a:r.z1,b:r.z2,off:-T/2}};
      const wh=r.wh||H;
      for(const k in S){
        if(r.skip&&r.skip.includes(k)) continue;
        const s=S[k], col=(r.accent&&r.accent.side===k)?r.accent.c:r.wall;
        const seg=(u1,u2,y1,y2)=>{ if(r.dado){const h=r.dado.h; if(y1<h) piece(s,u1,u2,y1,Math.min(y2,h),r.dado.c); if(y2>h) piece(s,u1,u2,Math.max(y1,h),y2,col);} else piece(s,u1,u2,y1,y2,col); };
        const ops=OPEN.filter(o=>o.ax===s.ax&&Math.abs(o.at-s.at)<.01&&o.b>s.a&&o.a<s.b).sort((p,q)=>p.a-q.a);
        let cur=s.a;
        ops.forEach(o=>{const a=Math.max(o.a,s.a),b=Math.min(o.b,s.b); seg(cur,a,0,wh); seg(a,b,0,o.lo); seg(a,b,o.hi,wh); cur=b;});
        seg(cur,s.b,0,wh);
      }
    }
    if(!r.noFloor) floorBoxes(r,floorMat(r),furn);
    if(!r.noLabel) labels.add(makeLabel(r));
  });
  const white=0xf7f7f5;
  OPEN.forEach(o=>{
    if(o.t==='door'){ const L=o.b-o.a, h=o.hinge==='a'?o.a+.03:o.b-.03, c=o.color||white, tp=o.hi-.02;
      (o.ax==='z' ? box(h-.02,o.at,h+.02,o.at+o.into*L,.01,tp,c,walls) : box(o.at,h-.02,o.at+o.into*L,h+.02,.01,tp,c,walls)).userData.noCollide=true; }
    if(o.t==='win'){ const gl=glassMat(o.frosted?.75:.35,o.frosted?0xdfe6ea:0xbfdcef), f=.05, th=T+.03;
      const bar=(u1,u2,y1,y2)=>{ if(o.ax==='z') box(u1,o.at-th/2,u2,o.at+th/2,y1,y2,white,walls); else box(o.at-th/2,u1,o.at+th/2,u2,y1,y2,white,walls); };
      bar(o.a,o.b,o.lo,o.lo+f); bar(o.a,o.b,o.hi-f,o.hi); bar(o.a,o.a+f,o.lo,o.hi); bar(o.b-f,o.b,o.lo,o.hi);
      const n=Math.max(1,Math.round((o.b-o.a)/0.6)); for(let i=1;i<n;i++){const u=o.a+(o.b-o.a)*i/n; bar(u-f/2,u+f/2,o.lo,o.hi);}
      if(o.ax==='z') box(o.a+f,o.at-.01,o.b-f,o.at+.01,o.lo+f,o.hi-f,gl,walls); else box(o.at-.01,o.a+f,o.at+.01,o.b-f,o.lo+f,o.hi-f,gl,walls);
      if(o.blind){const d=o.inside*0.06; if(o.ax==='z') box(o.a+.05,o.at+d,o.b-.05,o.at+d+.01,o.lo+.5,o.hi-.05,o.blind,walls); else box(o.at+d,o.a+.05,o.at+d+.01,o.b-.05,o.lo+.5,o.hi-.05,o.blind,walls);} }
  });
  return {g,walls,furn,labels,rooms:def.rooms};
}

/* ---------- Cage d'escalier commune : escaliers 1/2 tour superposés ----------
   volée droite (z 3,75–4,65) qui monte vers l'est depuis x 3,9, puis 6 marches balancées
   en demi-tour autour du poteau (5,5 ; 3,75), arrivée vers l'ouest en x 5,5 (z 2,85–3,75) */
const SX0=3.9, SX1=5.5, SZ0=2.85, SZM=3.75, SZ1=4.65, SXE=6.4, NSTR=8, NWIND=6, NRIS=15;
const TOWER=[{x1:SX0,x2:SX1,z1:SZM,z2:SZ1},{x1:SX1,x2:SXE,z1:SZ0,z2:SZ1}];
const stairWood=0x8a5a32, dark=0x7a4e2b;
function wedge(a1,a2,y1,y2,c,g){
  const R=0.9, ray=a=>{const cs=Math.cos(a),sn=Math.sin(a); const t=Math.min(cs>1e-6?R/cs:1e9, Math.abs(sn)>1e-6?R/Math.abs(sn):1e9); return [cs*t,sn*t];};
  const pts=[[0,0],ray(a1)]; [Math.PI/4,-Math.PI/4].forEach(c45=>{ if(c45<a1&&c45>a2) pts.push([R,Math.sign(c45)*R]); }); pts.push(ray(a2));
  const shp=new THREE.Shape(pts.map(([dx,dz])=>new THREE.Vector2(SX1+dx,-(SZM+dz))));
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(shp,{depth:y2-y1,bevelEnabled:false}),mat(c));
  m.rotation.x=-Math.PI/2; m.position.y=y1; m.castShadow=m.receiveShadow=true; g.add(m);
}
function stairModule(g,rise,c){
  const R=rise/NRIS, go=(SX1-SX0)/NSTR; c=c||stairWood;
  for(let i=0;i<NSTR;i++){ const x1=SX0+go*i, tp=R*(i+1); box(x1,SZM+.02,x1+go,SZ1-.02,tp-.05,tp,c,g); box(x1-.01,SZM+.02,x1+.01,SZ1-.02,tp-R,tp,dark,g); }
  for(let k=0;k<NWIND;k++){ const a1=(90-30*k)*Math.PI/180, a2=(90-30*(k+1))*Math.PI/180, tp=R*(NSTR+1+k); wedge(a1,a2,tp-.05,tp,c,g); }
  cyl(SX1,SZM,0.06,0,rise+0.95,dark,g);                                    // poteau central
  const L=Math.hypot(SX1-SX0,R*NSTR), m=new THREE.Mesh(new THREE.BoxGeometry(L,0.06,0.06),mat(dark));
  m.position.set((SX0+SX1)/2,R*NSTR/2+0.95,SZM); m.rotation.z=Math.atan2(R*NSTR,SX1-SX0); g.add(m);          // main courante
}
function towerF(x,z){ // fraction de montée (0→1) dans la cage, null si hors cage
  if(x>=SX0&&x<=SX1&&z>=SZM&&z<=SZ1) return clamp((x-SX0)/(SX1-SX0),0,1)*NSTR/NRIS;
  if(x>=SX1&&x<=SXE&&z>=SZ0&&z<=SZ1){ const th=Math.atan2(z-SZM,Math.max(x-SX1,1e-4))*180/Math.PI; return (NSTR+clamp((90-th)/180,0,1)*(NRIS-NSTR))/NRIS; }
  return null;
}
const inTower=(x,z)=>towerF(x,z)!==null;

/* ================= MAISON (construite 3 fois) ================= */
function mkDots(bg,cols,n,rmin,rmax,size){ return canvasTex(size,size,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.beginPath();g.arc(rnd()*w,rnd()*h,rmin+rnd()*(rmax-rmin),0,7);g.fill();}}); }
function buildHouse(ox,TH,main){
/* ================= CAVE ================= */
const FC=makeFloor({rooms:[{id:'cave',name:'Cave',color:'#8c8a83',x1:3.2,x2:6.4,z1:0,z2:7.4,floor:CONC,wall:0xb3b1aa,lx:4.2,lz:1.6}]});
CUR=FC.furn;
box(3.25,4.0,3.65,7.2,0,1.9,0x8f9399); for(let y=0.4;y<1.9;y+=0.45) box(3.25,4.0,3.67,7.2,y,y+0.03,0x6d7177);  // étagères

  LV.forEach(l=>l.fs.forEach(f=>f.g.position.y=l.y)); buildColliders();
  Object.assign(WALK,{x:4.65,y:0,z:8.6,yaw:0,pitch:0}); lastLvl=-1; walkVis(true); anim=null;
}
function stopWalk(){ WALK.on=false; document.body.classList.remove('walk'); person.visible=false; LV.forEach(l=>l.f.labels.visible=true); apply(); resetView(); }
$('vwalk').onclick=startWalk; $('wquit').onclick=stopWalk;
$('wcam').onclick=()=>{ WALK.fp=!WALK.fp; $('wcam').textContent=WALK.fp?'Vue 3e personne':'Vue 1re personne'; WALK.pitch=0; walkVis(true); };
// joystick
const joy=$('joy'), knob=$('knob'); let jid=null;
function joyMove(e){ const r=joy.getBoundingClientRect(); let dx=(e.clientX-(r.left+r.width/2))/50, dy=(e.clientY-(r.top+r.height/2))/50; const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;} WALK.jx=dx; WALK.jy=dy; knob.style.transform=`translate(${dx*40}px,${dy*40}px)`; }
joy.addEventListener('pointerdown',e=>{jid=e.pointerId; joy.setPointerCapture(jid); joyMove(e); e.stopPropagation();});
joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) joyMove(e); });
const joyEnd=e=>{ if(e.pointerId!==jid)return; jid=null; WALK.jx=WALK.jy=0; knob.style.transform=''; };
joy.addEventListener('pointerup',joyEnd); joy.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{WALK.keys[e.key.toLowerCase()]=true;}); addEventListener('keyup',e=>{WALK.keys[e.key.toLowerCase()]=false;});
function walkUpdate(dt){
  const k=WALK.keys; let fwd=-WALK.jy, str=WALK.jx;
  if(k['z']||k['w']||k['arrowup']) fwd+=1; if(k['s']||k['arrowdown']) fwd-=1;
  if(k['q']||k['a']) str-=1; if(k['d']) str+=1;
  if(k['arrowleft']) WALK.yaw+=1.8*dt; if(k['arrowright']) WALK.yaw-=1.8*dt;
  const fx=-Math.sin(WALK.yaw), fz=-Math.cos(WALK.yaw), rx=Math.cos(WALK.yaw), rz=-Math.sin(WALK.yaw);
  const sp=1.5*dt, mx=(fx*fwd+rx*str)*sp, mz=(fz*fwd+rz*str)*sp;
  const tryMove=(nx,nz)=>{ const g=groundAt(nx,nz,WALK.y); if(g===null) return false; if(blocked(nx,nz,Math.max(g,WALK.y)-0.0)) return false; WALK.x=nx; WALK.z=nz; return true; };
  if(mx||mz){ if(!tryMove(WALK.x+mx,WALK.z+mz)){ tryMove(WALK.x+mx,WALK.z); tryMove(WALK.x,WALK.z+mz); } }
  const g=groundAt(WALK.x,WALK.z,WALK.y); if(g!==null) WALK.y+=(g-WALK.y)*Math.min(1,dt*(g<WALK.y?8:14));
  walkVis(false);
  person.position.set(WALK.x,WALK.y,WALK.z); person.rotation.y=WALK.yaw;
  if(WALK.fp){ const ey=WALK.y+1.6; camera.position.set(WALK.x,ey,WALK.z); camera.lookAt(WALK.x+fx*Math.cos(WALK.pitch),ey+Math.sin(WALK.pitch),WALK.z+fz*Math.cos(WALK.pitch)); }
  else { const d=WALK.dist; camera.position.set(WALK.x-fx*d*Math.cos(WALK.el),WALK.y+1.4+d*Math.sin(WALK.el),WALK.z-fz*d*Math.cos(WALK.el)); camera.lookAt(WALK.x,WALK.y+1.3,WALK.z); }
}
let tPrev=performance.now();
function loop(){
  if(anim){anim.t=Math.min(1,anim.t+0.045); const k=1-Math.pow(1-anim.t,3),f=anim.from,to=anim.to;
    view.theta=f.theta+(to.theta-f.theta)*k; view.phi=f.phi+(to.phi-f.phi)*k; view.radius=f.radius+(to.radius-f.radius)*k; view.target.lerpVectors(f.target,to.target,k); if(anim.t>=1) anim=null;}
  const tNow=performance.now(), dt=Math.min(0.05,(tNow-tPrev)/1000); tPrev=tNow;
  if(WALK.on) walkUpdate(dt); else applyCam();
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
loop();
})();
</script>
