<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labyrinthe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f1d; --panel:#151a2e; --panel2:#1c2340; --line:#2a3358;
  --txt:#e8ebff; --mut:#8d94b8; --acc:#4cc9f0; --ok:#06d6a0; --warn:#ffd166; --bad:#ff5d73;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Space Grotesk",system-ui,sans-serif}
body{overflow:hidden}
button,input{font:inherit;color:inherit}
.screen{display:none;height:100%}
.screen.active{display:flex}

/* ---------- Menu ---------- */
#menu{align-items:center;justify-content:center;padding:20px;overflow:auto;
  background:radial-gradient(1200px 600px at 20% -10%,#1b2450 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#2a1440 0,transparent 55%),var(--bg)}
.card{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #0008}
h1{margin:0 0 4px;font-size:34px;letter-spacing:-.5px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 18px}
label.lbl,.lbl{display:block;font-size:13px;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:700}
.seg button.sel{border-color:var(--acc);background:#4cc9f01c;box-shadow:0 0 0 1px var(--acc) inset}
.players{display:grid;gap:10px}
.pl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.pl.off{display:none}
.plhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.plhead .txt{flex:1}
.keys{font-size:12px;color:var(--mut);white-space:nowrap}
.keys kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--txt);font-family:"JetBrains Mono",monospace;font-size:11px}
.txt{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;min-width:0}
.txt:focus{border-color:var(--acc)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px #0004;padding:0}
.sw.sel{border-color:#fff}
.sw:disabled{opacity:.2;cursor:not-allowed}
.dims{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.dims .x{padding-bottom:12px;color:var(--mut)}
.num{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.num input{width:100%;background:none;border:0;text-align:center;padding:10px 0;outline:none;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:18px;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.num button{background:none;border:0;width:40px;height:44px;cursor:pointer;font-size:20px;color:var(--mut)}
.num button:hover{color:var(--txt);background:#ffffff0d}
.dimlbl{font-size:12px;color:var(--mut);margin-bottom:5px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip:hover{color:var(--txt);border-color:var(--acc)}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--mut);font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.btn{border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--panel2);border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#4cc9f0,#4361ee);border:0;color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn.on{border-color:var(--acc);color:var(--acc)}
#bPlay{width:100%;margin-top:22px;font-size:18px}

/* ---------- Game ---------- */
#game{flex-direction:column}
.hud{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.timers{display:flex;gap:10px;flex-wrap:wrap}
.tbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:6px 12px;border:1px solid transparent}
.tbox.done{border-color:var(--ok)}
.tbox .pdot{width:12px;height:12px;border-radius:50%}
.tbox .nm{font-size:13px;color:var(--mut);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbox .tm{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700}
.tbox .flag{font-size:16px}
.meta{color:var(--mut);font-size:14px}
.meta b{color:var(--txt)}
.hud .sp{flex:1}
.hud .acts{display:flex;gap:8px}
.wrap{flex:1;position:relative;min-height:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0c0f1dcc;backdrop-filter:blur(3px);padding:20px;z-index:6}
.overlay.show{display:flex}
.count{font-size:140px;font-weight:700;color:var(--acc);text-shadow:0 0 40px #4cc9f088}
.endcard{text-align:center;max-width:440px;width:100%}
.endcard h2{font-size:32px;margin:0 0 6px}
.bigtime{font-family:"JetBrains Mono",monospace;font-size:50px;font-weight:700;color:var(--ok);margin:8px 0}
.hint{color:var(--mut);font-size:14px}
.results{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;text-align:left}
.results li{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:10px 14px}
.results .rk{font-size:20px;width:28px}
.results .nm{flex:1}
.results .tm{font-family:"JetBrains Mono",monospace;font-weight:700}
.endcard .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:5;white-space:nowrap}
.toast.show{opacity:1}
.dpad{position:absolute;bottom:14px;display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px;z-index:3}
.dpad.right{right:14px}
.dpad.left{left:14px}
.dpad.show{display:grid}
.dpad button{background:#ffffff12;border:2px solid var(--pc,#ffffff33);border-radius:14px;font-size:22px;color:var(--pc,#fff);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.dpad button.down,.dpad button:active{background:color-mix(in srgb,var(--pc,#4cc9f0) 35%,transparent)}
.dpad .lab{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--pc);text-align:center;line-height:1.1;overflow:hidden}
.help{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;color:var(--mut);font-size:12px;pointer-events:none;white-space:nowrap}
@media (max-width:720px){
  .tbox .tm{font-size:17px}
  .tbox .nm{max-width:70px}
  .count{font-size:100px}
  .help{display:none}
  .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
}
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<section id="menu" class="screen active">
  <div class="card">
    <h1>Laby<span>rinthe</span></h1>
    <p class="sub">Trouvez la sortie le plus vite possible, seul ou à deux sur le même écran.</p>

    <div class="lbl">Mode de jeu</div>
    <div class="seg" id="modeSeg">
      <button data-n="1">👤 Solo</button>
      <button data-n="2">👥 2 joueurs</button>
    </div>

    <div class="lbl">Joueurs</div>
    <div class="players">
      <div class="pl" id="pl0">
        <div class="plhead">
          <input class="txt" id="name0" maxlength="14" placeholder="Joueur 1">
          <span class="keys" id="keys0"></span>
        </div>
        <div class="swatches" id="sw0"></div>
      </div>
      <div class="pl" id="pl1">
        <div class="plhead">
          <input class="txt" id="name1" maxlength="14" placeholder="Joueur 2">
          <span class="keys"><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd></span>
        </div>
        <div class="swatches" id="sw1"></div>
      </div>
    </div>

    <div class="lbl">Taille du labyrinthe</div>
    <div class="dims">
      <div><div class="dimlbl">Largeur</div><div class="num"><button data-step="w,-1" aria-label="moins">−</button><input id="w" type="number" min="5" max="80"><button data-step="w,1" aria-label="plus">+</button></div></div>
      <div class="x">×</div>
      <div><div class="dimlbl">Longueur</div><div class="num"><button data-step="h,-1" aria-label="moins">−</button><input id="h" type="number" min="5" max="80"><button data-step="h,1" aria-label="plus">+</button></div></div>
    </div>
    <div class="presets">
      <button class="chip" data-p="10,10">Petit 10×10</button>
      <button class="chip" data-p="20,15">Moyen 20×15</button>
      <button class="chip" data-p="35,25">Grand 35×25</button>
      <button class="chip" data-p="60,40">Géant 60×40</button>
    </div>

    <label class="check"><input type="checkbox" id="pads"> Afficher les flèches à l'écran (tactile / souris)</label>

    <button class="btn pri" id="bPlay">▶ Jouer</button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen">
  <div class="hud">
    <div class="timers" id="timers"></div>
    <div class="meta">Taille <b id="hudSize"></b></div>
    <div class="sp"></div>
    <div class="acts">
      <button class="btn sm" id="bPads" title="Flèches à l'écran">🎮 Flèches</button>
      <button class="btn sm" id="bRestart" title="Nouveau labyrinthe">↻ Nouveau</button>
      <button class="btn sm" id="bQuit">Menu</button>
    </div>
  </div>
  <div class="wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="help" id="help"></div>
    <div class="dpad right" id="pad0"></div>
    <div class="dpad left" id="pad1"></div>
    <div class="overlay" id="ovCount"><div class="count" id="countNum">3</div></div>
    <div class="overlay" id="ovEnd"><div class="card endcard">
      <h2 id="endTitle"></h2>
      <div id="endBody"></div>
      <div class="btns">
        <button class="btn pri" id="bAgain">Nouveau labyrinthe</button>
        <button class="btn" id="bMenu">Menu</button>
      </div>
    </div></div>
  </div>
</section>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const COLORS = ['#ff5d73','#4cc9f0','#ffd166','#06d6a0','#b388ff','#ff9f1c','#f72585','#a8e05f'];
const MIN = 5, MAX = 80;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('laby.'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('laby.'+k, JSON.stringify(v)); }catch(e){} }
};
const coarse = matchMedia('(pointer:coarse)').matches;

/* ------------------------------------------------------------------ settings */
const S = {
  n: store.get('n', 1),
  names: store.get('names', ['', '']),
  colors: store.get('colors', ['#4cc9f0', '#ff5d73']),
  w: store.get('w', 15), h: store.get('h', 12),
  pads: store.get('pads', coarse)
};
if(S.colors[0] === S.colors[1]) S.colors[1] = COLORS.find(c => c !== S.colors[0]);
const save = () => { store.set('n', S.n); store.set('names', S.names); store.set('colors', S.colors); store.set('w', S.w); store.set('h', S.h); store.set('pads', S.pads); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const nameOf = i => (S.names[i] || '').trim() || ('Joueur ' + (i+1));
const fmt = ms => { ms = Math.max(0, ms|0); const m = (ms/60000)|0, s = ((ms%60000)/1000)|0, c = ((ms%1000)/10)|0;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0'); };
function show(id){ document.querySelectorAll('.screen').forEach(e => e.classList.toggle('active', e.id === id)); if(id === 'game') resize(); }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ------------------------------------------------------------------ menu UI */
function paintMenu(){
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('sel', +b.dataset.n === S.n));
  $('#pl1').classList.toggle('off', S.n === 1);
  $('#keys0').innerHTML = S.n === 1
    ? '<kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> ou <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd>'
    : '<kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>';
  [0,1].forEach(i => [...$('#sw'+i).children].forEach((b, k) => {
    b.classList.toggle('sel', COLORS[k] === S.colors[i]);
    b.disabled = S.n === 2 && COLORS[k] === S.colors[1-i];
  }));
  $('#w').value = S.w; $('#h').value = S.h;
  $('#pads').checked = S.pads;
}
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { S.n = +b.dataset.n; save(); paintMenu(); });
[0,1].forEach(i => {
  const inp = $('#name'+i); inp.value = S.names[i];
  inp.addEventListener('input', () => { S.names[i] = inp.value; save(); });
  COLORS.forEach(c => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', 'couleur');
    b.onclick = () => { S.colors[i] = c; save(); paintMenu(); }; $('#sw'+i).appendChild(b); });
});
['w','h'].forEach(k => $('#'+k).addEventListener('change', e => { S[k] = clamp(parseInt(e.target.value) || MIN, MIN, MAX); save(); paintMenu(); }));
document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
  const [k, d] = b.dataset.step.split(','); S[k] = clamp(S[k] + (+d), MIN, MAX); save(); paintMenu();
}));
document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
  const [w, h] = b.dataset.p.split(',').map(Number); S.w = w; S.h = h; save(); paintMenu();
}));
$('#pads').addEventListener('change', e => { S.pads = e.target.checked; save(); });
paintMenu();

/* ------------------------------------------------------------------ maze */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// wall bits: N=1 E=2 S=4 W=8 ; DIRS: up, right, down, left
const DIRS = [[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
function genMaze(w, h, seed){
  const r = rng(seed), cells = new Uint8Array(w*h).fill(15), seen = new Uint8Array(w*h);
  const stack = [0]; seen[0] = 1;
  while(stack.length){
    const i = stack[stack.length-1], x = i % w, y = (i / w) | 0, opts = [];
    for(const d of DIRS){ const nx = x+d[0], ny = y+d[1]; if(nx>=0 && ny>=0 && nx<w && ny<h && !seen[ny*w+nx]) opts.push(d); }
    if(!opts.length){ stack.pop(); continue; }
    const d = opts[(r()*opts.length)|0], ni = (y+d[1])*w + x + d[0];
    cells[i] &= ~d[2]; cells[ni] &= ~d[3]; seen[ni] = 1; stack.push(ni);
  }
  cells[0] &= ~8;          // entrée à gauche
  cells[w*h-1] &= ~2;      // sortie à droite
  return cells;
}

/* ------------------------------------------------------------------ game */
const cv = $('#cv'), ctx = cv.getContext('2d');
const view = { W:0, H:0, dpr:1, cs:20, ox:0, oy:0, scroll:false };
let mazeImg = null, G = null;

function startGame(){
  const w = S.w, h = S.h;
  G = { w, h, n:S.n, cells:genMaze(w, h, (Math.random()*2**31)|0),
        phase:'countdown', goAt:performance.now() + 3000, startT:0, finished:0,
        players:[] };
  for(let i = 0; i < S.n; i++){
    G.players.push({ i, name:nameOf(i), color:S.colors[i], x:0, y:0, rx:0, ry:0,
      visited:new Set([0]), done:false, time:0, held:[], nextMoveAt:0 });
  }
  $('#hudSize').textContent = w + ' × ' + h;
  buildTimers();
  buildPads();
  $('#help').textContent = S.n === 1 ? 'Flèches ou ZQSD pour se déplacer' : nameOf(0) + ' : flèches   ·   ' + nameOf(1) + ' : ZQSD';
  $('#ovEnd').classList.remove('show');
  $('#ovCount').classList.add('show');
  $('#countNum').textContent = '3';
  show('game');
}

function buildTimers(){
  const box = $('#timers'); box.innerHTML = '';
  G.players.forEach(p => {
    const d = document.createElement('div'); d.className = 'tbox';
    const dot = document.createElement('span'); dot.className = 'pdot'; dot.style.background = p.color;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
    const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmt(0);
    const fl = document.createElement('span'); fl.className = 'flag';
    if(G.n === 1) nm.style.display = 'none';
    d.append(dot, nm, tm, fl); box.appendChild(d);
    p.el = { box:d, tm, fl };
  });
}

function buildPads(){
  [0,1].forEach(i => {
    const pad = $('#pad'+i); pad.innerHTML = '';
    const p = G.players[i];
    if(!p) return;
    pad.style.setProperty('--pc', p.color);
    // grid layout: [ ,up, ][left,label,right][ ,down, ]
    const cells = [null, 0, null, 3, 'lab', 1, null, 2, null];
    const arrows = ['▲','▶','▼','◀'];
    cells.forEach(c => {
      if(c === null){ pad.appendChild(document.createElement('span')); return; }
      if(c === 'lab'){ const s = document.createElement('span'); s.className = 'lab'; s.textContent = G.n === 2 ? 'J' + (i+1) : ''; pad.appendChild(s); return; }
      const b = document.createElement('button'); b.textContent = arrows[c]; b.setAttribute('aria-label', 'direction');
      b.addEventListener('pointerdown', e => { e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('down'); press(p, c); });
      const up = () => { b.classList.remove('down'); release(p, c); };
      ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
      b.addEventListener('contextmenu', e => e.preventDefault());
      pad.appendChild(b);
    });
  });
  paintPads();
}
function paintPads(){
  $('#pad0').classList.toggle('show', S.pads && !!G);
  $('#pad1').classList.toggle('show', S.pads && !!G && G.n === 2);
  $('#bPads').classList.toggle('on', S.pads);
}
$('#bPads').onclick = () => { S.pads = !S.pads; save(); paintPads(); };

function resize(){
  const r = $('#wrap').getBoundingClientRect();
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.W = r.width; view.H = r.height;
  cv.width = Math.max(1, r.width * view.dpr); cv.height = Math.max(1, r.height * view.dpr);
  if(G) buildMazeImg();
}
window.addEventListener('resize', resize);

function buildMazeImg(){
  if(!G || !view.W) return;
  const pad = 26;
  let cs = Math.floor(Math.min((view.W - pad*2) / G.w, (view.H - pad*2) / G.h));
  // solo : caméra qui suit si les cases sont trop petites ; à 2 : on garde tout visible tant que possible
  const minCs = G.n === 1 ? 18 : 8;
  view.scroll = cs < minCs;
  if(view.scroll) cs = G.n === 1 ? 26 : 12;
  cs = Math.min(cs, 64);
  view.cs = cs;
  const dpr = view.dpr, Wp = G.w*cs, Hp = G.h*cs;
  view.ox = Math.round((view.W - Wp)/2); view.oy = Math.round((view.H - Hp)/2);
  const c = document.createElement('canvas'); c.width = (Wp+8)*dpr; c.height = (Hp+8)*dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.translate(4, 4);
  g.fillStyle = '#121731'; g.fillRect(0, 0, Wp, Hp);
  g.fillStyle = '#4cc9f022'; g.fillRect(0, 0, cs, cs);
  const ex = (G.w-1)*cs, ey = (G.h-1)*cs;
  const grd = g.createRadialGradient(ex+cs/2, ey+cs/2, 2, ex+cs/2, ey+cs/2, cs);
  grd.addColorStop(0, '#06d6a0aa'); grd.addColorStop(1, '#06d6a022');
  g.fillStyle = grd; g.fillRect(ex, ey, cs, cs);
  g.strokeStyle = '#7f8cff'; g.lineCap = 'round';
  g.lineWidth = Math.max(2, cs*0.12);
  g.shadowColor = '#7f8cff88'; g.shadowBlur = cs > 14 ? 6 : 0;
  g.beginPath();
  for(let y = 0; y < G.h; y++) for(let x = 0; x < G.w; x++){
    const v = G.cells[y*G.w+x], px = x*cs, py = y*cs;
    if(v & 1){ g.moveTo(px, py); g.lineTo(px+cs, py); }
    if(v & 8){ g.moveTo(px, py); g.lineTo(px, py+cs); }
    if(x === G.w-1 && (v & 2)){ g.moveTo(px+cs, py); g.lineTo(px+cs, py+cs); }
    if(y === G.h-1 && (v & 4)){ g.moveTo(px, py+cs); g.lineTo(px+cs, py+cs); }
  }
  g.stroke();
  mazeImg = c;
}

function tryMove(p, d){
  if(!G || G.phase !== 'play' || p.done) return false;
  const D = DIRS[d], i = p.y*G.w + p.x;
  if(G.cells[i] & D[2]) return false;
  const nx = p.x + D[0], ny = p.y + D[1];
  if(nx < 0 || ny < 0 || nx >= G.w || ny >= G.h) return false;
  p.x = nx; p.y = ny; p.visited.add(ny*G.w + nx);
  if(nx === G.w-1 && ny === G.h-1) finish(p);
  return true;
}

function finish(p){
  p.done = true; p.time = performance.now() - G.startT; p.held.length = 0;
  G.finished++;
  p.rank = G.finished;
  p.el.tm.textContent = fmt(p.time); p.el.box.classList.add('done');
  p.el.fl.textContent = G.n === 2 ? (p.rank === 1 ? '🏆' : '🏁') : '🏁';
  if(G.finished >= G.n){ G.phase = 'done'; setTimeout(showEnd, 450); }
  else toast('🏆 ' + p.name + ' a trouvé la sortie en ' + fmt(p.time) + ' !');
}

function showEnd(){
  if(!G) return;
  const body = $('#endBody'); body.innerHTML = '';
  if(G.n === 1){
    const p = G.players[0], key = 'best.' + G.w + 'x' + G.h, best = store.get(key, null);
    const rec = best === null || p.time < best;
    if(rec) store.set(key, Math.round(p.time));
    $('#endTitle').textContent = rec ? 'Nouveau record ! 🏆' : 'Sortie trouvée !';
    const t = document.createElement('div'); t.className = 'bigtime'; t.textContent = fmt(p.time);
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = rec ? (best === null ? 'Premier temps pour ' + G.w + ' × ' + G.h + '.' : 'Ancien record : ' + fmt(best))
                        : 'Record (' + G.w + ' × ' + G.h + ') : ' + fmt(best);
    body.append(t, h);
  } else {
    const ps = G.players.slice().sort((a, b) => a.time - b.time);
    const gap = ps[1].time - ps[0].time;
    $('#endTitle').textContent = ps[0].name + ' gagne ! 🏆';
    const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Avec ' + (gap/1000).toFixed(2).replace('.', ',') + ' s d’avance';
    const ul = document.createElement('ul'); ul.className = 'results';
    ps.forEach((p, k) => {
      const li = document.createElement('li');
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = k === 0 ? '🥇' : '🥈';
      const dot = document.createElement('span'); dot.className = 'pdot'; dot.style.cssText = 'width:14px;height:14px;border-radius:50%;background:' + p.color;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
      const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmt(p.time);
      li.append(rk, dot, nm, tm); ul.appendChild(li);
    });
    body.append(h, ul);
  }
  $('#ovEnd').classList.add('show');
}

/* ------------------------------------------------------------------ keyboard & pads */
// e.code = position physique : KeyW/KeyA/KeyS/KeyD = touches Z/Q/S/D sur AZERTY (W/A/S/D sur QWERTY)
const ARROWS = { ArrowUp:0, ArrowRight:1, ArrowDown:2, ArrowLeft:3 };
const ZQSD = { KeyW:0, KeyD:1, KeyS:2, KeyA:3 };
function playerForKey(code){
  if(!G) return null;
  if(code in ARROWS) return { p:G.players[0], d:ARROWS[code] };
  if(code in ZQSD) return { p:G.players[G.n === 2 ? 1 : 0], d:ZQSD[code] };
  return null;
}
function press(p, d){
  if(!p.held.includes(d)){ p.held.push(d); tryMove(p, d); p.nextMoveAt = performance.now() + 170; }
}
function release(p, d){ const k = p.held.indexOf(d); if(k >= 0) p.held.splice(k, 1); }
window.addEventListener('keydown', e => {
  if(!$('#game').classList.contains('active')) return;
  if(e.code === 'Escape'){ toMenu(); return; }
  if(e.code === 'Enter' && $('#ovEnd').classList.contains('show')){ startGame(); return; }
  const m = playerForKey(e.code); if(!m) return;
  e.preventDefault(); if(!e.repeat) press(m.p, m.d);
});
window.addEventListener('keyup', e => { const m = playerForKey(e.code); if(m) release(m.p, m.d); });
window.addEventListener('blur', () => { if(G) G.players.forEach(p => p.held.length = 0); });

// glisser sur le labyrinthe (solo uniquement)
let sw0 = null;
cv.addEventListener('pointerdown', e => { if(G && G.n === 1) sw0 = { x:e.clientX, y:e.clientY }; });
cv.addEventListener('pointermove', e => {
  if(!sw0 || !G) return;
  const dx = e.clientX - sw0.x, dy = e.clientY - sw0.y, th = Math.max(16, Math.min(view.cs*0.7, 40));
  if(Math.abs(dx) < th && Math.abs(dy) < th) return;
  tryMove(G.players[0], Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  sw0 = { x:e.clientX, y:e.clientY };
});
['pointerup','pointercancel','pointerleave'].forEach(ev => cv.addEventListener(ev, () => { sw0 = null; }));

/* ------------------------------------------------------------------ loop */
let lastT = performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT)/1000); lastT = t;
  if(!G || !$('#game').classList.contains('active')) return;

  if(G.phase === 'countdown'){
    const left = G.goAt - t;
    if(left <= 0){ G.phase = 'play'; G.startT = G.goAt; $('#ovCount').classList.remove('show'); }
    else $('#countNum').textContent = Math.ceil(left/1000);
  }
  if(G.phase === 'play'){
    for(const p of G.players){
      if(p.done) continue;
      p.el.tm.textContent = fmt(t - G.startT);
      if(p.held.length && t >= p.nextMoveAt){ tryMove(p, p.held[p.held.length-1]); p.nextMoveAt = t + 95; }
    }
  }
  const k = Math.min(1, dt*20);
  for(const p of G.players){ p.rx += (p.x - p.rx)*k; p.ry += (p.y - p.ry)*k; }
  draw();
}
requestAnimationFrame(frame);

function draw(){
  const { dpr, cs, W, H } = view;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0c0f1d'; ctx.fillRect(0, 0, W, H);
  if(!mazeImg) return;
  let ox = view.ox, oy = view.oy;
  if(view.scroll){
    const Wp = G.w*cs, Hp = G.h*cs;
    const fx = G.players.reduce((s, p) => s + p.rx, 0) / G.players.length;
    const fy = G.players.reduce((s, p) => s + p.ry, 0) / G.players.length;
    ox = Wp + 48 <= W ? (W - Wp)/2 : clamp(W/2 - (fx+.5)*cs, W - Wp - 24, 24);
    oy = Hp + 48 <= H ? (H - Hp)/2 : clamp(H/2 - (fy+.5)*cs, H - Hp - 24, 24);
  }
  ctx.save(); ctx.translate(Math.round(ox), Math.round(oy));
  ctx.drawImage(mazeImg, -4, -4, mazeImg.width/dpr, mazeImg.height/dpr);

  // traces
  const tr = Math.max(1.3, cs*0.09);
  G.players.forEach((p, idx) => {
    ctx.fillStyle = p.color + '50';
    const off = G.n === 2 ? (idx === 0 ? -1 : 1) * cs*0.12 : 0;
    for(const i of p.visited){ const x = i % G.w, y = (i / G.w) | 0;
      ctx.beginPath(); ctx.arc((x+.5)*cs + off, (y+.5)*cs + off, tr, 0, 6.283); ctx.fill(); }
  });

  if(cs >= 14){
    ctx.fillStyle = '#06d6a0'; ctx.font = '700 ' + Math.max(9, Math.min(13, cs*0.3)) + 'px Space Grotesk, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('SORTIE ➜', G.w*cs, G.h*cs + 6);
  }

  // joueurs (décalés s'ils sont sur la même case)
  const same = G.n === 2 && G.players[0].x === G.players[1].x && G.players[0].y === G.players[1].y;
  G.players.forEach((p, idx) => {
    const off = same ? (idx === 0 ? -1 : 1) * cs*0.18 : 0;
    const cx = (p.rx+.5)*cs + off, cy = (p.ry+.5)*cs;
    const r = Math.max(3, cs*(same ? 0.24 : 0.32));
    ctx.save();
    ctx.shadowColor = p.color; ctx.shadowBlur = 14;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = Math.max(1.5, cs*0.06); ctx.strokeStyle = '#fff'; ctx.stroke();
    if(G.n === 2 && cs >= 16){
      ctx.font = '700 ' + Math.max(9, Math.min(13, r*0.95)) + 'px Space Grotesk, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#0c0f1d';
      ctx.fillText(String(idx+1), cx, cy + 0.5);
    }
    ctx.restore();
  });
  ctx.restore();
}

/* ------------------------------------------------------------------ navigation */
function toMenu(){ G = null; mazeImg = null; $('#ovEnd').classList.remove('show'); $('#ovCount').classList.remove('show'); paintMenu(); show('menu'); }
$('#bPlay').onclick = startGame;
$('#bAgain').onclick = startGame;
$('#bRestart').onclick = startGame;
$('#bMenu').onclick = toMenu;
$('#bQuit').onclick = toMenu;
})();
</script>
