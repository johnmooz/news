<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 qui prend !</title>
<style>
:root{
  --cw:clamp(42px,12.4vw,66px);
  --ch:calc(var(--cw)*1.38);
  --felt:#1d4d33; --felt2:#163c28; --ink:#f5efe0; --muted:#b9c9bd;
  --gold:#f2c14e; --red:#e5543b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at 50% 0%,#2a6646 0%,var(--felt) 45%,var(--felt2) 100%) fixed;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:10px 8px 24px}
h1{font-size:1.6rem;margin:.2em 0 .1em;letter-spacing:.02em}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.hidden{display:none!important}
.tgl.off{opacity:.45;text-decoration:line-through}

/* ---------- Boutons ---------- */
.btn{border:0;border-radius:10px;padding:10px 16px;background:#f5efe0;color:#1d3b2a;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--gold);color:#3a2a00}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- Configuration ---------- */
.panel{background:rgba(0,0,0,.22);border-radius:14px;padding:14px}
.countbox{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.counter{display:flex;align-items:center;background:rgba(0,0,0,.25);border-radius:10px}
.counter button{border:0;background:none;color:var(--ink);font-size:1.4rem;width:44px;height:44px}
.counter b{min-width:28px;text-align:center;font-size:1.3rem}
.prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px;border-radius:10px;background:rgba(255,255,255,.06);margin-bottom:6px}
.pidx{width:22px;text-align:center;color:var(--muted);font-weight:700}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 9px;border-radius:6px;font-size:.85rem;font-weight:600}
.seg button.on{background:var(--ink);color:#1d3b2a}
.prow input{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;border:0;background:#f5efe0;color:#1d2b22;font-size:1rem}
.dice{border:0;background:rgba(255,255,255,.12);border-radius:8px;width:38px;height:36px;font-size:1.1rem}
.prow select,.opt select{padding:7px;border-radius:8px;border:0;background:#f5efe0;color:#1d2b22;font-size:.88rem}
.opts{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 14px;align-items:center}
.opt{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.startbar{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Cartes ---------- */
.card{width:var(--cw);height:var(--ch);border-radius:7px;background:#fbf6ea;box-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;border:1.5px solid rgba(0,0,0,.18);user-select:none}
.card .band{height:32%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 1px;padding:1px 2px}
.card .band svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17)}
.card .num{flex:1;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cw)*.42);line-height:1}
.h1 .band{background:#e8ddc3;color:#7a6440}.h1 .num{color:#3a2f1e}
.h2 .band{background:#3d7fc1;color:#fff}.h2 .num{color:#25609b}
.h3 .band{background:#e0a21c;color:#fff}.h3 .num{color:#956500}
.h5 .band{background:#d4472f;color:#fff}.h5 .num{color:#b23520}
.h7 .band{background:#6f2f9a;color:#fff}.h7 .num{color:#6f2f9a}
.card.back{background:repeating-linear-gradient(45deg,#8c2f22 0 6px,#a63a2b 6px 12px);border-color:#fff3}
.card.back::after{content:"6";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff8;font-size:calc(var(--cw)*.5)}
.card.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4) translateY(-30px);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}

/* ---------- Plateau ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.topbar .title{font-weight:800;font-size:1.05rem;line-height:1.2}
.topbar .title small{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.players{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;min-width:92px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;border:2px solid transparent;position:relative}
.chip.active{border-color:var(--gold)}
.chip .nm{padding-right:16px;font-weight:700;font-size:.82rem;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.chip .sc{display:flex;align-items:baseline;gap:5px;font-size:.8rem;color:var(--muted)}
.chip .sc b{font-size:1.05rem;color:var(--ink)}
.chip .rd{color:#ffb4a6}
.chip .bar{height:4px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:4px;overflow:hidden}
.chip .bar i{display:block;height:100%;background:linear-gradient(90deg,#7bd389,var(--gold),var(--red))}
.chip .st{position:absolute;top:4px;right:6px;font-size:.75rem}

.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:4px;padding:4px;border-radius:10px;background:rgba(0,0,0,.2);transition:background .3s, box-shadow .3s}
.rowinfo{width:24px;flex:none;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.15}
.rowinfo b{display:block;color:var(--ink);font-size:.9rem}
.slot{width:var(--cw);height:var(--ch);border-radius:7px;border:1.5px dashed rgba(255,255,255,.16);flex:none}
.slot.sixth{border-color:rgba(255,100,80,.55);background:rgba(255,60,40,.08);display:grid;place-items:center;color:rgba(255,130,110,.6);font-weight:900;font-size:calc(var(--cw)*.4)}
.row.pickable{cursor:pointer;box-shadow:0 0 0 2px var(--gold);background:rgba(242,193,78,.12)}
.row.pickable:hover{background:rgba(242,193,78,.25)}
.row.flash{background:rgba(242,193,78,.25)}
.row.taken{background:rgba(229,84,59,.35)}

.status{margin:10px 0 6px;min-height:2.6em;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.25);font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status b{color:var(--gold)}

.reveal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:0;margin:4px 0}
.rv{display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .3s}
.rv small{font-size:.7rem;color:var(--muted);max-width:calc(var(--cw) + 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv.now .card{box-shadow:0 0 0 3px var(--gold),0 4px 10px rgba(0,0,0,.5);transform:translateY(-4px)}
.rv.done{opacity:.3}

.handzone{margin-top:6px;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 8px}
.handhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.handhead .who{font-weight:700}
.hand{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.hand .card{transition:transform .15s}
.hand.choosing .card{cursor:pointer}
.hand.choosing .card:hover{transform:translateY(-4px)}
.hand .card.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 6px 12px rgba(0,0,0,.5)}
.hand .card.played{opacity:.35}
.handmsg{text-align:center;color:var(--muted);padding:14px 0}

details.log{margin-top:10px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;font-size:.85rem}
details.log summary{cursor:pointer;color:var(--muted)}
#logList{max-height:180px;overflow:auto;margin:6px 0 0;padding-left:18px}
#logList li{margin:2px 0}

/* ---------- Fenêtres ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,20,12,.82);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{background:#f8f2e3;color:#1d2b22;border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal h2{margin:0 0 10px}
.modal p{line-height:1.45}
.modal table{width:100%;border-collapse:collapse;margin:10px 0 16px}
.modal td,.modal th{padding:7px 6px;border-bottom:1px solid #0001;text-align:left}
.modal th{font-size:.8rem;color:#5b6b60}
.modal td.r,.modal th.r{text-align:right}
.modal tr.win td{font-weight:800;color:#1f6b3b}
.modal tr.lose td{color:#b23520}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modal .btn{background:#1d4d33;color:#fff}
.modal .btn.primary{background:var(--gold);color:#3a2a00}
.modal .btn.ghost{background:#0000000f;color:#1d2b22}
.modal ul{padding-left:20px;line-height:1.5}
.pass{text-align:center}
.pass .big{font-size:1.6rem;font-weight:800;margin:6px 0 4px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .3s ease-out;max-width:92vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,-20px);opacity:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="bull" viewBox="0 0 24 24">
    <path d="M3 4.5c0 4 3 6.2 6.2 6.2M21 4.5c0 4-3 6.2-6.2 6.2" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M6.8 10.5c0-1.6 2.2-2.8 5.2-2.8s5.2 1.2 5.2 2.8v4.6c0 3.4-2.4 6.6-5.2 6.6s-5.2-3.2-5.2-6.6z" fill="currentColor"/>
    <circle cx="9.7" cy="13.2" r="1.1" fill="#fff"/><circle cx="14.3" cy="13.2" r="1.1" fill="#fff"/>
    <ellipse cx="12" cy="18.3" rx="2.8" ry="1.7" fill="#fff" opacity=".5"/>
  </symbol>
</svg>

<!-- ============ CONFIGURATION ============ -->
<section id="setup" class="wrap">
  <h1><span>6</span> qui prend !</h1>
  <p class="sub">Évitez les têtes de bœuf. Le joueur qui en a le moins quand quelqu'un atteint 66 gagne.</p>
  <div class="panel">
    <div class="countbox">
      <strong>Nombre de joueurs</strong>
      <div class="counter">
        <button id="minus" aria-label="Moins">−</button><b id="count">4</b><button id="plus" aria-label="Plus">+</button>
      </div>
    </div>
    <div id="plist"></div>
    <div class="opts">
      <label class="opt">Vitesse
        <select id="speed"><option value="1.6">Lente</option><option value="1" selected>Normale</option><option value="0.5">Rapide</option></select>
      </label>
      <label class="opt">Fin de partie à
        <select id="limit"><option>66</option><option>44</option><option>99</option></select> têtes
      </label>
      <button class="btn ghost small tgl sfxT">🔊 Sons</button>
      <button class="btn ghost small tgl musT">🎵 Musique</button>
    </div>
    <div class="startbar">
      <button class="btn primary" id="startBtn">Lancer la partie</button>
      <button class="btn ghost" id="rulesBtn1">Règles</button>
    </div>
  </div>
</section>

<!-- ============ JEU ============ -->
<section id="game" class="wrap hidden">
  <div class="topbar">
    <div class="title"><span style="color:var(--gold)">6</span> qui prend ! <small id="roundLbl"></small></div>
    <div style="display:flex;gap:6px">
      <button class="btn ghost small tgl sfxT" title="Effets sonores">🔊</button>
      <button class="btn ghost small tgl musT" title="Musique">🎵</button>
      <button class="btn ghost small" id="rulesBtn2" title="Règles">?</button>
      <button class="btn ghost small" id="quitBtn">Quitter</button>
    </div>
  </div>
  <div class="players" id="players"></div>
  <div class="rows" id="rows"></div>
  <div class="status" id="status"></div>
  <div class="reveal" id="reveal"></div>
  <div class="handzone" id="handzone">
    <div class="handhead"><span class="who" id="handWho"></span><button class="btn primary small hidden" id="playBtn">Jouer cette carte</button></div>
    <div class="hand" id="hand"></div>
  </div>
  <details class="log"><summary>Journal de la partie</summary><ol id="logList"></ol></details>
</section>

<div id="overlay" class="overlay hidden"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ================= Données ================= */
const AI_NAMES=["Robo-Bœuf","Meuh-Tron 3000","Toro.exe","Bison Futé","Vachette.ai","Buffle Binaire","Zébu Zéro","Taureau Turing","La Vache Qui Calcule","Minotaure 2.0","Yak Overflow","Gnou/Linux","Aurochs Analytique","Bovin Quantique"];
const HUMAN_NAMES=["Camille","Léo","Manon","Hugo","Chloé","Lucas","Inès","Gabriel","Jade","Arthur","Louise","Nathan","Zoé","Théo"];
const heads=n=>n===55?7:n%11===0?5:n%10===0?3:n%5===0?2:1;
const sumHeads=a=>a.reduce((s,n)=>s+heads(n),0);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let SPEED=1, LIMIT=66;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));

function cardHTML(n,cls=""){
  const h=heads(n);let ic="";for(let k=0;k<h;k++)ic+='<svg><use href="#bull"/></svg>';
  return `<div class="card h${h} ${cls}" data-n="${n}"><div class="band">${ic}</div><div class="num">${n}</div></div>`;
}


/* ================= Son & musique (Web Audio, tout est synthétisé) ================= */
const A={ctx:null,master:null,sfx:null,mus:null,sfxOn:true,musicOn:true};
try{const a=JSON.parse(localStorage.getItem("6qp-audio"));if(a){A.sfxOn=!!a.sfxOn;A.musicOn=!!a.musicOn}}catch(e){}
function ac(){
  if(!A.ctx){
    try{
      A.ctx=new (window.AudioContext||window.webkitAudioContext)();
      A.master=A.ctx.createGain();A.master.gain.value=.9;A.master.connect(A.ctx.destination);
      A.sfx=A.ctx.createGain();A.sfx.gain.value=.8;A.sfx.connect(A.master);
      A.mus=A.ctx.createGain();A.mus.gain.value=.32;A.mus.connect(A.master);
    }catch(e){A.ctx=null;return null}
  }
  if(A.ctx.state==="suspended")A.ctx.resume().catch(()=>{});
  return A.ctx;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,{type="sine",vol=.2,t=0,slide=0,attack=.005,dest=null,filter=0}={}){
  const c=A.ctx;if(!c)return;const t0=c.currentTime+t;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let node=o;
  if(filter){const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=filter;o.connect(fl);node=fl}
  node.connect(g);g.connect(dest||A.sfx);o.start(t0);o.stop(t0+dur+.05);
}
let NOISE=null;
function noise(dur,{vol=.2,t=0,freq=2000,type="bandpass",q=1,dest=null}={}){
  const c=A.ctx;if(!c)return;const t0=c.currentTime+t;
  if(!NOISE){NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=c.createBufferSource();s.buffer=NOISE;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t0,Math.random()*.5);s.stop(t0+dur+.05);
}
function moo(t=0,big=1){
  const c=A.ctx;if(!c)return;const t0=c.currentTime+t,dur=.75+.25*big;
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(700,t0);f.frequency.linearRampToValueAtTime(1300,t0+.25);f.frequency.linearRampToValueAtTime(500,t0+dur);f.Q.value=6;
  const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.32,t0+.12);g.gain.setValueAtTime(.3,t0+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.5;lg.gain.value=5;lfo.connect(lg);
  [1,1.012].forEach(d=>{const o=c.createOscillator();o.type="sawtooth";
    o.frequency.setValueAtTime(150*d/big**.3,t0);o.frequency.linearRampToValueAtTime(175*d/big**.3,t0+.2);o.frequency.exponentialRampToValueAtTime(105*d/big**.3,t0+dur);
    lg.connect(o.frequency);o.connect(f);o.start(t0);o.stop(t0+dur+.05)});
  lfo.start(t0);lfo.stop(t0+dur+.05);f.connect(g);g.connect(A.sfx);
}
function sfx(name,arg){
  if(!A.sfxOn||!ac())return;
  switch(name){
    case "click":tone(900,.05,{type:"square",vol:.05,filter:3000});break;
    case "select":tone(1250,.06,{type:"triangle",vol:.12});tone(1880,.05,{type:"sine",vol:.05,t:.02});break;
    case "play":noise(.12,{vol:.25,freq:2500,q:.8});tone(520,.12,{type:"triangle",vol:.1,slide:780});break;
    case "flip":for(let i=0;i<(arg||4);i++)noise(.07,{vol:.22,freq:3200,q:1.2,t:i*.06});break;
    case "place":{const f=220+(arg||50)*4;noise(.05,{vol:.18,freq:1400,q:2});tone(f,.14,{type:"triangle",vol:.12});break}
    case "turn":tone(mf(79),.25,{type:"sine",vol:.14});tone(mf(84),.4,{type:"sine",vol:.12,t:.12});break;
    case "alert":[0,.16].forEach(t=>tone(660,.12,{type:"square",vol:.06,t,filter:2000}));tone(880,.2,{type:"square",vol:.06,t:.32,filter:2000});break;
    case "take":{const big=Math.min(2,1+(arg||1)/12);tone(330,.35,{type:"sawtooth",vol:.08,slide:110,filter:1200});moo(.08,big);if(arg>=10)moo(.75,big*1.2);break}
    case "round":[67,71,74,79].forEach((m,i)=>tone(mf(m),.3,{type:"triangle",vol:.13,t:i*.11}));break;
    case "win":[[67,0],[72,.15],[76,.3],[79,.45],[76,.65],[79,.8]].forEach(([m,t])=>{tone(mf(m),.35,{type:"square",vol:.06,t,filter:2500});tone(mf(m-12),.35,{type:"triangle",vol:.1,t})});tone(mf(84),.9,{type:"triangle",vol:.14,t:1});break;
    case "lose":[[62,0],[61,.35],[60,.7]].forEach(([m,t])=>tone(mf(m),.4,{type:"sawtooth",vol:.08,t,filter:900}));tone(mf(59),1.1,{type:"sawtooth",vol:.09,t:1.05,slide:mf(55),filter:800});break;
  }
}

/* --- Musique : petite boucle country générée en direct --- */
const PROG=[[55,59,62],[50,54,57],[52,55,59],[48,52,55],[55,59,62],[50,54,57],[48,52,55],[50,54,57]]; // G D Em C | G D C D
const PENTA=[67,69,71,74,76,79,81];
const M={timer:null,next:0,step:0,bpm:116,mel:3};
function musicStart(){
  if(!A.musicOn||document.hidden||M.timer||!ac())return;
  M.next=A.ctx.currentTime+.12;M.step=0;M.timer=setInterval(musicTick,25);
}
function musicStop(){clearInterval(M.timer);M.timer=null}
function musicTick(){
  const c=A.ctx;if(!c)return;const e8=60/M.bpm/2;
  while(M.next<c.currentTime+.15){musicStep(M.step,M.next-c.currentTime);M.next+=e8;M.step++}
}
function musicStep(step,t){
  if(t<0)t=0;
  const bar=Math.floor(step/8)%PROG.length,e=step%8,ch=PROG[bar],o={dest:A.mus};
  // basse "oom-pah"
  if(e===0||e===4)tone(mf(ch[0]-12),.32,{...o,type:"triangle",vol:.5,t});
  if(e===2||e===6)tone(mf((e===2?ch[2]:ch[1])-12),.25,{...o,type:"triangle",vol:.35,t});
  // guitare en arpège
  const pat=[0,1,2,1,0,2,1,2],m=ch[pat[e]]+12+(e>=4&&pat[e]===0?12:0);
  tone(mf(m),.22,{...o,type:"triangle",vol:.14,t,filter:2400});
  // charleston
  if(e%2===1)noise(.035,{...o,vol:.12,freq:8000,type:"highpass",t});
  if(e===4)noise(.08,{...o,vol:.16,freq:1800,q:.7,t}); // caisse claire légère
  // mélodie sifflée (variations aléatoires, collée aux accords)
  const section=Math.floor(step/(8*PROG.length))%2;
  if(section===1&&e%2===0&&Math.random()<.7){
    M.mel=Math.max(0,Math.min(PENTA.length-1,M.mel+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));
    let n=PENTA[M.mel];if(e===0){const ct=ch.map(x=>x+24);n=ct.reduce((b,x)=>Math.abs(x-n)<Math.abs(b-n)?x:b,ct[0])}
    tone(mf(n),e===0?.45:.28,{...o,type:"sine",vol:.16,t,attack:.03});
  }
}

/* ================= Configuration ================= */
let setup=[];
function usedNames(skip){return setup.filter((_,i)=>i!==skip).map(s=>s.name)}
function randomName(type,skip){
  const pool=(type==="ai"?AI_NAMES:HUMAN_NAMES).filter(n=>!usedNames(skip).includes(n));
  if(pool.length)return pool[Math.random()*pool.length|0];
  return (type==="ai"?"IA ":"Joueur ")+(Math.random()*90+10|0);
}
function loadSetup(){
  try{const s=JSON.parse(localStorage.getItem("6qp-setup"));if(Array.isArray(s)&&s.length>=2&&s.length<=10){setup=s;return}}catch(e){}
  setup=[{type:"human",name:"Joueur 1",auto:false,level:"smart"}];
  for(let i=1;i<4;i++){setup.push({type:"ai",name:"",auto:true,level:"smart"});setup[i].name=randomName("ai",i)}
}
function saveSetup(){try{localStorage.setItem("6qp-setup",JSON.stringify(setup))}catch(e){}}
function setCount(n){
  n=Math.max(2,Math.min(10,n));
  while(setup.length<n){const i=setup.length;setup.push({type:"ai",name:"",auto:true,level:"smart"});setup[i].name=randomName("ai",i)}
  setup.length=n;renderSetup();
}
function renderSetup(){
  $("count").textContent=setup.length;
  $("plist").innerHTML=setup.map((p,i)=>`
    <div class="prow" data-i="${i}">
      <span class="pidx">${i+1}</span>
      <div class="seg"><button data-t="human" class="${p.type==="human"?"on":""}">👤 Humain</button><button data-t="ai" class="${p.type==="ai"?"on":""}">🤖 IA</button></div>
      <input value="${esc(p.name)}" maxlength="20" aria-label="Nom du joueur ${i+1}">
      <button class="dice" title="Nom au hasard">🎲</button>
      ${p.type==="ai"?`<select class="lvl"><option value="easy" ${p.level==="easy"?"selected":""}>Facile</option><option value="smart" ${p.level!=="easy"?"selected":""}>Malin</option></select>`:""}
    </div>`).join("");
  saveSetup();
}
$("plist").addEventListener("click",e=>{
  const row=e.target.closest(".prow");if(!row)return;const i=+row.dataset.i,p=setup[i];
  const t=e.target.closest("[data-t]");
  if(t||e.target.closest(".dice"))sfx("click");
  if(t&&t.dataset.t!==p.type){p.type=t.dataset.t;if(p.auto)p.name=randomName(p.type,i);renderSetup()}
  if(e.target.closest(".dice")){p.name=randomName(p.type,i);p.auto=true;renderSetup()}
});
$("plist").addEventListener("input",e=>{
  const row=e.target.closest(".prow");if(!row)return;const p=setup[+row.dataset.i];
  if(e.target.tagName==="INPUT"){p.name=e.target.value;p.auto=false}
  if(e.target.classList.contains("lvl"))p.level=e.target.value;
  saveSetup();
});
$("plist").addEventListener("change",e=>{if(e.target.classList.contains("lvl")){setup[+e.target.closest(".prow").dataset.i].level=e.target.value;saveSetup()}});
$("minus").onclick=()=>{sfx("click");setCount(setup.length-1)};
$("plus").onclick=()=>{sfx("click");setCount(setup.length+1)};

/* ================= Partie ================= */
let G=null, RUN=0;
function startGame(){
  setup.forEach((p,i)=>{if(!p.name.trim())p.name=randomName(p.type,i)});renderSetup();
  SPEED=+$("speed").value;LIMIT=+$("limit").value;
  G={players:setup.map(s=>({name:s.name.trim(),type:s.type,level:s.level||"smart",hand:[],pile:[],total:0})),
     round:0,rows:[],played:new Set(),choices:new Map(),reveal:[],active:null,selected:null,pick:null,flash:null};
  RUN++;
  $("logList").innerHTML="";
  $("setup").classList.add("hidden");$("game").classList.remove("hidden");
  startRound();
}
function humans(){return G.players.map((p,i)=>p.type==="human"?i:-1).filter(i=>i>=0)}
function startRound(){
  G.round++;
  const deck=shuffle(Array.from({length:104},(_,i)=>i+1));
  G.players.forEach(p=>{p.hand=deck.splice(0,10).sort((a,b)=>a-b);p.pile=[]});
  G.rows=[0,1,2,3].map(()=>[deck.pop()]);
  G.played=new Set(G.rows.flat());
  log(`— Manche ${G.round} —`);
  render();nextTurn(RUN);
}
async function nextTurn(token){
  if(token!==RUN)return;
  if(G.players[0].hand.length===0)return endRound();
  G.choices=new Map();G.reveal=[];G.flash=null;
  G.players.forEach((p,i)=>{if(p.type==="ai")G.choices.set(i,aiChoose(i))});
  const hs=humans();
  if(!hs.length){setStatus("Les IA réfléchissent…");render();await sleep(900)}
  for(const i of hs){
    const c=await humanChoose(i,hs.length>1);
    if(token!==RUN)return;
    G.choices.set(i,c);
  }
  await resolveTurn(token);
  if(token!==RUN)return;
  nextTurn(token);
}
function humanChoose(i,hotseat){
  return new Promise(async resolve=>{
    if(hotseat){
      G.active=null;render();
      await passScreen(i);
    }
    G.active=i;G.selected=null;G.resolveChoice=c=>{G.resolveChoice=null;G.active=null;G.selected=null;resolve(c)};
    setStatus(`<b>${esc(G.players[i].name)}</b>, choisis une carte à jouer.`);
    sfx("turn");
    render();
  });
}
function passScreen(i){
  return new Promise(res=>{
    showModal(`<div class="pass"><p>Passe l'appareil à</p><div class="big">${esc(G.players[i].name)}</div><p style="color:#5b6b60">Les autres, ne regardez pas !</p><div class="btns" style="justify-content:center"><button class="btn primary" id="okPass">Je suis ${esc(G.players[i].name)} — voir ma main</button></div></div>`);
    $("okPass").onclick=()=>{hideModal();res()};
  });
}
function targetRow(c,rows=G.rows){
  let best=-1,end=-1;
  rows.forEach((r,i)=>{const e=r[r.length-1];if(e<c&&e>end){end=e;best=i}});
  return best;
}
async function resolveTurn(token){
  const plays=[...G.choices].map(([pi,c])=>({pi,c,state:"wait"})).sort((a,b)=>a.c-b.c);
  plays.forEach(({pi,c})=>{const h=G.players[pi].hand;h.splice(h.indexOf(c),1)});
  G.active=null;G.selected=null;G.reveal=plays;
  setStatus("Révélation des cartes !");render();sfx("flip",plays.length);
  await sleep(1100);if(token!==RUN)return;
  for(const r of plays){
    r.state="now";G.flash=null;
    const p=G.players[r.pi];
    setStatus(`<b>${esc(p.name)}</b> pose le ${r.c}…`);render();
    await sleep(650);if(token!==RUN)return;
    const t=targetRow(r.c);
    if(t===-1){
      let ri;
      if(p.type==="ai"){ri=aiPickRow();await sleep(300)}
      else ri=await humanPickRow(r.pi,r.c);
      if(token!==RUN)return;
      take(r.pi,ri,r.c,"carte trop faible");
    }else if(G.rows[t].length>=5){
      take(r.pi,t,r.c,"6ᵉ carte");
    }else{
      G.rows[t].push(r.c);G.flash={row:t,cls:"flash"};G.justPlaced=r.c;sfx("place",r.c);
    }
    G.played.add(r.c);r.state="done";render();G.justPlaced=null;
    await sleep(750);if(token!==RUN)return;
  }
  G.reveal=[];G.flash=null;render();
}
function take(pi,ri,c,reason){
  const p=G.players[pi],taken=G.rows[ri],pts=sumHeads(taken);
  p.pile.push(...taken);G.rows[ri]=[c];G.flash={row:ri,cls:"taken"};G.justPlaced=c;
  const msg=`${p.name} ramasse la rangée ${ri+1} : ${taken.length} carte${taken.length>1?"s":""}, ${pts} tête${pts>1?"s":""} (${reason})`;
  log(msg);sfx("take",pts);toast(`🐮 ${p.name} ramasse ${pts} tête${pts>1?"s":""} !`);
}
function humanPickRow(pi,c){
  return new Promise(res=>{
    G.pick={pi,resolve:ri=>{G.pick=null;res(ri)}};
    sfx("alert");
    setStatus(`<b>${esc(G.players[pi].name)}</b>, ton ${c} est plus petit que toutes les rangées : touche la rangée à ramasser.`);
    render();
  });
}

/* ================= IA ================= */
function aiPickRow(){
  let best=0;
  G.rows.forEach((r,i)=>{const a=sumHeads(r),b=sumHeads(G.rows[best]);if(a<b||(a===b&&r.length<G.rows[best].length))best=i});
  return best;
}
function binomTail(n,p,k){ // P(X>=k)
  if(k<=0)return 1;if(k>n)return 0;
  let s=0;for(let x=k;x<=n;x++){s+=comb(n,x)*Math.pow(p,x)*Math.pow(1-p,n-x)}return s;
}
function comb(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}
function aiChoose(i){
  const p=G.players[i],hand=p.hand;
  if(p.level==="easy")return hand[Math.random()*hand.length|0];
  const others=G.players.length-1;
  const unseenTotal=Math.max(1,104-G.played.size-hand.length);
  const q=Math.min(.95,others/unseenTotal);
  const isUnseen=n=>!G.played.has(n)&&!hand.includes(n);
  const minRow=Math.min(...G.rows.map(sumHeads));
  let best=hand[0],bestCost=Infinity;
  for(const c of hand){
    const t=targetRow(c);let cost;
    if(t===-1){
      cost=minRow*0.9+0.4;
    }else{
      const row=G.rows[t],end=row[row.length-1];
      let u=0;for(let n=end+1;n<c;n++)if(isUnseen(n))u++;
      if(row.length===5){
        cost=sumHeads(row)*Math.pow(1-q,u)+0.3;
      }else{
        const need=5-row.length;
        cost=(sumHeads(row)+1.5)*binomTail(u,q,need);
      }
      cost+=0.004*(c-end);
    }
    cost+=Math.random()*0.05;
    if(cost<bestCost){bestCost=cost;best=c}
  }
  return best;
}

/* ================= Fin de manche ================= */
function endRound(){
  const res=G.players.map(p=>{const r=sumHeads(p.pile);p.total+=r;return{p,r}});
  render();
  const over=G.players.some(p=>p.total>=LIMIT);
  const sorted=[...res].sort((a,b)=>a.p.total-b.p.total);
  const minT=sorted[0].p.total,maxT=sorted[sorted.length-1].p.total;
  res.forEach(({p,r})=>log(`${p.name} : +${r} (total ${p.total})`));
  let head;
  if(over){
    const winners=sorted.filter(x=>x.p.total===minT).map(x=>x.p.name);
    head=`<h2>🏆 Fin de la partie</h2><p>${winners.length>1?"Égalité ! Vainqueurs : ":"Victoire de "}<b>${winners.map(esc).join(", ")}</b> avec ${minT} tête${minT>1?"s":""} de bœuf.</p>`;
    log(`Victoire : ${winners.join(", ")}`);
    const hw=sorted.filter(x=>x.p.total===minT).some(x=>x.p.type==="human");
    sfx(hw||!humans().length?"win":"lose");
  }else{sfx("round");}
  if(!over)head=`<h2>Fin de la manche ${G.round}</h2><p>Personne n'a atteint ${LIMIT} têtes : on continue.</p>`;
  const rows=sorted.map((x,k)=>`<tr class="${over&&x.p.total===minT?"win":""}${x.p.total>=LIMIT?" lose":""}"><td>${k+1}. ${x.p.type==="ai"?"🤖":"👤"} ${esc(x.p.name)}</td><td class="r">+${x.r}</td><td class="r"><b>${x.p.total}</b></td></tr>`).join("");
  const btns=over
    ?`<button class="btn ghost" id="mNew">Nouvelle configuration</button><button class="btn primary" id="mAgain">Rejouer</button>`
    :`<button class="btn primary" id="mNext">Manche suivante</button>`;
  showModal(`${head}<table><tr><th>Joueur</th><th class="r">Manche</th><th class="r">Total</th></tr>${rows}</table><div class="btns">${btns}</div>`);
  if(over){$("mNew").onclick=()=>{hideModal();quit()};$("mAgain").onclick=()=>{hideModal();startGame()}}
  else $("mNext").onclick=()=>{hideModal();startRound()};
}
function quit(){RUN++;G=null;hideModal();$("game").classList.add("hidden");$("setup").classList.remove("hidden")}

/* ================= Affichage ================= */
function setStatus(h){$("status").innerHTML=h}
function log(t){const li=document.createElement("li");li.textContent=t;$("logList").appendChild(li);$("logList").scrollTop=1e6}
let toastT;
function toast(t){const el=$("toast");el.textContent=t;el.classList.remove("hidden");el.style.animation="none";el.offsetHeight;el.style.animation="";clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add("hidden"),1800*Math.max(SPEED,.7))}
function showModal(h){$("modal").innerHTML=h;$("overlay").classList.remove("hidden")}
function hideModal(){$("overlay").classList.add("hidden")}

function render(){
  if(!G)return;
  const left=Math.max(...G.players.map(p=>p.hand.length));$("roundLbl").textContent=`Manche ${G.round} · tour ${Math.min(10,(G.reveal.length?10:11)-left)}/10`;
  const choosing=!G.reveal.length;
  $("players").innerHTML=G.players.map((p,i)=>{
    const rd=sumHeads(p.pile);
    let st="";
    if(choosing&&G.players[0].hand.length){st=G.choices.has(i)?"✅":(G.active===i?"✋":(p.type==="human"?"⏳":""))}
    return `<div class="chip ${G.active===i||(G.pick&&G.pick.pi===i)?"active":""}">
      <div class="nm">${p.type==="ai"?"🤖":"👤"} ${esc(p.name)}</div>
      <div class="sc"><b>${p.total}</b>${rd?`<span class="rd">+${rd}</span>`:""}</div>
      <div class="bar"><i style="width:${Math.min(100,(p.total+rd)/LIMIT*100)}%"></i></div>
      <span class="st">${st}</span></div>`;
  }).join("");
  $("rows").innerHTML=G.rows.map((r,i)=>{
    let cells="";
    for(let k=0;k<6;k++){
      if(r[k]!==undefined)cells+=cardHTML(r[k],r[k]===G.justPlaced?"pop":"");
      else cells+=k===5?'<div class="slot sixth">6</div>':'<div class="slot"></div>';
    }
    const cls=(G.pick?"pickable ":"")+(G.flash&&G.flash.row===i?G.flash.cls:"");
    const h=sumHeads(r);
    return `<div class="row ${cls}" data-r="${i}"><div class="rowinfo"><b>${h}</b>🐮</div>${cells}</div>`;
  }).join("");
  $("reveal").innerHTML=G.reveal.map(r=>`<div class="rv ${r.state}">${cardHTML(r.c)}<small>${esc(G.players[r.pi].name)}</small></div>`).join("");

  // Main
  const hs=humans();
  let viewer=null;
  if(hs.length===1)viewer=hs[0];else if(G.active!==null)viewer=G.active;
  const hand=$("hand"),pb=$("playBtn");
  if(!hs.length){
    $("handWho").textContent="Partie entre IA";hand.className="hand";hand.innerHTML='<div class="handmsg">Regardez les IA s\'affronter 🍿</div>';pb.classList.add("hidden");
  }else if(viewer===null){
    $("handWho").textContent="Main cachée";hand.className="hand";
    hand.innerHTML=`<div class="handmsg">${G.reveal.length?"Placement des cartes…":"En attente du prochain joueur…"}</div>`;pb.classList.add("hidden");
  }else{
    const p=G.players[viewer],isChoosing=G.active===viewer&&!!G.resolveChoice;
    $("handWho").textContent=`Main de ${p.name}`;
    hand.className="hand"+(isChoosing?" choosing":"");
    const mine=G.choices.get(viewer);
    hand.innerHTML=p.hand.map(c=>cardHTML(c,(c===G.selected?"sel ":"")+(!isChoosing&&c===mine&&!G.reveal.length?"played":""))).join("")||'<div class="handmsg">Plus de cartes</div>';
    pb.classList.toggle("hidden",!isChoosing);pb.disabled=G.selected===null;
    pb.textContent=G.selected!==null?`Jouer le ${G.selected}`:"Choisis une carte";
  }
}
$("hand").addEventListener("click",e=>{
  const c=e.target.closest(".card");if(!c||!G||!G.resolveChoice)return;
  const n=+c.dataset.n;
  if(G.selected===n){sfx("play");G.resolveChoice(n);render();return} // double toucher = jouer
  sfx("select");G.selected=n;render();
});
$("playBtn").onclick=()=>{if(G&&G.resolveChoice&&G.selected!==null){sfx("play");const n=G.selected;G.resolveChoice(n);render()}};
$("rows").addEventListener("click",e=>{
  const r=e.target.closest(".row");if(!r||!G||!G.pick)return;sfx("click");G.pick.resolve(+r.dataset.r);
});

/* ================= Règles ================= */
function showRules(){
  showModal(`<h2>Règles</h2>
  <p><b>But :</b> ramasser le moins de têtes de bœuf possible.</p>
  <p><b>Cartes :</b> 1 à 104. Têtes : finissant par 5 → 2 · par 0 → 3 · doubles (11, 22…) → 5 · le 55 → 7 · autres → 1.</p>
  <ul>
    <li>Chacun reçoit 10 cartes, 4 cartes lancent 4 rangées.</li>
    <li>À chaque tour, tout le monde choisit une carte en secret, puis on révèle.</li>
    <li>Les cartes se posent de la plus petite à la plus grande, dans la rangée dont la dernière carte est la plus proche en dessous.</li>
    <li><b>6ᵉ carte :</b> on ramasse les 5 cartes de la rangée, sa carte démarre la rangée.</li>
    <li><b>Carte trop faible :</b> on choisit une rangée à ramasser, sa carte la remplace.</li>
    <li>Après 10 tours, on compte. La partie s'arrête dès qu'un joueur atteint ${LIMIT} têtes ; le plus bas score gagne.</li>
  </ul>
  <p style="font-size:.88rem;color:#5b6b60">Astuce : touche une carte pour la sélectionner, touche-la à nouveau (ou le bouton) pour la jouer.</p>
  <div class="btns"><button class="btn primary" id="rOk">Compris</button></div>`);
  $("rOk").onclick=hideModal;
}
$("rulesBtn1").onclick=()=>{LIMIT=+$("limit").value;showRules()};
$("rulesBtn2").onclick=()=>{
  // si un écran de passage est ouvert on ne l'écrase pas
  if(!$("overlay").classList.contains("hidden"))return;showRules();
};
$("quitBtn").onclick=()=>{
  showModal(`<h2>Quitter la partie ?</h2><p>La partie en cours sera perdue.</p><div class="btns"><button class="btn ghost" id="qNo">Annuler</button><button class="btn" id="qYes">Quitter</button></div>`);
  $("qNo").onclick=hideModal;$("qYes").onclick=quit;
};
$("startBtn").onclick=startGame;

loadSetup();renderSetup();updateAudioBtns();
</script>
