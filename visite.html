<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Visite du séjour</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eee;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .top{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
  .top .t{font-size:15px;font-weight:600;opacity:.9;text-shadow:0 1px 3px #000}
  .top .h{font-size:12px;opacity:.65;margin-top:2px;text-shadow:0 1px 3px #000}
  .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .btns button{border:0;border-radius:999px;padding:8px 12px;font-size:13px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #joy{position:fixed;left:24px;bottom:calc(28px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55)}
  #lookHint{position:fixed;right:24px;bottom:calc(60px + env(safe-area-inset-bottom));font-size:12px;opacity:.6;text-align:right;pointer-events:none;text-shadow:0 1px 3px #000}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
  #label{position:fixed;left:50%;top:calc(50% + 16px);transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;display:none;pointer-events:none}
  #map{position:fixed;right:12px;bottom:calc(110px + env(safe-area-inset-bottom));width:150px;height:66px;border-radius:8px;background:rgba(0,0,0,.4);pointer-events:none}
  @media (hover:hover) and (pointer:fine){ #joy{display:none} }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div><div class="t">Visite du séjour</div><div class="h" id="help">Joystick pour marcher · glisse à droite pour regarder</div></div>
  <div class="btns"><button id="sit">S'asseoir</button><button id="reset">Départ</button><button id="mood">Ambiance : soir</button></div>
</div>
<div id="cross"></div><div id="label"></div>
<canvas id="map" width="300" height="132"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="lookHint">Glisse ici<br>pour regarder</div>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1a20);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 100);
camera.rotation.order = 'YXZ';
// ---------- dimensions ----------
const L = 9.0, W = 3.8, H = 2.5;          // x: longueur, z: largeur
const X0=-L/2, X1=L/2, Z0=-W/2, Z1=W/2;  // Z0 = mur TV/miroir (nord), Z1 = mur canapé/vitrine (sud)

// ---------- matériaux ----------
const M = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:o.r??0.75, metalness:o.m??0, ...o.extra});
const wallMat = M(0xf1efec,{r:0.95});
const oak = M(0xd9b77a,{r:0.6});
const oakDark = M(0xc49a58,{r:0.6});
const white = M(0xf4f4f2,{r:0.6});
const black = M(0x1d1d20,{r:0.5});
const leather = M(0x232326,{r:0.45});
const glass = new THREE.MeshStandardMaterial({color:0x223044,roughness:0.08,metalness:0.2,transparent:true,opacity:0.55});
const mirrorMat = new THREE.MeshStandardMaterial({color:0xcfd8de,roughness:0.05,metalness:0.9});
const lime = M(0xc4d630,{r:0.95});
const blue = M(0x2e4f9c,{r:0.8});
const teal = M(0x1d5f86,{r:0.9});
const plantMat = M(0x2f6a33,{r:0.8});
const plantMat2 = M(0x4f8a3c,{r:0.8});
const potMat = M(0xffffff,{r:0.5});
const metal = M(0x8a8a8a,{r:0.4,m:0.6});
const rattan = M(0xc9a771,{r:0.9});

const pickables = [];
function named(obj, name){ obj.userData.name = name; obj.traverse(o=>{ if(o.isMesh){ o.userData.name = name; pickables.push(o);} }); return obj; }

function box(w,h,d,mat,x,y,z,parent=scene,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, y+h/2, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent=scene,seg=24){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y+h/2,z); m.castShadow=true; m.receiveShadow=true;
  parent.add(m); return m;
}
function group(x=0,y=0,z=0,ry=0){ const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry; scene.add(g); return g; }

// ---------- sol & murs ----------
function tileTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#4a4a4f'; g.fillRect(0,0,256,256);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){ const v=70+Math.random()*12|0; g.fillStyle=`rgb(${v},${v},${v+4})`; g.fillRect(i*128+2,j*128+2,124,124);}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(L/1.2,W/1.2); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(L,W), new THREE.MeshStandardMaterial({map:tileTexture(),roughness:0.55}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

// murs visibles uniquement de l'intérieur (effet maison de poupée)
function wall(w, x, z, ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,H), wallMat);
  m.position.set(x,H/2,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); return m;
}
wall(L,0,Z0,0); wall(L,0,Z1,Math.PI); wall(W,X0,0,Math.PI/2); wall(W,X1,0,-Math.PI/2);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(L,W), M(0xf5f4f2,{r:1}));
ceil.rotation.x=Math.PI/2; ceil.position.y=H; scene.add(ceil);
// corniches
const cornice=M(0xffffff,{r:0.7});
[[L,0.05,0.05,0,Z0+0.025],[L,0.05,0.05,0,Z1-0.025]].forEach(a=>box(a[0],a[1],a[2],cornice,a[3],H-0.05,a[4],scene,false));

// tapis clair côté salon
box(2.6,0.01,2.2,M(0xb9b6ae,{r:1}),2.6,0,0.6,scene,false).receiveShadow=true;

// ---------- utilitaires décor ----------
function door(x, open=false){
  const g=group(x,0,Z0+0.01);
  box(0.92,2.1,0.03,white,0,0,0,g,false);
  if(open){ box(0.8,2.02,0.02,M(0x121214,{r:1}),0,0,0.02,g,false); }
  else { box(0.8,2.02,0.03,M(0xfafaf8,{r:0.6}),0,0,0.02,g,false);
         box(0.6,0.75,0.01,M(0xefefec),0,1.1,0.04,g,false); box(0.6,0.75,0.01,M(0xefefec),0,0.2,0.04,g,false);
         box(0.12,0.02,0.04,metal,0.3,1.0,0.07,g,false); }
  return named(g, open?'Porte (couloir)':'Porte');
}
function plant(x,z,size=1,leafMat=plantMat,potH=0.25,base=0){
  const g=group(x,base,z);
  cyl(0.13*size,0.1*size,potH,potMat,0,0,0,g);
  const n=Math.round(14*size);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+Math.random()*0.4, tilt=0.5+Math.random()*0.6, len=(0.35+Math.random()*0.25)*size;
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.035*size,len,4),leafMat);
    leaf.position.set(Math.cos(a)*0.08*size, potH+len/2*Math.cos(tilt), Math.sin(a)*0.08*size);
    leaf.rotation.set(Math.sin(a)*tilt,0,-Math.cos(a)*tilt); leaf.castShadow=true; g.add(leaf);
  }
  return named(g,'Plante');
}
function palm(x,z){ // grand dracaena
  const g=group(x,0,z);
  cyl(0.2,0.16,0.35,M(0x7c6a55),0,0,0,g);
  const stems=[[0,1.9,0],[0.15,1.5,0.1],[-0.12,1.2,-0.05]];
  stems.forEach(([dx,h,dz])=>{
    const s=cyl(0.025,0.03,h,M(0x6b5a40),dx*0.5,0.35,dz*0.5,g,8); s.rotation.z=dx*0.3; s.rotation.x=dz*0.3;
    for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, t=0.6+Math.random()*0.7, len=0.45+Math.random()*0.2;
      const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.02,len,3),plantMat);
      leaf.position.set(dx+Math.cos(a)*0.12,0.35+h+len*0.3,dz+Math.sin(a)*0.12);
      leaf.rotation.set(Math.sin(a)*t,0,-Math.cos(a)*t); leaf.castShadow=true; g.add(leaf); }
  });
  return named(g,'Dracaena');
}
const fairyBulbs=[];
function fairyLine(a,b,n){
  const geo=new THREE.SphereGeometry(0.018,6,6);
  for(let i=0;i<=n;i++){ const t=i/n; const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffd27a}));
    m.position.lerpVectors(a,b,t); m.position.y+=Math.sin(t*Math.PI*n/3)*0.015; scene.add(m); fairyBulbs.push(m); }
}
function chair(x,z,ry,name='Chaise'){
  const g=group(x,0,z,ry);
  box(0.46,0.06,0.44,black,0,0.44,0,g);
  const back=box(0.46,0.42,0.05,black,0,0.5,-0.22,g); back.rotation.x=-0.12;
  [[-0.18,-0.17],[0.18,-0.17],[-0.18,0.17],[0.18,0.17]].forEach(([a,b])=>{ const l=cyl(0.018,0.014,0.44,oak,a,0,b,g,8); l.rotation.z=a*0.25; l.rotation.x=-b*0.25; });
  return named(g,name);
}

// =========== COIN REPAS (ouest) ===========
// fenêtre 3 vantaux + coffre de volet
{ const g=group(X0+0.01,0,0,Math.PI/2);
  box(2.3,1.45,0.06,white,0,0.85,0,g,false);
  for(let i=0;i<3;i++){ box(0.68,1.28,0.02,glass,-0.74+i*0.74,0.93,0.03,g,false); }
  box(2.4,0.22,0.12,white,0,2.28,0.03,g,false);
  box(2.4,0.04,0.2,white,0,0.82,0.06,g,false);
  named(g,'Fenêtre (coin repas)'); }
// portant à vêtements
{ const g=group(X0+0.45,0,0.1);
  [-0.6,0.6].forEach(z=>cyl(0.015,0.015,1.55,metal,0,0,z,g,8));
  const bar=cyl(0.015,0.015,1.25,metal,0,1.55,0,g,8); bar.rotation.x=Math.PI/2; bar.position.y=1.55;
  [[0xc9802e,-0.3],[0x1d1d1d,0.05],[0x2a2a34,0.35],[0xd28a35,0.5]].forEach(([c,z])=>box(0.08,0.75,0.4,M(c,{r:1}),0,0.78,z,g));
  named(g,'Portant à vêtements'); }
// table ronde
{ const g=group(-2.9,0,-0.05);
  cyl(0.62,0.62,0.04,oak,0,0.72,0,g,48);
  cyl(0.6,0.6,0.005,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.25,roughness:0.05}),0,0.76,0,g,48);
  [[0.4,0.4],[-0.4,0.4],[0.4,-0.4],[-0.4,-0.4]].forEach(([a,b])=>{const l=cyl(0.025,0.02,0.72,oak,a*0.75,0,b*0.75,g,8); l.rotation.z=a*0.15; l.rotation.x=-b*0.15;});
  const tab=box(0.3,0.22,0.02,black,0.05,0.76,-0.15,g); tab.rotation.x=-0.25;
  box(0.25,0.005,0.3,white,0.25,0.76,0.15,g,false);
  named(g,'Table ronde'); }
chair(-2.9,0.75,Math.PI); chair(-2.9,-0.85,0); chair(-3.75,-0.05,Math.PI/2); chair(-2.05,-0.1,-Math.PI/2);
// bureau + chaise
{ const g=group(-2.75,0,Z1-0.33);
  box(1.4,0.04,0.62,oak,0,0.72,0,g);
  box(0.04,0.72,0.6,oak,-0.68,0,0,g); box(0.4,0.72,0.58,oakDark,0.48,0,0,g);
  const lap=box(0.34,0.22,0.02,black,-0.2,0.76,0.15,g); lap.rotation.x=0.2;
  box(0.34,0.01,0.24,M(0x333),-0.2,0.76,0.0,g,false);
  box(0.35,0.06,0.25,M(0x888),0.25,0.76,0.0,g);
  named(g,'Bureau'); }
{ const g=group(-2.85,0,Z1-0.95,Math.PI);
  box(0.5,0.08,0.48,M(0x3a3d44),0,0.46,0,g); const b=box(0.5,0.45,0.06,M(0x3a3d44),0,0.52,-0.23,g); b.rotation.x=-0.15;
  [-0.22,0.22].forEach(x=>box(0.04,0.22,0.4,M(0x3a3d44),x,0.55,0,g));
  [[-0.2,-0.18],[0.2,-0.18],[-0.2,0.18],[0.2,0.18]].forEach(([a,b])=>cyl(0.015,0.015,0.46,black,a,0,b,g,6));
  named(g,'Fauteuil de bureau'); }
// pouf bleu
named(box(0.6,0.4,0.55,teal,-3.85,0,1.15),'Pouf');
// vitrine
{ const g=group(-1.45,0,Z1-0.22);
  box(0.95,2.05,0.42,oak,0,0,0,g);
  box(0.85,0.85,0.02,glass,0,0.12,-0.215,g,false);
  box(0.85,0.95,0.02,glass,0,1.02,-0.215,g,false);
  box(0.85,0.08,0.02,oakDark,0,0.98,-0.22,g,false);
  box(0.3,0.015,0.02,metal,0,1.0,-0.235,g,false);
  [0.45,1.35,1.65].forEach(y=>box(0.85,0.015,0.38,M(0xe7d6b3),0,y,0,g,false));
  for(let i=0;i<5;i++) cyl(0.03,0.03,0.18,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.5}),-0.3+i*0.15,1.37,0,g,10);
  named(g,'Vitrine'); }

// =========== MUR NORD (couloir → TV) ===========
door(-3.6,true);
// tableau blanc sur chevalet
{ const g=group(-2.85,0,Z0+0.3,0.15);
  [-0.3,0.3].forEach(x=>{const l=box(0.04,1.45,0.04,oak,x,0,0,g); l.rotation.z=-x*0.08;});
  box(0.62,0.8,0.02,white,0,0.6,0.03,g); box(0.66,0.04,0.06,oak,0,0.58,0.05,g);
  named(g,'Tableau blanc'); }
// étagère cubes avec jeux de société
{ const g=group(-1.95,0,Z0+0.2);
  const w=1.15,h=1.15,d=0.39; box(w,0.03,d,white,0,0,0,g); box(w,0.03,d,white,0,h-0.03,0,g);
  for(let i=0;i<4;i++) box(0.03,h,d,white,-w/2+0.015+i*(w-0.03)/3,0,0,g);
  [0.37,0.75].forEach(y=>box(w,0.025,d,white,0,y,0,g));
  const cols=[0x2f6d9e,0xb33a2b,0x3c8c55,0xe2b23a,0x6a3f8f,0x1f2d4a,0xd6732b,0x8b2230];
  for(let c=0;c<3;c++)for(let r=0;r<3;r++){
    const cx=-w/2+0.2+c*0.375, cy=0.03+r*0.375;
    if(c===2&&r===1){ box(0.32,0.3,0.32,M(0xc9a23c,{r:0.9}),cx,cy,0.02,g); continue; }
    let x=cx-0.14; while(x<cx+0.12){ const bw=0.04+Math.random()*0.06, bh=0.2+Math.random()*0.12;
      box(bw,bh,0.3,M(cols[Math.random()*cols.length|0],{r:0.7}),x+bw/2,cy,0.02,g); x+=bw+0.005; }
  }
  box(0.22,1.2,0.38,white,w/2+0.12,0,0,g);
  box(0.24,0.18,0.03,oak,-0.3,h,0.08,g); box(0.2,0.14,0.04,M(0x7fa8c8),-0.3,h+0.02,0.075,g,false);
  box(0.14,0.16,0.03,M(0xdddddd),0.0,h,0.1,g);
  named(g,'Étagère jeux de société'); }
plant(-1.25,Z0+0.2,0.9,plantMat2,0.2,1.2);
// miroir + guirlande étoiles
{ const g=group(-1.9,1.55,Z0+0.02);
  box(1.55,0.72,0.04,M(0xd8d4cc),0,0,0,g); box(1.38,0.55,0.02,mirrorMat,0,0.085,0.03,g,false);
  named(g,'Miroir');
  fairyLine(new THREE.Vector3(-2.7,2.2,Z0+0.06),new THREE.Vector3(-1.1,2.25,Z0+0.06),14);
  fairyLine(new THREE.Vector3(-2.7,2.2,Z0+0.06),new THREE.Vector3(-2.75,1.5,Z0+0.06),6);
  fairyLine(new THREE.Vector3(-1.1,2.25,Z0+0.06),new THREE.Vector3(-1.0,1.4,Z0+0.06),7);
}
door(-0.6);
// étoile en papier lumineuse
{ const g=group(0.0,1.95,Z0+0.25);
  const shape=new THREE.Shape(); const n=7;
  for(let i=0;i<n*2;i++){ const r=i%2?0.13:0.32, a=i/(n*2)*Math.PI*2+Math.PI/2; const p=[Math.cos(a)*r,Math.sin(a)*r]; i?shape.lineTo(...p):shape.moveTo(...p);}
  const star=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.12,bevelEnabled:true,bevelThickness:0.05,bevelSize:0.02,bevelSegments:1}),
    new THREE.MeshStandardMaterial({color:0xf3eee2,emissive:0xffe2b0,emissiveIntensity:0.25,roughness:0.9}));
  star.position.z=-0.06; g.add(star);
  named(g,'Étoile en papier');
  fairyLine(new THREE.Vector3(0.38,2.0,Z0+0.05),new THREE.Vector3(0.38,0.9,Z0+0.05),10);
}
door(0.85);
// sellette + plante
{ const g=group(1.55,0,Z0+0.25);
  [[-0.15,-0.15],[0.15,-0.15],[-0.15,0.15],[0.15,0.15]].forEach(([a,b])=>box(0.02,0.48,0.02,black,a,0,b,g));
  box(0.36,0.03,0.36,M(0xe9e3d8),0,0.48,0,g); box(0.36,0.02,0.36,M(0xe9e3d8),0,0.1,0,g);
  named(g,'Sellette'); }
plant(1.55,Z0+0.25,1.25,plantMat,0.25,0.51);
// buffet TV + TV
let tvScreen;
{ const g=group(2.65,0,Z0+0.25);
  box(1.85,0.62,0.45,oak,0,0.08,0,g);
  [-0.46,0.46].forEach(x=>box(0.91,0.2,0.01,oakDark,x,0.52,0.226,g,false));
  [-0.46,0.46].forEach(x=>box(0.91,0.38,0.01,oakDark,x,0.12,0.226,g,false));
  [-0.46,0.46].forEach(x=>box(0.35,0.015,0.02,metal,x,0.6,0.235,g,false));
  [[-0.85,-0.18],[0.85,-0.18],[-0.85,0.18],[0.85,0.18]].forEach(([a,b])=>box(0.04,0.08,0.04,oakDark,a,0,b,g));
  box(1.12,0.66,0.05,black,0.05,0.82,-0.05,g);
  // écran
  const c=document.createElement('canvas'); c.width=256;c.height=144; const x=c.getContext('2d');
  const gr=x.createRadialGradient(128,72,10,128,72,140); gr.addColorStop(0,'#c58aa0'); gr.addColorStop(0.5,'#5a2d73'); gr.addColorStop(1,'#1c0f2c');
  x.fillStyle=gr; x.fillRect(0,0,256,144);

document.getElementById('mood').onclick=e=>{ evening=!evening; applyMood(); e.target.textContent='Ambiance : '+(evening?'soir':'jour'); };

// ================= visite à la première personne =================
const EYE=1.6, R=0.22;
// murs visibles des deux côtés en visite (pas de vue de dessus ici)
scene.traverse(o=>{ if(o.isMesh && o.material===wallMat) o.material.side=THREE.DoubleSide; });
// obstacles : boîtes au sol de chaque meuble (par pièce de meuble)
scene.updateMatrixWorld(true);
const obstacles=[]; const bb=new THREE.Box3();
scene.traverse(o=>{
  if(!o.isMesh || o===floor || o===ceil || o.material===wallMat) return;
  if(fairyBulbs.includes(o)) return;
  bb.setFromObject(o);
  if(bb.max.y<0.12 || bb.min.y>1.4) return;           // tapis, suspensions, objets muraux hauts
  const sx=bb.max.x-bb.min.x, sz=bb.max.z-bb.min.z;
  if(sx>L*0.8) return;
  obstacles.push({x0:bb.min.x,x1:bb.max.x,z0:bb.min.z,z1:bb.max.z});
});
function blocked(x,z){
  if(x<X0+R||x>X1-R||z<Z0+R||z>Z1-R) return true;
  for(const b of obstacles){ const cx=Math.max(b.x0,Math.min(x,b.x1)), cz=Math.max(b.z0,Math.min(z,b.z1));
    if((x-cx)**2+(z-cz)**2<R*R) return true; }
  return false;
}
const player={x:3.3,z:0.0,yaw:Math.PI/2+0.1,pitch:-0.08,seated:false,bob:0};
const START={...player};
const SEAT={x:0.55,z:0.95,yaw:-0.69,pitch:-0.05};

// clavier
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});
// joystick
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let joyId=null, joyV={x:0,y:0};
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);e.stopPropagation();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e);});
const endJoy=e=>{if(e.pointerId!==joyId)return;joyId=null;joyV={x:0,y:0};knob.style.transform='';};
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy),max=r.width/2-10; if(m>max){dx*=max/m;dy*=max/m;}
  knob.style.transform=`translate(${dx}px,${dy}px)`; joyV={x:dx/max,y:dy/max}; if(player.seated) standUp();}
// regarder (glisser)
let lookId=null,last=null,downAt=null;
canvas.addEventListener('pointerdown',e=>{lookId=e.pointerId;last=[e.clientX,e.clientY];downAt=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{ if(e.pointerId!==lookId)return; const k=e.pointerType==='mouse'?0.004:0.006;
  player.yaw-=(e.clientX-last[0])*k; player.pitch-=(e.clientY-last[1])*k;
  player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch)); last=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup',e=>{ if(e.pointerId!==lookId)return; lookId=null;
  if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<6) showName(e.clientX,e.clientY); });
canvas.addEventListener('wheel',e=>{camera.fov=Math.max(35,Math.min(90,camera.fov+e.deltaY*0.03));camera.updateProjectionMatrix();},{passive:true});

// nom de l'objet touché
const ray=new THREE.Raycaster(), lab=document.getElementById('label'); let labT;
function showName(x,y){ ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);
  const h=ray.intersectObjects(pickables,false)[0]; if(!h) return;
  lab.textContent=h.object.userData.name; lab.style.display='block'; clearTimeout(labT); labT=setTimeout(()=>lab.style.display='none',1600); }

function standUp(){ player.seated=false; }
document.getElementById('sit').onclick=()=>{ Object.assign(player,SEAT,{seated:true}); };
document.getElementById('reset').onclick=()=>{ Object.assign(player,START,{seated:false}); };
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  document.getElementById('help').textContent='ZQSD / flèches pour marcher · glisse la souris pour regarder · Maj pour courir';
  document.getElementById('lookHint').style.display='none';
}

// mini-plan
const map=document.getElementById('map'), mc=map.getContext('2d');
function drawMap(){ const W2=map.width,H2=map.height,s=W2/L; mc.clearRect(0,0,W2,H2);
  mc.fillStyle='rgba(255,255,255,.25)'; obstacles.forEach(b=>mc.fillRect((b.x0-X0)*s,(b.z0-Z0)*s,(b.x1-b.x0)*s,(b.z1-b.z0)*s));
  mc.strokeStyle='rgba(255,255,255,.6)'; mc.lineWidth=2; mc.strokeRect(1,1,W2-2,H2-2);
  const px=(player.x-X0)*s, pz=(player.z-Z0)*s; const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw);
  mc.fillStyle='rgba(243,197,107,.35)'; mc.beginPath(); mc.moveTo(px,pz);
  mc.arc(px,pz,30,Math.atan2(fz,fx)-0.6,Math.atan2(fz,fx)+0.6); mc.fill();
  mc.fillStyle='#f3c56b'; mc.beginPath(); mc.arc(px,pz,5,0,Math.PI*2); mc.fill(); }

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05), el=clock.elapsedTime;
  let f=0,s=0;
  if(keys.KeyW||keys.KeyZ||keys.ArrowUp) f+=1; if(keys.KeyS||keys.ArrowDown) f-=1;
  if(keys.KeyA||keys.KeyQ) s-=1; if(keys.KeyD) s+=1;
  if(keys.ArrowLeft) player.yaw+=1.8*dt; if(keys.ArrowRight) player.yaw-=1.8*dt;
  f-=joyV.y; s+=joyV.x;
  const mag=Math.hypot(f,s);
  if(mag>0.05){
    if(player.seated) standUp();
    const sp=(keys.ShiftLeft||keys.ShiftRight?2.6:1.4)*Math.min(1,mag)/Math.max(1,mag)*dt;
    const fx=-Math.sin(player.yaw), fz=-Math.cos(player.yaw), rx=Math.cos(player.yaw), rz=-Math.sin(player.yaw);
    const dx=(fx*f+rx*s)*sp, dz=(fz*f+rz*s)*sp;
    if(!blocked(player.x+dx,player.z+dz)){player.x+=dx;player.z+=dz;}
    else if(!blocked(player.x+dx,player.z)) player.x+=dx;
    else if(!blocked(player.x,player.z+dz)) player.z+=dz;
    player.bob+=dt*9*Math.min(1,mag);
  }
  const eye=player.seated?1.05:EYE+Math.sin(player.bob)*0.025;
  camera.position.set(player.x,eye,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  if(evening) tvGlow.intensity=1.0+Math.sin(el*2.3)*0.25+Math.sin(el*5.1)*0.1;
  renderer.render(scene,camera); drawMap();
});
