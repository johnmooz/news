<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwantum</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#5b2a86; --bleu:#2fa4dc; --rouge:#d8262c; --jaune:#f3b600;
    --board:#b9d99a; --board-dark:#9cc47a; --cream:#f4f1df; --ink:#2b2b2b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:#e9efe3;color:var(--ink);min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#fff;border-bottom:3px solid var(--board-dark)}
  h1{margin:0;font-weight:600;font-size:28px;color:#4d7a2e;font-style:italic;letter-spacing:.5px}
  .btn{font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:#4d7a2e;color:#fff;box-shadow:0 3px 0 #2f4f1b;transition:transform .08s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2f4f1b}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.light{background:#fff;color:#4d7a2e;box-shadow:0 3px 0 #c9d7bd;border:2px solid #c9d7bd}
  .btn.danger{background:#c0392b;box-shadow:0 3px 0 #7d2219}
  main{max-width:1100px;margin:0 auto;padding:18px}

  /* Setup */
  .setup{max-width:480px;margin:40px auto;background:#fff;border-radius:18px;padding:26px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .setup h2{margin-top:0}
  .setup label{display:block;margin:12px 0 4px;font-weight:500}
  .setup input,.setup select{font-family:inherit;font-size:16px;width:100%;padding:9px 12px;border:2px solid #d5dccd;border-radius:10px}

  /* Layout */
  .game{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  @media(max-width:900px){.game{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  .panel h3{margin:0 0 10px;font-weight:600}

  /* Dice */
  .dice{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:68px;margin:6px 0 14px}
  .die{width:60px;height:60px;border-radius:13px;background:#fff;border:1px solid #ddd;
       box-shadow:inset -4px -5px 0 #e4e4e4,0 4px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
  .die .pip{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:26px;font-weight:600}
  .die.white .pip{color:#111;font-size:32px}
  .die.white{outline:3px solid #333;outline-offset:-3px}
  .die.rolling{animation:shake .45s ease-in-out}
  @keyframes shake{0%{transform:rotate(0)}20%{transform:rotate(-18deg) translateY(-6px)}45%{transform:rotate(14deg)}70%{transform:rotate(-8deg) translateY(-3px)}100%{transform:rotate(0)}}
  .placeholder{color:#999;align-self:center}

  .sums{display:grid;gap:6px;margin-bottom:12px}
  .sum{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:10px;color:#fff;font-weight:500}
  .sum.off{opacity:.35}
  .sum b{font-size:20px}

  .turnbox{display:flex;flex-direction:column;gap:8px}
  .msg{font-size:14px;color:#555;min-height:20px}

  /* Sheet */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{font-family:inherit;border:2px solid #c9d7bd;background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:15px}
  .tab.active{background:#4d7a2e;color:#fff;border-color:#4d7a2e}
  .tab.cur::after{content:" 🎲"}
  .tab.rename{width:150px;outline:none;border-color:#4d7a2e}
  .tab.pencil{border-style:dashed;color:#4d7a2e;background:transparent}
  .sheet{background:var(--board);border-radius:16px;padding:16px;position:relative;box-shadow:0 6px 0 #d9d4bd,0 8px 18px rgba(0,0,0,.12)}
  .sheet-top{display:grid;grid-template-columns:1fr auto;gap:16px}
  .row{display:grid;grid-template-columns:repeat(6,1fr);border-radius:9px;padding:5px;margin-bottom:10px;gap:0;border:2px solid rgba(0,0,0,.25)}
  .cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(0,0,0,.25);position:relative}
  .cell:last-child{border-right:none}
  .cell:nth-child(5)::before{content:"";position:absolute;left:-3px;top:18%;bottom:18%;width:5px;background:#fff;border-radius:3px}
  .circle{width:78%;height:78%;border-radius:50%;background:#f4f4f8;display:flex;align-items:center;justify-content:center;
          font-size:clamp(16px,3.2vw,28px);font-weight:500;color:#222;font-family:'Fredoka',cursive}
  .cell.cand .circle{background:#fff;outline:4px dashed #222;outline-offset:-2px;color:#888;cursor:pointer;animation:pulse 1s infinite}
  .cell.cand .circle:hover{color:#222;background:#fffbe0}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .arrow{font-size:12px;color:rgba(255,255,255,.85);text-align:center}
  .pen{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:4px}
  .pen .skull{font-size:24px;color:#c0392b;font-weight:700;margin-bottom:4px}
  .pbox{display:flex;align-items:center;gap:6px;font-size:18px}
  .pbox span.b{width:34px;height:34px;border:2px solid #555;border-radius:6px;background:#dfe3ea;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c0392b;font-weight:700}
  .brand{font-style:italic;font-size:26px;color:#fff;text-align:right;margin-top:8px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
  .bottom{background:var(--cream);margin:6px -16px -16px;padding:14px 16px;border-radius:0 0 16px 16px;display:grid;
          grid-template-columns:repeat(6,1fr) auto 1.8fr;gap:10px;align-items:center}
  .bcell{aspect-ratio:1/1;border:2px solid #777;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;
         font-size:clamp(16px,3vw,26px);font-weight:500}
  .eq{font-size:26px;color:#666}
  .total{height:100%;border:2px solid #777;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600}
  .readonly .cell.cand .circle{animation:none}

  .scores table{width:100%;border-collapse:collapse}
  .scores td{padding:5px 4px;border-bottom:1px solid #eee}
  .scores td:last-child{text-align:right;font-weight:600}

  details.rules{margin-top:16px}
  details.rules summary{cursor:pointer;font-weight:600}
  details.rules li{margin:4px 0;font-size:15px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
  .modal{background:#fff;border-radius:18px;padding:26px;min-width:300px;max-width:92vw;text-align:center}
  .modal h2{margin-top:0}
  .modal ol{text-align:left;font-size:18px}

  /* Menu */
  .menu{max-width:760px;margin:40px auto;text-align:center}
  .menu h2{font-size:30px;font-weight:600;margin:0 0 6px}
  .menu p.sub{color:#666;margin:0 0 26px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
  .card{background:#fff;border:3px solid transparent;border-radius:20px;padding:26px 22px;cursor:pointer;text-align:left;
        box-shadow:0 6px 20px rgba(0,0,0,.08);font-family:inherit;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px);border-color:var(--board-dark)}
  .card .ico{font-size:44px}
  .card h3{margin:8px 0 6px;font-size:22px;font-weight:600;color:#4d7a2e}
  .card p{margin:0;color:#555;font-size:15px;line-height:1.4}
  .resume{margin-top:22px}

  /* Saisie manuelle */
  .cell.edit .circle{background:#fff;outline:3px dashed rgba(0,0,0,.55);outline-offset:-2px;cursor:pointer;color:#aaa;font-size:clamp(11px,1.6vw,14px)}
  .cell.edit .circle:hover{background:#fffbe0}
  .circle input{width:80%;border:none;background:transparent;text-align:center;font-family:inherit;font-size:clamp(16px,3.2vw,28px);font-weight:500;outline:none;-moz-appearance:textfield}
  .circle input::-webkit-outer-spin-button,.circle input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .cell.typing .circle{background:#fff;outline:4px solid #222;outline-offset:-2px}
  .sheetmode .pbox span.b{cursor:pointer}
  .sheetmode .pbox span.b:hover{background:#f3d9d6}
  .msg.err{color:#c0392b;font-weight:500}
  .stack{display:flex;flex-direction:column;gap:8px}
  .setdice{gap:6px}
  .dslot{display:flex;flex-direction:column;align-items:center;gap:5px}
  .dbtn{border:none;background:none;padding:0;cursor:pointer;transition:transform .1s}
  .dbtn:hover{transform:translateY(-2px) rotate(-4deg)}
  .dbtn:active{transform:scale(.92)}
  .setdice .die{width:52px;height:52px}
  .setdice .die .pip{width:38px;height:38px;font-size:22px}
  .setdice .die.white .pip{font-size:28px}
  .dlabel{font-size:12px;color:#888;height:22px;line-height:22px}
  .sumr{display:flex;align-items:center;gap:8px}
  .ins{font-family:inherit;font-size:13px;font-weight:600;border:none;border-radius:8px;padding:4px 9px;background:#fff;color:#333;cursor:pointer}
  .ins:hover{background:#fffbe0}

  /* Réseau */
  .netcode{font-size:52px;font-weight:700;letter-spacing:10px;color:#4d7a2e;text-align:center;margin:6px 0 4px}
  .lobby ul{list-style:none;padding:0;margin:8px 0 18px}
  .lobby li{padding:8px 12px;border-radius:10px;background:#f1f5ec;margin-bottom:6px;display:flex;justify-content:space-between}
  .notice{background:#fff4d6;border:2px solid #f3b600;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
  .netbadge{display:inline-block;background:#4d7a2e;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;margin-left:6px;vertical-align:middle}
  .tab.gone{opacity:.45;text-decoration:line-through}
  .card small{display:block;margin-top:8px;color:#4d7a2e;font-weight:500}
</style>
</head>
<body>
<header>
  <h1>Qwantum</h1>
  <button class="btn light" id="menuBtn">Menu</button>
</header>
<main id="app"></main>

<script>
const COLORS = [
  {id:'violet', name:'Violet', hex:'#5b2a86'},
  {id:'bleu',   name:'Bleu',   hex:'#2fa4dc'},
  {id:'rouge',  name:'Rouge',  hex:'#d8262c'},
  {id:'jaune',  name:'Jaune',  hex:'#f3b600'}
];
// Faces réelles des 6 dés colorés : [chiffre, couleur]. R rouge, V violet, B bleu, J jaune.
// Chaque couleur apparaît sur 9 faces sur 36 : même chance pour les 4 couleurs.
const CI = {V:0, B:1, R:2, J:3};
const DICE_FACES = [
  '1R 2J 3R 3V 4B 4J',
  '1J 2V 3B 5J 6V 6R',
  '2B 2V 3R 4J 5V 6B',
  '1V 2B 3V 4B 5R 6J',
  '1R 1B 4R 5J 5B 6V',
  '1J 2R 3J 4V 5B 6R'
].map(line => line.split(' ').map(f => ({v:+f[0], c:CI[f[1]]})));
const face = (die, f) => ({f, v:DICE_FACES[die][f].v, c:DICE_FACES[die][f].c});
const MIN_SUM = 2;  // 1 + 1 au minimum
const MAX_SUM = 6 + DICE_FACES.reduce((a,d)=>a+Math.max(...d.map(x=>x.v)),0); // 6 + plus grande face de chaque dé
const MAX_PLAYERS = 5;

let S = null;          // partie en cours
let screen = 'menu';   // 'menu' | 'setup' | 'game'
let setupMode = 'solo';
let editRow = null;    // mode feuille : ligne en cours de saisie
let renaming = null;   // joueur en cours de renommage
let sheetErr = '';
let lastRaw = '';
const cleanText = x => String(x ?? '').replace(/[<>&"]/g, '').slice(0, 160);
const cleanName = (x, i) => cleanText(x).trim().slice(0, 20) || `Joueur ${i+1}`;
const $ = s => document.querySelector(s);
const app = $('#app');

function save(){
  if (isNet()){ if (NET && NET.role === 'host') broadcast(); return; }
  try{ localStorage.setItem('qwantum', JSON.stringify(S)); }catch(e){}
}
function load(){ try{ return JSON.parse(localStorage.getItem('qwantum')); }catch(e){ return null; } }
function rememberName(n){ try{ localStorage.setItem('qwantum-name', n); }catch(e){} }
function lastName(){ try{ return localStorage.getItem('qwantum-name') || ''; }catch(e){ return ''; } }
const emptyRows = () => [0,1,2,3].map(()=>Array(6).fill(null));
function newGame(mode, names, extra){
  S = Object.assign({ mode,
        players: names.map(name=>({name, rows:emptyRows(), pen:0})),
        cur:0, view:0, dice:null, phase:'roll', usedColor:null, wrote:[], done:[], history:[],
        over:false, msg:'', rollN:0 }, extra||{});
  editRow = null; sheetErr = ''; renaming = null;
}

/* =================== Réseau (capacité « room » de la page claude.ai) =================== */
let roomP = null;      // promesse de la salle principale
let NET = null;        // {role:'host'|'guest', code, room, unsub:[], seen:{}, seq, myPeer, name}
let netNotice = '';
let localView = 0, lastCurSeen = null, shownRoll = null, netModalHidden = false;
const isNet = () => !!(S && S.mode === 'net');

function getRoom(){
  if (!roomP){
    roomP = (typeof claude !== 'undefined' && claude && typeof claude.use === 'function')
      ? claude.use('room').catch(()=>null) : Promise.resolve(null);
  }
  return roomP;
}
function genCode(){
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
}
async function connectRoom(code){
  const lobby = await getRoom();
  if (!lobby) throw new Error('unavailable');
  return lobby.join('qwantum-' + code.toLowerCase());
}
function myIndex(){
  if (!isNet() || !NET) return -1;
  if (NET.role === 'host') return 0;
  return NET.myPeer ? S.players.findIndex(p=>p.peer===NET.myPeer) : -1;
}
function leaveNet(){
  if (NET){
    (NET.unsub||[]).forEach(u=>{ try{u();}catch(e){} });
    try{ NET.room.leave(); }catch(e){}
    clearTimeout(NET.timer);
  }
  NET = null; netNotice = ''; netModalHidden = false;
  if (isNet()) S = null;
}

/* ----- Hôte : garde l'état de la partie et le partage dans sa présence ----- */
function packState(){
  return { code:S.code, mode:'net',
    players:S.players.map(p=>({name:p.name, peer:p.peer, rows:p.rows, pen:p.pen, gone:!!p.gone})),
    cur:S.cur, dice:S.dice, phase:S.phase, usedColor:S.usedColor, wrote:S.wrote, done:S.done,
    over:S.over, msg:S.msg, rollN:S.rollN };
}
function broadcast(){
  if (!NET || !NET.room) return;
  NET.room.presence({role:'host', st:packState()}).catch(()=>{});
}
async function hostGame(name){
  const code = genCode();
  leaveNet();
  let room;
  try{ room = await connectRoom(code); }
  catch(e){ netNotice = "Impossible d'ouvrir une partie en réseau ici."; render(); return; }
  NET = {role:'host', code, room, unsub:[], seen:{}};
  newGame('net', [name], {code, phase:'lobby'});
  S.players[0].peer = 'host';
  localView = 0; lastCurSeen = null;
  NET.unsub.push(room.onPeers(hostOnPeers));
  screen = 'game'; save(); render();
}
function hostOnPeers(ch){
  if (!isNet() || !NET || NET.role !== 'host') return;
  let changed = false;
  for (const p of ch.peers){
    if (p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (pr.role !== 'player') continue;
    let i = S.players.findIndex(q=>q.peer===p.peer);
    if (i === -1 && S.phase === 'lobby' && S.players.length < MAX_PLAYERS){
      S.players.push({name:cleanName(pr.name, S.players.length), peer:p.peer, rows:emptyRows(), pen:0});
      i = S.players.length - 1; changed = true;
    }
    if (i === -1) continue;
    const nm = cleanName(pr.name, i);
    if (nm !== S.players[i].name){ S.players[i].name = nm; changed = true; }
    const a = pr.act;
    if (a && typeof a === 'object' && Number.isInteger(a.n) && a.n > (NET.seen[p.peer]||0)){
      NET.seen[p.peer] = a.n;
      applyAction(i, a);
    }
  }
  for (const p of ch.left){
    const i = S.players.findIndex(q=>q.peer===p.peer);
    if (i <= 0) continue;
    if (S.phase === 'lobby') S.players.splice(i, 1);
    else { S.players[i].gone = true; S.msg = `${S.players[i].name} a quitté la partie.`; handleGone(); }
    changed = true;
  }
  if (changed){ save(); render(); }
}
function handleGone(){
  if (S.phase === 'lobby' || S.over) return;
  if (S.players[S.cur].gone && (S.phase === 'roll' || S.phase === 'active')) advanceTurn();
  else checkAutoEnd();
}

/* ----- Invité : reçoit l'état de l'hôte et lui envoie ses actions ----- */
async function joinGame(code, name){
  leaveNet(); S = null;
  let room;
  try{ room = await connectRoom(code); }
  catch(e){ netNotice = "Impossible de rejoindre une partie en réseau ici."; render(); return; }
  NET = {role:'guest', code, room, unsub:[], seq:0, myPeer:null, name};
  netNotice = ''; localView = 0; lastCurSeen = null;
  room.presence({role:'player', name}).catch(()=>{});
  NET.unsub.push(room.onPeers(guestOnPeers));
  NET.timer = setTimeout(()=>{ if (NET && NET.role==='guest' && !S){ netNotice = `Aucune partie trouvée avec le code ${code}. Vérifie le code avec l'hôte.`; render(); } }, 7000);
  screen = 'game'; render();
}
const int = (x, lo, hi, d) => Number.isInteger(x) && x >= lo && x <= hi ? x : d;
function sanitize(st){
  const players = (Array.isArray(st.players) ? st.players : []).slice(0, MAX_PLAYERS).map((p,i)=>({
    name: cleanName(p && p.name, i), peer: String(p && p.peer || '').slice(0, 64), gone: !!(p && p.gone),
    pen: int(p && p.pen, 0, 5, 0),
    rows: [0,1,2,3].map(r=>[0,1,2,3,4,5].map(k=>{ const v = p && p.rows && p.rows[r] && p.rows[r][k]; return Number.isInteger(v) ? v : null; }))
  }));
  const d = st.dice;
  const dice = d && typeof d === 'object' ? {
    white: int(d.white, 1, 6, 1),
    colored: [0,1,2,3,4,5].map(i=>{ const c = d.colored && d.colored[i]; return face(i, int(c && c.f, 0, 5, 0)); })
  } : null;
  const ints = a => Array.isArray(a) ? a.filter(x=>Number.isInteger(x)).slice(0, 10) : [];
  return { mode:'net', code: cleanText(st.code).slice(0, 8), players,
    cur: int(st.cur, 0, Math.max(0, players.length-1), 0), dice,
    phase: ['lobby','roll','active','others'].includes(st.phase) ? st.phase : 'lobby',
    usedColor: int(st.usedColor, 0, 3, null), wrote: ints(st.wrote), done: ints(st.done),
    over: !!st.over, msg: cleanText(st.msg), rollN: int(st.rollN, 0, 1e9, 0), history: [], view: 0 };
}
function guestOnPeers(ch){
  if (!NET || NET.role !== 'guest') return;
  const me = ch.peers.find(p=>p.sameTab); if (me) NET.myPeer = me.peer;
  const host = ch.peers.find(p=>!p.sameTab && p.presence && p.presence.role==='host' && p.presence.st);
  if (!host){
    if (S && !S.over){ netNotice = "L'hôte a quitté la partie : elle ne peut pas continuer."; render(); }
    return;
  }
  const wasOver = S && S.over;
  S = sanitize(host.presence.st);
  if (S.over && !wasOver) netModalHidden = false;
  if (S.phase !== 'lobby' && myIndex() === -1) netNotice = 'La partie a déjà commencé : tu la regardes sans jouer.';
  else netNotice = '';
  if (screen === 'game') render();
}
function sendAct(a){
  NET.seq++;
  NET.room.presence({act:Object.assign({}, a, {n:NET.seq})}).catch(()=>{});
}

/* =================== Actions de jeu (communes aux modes à dés) =================== */
// pi : joueur qui agit (null = cet appareil joue pour tout le monde)
function act(a){
  if (isNet()){
    if (myIndex() === -1) return;
    if (NET.role === 'guest'){ sendAct(a); return; }
    applyAction(0, a); return;
  }
  applyAction(null, a);
}
function applyAction(pi, a){
  if (!S || S.over) return;
  if (a.t === 'roll'){ if (pi === null || pi === S.cur) roll(); }
  else if (a.t === 'write'){ const r = a.r; if (Number.isInteger(r) && r >= 0 && r < 4) write(pi === null ? S.view : pi, r); }
  else if (a.t === 'pass'){
    if (pi === null || pi === S.cur){ passActive(); return; }
    if (S.phase === 'others' && !S.wrote.includes(pi) && !S.done.includes(pi)){
      S.done.push(pi); S.msg = `${S.players[pi].name} n'inscrit rien ce tour-ci.`;
      save(); render(); checkAutoEnd();
    }
  }
  else if (a.t === 'next'){ if (pi === null || pi === S.cur) endTurn(); }
}
function othersPending(){
  return S.players.map((p,i)=>i).filter(i=>i!==S.cur && !S.players[i].gone && !S.wrote.includes(i) && !S.done.includes(i));
}
function checkAutoEnd(){
  if (isNet() && S.phase === 'others' && !othersPending().length) endTurn();
}

/* ---------- Menu ---------- */
function renderMenu(){
  const canResume = (S && !S.over && S.mode !== 'net') || (NET && (S || NET.role==='guest'));
  const resumeLabel = NET ? 'partie en réseau' : S && S.mode==='sheet' ? 'feuille de score' : 'jeu automatique';
  const card = (mode, ico, title, txt, note) => `
      <button class="card" data-mode="${mode}">
        <div class="ico">${ico}</div><h3>${title}</h3><p>${txt}</p>${note?`<small>${note}</small>`:''}
      </button>`;
  app.innerHTML = `
  <div class="menu">
    <h2>Comment veux-tu jouer ?</h2>
    <p class="sub">Choisis un mode pour commencer une partie.</p>
    <div class="cards">
      ${card('solo','👤','Solo','Tu joues seul : la page lance les dés et tu cherches le meilleur score.')}
      ${card('local','👥','Même appareil','2 à 5 joueurs autour du même écran, chacun son tour.')}
      ${card('host','📡','Réseau – héberger','Crée une partie et donne son code aux autres joueurs, chacun sur son appareil.')}
      ${card('join','🔗','Réseau – rejoindre','Tape le code donné par l’hôte pour jouer depuis ton appareil.')}
      ${card('sheet','📝','Feuille de score','Tu joues avec tes vrais dés et tu notes les chiffres. La feuille vérifie les règles.')}
    </div>
    ${canResume ? `<div class="resume"><button class="btn light" id="resume">Reprendre la ${resumeLabel}</button></div>` : ''}
  </div>`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ setupMode=b.dataset.mode; netNotice=''; screen='setup'; render(); });
  const r = $('#resume'); if (r) r.onclick = ()=>{ screen='game'; render(); };
}

/* ---------- Mise en place ---------- */
function renderSetup(){
  const m = setupMode;
  const titles = {solo:'👤 Solo', local:'👥 Même appareil', sheet:'📝 Feuille de score',
                  host:'📡 Réseau – héberger', join:'🔗 Réseau – rejoindre'};
  const net = m === 'host' || m === 'join';
  let body = '';
  if (m === 'solo' || net){
    body = `<label>Ton nom</label><input id="myName" maxlength="20" value="${cleanName(lastName(), 0)}">`;
    if (m === 'join') body += `<label>Code de la partie</label><input id="code" maxlength="6" placeholder="ex. 7KQ2" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-size:22px">`;
    if (net) body += `<div class="msg" id="netInfo" style="margin-top:12px">Vérification de la connexion…</div>`;
  } else {
    const opts = m === 'local' ? [2,3,4,5] : [1,2,3,4,5];
    body = `<label>Nombre de joueurs</label>
      <select id="np">${opts.map(n=>`<option ${n==2?'selected':''}>${n}</option>`).join('')}</select>
      <div id="names"></div>`;
  }
  app.innerHTML = `
  <div class="setup">
    <h2>${titles[m]}</h2>
    ${netNotice ? `<div class="notice">${netNotice}</div>` : ''}
    ${body}
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn light" id="back">◀ Retour</button>
      <button class="btn" id="start" ${net?'disabled':''}>${m==='host'?'Créer la partie':m==='join'?'Rejoindre':'Commencer'}</button>
    </div>
  </div>`;
  if ($('#np')){
    const drawNames = () => {
      const n = +$('#np').value;
      $('#names').innerHTML = Array.from({length:n},(_,i)=>
        `<label>Joueur ${i+1}</label><input value="Joueur ${i+1}" maxlength="20" data-i="${i}">`).join('');
    };
    $('#np').onchange = drawNames; drawNames();
  }
  $('#back').onclick = ()=>{ netNotice=''; screen='menu'; render(); };
  if (net){
    getRoom().then(r=>{
      const info = $('#netInfo'); if (!info) return;
      if (r){ info.textContent = m==='host' ? 'Prêt : un code sera créé pour les autres joueurs.' : 'Prêt : tape le code de l’hôte.'; $('#start').disabled = false; }
      else info.innerHTML = '<span class="msg err">Le jeu en réseau marche seulement sur la page Qwantum publiée sur claude.ai, ouverte par des personnes avec qui elle est partagée et connectées à leur compte.</span>';
    });
  }
  $('#start').onclick = () => {
    if (m === 'solo' || net){
      const name = cleanName($('#myName').value, 0); rememberName(name);
      if (m === 'solo'){ leaveNet(); newGame('auto', [name]); screen='game'; save(); render(); return; }
      if (m === 'host'){ $('#start').disabled = true; hostGame(name); return; }
      const code = cleanText($('#code').value).toUpperCase().replace(/[^A-Z0-9]/g,'');
      if (code.length < 3){ $('#netInfo').innerHTML = '<span class="msg err">Tape le code donné par l’hôte.</span>'; return; }
      $('#start').disabled = true; joinGame(code, name); return;
    }
    leaveNet();
    const names = [...document.querySelectorAll('#names input')].map((x,i)=>cleanName(x.value, i));
    newGame(m === 'local' ? 'auto' : 'sheet', names);
    screen = 'game'; save(); render();
  };
}

/* ---------- Calculs communs ---------- */
function columnValue(p, j){
  const col = p.rows.map(r=>r[j]);
  if (col.some(v=>v===null)) return null;
  return [...col].sort((a,b)=>b-a)[2]; // 3e plus grand
}
const penaltyTotal = n => n*(n+1)/2; // -1 -2 -3 -4 -5
function score(p){
  let s = 0;
  for (let j=0;j<6;j++){ const v=columnValue(p,j); if(v!==null) s+=v; }
  return s - penaltyTotal(p.pen);
}
// Règle d'ordre : cases 1 à 4 croissantes, cases 5 et 6 décroissantes
function fitsOrder(row, k, s){
  if (k === 0) return true;
  const prev = row[k-1];
  return k <= 3 ? s > prev : s < prev;
}
function ruleText(row, k){
  if (k === 0) return `de ${MIN_SUM} à ${MAX_SUM}`;
  return k <= 3 ? `plus grand que ${row[k-1]}` : `plus petit que ${row[k-1]}`;
}
function isFinished(){
  return S.players.some(q => q.pen>=5 || [0,1,2,3,4,5].every(j=>columnValue(q,j)!==null));
}

/* ---------- Jeu avec dés automatiques (solo, même appareil, réseau) ---------- */
function colorSum(c){
  if (!S.dice) return null;
  const ds = S.dice.colored.filter(d=>d.c===c);
  if (!ds.length) return null;
  return { total: S.dice.white + ds.reduce((a,d)=>a+d.v,0), parts:[S.dice.white, ...ds.map(d=>d.v)] };
}
function candidate(pi, r){
  if (!S.dice || S.over || pi < 0) return null;
  if (pi === S.cur){ if (S.phase !== 'active') return null; }
  else if (S.phase !== 'others' || S.wrote.includes(pi) || S.done.includes(pi) || r === S.usedColor) return null;
  const p = S.players[pi];
  const sum = colorSum(r); if (!sum) return null;
  const row = p.rows[r];
  const k = row.indexOf(null); if (k === -1) return null;
  if (!fitsOrder(row, k, sum.total)) return null;
  return {k, s:sum.total};
}
function randomDice(){
  return { white: 1+Math.floor(Math.random()*6),
    colored: Array.from({length:6},(_,d)=>face(d, Math.floor(Math.random()*6))) };
}
function startTurnWith(dice){
  S.dice = dice; S.phase = 'active'; S.usedColor = null; S.wrote = []; S.done = []; S.msg = '';
  S.rollN = (S.rollN||0) + 1;
}
function roll(){
  if (S.phase !== 'roll' || S.over) return;
  const final = randomDice();
  if (isNet()){ startTurnWith(final); save(); render(); return; }   // l'animation est jouée chez chacun
  let t = 0;
  const tick = setInterval(()=>{
    S.dice = randomDice(); renderDice(true);
    if (++t > 6){ clearInterval(tick); startTurnWith(final); shownRoll = S.rollN; save(); render(); }
  }, 70);
}
function write(pi, r){
  const p = S.players[pi];
  const c = candidate(pi, r); if (!c) return;
  p.rows[r][c.k] = c.s; S.wrote.push(pi);
  S.msg = `${p.name} inscrit ${c.s} dans la ligne ${COLORS[r].name.toLowerCase()}.`;
  if (pi === S.cur){ S.usedColor = r; goOthers(); return; }
  save(); render(); checkAutoEnd();
}
function passActive(){
  if (S.phase !== 'active') return;
  const p = S.players[S.cur];
  p.pen = Math.min(5, p.pen+1); S.usedColor = null;
  S.msg = `${p.name} n'inscrit rien et prend une pénalité (−${p.pen}).`;
  goOthers();
}
function goOthers(){
  if (S.players.length === 1 || (isNet() && !othersPending().length)){ endTurn(); return; }
  S.phase = 'others';
  if (!isNet()) S.view = (S.cur+1) % S.players.length;
  save(); render();
}
function endTurn(){
  if (!S.dice) return;
  advanceTurn();
}
function advanceTurn(){
  if (isFinished()){ S.over = true; save(); render(); return; }
  let n = S.cur;
  for (let k=0; k<S.players.length; k++){ n = (n+1) % S.players.length; if (!S.players[n].gone) break; }
  S.cur = n; S.view = n;
  S.dice = null; S.phase = 'roll'; S.usedColor = null; S.wrote = []; S.done = [];
  save(); render();
}

/* ---------- Mode feuille de score ---------- */
function sheetCommit(raw){
  if (raw === '' ) { editRow = null; sheetErr=''; render(); return; }
  lastRaw = raw;
  sheetWrite(editRow, Number(raw));
}
// Inscrit s dans la prochaine case de la ligne r du joueur affiché, si les règles le permettent
function sheetWrite(r, s){
  const p = S.players[S.view], row = p.rows[r];
  const k = row.indexOf(null);
  if (k === -1){ sheetErr = `La ligne ${COLORS[r].name.toLowerCase()} est déjà complète.`; render(); return; }
  if (!Number.isInteger(s) || s < MIN_SUM || s > MAX_SUM){
    sheetErr = `Le nombre doit être un entier de ${MIN_SUM} à ${MAX_SUM}.`; render(); return;
  }
  if (!fitsOrder(row, k, s)){
    sheetErr = `Impossible d'écrire ${s} en ${COLORS[r].name.toLowerCase()} : le nombre doit être ${ruleText(row,k)} (${k<=3?'croissant jusqu’à la 4ᵉ case':'décroissant après la barre'}).`;
    render(); return;
  }
  row[k] = s; S.history.push({pi:S.view, r, k});
  editRow = null; sheetErr = '';
  S.msg = `${p.name} : ${s} inscrit en ${COLORS[r].name.toLowerCase()}.`;
  if (isFinished()) S.over = true;
  save(); render();
}
// Dés réglables à la main : clic = face suivante du dé
function defaultSheetDice(){ return { white:1, colored:Array.from({length:6},(_,d)=>face(d,0)) }; }
function cycleDie(i){
  const D = S.sheetDice;
  if (i < 0) D.white = D.white % 6 + 1;
  else D.colored[i] = face(i, (D.colored[i].f + 1) % 6);
  sheetErr=''; save(); render();
}
function sheetSum(c){
  const D = S.sheetDice, ds = D.colored.filter(d=>d.c===c);
  if (!ds.length) return null;
  return { total: D.white + ds.reduce((a,d)=>a+d.v,0), parts:[D.white, ...ds.map(d=>d.v)] };
}
function sheetUndo(){
  const h = S.history.pop(); if (!h) return;
  const p = S.players[h.pi];
  if (h.type === 'pen') p.pen = h.prev; else p.rows[h.r][h.k] = null;
  S.view = h.pi; S.over = false; S.dismissed = false; editRow = null; sheetErr = '';
  S.msg = 'Dernière action annulée.';
  save(); render();
}
function sheetPenalty(n){
  const p = S.players[S.view];
  const prev = p.pen;
  p.pen = p.pen >= n ? n-1 : n;
  S.history.push({type:'pen', pi:S.view, prev});
  S.msg = `${p.name} : ${p.pen} pénalité${p.pen>1?'s':''} (−${penaltyTotal(p.pen)}).`;
  if (isFinished()) S.over = true;
  save(); render();
}

/* ---------- Rendu ---------- */
function dieHTML(v, colorHex, white, rolling){
  return `<div class="die ${white?'white':''} ${rolling?'rolling':''}">
    <div class="pip" style="${white?'':`background:${colorHex}`}">${v}${v===6&&white?'.':''}</div></div>`;
}
function renderDice(rolling){
  const el = $('#dice'); if (!el) return;
  if (!S.dice){ el.innerHTML = `<span class="placeholder">${S.phase==='roll'?'Les dés n’ont pas encore été lancés.':''}</span>`; return; }
  el.innerHTML = dieHTML(S.dice.white,null,true,rolling) +
    S.dice.colored.map(d=>dieHTML(d.v, COLORS[d.c].hex, false, rolling)).join('');
}

function sheetHTML(view, cellFn, readonly, extraCls){
  const rowsHTML = view.rows.map((row,r)=>
    `<div class="row" style="background:${COLORS[r].hex}">${row.map((v,k)=>cellFn(row,r,v,k)).join('')}</div>`).join('');
  const penHTML = [1,2,3,4,5].map(n=>
    `<div class="pbox">−${n} <span class="b" data-pen="${n}">${view.pen>=n?'✕':''}</span></div>`).join('');
  const bottomHTML = [0,1,2,3,4,5].map(j=>{
    const v = columnValue(view,j);
    return `<div class="bcell">${v!==null?v:''}</div>`;
  }).join('') + `<div class="eq">=</div><div class="total">${score(view)}</div>`;
  return `<div class="sheet ${readonly?'readonly':''} ${extraCls||''}">
      <div class="sheet-top">
        <div>${rowsHTML}</div>
        <div class="pen"><div class="skull">✕</div>${penHTML}<div class="brand">Qwantum</div></div>
      </div>
      <div class="bottom">${bottomHTML}</div>
    </div>`;
}
function viewIndex(){ return isNet() ? localView : S.view; }
function canRename(i){ return !isNet() || i === myIndex(); }
function tabsHTML(markCur){
  const vi = viewIndex(), me = myIndex();
  return `<div class="tabs">${S.players.map((p,i)=> renaming===i
    ? `<input class="tab rename" id="renameInput" maxlength="20" aria-label="Nouveau nom">`
    : `<button class="tab ${i===vi?'active':''} ${markCur&&i===S.cur?'cur':''} ${p.gone?'gone':''}" data-view="${i}" ${canRename(i)?'title="Double-clic pour renommer"':''}>${p.name}${isNet()&&i===me?' (toi)':''}${S.mode!=='sheet'&&S.dice&&S.wrote.includes(i)?' ✓':''}</button>`).join('')}
    ${renaming===null && canRename(vi) ? `<button class="tab pencil" id="renameBtn">✎ Renommer</button>`:''}</div>`;
}
function scoresHTML(){
  return `<div class="scores" style="margin-top:14px"><h3>Scores</h3>
    <table>${S.players.map(p=>`<tr><td>${p.name}${p.gone?' (parti)':''}</td><td>${score(p)}</td></tr>`).join('')}</table></div>`;
}
function rulesHTML(){
  const common = `
    <li>Dans chaque ligne, les cases se remplissent de gauche à droite. Cases 1 à 4 : nombres <b>croissants</b>. Après la barre (cases 5 et 6) : nombres <b>décroissants</b>.</li>
    <li>Quand une colonne a ses 4 nombres, la case blanche du bas reçoit le <b>3ᵉ nombre</b> de la colonne, classée du plus grand au plus petit.</li>
    <li>Pénalités : −1, −2, −3, −4, −5, elles s'additionnent.</li>
    <li>La partie se termine quand un joueur a rempli ses 6 cases du bas ou coché sa 5ᵉ pénalité. Score = somme des cases du bas − pénalités.</li>`;
  const auto = `
    <li>7 dés : un dé blanc (1 à 6) et six dés de couleur, chacun avec ses 6 faces réelles (chiffre + couleur).</li>
    <li>Le joueur en cours inscrit dans la ligne d'une couleur : <b>dé blanc + tous les dés de cette couleur</b>. S'il n'inscrit rien, il prend une pénalité.</li>
    <li>Ensuite, chaque autre joueur peut inscrire <b>une</b> des combinaisons restantes (plusieurs joueurs peuvent prendre la même), sans pénalité s'il n'inscrit rien.</li>`;
  const sheet = `
    <li>Règle les 7 dés comme tes vrais dés : clic sur un dé = face suivante (blanc de 1 à 6 ; dés de couleur : leurs 6 vraies faces, chiffre et couleur). Les sommes « dé blanc + dés de la couleur » se calculent toutes seules.</li>
    <li>Clique sur « Inscrire » à côté d'une somme, ou sur la case en pointillés d'une ligne pour taper le nombre que tu veux. La feuille refuse un nombre qui ne respecte pas l'ordre.</li>
    <li>Clique sur une case de pénalité pour la cocher, ou de nouveau pour la décocher.</li>`;
  return `<details class="rules"><summary>Rappel des règles</summary><ul>${S.mode==='sheet'?sheet:auto}${common}</ul></details>`;
}

function renderNetWaiting(){
  app.innerHTML = `<div class="setup lobby">
    <h2>🔗 Partie ${NET.code}</h2>
    ${netNotice ? `<div class="notice">${netNotice}</div>` : '<p class="msg">Recherche de la partie…</p>'}
    <button class="btn light" id="leaveNet">Quitter</button></div>`;
  $('#leaveNet').onclick = ()=>{ leaveNet(); screen='menu'; render(); };
}
function renderLobby(){
  const host = NET && NET.role === 'host', me = myIndex();
  app.innerHTML = `<div class="setup lobby">
    <h2>📡 Salle d'attente</h2>
    ${netNotice ? `<div class="notice">${netNotice}</div>` : ''}
    <div class="msg">Code de la partie</div>
    <div class="netcode">${S.code}</div>
    <p class="msg">Les autres joueurs ouvrent cette même page Qwantum, choisissent « Réseau – rejoindre » et tapent ce code.</p>
    <h3>Joueurs (${S.players.length}/${MAX_PLAYERS})</h3>
    <ul>${S.players.map((p,i)=>`<li><span>${p.name}${i===me?' (toi)':''}</span><span>${i===0?'hôte':''}</span></li>`).join('')}</ul>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn light" id="leaveNet">Quitter</button>
      ${host ? `<button class="btn" id="startNet">Lancer la partie</button>` : '<span class="msg" style="align-self:center">En attente du lancement par l’hôte…</span>'}
    </div></div>`;
  $('#leaveNet').onclick = ()=>{ leaveNet(); screen='menu'; render(); };
  const st = $('#startNet');
  if (st) st.onclick = ()=>{ S.phase = 'roll'; S.cur = 0; S.msg = ''; save(); render(); };
}

function renderAuto(){
  if (S.phase === 'lobby'){ renderLobby(); return; }
  const net = isNet(), me = myIndex();
  if (net && lastCurSeen !== S.cur){ lastCurSeen = S.cur; localView = me >= 0 ? me : S.cur; }
  if (localView >= S.players.length) localView = 0;
  const vi = viewIndex();
  const cur = S.players[S.cur], view = S.players[vi];
  const mine = i => !net || i === me;

  const canPlayView = mine(vi) && ((vi === S.cur && S.phase === 'active') ||
                      (vi !== S.cur && S.phase === 'others' && !S.wrote.includes(vi) && !S.done.includes(vi)));

  const sums = COLORS.map((c,i)=>{
    const s = colorSum(i);
    const taken = S.phase === 'others' && S.usedColor === i;
    return `<div class="sum ${s && !taken?'':'off'}" style="background:${c.hex}">
      <span>${c.name}${s?` : ${s.parts.join(' + ')}`:''}${taken?` — prise par ${cur.name}`:''}</span><b>${s?s.total:'–'}</b></div>`;
  }).join('');

  const cands = [0,1,2,3].map(r=>candidate(vi, r));
  const cellFn = (row,r,v,k)=>{
    const cand = cands[r]; const isC = canPlayView && cand && cand.k===k;
    return `<div class="cell ${isC?'cand':''}" ${isC?`data-write="${r}"`:''}>
      <div class="circle">${v!==null?v:(isC?cand.s:'')}</div></div>`;
  };
  const anyCand = cands.some(Boolean);
  const pending = S.phase === 'others' ? othersPending() : [];

  // Boutons
  let rollOk = S.phase === 'roll' && !S.over && mine(S.cur);
  let endLabel = 'Tour suivant ▶', endCls = '', endOk = false, endAct = 'next';
  if (S.phase === 'active'){
    endLabel = `Ne rien inscrire (pénalité −${Math.min(5,cur.pen+1)})`; endCls = 'danger'; endAct = 'pass';
    endOk = mine(S.cur) && !S.over;
  } else if (S.phase === 'others'){
    if (!net) endOk = !S.over;
    else if (me === S.cur){ endOk = !S.over; endLabel = pending.length ? 'Tour suivant ▶ (sans attendre)' : 'Tour suivant ▶'; }
    else if (pending.includes(me)){ endOk = true; endLabel = 'Je n’inscris rien ce tour-ci'; endAct = 'pass'; endCls = 'light'; }
  }

  // Message d'aide
  let hint = S.msg ? S.msg + ' ' : '';
  const names = ids => ids.map(i=>S.players[i].name).join(', ');
  if (!net){
    if (S.phase === 'roll') hint += `${cur.name}, lance les dés.`;
    else if (S.phase === 'active'){
      hint += S.view !== S.cur ? `Retourne sur la feuille de ${cur.name} pour jouer.`
            : anyCand ? 'Clique sur une case en pointillés pour inscrire la somme.'
            : 'Aucune case possible : tu dois prendre une pénalité.';
    } else if (S.phase === 'others'){
      hint += `Les autres joueurs peuvent inscrire une combinaison restante (sans pénalité s'ils ne le font pas). `;
      if (S.view === S.cur) hint += 'Choisis un autre joueur dans les onglets.';
      else if (S.wrote.includes(S.view)) hint += `${view.name} a déjà inscrit ce tour-ci.`;
      else if (!anyCand) hint += `Aucune case possible pour ${view.name}.`;
      else hint += `${view.name} : clique sur une case en pointillés.`;
      if (!pending.length) hint += ' Tout le monde a joué : passe au tour suivant.';
    }
  } else {
    const myCands = me >= 0 ? [0,1,2,3].some(r=>candidate(me, r)) : false;
    if (S.phase === 'roll') hint += me === S.cur ? 'À toi : lance les dés !' : `${cur.name} va lancer les dés…`;
    else if (S.phase === 'active'){
      hint += me === S.cur ? (myCands ? 'Clique sur une case en pointillés de ta feuille pour inscrire la somme.' : 'Aucune case possible : tu dois prendre une pénalité.')
                           : `${cur.name} choisit sa combinaison…`;
    } else if (S.phase === 'others'){
      if (me === S.cur) hint += `Les autres joueurs choisissent : ${names(pending) || 'personne'}.`;
      else if (pending.includes(me)) hint += myCands ? 'Tu peux inscrire une combinaison restante sur ta feuille, ou ne rien inscrire.'
                                                     : 'Aucune case possible pour toi : clique sur « Je n’inscris rien ».';
      else hint += pending.length ? `En attente de : ${names(pending)}.` : '';
    }
    if (me >= 0 && vi !== me && canPlayView === false && (S.phase !== 'roll')) hint += ' (Tu regardes la feuille d’un autre joueur.)';
  }

  const rolling = S.dice && S.rollN !== shownRoll; shownRoll = S.rollN;
  const hideModal = net ? netModalHidden : S.dismissed;
  const title = net ? `Partie ${S.code}<span class="netbadge">réseau</span>` : (S.players.length === 1 ? 'Partie solo' : `Tour de ${cur.name}`);

  app.innerHTML = `
  <div class="game">
    <section>${netNotice?`<div class="notice">${netNotice}</div>`:''}${tabsHTML(true)}${sheetHTML(view, cellFn, !canPlayView)}${rulesHTML()}</section>
    <aside class="panel">
      <h3>${title}</h3>
      ${net ? `<div class="msg">Tour de <b>${cur.name}</b>${S.cur===me?' (toi)':''}</div>` : ''}
      <div class="dice" id="dice"></div>
      <div class="sums">${sums}</div>
      <div class="turnbox">
        <button class="btn" id="rollBtn" ${rollOk?'':'disabled'}>🎲 Lancer les dés</button>
        <button class="btn ${endCls}" id="endBtn" ${endOk?'':'disabled'}>${endLabel}</button>
        <div class="msg">${hint}</div>
      </div>
      ${scoresHTML()}
      ${net ? `<div style="margin-top:12px"><button class="btn light" id="leaveNet">Quitter la partie</button></div>` : ''}
    </aside>
  </div>
  ${S.over && !hideModal ? endModal() : ''}`;

  renderDice(rolling);
  document.querySelectorAll('[data-write]').forEach(el=>el.onclick=()=>act({t:'write', r:+el.dataset.write}));
  $('#rollBtn').onclick = ()=>act({t:'roll'});
  $('#endBtn').onclick = ()=>act({t:endAct});
  const ln = $('#leaveNet'); if (ln) ln.onclick = ()=>{ leaveNet(); screen='menu'; render(); };
}

function renderSheet(){
  const view = S.players[S.view];
  const cellFn = (row,r,v,k)=>{
    if (v !== null) return `<div class="cell"><div class="circle">${v}</div></div>`;
    const next = row.indexOf(null) === k;
    if (!next || S.over) return `<div class="cell"><div class="circle"></div></div>`;
    if (editRow === r) return `<div class="cell typing"><div class="circle">
        <input type="number" inputmode="numeric" min="${MIN_SUM}" max="${MAX_SUM}" id="cellInput" aria-label="Nombre ${COLORS[r].name}"></div></div>`;
    const prev = k===0 ? '' : (k<=3 ? `&gt; ${row[k-1]}` : `&lt; ${row[k-1]}`);
    return `<div class="cell edit" data-edit="${r}"><div class="circle">${prev}</div></div>`;
  };
  const msg = sheetErr ? `<div class="msg err">${sheetErr}</div>` : `<div class="msg">${S.msg||''}</div>`;
  const row = editRow!==null ? view.rows[editRow] : null;
  const help = editRow!==null
    ? `Ligne ${COLORS[editRow].name.toLowerCase()} : tape un nombre ${ruleText(row, row.indexOf(null))}, puis Entrée (Échap pour annuler).`
    : `Clique sur une case en pointillés pour écrire un nombre, ou sur « Inscrire » à côté d'une somme.`;

  if (!S.sheetDice || S.sheetDice.colored.some(d=>d.f===undefined)) S.sheetDice = defaultSheetDice();
  const D = S.sheetDice;
  const diceHTML = `<div class="dice setdice">
      <div class="dslot"><button class="dbtn" data-die="-1" title="Chiffre suivant">${dieHTML(D.white,null,true,false)}</button><span class="dlabel">blanc</span></div>
      ${D.colored.map((d,i)=>`<div class="dslot">
        <button class="dbtn" data-die="${i}" title="Face suivante">${dieHTML(d.v, COLORS[d.c].hex, false, false)}</button><span class="dlabel">dé ${i+1}</span></div>`).join('')}
    </div>`;
  const sumsHTML = COLORS.map((c,i)=>{
    const s = sheetSum(i);
    return `<div class="sum ${s?'':'off'}" style="background:${c.hex}">
      <span>${c.name}${s?` : ${s.parts.join(' + ')}`:''}</span>
      <span class="sumr"><b>${s?s.total:'–'}</b>${s&&!S.over?`<button class="ins" data-ins="${i}">Inscrire</button>`:''}</span></div>`;
  }).join('');

  app.innerHTML = `
  <div class="game">
    <section>${tabsHTML(false)}${sheetHTML(view, cellFn, false, 'sheetmode')}${rulesHTML()}</section>
    <aside class="panel">
      <h3>🎲 Tes dés</h3>
      <div class="msg">Clique sur un dé pour passer à sa face suivante (chiffre et couleur des vrais dés).</div>
      ${diceHTML}
      <div class="sums">${sumsHTML}</div>
      <h3>📝 Feuille de ${view.name}</h3>
      <div class="stack">
        <div class="msg">${help}</div>
        ${msg}
        <button class="btn light" id="undoBtn" ${S.history.length?'':'disabled'}>↶ Annuler la dernière action</button>
        <button class="btn" id="finishBtn" ${S.over?'disabled':''}>🏁 Terminer la partie</button>
      </div>
      ${scoresHTML()}
    </aside>
  </div>
  ${S.over && !S.dismissed ? endModal() : ''}`;

  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{ editRow=+el.dataset.edit; sheetErr=''; render(); });
  document.querySelectorAll('[data-pen]').forEach(el=>el.onclick=()=>{ if(!S.over) sheetPenalty(+el.dataset.pen); });
  document.querySelectorAll('[data-die]').forEach(el=>el.onclick=()=>cycleDie(+el.dataset.die));
  document.querySelectorAll('[data-ins]').forEach(el=>el.onclick=()=>{ editRow=null; const r=+el.dataset.ins; sheetWrite(r, sheetSum(r).total); });
  const inp = $('#cellInput');
  if (inp){
    inp.value = sheetErr ? lastRaw : ''; inp.focus();
    inp.onkeydown = e=>{
      if (e.key === 'Enter'){ e.preventDefault(); sheetCommit(inp.value.trim()); }
      else if (e.key === 'Escape'){ editRow=null; sheetErr=''; render(); }
    };
    inp.onblur = ()=>{ setTimeout(()=>{ if ($('#cellInput')===inp) sheetCommit(inp.value.trim()); }, 120); };
  }
  $('#undoBtn').onclick = sheetUndo;
  $('#finishBtn').onclick = ()=>{ S.over = true; save(); render(); };
}

function render(){
  if (screen === 'setup'){ renderSetup(); return; }
  if (screen === 'game' && !S && NET && NET.role === 'guest'){ renderNetWaiting(); return; }
  if (screen === 'menu' || !S){ screen='menu'; renderMenu(); return; }
  if (S.mode === 'sheet') renderSheet(); else renderAuto();
  if (S.phase === 'lobby') return;
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.onclick=()=>{
      const i = +el.dataset.view;
      if (isNet()) localView = i; else { S.view = i; S.msg=''; }
      editRow=null; sheetErr=''; render();
    };
    el.ondblclick=()=>{ const i = +el.dataset.view; if (!canRename(i)) return; if (isNet()) localView = i; else S.view = i; startRename(); };
  });
  const rb = $('#renameBtn'); if (rb) rb.onclick = startRename;
  const ri = $('#renameInput');
  if (ri){
    const i = renaming; ri.value = S.players[i].name; ri.focus(); ri.select();
    const done = ok => {
      if (renaming!==i) return;
      renaming = null;
      if (ok){
        const nm = cleanName(ri.value, i);
        if (isNet() && NET.role === 'guest'){ NET.room.presence({name:nm}).catch(()=>{}); rememberName(nm); }
        else { S.players[i].name = nm; if (isNet()) rememberName(nm); save(); }
      }
      render();
    };
    ri.onkeydown = e=>{ if (e.key==='Enter'){ e.preventDefault(); done(true); } else if (e.key==='Escape') done(false); };
    ri.onblur = ()=>done(true);
  }
  const again = $('#again');
  if (again) again.onclick = ()=>{
    if (isNet()){            // l'hôte relance avec les mêmes joueurs
      S.players = S.players.filter(p=>!p.gone);
      S.players.forEach(p=>{ p.rows = emptyRows(); p.pen = 0; });
      Object.assign(S, {cur:0, dice:null, phase:'roll', usedColor:null, wrote:[], done:[], over:false, msg:'Nouvelle partie !'});
      save(); render(); return;
    }
    setupMode = S.mode === 'sheet' ? 'sheet' : (S.players.length === 1 ? 'solo' : 'local');
    S = null; save(); screen = 'setup'; render();
  };
  const toMenu = $('#toMenu'); if (toMenu) toMenu.onclick = ()=>{ if (isNet()) leaveNet(); else { S=null; save(); } screen='menu'; render(); };
  const look = $('#look'); if (look) look.onclick = ()=>{ if (isNet()) netModalHidden = true; else { S.dismissed = true; save(); } render(); };
}
function startRename(){ editRow=null; sheetErr=''; renaming = viewIndex(); render(); }
function endModal(){
  const ranked = [...S.players].sort((a,b)=>score(b)-score(a));
  const canAgain = !isNet() || (NET && NET.role === 'host');
  return `<div class="overlay"><div class="modal">
    <h2>🏆 Fin de partie</h2>
    <ol>${ranked.map(p=>`<li><b>${p.name}</b> — ${score(p)} points</li>`).join('')}</ol>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn light" id="look">Voir les feuilles</button>
      <button class="btn light" id="toMenu">${isNet()?'Quitter':'Menu'}</button>
      ${canAgain ? `<button class="btn" id="again">Rejouer</button>` : ''}
    </div>
    ${isNet() && !canAgain ? '<p class="msg">L’hôte peut relancer une partie avec les mêmes joueurs.</p>' : ''}
  </div></div>`;
}

$('#menuBtn').onclick = ()=>{ editRow=null; sheetErr=''; renaming=null; screen='menu'; render(); };
S = load();
if (S && (!S.phase || !S.mode || S.mode === 'net')){ S = null; } // sauvegarde incompatible ou partie réseau
if (S){ if (!S.history) S.history = []; if (!S.done) S.done = []; }
screen = 'menu';
render();
getRoom();   // prépare la connexion réseau en arrière-plan
</script>
</body>
</html>
