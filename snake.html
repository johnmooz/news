<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--panel:#121a33;--line:#24305a;--p1:#4ade80;--txt:#e6ecff;--mut:#8b97c7;--egg:#fff4d6;--heart:#f43f5e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#16204a,#070b17 70%) fixed;color:var(--txt);font-family:Inter,system-ui,sans-serif;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.wrap{width:min(100%,920px,max(300px,calc((100vh - 250px) * 1.38)))}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-bottom:10px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.pl,.center{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pl{display:flex;flex-direction:column;gap:6px;min-width:0;border-left:4px solid var(--c)}
.pl.right{align-items:flex-end;text-align:right;border-left-width:1px;border-right:4px solid var(--c)}
.pl.right .row{flex-direction:row-reverse}
.pl.dead{opacity:.45}
.name{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.name .you{color:var(--mut);font-size:9px}
.hearts{font-size:20px;letter-spacing:2px;line-height:1;color:var(--heart);text-shadow:0 0 8px rgba(244,63,94,.5)}
.hearts .off{color:#2a355f;text-shadow:none}
.row{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.score{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--txt)}
.eggs{display:flex;gap:3px}
.eggs i{width:9px;height:12px;border-radius:50%/60% 60% 40% 40%;background:#2a355f;display:inline-block}
.eggs i.on{background:var(--egg);box-shadow:0 0 6px #ffe9a8}
.hud.compact .pl{padding:6px 10px;gap:4px}
.hud.compact .hearts{font-size:15px}
.hud.compact .score{font-size:11px}
.hud.compact .eggs i{width:7px;height:9px}
.center{text-align:center;min-width:180px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.center .big{font-family:'Press Start 2P',monospace;font-size:16px}
.center .small{font-size:12px;color:var(--mut)}
.stage{position:relative;border-radius:14px;padding:6px;background:linear-gradient(135deg,#3b4a8a,#1b2550);box-shadow:0 20px 60px rgba(0,0,0,.5)}
canvas{display:block;width:100%;height:auto;border-radius:9px;background:#0d142b}
.overlay{position:absolute;inset:6px;border-radius:9px;background:rgba(7,11,23,.9);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:safe center;flex-direction:column;text-align:center;padding:18px;gap:12px;overflow:auto}
.hidden{display:none!important}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(30px,6.5vw,60px);margin:0;color:var(--p1);text-shadow:4px 4px 0 #14532d,0 0 30px rgba(74,222,128,.4);letter-spacing:6px}
h2{font-family:'Press Start 2P',monospace;font-size:clamp(18px,3.5vw,28px);margin:0;color:#fde68a}
.lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{background:#141d3b;border:2px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;cursor:pointer;font:600 13px Inter,sans-serif;min-width:140px;transition:.15s}
.opt small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:3px}
.opt:hover{border-color:#4b5ca6}
.opt.sel{border-color:var(--p1);background:#13301f;box-shadow:0 0 0 3px rgba(74,222,128,.15)}
.fields{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);text-align:left}
.fields input{background:#0d142b;border:2px solid var(--line);border-radius:8px;color:var(--txt);font:600 15px Inter,sans-serif;padding:8px 10px;width:210px;outline:none}
.fields input:focus{border-color:var(--p1)}
.err{color:#fda4af;font-size:13px;min-height:1px;max-width:520px}
.play{font-family:'Press Start 2P',monospace;font-size:13px;background:var(--p1);color:#052e16;border:0;border-radius:10px;padding:13px 22px;cursor:pointer;box-shadow:0 5px 0 #15803d}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #15803d}
.play:disabled{opacity:.5;cursor:wait}
.play.alt{background:#2a355f;color:var(--txt);box-shadow:0 5px 0 #18203d}
.keys{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
kbd{display:inline-block;min-width:24px;padding:3px 6px;border-radius:5px;background:#1e2950;border:1px solid #33427a;border-bottom-width:3px;color:var(--txt);font:600 12px Inter,sans-serif}
.rec{font-size:12px;color:var(--mut);line-height:1.7}
.rec b{color:#fde68a;font-weight:600}
.res{font-size:15px;line-height:1.9}
.res .w{color:#fde68a;font-weight:800}
.newrec{font-family:'Press Start 2P',monospace;font-size:12px;color:#fde68a;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
.addr{font-family:'Press Start 2P',monospace;font-size:clamp(13px,2.4vw,20px);color:#fde68a;background:#0d142b;border:2px dashed #4b5ca6;border-radius:10px;padding:12px 16px;line-height:1.7;user-select:all;-webkit-user-select:all}
.hint{font-size:12px;color:var(--mut);max-width:520px;line-height:1.5}
.plist{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:8px;min-width:min(100%,340px)}
.slot{border:2px solid var(--line);border-radius:10px;padding:10px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;background:#0f1730}
.slot i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.slot.empty{color:#4b5a8f;border-style:dashed;font-weight:400}
.slot.empty i{background:#24305a}
.touch{display:flex;justify-content:space-between;gap:12px;margin-top:12px;user-select:none;-webkit-user-select:none}
.tgroup{display:flex;gap:10px}
.tgroup.ghost{visibility:hidden}
.tbtn{width:74px;height:74px;border-radius:18px;border:2px solid var(--line);background:#141d3b;color:var(--txt);font-size:30px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.tbtn:hover{background:#1a2448}
.tbtn:active,.tbtn.hit{transform:scale(.94);background:#1e2950}
.tbtn small{display:block;font:600 9px Inter,sans-serif;letter-spacing:1px;opacity:.7;margin-top:-2px}
.tbtn.c0{border-color:#2f7a4c;color:var(--p1)}.tbtn.c1{border-color:#2f5a9a;color:#60a5fa}
.tbtn.mid{width:56px;height:56px;font-size:20px;align-self:center}
@media (max-width:620px){.hud{grid-template-columns:1fr 1fr}.center{grid-column:1/-1;order:-1}.hearts{font-size:16px}.plist{grid-template-columns:1fr}.eggs{gap:2px}.eggs i{width:6px;height:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud" id="hud">
    <div class="side" id="hudL"></div>
    <div class="center">
      <div class="big" id="cBig">SNAKE</div>
      <div class="small" id="cSmall">&nbsp;</div>
    </div>
    <div class="side" id="hudR"></div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>

    <!-- MENU -->
    <div class="overlay" id="menu">
      <h1>SNAKE</h1>
      <div>
        <div class="lbl">Partie</div>
        <div class="opts" data-group="play">
          <button class="opt sel" data-v="solo">Solo<small>1 joueur</small></button>
          <button class="opt" data-v="duo">2 joueurs<small>Même clavier, face à face</small></button>
          <button class="opt" data-v="host">Réseau (hôte)<small id="hostNote">Créer une partie · 4 max</small></button>
          <button class="opt" data-v="join">Réseau (rejoindre)<small>Rejoindre une partie</small></button>
        </div>
      </div>
      <div id="modeBox">
        <div class="lbl">Mode de jeu</div>
        <div class="opts" data-group="mode">
          <button class="opt sel" data-v="classic">Classique<small>10 œufs = niveau suivant</small></button>
          <button class="opt" data-v="infinite">Infini<small>Tenez le plus longtemps</small></button>
        </div>
      </div>
      <div class="fields hidden" id="netBox">
        <label>Pseudo<input id="inName" maxlength="12" placeholder="Ton pseudo" autocomplete="off"></label>
        <label id="addrLbl"><span id="addrTxt">Adresse de l'hôte</span><input id="inAddr" placeholder="192.168.1.23:47822" autocomplete="off" inputmode="url"></label>
      </div>
      <div class="opts hidden" id="gameList"></div>
      <div class="err" id="menuErr"></div>
      <button class="play" id="btnPlay">JOUER</button>
      <div class="keys">
        <span><kbd>←</kbd> <kbd>→</kbd> tourner</span>
        <span id="keysP2"><b style="color:#60a5fa">J2</b> <kbd>Q</kbd> <kbd>D</kbd> tourner</span>
        <span><kbd>Espace</kbd> pause</span>
        <span><kbd>Échap</kbd> menu</span>
      </div>
      <div class="rec" id="records"></div>
    </div>

    <!-- SALON RÉSEAU -->
    <div class="overlay hidden" id="lobby">
      <h2>SALON</h2>
      <div id="lobbyHost">
        <div class="lbl" id="lobbyLbl">Adresse à donner aux autres joueurs</div>
        <div class="addr" id="lobbyAddr"></div>
        <p class="hint" id="lobbyHint"></p>
      </div>
      <div class="hint hidden" id="lobbyGuest"></div>
      <div id="lobbyModeHost">
        <div class="opts" data-group="mode">
          <button class="opt sel" data-v="classic">Classique</button>
          <button class="opt" data-v="infinite">Infini</button>
        </div>
      </div>
      <div class="plist" id="lobbyList"></div>
      <div class="err" id="lobbyErr"></div>
      <div class="opts">
        <button class="play" id="btnLaunch">LANCER</button>
        <button class="play alt" id="btnLeave">QUITTER</button>
      </div>
    </div>

    <div class="overlay hidden" id="pause">
      <h2>PAUSE</h2>
      <div class="hint" id="pauseMsg"></div>
      <div class="keys" id="pauseKeys"><span><kbd>Espace</kbd> reprendre</span><span><kbd>Échap</kbd> menu</span></div>
    </div>

    <div class="overlay hidden" id="over">
      <h2>PARTIE TERMINÉE</h2>
      <div class="res" id="result"></div>
      <div class="newrec hidden" id="newrec">NOUVEAU RECORD !</div>
      <div class="hint hidden" id="overWait">En attente de l'hôte…</div>
      <div class="opts">
        <button class="play" id="btnAgain">REJOUER</button>
        <button class="play alt" id="btnBack">MENU</button>
      </div>
    </div>
  </div>

  <div class="touch">
    <div class="tgroup"><button class="tbtn c0" tabindex="-1" data-g="0" data-d="-1" title="Tourner à gauche (←)" aria-label="Tourner à gauche">◀</button><button class="tbtn c0" tabindex="-1" data-g="0" data-d="1" title="Tourner à droite (→)" aria-label="Tourner à droite">▶</button></div>
    <button class="tbtn mid" tabindex="-1" id="tPause" title="Pause (Espace)" aria-label="Pause">❚❚</button>
    <div class="tgroup ghost" id="tP2"><button class="tbtn c1" tabindex="-1" data-g="1" data-d="-1" title="Joueur 2 : tourner à gauche (Q)" aria-label="Joueur 2 gauche">◀</button><button class="tbtn c1" tabindex="-1" data-g="1" data-d="1" title="Joueur 2 : tourner à droite (D)" aria-label="Joueur 2 droite">▶</button></div>
  </div>
</div>

<script>
(()=>{
/* =================== constantes =================== */
const COLS=36, ROWS=26, CELL=24, MID=Math.floor(ROWS/2), MIDX=Math.floor(COLS/2)-1;
const LIVES=5, EGGS_PER_LEVEL=10, RESPAWN_MS=1300, MAXP=4, NET_PORT=47822;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const COLORS=[
  {head:'#86efac',body:'#4ade80',dark:'#166534'},
  {head:'#93c5fd',body:'#60a5fa',dark:'#1e3a8a'},
  {head:'#fdba74',body:'#fb923c',dark:'#9a3412'},
  {head:'#f9a8d4',body:'#f472b6',dark:'#9d174d'}];
// Départs opposés : gauche→droite, droite→gauche, haut→bas, bas→haut
const SPAWNS=[
  {dir:1,head:{x:6,y:MID}},
  {dir:3,head:{x:COLS-7,y:MID}},
  {dir:2,head:{x:MIDX,y:6}},
  {dir:0,head:{x:COLS-1-MIDX,y:ROWS-7}}];

const cv=document.getElementById('cv');
cv.width=COLS*CELL; cv.height=ROWS*CELL;
const ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const key=c=>c.x+','+c.y;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =================== stockage =================== */
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const recKey=(mode,p)=>`snake_${mode}_${p}`;
function getRec(mode,p){const v=parseFloat(load(recKey(mode,p)));return isNaN(v)?0:v}

/* =================== son =================== */
let audio=null;
function ac(){
  if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audio&&audio.state==='suspended')audio.resume().catch(()=>{});
  return audio;
}
function tone(freq,dur,type,vol,when=0){
  const a=ac(); if(!a)return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const playLA=()=>{tone(440,0.45,'triangle',0.32);tone(880,0.25,'sine',0.06)}; // La 440 Hz
const playDeath=()=>{tone(196,0.15,'square',0.1);tone(130.8,0.35,'square',0.1,0.13)};
const playLevel=()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.22,'triangle',0.18,i*0.11));
const playJoin=()=>{tone(660,0.12,'triangle',0.15);tone(990,0.18,'triangle',0.12,0.1)};

/* =================== utilitaires =================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtTime(ms){const t=Math.floor(ms/100);const m=Math.floor(t/600),s=Math.floor(t/10)%60,d=t%10;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

const bg=document.createElement('canvas'); bg.width=cv.width; bg.height=cv.height;
(()=>{const b=bg.getContext('2d');for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){b.fillStyle=(x+y)%2?'#0f1833':'#0d152d';b.fillRect(x*CELL,y*CELL,CELL,CELL)}})();

/* =================== état =================== */
const cfg={play:'solo',mode:'classic'};
let G=null;            // partie en cours (sur l'hôte ou en local) ou copie reçue (client : G.remote)
let NET={role:null};   // null | 'host' | 'client'
let particles=[], screen='menu';

function makeSnake(slot){return{id:slot,pid:slot,name:'',lives:LIVES,score:0,eggs:0,body:[],dir:1,queue:[],alive:false,out:false,left:false,respawnAt:0,outTime:null}}
function spawnOf(slot){
  const S=SPAWNS[slot],[dx,dy]=DIRS[S.dir];
  return{dir:S.dir,cells:[0,1,2].map(i=>({x:S.head.x-dx*i,y:S.head.y-dy*i}))};
}
function occupiedBySnakes(){const o=new Set();for(const s of G.snakes)for(const c of s.body)o.add(key(c));return o}
function place(s){const sp=spawnOf(s.id);s.body=sp.cells.map(c=>({...c}));s.dir=sp.dir;s.queue=[];s.alive=true}
function canRespawn(s){
  const sp=spawnOf(s.id),o=occupiedBySnakes(),[dx,dy]=DIRS[sp.dir],h=sp.cells[0];
  const check=[...sp.cells];for(let i=1;i<=3;i++)check.push({x:h.x+dx*i,y:h.y+dy*i});
  return check.every(c=>!o.has(key(c)));
}
function turn(s,d){if(s&&s.alive&&s.queue.length<2)s.queue.push(d)}

/** roster : [{pid,name}] — l'ordre donne la place (couleur + départ) */
function newGame(roster){
  G={state:'banner',banner:'PRÊT ?',bannerSub:null,bannerT:1300,level:1,walls:new Set(),eggs:[],
     snakes:[],clock:0,time:0,acc:0,ev:[],dirty:true};
  roster.slice(0,MAXP).forEach((p,i)=>{const s=makeSnake(i);s.pid=p.pid;s.name=p.name;place(s);G.snakes.push(s)});
  particles=[];fillEggs();buildHud();
}

/* =================== murs symétriques =================== */
function addWalls(level){
  if(level<2)return;
  const rnd=mulberry32(level*7919+13);
  const topBottom=level%2===0;            // niveaux pairs : haut/bas — impairs : gauche/droite
  const pieces=1+Math.floor(level/3);
  const near=c=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(G.walls.has((c.x+dx)+','+(c.y+dy)))return true;return false};
  // couloirs de départ toujours libres (ligne du milieu et colonne du milieu)
  const ok=c=>c.x>=2&&c.x<=COLS-3&&c.y>=2&&c.y<=ROWS-3&&Math.abs(c.y-MID)>1&&!(c.x>=MIDX-1&&c.x<=COLS-MIDX)&&!near(c);
  for(let p=0;p<pieces;p++){
    for(let tries=0;tries<400;tries++){
      const horiz=rnd()<0.5,len=4+Math.floor(rnd()*6);
      const x=2+Math.floor(rnd()*(topBottom?COLS-4:COLS/2-4));
      const y=2+Math.floor(rnd()*(topBottom?MID-4:ROWS-4));
      const cells=[];for(let i=0;i<len;i++)cells.push(horiz?{x:x+i,y}:{x,y:y+i});
      if(!topBottom&&cells.some(c=>c.x>=COLS/2-1))continue;
      const mir=cells.map(c=>topBottom?{x:c.x,y:ROWS-1-c.y}:{x:COLS-1-c.x,y:c.y});
      const all=cells.concat(mir);
      if(all.every(ok)){all.forEach(c=>G.walls.add(key(c)));break}
    }
  }
}

/* =================== œufs =================== */
function fillEggs(){
  const target=Math.max(1,G.snakes.length);
  const occ=occupiedBySnakes();
  let guard=0;
  while(G.eggs.length<target&&guard++<3000){
    const c={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    const k=key(c);
    if(G.walls.has(k)||occ.has(k)||G.eggs.some(e=>e.x===c.x&&e.y===c.y))continue;
    G.eggs.push({...c,born:performance.now()});
  }
}

/* =================== logique de jeu (local / hôte) =================== */
function interval(){
  if(cfg.mode==='classic')return Math.max(60,125-(G.level-1)*7);
  return Math.max(55,125-Math.floor(G.time/20000)*7);
}
function burst(c,color,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=40+Math.random()*120;
    particles.push({x:(c.x+.5)*CELL,y:(c.y+.5)*CELL,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color})}
}
function kill(s){
  const h=s.body[0];
  if(h){burst(h,'#f43f5e',22);G.ev.push({k:'die',x:h.x,y:h.y})}
  s.alive=false;s.body=[];s.queue=[];s.lives--;playDeath();
  if(s.lives<=0){s.out=true;s.outTime=G.time}else s.respawnAt=G.clock+RESPAWN_MS;
}
function step(){
  G.dirty=true;
  const moves=G.snakes.filter(s=>s.alive).map(s=>{
    if(s.queue.length)s.dir=(s.dir+s.queue.shift()+4)%4;
    const h=s.body[0],[dx,dy]=DIRS[s.dir],nh={x:h.x+dx,y:h.y+dy};
    const egg=G.eggs.findIndex(e=>e.x===nh.x&&e.y===nh.y);
    return{s,nh,egg,grow:egg>=0};
  });
  const occ=new Set();
  for(const m of moves){const b=m.s.body,n=m.grow?b.length:b.length-1;for(let i=0;i<n;i++)occ.add(key(b[i]))}
  const dead=new Set();
  for(const m of moves){const{x,y}=m.nh;
    if(x<0||y<0||x>=COLS||y>=ROWS||G.walls.has(key(m.nh))||occ.has(key(m.nh)))dead.add(m.s)}
  for(let i=0;i<moves.length;i++)for(let j=i+1;j<moves.length;j++)
    if(moves[i].nh.x===moves[j].nh.x&&moves[i].nh.y===moves[j].nh.y){dead.add(moves[i].s);dead.add(moves[j].s)}
  const eaten=new Set();let levelWinner=null;
  for(const m of moves){
    if(dead.has(m.s)){kill(m.s);continue}
    m.s.body.unshift(m.nh);
    if(m.grow){
      eaten.add(m.egg);m.s.score+=10;m.s.eggs++;playLA();burst(m.nh,'#fde68a',14);
      G.ev.push({k:'egg',x:m.nh.x,y:m.nh.y});
      if(cfg.mode==='classic'&&m.s.eggs>=EGGS_PER_LEVEL&&!levelWinner)levelWinner=m.s;
    } else m.s.body.pop();
  }
  if(eaten.size){G.eggs=G.eggs.filter((_,i)=>!eaten.has(i));fillEggs()}
  if(G.snakes.every(s=>s.out)){endGame();return}
  if(levelWinner)levelUp(levelWinner);
}
function respawns(){
  for(const s of G.snakes)if(!s.alive&&!s.out&&G.clock>=s.respawnAt&&canRespawn(s)){place(s);G.dirty=true}
}
function levelUp(winner){
  G.level++;
  for(const s of G.snakes){s.eggs=0;if(!s.out)place(s)}
  G.eggs=[];addWalls(G.level);fillEggs();
  G.state='banner';G.banner='NIVEAU '+G.level;
  G.bannerSub=G.snakes.length>1?`${winner.name} a ramassé 10 œufs !`:'Nouveaux murs !';
  G.bannerT=1800;playLevel();G.ev.push({k:'lvl'});G.dirty=true;
}
function playerLabel(s){return `<span style="color:${COLORS[s.id].body}">${esc(s.name)}</span>`}
function resultHTML(){
  const n=G.snakes.length;let html='';
  if(cfg.mode==='classic'){
    html+=`Niveau atteint : <b>${G.level}</b><br>`;
    G.snakes.forEach(s=>html+=`${playerLabel(s)} : ${s.score} pts${s.left?' (parti)':''}<br>`);
    if(n>1){const best=Math.max(...G.snakes.map(s=>s.score)),w=G.snakes.filter(s=>s.score===best);
      html+=w.length>1?'<span class="w">Égalité !</span>':`<span class="w">${esc(w[0].name)} gagne !</span>`}
  }else{
    html+=`Temps tenu : <b>${fmtTime(G.time)}</b><br>`;
    if(n>1){
      G.snakes.forEach(s=>html+=`${playerLabel(s)} : ${fmtTime(s.outTime||0)} · ${s.score} pts${s.left?' (parti)':''}<br>`);
      const best=Math.max(...G.snakes.map(s=>s.outTime||0)),w=G.snakes.filter(s=>(s.outTime||0)===best);
      html+=w.length>1?'<span class="w">Égalité !</span>':`<span class="w">${esc(w[0].name)} a tenu le plus longtemps !</span>`;
    }else html+=`Score : ${G.snakes[0].score} pts`;
  }
  return html;
}
function endGame(){
  G.state='over';
  const local=!NET.role,p=cfg.play==='duo'?2:1;let rec=false;
  if(local){

  }
  if(NET.role==='host'){T.hostSend(snapshot(),true);G.ev=[];T.hostSend({t:'over'})}

}

/* =================== réseau =================== */
// Deux façons de jouer en réseau, avec le même jeu :
//  • « room » : la page web publiée sur claude.ai — les joueurs qui ont la page ouverte
//    se retrouvent par internet grâce à un code de partie ;
//  • « lan »  : SNAKE.exe — partie sur le réseau local, via l'adresse IP de l'hôte.
// L'hôte fait tourner le jeu et diffuse l'état ; les invités n'envoient que leurs virages.
let ROOM=null;           // espace « room » de claude.ai (null hors de la page publiée)
let T=null;              // transport actif
let canHost=false;

function makeSender(urlFn){
  let busy=false,q=[];
  function pump(){
    if(busy||!q.length)return;busy=true;
    const m=q.shift();
    fetch(urlFn(),{method:'POST',body:JSON.stringify(m)}).catch(()=>{}).finally(()=>{busy=false;pump()});
  }
  return{send(m,coalesce){
    const last=q[q.length-1];
    if(coalesce&&last&&last.t===m.t){m.ev=(last.ev||[]).concat(m.ev||[]);q[q.length-1]=m}else q.push(m);
    pump();
  }};
}
function fetchTimeout(url,opt,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{...opt,signal:c.signal}).finally(()=>clearTimeout(t));
}
function cleanName(s){
  s=String(s==null?'':s).replace(/[\u0000-\u001f<>&"'​-‏‪-‮⁠-⁯]/g,'').trim();
  return Array.from(s).slice(0,12).join('')||'Joueur';
}
function snapshot(){
  return{t:'s',st:G.state,banner:G.banner,sub:G.bannerSub,level:G.level,time:Math.round(G.time),clock:Math.round(G.clock),mode:cfg.mode,
    walls:[...G.walls],eggs:G.eggs.map(e=>[e.x,e.y]),
    sn:G.snakes.map(s=>({p:s.pid,n:s.name,b:s.body.flatMap(c=>[c.x,c.y]),d:s.dir,l:s.lives,sc:s.score,eg:s.eggs,a:s.alive,o:s.out,lf:s.left,r:Math.round(s.respawnAt),ot:Math.round(s.outTime||0)})),
    ev:G.ev};
}

/* ---- transport « réseau local » (SNAKE.exe) ---- */
function normAddr(a){
  a=a.trim().replace(/^https?:\/\//i,'').replace(/\/.*$/,'');
  if(a&&!/:\d+$/.test(a)&&!/^\[.*\]$/.test(a))a+=':'+NET_PORT;
  return a;
}
const lanT={
  kind:'lan',
  async host(name){
    const r=await fetchTimeout('/net/listen',{method:'POST'},4000);
    const info=await r.json();
    if(!info.ok)throw new Error(info.err||'listen');
    this.sender=makeSender(()=>'/net/broadcast');
    this.es=new EventSource('/net/host');
    this.es.onmessage=e=>{try{hostMsg(JSON.parse(e.data))}catch(err){}};
    return{addrs:(info.ips||[]).map(ip=>ip+':'+info.port)};
  },
  hostSend(m,coalesce){this.sender.send(m,coalesce)},
  setOpen(v){fetch('/net/open?v='+(v?1:0),{method:'POST'}).catch(()=>{})},
  closeHost(){fetch('/net/close',{method:'POST'}).catch(()=>{});if(this.es)this.es.close();this.es=null},
  async join(name,target){
    const addr=normAddr(target);
    if(!addr)return{err:"Entre l'adresse affichée chez l'hôte (ex. 192.168.1.23:47822)."};
    save('snake_addr',addr);
    const base='http://'+addr;
    let j;
    try{
      const r=await fetchTimeout(base+'/net/join',{method:'POST',body:JSON.stringify({name})},5000);
      j=await r.json();
    }catch(e){return{err:"Impossible de joindre l'hôte. Vérifie l'adresse, que la partie est ouverte et que vous êtes sur le même réseau."}}
    if(j.err)return{err:j.err};
    this.base=base;this.addr=addr;this.tok=j.tok;this.pid=j.id;
    this.sender=makeSender(()=>base+'/net/input');
    const es=new EventSource(`${base}/net/events?id=${j.id}&tok=${j.tok}`);
    this.es=es;
    es.onmessage=e=>{try{clientMsg(JSON.parse(e.data))}catch(err){}};
    es.onerror=()=>{if(this.es===es&&NET.role==='client')lost("Connexion perdue avec l'hôte.")};
    return{id:j.id,where:addr};
  },
  input(d){this.sender.send({id:this.pid,tok:this.tok,d})},
  leave(){
    fetch(this.base+'/net/leave',{method:'POST',body:JSON.stringify({id:this.pid,tok:this.tok})}).catch(()=>{});
    const es=this.es;this.es=null;if(es)es.close();
  }
};

/* ---- transport « room » (page claude.ai, par internet) ---- */
const enc=(x,y)=>(y*COLS+x).toString(36).padStart(2,'0');
function decCells(str){
  const out=[];
  for(let i=0;i+1<str.length;i+=2){const v=parseInt(str.substr(i,2),36);if(v>=0&&v<COLS*ROWS)out.push(v%COLS,Math.floor(v/COLS))}
  return out;
}
function encodeSnap(m){
  return{st:m.st,bn:m.banner||'',sb:m.sub||'',lv:m.level,tm:m.time,ck:m.clock,md:m.mode,
    w:m.walls.map(k=>{const[x,y]=k.split(',');return enc(+x,+y)}).join(''),
    e:m.eggs.map(([x,y])=>enc(x,y)).join(''),
    sn:m.sn.map(s=>{let b='';for(let i=0;i<s.b.length&&i<500;i+=2)b+=enc(s.b[i],s.b[i+1]);
      return[s.p,s.n,b,s.d,s.l,s.sc,s.eg,(s.a?1:0)|(s.o?2:0)|(s.lf?4:0),s.r,s.ot||0]})};
}
function decodeSnap(s,ev){
  const w=decCells(String(s.w||'')),walls=[];for(let i=0;i<w.length;i+=2)walls.push(w[i]+','+w[i+1]);
  const e=decCells(String(s.e||'')),eggs=[];for(let i=0;i<e.length;i+=2)eggs.push([e[i],e[i+1]]);
  return{t:'s',st:['banner','play','pause','over'].includes(s.st)?s.st:'play',banner:String(s.bn||'').slice(0,40),sub:String(s.sb||'').slice(0,80)||null,
    level:+s.lv||1,time:+s.tm||0,clock:+s.ck||0,mode:s.md==='infinite'?'infinite':'classic',walls,eggs,
    sn:(Array.isArray(s.sn)?s.sn:[]).slice(0,MAXP).map(a=>({p:+a[0]||0,n:cleanName(a[1]),b:decCells(String(a[2]||'')),d:(+a[3]|0)&3,
      l:+a[4]||0,sc:+a[5]||0,eg:+a[6]||0,a:!!(a[7]&1),o:!!(a[7]&2),lf:!!(a[7]&4),r:+a[8]||0,ot:+a[9]||0})),ev};
}
const roomT={
  kind:'room',
  async host(name){
    const code=Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
    const nr=await ROOM.join('snake-'+code);
    Object.assign(this,{nr,code,name,open:true,acc:new Map(),seen:new Map(),evId:0,evs:[],ovId:0,
      pres:{r:'h',n:name,ph:'lobby',acc:[],lb:null,s:null,ev:[],ov:null}});
    this.unsub=nr.onPeers(ch=>this.hostPeers(ch));
    this.push();this.advertise();
    return{code};
  },
  push(){if(this.nr)this.nr.presence(this.pres).catch(()=>{})},
  advertise(){
    if(!ROOM)return;
    ROOM.presence({g:this.nr&&NET.role==='host'?{c:this.code,n:this.name,m:cfg.mode,k:(NET.roster||[]).length||1,o:this.open}:null}).catch(()=>{});
  },
  hostPeers(ch){
    for(const p of ch.left){
      const id=this.acc.get(p.peer);
      if(id){this.acc.delete(p.peer);this.seen.delete(p.peer);hostMsg({t:'leave',id});this.syncAcc()}
    }
    for(const p of ch.peers){
      const pr=p.presence||{};
      if(p.isMe||pr.r!=='g')continue;
      let id=this.acc.get(p.peer);
      if(!id&&this.open){
        const used=new Set(this.acc.values());
        for(let i=1;i<MAXP;i++)if(!used.has(i)){id=i;break}
        if(id){this.acc.set(p.peer,id);this.seen.set(p.peer,+pr.k||0);hostMsg({t:'join',id,name:cleanName(pr.n)});this.syncAcc()}
      }
      if(id){ // virages envoyés par l'invité (compteur + derniers virages)
        const k=+pr.k||0,last=this.seen.get(p.peer)||0;
        if(k>last){
          const t=String(pr.t||'').replace(/[^LR]/g,''),n=Math.min(k-last,t.length);
          for(const c of t.slice(t.length-n))hostMsg({t:'in',id,d:c==='R'?1:-1});
          this.seen.set(p.peer,k);
        }
      }
    }
  },
  syncAcc(){this.pres.acc=[...this.acc].map(([peer,id])=>[peer,id]);this.push();this.advertise()},
  hostSend(m){
    const P=this.pres;
    if(m.t==='lobby'){P.ph='lobby';P.lb={pl:m.players.map(p=>[p.pid,p.name]),m:m.mode};P.s=null;P.ov=null;this.advertise()}
    else if(m.t==='s'){
      P.ph='game';
      for(const e of m.ev||[])this.evs.push([++this.evId,e.k,e.x|0,e.y|0]);
      this.evs=this.evs.slice(-10);P.ev=this.evs;P.s=encodeSnap(m);
      if(m.st!=='over')P.ov=null;
    }else if(m.t==='over'){P.ov=++this.ovId}
    this.push();
  },
  setOpen(v){this.open=v;this.advertise()},
  closeHost(){
    if(this.unsub)this.unsub();this.unsub=null;
    const nr=this.nr;this.nr=null;if(nr)nr.leave().catch(()=>{});
    this.advertise();
  },
  findHost(){
    if(!this.nr)return null;
    const hs=this.nr.peers().filter(p=>!p.isMe&&p.presence&&p.presence.r==='h');
    return hs.find(p=>(p.presence.acc||[]).some(x=>x&&x[0]===this.me))||hs[0]||null;
  },
  async join(name,target){
    const code=String(target||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!code)return{err:'Entre le code de la partie (4 caractères) ou choisis une partie dans la liste.'};
    let nr;
    try{nr=await ROOM.join('snake-'+code)}catch(e){return{err:'Impossible de rejoindre cette partie.'}}
    Object.assign(this,{nr,code,k:0,turns:'',lastEv:null,lastOv:0,lastLobby:'',hostGoneT:0});
    nr.presence({r:'g',n:name,k:0,t:''}).catch(()=>{});
    const res=await new Promise(resolve=>{
      const t0=Date.now();
      const iv=setInterval(()=>{
        const me=nr.peers().find(p=>p.isMe&&p.sameTab);
        if(me)this.me=me.peer;
        const host=this.findHost();
        const a=host&&me&&(host.presence.acc||[]).find(x=>x&&x[0]===me.peer);
        if(a){clearInterval(iv);resolve({id:+a[1]});return}
        if(Date.now()-t0>7000){clearInterval(iv);resolve({err:host?'Partie pleine (4 joueurs maximum) ou déjà commencée.':'Aucune partie ouverte avec ce code.'})}
      },250);
    });
    if(res.err){nr.leave().catch(()=>{});this.nr=null;return res}
    this.unsub=nr.onPeers(()=>this.guestPeers());
    setTimeout(()=>this.guestPeers(),0);
    return{id:res.id,where:'code '+code.toUpperCase()};
  },
  guestPeers(){
    if(NET.role!=='client'||T!==this||!this.nr)return;
    const host=this.findHost();
    if(!host){
      if(!this.hostGoneT)this.hostGoneT=setTimeout(()=>{this.hostGoneT=0;if(NET.role==='client'&&!this.findHost())lost("L'hôte a quitté la partie.")},3000);
      return;
    }
    clearTimeout(this.hostGoneT);this.hostGoneT=0;
    const P=host.presence;
    if(!(P.acc||[]).some(x=>x&&x[0]===this.me)){lost("L'hôte a fermé la partie.");return}
    try{
      if(P.ph==='lobby'&&P.lb){
        const key=JSON.stringify(P.lb);
        if(key!==this.lastLobby||G){
          this.lastLobby=key;
          clientMsg({t:'lobby',players:(P.lb.pl||[]).slice(0,MAXP).map(([pid,name])=>({pid:+pid||0,name:cleanName(name)})),mode:P.lb.m==='infinite'?'infinite':'classic'});
        }
      }else if(P.ph==='game'&&P.s){
        this.lastLobby='';
        const evs=Array.isArray(P.ev)?P.ev:[];let ev=[];
        const top=evs.length?+evs[evs.length-1][0]||0:0;
        if(this.lastEv===null)this.lastEv=top;
        else{ev=evs.filter(e=>+e[0]>this.lastEv).map(e=>({k:String(e[1]),x:+e[2]||0,y:+e[3]||0}));this.lastEv=Math.max(this.lastEv,top)}
        clientMsg(decodeSnap(P.s,ev));
        if(P.ov&&+P.ov>this.lastOv){this.lastOv=+P.ov;clientMsg({t:'over'})}
      }
    }catch(e){}
  },
  input(d){
    this.k++;this.turns=(this.turns+(d>0?'R':'L')).slice(-8);
    if(this.nr)this.nr.presence({k:this.k,t:this.turns}).catch(()=>{});
  },
  leave(){
    if(this.unsub)this.unsub();this.unsub=null;clearTimeout(this.hostGoneT);
    const nr=this.nr;this.nr=null;if(nr)nr.leave().catch(()=>{});
  }
};

/* ---- liste des parties ouvertes (page claude.ai) ---- */
function renderGameList(){
  const box=$('gameList');
  if(!ROOM||cfg.play!=='join'||screen!=='menu'){box.classList.add('hidden');return}
  const games=ROOM.peers().filter(p=>!p.isMe&&p.presence&&p.presence.g&&p.presence.g.o)
    .map(p=>p.presence.g).filter(g=>/^[a-z0-9]{4}$/.test(String(g.c)));
  box.classList.remove('hidden');
  box.innerHTML=games.length
    ?games.map(g=>`<button class="opt" data-code="${esc(g.c)}">${esc(cleanName(g.n))}<small>${g.m==='infinite'?'Infini':'Classique'} · ${Math.min(MAXP,+g.k||1)}/${MAXP} · code ${esc(String(g.c).toUpperCase())}</small></button>`).join('')
    :'<div class="hint">Aucune partie ouverte pour l\'instant. Demande le code à l\'hôte, ou attends qu\'il crée son salon.</div>';
}
$('gameList').addEventListener('click',e=>{
  const b=e.target.closest('[data-code]');if(!b)return;
  inAddr.value=b.dataset.code.toUpperCase();menuGo();
});

/* ---- hôte ---- */
async function hostCreate(name){
  const btn=$('btnPlay');btn.disabled=true;
  try{
    if(!canHost)throw new Error('nohost');
    const info=await T.host(name);
    NET={role:'host',pid:0,roster:[{pid:0,name}],info,last:0};
    sendLobby();showLobby();
  }catch(e){
    $('menuErr').textContent=!canHost
      ?"Le jeu en réseau n'est pas disponible ici. Ouvre la page SNAKE publiée sur claude.ai (connecté à ton compte), ou lance SNAKE.exe sur un PC."
      :"Impossible de créer la partie réseau. Réessaie dans un instant.";
  }finally{btn.disabled=false}
}
function hostMsg(m){
  if(NET.role!=='host')return;
  if(m.t==='join'){
    NET.roster=NET.roster.filter(p=>p.pid!==m.id);
    NET.roster.push({pid:m.id,name:m.name});NET.roster.sort((a,b)=>a.pid-b.pid);
    playJoin();
  }else if(m.t==='leave'){
    NET.roster=NET.roster.filter(p=>p.pid!==m.id);
    if(G){const s=G.snakes.find(s=>s.pid===m.id);
      if(s&&!s.out){s.out=true;s.left=true;s.alive=false;s.body=[];s.outTime=G.time;G.dirty=true;
        if(G.state!=='over'&&G.snakes.every(x=>x.out))endGame()}}
  }else if(m.t==='in'){
    if(G&&G.state==='play')turn(G.snakes.find(s=>s.pid===m.id),m.d>0?1:-1);
    return;
  }
  if(!G){sendLobby();renderLobby()}
}
function sendLobby(){if(NET.role==='host')T.hostSend({t:'lobby',players:NET.roster,mode:cfg.mode})}
function hostLaunch(){
  if(NET.role!=='host')return;
  ac();T.setOpen(false);
  newGame(NET.roster);show(null);
}
function hostToLobby(){
  G=null;particles=[];
  T.setOpen(true);sendLobby();showLobby();
}
function hostQuit(){T.closeHost();toMenu()}

/* ---- invité ---- */
async function clientJoin(name){
  const btn=$('btnPlay');btn.disabled=true;$('menuErr').textContent='Connexion…';
  try{
    const r=await T.join(name,inAddr.value);
    if(r.err){$('menuErr').textContent=r.err;return}
    NET={role:'client',pid:r.id,where:r.where,roster:[]};
    $('menuErr').textContent='';
    showLobby();
  }finally{btn.disabled=false}
}
function clientMsg(m){
  if(NET.role!=='client')return;
  if(m.t==='lobby'){
    NET.roster=m.players;cfg.mode=m.mode;
    if(G){G=null;particles=[]}
    showLobby();
  }else if(m.t==='s'){applySnap(m)}
  else if(m.t==='over'){if(G){G.state='over';showOver(resultHTML(),false)}}
  else if(m.t==='closed'){lost("L'hôte a fermé la partie.")}
}
function applySnap(m){
  const fresh=!G;
  if(fresh){G={remote:true,walls:new Set(),eggs:[],snakes:[]};particles=[]}
  G.state=m.st;G.banner=m.banner;G.bannerSub=m.sub;G.level=m.level;G.time=m.time;G.clock=m.clock;cfg.mode=m.mode;
  G.walls=new Set(m.walls);
  const old=G.eggs;
  G.eggs=m.eggs.map(([x,y])=>old.find(e=>e.x===x&&e.y===y)||{x,y,born:performance.now()});
  const n0=G.snakes.length;
  G.snakes=m.sn.map((d,i)=>{const body=[];for(let k=0;k+1<d.b.length;k+=2)body.push({x:d.b[k],y:d.b[k+1]});
    return{id:i,pid:d.p,name:cleanName(d.n),body,dir:d.d&3,lives:d.l,score:d.sc,eggs:d.eg,alive:d.a,out:d.o,left:d.lf,respawnAt:d.r,outTime:d.ot}});
  if(fresh||n0!==G.snakes.length)buildHud();
  for(const e of m.ev||[]){
    if(e.k==='egg'){playLA();burst(e,'#fde68a',14)}
    else if(e.k==='die'){playDeath();burst(e,'#f43f5e',22)}
    else if(e.k==='lvl')playLevel();
  }
  if(G.state==='pause'){if(screen!=='pause')showPause()}
  else if(G.state!=='over'&&screen!==null)show(null);
}
function lost(msg){
  if(T&&NET.role==='client')T.leave();
  toMenu();selectOpt('play','join');updateMenu();
  $('menuErr').textContent=msg;
}
function clientQuit(){
  if(NET.role==='client')T.leave();
  toMenu();
}

/* ---- salon ---- */
function showLobby(){renderLobby();show('lobby')}
function renderLobby(){
  const host=NET.role==='host';
  $('lobbyHost').classList.toggle('hidden',!host);
  $('lobbyModeHost').classList.toggle('hidden',!host);
  $('btnLaunch').classList.toggle('hidden',!host);
  $('lobbyGuest').classList.toggle('hidden',host);
  if(host){
    if(T.kind==='room'){
      $('lobbyLbl').textContent='Code de la partie';
      $('lobbyAddr').textContent=NET.info.code.toUpperCase();
      $('lobbyHint').innerHTML="Les autres joueurs ouvrent cette même page SNAKE (partagée avec eux), choisissent « Réseau (rejoindre) », puis cliquent sur ta partie ou tapent ce code. Garde cette page au premier plan pendant la partie.";
    }else{
      const a=NET.info.addrs||[];
      $('lobbyLbl').textContent='Adresse à donner aux autres joueurs';
      $('lobbyAddr').innerHTML=a.length?a.map(esc).join('<br>'):'Aucun réseau détecté';
      $('lobbyHint').innerHTML=`Les joueurs doivent être sur le même réseau (même box / Wi-Fi). Ils choisissent « Réseau (rejoindre) » et tapent cette adresse — ou l'ouvrent dans le navigateur de leur téléphone : <b>${a.length?esc('http://'+a[0]):''}</b>`;
    }
    selectOpt('mode',cfg.mode);
    $('lobbyErr').textContent=NET.roster.length<2?'En attente de joueurs… (tu peux aussi lancer seul)':'';
  }else{
    $('lobbyGuest').innerHTML=`Connecté à <b>${esc(NET.where||'')}</b> — mode <b>${cfg.mode==='classic'?'Classique':'Infini'}</b>.<br>En attente du lancement par l'hôte…`;
    $('lobbyErr').textContent='';
  }
  let h='';
  for(let i=0;i<MAXP;i++){
    const p=NET.roster[i];
    h+=p?`<div class="slot" style="--c:${COLORS[i].body}"><i></i>${esc(p.name)}${p.pid===NET.pid?' <span style="color:var(--mut);font-weight:400">(toi)</span>':''}${p.pid===0?' <span style="color:var(--mut);font-weight:400">· hôte</span>':''}</div>`
         :`<div class="slot empty"><i></i>Place libre</div>`;
  }
  $('lobbyList').innerHTML=h;
}

/* =================== commandes =================== */
// which = 0 : joueur principal de cet écran ; 1 : second joueur (2 joueurs même clavier)
function localTurn(which,d){
  if(!G||G.state!=='play')return;
  if(NET.role==='client'){if(which===0)T.input(d);return}
  turn(which===0?G.snakes[0]:(cfg.play==='duo'&&!NET.role?G.snakes[1]:null),d);
}
if(window.FORCE_TOUCH||'ontouchstart' in window||(window.matchMedia&&matchMedia('(pointer:coarse)').matches))document.body.classList.add('is-touch');
// Flèches à l'écran : souris, doigt ou stylet, en plus du clavier.
function flash(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120)}
document.querySelectorAll('.tbtn').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault())); // pas de focus
document.querySelectorAll('.tbtn[data-g]').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();ac();localTurn(+b.dataset.g,+b.dataset.d);
}));
// Les touches du clavier font aussi « s'enfoncer » la flèche correspondante.
function flashKey(g,d){const b=document.querySelector(`.tbtn[data-g="${g}"][data-d="${d}"]`);if(b)flash(b)}
$('tPause').addEventListener('pointerdown',e=>{e.preventDefault();if(NET.role!=='client')togglePause()});
document.addEventListener('gesturestart',e=>e.preventDefault());

addEventListener('keydown',e=>{
  const k=e.key,l=k.toLowerCase();
  if(e.target&&e.target.tagName==='INPUT'){if(k==='Enter'){e.preventDefault();menuGo()}return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(screen==='menu'){if(k==='Enter')menuGo();return}
  if(screen==='lobby'){if(k==='Enter'&&NET.role==='host')hostLaunch();if(k==='Escape')NET.role==='host'?hostQuit():clientQuit();return}
  if(screen==='over'){if(k==='Enter')again();if(k==='Escape')back();return}
  if(k===' '||l==='p'){if(NET.role!=='client')togglePause();return}
  if(k==='Escape'){back();return}
  if(e.repeat)return;
  if(k==='ArrowLeft'){localTurn(0,-1);flashKey(0,-1)}
  if(k==='ArrowRight'){localTurn(0,1);flashKey(0,1)}
  if(l==='q'||l==='d'){const g=cfg.play==='duo'&&!NET.role?1:0,d=l==='q'?-1:1;localTurn(g,d);flashKey(g,d)}
});

/* =================== rendu =================== */
function drawWall(x,y){
  const px=x*CELL,py=y*CELL;
  ctx.fillStyle='#7c2d12';ctx.fillRect(px,py,CELL,CELL);
  ctx.fillStyle='#c2410c';
  ctx.fillRect(px+1,py+1,CELL/2-2,CELL/2-2);ctx.fillRect(px+CELL/2+1,py+1,CELL/2-2,CELL/2-2);
  ctx.fillRect(px+1,py+CELL/2+1,CELL-2,CELL/2-2);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(px,py,CELL,2);
}
function drawEgg(e,t){
  const cx=(e.x+.5)*CELL,cy=(e.y+.55)*CELL,age=Math.max(0.01,Math.min(1,(t-e.born)/250)),w=Math.sin(t/180+e.x)*0.12;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(w);ctx.scale(age,age);
  ctx.shadowColor='rgba(253,230,138,.7)';ctx.shadowBlur=12;
  const g=ctx.createRadialGradient(-3,-5,1,0,0,12);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#f5deb3');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,7.5,9.5,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(180,140,90,.55)';
  [[-3,1,1.4],[2.5,-2,1.1],[1.5,4,1.2]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill()});
  ctx.restore();
}
function drawSnake(s){
  const c=COLORS[s.id],n=s.body.length;
  for(let i=n-1;i>=0;i--){
    const p=s.body[i],head=i===0,inset=head?1:2+Math.min(3,i/n*3);
    ctx.fillStyle=head?c.head:(i%2?c.body:c.dark);
    if(!head)ctx.globalAlpha=1-(i/n)*0.35;
    rr(p.x*CELL+inset,p.y*CELL+inset,CELL-inset*2,CELL-inset*2,head?8:6);ctx.fill();
    ctx.globalAlpha=1;
  }
  const h=s.body[0];if(!h)return;
  const[dx,dy]=DIRS[s.dir],cx=(h.x+.5)*CELL,cy=(h.y+.5)*CELL,px=-dy,py=dx;
  for(const sgn of[-1,1]){
    const ex=cx+dx*4+px*5*sgn,ey=cy+dy*4+py*5*sgn;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,3.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0b1020';ctx.beginPath();ctx.arc(ex+dx*1.4,ey+dy*1.4,1.8,0,Math.PI*2);ctx.fill();
  }
  if(G.snakes.length>2||NET.role){ // nom au-dessus de la tête en multijoueur
    ctx.font='600 11px Inter,sans-serif';ctx.textAlign='center';ctx.fillStyle=c.head;ctx.globalAlpha=.85;
    ctx.fillText(s.name,cx,h.y*CELL-4);ctx.globalAlpha=1;
  }
}
function drawGhost(s,t){
  const sp=spawnOf(s.id),left=Math.max(0,s.respawnAt-G.clock);
  ctx.globalAlpha=0.25+0.25*Math.sin(t/90);
  ctx.strokeStyle=COLORS[s.id].body;ctx.lineWidth=2;ctx.setLineDash([4,4]);
  sp.cells.forEach(c=>{rr(c.x*CELL+3,c.y*CELL+3,CELL-6,CELL-6,6);ctx.stroke()});
  ctx.setLineDash([]);ctx.globalAlpha=1;
  if(left>0){const h=sp.cells[1];ctx.fillStyle=COLORS[s.id].body;ctx.font='12px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText(Math.ceil(left/1000),(h.x+.5)*CELL,h.y*CELL-6)}
}
function draw(t,dt){
  ctx.drawImage(bg,0,0);
  if(!G){
    ctx.fillStyle='rgba(74,222,128,.08)';
    for(let i=0;i<14;i++){const x=Math.floor((t/120+i*3)%COLS);ctx.fillRect(x*CELL,(MID+((i%3)-1)*6)*CELL,CELL,CELL)}
    return;
  }
  for(const w of G.walls){const[x,y]=w.split(',').map(Number);drawWall(x,y)}
  for(const e of G.eggs)drawEgg(e,t);
  for(const s of G.snakes){if(s.alive)drawSnake(s);else if(!s.out&&G.state!=='over')drawGhost(s,t)}
  particles=particles.filter(p=>(p.life-=dt/600)>0);
  for(const p of particles){p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vx*=.96;p.vy*=.96;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
  if(G.state==='banner'){
    ctx.fillStyle='rgba(7,11,23,.55)';ctx.fillRect(0,cv.height/2-60,cv.width,120);
    ctx.textAlign='center';ctx.fillStyle='#fde68a';ctx.font='34px "Press Start 2P",monospace';
    ctx.fillText(G.banner||'',cv.width/2,cv.height/2+(G.bannerSub?2:14));
    if(G.bannerSub){ctx.fillStyle='#e6ecff';ctx.font='600 16px Inter,sans-serif';ctx.fillText(G.bannerSub,cv.width/2,cv.height/2+36)}
  }
}

/* =================== HUD =================== */
const hudCache={};
function setHTML(id,v){const el=$(id);if(el&&hudCache[id]!==v){hudCache[id]=v;el.innerHTML=v}}
function buildHud(){
  const n=G?G.snakes.length:(NET.role?0:(cfg.play==='duo'?2:1));
  const L=$('hudL'),R=$('hudR');L.innerHTML='';R.innerHTML='';
  for(let i=0;i<n;i++){
    const s=G&&G.snakes[i],name=(s&&s.name)||('JOUEUR '+(i+1));
    const me=NET.role&&s&&s.pid===NET.pid;
    const el=document.createElement('div');
    el.className='pl'+(i%2?' right':'');el.id='pl'+i;el.style.setProperty('--c',COLORS[i].body);
    el.innerHTML=`<div class="name">${esc(name)}${me?' <span class="you">(toi)</span>':''}</div><div class="hearts" id="h${i}"></div><div class="row"><span class="score" id="s${i}">0</span><span class="eggs" id="e${i}"></span></div>`;
    (i%2?R:L).appendChild(el);
  }
  $('hud').classList.toggle('compact',n>2);
  for(const k in hudCache)delete hudCache[k];
}
function updateHud(){
  const n=G?G.snakes.length:(NET.role?0:(cfg.play==='duo'?2:1));
  for(let i=0;i<n;i++){
    const s=G&&G.snakes[i],lives=s?Math.max(0,s.lives):LIVES;
    let h='';for(let k=0;k<LIVES;k++)h+=`<span class="${k<lives?'':'off'}">♥</span>`;
    setHTML('h'+i,h);
    setHTML('s'+i,String(s?s.score:0).padStart(4,'0'));
    let e='';
    if(cfg.mode==='classic'){for(let k=0;k<EGGS_PER_LEVEL;k++)e+=`<i class="${s&&k<s.eggs?'on':''}"></i>`}
    setHTML('e'+i,e);
    const pl=$('pl'+i);if(pl)pl.classList.toggle('dead',!!(s&&s.out));
  }
  const p=cfg.play==='duo'?2:1,net=!!NET.role;
  if(!G){setHTML('cBig','SNAKE');setHTML('cSmall',net?'Réseau':cfg.mode==='classic'?'Mode classique':'Mode infini');return}
  if(cfg.mode==='classic'){
    setHTML('cBig','NIVEAU '+G.level);
    setHTML('cSmall',net?`Réseau · ${n} joueur${n>1?'s':''}`:`Record : ${Math.max(getRec('classic',p),...G.snakes.map(s=>s.score))} pts`);
  }else{
    setHTML('cBig',fmtTime(G.time));
    const best=getRec('infinite',p);
    setHTML('cSmall',net?`Réseau · ${n} joueur${n>1?'s':''}`:G.time>best&&best>0?'<span style="color:#fde68a">Record battu !</span>':'Record : '+fmtTime(best));
  }
}

/* =================== boucle =================== */
let lastT=0;
function frame(t){
  const dt=Math.min(100,t-(lastT||t));lastT=t;
  if(G&&!G.remote){
    if(G.state==='banner'){G.bannerT-=dt;if(G.bannerT<=0){G.state='play';G.acc=0;G.bannerSub=null;G.dirty=true}}
    else if(G.state==='play'){
      G.clock+=dt;if(cfg.mode==='infinite')G.time+=dt;
      G.acc+=dt;
      while(G.acc>=interval()&&G.state==='play'){G.acc-=interval();step()}
      if(G.state==='play')respawns();
    }
    if(NET.role==='host'&&G&&G.state!=='over'&&(G.dirty||t-NET.last>250)){
      T.hostSend(snapshot(),true);G.ev=[];G.dirty=false;NET.last=t;
    }
  }
  draw(t,dt);updateHud();
  requestAnimationFrame(frame);
}

/* =================== démarrage =================== */
T=lanT;
// Page publiée sur claude.ai : jeu en réseau par internet (code de partie).
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('room').then(r=>{
    if(!r)return;
    ROOM=r;T=roomT;canHost=true;
    ROOM.onPeers(()=>renderGameList());
    if(!NET.role)updateMenu();
  }).catch(()=>{});
}
// SNAKE.exe sert cette page : on peut héberger depuis le PC lui-même ;
// ouverte depuis un téléphone via l'adresse de l'hôte : on pré-remplit « rejoindre ».
fetchTimeout('/net/info',{},2000).then(r=>r.json()).then(j=>{
  if(j.app!=='snake'||ROOM)return;
  const loop=['127.0.0.1','localhost','[::1]','::1'].includes(location.hostname);
  canHost=loop;
  if(!loop&&screen==='menu'){inAddr.value=location.host;selectOpt('play','join')}
  updateMenu();
}).catch(()=>{});

renderRecords();updateMenu();buildHud();
requestAnimationFrame(frame);
})();
