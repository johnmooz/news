<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Texas Hold'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b120e; --gold:#e2b950; --gold2:#c9a24a; --ink:#f3efe6; --muted:#9fb3a7;
  --felt1:#2b8c58; --felt2:#166239; --felt3:#0c3f25; --rail:#4a2b16;
  --red:#c7372f; --cw:clamp(40px,5.2vw,62px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#1a2a20 0%,var(--bg) 60%);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.btn{border:1px solid rgba(226,185,80,.45);background:rgba(255,255,255,.06);color:var(--ink);padding:11px 18px;border-radius:10px;font-weight:600;font-size:15px;transition:.15s}
.btn:hover:not(:disabled){background:rgba(226,185,80,.15);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#f0cd6a,#c99a33);color:#231a06;border-color:#f3d47c;font-weight:800}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
input{font-family:inherit}

/* ===== MENU ===== */
#menu{align-items:center;justify-content:center;gap:22px;padding:24px;overflow:auto}
.brand{text-align:center}
.brand .suits{font-size:28px;letter-spacing:10px;color:var(--gold)}
.brand .suits .r{color:#e0524a}
.brand h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(40px,7vw,72px);margin:4px 0 2px;letter-spacing:1px;background:linear-gradient(180deg,#fff3cf,#e2b950 70%,#a77d25);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;align-items:center}
.field span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.field input,.join input{background:rgba(0,0,0,.35);border:1px solid rgba(226,185,80,.4);color:var(--ink);padding:11px 14px;border-radius:10px;font-size:16px;text-align:center;outline:none}
.field input:focus,.join input:focus{border-color:var(--gold)}
.modes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.mode{width:300px;background:linear-gradient(180deg,rgba(43,140,88,.22),rgba(12,63,37,.35));border:1px solid rgba(226,185,80,.3);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.mode h2{margin:0;font-family:'Playfair Display',serif;font-size:24px;color:var(--gold)}
.mode p{margin:0;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:var(--ink);font-weight:600}
.seg button.on{background:rgba(226,185,80,.2);border-color:var(--gold);color:#fff}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;text-transform:uppercase;letter-spacing:4px;font-weight:700}
.netnote{font-size:12.5px!important;line-height:1.4}
.link{background:none;border:none;color:var(--gold);text-decoration:underline;font-size:14px}

/* ===== LOBBY ===== */
#lobby{align-items:center;justify-content:center;padding:24px}
.lobbybox{width:min(440px,100%);background:linear-gradient(180deg,rgba(43,140,88,.22),rgba(12,63,37,.35));border:1px solid rgba(226,185,80,.3);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.lobbybox h2{margin:0;font-family:'Playfair Display',serif;color:var(--gold);font-size:26px}
.codebig{font-size:40px;font-weight:800;letter-spacing:10px;text-align:center;background:rgba(0,0,0,.35);border:1px dashed var(--gold2);border-radius:12px;padding:10px 0;color:#fff}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.28);padding:10px 14px;border-radius:10px;font-weight:600}
.plist li small{color:var(--muted);font-weight:500}
.plist li.emptyslot{color:#6d7f74;font-weight:500;font-style:italic}
.muted{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row select{background:rgba(0,0,0,.35);color:var(--ink);border:1px solid rgba(226,185,80,.4);border-radius:8px;padding:8px}

/* ===== GAME ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px;border-bottom:1px solid rgba(226,185,80,.15);background:rgba(0,0,0,.25)}
.topbar button{background:none;border:1px solid rgba(255,255,255,.15);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.topbar button:hover{border-color:var(--gold)}
#hdrInfo{font-size:13px;color:var(--muted);text-align:center}
#hdrInfo b{color:var(--gold)}
.arena{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:30px 70px 40px}
.table-wrap{position:relative;width:min(100%,calc((100vh - 270px)*1.9));aspect-ratio:1.9}
.felt{position:absolute;inset:0;border-radius:999px;background:radial-gradient(ellipse at 50% 45%,var(--felt1) 0%,var(--felt2) 55%,var(--felt3) 100%);border:clamp(10px,1.6vw,18px) solid var(--rail);box-shadow:inset 0 0 0 3px rgba(226,185,80,.35),inset 0 0 70px rgba(0,0,0,.55),0 0 0 2px #2a170a,0 24px 60px rgba(0,0,0,.7)}
.felt::after{content:"";position:absolute;inset:9%;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;width:62%}
.potlbl{background:rgba(0,0,0,.45);padding:4px 14px;border-radius:99px;font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:6px}
.street{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
.board{display:flex;gap:clamp(4px,.6vw,8px)}
.banner{background:rgba(8,12,10,.82);border:1px solid var(--gold2);border-radius:12px;padding:8px 14px;font-size:13.5px;text-align:center;line-height:1.5;max-width:100%}
.banner b{color:var(--gold)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:4px}
.ctrl small{color:rgba(255,255,255,.65);font-size:11.5px}
.ctrl .btn{padding:8px 16px;font-size:14px}
.myhand{font-size:12.5px;color:#fff;background:rgba(0,0,0,.35);padding:3px 12px;border-radius:99px}
.myhand b{color:var(--gold)}

/* cards */
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);background:linear-gradient(160deg,#ffffff,#efe9dc);box-shadow:0 2px 6px rgba(0,0,0,.5);position:relative;color:#1c1c1c;font-weight:800;flex:none;transition:transform .2s,filter .2s,box-shadow .2s}
.card .cr{position:absolute;top:5%;left:9%;font-size:calc(var(--cw)*.31);line-height:1;letter-spacing:-1px}
.card .cs{position:absolute;top:30%;left:11%;font-size:calc(var(--cw)*.22);line-height:1}
.card .cc{position:absolute;right:8%;bottom:5%;font-size:calc(var(--cw)*.6);line-height:1}
.card.red{color:var(--red)}
.card.back{background:repeating-linear-gradient(45deg,#7c1922 0 5px,#952230 5px 10px);border:3px solid #f2ede2}
.card.back::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,214,140,.55);border-radius:4px}
.card.hl{box-shadow:0 0 0 3px #f5c542,0 0 18px rgba(245,197,66,.85);transform:translateY(-5px)}
.card.dim{filter:brightness(.5) saturate(.6)}
.flip{animation:flip .55s ease both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:rotateY(0) scale(1)}}
.deal{animation:deal .45s ease both}
@keyframes deal{0%{transform:translateY(-40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* seats */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;--cw:clamp(30px,3.8vw,46px)}
.seat.me{--cw:clamp(42px,5vw,64px)}
.seat .hole{display:flex;gap:3px;min-height:calc(var(--cw)*1.4)}
.plate{background:rgba(9,13,11,.9);border:1px solid rgba(226,185,80,.45);border-radius:12px;padding:6px 12px;min-width:clamp(110px,12vw,150px);text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.plate .nm{font-weight:700;font-size:13.5px;display:flex;gap:5px;align-items:center;justify-content:center;white-space:nowrap}
.plate .ch{font-weight:800;color:var(--gold);font-size:15px}
.plate .stt{font-size:11.5px;color:var(--muted);min-height:15px;white-space:nowrap}
.badge{font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;line-height:14px}
.badge.d{background:#fff;color:#111}
.badge.sb{background:#3d7bd9;color:#fff}
.badge.bb{background:#d9583d;color:#fff}
.seat.turn .plate{border-color:var(--gold);box-shadow:0 0 0 2px rgba(226,185,80,.5),0 0 22px rgba(226,185,80,.55);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(226,185,80,.25),0 0 10px rgba(226,185,80,.3)}}
.seat.turn .stt{color:var(--gold)}
.seat.folded .plate{opacity:.55}
.seat.out{opacity:.35}
.seat.win .plate{border-color:#f5c542;background:linear-gradient(180deg,rgba(80,62,12,.95),rgba(9,13,11,.95))}
.p-bottom{left:50%;bottom:-6%;transform:translateX(-50%)}
.p-top{left:50%;top:-9%;transform:translateX(-50%)}
.p-left{left:-4%;top:50%;transform:translate(-25%,-50%)}
.p-right{right:-4%;top:50%;transform:translate(25%,-50%)}
.p-tl{left:20%;top:-9%;transform:translateX(-50%)}
.p-tr{left:80%;top:-9%;transform:translateX(-50%)}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.5);padding:3px 10px 3px 4px;border-radius:99px;font-weight:700;font-size:12.5px}
.chip{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,#c0392b 29% 60%,#fff 61% 68%,#c0392b 69%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.chip.g{background:radial-gradient(circle,#fff 0 28%,#c99a33 29% 60%,#fff 61% 68%,#c99a33 69%)}
.b-bottom{left:50%;top:72%}.b-top{left:50%;top:26%}.b-left{left:17%;top:50%}.b-right{left:83%;top:50%}.b-tl{left:27%;top:28%}.b-tr{left:73%;top:28%}

/* action bar */
#actionBar{min-height:92px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px 14px;flex-wrap:wrap;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent)}
#actionBar .wait{color:var(--muted);font-size:14px}
.act{border:none;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px;color:#fff;min-width:120px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:.12s}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.act.fold{background:linear-gradient(180deg,#c4483a,#8f2b21)}
.act.check,.act.call{background:linear-gradient(180deg,#2f9a62,#1c6b41)}
.act.raise-btn{background:linear-gradient(180deg,#f0cd6a,#c99a33);color:#231a06;min-width:170px}
.raise{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.3);padding:8px 10px;border-radius:12px;border:1px solid rgba(226,185,80,.25)}
.quick{display:flex;gap:5px}
.quick button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--ink);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:600}
.quick button:hover{border-color:var(--gold)}
.rrow{display:flex;gap:10px;align-items:center}
.rrow input[type=range]{width:clamp(110px,16vw,200px);accent-color:var(--gold)}

/* log */
#logPanel{width:270px;border-left:1px solid rgba(226,185,80,.15);background:rgba(0,0,0,.3);padding:12px;overflow:auto;font-size:12.5px;line-height:1.55}
#logPanel h3{margin:0 0 8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
#logPanel div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04);color:#d5dcd7}
#logPanel div.hd{color:var(--gold);font-weight:700;margin-top:6px}
.rs{color:#e0524a}

/* overlays */
#overlay,#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
.panel{background:linear-gradient(180deg,#17251c,#0d1611);border:1px solid var(--gold2);border-radius:18px;padding:26px 28px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.panel h2{margin:0;font-family:'Playfair Display',serif;color:var(--gold);font-size:28px}
.panel p{margin:0}
.trophy{font-size:52px}
.rules{max-width:640px;max-height:86vh;overflow:auto;text-align:left}
.rules ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.rules li .ex{display:flex;gap:2px;--cw:26px;flex:none}
.rules li .ex .card .cs{display:none}
.rules li b{color:var(--gold)}
.rules li span.d{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

@media (max-width:1000px){ #logPanel{position:absolute;right:0;top:0;bottom:0;z-index:20;display:none} #logPanel.open{display:block} }
@media (min-width:1001px){ #logPanel.closed{display:none} }
@media (max-width:700px){
  .stage{padding:40px 14px 50px}
  .table-wrap{aspect-ratio:.82;width:min(100%,calc((100vh - 290px)*.82))}
  .p-left{left:0;transform:translate(-8%,-50%)} .p-right{right:0;transform:translate(8%,-50%)}
  .p-tl{left:25%}.p-tr{left:75%}
  .b-left{left:22%}.b-right{left:78%}.b-top{top:22%}.b-tl{left:28%;top:22%}.b-tr{left:72%;top:22%}.b-bottom{top:76%}
  .center{width:84%} .center{--cw:clamp(34px,10.5vw,52px)}
  .plate{min-width:96px;padding:5px 8px}
  .act{min-width:96px;padding:12px 14px;font-size:14px}
  .act.raise-btn{min-width:140px}
}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="brand">
    <div class="suits">♠ <span class="r">♥</span> <span class="r">♦</span> ♣</div>
    <h1>Texas Hold'em</h1>
    <p>100 € de départ · Petite blinde 2 € · Grosse blinde 5 €</p>
  </div>
  <label class="field"><span>Votre pseudo</span><input id="nameIn" maxlength="14" placeholder="Votre nom"></label>
  <div class="modes">
    <section class="mode">
      <h2>Partie locale</h2>
      <p>Vous contre l'ordinateur</p>
      <div class="seg" id="aiSeg"><button data-n="1">1 IA</button><button data-n="2">2 IA</button><button data-n="3" class="on">3 IA</button></div>
      <button class="btn gold" id="playLocal">Jouer</button>
    </section>
    <section class="mode">
      <h2>En réseau</h2>
      <p>Jusqu'à 4 joueurs, chacun sur son écran</p>
      <button class="btn" id="hostBtn" disabled>Héberger une partie</button>
      <div class="join"><input id="codeIn" placeholder="CODE" maxlength="5"><button class="btn" id="joinBtn" disabled>Rejoindre</button></div>
      <p class="netnote" id="netNote">Connexion au réseau…</p>
    </section>
  </div>
  <button class="link" id="rulesBtn1">Voir les combinaisons</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden"><div class="lobbybox" id="lobbyBox"></div></div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <header class="topbar">
    <button id="quitBtn">← Quitter</button>
    <div id="hdrInfo"></div>
    <div style="display:flex;gap:6px"><button id="rulesBtn2">Combinaisons</button><button id="logBtn">Historique</button></div>
  </header>
  <div class="arena">
    <div class="stage">
      <div class="table-wrap">
        <div class="felt"></div>
        <div class="center" id="center"></div>
        <div id="bets"></div>
        <div id="seats"></div>
      </div>
    </div>
    <aside id="logPanel"></aside>
  </div>
  <div id="actionBar"></div>
</div>

<div id="overlay" class="hidden"></div>
<div id="modal" class="hidden"></div>

<script>
'use strict';
/* ================= CONSTANTES ================= */
const SUITS=['♠','♥','♦','♣'];
const RANKS=['2','3','4','5','6','7','8','9','10','V','D','R','A'];
const RN=['2','3','4','5','6','7','8','9','10','Valet','Dame','Roi','As'];
const RP=['2','3','4','5','6','7','8','9','10','Valets','Dames','Rois','As'];
const SB=2, BB=5, START=100, MAXP=4;
const STREETS=['Pré-flop','Flop','Turn','River'];
const AI_NAMES=['Lucie','Marcel','Zoé','Hugo','Inès','Bruno','Camille','Léon'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cardTxt=c=>RANKS[c%13]+SUITS[Math.floor(c/13)];
const de=w=>/^[AEIOU]/.test(w)?"d'"+w:'de '+w;
const cleanName=x=>(String(x||'').trim().slice(0,14))||'Joueur';

function rint(n){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }catch(e){ return Math.floor(Math.random()*n); } }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rint(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ================= ÉVALUATION DES MAINS ================= */
function eval5(cs){
  const r=cs.map(c=>c%13).sort((a,b)=>b-a);
  const s0=Math.floor(cs[0]/13);
  let flush=true; for(let i=1;i<5;i++) if(Math.floor(cs[i]/13)!==s0){flush=false;break;}
  const cnt={}; for(const x of r) cnt[x]=(cnt[x]||0)+1;
  const groups=Object.keys(cnt).map(k=>[+k,cnt[k]]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let sh=-1;
  if(groups.length===5){ if(r[0]-r[4]===4) sh=r[0]; else if(r[0]===12&&r[1]===3) sh=3; }
  let cat,k;
  if(sh>=0&&flush){cat=8;k=[sh];}
  else if(groups[0][1]===4){cat=7;k=[groups[0][0],groups[1][0]];}
  else if(groups[0][1]===3&&groups[1][1]===2){cat=6;k=[groups[0][0],groups[1][0]];}
  else if(flush){cat=5;k=r;}
  else if(sh>=0){cat=4;k=[sh];}
  else if(groups[0][1]===3){cat=3;k=groups.map(g=>g[0]);}
  else if(groups[0][1]===2&&groups[1][1]===2){cat=2;k=groups.map(g=>g[0]);}
  else if(groups[0][1]===2){cat=1;k=groups.map(g=>g[0]);}
  else {cat=0;k=r;}
  let score=cat; for(let i=0;i<5;i++) score=score*13+(k[i]||0);
  return {score,cat,k};
}
const C7=[];
for(let a=0;a<7;a++)for(let b=a+1;b<7;b++)for(let c=b+1;c<7;c++)for(let d=c+1;d<7;d++)for(let e=d+1;e<7;e++)C7.push([a,b,c,d,e]);
function score7(cs){ let m=-1; for(const k of C7){ const s=eval5([cs[k[0]],cs[k[1]],cs[k[2]],cs[k[3]],cs[k[4]]]).score; if(s>m)m=s; } return m; }
function bestOf(cards){
  const n=cards.length; if(n<5) return null; let best=null;
  const rec=(start,combo)=>{
    if(combo.length===5){ const cs=combo.map(i=>cards[i]); const e=eval5(cs); if(!best||e.score>best.score){ best=e; best.cards=cs; } return; }
    for(let i=start;i<n;i++){ combo.push(i); rec(i+1,combo); combo.pop(); }
  };
  rec(0,[]); return best;
}
function handName(e){
  const k=e.k;
  switch(e.cat){
    case 8: return k[0]===12?'Quinte Flush Royale':'Quinte flush hauteur '+RN[k[0]];
    case 7: return 'Carré '+de(RP[k[0]]);
    case 6: return 'Full aux '+RP[k[0]]+' par les '+RP[k[1]];
    case 5: return 'Couleur hauteur '+RN[k[0]];
    case 4: return 'Quinte hauteur '+RN[k[0]];
    case 3: return 'Brelan '+de(RP[k[0]]);
    case 2: return 'Double paire '+RP[k[0]]+' et '+RP[k[1]];
    case 1: return 'Paire '+de(RP[k[0]]);
    default: return 'Hauteur '+RN[k[0]];
  }
}
function describe(cards){
  if(cards.length>=5) return handName(bestOf(cards));
  const r=cards.map(c=>c%13);
  if(r.length===2&&r[0]===r[1]) return 'Paire '+de(RP[r[0]]);
  return 'Hauteur '+RN[Math.max(...r)];
}
function equity(hand,board,nOpp,iters){
  const used=new Set(hand.concat(board)); const rest=[];
  for(let c=0;c<52;c++) if(!used.has(c)) rest.push(c);
  const need=nOpp*2+5-board.length; let win=0;
  for(let it=0;it<iters;it++){
    for(let i=0;i<need;i++){ const j=i+Math.floor(Math.random()*(rest.length-i)); const t=rest[i]; rest[i]=rest[j]; rest[j]=t; }
    const b=board.concat(rest.slice(nOpp*2,need));
    const my=score7(hand.concat(b)); let lose=false, ties=0;
    for(let o=0;o<nOpp;o++){ const s=score7([rest[2*o],rest[2*o+1]].concat(b)); if(s>my){lose=true;break;} if(s===my) ties++; }
    if(!lose) win+=1/(ties+1);
  }
  return win/iters;
}

/* ================= ÉTAT ================= */
const S={mode:null,mySeat:0,name:'Joueur',aiN:3};
let G=null;
let timers=[];
function later(fn,ms){ const t=setTimeout(()=>{ timers=timers.filter(x=>x!==t); fn(); },ms); timers.push(t); }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function freshNet(){ return {nr:null,code:'',seats:[],aiN:0,myPeer:null,lastAct:{},kp:null,pk:null,keyCache:{},hostG:null,hostSeen:false,hostGone:false,notFound:false,mySeat:-1,myHand:null,lastEnc:null,actId:0,pendingAid:null,encBusy:false}; }
let net=freshNet();

function makePlayer(name,isAI,peer){
  return {name,isAI:!!isAI,peer:peer||null,chips:START,left:false,out:false,hand:[],bet:0,total:0,folded:false,allIn:false,acted:false,inHand:false,la:'',raises:0,hd:null,
    style:{aggr:0.8+Math.random()*0.6,bluff:0.04+Math.random()*0.1,tight:Math.random()*0.08}};
}
function pickAINames(n,taken){ const pool=shuffle(AI_NAMES.filter(x=>!taken.includes(x))); return pool.slice(0,n); }
function log(t,hd){ G.log.push({t,hd:!!hd}); if(G.log.length>80) G.log.splice(0,G.log.length-80); }
function potTotal(){ return G.players.reduce((s,p)=>s+p.total,0); }
function canAct(p){ return p.inHand&&!p.folded&&!p.allIn; }
function liveP(){ return G.players.filter(p=>p.inHand&&!p.folded); }
function nextSeat(from,pred){ const n=G.players.length; for(let k=1;k<=n;k++){ const i=((from+k)%n+n)%n; if(pred(G.players[i],i)) return i; } return -1; }
const eligible=p=>!p.out&&!p.left;

/* ================= MOTEUR DE JEU ================= */
function newGame(players){
  G={players,dealer:-1,sb:-1,bb:-1,handNo:0,actionId:0,log:[],phase:'idle',deck:[],board:[],revealed:0,street:0,currentBet:0,minRaise:BB,toAct:-1,results:null,showHands:false,winCards:null,enc:[],encHn:-1,over:null};
  abKey=''; startHand();
}
function restartGame(){
  if(!G) return; clearTimers();
  G.players.forEach(p=>{ p.chips=START; p.out=false; });
  G.over=null; abKey=''; startHand();
}
function startHand(){
  clearTimers();
  G.players.forEach(p=>{ if(p.chips<=0) p.out=true; });
  const elig=G.players.filter(eligible);
  if(elig.length<2){ endGameCheck(true); changed(); return; }
  G.handNo++; G.actionId++;
  if(G.dealer<0){ const idx=G.players.map((p,i)=>i).filter(i=>eligible(G.players[i])); G.dealer=idx[rint(idx.length)]; }
  else G.dealer=nextSeat(G.dealer,eligible);
  G.players.forEach(p=>{ p.inHand=eligible(p); p.hand=[]; p.bet=0; p.total=0; p.folded=false; p.allIn=false; p.acted=false; p.la=''; p.raises=0; p.hd=null; });
  if(elig.length===2){ G.sb=G.dealer; G.bb=nextSeat(G.dealer,eligible); }
  else { G.sb=nextSeat(G.dealer,eligible); G.bb=nextSeat(G.sb,eligible); }
  G.deck=shuffle([...Array(52).keys()]);
  for(let r=0;r<2;r++){ let i=G.dealer; for(let k=0;k<elig.length;k++){ i=nextSeat(i,p=>p.inHand); G.players[i].hand.push(G.deck.pop()); } }
  G.board=[G.deck.pop(),G.deck.pop(),G.deck.pop(),G.deck.pop(),G.deck.pop()];
  G.revealed=0; G.street=0; G.results=null; G.showHands=false; G.winCards=null; G.enc=[]; G.encHn=-1;
  log('Donne n°'+G.handNo+' · Donneur : '+G.players[G.dealer].name,true);
  post(G.sb,SB,'Petite blinde'); post(G.bb,BB,'Grosse blinde');
  G.currentBet=BB; G.minRaise=BB; G.phase='bet';
  G.toAct=nextSeat(G.bb,p=>canAct(p));
  if(roundComplete()){ G.toAct=-1; changed(); later(endRound,900); }
  else changed();
  if(S.mode==='host') encryptHands();
}
function post(i,amt,label){
  const p=G.players[i]; const a=Math.min(amt,p.chips);
  p.chips-=a; p.bet+=a; p.total+=a; if(p.chips===0) p.allIn=true;
  p.la=label+' '+a+' €'; log(p.name+' : '+p.la);
}
function put(p,a){ a=Math.min(a,p.chips); p.chips-=a; p.bet+=a; p.total+=a; if(p.chips===0) p.allIn=true; }
function roundComplete(){
  const live=liveP(); if(live.length<=1) return true;
  const actors=live.filter(p=>!p.allIn);
  if(actors.length===0) return true;
  if(actors.length===1&&actors[0].bet>=G.currentBet) return true;
  return actors.every(p=>p.acted&&p.bet===G.currentBet);
}
function doAction(seat,act){
  if(!G||G.phase!=='bet'||G.toAct!==seat) return false;
  const p=G.players[seat]; const toCall=Math.max(0,G.currentBet-p.bet);
  if(act.t==='fold'){ p.folded=true; p.la='Couché'; }
  else if(act.t==='check'){ if(toCall>0) return false; p.la='Check'; }
  else if(act.t==='call'){
    if(toCall<=0){ p.la='Check'; }
    else { const a=Math.min(toCall,p.chips); put(p,a); p.la=p.allIn?'Tapis ('+p.bet+' €)':'Suit '+a+' €'; }
  }
  else if(act.t==='raise'||act.t==='allin'){
    const max=p.bet+p.chips;
    let to=act.t==='allin'?max:Math.floor(+act.a);
    if(!(to>0)) return false;
    to=Math.min(to,max);
    if(to<=G.currentBet) return doAction(seat,{t:'call'});
    const minTo=G.currentBet+G.minRaise;
    if(to<minTo&&to<max) to=Math.min(minTo,max);
    const inc=to-G.currentBet; if(inc>=G.minRaise) G.minRaise=inc;
    const wasBet=G.currentBet===0;
    put(p,to-p.bet); G.currentBet=to;
    G.players.forEach(q=>{ if(q!==p) q.acted=false; });
    p.la=p.allIn?'Tapis ('+to+' €)':(wasBet?'Mise ':'Relance à ')+to+' €';
  }
  else return false;
  p.acted=true; G.actionId++;
  log(p.name+' : '+p.la);
  advance();
  return true;
}
function advance(){
  const live=liveP();
  if(live.length===1){ awardUncontested(live[0]); return; }
  if(roundComplete()){ G.toAct=-1; changed(); later(endRound,850); return; }
  G.toAct=nextSeat(G.toAct,q=>canAct(q)&&(!q.acted||q.bet<G.currentBet));
  changed();
}
function endRound(){
  if(!G||(G.phase!=='bet'&&G.phase!=='runout')) return;
  G.players.forEach(p=>{ p.bet=0; p.acted=false; p.raises=0; if(!p.folded&&!p.allIn) p.la=''; });
  G.currentBet=0; G.minRaise=BB; G.actionId++;
  if(G.street>=3){ showdown(); return; }
  G.street++; G.revealed=G.street===1?3:G.street===2?4:5;
  log(STREETS[G.street]+' : '+G.board.slice(G.street===1?0:G.revealed-1,G.revealed).map(cardTxt).join(' '),true);
  const actors=liveP().filter(p=>!p.allIn);
  if(actors.length<=1){ G.phase='runout'; G.toAct=-1; changed(); later(endRound,1400); return; }
  G.phase='bet';
  G.toAct=nextSeat(G.dealer,q=>canAct(q));
  changed();
}
function awardUncontested(p){
  const amt=potTotal(); p.chips+=amt;
  G.players.forEach(q=>{ q.bet=0; });
  G.results=[{i:G.players.indexOf(p),n:p.name,amt,desc:'tous les autres se sont couchés'}];
  log(p.name+' remporte '+amt+' €',true);
  finishHand();
}
function showdown(){
  G.revealed=5; G.showHands=true;
  const live=liveP(); const n=G.players.length;
  live.forEach(p=>{ const e=bestOf(p.hand.concat(G.board)); p.ev=e; p.hd=handName(e); log(p.name+' montre '+p.hand.map(cardTxt).join(' ')+' — '+p.hd); });
  const contrib=G.players.map(p=>p.total);
  const tiers=[...new Set(contrib.filter(x=>x>0))].sort((a,b)=>a-b);
  const won=new Array(n).fill(0); let prev=0; let mainWinners=null;
  for(const t of tiers){
    let slice=0; contrib.forEach(c=>{ slice+=Math.min(c,t)-Math.min(c,prev); });
    let elig=G.players.map((p,i)=>i).filter(i=>G.players[i].inHand&&!G.players[i].folded&&contrib[i]>=t);
    if(!elig.length) elig=G.players.map((p,i)=>i).filter(i=>G.players[i].inHand&&!G.players[i].folded);
    const best=Math.max(...elig.map(i=>G.players[i].ev.score));
    const winners=elig.filter(i=>G.players[i].ev.score===best);
    if(!mainWinners) mainWinners=winners;
    const share=Math.floor(slice/winners.length); let rem=slice-share*winners.length;
    winners.forEach(i=>won[i]+=share);
    if(rem>0){ const order=[]; let s=G.dealer; for(let k=0;k<n;k++){ s=(s+1)%n; if(winners.includes(s)) order.push(s); } for(let k=0;rem>0;k++,rem--) won[order[k%order.length]]++; }
    prev=t;
  }
  G.results=[];
  won.forEach((amt,i)=>{ if(amt>0){ const p=G.players[i]; p.chips+=amt; G.results.push({i,n:p.name,amt,desc:p.hd}); log(p.name+' remporte '+amt+' € avec '+p.hd,true); } });
  G.winCards=mainWinners&&mainWinners.length?G.players[mainWinners[0]].ev.cards:null;
  finishHand();
}
function finishHand(){
  G.phase='showdown'; G.toAct=-1; G.actionId++;
  G.players.forEach(p=>{ p.bet=0; if(p.chips<=0){ p.out=true; } });
  endGameCheck(false);
  changed();
  if(S.mode==='host'&&!G.over){ const hn=G.handNo; later(()=>{ if(G&&G.handNo===hn&&G.phase==='showdown'&&!G.over) startHand(); },11000); }
}
function endGameCheck(force){
  const rem=G.players.filter(eligible);
  if(rem.length<2){
    const w=rem[0]||G.players.slice().sort((a,b)=>b.chips-a.chips)[0];
    const isMe=G.players.indexOf(w)===S.mySeat;
    G.over={title:isMe?'Vous remportez la partie !':w.name+' remporte la partie !',sub:'Avec '+w.chips+' € au total.'};
    G.phase='showdown';
  } else if(S.mode==='local'&&G.players[0].out){
    G.over={title:'Vous êtes éliminé',sub:'Il reste '+rem.length+' joueurs en lice.',lost:true};
  }
}
function nextHand(){ if(G&&G.phase==='showdown'&&!G.over) startHand(); }

/* ================= IA ================= */
function aiMove(seat){
  const p=G.players[seat], st=p.style;
  const board=G.board.slice(0,G.revealed);
  const opp=Math.max(1,G.players.filter((q,i)=>i!==seat&&q.inHand&&!q.folded).length);
  const eq=equity(p.hand,board,opp,G.revealed===0?220:320);
  const toCall=Math.max(0,G.currentBet-p.bet);
  const pot=potTotal();
  const odds=toCall>0?toCall/(pot+toCall):0;
  const rel=eq*(opp+1);
  const r=Math.random();
  const maxTo=p.bet+p.chips;
  const canRaise=p.raises<2&&maxTo>G.currentBet&&p.chips>toCall;
  const raiseTo=f=>{ let to=G.currentBet+Math.max(G.minRaise,Math.round(pot*f*st.aggr)); if(to>=maxTo*0.8) to=maxTo; return to>=maxTo?{t:'allin'}:{t:'raise',a:to}; };
  let act;
  if((eq>0.8||rel>2.2)&&canRaise){ act=(eq>0.88&&G.street>=2&&r<0.45)?{t:'allin'}:raiseTo(0.55+r*0.5); }
  else if(rel>1.4&&canRaise&&r<0.55*st.aggr){ act=raiseTo(0.4+r*0.3); }
  else if(toCall===0){ act=(canRaise&&r<st.bluff)?raiseTo(0.5):{t:'check'}; }
  else{
    const commit=toCall/(p.chips+0.01);
    const need=odds+(commit>0.5?0.12:0)+st.tight;
    if(eq>=need) act={t:'call'};
    else if(toCall<=BB&&r<0.35) act={t:'call'};
    else act={t:'fold'};
  }
  if(act.t==='raise'||act.t==='allin') p.raises++;
  doAction(seat,act);
}
function schedule(){
  if(!G||G.phase!=='bet'||G.toAct<0) return;
  const seat=G.toAct, aid=G.actionId, p=G.players[seat];
  if(S.mode==='guest') return;
  if(p.isAI) later(()=>{ if(G&&G.actionId===aid&&G.toAct===seat&&G.phase==='bet') aiMove(seat); },650+Math.random()*900);
  else if(p.left) later(()=>{ if(G&&G.actionId===aid&&G.toAct===seat&&G.phase==='bet') doAction(seat,{t:G.currentBet>p.bet?'fold':'check'}); },1200);
}
function changed(){ renderAll(); if(S.mode==='host') publishHost(); schedule(); }

/* ================= VUE ================= */
function buildView(viewer){

    board:G.board.slice(0,G.revealed),
    pl:G.players.map((p,i)=>({n:p.name,c:p.chips,b:p.bet,ih:p.inHand,f:p.folded,a:p.allIn,o:p.out,ai:p.isAI,l:p.left,la:p.la,
      h:(show&&p.inHand&&!p.folded)?p.hand:null,hd:(show&&p.inHand&&!p.folded)?p.hd:null})),

}

const POS={1:['bottom'],2:['bottom','top'],3:['bottom','tl','tr'],4:['bottom','left','top','right']};

function cardHTML(c,cls){

function renderGame(v,me,myCards){

    if(!v.over){

function renderActionBar(v,me){
  const el=$('#actionBar');

  const pending=S.mode==='guest'&&net.pendingAid===v.aid;
  const key=[v.hn,v.aid,me,myTurn,pending,v.phase,v.ta].join('|');
  if(key===abKey) return; abKey=key;
  if(!myTurn||pending){
    let msg='';
    if(!p) msg='Vous regardez la partie';
    else if(p.o) msg='Vous êtes éliminé — vous pouvez regarder la suite';
    else if(pending) msg='Action envoyée…';
    else if(v.phase==='bet'&&v.ta>=0) msg=(p.f?'Vous êtes couché · ':'')+'Au tour de '+esc(v.pl[v.ta].n)+'…';
    else if(v.phase==='runout') msg='Dévoilement des cartes…';
    else if(v.phase==='bet') msg='…';
    el.innerHTML='<div class="wait">'+msg+'</div>'; return;
  }
  const toCall=Math.max(0,v.cb-p.b), maxTo=p.b+p.c;
  const canRaise=maxTo>v.cb&&p.c>toCall;
  const minTo=Math.min(maxTo,v.cb===0?BB:v.cb+v.mr);
  let h='<button class="act fold" data-a="fold">Se coucher</button>';
  h+=toCall===0?'<button class="act check" data-a="check">Checker</button>'
    :'<button class="act call" data-a="call">'+(toCall>=p.c?'Suivre · Tapis '+p.c+' €':'Suivre '+toCall+' €')+'</button>';
  if(canRaise){
    const potAfter=v.pot+toCall;
    const cl=x=>Math.max(minTo,Math.min(maxTo,Math.round(x)));
    h+='<div class="raise"><div class="quick"><button data-q="'+minTo+'">Min</button><button data-q="'+cl(v.cb+potAfter/2)+'">½ Pot</button><button data-q="'+cl(v.cb+potAfter)+'">Pot</button><button data-q="'+maxTo+'">Tapis</button></div>'+
       '<div class="rrow"><input type="range" id="rs" min="'+minTo+'" max="'+maxTo+'" step="1" value="'+minTo+'"><button class="act raise-btn" data-a="raise" id="rb"></button></div></div>';
  }
  el.innerHTML=h;
  const rs=$('#rs'), rb=$('#rb');
  const upd=()=>{ const x=+rs.value; rb.textContent=x>=maxTo?'Tapis '+x+' €':(v.cb===0?'Miser ':'Relancer à ')+x+' €'; };
  if(rs){ rs.oninput=upd; upd(); el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ rs.value=b.dataset.q; upd(); }); }
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==='raise'){ const x=+rs.value; sendAction(x>=maxTo?{t:'allin'}:{t:'raise',a:x}); }
    else sendAction({t:a});
  });
}
function sendAction(act){
  if(S.mode==='guest'){
    const v=net.hostG&&net.hostG.view; if(!v||!net.nr) return;
    net.actId++;
    net.nr.presence({act:{id:net.actId,hn:v.hn,aid:v.aid,t:act.t,a:act.a||0}}).catch(()=>{});
    net.pendingAid=v.aid; renderAll();
    const aid=v.aid; setTimeout(()=>{ if(net.pendingAid===aid){ net.pendingAid=null; abKey=''; renderAll(); } },5000);
  } else doAction(S.mySeat,act);
}
function showOverlay(html){ const o=$('#overlay'); o.innerHTML='<div class="panel">'+html+'</div>'; o.classList.remove('hidden'); }
function hideOverlay(){ $('#overlay').classList.add('hidden'); }

  if(x.dataset.x==='menu') quit();
  if(x.dataset.x==='again'){ hideOverlay(); restartGame(); }
});

try{ const n=localStorage.getItem('pokerName'); if(n) $('#nameIn').value=n; }catch(e){}
function readName(){ S.name=cleanName($('#nameIn').value); try{ localStorage.setItem('pokerName',S.name); }catch(e){} return S.name; }
$('#aiSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#aiSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.aiN=+b.dataset.n; });
$('#playLocal').onclick=()=>{
  readName(); S.mode='local'; S.mySeat=0;

  newGame(ps);

$('#quitBtn').onclick=()=>quit();
async function quit(){
  clearTimers();
  const nr=net.nr; net=freshNet(); G=null; S.mode=null; abKey=''; lastDealHn=-1;
  if(nr){ try{ await nr.leave(); }catch(e){} }
  hideOverlay(); showScreen('menu');
}

/* ================= RÉSEAU ================= */
let ROOM=null, roomTried=false;
async function initRoom(){
  for(let i=0;i<60&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  try{ if(window.claude&&window.claude.use) ROOM=await window.claude.use('room'); }catch(e){ ROOM=null; }
  roomTried=true; updateNetNote();
}
function updateNetNote(msg){
  const ok=!!ROOM;
  $('#hostBtn').disabled=!ok; $('#joinBtn').disabled=!ok;
  $('#netNote').textContent=msg||(ok?'Hébergez une partie et donnez le code à vos amis, ou saisissez le code reçu.':(roomTried?'Le jeu en réseau fonctionne quand cette page est ouverte sur claude.ai et partagée avec vos amis.':'Connexion au réseau…'));
}
initRoom();

const HAS_SUBTLE=!!(window.crypto&&crypto.subtle);
const b64=buf=>{ const u=new Uint8Array(buf); let s=''; for(const x of u) s+=String.fromCharCode(x); return btoa(s); };
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function makeKeys(){
  if(!HAS_SUBTLE) return;
  try{ net.kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']); net.pk=b64(await crypto.subtle.exportKey('raw',net.kp.publicKey)); }
  catch(e){ net.kp=null; net.pk=null; }
}
async function derive(pk){
  const pub=await crypto.subtle.importKey('raw',unb64(pk),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:pub},net.kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function keyFor(pk){ if(!net.keyCache[pk]) net.keyCache[pk]=derive(pk); return net.keyCache[pk]; }
async function encCards(pk,arr){
  if(!pk||pk==='none'||!net.kp) return 'p:'+arr.join(',');
  const key=await keyFor(pk); const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new Uint8Array(arr)));
  const out=new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return b64(out);
}
async function decCards(pk,s){
  if(s.startsWith('p:')) return s.slice(2).split(',').map(Number);
  if(!pk||!net.kp) throw new Error('no key');
  const key=await keyFor(pk); const d=unb64(s);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12));
  return [...new Uint8Array(pt)];
}
function genCode(){ const A='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<5;i++) s+=A[rint(A.length)]; return s; }

/* ---- Hôte ---- */
$('#hostBtn').onclick=async()=>{
  if(!ROOM) return; readName();
  $('#hostBtn').disabled=true; updateNetNote('Création de la partie…');
  net=freshNet(); net.code=genCode();
  try{
    await makeKeys();
    net.nr=await ROOM.join('poker-'+net.code);
  }catch(e){ net=freshNet(); updateNetNote('Impossible de créer la partie. Réessayez.'); $('#hostBtn').disabled=false; return; }
  S.mode='host'; S.mySeat=0; G=null;
  net.seats=[{peer:null,n:S.name,host:true}]; net.aiN=0;
  net.nr.onPeers(hostPeers,()=>{});
  updateNetNote();
  renderLobby(); publishHost();
};
function publishHost(){
  if(S.mode!=='host'||!net.nr) return;
  const seats=G?G.players.map((p,i)=>({p:i===0?net.myPeer:p.peer,n:p.name,ai:p.isAI}))
              :net.seats.map(s=>({p:s.peer,n:s.n,ai:false}));
  const o={role:'host',code:net.code,name:S.name,pk:net.pk||null,started:!!G,seats,aiN:net.aiN,
    view:G?buildView(-1):null,enc:(G&&G.encHn===G.handNo)?G.enc:null,hn:G?G.handNo:0};
  const size=()=>new TextEncoder().encode(JSON.stringify({g:o})).length;
  if(o.view&&size()>3900){ o.view.log=o.view.log.slice(-3); if(size()>3900) o.view.log=[]; }
  net.nr.presence({g:o}).catch(()=>{});
}
function hostPeers(ch){
  const me=ch.peers.find(p=>p.sameTab); if(me&&me.peer!==net.myPeer){ net.myPeer=me.peer; if(net.seats[0]) net.seats[0].peer=me.peer; if(G) G.players[0].peer=me.peer; }
  let dirty=false;
  for(const p of ch.peers){
    if(p.sameTab) continue;
    const pr=p.presence||{};
    if(pr.role!=='guest'||pr.code!==net.code) continue;
    const name=cleanName(pr.name);
    if(!G){
      const s=net.seats.find(x=>x.peer===p.peer);
      if(!s){ if(net.seats.length<MAXP){ net.seats.push({peer:p.peer,n:name}); net.lastAct[p.peer]=(pr.act&&pr.act.id)||0; dirty=true; } }
      else if(s.n!==name){ s.n=name; dirty=true; }
    } else {
      const i=G.players.findIndex(q=>q.peer===p.peer);
      if(i<0){
        const j=G.players.findIndex(q=>q.left&&!q.isAI&&q.name===name);
        if(j>0){ G.players[j].peer=p.peer; G.players[j].left=false; if(G.enc) G.enc[j]=null; net.lastAct[p.peer]=(pr.act&&pr.act.id)||0; log(name+' est de retour (prochaine donne)'); dirty=true; }
      } else processAct(i,p.peer,pr.act);
    }
  }
  for(const p of ch.left){
    if(!G){ const k=net.seats.findIndex(s=>s.peer===p.peer); if(k>0){ net.seats.splice(k,1); dirty=true; } }
    else { const i=G.players.findIndex(q=>q.peer===p.peer); if(i>0&&!G.players[i].left){ G.players[i].left=true; log(G.players[i].name+' a quitté la table'); dirty=true; } }
  }
  if(!G) net.aiN=Math.min(net.aiN,MAXP-net.seats.length);
  if(dirty){ if(G) changed(); else { renderLobby(); publishHost(); } }
  if(G&&G.players.some((q,i)=>i>0&&!q.isAI&&q.peer&&q.inHand&&!(G.encHn===G.handNo&&G.enc[i]))) encryptHands();
}
function processAct(i,peer,act){
  if(!act||typeof act.id!=='number') return;
  if(act.id<=(net.lastAct[peer]||0)) return;
  net.lastAct[peer]=act.id;
  if(!G||G.phase!=='bet'||G.toAct!==i||act.hn!==G.handNo||act.aid!==G.actionId) return;
  if(!['fold','check','call','raise','allin'].includes(act.t)) return;
  doAction(i,{t:act.t,a:+act.a||0});
}
async function encryptHands(){
  if(S.mode!=='host'||!G||net.encBusy) return;
  net.encBusy=true;
  try{
    const hn=G.handNo;
    const enc=(G.encHn===hn&&G.enc)?G.enc.slice():[];
    const peers=net.nr?net.nr.peers():[];
    for(let i=1;i<G.players.length;i++){
      const p=G.players[i];
      if(p.isAI||!p.peer||!p.inHand){ enc[i]=null; continue; }
      if(enc[i]) continue;
      const pr=((peers.find(x=>x.peer===p.peer)||{}).presence)||{};
      if(pr.pk===undefined){ enc[i]=null; continue; }
      enc[i]=await encCards(pr.pk,[p.hand[0],p.hand[1],hn&255]);
      if(!G||G.handNo!==hn) return;
    }
    G.enc=enc; G.encHn=hn; publishHost();
  }catch(e){ console.warn(e); }
  finally{ net.encBusy=false; if(G&&S.mode==='host'&&G.encHn!==G.handNo) setTimeout(encryptHands,60); }
}
function hostStart(){
  const ps=net.seats.map((s,i)=>makePlayer(s.n,false,i===0?net.myPeer:s.peer));
  pickAINames(net.aiN,ps.map(p=>p.name)).forEach(n=>ps.push(makePlayer(n,true)));
  hideOverlay(); newGame(ps);
}

/* ---- Invité ---- */
$('#joinBtn').onclick=async()=>{
  if(!ROOM) return;
  const code=$('#codeIn').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(code.length<4){ updateNetNote('Saisissez le code de la partie (5 caractères).'); return; }
  readName(); $('#joinBtn').disabled=true; updateNetNote('Connexion à la partie…');
  net=freshNet(); net.code=code;
  try{
    await makeKeys();
    net.nr=await ROOM.join('poker-'+code);
  }catch(e){ net=freshNet(); updateNetNote('Connexion impossible. Vérifiez le code et réessayez.'); $('#joinBtn').disabled=false; return; }
  S.mode='guest'; G=null;
  net.nr.onPeers(guestPeers,()=>{});
  net.nr.presence({role:'guest',code,name:S.name,pk:net.pk||'none',act:null}).catch(()=>{});
  updateNetNote();
  renderLobby();
  setTimeout(()=>{ if(S.mode==='guest'&&!net.hostSeen){ net.notFound=true; renderLobby(); } },9000);
};
function guestPeers(ch){
  const me=ch.peers.find(p=>p.sameTab); if(me) net.myPeer=me.peer;
  const h=ch.peers.find(p=>!p.sameTab&&p.presence&&p.presence.g&&p.presence.g.role==='host'&&p.presence.g.code===net.code);
  if(!h){ if(net.hostSeen){ net.hostGone=true; renderAll(); } return; }
  net.hostSeen=true; net.hostGone=false; net.notFound=false;
  const g=h.presence.g; net.hostG=g;
  net.mySeat=net.myPeer?g.seats.findIndex(s=>s.p===net.myPeer):-1;
  if(g.view&&net.pendingAid!==null&&g.view.aid!==net.pendingAid) net.pendingAid=null;
  guestUpdateHand(g);
  renderAll();
}
async function guestUpdateHand(g){
  const s=net.mySeat; if(s<0||!g.enc||!g.view) return;
  const e=g.enc[s]; if(!e||e===net.lastEnc) return;
  net.lastEnc=e;
  try{
    const cards=await decCards(g.pk,e);
    if(cards[2]===(g.hn&255)){ net.myHand={hn:g.hn,cards:[cards[0],cards[1]]}; renderAll(); }
  }catch(err){ console.warn(err); net.lastEnc=null; }
}

/* ---- Salon ---- */
function renderLobby(){
  showScreen('lobby'); hideOverlay();
  const box=$('#lobbyBox'); const isHost=S.mode==='host';
  const g=net.hostG;
  let seats,aiN;
  if(isHost){ seats=net.seats.map((s,i)=>({n:s.n,host:i===0,me:i===0})); aiN=net.aiN; }
  else { seats=g?g.seats.map((s,i)=>({n:s.n,host:i===0,me:s.p&&s.p===net.myPeer})):[]; aiN=g?g.aiN:0; }
  let h='<h2>Salon de jeu</h2>';
  h+='<p class="muted">Code de la partie à partager :</p><div class="codebig">'+esc(net.code.toUpperCase())+'</div>';
  if(!isHost&&net.notFound&&!g){
    h+='<p class="muted">Aucune partie trouvée avec ce code. Vérifiez le code, ou demandez à l’hôte s’il a bien ouvert le salon.</p>';
  } else if(!isHost&&net.hostGone){
    h+='<p class="muted">L’hôte a quitté le salon.</p>';
  } else {
    h+='<ul class="plist">';
    seats.forEach(s=>{ h+='<li><span>'+(s.host?'👑 ':'')+esc(s.n)+(s.me?' <small>(vous)</small>':'')+'</span><small>'+(s.host?'Hôte':'Prêt')+'</small></li>'; });
    for(let i=0;i<aiN;i++) h+='<li><span>🤖 IA</span><small>Ordinateur</small></li>';
    for(let i=seats.length+aiN;i<MAXP;i++) h+='<li class="emptyslot">Place libre</li>';
    h+='</ul>';
    if(isHost){
      const maxAi=MAXP-seats.length;
      h+='<div class="row"><span class="muted">Compléter avec des IA</span><select id="aiSel">';
      for(let i=0;i<=maxAi;i++) h+='<option value="'+i+'"'+(i===aiN?' selected':'')+'>'+i+'</option>';
      h+='</select></div>';
      h+='<button class="btn gold" id="startBtn"'+(seats.length+aiN<2?' disabled':'')+'>Lancer la partie</button>';
      h+='<p class="muted" style="font-size:12.5px">Vos amis ouvrent cette même page (partagée depuis claude.ai), cliquent sur « Rejoindre » et saisissent le code.</p>';
    } else {
      h+='<p class="muted">'+(!g?'Recherche de la partie…':(net.mySeat<0&&seats.length>=MAXP?'La table est complète : vous pourrez regarder la partie.':'En attente du lancement par l’hôte…'))+'</p>';
    }
  }
  h+='<button class="btn" id="leaveLobby">Quitter le salon</button>';
  box.innerHTML=h;
  $('#leaveLobby').onclick=()=>quit();
  const as=$('#aiSel'); if(as) as.onchange=()=>{ net.aiN=+as.value; renderLobby(); publishHost(); };
  const sb=$('#startBtn'); if(sb) sb.onclick=hostStart;
}
