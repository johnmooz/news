<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les fractions – CM2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdf8ef; --ink:#2b2a33; --muted:#6b6878; --line:#e6dccb;
    --fill:#f4a259; --fill2:#5b8e7d; --empty:#ffffff; --stroke:#2b2a33;
    --ok:#2f8f5b; --ko:#c8553d; --accent:#3d5a80; --card:#fffdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:28px 28px;min-height:100vh}
  header{padding:18px 16px 8px;max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:Fredoka,sans-serif;font-weight:600;margin:0;font-size:1.7rem}
  h1 small{display:block;font-family:Nunito;font-weight:600;color:var(--muted);font-size:.85rem}
  .score{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
  .score span{color:var(--accent)}
  nav{max-width:820px;margin:0 auto;padding:6px 16px;display:flex;gap:8px;overflow-x:auto}
  nav button{flex:0 0 auto;font:inherit;font-weight:800;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer}
  nav button.active{background:var(--ink);color:#fff}
  main{max-width:820px;margin:10px auto 40px;padding:0 16px}
  .card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
  .tip{font-size:.92rem;color:var(--muted);margin:0 0 12px;padding:8px 12px;border-left:4px solid var(--fill);background:#fff6ea;border-radius:6px}
  .prompt{font-size:1.25rem;font-weight:800;margin:4px 0 16px;line-height:1.5}
  .stage{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;margin:10px 0 18px}
  .discbox{display:flex;flex-direction:column;align-items:center;gap:6px}
  svg.disc{width:min(170px,40vw);height:auto;overflow:visible}
  svg.disc.small{width:min(120px,26vw)}
  .slice{fill:var(--empty);stroke:var(--stroke);stroke-width:1.2;transition:fill .15s}
  .slice.on{fill:var(--fill)}
  svg.alt .slice.on{fill:var(--fill2)}
  svg.click .slice{cursor:pointer}
  svg.click .slice:hover{fill:#ffe3c6}
  svg.click .slice.on:hover{fill:#e8893a}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:800}
  .frac>span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
  .frac.big{font-size:1.6rem}
  .answer{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:1.4rem;font-weight:800}
  .fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
  .fin hr{width:62px;border:0;border-top:3px solid var(--ink);margin:0}
  input.n{width:62px;font:inherit;font-size:1.3rem;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:4px;background:#fff}
  input.n:focus{outline:3px solid var(--fill);outline-offset:1px}
  .cmp{display:flex;gap:10px;justify-content:center}
  .cmp button{font:inherit;font-size:1.6rem;font-weight:800;width:62px;height:62px;border:2px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer}
  .cmp button.sel{background:var(--accent);color:#fff}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .btn{font:inherit;font-weight:800;font-size:1.05rem;border:2px solid var(--ink);border-radius:14px;padding:10px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn.go{background:var(--fill)}
  .btn.next{background:#fff}
  .btn.reset{background:#fff;font-size:.9rem;padding:6px 12px}
  .feedback{min-height:1.6em;text-align:center;font-weight:800;margin-top:14px;font-size:1.05rem;line-height:1.5}
  .feedback.ok{color:var(--ok)} .feedback.ko{color:var(--ko)}
  .count{color:var(--muted);font-weight:600;font-size:.95rem}
  .vs{font-family:Fredoka;font-size:1.5rem;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:24px}
</style>
</head>
<body>
<header>
  <h1>Les fractions 🍕<small>Exercices CM2 · représentation par disques</small></h1>
  <div class="score">Score : <span id="good">0</span> / <span id="total">0</span></div>
</header>
<nav id="tabs"></nav>
<main>
  <div class="card">
    <p class="tip" id="tip"></p>
    <div class="prompt" id="prompt"></div>
    <div class="stage" id="stage"></div>
    <div id="answer"></div>
    <div class="actions">
      <button class="btn go" id="check">Vérifier ✔</button>
      <button class="btn next" id="next">Question suivante →</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
</main>
<footer>Clique sur les parts d'un disque pour les colorier ou les effacer.</footer>

<script>
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const pgcd = (a,b) => b ? pgcd(b, a%b) : a;
const F = (n,d,big) => `<span class="frac${big?' big':''}"><span>${n}</span><span>${d}</span></span>`;
const plural = (n,w) => `${n} ${w}${n>1?'s':''}`;

/* ---------- Disque partagé en d parts ---------- */
function makeDisc(d, filled=0, {clickable=false, small=false, alt=false, onChange}={}) {
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','-2 -2 104 104');
  svg.classList.add('disc');
  if (small) svg.classList.add('small');
  if (alt) svg.classList.add('alt');
  if (clickable) svg.classList.add('click');
  const state = Array.from({length:d}, (_,i) => i < filled);
  const cx=50, cy=50, r=48;
  for (let i=0;i<d;i++){
    let el;
    if (d===1){ el=document.createElementNS(NS,'circle'); el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('r',r); }
    else {
      const a0=-Math.PI/2+2*Math.PI*i/d, a1=-Math.PI/2+2*Math.PI*(i+1)/d;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      el=document.createElementNS(NS,'path');
      el.setAttribute('d',`M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`);
    }
    el.classList.add('slice');
    if (state[i]) el.classList.add('on');
    if (clickable) el.addEventListener('click', () => {
      state[i]=!state[i]; el.classList.toggle('on', state[i]);
      onChange && onChange(svg.count());
    });
    svg.appendChild(el);
  }
  const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('cx',cx); ring.setAttribute('cy',cy); ring.setAttribute('r',r);
  ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--stroke)'); ring.setAttribute('stroke-width','2.5');
  ring.style.pointerEvents='none';
  svg.appendChild(ring);
  svg.count = () => state.filter(Boolean).length;
  return svg;
}
function discBox(svg, labelHTML=''){
  const b=document.createElement('div'); b.className='discbox'; b.appendChild(svg);
  if (labelHTML){ const l=document.createElement('div'); l.innerHTML=labelHTML; b.appendChild(l); }
  return b;
}
const fracInput = (id1,id2,d2) => `<span class="fin"><input class="n" id="${id1}" inputmode="numeric"><hr>${d2!==undefined?`<b>${d2}</b>`:`<input class="n" id="${id2}" inputmode="numeric">`}</span>`;
const val = id => { const v=$('#'+id).value.trim(); return v===''?NaN:parseInt(v,10); };

/* ---------- Les exercices ---------- */
let Q = {};
const modes = {
  lire: {
    label:'Lire une fraction',
    tip:'Le dénominateur (en bas) = nombre de parts égales du disque. Le numérateur (en haut) = nombre de parts coloriées.',
    gen(){
      const d=rand(2,12), n=rand(1,d-1); Q={n,d};
      $('#prompt').innerHTML='Quelle fraction du disque est coloriée ?';
      $('#stage').append(discBox(makeDisc(d,n)));
      $('#answer').innerHTML=`<div class="answer">${fracInput('a1','a2')}</div>`;
    },
    check(){
      const N=val('a1'), D=val('a2');
      if (isNaN(N)||isNaN(D)) return {msg:'Complète le numérateur et le dénominateur.'};
      if (N===Q.n && D===Q.d) return {ok:true,msg:`Bravo ! ${plural(Q.n,'part')} coloriée${Q.n>1?'s':''} sur ${Q.d} : ${F(Q.n,Q.d)}`};
      if (D>0 && N*Q.d===Q.n*D) return {ok:true,msg:`Juste : ${F(N,D)} = ${F(Q.n,Q.d)}. En comptant les parts, on écrit ${F(Q.n,Q.d)}.`};
      if (N===Q.d && D===Q.n) return {ok:false,msg:'Attention, tu as inversé ! Le nombre total de parts va en bas.'};
      return {ok:false,msg:`Pas tout à fait. Compte toutes les parts du disque, puis les parts coloriées.`};
    },
    solution(){ return `La réponse était ${F(Q.n,Q.d)}.`; }
  },

  colorier: {
    label:'Colorier',
    tip:'Clique sur les parts pour les colorier. Le dénominateur te dit en combien de parts le disque est partagé.',
    gen(){
      const d=rand(2,12), n=rand(1,d-1); Q={n,d};
      $('#prompt').innerHTML=`Colorie ${F(n,d,true)} du disque.`;
      const c=document.createElement('div'); c.className='count'; c.textContent='0 part coloriée';
      const disc=makeDisc(d,0,{clickable:true,onChange:k=>c.textContent=`${plural(k,'part')} coloriée${k>1?'s':''}`});
      Q.disc=disc;
      const box=discBox(disc); box.appendChild(c); $('#stage').append(box);
    },
    check(){
      const k=Q.disc.count();
      if (k===Q.n) return {ok:true,msg:`Parfait ! ${F(Q.n,Q.d)} = ${Q.n} part${Q.n>1?'s':''} sur ${Q.d}.`};
      return {ok:false,msg:`Tu as colorié ${plural(k,'part')}. Il en faut ${Q.n} sur ${Q.d}.`};
    },
    solution(){ return `Il fallait colorier ${Q.n} parts sur ${Q.d}.`; }
  },

  comparer: {
    label:'Comparer',
    tip:'Même dénominateur : on compare les numérateurs. Même numérateur : plus le dénominateur est grand, plus les parts sont petites.',
    gen(){
      const type=pick(['denom','num','mult']); let n1,d1,n2,d2;
      if (type==='denom'){ d1=d2=rand(3,12); n1=rand(1,d1-1); n2=rand(1,d1-1); }
      else if (type==='num'){ d1=rand(2,10); do{d2=rand(2,12);}while(d2===d1); n1=n2=rand(1,Math.min(d1,d2)-1); }
      else { d1=rand(2,6); const k=pick([2,3].filter(k=>d1*k<=12)); d2=d1*k; n1=rand(1,d1-1); n2=rand(1,d2-1); if(Math.random()<.3) n2=n1*k; }
      if (Math.random()<.5) [n1,d1,n2,d2]=[n2,d2,n1,d1];
      Q={n1,d1,n2,d2,type,choice:null};
      $('#prompt').innerHTML=`Compare ces deux fractions : choisis &lt;, = ou &gt;.`;
      $('#stage').append(discBox(makeDisc(d1,n1),F(n1,d1,true)));
      const vs=document.createElement('div'); vs.className='vs'; vs.textContent='?'; Q.vs=vs; $('#stage').append(vs);
      $('#stage').append(discBox(makeDisc(d2,n2,{alt:true}),F(n2,d2,true)));
      $('#answer').innerHTML=`<div class="cmp">${['<','=','>'].map(s=>`<button data-s="${s}">${s}</button>`).join('')}</div>`;
      document.querySelectorAll('.cmp button').forEach(b=>b.onclick=()=>{
        document.querySelectorAll('.cmp button').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel'); Q.choice=b.dataset.s; vs.textContent=b.dataset.s;
      });
    },
    truth(){ const a=Q.n1*Q.d2, b=Q.n2*Q.d1; return a<b?'<':a>b?'>':'='; },
    why(){
      const {n1,d1,n2,d2,type}=Q, s=this.truth();
      if (type==='denom') return `Même dénominateur (${d1}) : on compare ${n1} et ${n2}.`;
      if (type==='num') return `Même numérateur : des ${d1}ᵉˢ sont ${d1<d2?'plus grands':'plus petits'} que des ${d2}ᵉˢ.`;
      if (d2>d1){ const k=d2/d1; return `${F(n1,d1)} = ${F(n1*k,d2)}, donc on compare ${F(n1*k,d2)} ${s} ${F(n2,d2)}.`; }
      const k=d1/d2; return `${F(n2,d2)} = ${F(n2*k,d1)}, donc on compare ${F(n1,d1)} ${s} ${F(n2*k,d1)}.`;
    },
    check(){
      if (!Q.choice) return {msg:'Choisis un signe : <, = ou >.'};
      const t=this.truth();
      if (Q.choice===t) return {ok:true,msg:`Oui ! ${F(Q.n1,Q.d1)} ${t} ${F(Q.n2,Q.d2)}. ${this.why()}`};
      return {ok:false,msg:`Non, regarde bien les disques. Astuce : ${Q.type==='mult'?'transforme une fraction pour avoir le même dénominateur.':Q.type==='num'?'compare la taille des parts.':'compare le nombre de parts coloriées.'}`};
    },
    solution(){ return `${F(Q.n1,Q.d1)} ${this.truth()} ${F(Q.n2,Q.d2)}. ${this.why()}`; }
  },

  sup1: {
    label:'Plus grand que 1',
    tip:'Un disque entier = 1 unité. Quand le numérateur est plus grand que le dénominateur, la fraction dépasse 1.',
    gen(){
      const d=pick([2,3,4,5,6,8,10]), n=rand(d+1,3*d-1); Q={n,d};
      $('#prompt').innerHTML='Chaque disque représente une unité. Quelle fraction est coloriée ? Décompose-la ensuite.';
      let rest=n; const nb=Math.ceil(n/d);
      for (let i=0;i<nb;i++){ $('#stage').append(discBox(makeDisc(d,Math.min(d,rest),{small:true}))); rest-=d; }
      $('#answer').innerHTML=`<div class="answer">${fracInput('a1','a2')} <span>=</span> <input class="n" id="e" inputmode="numeric"> <span>+</span> ${fracInput('r',null,'?')}</div>`;
      $('#answer').querySelector('b').textContent='…';
      $('#a2').addEventListener('input',()=>{ $('#answer').querySelector('b').textContent=$('#a2').value||'…'; });
    },
    check(){
      const N=val('a1'), D=val('a2'), E=val('e'), R=val('r');
      if ([N,D,E,R].some(isNaN)) return {msg:'Complète toutes les cases (mets 0 s\'il ne reste rien).'};
      const E0=Math.floor(Q.n/Q.d), R0=Q.n%Q.d;
      if (!(N===Q.n && D===Q.d)) return {ok:false,msg:`La fraction n'est pas juste. Compte les parts coloriées dans tous les disques (chaque disque a ${Q.d} parts).`};
      if (E===E0 && R===R0) return {ok:true,msg:`Excellent ! ${F(Q.n,Q.d)} = ${E0} + ${F(R0,Q.d)}`};
      return {ok:false,msg:`La fraction est juste ! Mais la décomposition non : combien de disques entiers sont coloriés ?`};
    },
    solution(){ return `${F(Q.n,Q.d)} = ${Math.floor(Q.n/Q.d)} + ${F(Q.n%Q.d,Q.d)}`; }
  },

  egal: {
    label:'Fractions égales',
    tip:'Si on partage chaque part en 2 (ou 3…), on obtient la même quantité avec plus de parts : on multiplie numérateur et dénominateur par le même nombre.',
    gen(){
      const d1=pick([2,3,4,5,6]), k=pick([2,3,4].filter(k=>d1*k<=12)), d2=d1*k, n=rand(1,d1-1);
      Q={n,d1,d2,k};
      $('#prompt').innerHTML=`Colorie le 2ᵉ disque pour représenter la même quantité que ${F(n,d1,true)}, puis complète l'égalité.`;
      $('#stage').append(discBox(makeDisc(d1,n),F(n,d1,true)));
      const vs=document.createElement('div'); vs.className='vs'; vs.textContent='='; $('#stage').append(vs);
      Q.disc=makeDisc(d2,0,{clickable:true,alt:true});
      $('#stage').append(discBox(Q.disc,`<span class="frac big"><span>?</span><span>${d2}</span></span>`));
      $('#answer').innerHTML=`<div class="answer">${F(n,d1,true)} <span>=</span> ${fracInput('a1',null,d2)}</div>`;
    },
    check(){
      const c=Q.disc.count(), N=val('a1'), want=Q.n*Q.k;
      if (c!==want) return {ok:false,msg:`Le 2ᵉ disque n'a pas la même quantité coloriée (${plural(c,'part')}). Compare les deux disques !`};
      if (isNaN(N)) return {msg:'Bon coloriage ! Complète maintenant le numérateur.'};
      if (N===want) return {ok:true,msg:`Super ! ${F(Q.n,Q.d1)} = ${F(want,Q.d2)} (on a multiplié par ${Q.k} en haut et en bas).`};
      return {ok:false,msg:`Le coloriage est juste ! Compte les parts coloriées du 2ᵉ disque pour le numérateur.`};
    },
    solution(){ return `${F(Q.n,Q.d1)} = ${F(Q.n*Q.k,Q.d2)}`; }
  }
};

/* ---------- Moteur ---------- */
let current='lire', good=0, total=0, counted=false, tries=0, solved=false;
const tabs=$('#tabs');
Object.entries(modes).forEach(([key,m])=>{
  const b=document.createElement('button'); b.textContent=m.label; b.dataset.k=key;
  b.onclick=()=>{ current=key; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.k===key)); newQ(); };
  tabs.appendChild(b);
});
tabs.firstChild.classList.add('active');

function newQ(){
  $('#stage').innerHTML=''; $('#answer').innerHTML=''; $('#fb').innerHTML=''; $('#fb').className='feedback';
  counted=false; tries=0; solved=false; $('#check').disabled=false;
  const m=modes[current]; $('#tip').textContent='💡 '+m.tip; m.gen();
  const first=document.querySelector('#answer input'); if(first && window.innerWidth>700) first.focus();
}
function check(){
  if (solved) return;
  const m=modes[current], r=m.check();
  const fb=$('#fb');
  if (r.ok===undefined){ fb.className='feedback'; fb.innerHTML=r.msg; return; }
  if (!counted){ total++; if (r.ok) good++; counted=true; }
  tries++;
  if (r.ok){ solved=true; fb.className='feedback ok'; fb.innerHTML='✅ '+r.msg; }
  else { fb.className='feedback ko'; fb.innerHTML='❌ '+r.msg + (tries>=2?`<br><span style="color:var(--ink)">Solution : ${m.solution()}</span>`:'<br><span class="count">Essaie encore !</span>'); if(tries>=2) solved=true; }
  $('#good').textContent=good; $('#total').textContent=total;
}
$('#check').onclick=check;
$('#next').onclick=newQ;
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ solved?newQ():check(); } });
newQ();
</script>
</body>
</html>
