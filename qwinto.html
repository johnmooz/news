<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qwinto – Feuille de score</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#222;--panel:#eee;--line:#888;--cell:#fff;--o:#e8622c;--y:#f2d62a;--p:#5b3a8c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1f;--fg:#eee;--panel:#2b2b31;--line:#aaa;--cell:#fff}}
:root[data-theme="dark"]{--bg:#1b1b1f;--fg:#eee;--panel:#2b2b31;--line:#aaa;--cell:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:12px}
h1{font-size:22px;margin:0 0 10px}
h1 span{color:var(--o)}
.sheet{overflow-x:auto;padding-bottom:6px}
.grid{width:max-content}
.row{display:flex;gap:2px;padding:4px;margin-bottom:8px;border-radius:4px;width:max-content}
.row.o{background:var(--o);margin-left:calc(var(--w)*2)}
.row.y{background:var(--y);margin-left:var(--w)}
.row.p{background:var(--p)}
.row.o,.row.y,.row.p{--w:38px}
.sh{width:36px;height:36px}
.row.o .sh{background:var(--o)}.row.y .sh{background:var(--y)}.row.p .sh{background:var(--p)}
.c{width:36px;height:36px;border:2px solid #444;background:var(--cell);color:#111;text-align:center;font:600 15px system-ui;border-radius:50%;padding:0;-moz-appearance:textfield}
.c::-webkit-outer-spin-button,.c::-webkit-inner-spin-button{-webkit-appearance:none}
.c.pent{border-radius:0;border:0;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:#cfcfcf;width:36px}
.c.bad{background:#f66;animation:s .3s}
@keyframes s{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fails{display:flex;align-items:center;gap:6px;margin:6px 0 12px;font-weight:600;font-size:14px}
.f{width:38px;height:38px;border:2px solid var(--line);border-radius:6px;background:var(--cell);color:#c00;font:700 22px system-ui;cursor:pointer}
.final{background:var(--panel);border-radius:6px;padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700}
.final small{width:100%;font-size:13px;opacity:.8}
.b{min-width:40px;height:40px;border:2px solid var(--line);border-radius:6px;background:var(--cell);color:#111;display:flex;align-items:center;justify-content:center;font-size:18px}
.b.o{border-color:var(--o)}.b.y{border-color:var(--y)}.b.p{border-color:var(--p)}
.d{width:40px;height:40px;background:var(--line);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);display:flex;align-items:center;justify-content:center}
.d i{width:36px;height:36px;background:var(--cell);color:#111;font:700 16px system-ui;font-style:normal;clip-path:inherit;display:flex;align-items:center;justify-content:center;padding-top:4px}
.tot{min-width:70px;font-size:22px}
#msg{min-height:20px;font-size:13px;color:#d33;margin:2px 0 6px}
button.r{margin-top:10px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-weight:600}
select{padding:6px 8px;border-radius:6px;font-size:15px}
#tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:7px 12px;border-radius:6px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-weight:600}
.tab.on{background:var(--o);border-color:var(--o);color:#fff}
#dice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;font-weight:600}
.dw{position:relative}
.die{width:46px;height:46px;border-radius:9px;border:2px solid rgba(0,0,0,.35);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;cursor:pointer}
.die.s{width:40px;height:40px;padding:5px}
.pip{border-radius:50%;margin:1px}.pip.on{background:currentColor}
.z{grid-area:1/1/4/4;display:flex;align-items:center;justify-content:center;font:700 18px system-ui}
.pick{position:absolute;top:100%;left:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;width:196px;padding:6px;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#start{text-align:center;padding:24px 0}
#start p{margin:0 0 14px;font-weight:600}
.mode{display:block;width:100%;max-width:320px;margin:10px auto;padding:16px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:700 17px system-ui;cursor:pointer}
.mode small{display:block;font-weight:400;font-size:13px;margin-top:4px;opacity:.8}
#game[hidden],#start[hidden],#auto[hidden],#over[hidden]{display:none}
#auto{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;padding:10px;background:var(--panel);border-radius:8px;font-weight:600}
#auto button,.menu{padding:9px 14px;border-radius:6px;border:2px solid var(--line);background:var(--cell);color:#111;font-weight:700;cursor:pointer}
#auto button:disabled{opacity:.4;cursor:default}
#over{margin:12px 0;padding:12px;border-radius:8px;border:2px solid var(--o);background:var(--panel);font-weight:600;line-height:1.6}
</style>
</head>
<body>
<h1>Q<span>win</span>to – Feuille de score</h1>
<div id="start"><p>Choisis le mode de jeu :</p>
<button class="mode" data-m="manual">Jeu manuel<small>Tu saisis les dés et les nombres toi-même</small></button>
<button class="mode" data-m="auto">Jeu automatique<small>Lancer de dés, tours des joueurs, fin de partie automatique</small></button></div>
<div id="game" hidden>
<div class="bar"><button class="menu" id="menu">⬅ Mode</button><label>Joueurs : <select id="np"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><div id="tabs"></div></div>
<div id="auto" hidden><span id="turn"></span><button id="roll">🎲 Lancer les dés</button><button id="pass">Passer (✕ dé raté)</button></div>
<div id="dice"></div>
<div class="sheet"><div class="grid" id="grid"></div></div>
<div id="msg"></div>
<div id="over" hidden></div>
<div class="fails">Dés ratés (−5 chacun) :
<button class="f" data-i="0"></button><button class="f" data-i="1"></button><button class="f" data-i="2"></button><button class="f" data-i="3"></button></div>
<div class="final">
<small>Score final : lignes (orange, jaune, violet) + losanges − dés ratés</small>
<div class="b o" id="so">0</div><div class="b y" id="sy">0</div><div class="b p" id="sp">0</div>
<span>+</span>
<div class="d"><i id="d0"></i></div><div class="d"><i id="d1"></i></div><div class="d"><i id="d2"></i></div><div class="d"><i id="d3"></i></div><div class="d"><i id="d4"></i></div>
<span>−</span><div class="b" id="sf">0</div><span>=</span><div class="b tot" id="tot">0</div>
</div>
<button class="r" id="reset">Nouvelle partie</button>
</div>
<script>
const rows=[{k:'o',sh:3,pent:[1,5]},{k:'y',sh:5,pent:[7]},{k:'p',sh:4,pent:[2,9]}];
const players=Array.from({length:4},()=>({vals:rows.map(()=>Array(10).fill(null)),fails:[0,0,0,0],total:0}));
let cur=0,vals=players[0].vals,fails=players[0].fails;
const inputs=[], grid=document.getElementById('grid'), msg=document.getElementById('msg');
rows.forEach((r,ri)=>{
  const d=document.createElement('div'); d.className='row '+r.k; inputs[ri]=[];
  for(let i=0;i<10;i++){
    if(i===r.sh){const s=document.createElement('div');s.className='sh';d.appendChild(s);continue;}
    const e=document.createElement('input'); e.type='number'; e.min=1; e.max=18; e.inputMode='numeric';
    e.className='c'+(r.pent.includes(i)?' pent':'');
    e.addEventListener('change',()=>onChange(ri,i,e));
    e.addEventListener('click',()=>{
      if(over||e.value!=='')return;
      if(mode==='auto'&&!rolled){msg.textContent='Lance d\'abord les dés.';return;}
      if(dice[ri]===0){msg.textContent='Le dé '+dnm[ri]+' est à 0 : impossible de jouer sur la ligne '+dnm[ri]+'.';e.blur();return;}
      const t=diceTotal();
      if(t>0){e.value=t;const ok=onChange(ri,i,e);e.blur();if(ok&&mode==='auto')afterPlace();}
      else if(mode==='auto')msg.textContent='Total 0 : tu dois passer.';
    });
    inputs[ri][i]=e; d.appendChild(e);
  }
  grid.appendChild(d);
});
function onChange(ri,i,e){
  const raw=e.value.trim();
  if(raw===''){vals[ri][i]=null;calc();return;}
  const v=Number(raw); let err='';
  if(!Number.isInteger(v)||v<1||v>18) err='Entrez un nombre entre 1 et 18.';
  else for(let j=0;j<10;j++){
    const w=vals[ri][j]; if(w===null||j===i) continue;
    if(j<i&&w>=v){err='Règle : un nombre doit être plus grand que ceux à sa gauche ('+w+').';break;}
    if(j>i&&w<=v){err='Règle : un nombre doit être plus petit que ceux à sa droite ('+w+').';break;}
  }
  if(err){e.classList.add('bad');msg.textContent=err;e.value=vals[ri][i]??'';setTimeout(()=>e.classList.remove('bad'),400);return false;}
  msg.textContent=''; vals[ri][i]=v; calc(); return true;
}
function rowScore(ri){
  const r=rows[ri]; const idx=[...Array(10).keys()].filter(i=>i!==r.sh);
  const f=idx.filter(i=>vals[ri][i]!==null);
  return f.length===9?vals[ri][idx[8]]:f.length;
}
function calc(){
  const s=[0,1,2].map(rowScore);
  ['so','sy','sp'].forEach((id,k)=>document.getElementById(id).textContent=s[k]);
  const pv=[];rows.forEach((r,ri)=>r.pent.forEach(i=>pv.push(vals[ri][i])));
  pv.forEach((v,k)=>document.getElementById('d'+k).textContent=v??'');
  const fp=fails.reduce((a,b)=>a+b,0)*5, pt=pv.reduce((a,b)=>a+(b||0),0);
  document.getElementById('sf').textContent=fp;
  const T=s[0]+s[1]+s[2]+pt-fp;document.getElementById('tot').textContent=T;players[cur].total=T;drawTabs();
}
document.querySelectorAll('.f').forEach(b=>b.addEventListener('click',()=>{
  if(mode==='auto')return; const i=+b.dataset.i; fails[i]=fails[i]?0:1; b.textContent=fails[i]?'✕':''; calc();
}));
let mode='manual',rolled=false,over=false;
function newGame(){
  players.forEach(p=>{p.vals.forEach(a=>a.fill(null));p.fails.fill(0);p.total=0;});
  dice.fill(0);rolled=false;over=false;
  document.getElementById('over').hidden=true;
  inputs.forEach(a=>a.forEach(e=>{e.value='';e.readOnly=(mode==='auto');}));
  drawDice(-1);pick(0);updateAuto();
}
document.getElementById('reset').addEventListener('click',()=>newGame());
const np=document.getElementById('np'),tabs=document.getElementById('tabs');
function drawTabs(){const n=+np.value;tabs.innerHTML='';for(let k=0;k<n;k++){const b=document.createElement('button');b.className='tab'+(k===cur?' on':'');b.textContent='J'+(k+1)+' : '+players[k].total;b.onclick=()=>{if(mode==='manual')pick(k);};tabs.appendChild(b);}}
function pick(k){cur=k;vals=players[k].vals;fails=players[k].fails;
 rows.forEach((r,ri)=>inputs[ri].forEach((e,i)=>{e.value=vals[ri][i]??'';}));
 document.querySelectorAll('.f').forEach((b,i)=>b.textContent=fails[i]?'✕':'');
 msg.textContent='';calc();}
np.onchange=()=>{if(mode==='auto'){newGame();return;}if(cur>=+np.value)cur=0;pick(cur);};
const dice=[0,0,0],dcol=['var(--o)','var(--y)','var(--p)'],dnm=['orange','jaune','violet'];
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function face(n){let h='';for(let q=0;q<9;q++)h+='<span class="pip'+(PIPS[n].includes(q)?' on':'')+'"></span>';return h;}
function diceTotal(){return dice[0]+dice[1]+dice[2];}
const dbox=document.getElementById('dice');
function drawDice(open){dbox.innerHTML='<span>Dés :</span>';dice.forEach((v,k)=>{const w=document.createElement('div');w.className='dw';
 const b=document.createElement('button');b.className='die';b.style.background=dcol[k];b.style.color=k===1?'#111':'#fff';b.title='Dé '+dnm[k];b.innerHTML=face(v);b.onclick=()=>{if(mode==='manual')drawDice(open===k?-1:k);};w.appendChild(b);
 if(open===k){const p=document.createElement('div');p.className='pick';for(let n=0;n<=6;n++){const o=document.createElement('button');o.className='die s';o.style.background=dcol[k];o.style.color=k===1?'#111':'#fff';o.innerHTML=face(n);o.onclick=()=>{dice[k]=n;drawDice(-1);};p.appendChild(o);}w.appendChild(p);}
 dbox.appendChild(w);});
 const t=document.createElement('span');t.textContent='Total : '+diceTotal();dbox.appendChild(t);}
/* ---- Mode automatique ---- */
const turnEl=document.getElementById('turn'),rollB=document.getElementById('roll'),passB=document.getElementById('pass'),overEl=document.getElementById('over');
function updateAuto(){
  if(mode!=='auto')return;
  turnEl.textContent=over?'Partie terminée':'Tour de J'+(cur+1)+' — '+(rolled?'place le total ou passe':'lance les dés');
  rollB.disabled=over||rolled;passB.disabled=over||!rolled;
}
rollB.onclick=()=>{
  if(over||rolled)return;
  for(let k=0;k<3;k++)dice[k]=Math.floor(Math.random()*7);
  rolled=true;drawDice(-1);updateAuto();
  msg.textContent=diceTotal()===0?'Total 0 : tu dois passer.':'';
};
passB.onclick=()=>{
  if(over||!rolled)return;
  const i=fails.indexOf(0);
  if(i>=0){fails[i]=1;document.querySelectorAll('.f')[i].textContent='✕';}
  calc();
  if(fails.every(x=>x===1)){endGame('4 dés ratés pour J'+(cur+1));return;}
  nextTurn();
};
function afterPlace(){
  const full=rows.filter((r,ri)=>vals[ri].filter(v=>v!==null).length===9).length;
  if(full>=2){endGame('J'+(cur+1)+' a terminé 2 lignes');return;}
  nextTurn();
}
function nextTurn(){
  cur=(cur+1)%(+np.value);rolled=false;dice.fill(0);
  drawDice(-1);pick(cur);updateAuto();
}
function endGame(reason){
  over=true;calc();updateAuto();
  const n=+np.value,sc=players.slice(0,n).map(p=>p.total),best=Math.max(...sc);
  const w=sc.map((s,k)=>s===best?'J'+(k+1):null).filter(Boolean);
  overEl.hidden=false;
  overEl.innerHTML='🏁 Fin de partie : '+reason+'.<br>'+sc.map((s,k)=>'J'+(k+1)+' : '+s).join(' · ')+'<br>'+(w.length>1?'Égalité : ':'Vainqueur : ')+w.join(', ');
}
function startMode(m){
  mode=m;
  document.getElementById('start').hidden=true;
  document.getElementById('game').hidden=false;
  document.getElementById('auto').hidden=(m!=='auto');
  newGame();
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
document.getElementById('menu').onclick=()=>{
  document.getElementById('game').hidden=true;
  document.getElementById('start').hidden=false;
};
</script>
</body>
</html>
