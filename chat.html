<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salon de chat</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff; color: #000;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px;
  }
  .card { width: 100%; max-width: 600px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  p.sub { color: #555; margin-bottom: 28px; font-size: 15px; }
  label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  input {
    width: 100%; font-size: 18px; padding: 14px 16px;
    border: 2px solid #000; border-radius: 0; background: #fff; color: #000; outline: none;
  }
  input:focus { box-shadow: 4px 4px 0 #000; }
  input:disabled { opacity: .4; }
  button {
    font-size: 16px; font-weight: 600; padding: 14px 22px; cursor: pointer;
    background: #000; color: #fff; border: 2px solid #000; border-radius: 0;
  }
  button:hover { background: #fff; color: #000; }
  button:disabled { opacity: .4; cursor: default; background: #000; color: #fff; }
  button.ghost { background: #fff; color: #000; }
  button.ghost:hover { background: #000; color: #fff; }
  button.icon { padding: 14px; width: 54px; font-size: 20px; line-height: 1; background: #fff; color: #000; }
  button.icon:hover { background: #000; color: #fff; }
  button.icon:disabled { background: #fff; color: #000; }
  button.icon.rec { background: #b00000; border-color: #b00000; color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row input { flex: 1; min-width: 0; }
  .hidden { display: none !important; }
  .me { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
  .idbox {
    border: 2px solid #000; padding: 18px; margin-bottom: 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .idbox .id { font-size: 30px; font-weight: 700; letter-spacing: 4px; }
  .status { font-size: 14px; color: #555; margin-top: 10px; min-height: 20px; }
  .status.err { color: #b00000; }
  .tag { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .8em; font-weight: 600; letter-spacing: 1px; border: 1.5px solid currentColor; padding: 1px 5px; margin-left: 6px; }

  /* Salon */
  .room-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .room-title { font-size: 20px; font-weight: 700; }
  .room-count { font-size: 13px; color: #555; margin-top: 2px; }
  .members { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; border: 2px solid #000; padding: 4px 8px; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1a9c3a; margin-right: 6px; }
  .chip.self { background: #000; color: #fff; }
  .chip .tag { font-size: 11px; padding: 0 4px; margin-left: 6px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { font-size: 15px; padding: 9px 12px; letter-spacing: 2px; text-transform: uppercase; flex: 1; min-width: 0; }
  .add-row button { font-size: 14px; padding: 9px 14px; }
  .add-status { font-size: 13px; min-height: 18px; margin-top: 6px; color: #555; }
  .add-status.err { color: #b00000; }

  .msgs { height: 50vh; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #000; margin-top: 8px; }
  .msg { max-width: 78%; padding: 10px 14px; font-size: 16px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
  .msg .meta { font-size: 11px; opacity: .75; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .msg .meta .tag { font-size: 10px; padding: 0 4px; margin: 0 6px 0 5px; }
  .msg .meta .time { font-weight: 400; }
  .msg.mine { align-self: flex-end; background: #000; color: #fff; }
  .msg.theirs { align-self: flex-start; background: #fff; color: #000; border: 2px solid #000; }
  .msg img { display: block; max-width: 100%; max-height: 320px; cursor: zoom-in; margin-top: 2px; }
  .msg audio { display: block; width: 240px; max-width: 100%; margin-top: 4px; }
  .sys { align-self: center; font-size: 13px; color: #777; text-align: center; }
  .chat-form { display: flex; gap: 8px; border-top: 2px solid #000; padding-top: 14px; }
  .chat-form input { flex: 1; min-width: 0; }
  .rec-info { font-size: 13px; color: #b00000; margin-top: 8px; min-height: 18px; }

  .viewer { position: fixed; inset: 0; background: rgba(255,255,255,.96); display: flex; align-items: center; justify-content: center; cursor: zoom-out; padding: 20px; }
  .viewer img { max-width: 100%; max-height: 100%; border: 2px solid #000; }

  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .chat-form button[type=submit] { padding: 14px 12px; }
    button.icon { width: 48px; padding: 12px; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- Étape 1 : pseudo -->
  <section id="step-name">
    <h1>Salon de chat</h1>
    <p class="sub">Choisis un pseudo pour obtenir ton identifiant de connexion.</p>
    <label for="name">Ton pseudo</label>
    <input id="name" maxlength="24" placeholder="ex. Jonathan" autocomplete="off">
    <div class="row"><button id="btn-start">Obtenir mon identifiant</button></div>
    <div class="status" id="status-name"></div>
  </section>

  <!-- Étape 2 : identifiant + connexion -->
  <section id="step-connect" class="hidden">
    <div class="me">Bonjour, <span id="me-name"></span></div>
    <label>Ton identifiant</label>
    <div class="idbox">
      <span class="id mono" id="my-id">······</span>
      <button class="ghost" id="btn-copy">Copier</button>
    </div>
    <label for="peer-id">Identifiant d'une personne (ou d'un membre du salon)</label>
    <div class="row" style="margin-top:0">
      <input id="peer-id" class="mono" maxlength="6" placeholder="ABC123" autocomplete="off" style="text-transform:uppercase;letter-spacing:3px">
      <button id="btn-connect">Rejoindre</button>
    </div>
    <div class="status" id="status-connect">Partage ton identifiant, ou entre celui de quelqu'un pour le rejoindre.</div>
  </section>

  <!-- Étape 3 : salon -->
  <section id="step-chat" class="hidden">
    <div class="room-head">
      <div>
        <div class="room-title">Salon</div>
        <div class="room-count" id="room-count"></div>
      </div>
      <button class="ghost" id="btn-leave">Quitter</button>
    </div>
    <div class="members" id="members"></div>
    <div class="add-row">
      <input id="add-id" class="mono" maxlength="6" placeholder="Ajouter : ABC123" autocomplete="off">
      <button id="btn-add">Ajouter</button>
    </div>
    <div class="add-status" id="add-status"></div>

    <div class="msgs" id="msgs"></div>
    <form class="chat-form" id="chat-form">
      <button type="button" class="icon" id="btn-photo" title="Envoyer une photo">📷</button>
      <button type="button" class="icon" id="btn-rec" title="Enregistrer un message vocal">🎤</button>
      <input id="msg" placeholder="Écris un message…" autocomplete="off">
      <button type="submit" id="btn-send">Envoyer</button>
      <input type="file" id="file" accept="image/*" class="hidden">
    </form>
    <div class="rec-info" id="rec-info"></div>
  </section>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans 0/O/1/I pour éviter les confusions
  const PREFIX = "chat2-";                             // évite les collisions sur le serveur PeerJS public
  const ID_RE = /^[A-Z2-9]{6}$/;
  const MAX_REC_SECONDS = 120;
  const MAX_IMG_SIDE = 1600;

  let myName = "", myId = "", peer = null, inRoom = false;
  const members = new Map();  // id -> { conn, name }  (personnes connectées)
  const pending = new Set();  // id en cours de connexion
  const manual = new Map();   // id -> élément de statut, pour les connexions lancées à la main

  const genId = () => Array.from({length: 6}, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join("");
  const show = id => ["step-name", "step-connect", "step-chat"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  const setStatus = (el, text, err = false) => { $(el).textContent = text; $(el).classList.toggle("err", err); };
  const shortId = full => String(full || "").replace(PREFIX, "").toUpperCase();

  // ---------- Étape 1 ----------
  $("name").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-start").click(); });
  $("name").focus();

  $("btn-start").addEventListener("click", () => {
    myName = $("name").value.trim();
    if (!myName) { setStatus("status-name", "Entre un pseudo.", true); return; }
    if (typeof Peer === "undefined") { setStatus("status-name", "Impossible de charger la bibliothèque de connexion (vérifie ta connexion internet).", true); return; }
    $("btn-start").disabled = true;
    setStatus("status-name", "Création de ton identifiant…");
    createPeer();
  });

  function createPeer(tries = 0) {
    const short = genId();
    peer = new Peer(PREFIX + short);

    peer.on("open", () => {
      myId = short;
      $("me-name").textContent = myName;
      $("my-id").textContent = short;
      show("step-connect");
      $("peer-id").focus();
    });

    peer.on("connection", c => setupConn(c, false));

    peer.on("error", err => {
      if (err.type === "unavailable-id" && tries < 5) { peer.destroy(); createPeer(tries + 1); return; }
      if (err.type === "peer-unavailable") {
        const m = /chat2-([A-Z2-9]{6})/i.exec(err.message || "");
        const id = m ? m[1].toUpperCase() : null;
        if (id) pending.delete(id);
        const el = id && manual.get(id);
        if (el) {
          manual.delete(id);
          setStatus(el, "Identifiant " + id + " introuvable : vérifie-le, et que sa page est bien ouverte.", true);
          $("btn-connect").disabled = false;
        }
        return;
      }
      const target = $("step-name").classList.contains("hidden") ? (inRoom ? "add-status" : "status-connect") : "status-name";
      setStatus(target, "Erreur de connexion (" + err.type + "). Réessaie.", true);
      $("btn-start").disabled = false;
      $("btn-connect").disabled = false;
    });

    peer.on("disconnected", () => { if (!peer.destroyed) peer.reconnect(); });
  }

  // ---------- Étape 2 ----------
  $("btn-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(myId); $("btn-copy").textContent = "Copié ✓"; }
    catch { $("btn-copy").textContent = "Sélectionne-le"; }
    setTimeout(() => $("btn-copy").textContent = "Copier", 1500);
  });

  $("peer-id").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-connect").click(); });
  $("btn-connect").addEventListener("click", () => {
    if (manualConnect($("peer-id").value, "status-connect")) $("btn-connect").disabled = true;
  });

  $("add-id").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-add").click(); });
  $("btn-add").addEventListener("click", () => {
    if (manualConnect($("add-id").value, "add-status")) $("add-id").value = "";
  });

  function manualConnect(raw, statusEl) {
    const id = raw.trim().toUpperCase();
    if (!ID_RE.test(id)) { setStatus(statusEl, "Un identifiant fait 6 caractères.", true); return false; }
    if (id === myId) { setStatus(statusEl, "C'est ton propre identifiant 🙂", true); return false; }
    if (members.has(id)) { setStatus(statusEl, members.get(id).name + " est déjà dans le salon.", true); return false; }
    manual.set(id, statusEl);
    setStatus(statusEl, "Connexion à " + id + "…");
    connectTo(id);
    return true;
  }

  // ---------- Réseau du salon ----------
  // Chaque participant est relié directement à tous les autres.
  // Quand deux personnes se connectent, chacune envoie à l'autre la liste de ses membres,
  // et chacun se connecte aux membres qu'il ne connaît pas encore : les salons fusionnent.
  function connectTo(id) {
    if (id === myId || members.has(id) || pending.has(id)) return;
    pending.add(id);
    setupConn(peer.connect(PREFIX + id, { reliable: true }), true);
  }

  function broadcast(obj) {
    members.forEach(m => { if (m.conn.open) m.conn.send(obj); });
  }

  function setupConn(c, outgoing) {
    const id = shortId(c.peer);
    c._outgoing = outgoing;
    if (!ID_RE.test(id)) { c.close(); return; }

    c.on("open", () => c.send({ type: "hello", name: myName }));

    c.on("data", d => {
      if (!d || typeof d !== "object") return;

      if (d.type === "hello") {
        pending.delete(id);
        const name = String(d.name || "Anonyme").slice(0, 24);
        const existing = members.get(id);

        if (existing && existing.conn !== c) {
          // Deux connexions vers la même personne (connexions croisées) :
          // on garde celle lancée par le plus petit identifiant, des deux côtés.
          const initiator = x => x._outgoing ? myId : id;
          if (initiator(c) < initiator(existing.conn)) {
            existing.conn._dropped = true; existing.conn.close();
            members.set(id, { conn: c, name });
          } else {
            c._dropped = true; c.close();
            return;
          }
        } else if (!existing) {
          members.set(id, { conn: c, name });
          const el = manual.get(id);
          if (el) { manual.delete(id); setStatus(el, ""); $("btn-connect").disabled = false; }
          enterRoom();
          sys(name + " (" + id + ") a rejoint le salon.");
        }
        c.send({ type: "peers", ids: [...members.keys()].filter(x => x !== id) });
        renderMembers();
        return;
      }

      const m = members.get(id);
      if (!m || m.conn !== c) return; // connexion non reconnue : on ignore

      if (d.type === "peers" && Array.isArray(d.ids)) {
        d.ids.slice(0, 50).forEach(x => { x = String(x).toUpperCase(); if (ID_RE.test(x)) connectTo(x); });
      } else if (d.type === "msg") {
        addMsg({ text: String(d.text).slice(0, 4000) }, m.name, id, false);
      } else if (d.type === "img" && typeof d.data === "string" && /^data:image\//.test(d.data)) {
        addMsg({ img: d.data }, m.name, id, false);
      } else if (d.type === "audio" && typeof d.data === "string" && /^data:audio\//.test(d.data)) {
        addMsg({ audio: d.data }, m.name, id, false);
      }
    });

    c.on("close", () => {
      pending.delete(id);
      if (c._dropped) return;
      const m = members.get(id);
      if (m && m.conn === c) {
        members.delete(id);
        if (inRoom) { sys(m.name + " (" + id + ") a quitté le salon."); renderMembers(); }
      }
    });

    c.on("error", () => {
      pending.delete(id);
      const el = manual.get(id);
      if (el) { manual.delete(id); setStatus(el, "La connexion à " + id + " a échoué. Réessaie.", true); $("btn-connect").disabled = false; }
    });
  }

  // ---------- Étape 3 : salon ----------
  function enterRoom() {
    if (inRoom) return;
    inRoom = true;
    $("msgs").innerHTML = "";
    setStatus("add-status", "");
    show("step-chat");
    sys("Salon ouvert. Pour faire venir quelqu'un, ajoute son identifiant, ou donne-lui le tien : " + myId + ".");
    $("msg").focus();
  }

  function renderMembers() {
    const box = $("members");
    box.innerHTML = "";
    const chip = (name, id, self) => {
      const c = document.createElement("span");
      c.className = "chip" + (self ? " self" : "");
      if (!self) { const dot = document.createElement("span"); dot.className = "dot"; c.append(dot); }
      const n = document.createElement("span"); n.textContent = self ? name + " (toi)" : name;
      const t = document.createElement("span"); t.className = "tag"; t.textContent = id;
      c.append(n, t);
      box.append(c);
    };
    chip(myName, myId, true);
    members.forEach((m, id) => chip(m.name, id, false));

    const n = members.size + 1;
    $("room-count").textContent = n + " participant" + (n > 1 ? "s" : "");
    const alone = members.size === 0;
    ["msg", "btn-photo", "btn-rec", "btn-send"].forEach(id => $(id).disabled = alone);
    $("msg").placeholder = alone ? "Tu es seul(e) dans le salon…" : "Écris un message…";
    if (alone) stopRecording(true);
  }

  $("chat-form").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("msg").value.trim();
    if (!text || !members.size) return;
    broadcast({ type: "msg", text });
    addMsg({ text }, myName, myId, true);
    $("msg").value = "";
  });

  $("btn-leave").addEventListener("click", () => {
    stopRecording(true);
    members.forEach(m => { m.conn._dropped = true; m.conn.close(); });
    members.clear(); pending.clear(); manual.clear();
    inRoom = false;
    $("btn-connect").disabled = false;
    $("peer-id").value = "";
    setStatus("status-connect", "Partage ton identifiant, ou entre celui de quelqu'un pour le rejoindre.");
    show("step-connect");
  });

  // ---------- Photo ----------
  $("btn-photo").addEventListener("click", () => $("file").click());

  $("file").addEventListener("change", async () => {
    const f = $("file").files[0];
    $("file").value = "";
    if (!f || !members.size) return;
    if (!f.type.startsWith("image/")) { sys("Ce fichier n'est pas une image."); return; }
    try {
      const data = await compressImage(f);
      broadcast({ type: "img", data });
      addMsg({ img: data }, myName, myId, true);
    } catch {
      sys("Impossible de lire cette image.");
    }
  });

  // Réduit la photo (max 1600 px, JPEG) pour qu'elle passe vite
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_IMG_SIDE / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }

  // ---------- Message vocal ----------
  let recorder = null, recStream = null, recChunks = [], recTimer = null, recStart = 0, recCancel = false;

  $("btn-rec").addEventListener("click", async () => {
    if (recorder) { stopRecording(false); return; }
    if (!members.size) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      sys("L'enregistrement audio n'est pas disponible dans ce navigateur (ou la page n'est pas en https).");
      return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      sys("Accès au micro refusé.");
      return;
    }
    recChunks = []; recCancel = false;
    recorder = new MediaRecorder(recStream);
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      recStream.getTracks().forEach(t => t.stop());
      const type = recorder.mimeType || "audio/webm";
      recorder = null; recStream = null;
      clearInterval(recTimer);
      $("btn-rec").classList.remove("rec");
      $("btn-rec").textContent = "🎤";
      $("btn-rec").title = "Enregistrer un message vocal";
      $("rec-info").textContent = "";
      if (recCancel || !recChunks.length || !members.size) return;
      const fr = new FileReader();
      fr.onload = () => {
        if (!members.size) return;
        broadcast({ type: "audio", data: fr.result });
        addMsg({ audio: fr.result }, myName, myId, true);
      };
      fr.readAsDataURL(new Blob(recChunks, { type }));
    };
    recorder.start();
    recStart = Date.now();
    $("btn-rec").classList.add("rec");
    $("btn-rec").textContent = "■";
    $("btn-rec").title = "Arrêter et envoyer";
    const tick = () => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      $("rec-info").textContent = "● Enregistrement " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " — clique sur ■ pour envoyer";
      if (s >= MAX_REC_SECONDS) stopRecording(false);
    };
    tick();
    recTimer = setInterval(tick, 250);
  });

  function stopRecording(cancel) {
    if (!recorder) return;
    recCancel = cancel;
    recorder.stop();
  }

  // ---------- Affichage ----------
  function addMsg(content, name, id, mine) {
    const div = document.createElement("div");
    div.className = "msg " + (mine ? "mine" : "theirs");

    const meta = document.createElement("div");
    meta.className = "meta";
    const n = document.createElement("span"); n.textContent = name;
    const t = document.createElement("span"); t.className = "tag"; t.textContent = id;
    const h = document.createElement("span"); h.className = "time";
    h.textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    meta.append(n, t, h);
    div.append(meta);

    if (content.text) {
      const body = document.createElement("div");
      body.textContent = content.text; // textContent : pas d'injection HTML possible
      div.append(body);
    } else if (content.img) {
      const img = document.createElement("img");
      img.src = content.img; img.alt = "Photo";
      img.onload = scrollDown;
      img.addEventListener("click", () => openViewer(content.img));
      div.append(img);
    } else if (content.audio) {
      const a = document.createElement("audio");
      a.controls = true; a.src = content.audio;
      div.append(a);
    }
    $("msgs").append(div);
    scrollDown();
  }

  function scrollDown() { $("msgs").scrollTop = $("msgs").scrollHeight; }

  function sys(text) {
    const div = document.createElement("div");
    div.className = "sys";
    div.textContent = text;
    $("msgs").append(div);
    scrollDown();
  }

  function openViewer(src) {
    const v = document.createElement("div");
    v.className = "viewer";
    const img = document.createElement("img"); img.src = src;
    v.append(img);
    v.addEventListener("click", () => v.remove());
    document.body.append(v);
  }
})();
</script>
</body>
