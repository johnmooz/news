<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YETI — remake web (Thomson TO9)</title>
<style>
:root{--pad:150px;--bez:#d8d2c2;--bez2:#bdb6a4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#181715;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:grid;place-items:center;gap:14px;padding:10px;grid-template-areas:"m";grid-template-columns:1fr}
body.touch.land #stage{grid-template-areas:"l m r";grid-template-columns:1fr auto 1fr}
body.touch.port #stage{grid-template-areas:"m m" "l r";grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:center}
#padL{grid-area:l}#monitor{grid-area:m}#padR{grid-area:r}
body:not(.touch) .pad{display:none}
#monitor{background:linear-gradient(180deg,var(--bez),var(--bez2));border-radius:16px;padding:14px 14px 6px;box-shadow:0 10px 30px #000a,inset 0 2px 0 #fff8,inset 0 -3px 0 #0002}
#screenwrap{position:relative;background:#000;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 3px #3a372f}
#scr{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#screenwrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000002a 2px 3px);border-radius:6px}
.brand{display:flex;justify-content:space-between;align-items:center;color:#4a463c;font-size:12px;letter-spacing:.18em;padding:6px 4px 2px;font-weight:700}
.brand b{color:#1d3c8f}
.led{width:8px;height:8px;border-radius:50%;background:#e22;box-shadow:0 0 6px #f44;display:inline-block;margin-left:8px;vertical-align:middle}
.pad{display:flex;align-items:center;justify-content:center}
.dpad{width:var(--pad);height:var(--pad);position:relative;touch-action:none;border-radius:50%;background:radial-gradient(circle,#2e2c28 0 60%,#232220 61%)}
.dpad .h,.dpad .v{position:absolute;background:#3d3a34;border-radius:8px;box-shadow:inset 0 2px 0 #fff2,0 3px 0 #0008}
.dpad .h{left:8%;right:8%;top:35%;bottom:35%}
.dpad .v{top:8%;bottom:8%;left:35%;right:35%}
.dpad span{position:absolute;color:#cfc8b6;font-size:calc(var(--pad)*.13);line-height:1;transform:translate(-50%,-50%);pointer-events:none;transition:color .05s}
.dpad span.on{color:#ffe14a;text-shadow:0 0 8px #ffe14a}
.au{left:50%;top:21%}.ad{left:50%;top:79%}.al{left:21%;top:50%}.ar{left:79%;top:50%}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px}
.jump{width:calc(var(--pad)*.78);height:calc(var(--pad)*.78);border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#ff6b5b,#c51f14 70%);color:#fff;font-weight:800;font-size:calc(var(--pad)*.12);letter-spacing:.05em;box-shadow:0 6px 0 #6d0f09,0 8px 18px #000a;touch-action:none}
.jump.on{transform:translateY(4px);box-shadow:0 2px 0 #6d0f09}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#100f0e;border-top:1px solid #2a2824}
#bar button{font:600 13px system-ui,sans-serif;background:linear-gradient(#ece6d6,#cfc7b2);color:#2a2620;border:none;border-radius:6px;padding:8px 12px;box-shadow:0 3px 0 #8d856f;cursor:pointer;touch-action:manipulation}
#bar button:active{transform:translateY(2px);box-shadow:0 1px 0 #8d856f}
#bar button.k1{background:linear-gradient(#5ff,#2bc)}#bar button.k2{background:linear-gradient(#ff7,#dc3)}#bar button.ke{background:linear-gradient(#f8f,#c4c)}
#bar .hint{font-size:12px;color:#9a937f;margin-left:6px}
body.touch #bar .hint{display:none}
body.intitle .ingame{display:none}body:not(.intitle) .intitle{display:none}
</style>

  for(let r=0;r<25;r++)for(let col=0;col<40;col++){const v=map[r*40+col],x=col*8,y=r*8;
    if(v>=3&&v<=8){platCell(g,x,y,v);if(v===3)ladCell(g,x,y,0);if(v===4)ladCell(g,x,y,1)}
    else if(v===1)ladCell(g,x,y,0);else if(v===2)ladCell(g,x,y,1);

  return c}

function stepEntities(){const S=G.S;
  // yéti lanceur
  if(G.yeti){const y=G.yeti;y.t--;if(y.ph==='lift'&&y.t<=0){y.ph='throw';y.t=3;{const B=S.ball;G.balls.push({x:B.x,y:B.y,m:B.m,dir:B.dir,lastLad:-1,scored:false})}SFX.throw()}else if(y.ph==='throw'&&y.t<=0){y.ph='idle';y.t=99}}
  if(S.path){if(--G.ballT<=0){G.ballT=every(S.ballEvery);if(G.yeti){G.yeti.ph='lift';G.yeti.t=4}}}
  if(S.kangEvery){if(--G.kangT<=0){G.kangT=every(S.kangEvery);G.kangs.push({i:0})}}
  for(const b of G.balls)stepBall(b,S.ball);
  G.balls=G.balls.filter(b=>!b.done);
  for(const k of G.kangs){k.i++;if(k.i>=KPATH.length)k.done=true}G.kangs=G.kangs.filter(k=>!k.done);
  for(const g of G.goats){stepGoat(g);if(--g.t<=0){g.f^=1;g.t=g.f?3:15+(Math.random()*30|0)}}
  if(G.walker){const w=G.walker;if(w.pause>0)w.pause--;else{const d=Math.sign(w.target-w.x);if(d===0){w.pause=10+(Math.random()*30|0);w.target=40+4*(Math.random()*57|0)}else{w.x+=4*d;w.dir=d;w.anim=(w.anim||0)+1}}}
  if(G.piston){const s=G.piston;if(s.wait>0)s.wait--;else if(++s.sub>=2){s.sub=0;s.pb+=4*s.dir;if(s.pb>=80){s.pb=80;s.dir=-1;s.wait=6;SFX.piston()}else if(s.pb<=48){s.pb=48;s.dir=1;s.wait=10}}}
  if(G.screw)G.screw.p=(G.screw.p+2)%72;
  for(const r of G.ropes){r.off+=r.dir;if(r.off>=5||r.off<=-5)r.dir=-r.dir}
  if(G.spring&&G.spring.squash>0)G.spring.squash--}

function stepBall(b,B){const isP=v=>v>=3&&v<=8;
  if(b.m==='fall'||b.m==='lad'){b.y+=4;const fy=b.y+8;let land=false;if(fy>=200){b.y=192;land=true}else if(!(fy&7)&&isP(cell(fy>>3,(b.x+4)>>3)))land=true;
    if(land){b.m='roll';const d=B.dirs[b.y+8];b.dir=d!==undefined?d:-b.dir;b.lastLad=-1}return}
  const fy=b.y+8,nx=b.x+4*b.dir;
  if(fy>=200){b.x=nx;if(nx<-10||nx>322)b.done=true;return}
  const c=(nx+4)>>3,v=cell(fy>>3,c);b.x=nx;
  if(!isP(v)||nx<0||nx>312){b.m='fall';return}
  if(v===3||v===4){const lc=v===3?c:c-1;if(b.x===lc*8+4&&b.lastLad!==lc){b.lastLad=lc;if(Math.random()<.5)b.m='lad'}}}
const GARC=[0,-4,-8,-10,-8,-4,0];
function goatSupported(x,fy){if(fy>=200)return x>=0&&x<=304;if(fy&7)return false;const v=cell(fy>>3,(x+8)>>3);return v>=3&&v<=8}
function stepGoat(g){
  if(g.m==='jump'){g.ji++;g.x+=4*g.dir;g.fy=g.base+GARC[g.ji];if(g.ji>=GARC.length-1){g.m='walk';g.fy=g.base}return}
  const c=g.x>>3;
  if(g.m==='climb'){g.fy+=4*g.vd;if(g.vd>0){if(g.fy>=200){g.fy=200;g.m='walk'}else if(!(g.fy&7)&&g.fy>g.start){const v=cell(g.fy>>3,c);if(v>=3&&v<=8)g.m='walk'}}
    else if(!(g.fy&7)&&cell(g.fy>>3,c)===3)g.m='walk';return}
  if(!(g.x&7)&&Math.random()<.35){if(g.fy<200&&cell(g.fy>>3,c)===3){g.m='climb';g.vd=1;g.start=g.fy;return}
    if(g.fy>8&&cell((g.fy-1)>>3,c)===1){g.m='climb';g.vd=-1;g.start=g.fy;return}}
  const nx=g.x+4*g.dir;if(nx<0||nx>304){g.dir=-g.dir;return}
  if(goatSupported(nx,g.fy)){g.x=nx;if(Math.random()<.02)g.dir=-g.dir;return}
  if(goatSupported(g.x+24*g.dir,g.fy)&&g.x+24*g.dir>=0&&g.x+24*g.dir<=304&&Math.random()<.75){g.m='jump';g.ji=0;g.base=g.fy;return}
  g.dir=-g.dir}
function leftArms(){const p=G.screw.p,a=[];for(let k=0;k<3;k++){const y=111+((p+24*k)%72);if(y<=175)a.push(y)}return a}
function rightArms(){const p=G.screw.p,a=[];for(let k=0;k<3;k++){const y=111+(((72-p)%72+24*k+12)%72);if(y<=175)a.push(y)}return a}
function tryCatch(p,prevY){// accroches spécifiques : liane, ressort, vis
  for(let i=0;i<G.ropes.length;i++){const r=G.ropes[i];if(Math.abs(p.x-(r.xu+r.off))<=1&&p.y>=r.ay+6&&p.y<=r.ay+18){p.st='rope';p.rope=i;p.x=r.xu+r.off;p.y=r.ay+14;return true}}
  if(G.spring&&prevY<134&&p.y>=134&&p.x>=42&&p.x<=46){p.st='spring';p.y=134;p.x=44;G.spring.squash=3;if(!(p.jy0<134))p.jy0=94;SFX.spring();return true}
  if(G.screw&&p.x>=31&&p.x<=33&&p.y>prevY){for(const a of leftArms())if(Math.abs(a-17-p.y)<=3){p.st='screw';p.x=32;p.y=a-17;return true}}
  return false}
function checkGirl(p){const g=G.S.girl;if(SIM){if(Math.abs(p.x-g[0]/4)<=1&&g[1]-p.y>=0&&g[1]-p.y<=10)SIM.girl=true;return}if(G.fruitsLeft===0&&Math.abs(p.x-g[0]/4)<=1&&g[1]-p.y>=0&&g[1]-p.y<=10){state='clear';stateT=0;G.clearBonus=G.bonus*G.n;SFX.clear()}}
function stepPlayer(keys){const p=PLY,L=keys.left,R=keys.right,U=keys.up,D=keys.down,J=keys.jump;
  if(p.st==='dead'){p.deadT++;if(p.y>8)p.y-=4;return}
  if(p.st==='rope'){const r=G.ropes[p.rope];p.x=r.xu+r.off;p.y=r.ay+14;if(J)startJump(R?1:L?-1:p.face);return}
  if(p.st==='screw'){p.y+=2;if(J){startJump(R?1:L?-1:0);return}if(p.y>=158)p.st='fall';return}
  if(p.st==='spring'){p.y-=4;if(p.y<=p.jy0){p.y=p.jy0;p.st='jump';p.ji=5}return}
  if(p.st==='jump'){const d=p.jt[p.ji++];if(d===undefined){p.st='walk';p.anim=0;if(!supported(p))p.st='fall';return}
    const py=p.y;p.y+=d;if(p.dir){const nx=p.x+p.dir;if(nx>=0&&nx<=76)p.x=nx}
    if(tryCatch(p,py))return;if(d>=0&&landable(p)&&p.ji>1){p.st='walk';p.anim=0;checkGirl(p);return}
    if(d<0&&((p.y+18)&7)===0&&landable(p)&&p.ji>1){p.st='walk';p.anim=0;return}return}
  if(p.st==='fall'){const py=p.y;p.y+=4;if(tryCatch(p,py))return;if(p.y+18>=200){p.y=182;die();return}
    if(((p.y+18)&7)===0){const r=(p.y+18)>>3,c0=p.x>>1,a=cell(r,c0),b=cell(r,c0+1);if(!((a===0||a===8)&&(b===0||b===7)))die()}return}
  // au sol ou sur une échelle
  const hOk=p.st!=='climb'||onPlatformLevel(p);
  if(J&&(p.st==='walk'||hOk)){startJump(R?1:L?-1:0);return}
  if(U&&!(p.x&1)&&isLad(cell((p.y+17)>>3,p.x>>1))&&p.y-4>=16){p.y-=4;p.st='climb';p.anim++;checkGirl(p);return}
  if(D&&!(p.x&1)&&isLad(cell((p.y+18)>>3,p.x>>1))&&p.y+4<=182){p.y+=4;p.st='climb';p.anim++;checkGirl(p);return}
  if((L||R)&&hOk){const d=R?1:-1;const nx=p.x+d;if(nx>=0&&nx<=76){p.x=nx;p.face=d;p.st='walk';p.anim=(p.anim+1)%4;SFX.step()}}
  if(p.st==='walk'&&!supported(p))p.st='fall';
  checkGirl(p)}
function collide(){const p=PLY;if(p.st==='dead')return;const b=pbox(p);
  for(const f of G.fruits)if(!f.taken&&hit(b,[f.x+2,f.y+2,f.x+14,f.y+14])){f.taken=true;G.fruitsLeft--;addScore(f.v,f.x+4,f.y);SFX.fruit()}
  for(const o of G.balls){const jumping=p.st==='jump';
    if(jumping&&!o.scored&&Math.abs(o.x+4-(p.x*4+8))<=6&&o.y>=p.y+10&&o.y<=p.y+30){o.scored=true;addScore(10,o.x,o.y-8)}
    if(hit(b,[o.x+1,o.y+1,o.x+7,o.y+7])&&!(jumping&&o.y+4>=p.y+12))return die()}
  for(const k of G.kangs){const[x,y]=KPATH[k.i];if(hit(b,[x+3,y+4,x+13,y+24]))return die()}
  for(const g of G.goats)if(hit(b,[g.x+2,g.fy-13,g.x+14,g.fy]))return die();
  if(G.walker&&hit(b,[G.walker.x+3,G.walker.y+3,G.walker.x+13,G.walker.y+23]))return die();
  if(G.piston){const pb=G.piston.pb;if(hit(b,[104,pb-6,128,pb])||hit(b,[114,40,118,pb-6]))return die()}}
function demoKeys(){const d=demo;if(d.hold<=0){const r=Math.random();d.act=r<.3?'right':r<.5?'left':r<.65?'up':r<.75?'down':r<.85?'jump':'none';d.hold=3+(Math.random()*10|0)}d.hold--;
  return{left:d.act==='left',right:d.act==='right',up:d.act==='up',down:d.act==='down',jump:d.act==='jump'&&d.hold%4===0}}
function gameTick(){
  if(paused)return;stateT++;
  if(state==='title'){if(++titleIdle>250)startDemo();return}
  if(state==='demo'){demo.t++;stepEntities();const k=demoKeys();const was=PLY.st;stepPlayer(k);collide();if(PLY.st==='dead'&&PLY.deadT>16)setupStage(G.n,0);
    G.tick++;if(G.tick%2===0&&G.bonus>0)G.bonus--;if(demo.t>120){demo.t=0;if(demo.stage>=4){toTitle();return}demo.stage++;setupStage(demo.stage,0)}return}
  if(state==='ready'){if(stateT>18){state='play';stateT=0}return}
  if(state==='play'){G.tick++;if(G.tick%2===0){G.bonus--;if(G.bonus<=0){G.bonus=0;die()}}
    stepEntities();const keys={left:inp('left'),right:inp('right'),up:inp('up'),down:inp('down'),jump:jumpQ};jumpQ=false;stepPlayer(keys);collide();return}
  if(state==='dead'){stepEntities();stepPlayer({});if(PLY.deadT>22)afterDeath();return}
  if(state==='clear'){if(G.clearBonus>0){const n=Math.min(G.clearBonus,G.n*20);G.clearBonus-=n;G.bonus=Math.max(0,G.bonus-Math.ceil(n/G.n));addScore(n);SFX.tick();stateT=0}
    else if(stateT>12){const p=P();p.stage++;if(p.stage>4){p.stage=1;p.level=Math.min(3,p.level+1)}enterReady()}return}
  if(state==='over'){if(stateT>60)toTitle();return}}
function afterDeath(){const p=P();if(mode!=='train')p.lives--;
  if(mode===2){const o=1-cur;if(players[o].lives>0)cur=o;else if(p.lives<=0)return gameOver()}else if(p.lives<=0)return gameOver();enterReady()}
function gameOver(){state='over';stateT=0;SFX.over();if(mode!=='train'){for(const p of players)best=Math.max(best,p.score);try{localStorage.setItem('yeti_best',best)}catch(e){}}}


function simTick(snap,keys){SIM={dead:false,girl:false};Object.assign(PLY,snap.p);PLY.jt=snap.p.jt2?JT2:JT1;
  if(G.screw)G.screw.p=snap.sp;G.ropes.forEach((r,i)=>{r.off=snap.ro[i];r.dir=snap.rd[i]});
  if(G.screw)G.screw.p=(G.screw.p+2)%72;for(const r of G.ropes){r.off+=r.dir;if(r.off>=5||r.off<=-5)r.dir=-r.dir}
  const _sfx=SFX.step;SFX.step=()=>{};stepPlayer(keys);SFX.step=_sfx;
  const b=pbox(PLY);
  const touched=[];G.fruits.forEach((f,i)=>{if(hit(b,[f.x+2,f.y+2,f.x+14,f.y+14]))touched.push(i)});
  const out={p:{x:PLY.x,y:PLY.y,st:PLY.st,dir:PLY.dir,face:PLY.face,anim:0,ji:PLY.ji,jt2:PLY.jt===JT2,jy0:PLY.jy0,rope:PLY.rope,deadT:0},sp:G.screw?G.screw.p:0,ro:G.ropes.map(r=>r.off),rd:G.ropes.map(r=>r.dir)};
  const res={snap:out,dead:SIM.dead||PLY.st==='dead',girl:SIM.girl,touched};SIM=null;return res}
function simStart(){return{p:{...PLY,jt2:false},sp:G.screw?G.screw.p:0,ro:G.ropes.map(r=>r.off),rd:G.ropes.map(r=>r.dir)}}
/* ---------- rendu ---------- */
function drawPlayer(){const p=PLY,x=p.x*4,y=p.y;
  if(p.st==='dead'){if(Math.floor(T*10)%2)ctx.drawImage(S_GHOST,x,y);return}
  let img;if(p.st==='climb'&&!onPlatformLevel(p))img=p.anim%2?S_CLIMB:S_CLIMB2;else if(p.st==='rope'||p.st==='screw')img=S_CLIMB;
  else{const set=p.face>0?PR:PL;img=(p.st==='jump'||p.st==='fall'||p.st==='spring')?set[3]:set[[0,1,2,1][p.anim%4]]}
  ctx.drawImage(img,x,y)}
function line(x0,y0,x1,y1,col){ctx.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)ctx.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1)}
function drawScene(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(G.bg,0,0);const S=G.S;
  for(const f of G.fruits)if(!f.taken)ctx.drawImage(f.img,f.x,f.y);
  if(G.screw){const x=144,y=112;ctx.fillStyle=PAL.C;ctx.fillRect(151,96,2,16);ctx.fillRect(151,176,2,16);
    ctx.fillStyle=PAL.R;ctx.fillRect(x+1,y,14,64);ctx.fillRect(x,y+3,16,58);ctx.fillStyle='#600000';const ph=G.screw.p%8;
    for(let j=-8;j<64;j+=8)for(let i=0;i<16;i+=4){const yy=y+j+ph+(i%8?4:0);if(yy>=y+2&&yy<y+62)ctx.fillRect(x+i,yy,2,2)}
    ctx.fillStyle=PAL.C;for(const a of leftArms())ctx.fillRect(128,a,16,2);for(const a of rightArms())ctx.fillRect(160,a,16,2)}
  if(G.piston){const pb=G.piston.pb;ctx.fillStyle=PAL.M;ctx.fillRect(115,40,2,pb-46);ctx.fillRect(104,pb-6,24,4);ctx.fillRect(108,pb-2,16,2)}
  if(G.spring)ctx.drawImage(S_SPRING[G.spring.squash>0?1:0],G.spring.x,G.spring.y);
  for(const r of G.ropes){const ax=r.xu*4+7;line(ax,r.ay,ax+r.off*4,r.ay+31,PAL.R)}
  for(const g of G.goats){const im=S_GOAT[g.m==='climb'?0:g.f];ctx.drawImage(g.dir>0?(S_GOAT_R[g.m==='climb'?0:g.f]):im,g.x,g.fy-19)}
  if(G.yeti){const y=G.yeti;let img=YETI.stand;if(y.ph==='lift')img=YETI.up;else if(y.ph==='throw')img=y.face<0?YETI.throwL:YETI.throwR;else if(state==='dead'||state==='over')img=Math.floor(T*6)%2?YETI.up:YETI.stand;
    else if(Math.floor(T*1.3)%5===4)img=YETI.up;ctx.drawImage(img,y.x,y.y);if(y.ph==='lift')ctx.drawImage(S_BALL,y.x+4,y.y-6)}
  if(G.walker){const w=G.walker;ctx.drawImage(w.pause>0?YETI.stand:(w.anim%2?(w.dir>0?YETI.walkR:YETI.walk):YETI.stand),w.x,w.y)}
  const gl=state==='clear'||Math.floor(T)%4===0;ctx.drawImage(S_GIRL[gl&&Math.floor(T*5)%2?1:0],S.girl[0],S.girl[1]);
  if(state==='clear')ctx.drawImage(S_HEART,S.girl[0]+(S.girl[0]>160?-10:18),S.girl[1]-2+Math.round(Math.sin(T*6)));
  drawPlayer();
  for(const b of G.balls)ctx.drawImage(S_BALL,b.x,b.y);
  for(const k of G.kangs){const[x,y]=KPATH[k.i];ctx.drawImage(S_KANG,x,y)}
  for(const p of G.popups){p.t+=1/60;if(p.t<1)text(p.s,p.x,p.y-Math.round(p.t*10),PAL.W)}G.popups=G.popups.filter(p=>p.t<1)}
function hud(){const p=P(),label=state==='demo'?'Demonstration':mode==='train'?'Entrainement':'';
  tc(mode===2?`Joueur ${cur+1}:`:'Joueur 1:',0,0,PAL.G);tc(pad5(p.score),10,0,PAL.W);
  if(mode!=='train')for(let i=0;i<Math.min(p.lives,9);i++)ctx.drawImage(S_LIFE,136+i*8,0);
  if(label)tc(label,40-label.length,0,PAL.W);
  tc('Etape :',2,1,PAL.Y);const n=G.n;for(let i=1;i<=n;i++){const x=88+(i-1)*24;ctx.fillStyle=PAL.R;ctx.fillRect(x,8,24,8);ctx.fillStyle=PAL.B;ctx.fillRect(x+1,9,22,6);text(String(i),x+8,9,PAL.G)}
  tc('Bonus:',28,1,'#5a6aff');tc(pad5(G.bonus),35,1,PAL.W)}
function box(lines){const h=lines.length*10+8,y0=Math.round((H-h)/2);ctx.fillStyle='#000';ctx.fillRect(56,y0,208,h);ctx.fillStyle=PAL.B;ctx.fillRect(56,y0,208,1);ctx.fillRect(56,y0+h-1,208,1);ctx.fillRect(56,y0,1,h);ctx.fillRect(263,y0,1,h);
  lines.forEach((l,i)=>text(l[0],Math.round((W-l[0].length*8)/2),y0+5+i*10,l[1]))}
const titleLayer=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.lineCap='butt';
  x.strokeStyle=x.fillStyle=PAL.C;x.lineWidth=12;x.beginPath();x.moveTo(62,52);x.lineTo(88,82);x.moveTo(114,52);x.lineTo(88,82);x.stroke();x.fillRect(82,78,12,34);
  x.fillStyle=PAL.Y;x.fillRect(130,58,12,54);x.fillRect(130,58,32,11);x.fillRect(130,80,28,11);x.fillRect(130,101,32,11);
  x.fillStyle=PAL.G;x.fillRect(176,58,44,11);x.fillRect(192,58,12,54);x.fillStyle=PAL.M;x.fillRect(238,64,12,48);x.beginPath();x.arc(244,52,5,0,7);x.fill();
  const d=x.getImageData(0,0,W,H),p=d.data;for(let i=3;i<p.length;i+=4)p[i]=p[i]>110?255:0;x.putImageData(d,0,0);x.clearRect(0,0,200,58);return c})();
function drawTitle(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(144,2);const ph=Math.floor(T*1.4)%6;ctx.drawImage(ph===2||ph===4?YETI.up:YETI.stand,0,0,32,46);ctx.restore();ctx.drawImage(titleLayer,0,0);
  tc('Auteur: Pascal PELLIER',9,15,PAL.G);tc('Copyright (C) 1984 LORICIELS',6,16,PAL.Y);
  tc('Meilleur score: '+pad5(best),10,18,PAL.C);
  rich([['Selectionnez ',PAL.W],['<1>',PAL.M,1],[' ou ',PAL.W],['<2>',PAL.M,1],[' joueurs',PAL.W]],20);
  rich([['ou le mode Entrainement ',PAL.W],['<E>',PAL.M,1]],21);
  text('remake web',W-84,192,'#555')}
function render(){ctx.imageSmoothingEnabled=false;
  if(state==='title')return drawTitle();
  drawScene();hud();const p=P();
  if(state==='ready')text(mode===2?`Joueur ${cur+1}`:mode==='train'?'Entrainement':'Joueur 1',mode==='train'?112:128,104,PAL.W);
  if(state==='clear')box([['Bravo !',PAL.M],['Bonus x '+G.n,PAL.Y]]);
  if(state==='over'){const l=[['Partie terminee',PAL.R]];players.forEach((q,i)=>l.push([(players.length>1?'Joueur '+(i+1)+': ':'Score: ')+pad5(q.score),PAL.Y]));l.push(['Meilleur: '+pad5(best),PAL.C]);box(l)}
  if(paused)box([['PAUSE',PAL.W]])}

/* ---------- boucle ---------- */
let last=performance.now(),acc=0,manual=false;
function loop(now){if(manual){render();requestAnimationFrame(loop);return}const dt=Math.min(.25,(now-last)/1000);last=now;if(!paused)T+=dt;acc+=dt*1000;while(acc>=TICK){gameTick();acc-=TICK}render();requestAnimationFrame(loop)}
layout();requestAnimationFrame(loop);
window.__yeti={simTick,simStart,manual:(on)=>{manual=on},tick:(k,n=1)=>{for(let i=0;i<n;i++){for(const x in kb)kb[x]=k&&k[x]?1:0;if(k&&k.jump)jumpQ=true;gameTick()}for(const x in kb)kb[x]=0;return {st:state,p:PLY,fr:G&&G.fruitsLeft,sc:players[cur]&&players[cur].score,lives:players[cur]&&players[cur].lives}},get state(){return state},startGame,get P(){return PLY},get G(){return G},setupStage,step:gameTick,setState:s=>{state=s}};
})();
