<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pok'n Roll</title>
<style>
:root{--ink:#0b1e33}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 20%,#1a6cbd 0%,#0a3566 55%,#041a33 100%) fixed;min-height:100vh}
.hidden{display:none!important}
.logo{font-family:"Arial Black",Impact,sans-serif;font-style:italic;font-weight:900;color:#e5262f;letter-spacing:1px;
 text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,4px 6px 0 rgba(0,0,0,.35);margin:0}
.logo.big{font-size:clamp(46px,9vw,84px);text-align:center;transform:rotate(-3deg)}
.logo.small{font-size:24px}
.logo.tiny{font-size:15px;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 2px 0 #fff,2px 3px 0 rgba(0,0,0,.3)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.6em 1.1em;font-weight:700}
.btn{background:#fff;color:#0b3a6e;box-shadow:0 3px 0 #9fb8d6;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9fb8d6}
.btn.red{background:#e5262f;color:#fff;box-shadow:0 3px 0 #8f1218}
.btn.green{background:#2fa84f;color:#fff;box-shadow:0 3px 0 #17642c}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.28)}
.btn.big{font-size:1.2em;padding:.75em 1.6em}
input,select{font:inherit}
/* ---------- setup ---------- */
#setup{display:flex;justify-content:center;padding:24px 12px 40px}
.setup-card{width:min(760px,100%);background:linear-gradient(#1f6fd1,#1658a8);border-radius:22px;padding:22px clamp(14px,4vw,34px) 28px;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.18)}
.tag{text-align:center;margin:10px 0 18px;opacity:.9}
.setup-card h3{margin:20px 0 10px;font-size:1.05em;text-transform:uppercase;letter-spacing:1px;opacity:.9}
.count{display:flex;gap:8px;flex-wrap:wrap}
.count button{width:52px;height:52px;font-size:1.3em;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}
.count button.on{background:#fff;color:#1658a8;border-color:#fff}
.note{margin-top:10px;font-size:.92em;background:rgba(0,0,0,.18);padding:8px 12px;border-radius:10px}
.note:empty{display:none}
.prow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid #fff;flex:none}
.prow input[type=text]{flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:0;color:var(--ink)}
.iconbtn{background:rgba(255,255,255,.18);color:#fff;padding:7px 10px}
.seg{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.seg button{border-radius:0;background:transparent;color:#fff;padding:7px 10px;font-weight:600}
.seg button.on{background:#fff;color:#1658a8}
.prow select{padding:7px;border-radius:8px;border:0;color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;margin:8px 0}
.opt input[type=checkbox]{width:20px;height:20px}
.opt select{padding:6px;border-radius:8px;border:0}
.start{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
/* ---------- game ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(0,0,0,.25);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
#roundInfo{flex:1;font-weight:700;opacity:.95}
.tools{display:flex;gap:6px}
.tool{background:rgba(255,255,255,.14);color:#fff;padding:7px 11px;min-width:40px}
.tool.off{opacity:.4;text-decoration:line-through}
.layout{padding:14px;max-width:1500px;margin:0 auto}
.seats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.seat{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 10px 8px;min-width:130px;flex:0 1 165px;text-align:center;border-top:5px solid var(--pc);position:relative;transition:transform .25s,box-shadow .25s}
.seat.win{box-shadow:0 0 0 3px #ffd34d,0 0 28px rgba(255,211,77,.7);transform:translateY(-4px)}
.seat.out{opacity:.55}
.seat .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sc{font-size:.85em;opacity:.85}
.seat .zone{height:62px;display:flex;align-items:center;justify-content:center;gap:5px;margin:4px 0}
.seat .st{font-size:.82em;min-height:1.3em}
.seat .fg{font-size:.82em;font-weight:700;color:#ffe08a;min-height:1.2em}
.firstmark{position:absolute;top:-10px;right:-6px;background:#fff;color:#0b3a6e;border-radius:20px;font-size:.7em;padding:2px 7px;font-weight:800}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:800;font-size:.95em}
.badge.stay{background:#e5262f}.badge.fold{background:#2fa84f}.badge.win{background:#ffd34d;color:#4a3500}
.cup{width:54px;height:58px}
.cup.shake{animation:shake .12s linear 6}
@keyframes shake{0%{transform:rotate(-12deg) translateX(-3px)}50%{transform:rotate(12deg) translateX(3px)}100%{transform:rotate(-12deg)}}
.felt{background:radial-gradient(ellipse at center,#2a8a4a 0%,#1d6b38 60%,#145229 100%);border-radius:26px;padding:16px 14px 18px;box-shadow:inset 0 0 0 6px #6b3e1d,inset 0 0 0 10px #8a5a2f,0 12px 30px rgba(0,0,0,.4);text-align:center}
.turntrack{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.turntrack span{padding:4px 12px;border-radius:20px;background:rgba(0,0,0,.25);font-size:.9em;font-weight:700;opacity:.55}
.turntrack span.on{background:#fff;color:#145229;opacity:1}
.turntrack span.done{opacity:.85}
.whites{display:flex;justify-content:center;gap:12px;min-height:74px;align-items:center;--ds:62px}
.slot{width:var(--ds);height:var(--ds);border-radius:18%;border:2px dashed rgba(255,255,255,.3)}
.msg{margin:14px auto 6px;font-size:1.12em;font-weight:700;min-height:1.4em;max-width:720px}
.action{margin-top:10px}
.log{margin:10px auto 0;max-width:820px;font-size:.88em;opacity:.85;text-align:left;background:rgba(0,0,0,.2);border-radius:12px;padding:6px 12px;max-height:120px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.log:empty{display:none}
/* dice */
.die{width:var(--ds,46px);height:var(--ds,46px);border-radius:18%;background:var(--dc,#fff);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--ds,46px)*.14);gap:calc(var(--ds,46px)*.05);box-shadow:inset -3px -4px 0 rgba(0,0,0,.14),0 3px 6px rgba(0,0,0,.35);flex:none;transition:transform .2s,box-shadow .2s}
.die i{border-radius:50%}
.die i.on{background:var(--pp,#111)}
.die.used{box-shadow:0 0 0 3px #ffd34d,inset -3px -4px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.4);transform:translateY(-3px)}
.die.rolling{animation:tumble .55s ease-out}
@keyframes tumble{0%{transform:translate(-40px,-30px) rotate(-260deg) scale(.6);opacity:.2}60%{transform:translate(6px,4px) rotate(20deg) scale(1.05);opacity:1}100%{transform:none}}
.die.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
/* decision */
.decide{background:rgba(0,0,0,.28);border-radius:18px;padding:14px;max-width:720px;margin:0 auto;border:2px solid var(--pc)}
.decide .dh{font-weight:800;font-size:1.1em;margin-bottom:8px}
.handrow{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap}
.grp small{display:block;opacity:.8;margin-bottom:4px}
.grp .dice{display:flex;gap:6px;--ds:44px}
.plus{font-size:1.6em;font-weight:800;padding-bottom:8px}
.fig{margin:12px 0 4px;font-size:1.05em}
.fig b{color:#ffe08a}
.btns{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.risk{margin-top:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;text-align:left;font-size:.92em}
.risk .kp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.risk .kp div{flex:1;min-width:130px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px;text-align:center}
.risk .kp b{display:block;font-size:1.35em}
.risk .bar{display:flex;align-items:center;gap:8px;margin:3px 0}
.risk .bar span:first-child{width:105px;flex:none}
.risk .bar .tr{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.risk .bar .fl{height:100%;background:linear-gradient(90deg,#ffd34d,#ff8a3d)}
.risk .bar span:last-child{width:44px;text-align:right;flex:none}
.good{color:#8dff9f}.bad{color:#ff9a9a}
/* sheets */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:18px}
.sheet{background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 92%,#fff),var(--pc));border-radius:16px;padding:8px 10px 10px;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.25);color:#fff}
.sheet.dark{--txt:#2b2100}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.sh-name{font-weight:800;background:rgba(0,0,0,.25);padding:2px 10px;border-radius:20px;font-size:.92em}
.sheet table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.16);border-radius:10px;overflow:hidden;font-size:.82em}
.sheet td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
.sheet td.lbl{font-weight:700;white-space:nowrap}
.sheet td.ico{white-space:nowrap}
.sheet td.ico .mini{display:inline-flex;gap:1px;--ds:11px}
.sheet td.ico .die{padding:1.5px;gap:0;box-shadow:none;border-radius:2px}
.sheet td.bx{white-space:nowrap}
.box{display:inline-block;width:15px;height:15px;border-radius:50%;background:#fff;margin:0 1px;vertical-align:middle;position:relative}
.box.fin{box-shadow:0 0 0 2px #ffd34d}
.box svg{position:absolute;inset:-3px;width:21px;height:21px}
.box svg path{stroke:#111;stroke-width:3.2;stroke-linecap:round;fill:none}
.box.new svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s forwards}
.box.new svg path:nth-child(2){animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}
.sheet td.mu{text-align:right;opacity:.9;white-space:nowrap}
.sheet td.sub{width:34px;text-align:center;background:#fff;color:#111;font-weight:800;font-family:"Comic Sans MS","Segoe Print",cursive}
.sheet tr.tot td{border:0;font-weight:900;font-size:1.1em}
.sheet tr.hl td.lbl{color:#ffe08a}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(2,12,28,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:linear-gradient(#1f6fd1,#1450a0);border-radius:20px;padding:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.2)}
.modal h2{margin-top:0}
.modal .mbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.modal ol,.modal ul{padding-left:20px;line-height:1.45}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.1);margin:6px 0;border-left:6px solid var(--pc)}
.rank .pos{font-size:1.4em;width:36px;text-align:center}
.rank .n{flex:1;font-weight:800}
.rank .t{font-size:1.4em;font-weight:900}
.slider{display:flex;align-items:center;gap:10px;margin:10px 0}
.slider input{flex:1}
@media (max-width:600px){
 .sheets{grid-template-columns:1fr}
 .sheet td.ico{display:none}
 .whites{--ds:48px;gap:8px}
 .seat{flex-basis:140px;min-width:110px}
 .logo.small{font-size:18px}
}
</style>
</head>
<body>

<section id="setup">
 <div class="setup-card">
  <h1 class="logo big">Pok'n Roll</h1>
  <p class="tag">Le jeu de dés où l'on mise sur ses dés secrets… ou l'on sécurise ses points !</p>
  <h3>Nombre de joueurs</h3>
  <div id="countBtns" class="count"></div>
  <div id="soloNote" class="note"></div>
  <h3>Joueurs</h3>
  <div id="playerRows"></div>
  <button class="btn ghost" id="randAll">🎲 Tous les noms au hasard</button>
  <h3>Options</h3>
  <label class="opt"><input type="checkbox" id="optPct" checked> Afficher les pourcentages de risque</label>
  <label class="opt"><input type="checkbox" id="optMusic" checked> Musique d'ambiance relaxante</label>
  <label class="opt"><input type="checkbox" id="optSfx" checked> Bruitages</label>
  <label class="opt">Vitesse du jeu
   <select id="optSpeed"><option value="1.6">Lente</option><option value="1" selected>Normale</option><option value="0.55">Rapide</option></select></label>
  <div class="start">
   <button class="btn red big" id="startBtn">🎲 Lancer la partie</button>
   <button class="btn ghost" id="rulesBtn1">📖 Règles</button>
  </div>
 </div>
</section>

<section id="game" class="hidden">
 <header class="topbar">
  <div class="logo small">Pok'n Roll</div>
  <div id="roundInfo"></div>
  <div class="tools">
   <button id="tPct" class="tool" title="Afficher / masquer les pourcentages">%</button>
   <button id="tSfx" class="tool" title="Bruitages">🔊</button>
   <button id="tMusic" class="tool" title="Musique">🎵</button>
   <button id="tSet" class="tool" title="Réglages">⚙️</button>
   <button id="tRules" class="tool" title="Règles">📖</button>
   <button id="tQuit" class="tool" title="Quitter">✕</button>
  </div>
 </header>
 <main class="layout">
  <div id="seats" class="seats"></div>
  <div class="felt">
   <div id="turnTrack" class="turntrack"></div>
   <div id="whites" class="whites"></div>
   <div id="msg" class="msg"></div>
   <div id="action" class="action"></div>
  </div>
  <div id="log" class="log"></div>
  <div id="sheets" class="sheets"></div>
 </main>
</section>

<div id="overlay" class="hidden"></div>

<script>
"use strict";
/* ================= DONNÉES ================= */
const COLORS=[
 {n:'Bleu',c:'#1f6fd1',pip:'#fff'},{n:'Vert',c:'#2e9e3a',pip:'#fff'},{n:'Jaune',c:'#e8ad00',pip:'#3a2a00'},
 {n:'Rouge',c:'#d62828',pip:'#fff'},{n:'Violet',c:'#7b3fb5',pip:'#fff'},{n:'Noir',c:'#2a2a2a',pip:'#fff'}];
const NAMES=['Léa','Hugo','Chloé','Louis','Manon','Jules','Camille','Arthur','Inès','Gabriel','Zoé','Raphaël','Jade','Nathan','Alice','Victor','Lucie','Tom','Emma','Noé','Margot','Basile','Rose','Oscar','Lina','Sacha','Nina','Félix','Elsa','Marius'];
const FIG=[
 {key:'rien',name:'Rien',pts:0},{key:'paire',name:'Paire',pts:2},{key:'dpaire',name:'Double Paire',pts:3},
 {key:'brelan',name:'Brelan',pts:4},{key:'full',name:'Full',pts:5},{key:'suite',name:'Grande Suite',pts:6},
 {key:'carre',name:'Carré',pts:9},{key:'yams',name:"Yam's",pts:12}];
const ROWS=[
 {k:'win3',l:'3e tour remporté'},
 {k:'yams',l:"Yam's",m:12,ico:[6,6,6,6,6]},
 {k:'carre',l:'Carré',m:9,ico:[5,5,5,5]},
 {k:'suite',l:'Grande Suite',m:6,ico:[2,3,4,5,6]},
 {k:'full',l:'Full',m:5,ico:[3,3,3,1,1]},
 {k:'brelan',l:'Brelan',m:4,ico:[4,4,4]},
 {k:'dpaire',l:'Double Paire',m:3,ico:[2,2,5,5]},
 {k:'paire',l:'Paire',m:2,ico:[1,1]},
 {k:'aband',l:'Abandon au 1er tour',m:1}];
const STYLES={prudent:{l:'Prudent',r:.8},equi:{l:'Équilibré',r:1},audace:{l:'Audacieux',r:1.3}};

const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const rollDie=()=>1+rnd(6);
const store={get(k,d){try{const v=localStorage.getItem('pnr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pnr_'+k,JSON.stringify(v))}catch(e){}}};

/* ================= SON ================= */
const Snd={ctx:null,sfxOn:true,musicOn:true,sfxVol:.7,musVol:.4,timer:null,
 init(){
  if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{this.ctx=new C()}catch(e){return}
  const c=this.ctx;
  this.master=c.createGain();this.master.connect(c.destination);
  this.sfx=c.createGain();this.sfx.gain.value=this.sfxOn?this.sfxVol:0;this.sfx.connect(this.master);
  this.mus=c.createGain();this.mus.gain.value=0;this.mus.connect(this.master);
  // bus musique : passe-bas + écho doux
  this.musIn=c.createBiquadFilter();this.musIn.type='lowpass';this.musIn.frequency.value=1400;
  const dl=c.createDelay(2);dl.delayTime.value=.48;const fb=c.createGain();fb.gain.value=.38;
  const wet=c.createGain();wet.gain.value=.35;
  this.musIn.connect(this.mus);this.musIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(this.mus);
  const len=c.sampleRate;this.nb=c.createBuffer(1,len,c.sampleRate);const d=this.nb.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 },
 now(){return this.ctx?this.ctx.currentTime:0},
 noise(t,dur,f,q,vol,type){
  if(!this.ctx)return;const c=this.ctx;const s=c.createBufferSource();s.buffer=this.nb;
  const fl=c.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(this.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
 },
 tone(t,f,dur,vol,type,dest,att){
  if(!this.ctx)return;const c=this.ctx;const o=c.createOscillator();o.type=type||'sine';o.frequency.value=f;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||this.sfx);o.start(t);o.stop(t+dur+.05);
 },
 dice(n){if(!this.ctx)return;const t=this.now();n=n||3;
  for(let i=0;i<n*4;i++){const tt=t+Math.random()*.5*(1-i/(n*5));this.noise(tt,.035+Math.random()*.03,2200+Math.random()*3000,4,.45);this.tone(tt,1400+Math.random()*2200,.05,.05,'triangle')}
  this.tone(t+.05,140,.15,.18,'sine');},
 cup(){if(!this.ctx)return;const t=this.now();for(let i=0;i<11;i++){this.noise(t+i*.065,.05,900+Math.random()*900,2,.3);if(i%2)this.tone(t+i*.065,700+Math.random()*500,.04,.04,'triangle')}},
 click(){if(!this.ctx)return;this.tone(this.now(),880,.08,.12,'sine')},
 scribble(){if(!this.ctx)return;const t=this.now();for(let i=0;i<7;i++)this.noise(t+i*.055,.07,3200+Math.random()*1800,1.2,.13)},
 fold(){if(!this.ctx)return;const t=this.now();this.tone(t,523,.2,.14,'triangle');this.tone(t+.12,392,.35,.14,'triangle')},
 stay(){if(!this.ctx)return;const t=this.now();this.tone(t,440,.18,.13,'triangle');this.tone(t+.1,659,.3,.13,'triangle')},
 reveal(){if(!this.ctx)return;const t=this.now();this.noise(t,.25,1800,.7,.12,'highpass')},
 win(){if(!this.ctx)return;const t=this.now();[523,659,784,1047].forEach((f,i)=>this.tone(t+i*.11,f,.45,.16,'triangle'))},
 sad(){if(!this.ctx)return;const t=this.now();[392,370,349].forEach((f,i)=>this.tone(t+i*.16,f,.4,.1,'triangle'))},
 fanfare(){if(!this.ctx)return;const t=this.now();[[523,0],[659,.15],[784,.3],[1047,.45],[784,.62],[1047,.78]].forEach(([f,d])=>{this.tone(t+d,f,.6,.15,'triangle');this.tone(t+d,f/2,.6,.07,'sine')})},
 setSfx(on){this.sfxOn=on;if(this.sfx)this.sfx.gain.setTargetAtTime(on?this.sfxVol:0,this.now(),.05)},
 setSfxVol(v){this.sfxVol=v;if(this.sfx&&this.sfxOn)this.sfx.gain.setTargetAtTime(v,this.now(),.05)},
 setMusVol(v){this.musVol=v;if(this.mus&&this.musicOn&&this.timer)this.mus.gain.setTargetAtTime(v,this.now(),.2)},
 setMusic(on){this.musicOn=on;if(on)this.startMusic();else this.stopMusic()},
 mtof(m){return 440*Math.pow(2,(m-69)/12)},
 startMusic(){
  if(!this.ctx||!this.musicOn||this.timer)return;
  const c=this.ctx;this.mus.gain.cancelScheduledValues(c.currentTime);this.mus.gain.setTargetAtTime(this.musVol,c.currentTime,1.2);
  const chords=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62],[41,48,55,64],[40,47,55,62]];
  const penta=[72,74,76,79,81,84,86];
  let next=c.currentTime+.2,i=0;const DUR=8;
  const pad=(notes,t)=>{notes.forEach(m=>{[[1,'sine',.035],[1.004,'triangle',.018]].forEach(([dt,ty,v])=>{
    const o=c.createOscillator();o.type=ty;o.frequency.value=this.mtof(m)*dt;const g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+2.8);g.gain.setValueAtTime(v,t+DUR-1);g.gain.linearRampToValueAtTime(0,t+DUR+2.5);
    o.connect(g);g.connect(this.musIn);o.start(t);o.stop(t+DUR+2.6);})})};
  const pluck=(m,t)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=this.mtof(m);const g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);g.connect(this.musIn);o.start(t);o.stop(t+2.3)};
  const tick=()=>{while(next<c.currentTime+2){const ch=chords[i%chords.length];pad(ch,next);
     // bass doux
     const bo=c.createOscillator();bo.type='sine';bo.frequency.value=this.mtof(ch[0]-12);const bg=c.createGain();
     bg.gain.setValueAtTime(0,next);bg.gain.linearRampToValueAtTime(.05,next+1.5);bg.gain.linearRampToValueAtTime(0,next+DUR+1);bo.connect(bg);bg.connect(this.musIn);bo.start(next);bo.stop(next+DUR+1.1);
     const k=2+rnd(4);for(let j=0;j<k;j++)pluck(penta[rnd(penta.length)],next+1+Math.random()*(DUR-1.5));
     next+=DUR;i++;}};
  tick();this.timer=setInterval(tick,700);
 },
 stopMusic(){if(this.timer){clearInterval(this.timer);this.timer=null}if(this.mus)this.mus.gain.setTargetAtTime(0,this.now(),.4)}
};

/* ================= ÉVALUATION DES FIGURES ================= */
function mk(rank,score,vals){return {rank,score,vals,key:FIG[rank].key,name:FIG[rank].name,pts:FIG[rank].pts}}
function evaluate(d){
 const c=[0,0,0,0,0,0,0];for(const v of d)c[v]++;
 const desc=[6,5,4,3,2,1];
 const kick=(ex,n)=>{const r=[];for(const f of desc){let k=c[f]-(ex[f]||0);while(k-->0&&r.length<n)r.push(f)}return r};
 for(const f of desc)if(c[f]>=5)return mk(7,[f],[f,f,f,f,f]);
 for(const f of desc)if(c[f]>=4){const k=kick({[f]:4},1);return mk(6,[f,...k],[f,f,f,f])}
 if(c[2]&&c[3]&&c[4]&&c[5]&&c[6])return mk(5,[6],[2,3,4,5,6]);
 if(c[1]&&c[2]&&c[3]&&c[4]&&c[5])return mk(5,[5],[1,2,3,4,5]);
 const t=desc.find(x=>c[x]>=3);
 if(t){const p=desc.find(x=>x!==t&&c[x]>=2);if(p)return mk(4,[t,p],[t,t,t,p,p]);
   const k=kick({[t]:3},2);return mk(3,[t,...k],[t,t,t])}
 const pairs=desc.filter(x=>c[x]>=2);
 if(pairs.length>=2){const [a,b]=pairs;const k=kick({[a]:2,[b]:2},1);return mk(2,[a,b,...k],[a,a,b,b])}
 if(pairs.length===1){const a=pairs[0];const k=kick({[a]:2},3);return mk(1,[a,...k],[a,a])}
 const k=kick({},5);return mk(0,k,[])
}
function cmp(a,b){if(a.rank!==b.rank)return a.rank-b.rank;for(let i=0;i<Math.max(a.score.length,b.score.length);i++){const x=a.score[i]||0,y=b.score[i]||0;if(x!==y)return x-y}return 0}
function figDesc(e){
 const s=e.score;
 switch(e.key){
  case 'yams':return `Yam's de ${s[0]} !`;
  case 'carre':return `Carré de ${s[0]}`;
  case 'suite':return s[0]===6?'Grande Suite (2 → 6)':'Grande Suite (1 → 5)';
  case 'full':return `Full aux ${s[0]} par les ${s[1]}`;
  case 'brelan':return `Brelan de ${s[0]}`;
  case 'dpaire':return `Double Paire ${s[0]} et ${s[1]}`;
  case 'paire':return `Paire de ${s[0]}`;
  default:return `Aucune figure (${s[0]} haut)`;
 }
}
function usedIdx(all,vals){const used=new Set();for(const v of vals){const i=all.findIndex((x,j)=>x===v&&!used.has(j));if(i>=0)used.add(i)}return used}

/* ================= PROBABILITÉS ================= */
function finalDistribution(my,whites){
 const need=5-whites.length;const dist=new Array(8).fill(0);let tot=0;
 const rec=(arr,k)=>{if(k===0){dist[evaluate(my.concat(arr)).rank]++;tot++;return}for(let v=1;v<=6;v++)rec(arr.concat(v),k-1)};
 rec(whites.slice(),need);return dist.map(x=>x/tot);
}
function simulate(my,whites,opp,n,mult){
 let wins=0,ev=0;const need=5-whites.length;
 for(let s=0;s<n;s++){
  const w=whites.slice();for(let k=0;k<need;k++)w.push(rollDie());
  const me=evaluate(my.concat(w));let best=true;
  for(let o=0;o<opp;o++){const op=evaluate([rollDie(),rollDie()].concat(w));if(cmp(op,me)>0){best=false;break}}
  if(best){wins++;ev+=me.pts+mult}
 }
 return {win:wins/n,ev:ev/n};
}

function aiDecide(p,turn){
 const e=evaluate(p.dice.concat(S.whites));
 let fold=e.pts+(turn===1?1:0);
 const opp=opponentsOf(p);
 const sim=simulate(p.dice,S.whites,opp,900,S.mult);
 let stay=sim.ev*(turn===1?1.22:1.06)*(opp>=2?1.08:1)*p.risk;
 // fin de partie : remplir la 6e case d'une ligne
 const others=Math.max(0,...S.players.filter(q=>q!==p).map(total));
 const finishes=(e.rank>0&&p.sheet[e.key]===5)||(turn===1&&p.sheet.aband===5);
 if(finishes){fold+= (total(p)+fold>others)?25:-4}
 stay+=(Math.random()-.5)*.9;
 return stay>fold?'stay':'fold';
}

 else{msg(`${esc(fp.name)} lance ${count>1?'les dés blancs':'le '+(S.whites.length+1)+'e dé blanc'}…`);await sleep(650)}
 const start=S.whites.length;for(let i=0;i<count;i++)S.whites.push(rollDie());
 Snd.dice(count);
 // petite animation : faces qui défilent
 const idx=[];for(let i=start;i<S.whites.length;i++)idx.push(i);
 const final=S.whites.slice();
 for(let f=0;f<5;f++){idx.forEach(i=>S.whites[i]=rollDie());renderWhites(f===0?idx:null);await sleep(70)}
 S.whites=final;renderWhites();
 await sleep(500);
}

async function decisionPhase(turn){

 const humans=act.filter(p=>!p.ai);
 for(const h of humans){
  if(privacy())await privacyGate(h);
  msg(privacy()?`${esc(h.name)} réfléchit…`:'À vous de jouer !');
  dec.set(h,await humanDecide(h,turn));
  if(privacy())renderSeats();
 }
 if(!humans.length)await sleep(900);else await sleep(250);
 msg('Les décisions sont révélées !');
 for(const p of act){p.badge=dec.get(p)}
 renderSeats();
 if([...dec.values()].includes('fold'))Snd.fold();else Snd.stay();
 await sleep(1100);
 // traitement des abandons
 for(const p of act){
  if(dec.get(p)!=='fold')continue;
  p.active=false;p.revealed=true;p.flip=true;
  const all=p.dice.concat(S.whites);const e=evaluate(all);p.fig=e;
  const u=usedIdx(all,e.vals);p.usedSet=new Set([...u].filter(i=>i<2));
  p.status=`Abandon au tour ${turn}`;p.badge='';
  Snd.reveal();renderSeats();
  const gain=e.pts+(turn===1?1:0);
  log(`🛡️ <b>${esc(p.name)}</b> abandonne au tour ${turn} : ${figDesc(e)} → +${gain} pt${gain>1?'s':''}${turn===1?' (dont 1 bonus)':''}`);
  msg(`${esc(p.name)} sécurise ${figDesc(e)}${turn===1?' + bonus d\'abandon':''}`);
  if(e.rank>0)await mark(p,e.key);
  if(turn===1)await mark(p,'aband');
  await sleep(350);
 }
 for(const p of act)if(p.active){p.badge='';p.status='En lice'}
 renderSeats();
 const real=S.players.filter(p=>p.active);const dummyIn=S.dummy&&S.dummy.active;
 if(real.length===0){
  if(dummyIn)msg('Tous les joueurs ont abandonné : seul le joueur fictif reste… personne ne remporte le 3e tour.');
  else msg('Tout le monde a abandonné ! Personne ne remporte le 3e tour.');
  log('— Personne ne remporte le 3e tour.');await sleep(1800);return 'over';
 }
 if(real.length===1&&!dummyIn){
  const w=real[0];w.win=true;w.badge='win';w.active=false;renderSeats();Snd.win();
  msg(`🏆 ${esc(w.name)} est le dernier en lice : il remporte la manche sans lancer les dés restants !`);
  log(`🏆 <b>${esc(w.name)}</b> reste seul en lice et coche « 3e tour remporté » (+${S.mult}).`);
  await mark(w,'win3');await sleep(1600);return 'over';
 }
 return 'continue';
}

async function showdown(){
 const contenders=S.players.filter(p=>p.active);if(S.dummy&&S.dummy.active)contenders.push(S.dummy);
 msg('Tour 3 : tous les joueurs encore en lice révèlent leurs dés !');
 Snd.reveal();
 for(const p of contenders){const all=p.dice.concat(S.whites);p.fig=evaluate(all);p.revealed=true;p.flip=true;
  p.usedSet=new Set([...usedIdx(all,p.fig.vals)].filter(i=>i<2))}
 renderSeats();await sleep(1300);
 let best=contenders[0].fig;for(const p of contenders)if(cmp(p.fig,best)>0)best=p.fig;
 const winners=contenders.filter(p=>cmp(p.fig,best)===0);
 const realW=winners.filter(p=>p!==S.dummy);
 // surligner les dés blancs utilisés par la meilleure figure
 const ref=winners[0];const all=ref.dice.concat(S.whites);const u=usedIdx(all,ref.fig.vals);
 $('#whites').querySelectorAll('.die').forEach((d,i)=>{if(u.has(i+2))d.classList.add('used')});
 if(!realW.length){
  S.dummy.win=true;S.dummy.badge='win';renderSeats();Snd.sad();
  msg(`👻 Le joueur fictif gagne avec ${figDesc(best)} : personne ne marque.`);
  log(`👻 Le joueur fictif remporte le 3e tour (${figDesc(best)}). Personne ne marque.`);
  await sleep(2000);return;
 }
 for(const w of realW){w.win=true;w.badge='win'}
 renderSeats();Snd.win();
 msg(`🏆 ${realW.map(w=>esc(w.name)).join(' et ')} ${realW.length>1?'remportent (égalité parfaite)':'remporte'} le 3e tour avec ${figDesc(best)} !`);
 for(const w of realW){
  log(`🏆 <b>${esc(w.name)}</b> remporte le 3e tour : ${figDesc(best)} → +${best.pts} et « 3e tour remporté » (+${S.mult}).`);
  if(best.rank>0)await mark(w,best.key);
  await mark(w,'win3');
 }
 const losers=S.players.filter(p=>p.active&&!realW.includes(p));
 for(const l of losers)l.status='Ne marque rien';
 renderSeats();
 await sleep(2000);
}

async function playManche(){
 S.whites=[];S.turn=0;
 for(const p of S.players)Object.assign(p,{dice:null,active:true,revealed:false,fig:null,status:'',badge:'',win:false,usedSet:null});
 S.dummy=S.useDummy?{dice:null,active:true,revealed:false,fig:null,status:'',badge:'',win:false}:null;
 renderInfo();renderTrack();renderWhites();renderSeats();clearAction();
 const fp=S.players[S.first];
 msg(`Manche ${S.manche} — <b>${esc(fp.name)}</b> est le premier joueur et récupère les 5 dés blancs.`);
 log(`<b>— Manche ${S.manche}</b> (1er joueur : ${esc(fp.name)})`);
 await sleep(1100);
 msg('Chacun lâche ses 2 dés de couleur dans son gobelet…');
 for(const p of S.players)p.dice=[rollDie(),rollDie()];
 if(S.dummy)S.dummy.dice=[rollDie(),rollDie()];
 Snd.cup();renderSeats(true);await sleep(950);renderSeats();
 for(const p of S.players)p.status='En lice';if(S.dummy)S.dummy.status='En lice';
 renderSeats();
 for(const turn of [1,2,3]){
  S.turn=turn;renderTrack();
  await rollWhites(turn===1?3:1);
  if(turn===3)break;
  const r=await decisionPhase(turn);
  if(r==='over')return;
 }
 await showdown();
}

function gameEnded(){return S.players.some(p=>ROWS.some(r=>p.sheet[r.k]>=6))}

async function playGame(){
 const id=++RUN;
 try{
  while(true){
   await playManche();
   if(id!==RUN)return;
   if(gameEnded()){showEnd();return}
   clearAction();
   await waitButton('Manche suivante ▶','green');
   S.first=(S.first+1)%S.players.length;S.manche++;
  }
 }catch(e){if(e!==ABORT)console.error(e)}
}

function showEnd(){
 Snd.fanfare();
 const ranking=S.players.slice().sort((a,b)=>total(b)-total(a)||b.sheet.win3-a.sheet.win3);
 const trig=S.players.filter(p=>ROWS.some(r=>p.sheet[r.k]>=6)).map(p=>esc(p.name)).join(', ');
 const medals=['🥇','🥈','🥉'];
 let extra='';
 if(S.players.length===1){const best=store.get('solobest',0);const t=total(S.players[0]);if(t>best){store.set('solobest',t);extra=`<p>🎉 Nouveau record solo : <b>${t} pts</b> !</p>`}else extra=`<p>Record solo : ${best} pts</p>`}
 const ov=modal(`<h2 style="text-align:center">🏁 Fin de la partie</h2>
  <p style="text-align:center;opacity:.9">${trig} a coché la 6e case d'une ligne.</p>
  ${ranking.map((p,i)=>`<div class="rank" style="--pc:${p.col.c}"><span class="pos">${medals[i]||(i+1)}</span><span class="n">${p.ai?'🤖':'👤'} ${esc(p.name)}<br><small style="font-weight:400;opacity:.8">3e tour remporté : ${p.sheet.win3} fois</small></span><span class="t">${total(p)}</span></div>`).join('')}
  ${extra}
  <div class="mbtns"><button class="btn red" id="eAgain">🔁 Rejouer</button><button class="btn" id="eSheets">📋 Voir les feuilles</button><button class="btn ghost" id="eNew">⚙️ Nouvelle partie</button></div>`);
 ov.querySelector('#eAgain').onclick=()=>{closeModal();startGame()};
 ov.querySelector('#eSheets').onclick=()=>{closeModal();msg('Partie terminée !');$('#action').innerHTML='<button class="btn red big" id="aAgain">🔁 Rejouer</button> <button class="btn ghost big" id="aNew">⚙️ Nouvelle partie</button>';
   $('#aAgain').onclick=startGame;$('#aNew').onclick=toSetup};
 ov.querySelector('#eNew').onclick=()=>{closeModal();toSetup()};
}

/* ================= MODALES ================= */
function modal(html){const ov=$('#overlay');ov.innerHTML=`<div class="modal">${html}</div>`;ov.classList.remove('hidden');return ov}
function closeModal(){$('#overlay').classList.add('hidden');$('#overlay').innerHTML=''}
const RULES=`<h2>📖 Règles du Pok'n Roll</h2>
<p><b>But :</b> former les meilleures figures en combinant vos <b>2 dés secrets</b> (dans votre gobelet) avec les <b>dés blancs</b> communs, et décider au bon moment d'<b>abandonner</b> pour sécuriser vos points… ou de <b>continuer</b> pour tenter de remporter le 3e tour.</p>
<h3>Une manche = 3 tours</h3>
<ol><li><b>Tour 1</b> : chacun lance ses 2 dés en secret, le premier joueur lance 3 dés blancs. Ceux qui <b>abandonnent</b> révèlent leurs dés, cochent leur figure <b>+ 1 case « Abandon au 1er tour »</b>.</li>
<li><b>Tour 2</b> : un 4e dé blanc est lancé. Ceux qui abandonnent cochent seulement leur figure.</li>
<li><b>Tour 3</b> : le 5e dé blanc est lancé, tous les joueurs restants révèlent. <b>Seul le meilleur</b> marque sa figure + une case « 3e tour remporté ». Les autres ne marquent rien.</li></ol>
<p>Si un seul joueur reste en lice avant le 3e tour, il gagne immédiatement la manche et coche « 3e tour remporté ».</p>
<h3>Figures (de la plus forte à la plus faible)</h3>
<ul><li>Yam's (5 identiques) ×12 · Carré ×9 · Grande Suite (1-5 ou 2-6) ×6 · Full ×5 · Brelan ×4 · Double Paire ×3 · Paire ×2 · Abandon au 1er tour ×1</li>
<li>« 3e tour remporté » vaut le <b>nombre de joueurs</b> par case (×2 en solo).</li>
<li>On garde les 5 meilleurs dés parmi ses 2 dés secrets et les dés blancs. À figure égale, les valeurs puis les dés restants départagent ; en cas d'égalité parfaite, les ex æquo marquent tous.</li></ul>
<h3>Joueur fictif</h3><p>À 3 joueurs (et en solo), un joueur fictif reçoit 2 dés secrets à chaque manche et reste toujours jusqu'au 3e tour. S'il a la meilleure figure, personne ne marque.</p>
<h3>Fin de partie</h3><p>Dès qu'un joueur coche la <b>6e case</b> d'une ligne, la partie s'arrête à la fin de la manche. Le plus haut total gagne ; en cas d'égalité, le plus de « 3e tour remporté ».</p>
<p style="opacity:.8">Plusieurs joueurs humains sur le même écran ? Le jeu affiche un écran de confidentialité avant chaque décision pour garder les dés secrets.</p>
<div class="mbtns"><button class="btn red" onclick="closeModal()">Compris !</button></div>`;
$('#rulesBtn1').onclick=()=>modal(RULES);
const overlayOpen=()=>!$('#overlay').classList.contains('hidden');
$('#tRules').onclick=()=>{if(overlayOpen())return;Snd.click();modal(RULES)};

function settingsModal(){
 const ov=modal(`<h2>⚙️ Réglages</h2>
  <div class="slider">🎵 Musique <input type="range" min="0" max="1" step="0.05" id="vMus" value="${Snd.musVol}"></div>
  <div class="slider">🔊 Bruitages <input type="range" min="0" max="1" step="0.05" id="vSfx" value="${Snd.sfxVol}"></div>
  <label class="opt">Vitesse <select id="vSpd"><option value="1.6">Lente</option><option value="1">Normale</option><option value="0.55">Rapide</option></select></label>
  <label class="opt"><input type="checkbox" id="vPct" ${S&&S.showPct?'checked':''}> Afficher les pourcentages de risque</label>
  <div class="mbtns"><button class="btn red" id="vOk">OK</button></div>`);
 ov.querySelector('#vSpd').value=String(speed);
 ov.querySelector('#vMus').oninput=e=>{Snd.setMusVol(+e.target.value)};
 ov.querySelector('#vSfx').oninput=e=>{Snd.setSfxVol(+e.target.value)};
 ov.querySelector('#vSfx').onchange=()=>Snd.click();
 ov.querySelector('#vSpd').onchange=e=>{speed=+e.target.value};
 ov.querySelector('#vPct').onchange=e=>{setPct(e.target.checked)};
 ov.querySelector('#vOk').onclick=()=>{closeModal();saveOpts()};
}
function setPct(on){S.showPct=on;$('#tPct').classList.toggle('off',!on);document.querySelectorAll('.risk').forEach(r=>r.classList.toggle('hidden',!on));saveOpts()}
function saveOpts(){store.set('opts',{pct:S?S.showPct:$('#optPct').checked,music:Snd.musicOn,sfx:Snd.sfxOn,speed:String(speed),musVol:Snd.musVol,sfxVol:Snd.sfxVol})}

$('#tPct').onclick=()=>{Snd.click();setPct(!S.showPct)};
$('#tSfx').onclick=()=>{Snd.setSfx(!Snd.sfxOn);$('#tSfx').classList.toggle('off',!Snd.sfxOn);Snd.click();saveOpts()};
$('#tMusic').onclick=()=>{Snd.init();Snd.setMusic(!Snd.musicOn);$('#tMusic').classList.toggle('off',!Snd.musicOn);saveOpts()};
$('#tSet').onclick=()=>{if(overlayOpen())return;Snd.click();settingsModal()};
$('#tQuit').onclick=()=>{
 if(overlayOpen()&&!$('#eAgain'))return;
 const ov=modal(`<h2>Quitter la partie ?</h2><p>La partie en cours sera perdue.</p><div class="mbtns"><button class="btn red" id="qY">Quitter</button><button class="btn" id="qN">Continuer à jouer</button></div>`);
 ov.querySelector('#qY').onclick=()=>{closeModal();toSetup()};
 ov.querySelector('#qN').onclick=()=>closeModal();
};

/* ================= LANCEMENT ================= */
function abortRun(){RUN++;if(pending){try{pending.rej(ABORT)}catch(e){}pending=null}}
function toSetup(){abortRun();$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');renderSetup();window.scrollTo(0,0)}
function startGame(){
 abortRun();closeModal();
 newGame();
 $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
 $('#tPct').classList.toggle('off',!S.showPct);$('#tSfx').classList.toggle('off',!Snd.sfxOn);$('#tMusic').classList.toggle('off',!Snd.musicOn);
 renderSheets();window.scrollTo(0,0);
 playGame();
}
$('#startBtn').onclick=()=>{
 cfg.players.forEach(p=>p.name=(p.name||'').trim());
 store.set('cfg',cfg);
 speed=+$('#optSpeed').value;
 Snd.sfxOn=$('#optSfx').checked;Snd.musicOn=$('#optMusic').checked;
 Snd.init();Snd.setSfx(Snd.sfxOn);
 if(Snd.musicOn)Snd.startMusic();
 Snd.click();
 store.set('opts',{pct:$('#optPct').checked,music:Snd.musicOn,sfx:Snd.sfxOn,speed:String(speed),musVol:Snd.musVol,sfxVol:Snd.sfxVol});
 startGame();
};
renderSetup();
</script>
