<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly – édition Paris</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#1f3b2c;color:#1b1b1b;min-height:100vh}
#app{display:flex;gap:14px;padding:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
button{font-family:inherit}

/* ---------- BOARD ---------- */
#board{display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  width:min(95vh,calc(100vw - 380px));min-width:620px;aspect-ratio:1;container-type:inline-size;
  background:#cde3cf;border:3px solid #111;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.cell{border:.5px solid #2b2b2b;position:relative;display:flex;overflow:hidden;background:#d6ead8;cursor:default;font-size:1.05cqi;line-height:1.12}
.cell.buyable{cursor:pointer}
.cell.buyable:hover{filter:brightness(1.06)}
.s-bottom{flex-direction:column}
.s-top{flex-direction:column-reverse}
.s-left{flex-direction:row-reverse}
.s-right{flex-direction:row}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:.3cqi;border-color:#2b2b2b;border-style:solid;border-width:0}
.s-bottom .band{height:22%;border-bottom-width:1px}
.s-top .band{height:22%;border-top-width:1px}
.s-left .band{width:22%;border-left-width:1px;flex-direction:column}
.s-right .band{width:22%;border-right-width:1px;flex-direction:column}
.info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:.35cqi .25cqi;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
.info .ico{font-size:2.4cqi;line-height:1}
.info .price{font-weight:500;text-transform:none}
.info .q{font-size:3.2cqi;font-weight:900;line-height:1}
.own{position:absolute;pointer-events:none}
.s-bottom .own{left:0;right:0;bottom:0;height:.55cqi}
.s-top .own{left:0;right:0;top:0;height:.55cqi}
.s-left .own{top:0;bottom:0;left:0;width:.55cqi}
.s-right .own{top:0;bottom:0;right:0;width:.55cqi}
.cell.mort .info{opacity:.45}
.cell.mort::after{content:"HYPOTHÉQUÉ";position:absolute;inset:auto 0 40% 0;text-align:center;font-size:.85cqi;font-weight:800;color:#b00;transform:rotate(-18deg);pointer-events:none}
.house{width:1.15cqi;height:1.15cqi;background:#1c9a3c;border:1px solid #063;border-radius:1px}
.hotel{width:2.3cqi;height:1.3cqi;background:#d42020;border:1px solid #600;border-radius:1px}
.cell.hl{box-shadow:inset 0 0 0 .4cqi #ffd400}
.corner{align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:800;font-size:1.3cqi;padding:.6cqi}
.corner .big{font-size:4.2cqi;line-height:1.1}
.pawns{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-wrap:wrap;justify-content:center;gap:.2cqi;pointer-events:none;z-index:3}
.s-top .pawns{bottom:24%}
.corner .pawns{bottom:4%}
.pawn{width:2.9cqi;height:2.9cqi;border-radius:50%;display:flex;align-items:center;justify-content:center;border:.25cqi solid #fff;box-shadow:0 .2cqi .5cqi rgba(0,0,0,.55)}
.pawn.jailed{border-style:dashed;border-color:#111}
.pawn svg{width:85%;height:85%}

/* ---------- CENTER ---------- */
.center{grid-row:2/11;grid-column:2/11;display:flex;flex-direction:column;align-items:center;padding:2cqi 3cqi;gap:1.2cqi;font-size:1.6cqi;overflow:hidden}
.title{font-family:Georgia,"Times New Roman",serif;font-size:4.6cqi;font-weight:700;letter-spacing:.5cqi;color:#1f3b2c;margin-top:.5cqi;border-bottom:.3cqi double #1f3b2c;padding:0 2cqi}
.subtitle{font-size:1.4cqi;font-weight:700;color:#2e5b3b;letter-spacing:.2cqi;margin-top:-.4cqi}
.turn{display:flex;align-items:center;gap:1cqi;font-size:2cqi;font-weight:800;background:#fff;padding:.6cqi 1.6cqi;border-radius:4cqi;box-shadow:0 .3cqi 1cqi rgba(0,0,0,.15)}
.turn .pawn{width:3.6cqi;height:3.6cqi}
#dice{display:flex;gap:2cqi}
.die{width:7cqi;height:7cqi;background:#fff;border-radius:1.2cqi;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.9cqi;box-shadow:0 .4cqi 0 #bbb,0 .6cqi 1.2cqi rgba(0,0,0,.3);border:1px solid #999}
.pip{width:1.35cqi;height:1.35cqi;border-radius:50%;background:#1b1b1b;margin:auto;visibility:hidden}
.pip.on{visibility:visible}
#dice.rolling .die{animation:shake .13s infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-.4cqi)}100%{transform:rotate(-12deg)}}
.dsum{font-size:1.5cqi;font-weight:700;color:#2e5b3b;min-height:2cqi}
#msg{min-height:2.2cqi;text-align:center;font-weight:600;max-width:52cqi}
#controls{display:flex;flex-wrap:wrap;gap:1cqi;justify-content:center;align-items:center;max-width:56cqi}
.btn{font-size:1.65cqi;padding:.9cqi 1.8cqi;border-radius:1cqi;border:2px solid #234;background:#fff;cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){background:#eef}
.btn.primary{background:#c8102e;color:#fff;border-color:#8a0a1f}
.btn.primary:hover:not(:disabled){background:#a50d26}
.btn.green{background:#1c9a3c;color:#fff;border-color:#0d5e22}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{width:100%;text-align:center;font-size:1.3cqi;color:#555}
.card{width:44cqi;min-height:18cqi;border-radius:1.4cqi;padding:1.6cqi;text-align:center;box-shadow:0 .6cqi 1.6cqi rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:1cqi;animation:pop .3s}
.card.chance{background:#f7941d;border:.4cqi solid #fff;outline:.3cqi solid #f7941d}
.card.cc{background:#7fc7ea;border:.4cqi solid #fff;outline:.3cqi solid #2a8bc2}
.card h3{margin:0;font-size:2.2cqi;letter-spacing:.2cqi}
.card p{margin:0;font-size:1.8cqi;font-weight:600;background:#fff;border-radius:1cqi;padding:1.4cqi;width:100%}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#log{width:100%;flex:1;min-height:6cqi;overflow:auto;background:rgba(255,255,255,.6);border-radius:1cqi;padding:.8cqi 1.2cqi;font-size:1.3cqi;border:1px solid #9bb}
#log div{padding:.15cqi 0;border-bottom:1px dotted #cdd}

/* ---------- SIDEBAR ---------- */
#side{width:340px;display:flex;flex-direction:column;gap:10px}
#side h2{color:#fff;margin:4px 0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.small-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer}
.pcard{background:#fff;border-radius:12px;padding:10px 12px;border-left:8px solid;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .2s}
.pcard.active{transform:scale(1.02);box-shadow:0 0 0 3px #ffd400,0 3px 12px rgba(0,0,0,.4)}
.pcard.out{opacity:.45;filter:grayscale(1)}
.ptop{display:flex;align-items:center;gap:10px}
.ptop .pawn{width:36px;height:36px;border-width:3px}
.pname{font-weight:800;font-size:16px;flex:1}
.pname small{display:block;font-weight:500;color:#666;font-size:12px}
.money{font-size:20px;font-weight:900;color:#1c7a33}
.money.neg{color:#c8102e}
.props{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{min-width:28px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.4);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;cursor:pointer;color:#fff;text-shadow:0 0 2px #000}
.chip.m{opacity:.4;background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.6) 4px 6px)}
.badges{font-size:12px;color:#444;margin-top:4px}

/* ---------- MODALS ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.hidden{display:none!important}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h1{margin:0 0 4px;font-size:26px;color:#c8102e}
.modal label{font-weight:700}
.prow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:10px}
.prow input{font-size:16px;padding:6px 10px;border-radius:6px;border:1px solid #aaa;width:100%}
.tokpick{display:flex;flex-wrap:wrap;gap:6px}
.tokbtn{width:56px;height:62px;border:2px solid #ccc;border-radius:8px;background:#f4f4f4;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;padding:2px}
.tokbtn svg{width:36px;height:36px}
.tokbtn.sel{border-color:#c8102e;background:#ffe9ec;box-shadow:0 0 0 2px #c8102e}
.tokbtn:disabled{opacity:.25;cursor:not-allowed}
.nbsel{display:flex;gap:6px;margin:8px 0}
.nbsel button{width:42px;height:36px;font-size:16px;font-weight:800;border-radius:8px;border:2px solid #234;background:#fff;cursor:pointer}
.nbsel button.sel{background:#c8102e;color:#fff;border-color:#8a0a1f}

.deed{width:300px;max-width:100%;background:#fff;border:2px solid #111;padding:6px;font-size:14px}
.deed .head{border:2px solid #111;text-align:center;padding:8px 4px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.7)}
.deed .head small{display:block;font-size:10px;letter-spacing:.15em}
.deed .head b{font-size:18px;text-transform:uppercase}
.deed table{width:100%;border-collapse:collapse;margin-top:6px}
.deed td{padding:3px 6px}
.deed td:last-child{text-align:right;font-weight:700}
.deed tr.cur td{background:#fff3b0}
.deed .sep td{border-top:1px solid #111}
.deedwrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.deedact{display:flex;flex-direction:column;gap:8px;min-width:200px;flex:1}
.deedact .btn{font-size:14px;padding:8px 12px}
.why{font-size:12px;color:#777}

@media (max-width:1000px){#board{width:96vw;min-width:0}#side{width:96vw}}
/* ---------- MODES / LOBBY ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:12px;border:2px solid #234;background:#fff;cursor:pointer}
.modebtn:hover:not(:disabled){background:#fff3f5;border-color:#c8102e}
.modebtn:disabled{opacity:.45;cursor:not-allowed}
.modebtn b{font-size:17px}
.modebtn span{font-size:13px;color:#555}
.modebtn .em{font-size:28px}
.note{font-size:13px;color:#555;margin-top:10px;line-height:1.4}
.err{color:#c8102e;font-weight:700}
.back{background:none;border:none;color:#1d7fd6;cursor:pointer;font-size:14px;padding:0;margin-bottom:6px}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:40px;font-weight:900;letter-spacing:8px;background:#fff3b0;border:2px dashed #c8a000;border-radius:12px;padding:6px 18px;display:inline-block;margin:6px 0}
.codein{font-family:ui-monospace,Consolas,monospace;font-size:22px!important;letter-spacing:6px;text-transform:lowercase}
.seat{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #ddd;border-radius:10px;margin-top:6px;border-left:6px solid}
.seat .pawn{width:34px;height:34px;border-width:3px}
.seat .who{flex:1;font-weight:700}
.seat .who small{display:block;font-weight:500;color:#777;font-size:12px}
.seat button{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #aaa;background:#fff;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
#banner{position:fixed;top:0;left:0;right:0;background:#c8102e;color:#fff;text-align:center;padding:8px;font-weight:700;z-index:60}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:#eee;color:#444;margin-left:4px;vertical-align:middle}
.tag.me{background:#ffd400;color:#000}
.tag.off{background:#c8102e;color:#fff}
.wait{font-style:italic;color:#555;text-align:center}
</style>
</head>

/* =================== ÉTAT =================== */
let S=null;            // état de la partie
let MODE='local';      // 'local' | 'solo' | 'host' | 'client'
const NET={r:null,ready:false,room:null,code:'',key:'',me:null,bots:[],lobby:[],lastA:{},hostSeen:false,lastSt:null,rollTimer:null,spectator:false,status:''};
const cur=()=>S.players[S.cur];
const nm=p=>`{p${p.id}}`;   // marqueur de nom, coloré à l'affichage
function fmt(t){
  return esc(t).replace(/\{p(\d)\}/g,(m,k)=>{const p=S&&S.players[k];return p?`<b style="color:${p.color}">${esc(p.name)}</b>`:''}).replace(/\n/g,'<br>');
}

/* Qui contrôle ce joueur depuis CET écran ? */
function isMine(p){
  if(MODE==='local')return true;
  if(MODE==='solo')return !p.bot;
  if(MODE==='host')return p.key==='host';
  if(MODE==='client')return !!NET.key&&p.key===NET.key;
  return false;
}
const isLocalTurn=()=>S&&S.phase!=='over'&&isMine(cur());

function ownsGroup(pid,g){return groupIdx(g).every(i=>S.props[i]&&S.props[i].owner===pid)}
function countType(pid,t){return SQ.filter((s,i)=>s.t===t&&S.props[i]&&S.props[i].owner===pid).length}
function rentFor(i){
  const s=SQ[i],pr=S.props[i];
  if(!pr||pr.mortgaged)return 0;
  if(s.t==='prop'){ if(pr.houses>0)return s.r[pr.houses]; return s.r[0]*(ownsGroup(pr.owner,s.g)?2:1); }
  if(s.t==='rail')return 25*2**(countType(pr.owner,'rail')-1);
  if(s.t==='util')return S.lastSum*(countType(pr.owner,'util')===2?10:4);
  return 0;
}
function canBuild(i){
  const s=SQ[i],pr=S.props[i]; if(!s||s.t!=='prop'||!pr)return [false,''];
  const p=S.players[pr.owner];
  if(!ownsGroup(pr.owner,s.g))return [false,'Il faut posséder tous les terrains du groupe.'];
  const gi=groupIdx(s.g);
  if(gi.some(k=>S.props[k].mortgaged))return [false,'Un terrain du groupe est hypothéqué.'];
  if(pr.houses>=5)return [false,'Hôtel déjà construit.'];
  if(pr.houses>Math.min(...gi.map(k=>S.props[k].houses)))return [false,'Construisez uniformément sur le groupe.'];
  if(p.money<GROUPS[s.g].h)return [false,'Fonds insuffisants.'];
  return [true,''];
}
function canSell(i){
  const s=SQ[i],pr=S.props[i]; if(!s||s.t!=='prop'||!pr||pr.houses===0)return false;
  return pr.houses>=Math.max(...groupIdx(s.g).map(k=>S.props[k].houses));
}
function canMortgage(i){
  const s=SQ[i],pr=S.props[i]; if(!pr||pr.mortgaged)return false;
  if(s.t==='prop')return groupIdx(s.g).every(k=>!S.props[k]||S.props[k].houses===0);
  return true;
}
const unmortCost=i=>Math.round(SQ[i].p/2*1.1);
const MANAGE_PHASES=['roll','jail','buy','end','debt'];
const canManageNow=i=>S&&!S.busy&&MANAGE_PHASES.includes(S.phase)&&S.props[i]&&S.props[i].owner===S.cur;

/* =================== PLATEAU =================== */
const cells=[];
function gridPos(i){
  if(i<=10)return {r:11,c:11-i,side:'bottom'};
  if(i<20)return {r:11-(i-10),c:1,side:'left'};
  if(i<=30)return {r:1,c:1+(i-20),side:'top'};
  return {r:1+(i-30),c:11,side:'right'};
}
function buildBoard(){
  const b=$('#board');b.innerHTML='';
  SQ.forEach((s,i)=>{
    const {r,c,side}=gridPos(i);const el=document.createElement('div');
    el.style.gridRow=r;el.style.gridColumn=c;
    const corner=[0,10,20,30].includes(i);
    el.className=`cell s-${side}`+(corner?' corner':'')+(isOwnable(i)?' buyable':'');
    let inner='';
    if(corner){
      if(i===0)inner=`<div style="font-size:1.2cqi">RECEVEZ 200 €<br>EN PASSANT ICI</div><div style="color:#c8102e;font-size:2.8cqi;font-weight:900">DÉPART</div><div class="big" style="color:#c8102e">⬅</div>`;
      if(i===10)inner=`<div class="big">🔒</div><div>EN PRISON</div><div style="font-size:1cqi;margin-top:.4cqi">— SIMPLE VISITE —</div>`;
      if(i===20)inner=`<div>PARC</div><div class="big">🅿️</div><div>GRATUIT</div>`;
      if(i===30)inner=`<div>ALLEZ EN</div><div class="big">👮</div><div>PRISON</div>`;
    }else{
      const band=s.t==='prop'?`<div class="band" style="background:${GROUPS[s.g].c}"></div>`:'';
      let mid='';
      if(s.t==='chance')mid=`<div class="q" style="color:${['#d4318c','#f39020','#1c58b8'][[7,22,36].indexOf(i)]}">?</div>`;
      else if(s.t==='cc')mid='<div class="ico">🧰</div>';
      else if(s.t==='rail')mid='<div class="ico">🚂</div>';
      else if(s.t==='util')mid=`<div class="ico">${s.ico}</div>`;
      else if(s.t==='tax')mid=`<div class="ico">${s.a===200?'💰':'💍'}</div>`;
      const price=s.p?`<div class="price">${s.p} €</div>`:s.t==='tax'?`<div class="price">Payez ${s.a} €</div>`:'<div></div>';
      inner=`${band}<div class="info"><div>${s.n}</div>${mid}${price}</div><div class="own"></div>`;
    }
    el.innerHTML=inner+'<div class="pawns"></div>';
    if(isOwnable(i))el.onclick=()=>G.openDeed(i);
    b.appendChild(el);cells[i]=el;
  });
  const c=document.createElement('div');c.className='center';
  c.innerHTML=`<div class="title">MONOPOLY</div><div class="subtitle">ÉDITION PARIS</div>
    <div class="turn" id="turn"></div>
    <div id="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
    <div class="dsum" id="dsum"></div>
    <div id="msg"></div>
    <div id="controls"></div>
    <div id="log"></div>`;
  b.appendChild(c);
  showDice(5,6);
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const face=n=>Array.from({length:9},(_,k)=>`<div class="pip ${(PIPS[n]||[]).includes(k)?'on':''}"></div>`).join('');
function showDice(a,b){$('#d1').innerHTML=face(a);$('#d2').innerHTML=face(b)}

/* =================== RENDU =================== */
function render(){
  if(!S)return;
  renderBoard();renderPlayers();renderCenter();
  if(!$('#deedModal').classList.contains('hidden'))G.openDeed(+$('#deedBox').dataset.i);
  sync();scheduleBot();
}
function renderBoard(){
  SQ.forEach((s,i)=>{
    const el=cells[i],pr=S.props[i];
    const own=el.querySelector('.own');if(own)own.style.background=pr?S.players[pr.owner].color:'transparent';
    el.classList.toggle('mort',!!(pr&&pr.mortgaged));
    const band=el.querySelector('.band');
    if(band)band.innerHTML=!pr?'':pr.houses===5?'<div class="hotel"></div>':'<div class="house"></div>'.repeat(pr.houses);
    el.classList.toggle('hl',S.hl===i);
    el.querySelector('.pawns').innerHTML=S.players.filter(p=>!p.bankrupt&&p.pos===i).map(pawnHTML).join('');
  });
}
function renderPlayers(){
  const labels={local:'Partie locale',solo:'Partie solo',host:`Réseau · hôte · ${NET.code.toUpperCase()}`,client:`Réseau · ${NET.code.toUpperCase()}`};
  $('#modeLabel').textContent=labels[MODE]||'Joueurs';
  $('#players').innerHTML=S.players.map((p,k)=>{
    const mine=Object.keys(S.props).map(Number).filter(i=>S.props[i].owner===p.id).sort((a,b)=>a-b);
    const chips=mine.map(i=>{const pr=S.props[i];const lab=pr.houses===5?'🏨':pr.houses?('🏠'+pr.houses):SQ[i].t==='rail'?'🚂':SQ[i].t==='util'?SQ[i].ico:'';
      return `<div class="chip ${pr.mortgaged?'m':''}" style="background:${sqColor(i)}" title="${esc(SQ[i].n)}" onclick="G.openDeed(${i})">${lab}</div>`}).join('');
    const tname=TOKENS.find(t=>t.id===p.token).n;
    const tags=(p.bot?'<span class="tag">🤖 ordi</span>':'')+(MODE!=='local'&&isMine(p)&&!p.bot?'<span class="tag me">vous</span>':'')+(p.away?'<span class="tag off">déconnecté</span>':'');
    return `<div class="pcard ${k===S.cur&&S.phase!=='over'?'active':''} ${p.bankrupt?'out':''}" style="border-color:${p.color}">
      <div class="ptop">${pawnHTML(p)}<div class="pname">${esc(p.name)}${tags}<small>${tname} · ${p.bankrupt?'Faillite':SQ[p.pos].n}${p.inJail?' (en prison)':''}</small></div>
      <div class="money ${p.money<0?'neg':''}">${eur(p.money)}</div></div>
      <div class="props">${chips||'<span style="font-size:12px;color:#999">Aucune propriété</span>'}</div>
      ${p.jailCards?`<div class="badges">🎟️ Carte « Libéré de prison » ×${p.jailCards}</div>`:''}
    </div>`}).join('');
}
function renderCenter(){
  const p=cur(),mine=isLocalTurn();
  $('#turn').innerHTML=`${pawnHTML(p)}<span>${MODE!=='local'&&mine?'À vous de jouer, '+esc(p.name)+' !':'Au tour de '+esc(p.name)}</span>`;
  $('#msg').innerHTML=fmt(S.msg||'');
  $('#log').innerHTML=S.log.map(l=>`<div>${fmt(l)}</div>`).join('');
  if(!S.rolling)$('#dsum').textContent=S.dice?`${S.dice[0]} + ${S.dice[1]} = ${S.dice[0]+S.dice[1]}${S.dice[0]===S.dice[1]?' — DOUBLE !':''}`:'';
  const dis=S.busy?'disabled':'';let h='';
  const cardBox=ok=>{const c=S.card,cd=(c.deck==='chance'?CHANCE:CC)[c.idx];
    return `<div class="card ${c.deck}"><h3>${c.deck==='chance'?'❓ CHANCE':'🧰 CAISSE DE COMMUNAUTÉ'}</h3><p>${cd.x}</p>${ok?`<button class="btn primary" onclick="G.applyCard()" ${dis}>OK</button>`:''}</div>`};
  if(S.phase==='over'){h='<div class="wait">Partie terminée.</div>'}
  else if(!mine){
    if(S.phase==='card'&&S.card)h=cardBox(false);
    const why=p.bot?'🤖 '+esc(p.name)+' réfléchit…':p.away?esc(p.name)+' est déconnecté : l\'ordinateur joue à sa place…':'En attente de '+esc(p.name)+'…';
    h+=`<div class="wait">${MODE==='client'&&NET.spectator?'👀 Vous regardez la partie. ':''}${why}</div>`;
  }else switch(S.phase){
    case 'roll':h=`<button class="btn primary" onclick="G.roll()" ${dis}>🎲 Lancer les dés</button>`;break;
    case 'jail':h=`<button class="btn" onclick="G.payJail()" ${p.money<50||S.busy?'disabled':''}>Payer 50 € et sortir</button>
      ${p.jailCards?`<button class="btn green" onclick="G.useJailCard()" ${dis}>Utiliser la carte « Libéré de prison »</button>`:''}
      <button class="btn primary" onclick="G.roll()" ${dis}>🎲 Tenter un double (essai ${p.jailTurns+1}/3)</button>`;break;
    case 'buy':{const s=SQ[p.pos];
      h=`<button class="btn green" onclick="G.buy()" ${p.money<s.p||S.busy?'disabled':''}>Acheter pour ${eur(s.p)}</button>
      <button class="btn" onclick="G.openDeed(${p.pos})">Voir la carte</button>
      <button class="btn" onclick="G.pass()" ${dis}>Ne pas acheter</button>`;
      if(p.money<s.p)h+=`<div class="hint">Fonds insuffisants — vous pouvez hypothéquer ou vendre des maisons pour réunir la somme.</div>`;break;}
    case 'card':h=cardBox(true);break;
    case 'end':h=`<button class="btn primary" onclick="G.endTurn()" ${dis}>Fin du tour ➜</button>`;break;
    case 'debt':h=`<div class="hint" style="color:#c8102e;font-weight:700">Solde négatif (${eur(p.money)}) ! Vendez des maisons ou hypothéquez vos propriétés (cliquez dessus).</div>
      <button class="btn" onclick="G.bankrupt()" ${dis}>Déclarer faillite</button>`;break;
  }
  $('#controls').innerHTML=h;
}
function log(t){S.log.unshift(t);if(S.log.length>60)S.log.pop()}

/* =================== MOTEUR (local, solo, hôte) =================== */
async function moveSteps(p,n){
  for(let k=0;k<n;k++){
    p.pos=(p.pos+1)%40;
    if(p.pos===0){p.money+=200;log(`${nm(p)} passe par la case Départ : +200 €`)}
    S.hl=p.pos;render();await sleep(170);
  }
}
async function moveBack(p,n){for(let k=0;k<n;k++){p.pos=(p.pos+39)%40;S.hl=p.pos;render();await sleep(170)}}
const moveTo=(p,t)=>moveSteps(p,(t-p.pos+40)%40);
function pay(p,amount,to){p.money-=amount;if(to)to.money+=amount;S.creditor=to?to.id:null}
function sendToJail(p){
  p.pos=10;p.inJail=true;p.jailTurns=0;S.rolledDouble=false;S.hl=10;
  log(`${nm(p)} va en prison ! 🚔`);S.msg=`${nm(p)} est envoyé en prison.`;
  finishMove();
}
async function landOn(p){
  const i=p.pos,s=SQ[i];S.hl=i;
  if(isOwnable(i)){
    const pr=S.props[i];
    if(!pr){S.phase='buy';S.msg=`${s.n} est libre. Voulez-vous l'acheter ?`;render();return}
    if(pr.owner===p.id){S.msg=`${nm(p)} est chez lui sur ${s.n}.`;finishMove();return}
    const owner=S.players[pr.owner];
    if(pr.mortgaged){S.msg=`${s.n} est hypothéqué : pas de loyer.`;finishMove();return}
    const rent=rentFor(i);pay(p,rent,owner);
    log(`${nm(p)} paie ${eur(rent)} de loyer à ${nm(owner)} (${s.n})`);
    S.msg=`${nm(p)} paie ${eur(rent)} à ${nm(owner)}.`;finishMove();return;
  }
  switch(s.t){
    case 'tax':pay(p,s.a,null);log(`${nm(p)} paie ${eur(s.a)} (${s.n})`);S.msg=`${s.n} : ${eur(s.a)}`;finishMove();return;
    case 'chance':case 'cc':{
      const deck=s.t,idx=S.decks[deck].shift();S.decks[deck].push(idx);
      S.card={deck,idx};S.phase='card';S.msg='';render();return;}
    case 'gotojail':sendToJail(p);return;
    case 'parking':S.msg='Parc gratuit : reposez-vous !';break;
    case 'jail':S.msg='Simple visite à la prison.';break;
    case 'go':S.msg='Case Départ !';break;
  }
  finishMove();
}
function finishMove(){
  const p=cur();
  if(p.money<0){S.phase='debt';S.msg=`${nm(p)} doit trouver ${eur(-p.money)} !`;render();return}
  if(S.rolledDouble&&!p.inJail){S.phase='roll';S.msg=(S.msg?S.msg+'\n':'')+'🎉 Double ! Relancez les dés.'}
  else S.phase='end';
  render();
}
function nextTurn(){
  const n=S.players.length;let k=S.cur;
  do{k=(k+1)%n}while(S.players[k].bankrupt);
  S.cur=k;S.doubles=0;S.rolledDouble=false;S.creditor=null;S.card=null;
  const p=cur();S.phase=p.inJail?'jail':'roll';
  S.msg=p.inJail?`${nm(p)} est en prison.`:'';S.hl=null;render();
}
function checkWinner(){
  if(S.players.filter(p=>!p.bankrupt).length===1){S.phase='over';render();showWin();return true}
  return false;
}
function showWin(){
  const w=S.players.find(p=>!p.bankrupt);if(!w)return;
  $('#winBox').innerHTML=`<div style="font-size:60px">🏆</div><h1>${esc(w.name)} gagne la partie !</h1>
    <div style="margin:10px auto;width:70px">${pawnHTML(w).replace('class="pawn','style="width:70px;height:70px" class="pawn')}</div>
    <p>Fortune finale : <b>${eur(w.money)}</b></p><button class="btn primary" style="font-size:16px" onclick="G.newGame()">Nouvelle partie</button>`;
  $('#winModal').classList.remove('hidden');
}

const E={
  async roll(){
    if(S.busy||!['roll','jail'].includes(S.phase))return;
    S.busy=true;S.rolling=true;S.msg='';render();
    for(let k=0;k<9;k++){showDice(r6(),r6());await sleep(70)}
    const a=r6(),b=r6();S.dice=[a,b];S.rolling=false;showDice(a,b);
    const p=cur(),dbl=a===b;S.lastSum=a+b;
    log(`${nm(p)} lance ${a} + ${b} = ${a+b}${dbl?' (double)':''}`);
    if(p.inJail){
      if(dbl){p.inJail=false;p.jailTurns=0;S.rolledDouble=false;log(`${nm(p)} sort de prison grâce au double`)}
      else{
        p.jailTurns++;
        if(p.jailTurns>=3){pay(p,50,null);p.inJail=false;p.jailTurns=0;S.rolledDouble=false;log(`${nm(p)} paie 50 € après 3 tentatives et sort de prison`)}
        else{S.busy=false;S.msg='Pas de double… reste en prison.';S.phase='end';render();return}
      }
    }else{
      S.rolledDouble=dbl;
      if(dbl){S.doubles++;if(S.doubles===3){S.busy=false;log('Trois doubles d\'affilée !');sendToJail(p);return}}
    }
    S.phase='moving';render();
    await moveSteps(p,a+b);
    S.busy=false;await landOn(p);
  },
  payJail(){const p=cur();if(S.phase!=='jail'||S.busy||p.money<50)return;pay(p,50,null);p.inJail=false;p.jailTurns=0;log(`${nm(p)} paie 50 € pour sortir de prison`);S.phase='roll';S.msg='Libre ! Lancez les dés.';render()},
  useJailCard(){const p=cur();if(S.phase!=='jail'||S.busy||!p.jailCards)return;p.jailCards--;p.inJail=false;p.jailTurns=0;log(`${nm(p)} utilise sa carte « Libéré de prison »`);S.phase='roll';S.msg='Libre ! Lancez les dés.';render()},
  buy(){
    const p=cur(),i=p.pos,s=SQ[i];if(S.phase!=='buy'||S.busy||p.money<s.p)return;
    p.money-=s.p;S.props[i]={owner:p.id,houses:0,mortgaged:false};
    log(`${nm(p)} achète ${s.n} pour ${eur(s.p)}`);
    S.msg=`${s.n} appartient maintenant à ${nm(p)}.`;
    if(s.t==='prop'&&ownsGroup(p.id,s.g))S.msg+='\n🏠 Groupe complet : construction de maisons possible !';
    $('#deedModal').classList.add('hidden');finishMove();
  },
  pass(){if(S.phase!=='buy'||S.busy)return;log(`${nm(cur())} n'achète pas ${SQ[cur().pos].n}`);S.msg='';finishMove()},
  async applyCard(){
    if(S.busy||S.phase!=='card')return;
    const p=cur(),c=(S.card.deck==='chance'?CHANCE:CC)[S.card.idx];S.busy=true;S.phase='moving';S.msg='';
    log(`${nm(p)} pioche : « ${c.x} »`);render();
    switch(c.t){
      case 'move':await moveTo(p,c.to);S.busy=false;await landOn(p);return;
      case 'moveback':await moveBack(p,(p.pos-c.to+40)%40);S.busy=false;await landOn(p);return;
      case 'back':await moveBack(p,c.n);S.busy=false;await landOn(p);return;
      case 'jail':S.busy=false;sendToJail(p);return;
      case 'money':if(c.a<0)pay(p,-c.a,null);else p.money+=c.a;break;
      case 'jailfree':p.jailCards++;break;
      case 'repairs':{let h=0,H=0;for(const i in S.props){const pr=S.props[i];if(pr.owner===p.id){if(pr.houses===5)H++;else h+=pr.houses}}
        const tot=h*c.h+H*c.H;pay(p,tot,null);log(`${nm(p)} paie ${eur(tot)} de réparations (${h} maison(s), ${H} hôtel(s))`);break;}
      case 'birthday':S.players.forEach(o=>{if(o!==p&&!o.bankrupt){const v=Math.min(c.a,Math.max(o.money,0));o.money-=v;p.money+=v}});break;
    }
    S.busy=false;finishMove();
  },
  endTurn(){if(S.phase!=='end'||S.busy)return;nextTurn()},
  bankrupt(){
    if(S.phase!=='debt'||S.busy)return;
    const p=cur();
    const cred=(S.creditor!=null&&S.creditor!==p.id&&!S.players[S.creditor].bankrupt)?S.players[S.creditor]:null;
    for(const i in S.props){if(S.props[i].owner===p.id){if(cred){S.props[i].owner=cred.id;S.props[i].houses=0}else delete S.props[i]}}
    if(cred)cred.jailCards+=p.jailCards;
    p.bankrupt=true;p.money=0;p.jailCards=0;
    log(`💀 ${nm(p)} fait faillite${cred?' au profit de '+nm(cred):''}`);
    if(!checkWinner())nextTurn();
  },
  build(i){if(!canManageNow(i)||!canBuild(i)[0])return;const s=SQ[i],p=cur();p.money-=GROUPS[s.g].h;S.props[i].houses++;
    log(`${nm(p)} construit ${S.props[i].houses===5?'un hôtel':'une maison'} sur ${s.n}`);afterManage()},
  sell(i){if(!canManageNow(i)||!canSell(i))return;const s=SQ[i],p=cur(),was=S.props[i].houses;S.props[i].houses--;p.money+=GROUPS[s.g].h/2;
    log(`${nm(p)} vend ${was===5?"l'hôtel":'une maison'} de ${s.n}`);afterManage()},
  mortgage(i){if(!canManageNow(i)||!canMortgage(i))return;const p=cur();S.props[i].mortgaged=true;p.money+=SQ[i].p/2;log(`${nm(p)} hypothèque ${SQ[i].n} (+${SQ[i].p/2} €)`);afterManage()},
  unmortgage(i){if(!canManageNow(i)||!S.props[i].mortgaged)return;const p=cur(),c=unmortCost(i);if(p.money<c)return;p.money-=c;S.props[i].mortgaged=false;log(`${nm(p)} lève l'hypothèque de ${SQ[i].n} (−${c} €)`);afterManage()},
};
function afterManage(){

}
function newState(list){

     cur:0,props:{},phase:'roll',doubles:0,rolledDouble:false,lastSum:0,busy:false,rolling:false,dice:null,msg:'',log:[],hl:null,creditor:null,

/* =================== ORDINATEUR =================== */
let botTimer=null;
function scheduleBot(){
  if(MODE==='client'||botTimer||!S||S.busy||S.phase==='over'||S.phase==='moving')return;
  const p=cur();if(!(p.bot||p.away))return;
  botTimer=setTimeout(()=>{botTimer=null;botStep()},750);
}
function botStep(){
  if(!S||S.busy)return;const p=cur();if(!(p.bot||p.away))return;
  const mineProps=()=>Object.keys(S.props).map(Number).filter(i=>S.props[i].owner===p.id);
  switch(S.phase){
    case 'jail':if(p.jailCards)E.useJailCard();else if(p.money>=250)E.payJail();else E.roll();break;
    case 'roll':E.roll();break;
    case 'buy':{const s=SQ[p.pos];
      const completes=s.t==='prop'&&groupIdx(s.g).every(k=>k===p.pos||(S.props[k]&&S.props[k].owner===p.id));
      if(p.money>=s.p&&(p.money-s.p>=150||completes))E.buy();else E.pass();break;}
    case 'card':E.applyCard();break;
    case 'end':{
      const unm=mineProps().find(i=>S.props[i].mortgaged&&p.money-unmortCost(i)>=400);
      if(unm!=null){E.unmortgage(unm);break}
      const b=mineProps().sort((x,y)=>y-x).find(i=>canBuild(i)[0]&&p.money-GROUPS[SQ[i].g].h>=250);
      if(b!=null){E.build(b);break}
      E.endTurn();break;}
    case 'debt':{
      const s=mineProps().find(i=>canSell(i));if(s!=null){E.sell(s);break}
      const m=mineProps().sort((x,y)=>(SQ[x].t==='prop')-(SQ[y].t==='prop')).find(i=>canMortgage(i));if(m!=null){E.mortgage(m);break}
      E.bankrupt();break;}
  }
}

/* =================== RÉSEAU =================== */
const ACTIONS=['roll','payJail','useJailCard','buy','pass','applyCard','endTurn','bankrupt','build','sell','mortgage','unmortgage'];
let actSeq=0;
function sendAction(f,x){
  actSeq=Math.max(Date.now(),actSeq+1);
  NET.room.presence({a:{n:actSeq,f,x}}).catch(()=>{});
}
function encode(){
  const st={ph:S.phase,cur:S.cur,d:S.dice,rl:S.rolling?1:0,ls:S.lastSum,hl:S.hl,b:S.busy?1:0,m:(S.msg||'').slice(0,300),
    c:S.card?[S.card.deck,S.card.idx]:null,
    P:S.players.map(p=>[p.name,p.token,p.money,p.pos,p.inJail?1:0,p.jailTurns,p.jailCards,p.bankrupt?1:0,p.bot?1:0,p.key,p.away?1:0]),
    R:Object.entries(S.props).map(([i,pr])=>[+i,pr.owner,pr.houses,pr.mortgaged?1:0]),
    L:S.log.slice(0,8).map(l=>l.slice(0,160))};
  while(JSON.stringify(st).length>3800&&st.L.length)st.L.pop();
  return st;
}
function lobbyState(){return {ph:'lobby',LB:NET.lobby.map(s=>[s.name,s.token,s.key,s.bot?1:0])}}
function sync(){
  if(MODE!=='host'||!NET.room)return;
  NET.room.presence({role:'host',st:S?encode():lobbyState()}).catch(()=>{});
}
const num=(v,d=0)=>typeof v==='number'&&isFinite(v)?v:d;
function decode(st){
  const P=Array.isArray(st.P)?st.P.slice(0,6):[];
  const s={players:P.map((a,k)=>({id:k,name:String(a[0]).slice(0,16),token:validTok(a[1])?a[1]:'chapeau',color:PCOLORS[k],money:num(a[2]),pos:num(a[3])%40,
      inJail:!!a[4],jailTurns:num(a[5]),jailCards:num(a[6]),bankrupt:!!a[7],bot:!!a[8],key:String(a[9]||''),away:!!a[10]})),
    cur:Math.min(num(st.cur),Math.max(P.length-1,0)),props:{},phase:String(st.ph),dice:Array.isArray(st.d)?st.d.map(v=>num(v,1)):null,rolling:!!st.rl,
    lastSum:num(st.ls),hl:st.hl==null?null:num(st.hl),busy:!!st.b,msg:String(st.m||''),log:Array.isArray(st.L)?st.L.map(String):[],card:null};
  if(Array.isArray(st.R))for(const r of st.R){const i=num(r[0],-1);if(isOwnable(i)&&s.players[r[1]])s.props[i]={owner:r[1],houses:Math.min(num(r[2]),5),mortgaged:!!r[3]}}
  if(Array.isArray(st.c)&&['chance','cc'].includes(st.c[0])){const d=st.c[0]==='chance'?CHANCE:CC;if(d[st.c[1]])s.card={deck:st.c[0],idx:st.c[1]}}
  return s;
}

/* --- Hôte --- */
function guestPeers(){
  const seen=new Set();
  return NET.room.peers().filter(p=>{const pr=p.presence||{};if(pr.role!=='guest'||typeof pr.key!=='string'||!pr.key||seen.has(pr.key))return false;seen.add(pr.key);return true});
}
function hostRebuildLobby(){
  const seats=[{name:NET.me.name,token:NET.me.token,key:'host'}];
  for(const g of guestPeers()){const pr=g.presence;seats.push({name:(String(pr.name||'').trim().slice(0,16))||'Invité',token:pr.token,key:pr.key.slice(0,24)})}
  NET.extra=Math.max(0,seats.length+NET.bots.length-6);
  const all=seats.concat(NET.bots).slice(0,6);
  const used=new Set();
  for(const s of all){if(!validTok(s.token)||used.has(s.token))s.token=TOKENS.find(t=>!used.has(t.id)).id;used.add(s.token)}
  const sig=JSON.stringify([all,NET.extra]);
  if(sig===NET.lobbySig)return;   // évite une boucle : notre propre présence déclenche aussi onPeers
  NET.lobbySig=sig;NET.lobby=all;sync();renderLobby();
}
function hostOnPeers(){
  if(!S){hostRebuildLobby();return}
  const present=new Set(guestPeers().map(g=>g.presence.key));
  let changed=false;
  for(const p of S.players){
    if(!p.key||p.key==='host'||p.bot)continue;
    const away=!present.has(p.key);
    if(away!==p.away){p.away=away;changed=true;log(away?`📴 ${nm(p)} s'est déconnecté (l'ordinateur prend le relais)`:`📶 ${nm(p)} est de retour`)}
  }
  if(changed)render();
  for(const g of guestPeers()){
    const pr=g.presence,a=pr.a,key=pr.key;
    if(!a||typeof a.n!=='number'||a.n<=(NET.lastA[key]||0))continue;
    NET.lastA[key]=a.n;
    if(!S||S.phase==='over'||!ACTIONS.includes(a.f))continue;
    if(cur().key!==key||cur().away)continue;
    const x=Array.isArray(a.x)?a.x.slice(0,1).map(v=>Number.isInteger(v)&&v>=0&&v<40?v:-1):[];
    if(['build','sell','mortgage','unmortgage'].includes(a.f)&&!(x[0]>=0))continue;
    E[a.f](...x);
  }
}
/* --- Invité --- */
function clientOnPeers(){
  const h=NET.room.peers().find(p=>p.presence&&p.presence.role==='host'&&p.presence.st&&typeof p.presence.st==='object');
  if(!h){
    if(NET.hostSeen){$('#banner').textContent='⚠️ L\'hôte a quitté la partie (ou sa connexion est coupée).';$('#banner').classList.remove('hidden')}
    return;
  }
  NET.hostSeen=true;$('#banner').classList.add('hidden');
  if(h.presence.st===NET.lastSt)return;
  NET.lastSt=h.presence.st;applyState(h.presence.st);
}
function applyState(st){
  if(st.ph==='lobby'){
    NET.lobby=(Array.isArray(st.LB)?st.LB.slice(0,6):[]).map(a=>({name:String(a[0]).slice(0,16),token:validTok(a[1])?a[1]:'chapeau',key:String(a[2]),bot:!!a[3]}));
    NET.status='lobby';S=null;$('#lobby').classList.remove('hidden');renderLobby();return;
  }
  $('#setup').classList.add('hidden');$('#lobby').classList.add('hidden');
  S=decode(st);
  NET.spectator=!S.players.some(p=>p.key===NET.key);
  if(S.rolling){if(!NET.rollTimer)NET.rollTimer=setInterval(()=>showDice(r6(),r6()),70);$('#dsum').textContent='🎲 …'}
  else{clearInterval(NET.rollTimer);NET.rollTimer=null;if(S.dice)showDice(S.dice[0],S.dice[1])}

  if(S.phase==='over')showWin();
}

  },
  async joinGame(){
    readNames();if(!NET.r){setup.err='Réseau indisponible.';renderSetup();return}
    const code=(($('#codeIn')||{}).value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');setup.code=code;
    if(code.length<3){setup.err='Saisissez le code donné par l\'hôte.';renderSetup();return}
    setup.err='Connexion…';renderSetup();
    let key='';try{key=localStorage.getItem('monopoly-key-'+code)||''}catch(e){}
    if(!key){key=randStr(10);try{localStorage.setItem('monopoly-key-'+code,key)}catch(e){}}
    try{NET.room=await NET.r.join('monopoly-'+code)}catch(e){setup.err='Connexion impossible ('+(e&&e.code||'erreur')+').';renderSetup();return}
    MODE='client';NET.code=code;NET.key=key;NET.status='searching';NET.lobby=[];
    NET.room.presence({role:'guest',key,name:(setup.names[0]||'').trim().slice(0,16)||'Invité',token:setup.toks[0]}).catch(()=>{});
    NET.room.onPeers(()=>clientOnPeers());
    $('#setup').classList.add('hidden');$('#lobby').classList.remove('hidden');renderLobby();
    setTimeout(()=>{if(MODE==='client'&&!NET.hostSeen){NET.status='notfound';renderLobby()}},8000);
  },
};
for(const f of ACTIONS)G[f]=(...x)=>{
  if(!S||!isLocalTurn())return;
  if(MODE==='client'){sendAction(f,x);return}
  E[f](...x);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')G.closeDeed()});

/* =================== ÉCRAN DE CONFIGURATION =================== */
const setup={mode:null,n:2,bots:2,toks:TOKENS.map(t=>t.id),names:[],code:'',err:''};
function readNames(){for(let k=0;k<6;k++){const el=$('#nm'+k);if(el)setup.names[k]=el.value}const c=$('#codeIn');if(c)setup.code=c.value}
function rowHTML(k,label,taken){
  return `<div class="prow" style="border-left:6px solid ${PCOLORS[k]}">
    <label>${label}</label>
    <input id="nm${k}" placeholder="Prénom" maxlength="16" value="${esc(setup.names[k]||'')}">
    <div class="tokpick">${TOKENS.map(t=>`<button class="tokbtn ${setup.toks[k]===t.id?'sel':''}" ${taken.includes(t.id)?'disabled':''} onclick="G.setTok(${k},'${t.id}')">${tokSVG(t.id)}<span>${t.n}</span></button>`).join('')}</div>
  </div>`;
}
function renderSetup(){
  const box=$('#setupBox');const m=setup.mode;
  const err=setup.err?`<span class="${/…$/.test(setup.err)?'':'err'}">${esc(setup.err)}</span>`:'';
  if(!m){
    const netOk=!!NET.r;
    box.innerHTML=`<h1>Monopoly – édition Paris</h1><div>Choisissez un mode de jeu :</div>
      <div class="modes">
        <button class="modebtn" onclick="G.setMode('solo')"><span class="em">🧑‍💻</span><b>Solo</b><span>Vous contre 1 à 5 ordinateurs.</span></button>
        <button class="modebtn" onclick="G.setMode('local')"><span class="em">👥</span><b>Local</b><span>2 à 6 joueurs sur le même écran.</span></button>
        <button class="modebtn" onclick="G.setMode('host')" ${netOk?'':'disabled'}><span class="em">🌐</span><b>Réseau – Héberger</b><span>Créez une partie et donnez le code à vos amis.</span></button>
        <button class="modebtn" onclick="G.setMode('join')" ${netOk?'':'disabled'}><span class="em">🔗</span><b>Réseau – Rejoindre</b><span>Entrez le code reçu de l'hôte.</span></button>
      </div>
      ${netOk?'':`<div class="note">${NET.ready?'🌐 Le jeu en réseau fonctionne uniquement dans la page publiée sur claude.ai, en étant connecté.':'⏳ Connexion au service réseau…'}</div>`}`;
    return;
  }
  const back='<button class="back" onclick="G.setMode(null)">← Changer de mode</button>';
  if(m==='local'){
    const used=k=>setup.toks.slice(0,setup.n).filter((_,j)=>j!==k);
    box.innerHTML=`${back}<h1>👥 Partie locale</h1><div>Nombre de joueurs :</div>
      <div class="nbsel">${[2,3,4,5,6].map(n=>`<button class="${n===setup.n?'sel':''}" onclick="G.setN(${n})">${n}</button>`).join('')}</div>
      ${Array.from({length:setup.n},(_,k)=>rowHTML(k,'Joueur '+(k+1),used(k))).join('')}
      <div class="row"><span style="flex:1"></span>${err}<button class="btn primary" style="font-size:17px" onclick="G.start()">Commencer ▶</button></div>`;
  }else if(m==='solo'){
    box.innerHTML=`${back}<h1>🧑‍💻 Partie solo</h1>${rowHTML(0,'Vous',[])}
      <div style="margin-top:12px">Nombre d'ordinateurs :</div>
      <div class="nbsel">${[1,2,3,4,5].map(n=>`<button class="${n===setup.bots?'sel':''}" onclick="G.setBots(${n})">${n}</button>`).join('')}</div>
      <div class="row"><span style="flex:1"></span>${err}<button class="btn primary" style="font-size:17px" onclick="G.start()">Commencer ▶</button></div>`;
  }else if(m==='host'){
    box.innerHTML=`${back}<h1>🌐 Héberger une partie</h1>${rowHTML(0,'Vous (hôte)',[])}
      <div class="note">Votre écran fait tourner la partie : gardez cette page ouverte jusqu'à la fin.</div>
      <div class="row"><span style="flex:1"></span>${err}<button class="btn primary" style="font-size:17px" onclick="G.hostCreate()">Créer la partie ▶</button></div>`;
  }else if(m==='join'){
    box.innerHTML=`${back}<h1>🔗 Rejoindre une partie</h1>
      <label>Code de la partie</label><div class="prow" style="margin-top:4px"><input id="codeIn" class="codein" maxlength="12" placeholder="ex : k7p2m" value="${esc(setup.code)}"></div>
      ${rowHTML(0,'Vous',[])}
      <div class="row"><span style="flex:1"></span>${err}<button class="btn primary" style="font-size:17px" onclick="G.joinGame()">Rejoindre ▶</button></div>`;
  }
}

/* =================== DÉMARRAGE =================== */
buildBoard();
renderSetup();
(async()=>{
  try{NET.r=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('room'):null}catch(e){NET.r=null}
  NET.ready=true;if(!setup.mode)renderSetup();
})();
</script>
