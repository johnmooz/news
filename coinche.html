<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Belote Coinchée</title>
<style>
  :root{
    --bg:#0f3d2e; --felt:#14523d; --card:#fdfaf3; --ink:#1d1d1b; --muted:#6b6b63;
    --red:#c0392b; --gold:#d4a017; --line:#e4ddcc; --nous:#1f6feb; --eux:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 0%,var(--felt),var(--bg));color:var(--ink);min-height:100vh;padding:16px}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  h1{color:#fff;text-align:center;margin:4px 0 0;font-size:1.5rem;letter-spacing:.5px}
  h1 span{color:var(--gold)}
  .panel{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .panel h2{margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tot{border-radius:12px;padding:12px;text-align:center;color:#fff}
  .tot.nous{background:var(--nous)} .tot.eux{background:var(--eux)}
  .tot .lbl{font-size:.85rem;opacity:.9;text-transform:uppercase;letter-spacing:1px}
  .tot .val{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
  .team-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .pts{border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center}
  .pts .lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .pts .val{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
  .slider-row{display:flex;align-items:center;gap:8px}
  input[type=range]{flex:1;accent-color:var(--nous);height:28px}
  input[type=number]{width:74px;font-size:1.1rem;padding:6px;border:2px solid var(--line);border-radius:8px;text-align:center}
  .step{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:1.2rem;font-weight:700;cursor:pointer}
  .grid{display:grid;gap:8px}
  .contrats{grid-template-columns:repeat(3,1fr)}
  .mults{grid-template-columns:repeat(3,1fr)}
  .opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;font-size:1rem;font-weight:700;cursor:pointer;color:var(--ink)}
  .opt small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px}
  .opt.sel{border-color:var(--ink);background:var(--ink);color:#fff}
  .opt.sel small{color:#ddd}
  .opt.capot{grid-column:span 3}
  .team-pick .opt.sel.n{background:var(--nous);border-color:var(--nous)}
  .team-pick .opt.sel.e{background:var(--eux);border-color:var(--eux)}
  .preview{margin-top:12px;padding:10px;border-radius:10px;background:#f3eee2;font-size:.92rem;line-height:1.4}
  .preview b{font-variant-numeric:tabular-nums}
  .actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
  .btn{border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:800;cursor:pointer}
  .btn.go{background:var(--gold);color:#1d1d1b}
  .btn.go:disabled{opacity:.4;cursor:not-allowed}
  .btn.sec{background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
  th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase}
  td.win{color:#1a7f37;font-weight:700} td.lose{color:var(--red);font-weight:700}
  .empty{color:var(--muted);text-align:center;font-size:.9rem;padding:8px}
  .row-btns{display:flex;gap:8px;margin-top:10px}
  .row-btns .btn{flex:1;padding:10px;font-size:.9rem}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal .panel{max-width:320px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>♠ Belote <span>Coinchée</span> ♥</h1>

  <div class="panel">
    <div class="totals">
      <div class="tot nous"><div class="lbl">Nous</div><div class="val" id="totNous">0</div></div>
      <div class="tot eux"><div class="lbl">Eux</div><div class="val" id="totEux">0</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Qui a pris ?</h2>
    <div class="team-pick">
      <button class="opt n sel" data-team="nous">Nous</button>
      <button class="opt e" data-team="eux">Eux</button>
    </div>
  </div>

  <div class="panel">
    <h2>Points de la donne</h2>
    <div class="split">
      <div class="pts"><div class="lbl">Preneur</div><div class="val" id="ptsPreneur">81</div></div>
      <div class="pts"><div class="lbl">Adversaire</div><div class="val" id="ptsAdv">81</div></div>
    </div>
    <div class="slider-row">
      <button class="step" data-d="-1">−</button>
      <input type="range" id="range" min="0" max="162" value="81">
      <button class="step" data-d="1">+</button>
      <input type="number" id="num" min="0" max="162" value="81">
    </div>
  </div>

  <div class="panel">
    <h2>Contrat</h2>
    <div class="grid contrats" id="contrats"></div>
  </div>

  <div class="panel">
    <h2>Coinche</h2>
    <div class="grid mults" id="mults">
      <button class="opt sel" data-m="1">Pas coinché<small>× 1</small></button>
      <button class="opt" data-m="2">Coinché<small>× 2</small></button>
      <button class="opt" data-m="4">Surcoinché<small>× 4</small></button>
    </div>
    <div class="preview" id="preview">Choisis un contrat.</div>
  </div>

  <div class="actions">
    <button class="btn go" id="valider" disabled>Valider</button>
    <button class="btn sec" id="annuler">Annuler dernière</button>
  </div>

  <div class="panel">
    <h2>Historique</h2>
    <div id="histo"></div>
    <div class="row-btns"><button class="btn sec" id="reset">Nouvelle partie</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <p style="margin-top:0;font-weight:700">Remettre les scores à zéro ?</p>
    <div class="row-btns">
      <button class="btn sec" id="noReset">Non</button>
      <button class="btn go" id="yesReset">Oui</button>
    </div>
  </div>
</div>

<script>
const CONTRATS = [80,90,100,110,120,130,140,160,162];
const CAPOT_VALEUR = 252;
const MULT_LABEL = {1:"", 2:"coinché", 4:"surcoinché"};

const state = { preneur:"nous", points:81, contrat:null, mult:1, mains:[] };

const $ = id => document.getElementById(id);
const valeurContrat = c => c === 162 ? CAPOT_VALEUR : c;
const nomContrat = c => c === 162 ? "Capot" : String(c);

function calcul(points, contrat, mult){
  const v = valeurContrat(contrat);
  const adv = 162 - points;
  if (points >= contrat){
    return { gagne:true, preneur: v*mult + points, adversaire: mult === 1 ? adv : 0 };
  }
  return { gagne:false, preneur:0, adversaire: 160 + v*mult };
}

// --- Contrats
const cBox = $("contrats");
CONTRATS.forEach(c=>{
  const b = document.createElement("button");
  b.className = "opt" + (c===162 ? " capot" : "");
  b.dataset.c = c;
  b.innerHTML = c===162 ? `Capot<small>162 pts · compte ${CAPOT_VALEUR}</small>` : c;
  b.onclick = ()=>{ state.contrat = c; if(c===162) setPoints(162); render(); };
  cBox.appendChild(b);
});

document.querySelectorAll("#mults .opt").forEach(b=>b.onclick=()=>{state.mult=+b.dataset.m;render();});
document.querySelectorAll(".team-pick .opt").forEach(b=>b.onclick=()=>{state.preneur=b.dataset.team;render();});

function setPoints(v){
  v = Math.max(0, Math.min(162, Math.round(+v || 0)));
  state.points = v; render();
}
$("range").oninput = e=>setPoints(e.target.value);
$("num").oninput = e=>{ if(e.target.value!=="") setPoints(e.target.value); };
$("num").onblur = e=>setPoints(e.target.value);
document.querySelectorAll(".step").forEach(b=>b.onclick=()=>setPoints(state.points + +b.dataset.d));

$("valider").onclick = ()=>{
  if(state.contrat===null) return;
  const r = calcul(state.points, state.contrat, state.mult);
  const nous = state.preneur==="nous" ? r.preneur : r.adversaire;
  const eux  = state.preneur==="nous" ? r.adversaire : r.preneur;
  state.mains.push({preneur:state.preneur, points:state.points, contrat:state.contrat, mult:state.mult, gagne:r.gagne, nous, eux});
  state.contrat = null; state.mult = 1; state.points = 81;
  save(); render();
};
$("annuler").onclick = ()=>{ state.mains.pop(); save(); render(); };
$("reset").onclick = ()=>$("modal").classList.add("show");
$("noReset").onclick = ()=>$("modal").classList.remove("show");
$("yesReset").onclick = ()=>{ state.mains=[]; save(); $("modal").classList.remove("show"); render(); };

function save(){ try{ localStorage.setItem("belote-coinchee", JSON.stringify(state.mains)); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem("belote-coinchee")); if(Array.isArray(d)) state.mains=d; }catch(e){} }

function render(){
  $("ptsPreneur").textContent = state.points;
  $("ptsAdv").textContent = 162 - state.points;
  $("range").value = state.points;
  if(document.activeElement !== $("num")) $("num").value = state.points;
  $("range").style.accentColor = state.preneur==="nous" ? "var(--nous)" : "var(--eux)";

  document.querySelectorAll(".team-pick .opt").forEach(b=>b.classList.toggle("sel", b.dataset.team===state.preneur));
  document.querySelectorAll("#contrats .opt").forEach(b=>b.classList.toggle("sel", +b.dataset.c===state.contrat));
  document.querySelectorAll("#mults .opt").forEach(b=>b.classList.toggle("sel", +b.dataset.m===state.mult));

  const pv = $("preview");
  if(state.contrat===null){ pv.textContent = "Choisis un contrat."; $("valider").disabled = true; }
  else{
    const r = calcul(state.points, state.contrat, state.mult);
    const pNom = state.preneur==="nous" ? "Nous" : "Eux";
    const aNom = state.preneur==="nous" ? "Eux" : "Nous";
    pv.innerHTML = (r.gagne ? "✅ Contrat <b>réussi</b>" : "❌ Contrat <b>chuté</b>") +
      ` (${nomContrat(state.contrat)}${state.mult>1?" "+MULT_LABEL[state.mult]:""})<br>` +
      `${pNom} (preneur) : <b>+${r.preneur}</b> · ${aNom} : <b>+${r.adversaire}</b>`;
    $("valider").disabled = false;
  }

  let tn=0, te=0; state.mains.forEach(m=>{tn+=m.nous; te+=m.eux;});
  $("totNous").textContent = tn; $("totEux").textContent = te;
  $("annuler").disabled = state.mains.length===0;

  const h = $("histo");
  if(!state.mains.length){ h.innerHTML = '<div class="empty">Aucune donne jouée.</div>'; return; }
  let html = '<table><tr><th>#</th><th>Preneur</th><th>Contrat</th><th>Pts</th><th>Nous</th><th>Eux</th></tr>';
  state.mains.forEach((m,i)=>{
    html += `<tr><td>${i+1}</td><td>${m.preneur==="nous"?"Nous":"Eux"}</td>
      <td class="${m.gagne?"win":"lose"}">${nomContrat(m.contrat)}${m.mult>1?" ×"+m.mult:""}</td>
      <td>${m.points}</td><td>+${m.nous}</td><td>+${m.eux}</td></tr>`;
  });
  h.innerHTML = html + "</table>";
}

load(); render();
</script>
</body>
</html>
